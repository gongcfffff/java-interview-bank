een;gap:12px;flex-wrap:wrap;margin:16px 0 5px}.study-actions button{border:1px solid #d7e2f1;background:#fff;border-radius:10px;padding:10px 13px;color:#35557c;font-size:12px}.study-actions button:hover{background:#edf4ff}.study-actions button.affirm{background:#2369bb;color:#fff;border-color:#2369bb;font-weight:750}.study-actions button.affirm.done{background:#178267;border-color:#178267}\n.study-note{font-size:11px;color:#8797ab;margin:12px 0}.study-source{display:inline-block;color:#2e6dbb;font-size:11px;margin-bottom:10px}\n.study-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}\n@media(max-width:800px){.study-overlay{padding:0}.study-sheet{width:100%;height:100vh;border-radius:0}.study-layout{grid-template-columns:1fr}.study-rail{display:none}.study-article{padding:19px 15px 28px}.study-top{padding:13px 15px}.study-article h2{font-size:22px}.study-panel{padding:16px}.study-summary{margin:10px 0}.study-toptools button:not(.close-study){display:none}.mobile-jump{display:block;max-width:150px}}\n\n.workspace { align-items:start }\n.map-panel { min-height:0 }\n.toolbar #mapInfo { color:#52647d; font-size:11px }\n.viewport { flex:none; min-height:0; height:clamp(490px,66vh,670px) }\n.viewport svg { position:absolute; inset:0 }\n.catnav button.active { background:#eaf1ff; border-color:#adc8f3; color:#295bac }\n.svg-catdesc,.svg-count { fill:#586d86 }\n.svg-node:focus-visible { outline:none }\n.svg-node:focus-visible .nodebox { stroke:#1c4b9c; stroke-width:3 }\n.detail .section-cap { margin:0 0 7px }\n.edge-detail { background:#fff7eb; border-color:#f0d5ab }\n.detail-questions { display:grid; gap:5px; max-height:240px; overflow:auto }\n.related-btn small { color:#576e87 }\n.case-link { border:0; padding:6px 0 0; color:#285da9; background:transparent; font-size:12px }\n.case-link:hover { text-decoration:underline }\n.hub-actions { display:flex; gap:14px; align-items:center; flex-wrap:wrap }\n.hub-actions .primary-study { background:#285da9; color:white; border-color:#285da9 }\n.progress-caption { margin-top:4px; font-size:11px; color:#526984 }\n.main-chip { border-color:#bad3f7; background:#f0f6ff }\n.study-article:focus { outline:none }\n.study-actions button:disabled { opacity:.55; cursor:default }\n#graphArea,#questionIndex { scroll-margin-top:12px }\n@media(max-width:720px) {\n  .viewport { height:clamp(400px,63vh,530px); min-height:0 }\n  .graph-legend { display:none }\n  .route-btn { padding:8px }\n}\n@media(prefers-reduced-motion:reduce) {\n  *,*::before,*::after { transition:none!important }\n}\n\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"shell\" id=\"shell\">\n  \u003cheader class=\"hero\">\n    \u003cdiv class=\"eyebrow\">JAVA 基础 · 交互知识图谱\u003c/div>\n    \u003ch1>Java 基础知识关系图与 79 题答案库\u003c/h1>\n    \u003cp>从一段 Java 代码如何执行出发，串起类型、对象、框架与网络 I/O。点关系线读原因，点知识节点打开对应题解。\u003c/p>\n    \u003cdiv class=\"hero-bottom\">\n      \u003cdiv class=\"metric\">\u003cstrong id=\"nodeStat\">—\u003c/strong> 个知识节点\u003c/div>\n      \u003cdiv class=\"metric\">\u003cstrong id=\"edgeStat\">—\u003c/strong> 条解释型关联\u003c/div>\n      \u003cdiv class=\"metric\">\u003cstrong>79 / 79\u003c/strong> 原章题目覆盖\u003c/div>\n      \u003ca class=\"source\" href=\"https://xiaolincoding.com/interview/java.html#概念\" target=\"_blank\" rel=\"noopener\">小林 coding · Java 基础原章 ↗\u003c/a>\n    \u003c/div>\n    \u003cdiv class=\"hero-actions\">\n      \u003cbutton id=\"heroOpenBtn\" class=\"primary-study\">开始读完整答案\u003c/button>\n      \u003cbutton id=\"heroGraphBtn\" class=\"ghost-study\">探索知识关系图 ↓\u003c/button>\n      \u003cbutton id=\"heroBrowseBtn\" class=\"ghost-study\">按目录找题 ↓\u003c/button>\n    \u003c/div>\n  \u003c/header>\n\n  \u003csection class=\"connection\" aria-labelledby=\"exampleTitle\">\n    \u003cdiv class=\"connhead\">\u003cspan class=\"pill\">跨小节例子\u003c/span>\u003ch2 id=\"exampleTitle\">一个引用，为什么会连到深拷贝和序列化？\u003c/h2>\u003c/div>\n    \u003cdiv class=\"connrow\">\n      \u003cdiv class=\"conncard\">\n        \u003ch3>01 · 调用方法时复制引用值\u003c/h3>\n        \u003cdiv class=\"tagrow\">\u003cspan class=\"tinytag\">值传递\u003c/span>\u003cspan class=\"tinytag\">共享对象\u003c/span>\u003c/div>\n        \u003cp>参数拿到订单引用的副本。方法里给参数重新赋值，不会改变调用方的变量。修改同一个订单的状态则对双方可见。\u003c/p>\n        \u003cbutton class=\"case-link\" data-openq=\"9\">看第 10 题 →\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"conncard shared\">\n        \u003ch3>02 · 浅拷贝也会保留这份共享\u003c/h3>\n        \u003cdiv class=\"tagrow\">\u003cspan class=\"tinytag\">引用字段\u003c/span>\u003cspan class=\"tinytag\">对象图\u003c/span>\u003c/div>\n        \u003cp>复制订单外壳后，两个订单仍可能共用明细列表。深拷贝要决定哪些可变节点也要复制，以及是否保留图内的共享关系。\u003c/p>\n        \u003cbutton class=\"case-link\" data-openq=\"37\">看第 38 题 →\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"conncard\">\n        \u003ch3>03 · 跨 JVM 时按协议重建\u003c/h3>\n        \u003cdiv class=\"tagrow\">\u003cspan class=\"tinytag\">序列化\u003c/span>\u003cspan class=\"tinytag\">消息边界\u003c/span>\u003c/div>\n        \u003cp>发送端编码订单的状态，接收端在自己的堆里创建对象。若协议支持图内引用，可以重建共享关系。\u003c/p>\n        \u003cbutton class=\"case-link\" data-openq=\"65\">看第 66 题 →\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"study-summary\" aria-label=\"答案库入口\">\n    \u003cdiv>\u003cstrong>16 个小节 · 79 道完整题解\u003c/strong>\u003cp>每题包含面试口述、原理、具体例子、易错点和关联追问。\u003c/p>\u003c/div>\n    \u003cdiv class=\"hub-actions\">\n      \u003cdiv>\u003cdiv class=\"progressline\">\u003cspan id=\"hubProgressFill\">\u003c/span>\u003c/div>\u003cdiv id=\"hubProgressText\" class=\"progress-caption\">已学 0 / 79\u003c/div>\u003c/div>\n      \u003cbutton class=\"primary-study\" id=\"hubOpenBtn\">进入答案库\u003c/button>\n    \u003c/div>\n  \u003c/section>\n\n  \u003cdiv class=\"workspace\" id=\"graphArea\">\n    \u003caside class=\"panel sidebar\" aria-label=\"学习路径\">\n      \u003cdiv>\u003ch2 class=\"section-cap\">按问题探索\u003c/h2>\u003cdiv class=\"routes\" id=\"routes\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"graph-legend\">\n        \u003ch2 class=\"section-cap\">关系线图例\u003c/h2>\n        \u003cdiv class=\"legendrow\">\u003cspan class=\"legline\" style=\"border-color:#547aab\">\u003c/span>基础依赖\u003c/div>\n        \u003cdiv class=\"legendrow\">\u003cspan class=\"legline\" style=\"border-color:#527796\">\u003c/span>实现关系\u003c/div>\n        \u003cdiv class=\"legendrow\">\u003cspan class=\"legline shared\">\u003c/span>共享原理\u003c/div>\n        \u003cdiv class=\"legendrow\">\u003cspan class=\"legline deep\">\u003c/span>深入追问\u003c/div>\n        \u003cdiv class=\"legendrow\">\u003cspan class=\"legline contrast\">\u003c/span>对比区别\u003c/div>\n        \u003cdiv class=\"legendrow\">\u003cspan class=\"legline apply\">\u003c/span>工程应用\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"help\">选择左侧的问题链，或用图上方的分类聚焦。点节点看相关题解，点关系线看两个知识点怎么连起来。\u003c/div>\n    \u003c/aside>\n    \u003cmain class=\"panel map-panel\" aria-label=\"知识关系图\">\n      \u003cdiv class=\"toolbar\">\n        \u003cstrong>知识关系图\u003c/strong>\n        \u003cbutton class=\"toolbtn\" id=\"expandBtn\">＋ 展开全部知识点\u003c/button>\n        \u003cbutton class=\"toolbtn\" id=\"resetBtn\">回到概览\u003c/button>\n        \u003cspan id=\"mapInfo\">全章概览\u003c/span>\n        \u003cdiv class=\"map-zoom\" role=\"group\" aria-label=\"图谱缩放\">\n          \u003cspan>缩放\u003c/span>\n          \u003cbutton type=\"button\" id=\"zoomOut\" title=\"缩小\" aria-label=\"缩小\">−\u003c/button>\n          \u003cbutton type=\"button\" id=\"zoomIn\" title=\"放大\" aria-label=\"放大\">+\u003c/button>\n          \u003cbutton type=\"button\" id=\"fitBtn\">适应视图\u003c/button>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"catnav\" id=\"catnav\" aria-label=\"知识分类\">\u003c/div>\n      \u003cdiv class=\"viewport\">\u003csvg id=\"map\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Java 基础知识关系图\">\u003c/svg>\u003c/div>\n      \u003cdiv class=\"map-footer\">\u003cspan id=\"shownStat\">—\u003c/span>\u003cspan>拖动画布平移 · 用按钮缩放 · 滚轮滚动页面\u003c/span>\u003c/div>\n    \u003c/main>\n    \u003caside class=\"panel detail\" id=\"detail\" aria-label=\"节点详情\">\u003c/aside>\n  \u003c/div>\n\n  \u003csection class=\"questions\" id=\"questionIndex\" aria-labelledby=\"indexTitle\">\n    \u003cdiv class=\"questions-header\">\n      \u003cdiv>\u003ch2 id=\"indexTitle\">原章题目索引 \u003cspan class=\"qcount\" id=\"indexCount\">\u003c/span>\u003c/h2>\n        \u003cp>沿用原章顺序。搜索可匹配题干、答案与代码中的关键词。\u003c/p>\u003c/div>\n      \u003cinput class=\"qsearch\" type=\"search\" id=\"qsearch\" placeholder=\"搜索 BigDecimal、注解、Selector…\" aria-label=\"搜索原章问题\">\n    \u003c/div>\n    \u003cdiv class=\"qgroups\" id=\"qgroups\">\u003c/div>\n  \u003c/section>\n  \u003cfooter class=\"footer\">\n    \u003cspan>题目按 \u003ca href=\"https://xiaolincoding.com/interview/java.html\" target=\"_blank\" rel=\"noopener\">小林 coding · Java 基础\u003c/a> 的原章顺序编排。题解以 Java SE 21 为参照，涉及版本差异时单独说明。\u003c/span>\n    \u003cspan>\u003ca href=\"https://docs.oracle.com/javase/specs/jls/se21/html/index.html\" target=\"_blank\" rel=\"noopener\">JLS\u003c/a> ·\n      \u003ca href=\"https://docs.oracle.com/javase/specs/jvms/se21/html/index.html\" target=\"_blank\" rel=\"noopener\">JVMS\u003c/a> ·\n      \u003ca href=\"https://docs.oracle.com/en/java/javase/21/docs/api/index.html\" target=\"_blank\" rel=\"noopener\">Java SE 21 API\u003c/a>\u003c/span>\n    \u003cspan>离线单文件 HTML\u003c/span>\n  \u003c/footer>\n\u003c/div>\n\n\u003cdiv id=\"studyOverlay\" class=\"study-overlay\" hidden>\n  \u003cdiv class=\"study-sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"studyTitle\">\n    \u003cdiv class=\"study-top\">\n      \u003cdiv>\u003csmall>JAVA 基础 · 逐题精讲\u003c/small>\u003ch2 id=\"studyTitle\">79 道完整面试题解\u003c/h2>\u003c/div>\n      \u003cdiv class=\"study-toptools\">\n        \u003cselect id=\"mobileJump\" class=\"mobile-jump\" aria-label=\"跳转到任意题\">\u003c/select>\n        \u003cbutton id=\"openMapFromStudy\">在关系图定位\u003c/button>\n        \u003cbutton class=\"close-study\" id=\"closeStudy\" aria-label=\"关闭答案\">×\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"study-layout\">\n      \u003caside class=\"study-rail\">\n        \u003cdiv class=\"study-progress\">\n          \u003cstrong id=\"studyProgressText\">学习进度 0 / 79\u003c/strong>\n          \u003cp>已学状态保存在当前浏览器。\u003c/p>\n          \u003cdiv class=\"progressline\">\u003cspan id=\"studyProgressFill\">\u003c/span>\u003c/div>\n          \u003cinput id=\"studyFilter\" type=\"search\" placeholder=\"搜索题目或答案关键词\" aria-label=\"搜索题目或答案关键词\" autocomplete=\"off\">\n        \u003c/div>\n        \u003cdiv id=\"studyRailNav\" class=\"study-rail-nav\">\u003c/div>\n      \u003c/aside>\n      \u003carticle id=\"studyArticle\" class=\"study-article\" tabindex=\"-1\">\u003c/article>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\n'use strict';\nconst DATA = {\"source\":\"https://xiaolincoding.com/interview/java.html\",\"chapters\":[\"概念\",\"数据类型\",\"面向对象\",\"关键字\",\"深拷贝和浅拷贝\",\"泛型\",\"对象\",\"反射\",\"注解\",\"异常\",\"Object 与字符串\",\"Java 新特性\",\"序列化\",\"设计模式\",\"I/O\",\"其他\"],\"cats\":[{\"id\":\"runtime\",\"label\":\"01 · 运行与平台\",\"color\":\"#3466b3\",\"desc\":\"从源码到 JVM，再到操作系统\"},{\"id\":\"types\",\"label\":\"02 · 类型与数值\",\"color\":\"#027b67\",\"desc\":\"复制什么，转换时保留什么\"},{\"id\":\"objects\",\"label\":\"03 · 对象与契约\",\"color\":\"#7054b8\",\"desc\":\"行为选择、身份与生命周期\"},{\"id\":\"metadata\",\"label\":\"04 · 元数据与异常\",\"color\":\"#a94670\",\"desc\":\"检查对象与管理失败路径\"},{\"id\":\"functional\",\"label\":\"05 · 行为与并发\",\"color\":\"#316c91\",\"desc\":\"行为参数、数据流与任务调度\"},{\"id\":\"engineering\",\"label\":\"06 · 设计与 I/O\",\"color\":\"#97591d\",\"desc\":\"模块协作与跨进程字节传输\"}],\"nodes\":[{\"id\":\"java\",\"cat\":\"runtime\",\"title\":\"Java 语言与生态\",\"sub\":\"类型、工具、标准库\",\"what\":\"语言规定程序的写法和语义。运行时、库和工具链各有职责，JIT、GC 和框架生态影响实际工程权衡。\",\"take\":\"分析 Java 的特点时要分别看语言、运行时和工程生态。\",\"core\":true},{\"id\":\"bytecode\",\"cat\":\"runtime\",\"title\":\"字节码与跨平台\",\"sub\":\"javac · class 文件\",\"what\":\"javac 生成符合 JVM 规范的类文件。兼容的 JVM 可以加载同一份字节码，平台差异主要由对应的运行时和库适配。\",\"take\":\"运行端要兼容 class 版本、标准 API 和应用所需的本地依赖。\",\"core\":true},{\"id\":\"vm\",\"cat\":\"runtime\",\"title\":\"JVM、JRE 与 JDK\",\"sub\":\"解释执行 · JIT · 工具链\",\"what\":\"JVM 定义字节码执行的抽象机器。运行环境还包括标准库等，开发工具包进一步提供 javac 和诊断等工具。\",\"take\":\"字节码编译和运行期机器码编译是两个阶段。\",\"core\":true},{\"id\":\"os\",\"cat\":\"runtime\",\"title\":\"进程与操作系统\",\"sub\":\"线程 · 系统调用 · 资源\",\"what\":\"JVM 作为进程运行在操作系统之上。内核提供调度、虚拟内存、文件、套接字和子进程等能力。\",\"take\":\"标准库的 Java API 可以隐藏平台差异，底层实现仍会与内核协作。\",\"core\":true},{\"id\":\"native\",\"cat\":\"runtime\",\"title\":\"native 与 JNI\",\"sub\":\"平台库 · 本地边界\",\"what\":\"native 声明的方法由本地代码实现。JNI 定义 Java 与本地代码在方法调用、对象访问和异常处理上的接口。\",\"take\":\"JNI 可用来复用本地库，也带来架构兼容和资源管理成本。\",\"core\":false},{\"id\":\"value\",\"cat\":\"types\",\"title\":\"引用与值传递\",\"sub\":\"复制值 · 共享对象\",\"what\":\"形参获得实参值的副本。引用参数复制的是引用值，因此两边可以访问同一个对象，而形参重新赋值仅影响自己。\",\"take\":\"分开问两件事：变量的值变了，还是两边可见的对象状态变了？\",\"core\":true},{\"id\":\"primitive\",\"cat\":\"types\",\"title\":\"基本类型与位宽\",\"sub\":\"8 种类型 · 补码\",\"what\":\"Java 整数类型和浮点类型的值域有明确规定，boolean 是逻辑类型，char 是 UTF-16 代码单元。\",\"take\":\"int 为 32 位，long 为 64 位，平台位数不改变 Java 的类型定义。\",\"core\":true},{\"id\":\"conversion\",\"cat\":\"types\",\"title\":\"转换与数值溢出\",\"sub\":\"扩宽 · 窄化 · 运算提升\",\"what\":\"转换可能改变位宽、精度或数值。运算先按操作数的类型求值，赋值给更宽的类型不会重新计算。\",\"take\":\"在运算之前决定精度，边界输入要用可检查的转换。\",\"core\":false},{\"id\":\"decimal\",\"cat\":\"types\",\"title\":\"BigDecimal 与精度\",\"sub\":\"十进制 · scale · 舍入\",\"what\":\"BigDecimal 用整数和小数位数表示十进制值，适合需要明确舍入和对账的业务。\",\"take\":\"从十进制文本构造，并为除法和金额格式明确舍入规则。\",\"core\":true},{\"id\":\"boxing\",\"cat\":\"types\",\"title\":\"装箱与包装类\",\"sub\":\"Integer · null · 泛型\",\"what\":\"装箱把原始值转换为包装类引用。拆箱将包装对象还原为原始值。包装类型可用作泛型类型实参。\",\"take\":\"装箱会引入对象身份和 null 两种新的语义。\",\"core\":true},{\"id\":\"intcache\",\"cat\":\"types\",\"title\":\"Integer 缓存\",\"sub\":\"valueOf · 身份复用\",\"what\":\"小整数可能通过缓存复用包装对象。valueOf 的保证范围和语言对常量装箱身份的保证要分别理解。\",\"take\":\"Integer 的值比较用 equals 或显式处理空值后比较原始值。\",\"core\":false},{\"id\":\"generic\",\"cat\":\"types\",\"title\":\"泛型与擦除\",\"sub\":\"类型参数 · 通配符\",\"what\":\"泛型让容器和算法声明类型关系，编译器检查类型使用，并按擦除规则生成可运行代码。\",\"take\":\"List\\u003cInteger> 与 List\\u003cNumber> 没有直接子类型关系，读写方差用通配符表达。\",\"core\":false},{\"id\":\"oop\",\"cat\":\"objects\",\"title\":\"封装、继承与多态\",\"sub\":\"对象边界 · 可替换行为\",\"what\":\"封装维护对象不变量，继承建立类型层级，多态让客户端以统一契约调用不同实现。\",\"take\":\"让业务调用方依赖能保持行为约定的接口。\",\"core\":true},{\"id\":\"dispatch\",\"cat\":\"objects\",\"title\":\"实例方法重写\",\"sub\":\"动态分派 · 真实类型\",\"what\":\"调用处先确定方法签名。普通可重写实例方法在运行时按接收对象的真实类型选择具体实现。\",\"take\":\"字段和静态方法没有同样的动态分派。\",\"core\":false},{\"id\":\"overload\",\"cat\":\"objects\",\"title\":\"方法重载\",\"sub\":\"静态类型 · 候选选择\",\"what\":\"同名方法可有不同参数列表。编译器在固定的调用点确定最适用方法，再处理可能的实例方法动态分派。\",\"take\":\"重载先决定调用哪个签名，重写再决定运行哪个实现。\",\"core\":false},{\"id\":\"abstract\",\"cat\":\"objects\",\"title\":\"抽象类\",\"sub\":\"共享状态 · 构造约束\",\"what\":\"抽象类可持有实例字段、构造器和具体方法，也可把部分行为留给子类实现。\",\"take\":\"子类构造会经过抽象父类的构造过程。\",\"core\":false},{\"id\":\"iface\",\"cat\":\"objects\",\"title\":\"接口与设计原则\",\"sub\":\"公共契约 · 组合\",\"what\":\"接口表达一类可被替换的行为，可以多实现。默认、静态和私有方法有各自的版本历史和使用规则。\",\"take\":\"接口可定义能力边界，并通过小而稳定的契约降低耦合。\",\"core\":true},{\"id\":\"modifiers\",\"cat\":\"objects\",\"title\":\"static 与 final\",\"sub\":\"归属 · 继承 · 赋值\",\"what\":\"static 改变成员归属或嵌套类的外部实例关系。final 分别约束变量再次赋值、方法重写和类继承。\",\"take\":\"final 引用仍可以指向可变对象。\",\"core\":false},{\"id\":\"nested\",\"cat\":\"objects\",\"title\":\"嵌套类与外部实例\",\"sub\":\"Outer.this · nestmates\",\"what\":\"非静态成员内部类依附于外部实例。静态嵌套类没有隐式外部实例。JDK 11 支持基于 nest 的访问控制。\",\"take\":\"外部实例引用与访问 private 成员的权限是两个机制。\",\"core\":false},{\"id\":\"creation\",\"cat\":\"objects\",\"title\":\"创建对象与可达性\",\"sub\":\"构造 · 克隆 · GC Roots\",\"what\":\"构造调用、克隆和反序列化有不同的初始化过程。对象生命周期取决于可达性和收集器运行时机。\",\"take\":\"超出局部作用域的对象仍可被字段、集合或其他活跃引用保留。\",\"core\":false},{\"id\":\"copy\",\"cat\":\"objects\",\"title\":\"对象图与深浅拷贝\",\"sub\":\"共享子对象 · 环\",\"what\":\"浅拷贝复制当前对象的字段值，引用字段仍指向原目标。深拷贝依据需求复制可变子图，必要时保留图内别名和环。\",\"take\":\"先定义复制边界，再决定要保留哪些共享引用。\",\"core\":false},{\"id\":\"contract\",\"cat\":\"objects\",\"title\":\"Object 与相等契约\",\"sub\":\"== · equals · hashCode\",\"what\":\"引用身份、业务相等与哈希分桶分别解决不同问题。equals 相等的对象必须有相同的 hashCode。\",\"take\":\"哈希容器中影响 equals 和 hashCode 的字段应保持稳定。\",\"core\":true},{\"id\":\"strings\",\"cat\":\"objects\",\"title\":\"String 与字符构建\",\"sub\":\"不可变 · Builder · Buffer\",\"what\":\"String 是不可变字符序列。StringBuilder 和 StringBuffer 支持原地追加，后者为单个操作提供同步。\",\"take\":\"固定表达式拼接和循环反复拼接的成本不同。\",\"core\":false},{\"id\":\"reflection\",\"cat\":\"metadata\",\"title\":\"Class 与反射\",\"sub\":\"构造 · 字段 · 方法\",\"what\":\"Class 表示运行时类型。反射通过类元数据取得成员并在权限允许时访问或调用。\",\"take\":\"反射是运行时机制，仍要尊重访问边界。\",\"core\":true},{\"id\":\"modules\",\"cat\":\"metadata\",\"title\":\"私有成员与模块\",\"sub\":\"trySetAccessible · opens\",\"what\":\"模块系统区分面向普通访问的 exports 和面向深反射的 opens。私有成员能否访问还受模块和成员访问条件约束。\",\"take\":\"反射库应明确目标包的开放范围，避免依赖 JDK 内部成员。\",\"core\":false},{\"id\":\"annotation\",\"cat\":\"metadata\",\"title\":\"注解与处理器\",\"sub\":\"编译期 · 类文件 · 运行期\",\"what\":\"注解记录结构化元数据。编译器、字节码工具或框架按各自时点读取并决定是否生成代码或建立运行时行为。\",\"take\":\"行为来自消费者，注解本身负责表达信息。\",\"core\":true},{\"id\":\"retention\",\"cat\":\"metadata\",\"title\":\"注解的作用域\",\"sub\":\"Target · Retention · Inherited\",\"what\":\"Target 约束可以写在哪里，Retention 决定能保留到哪个阶段。Inherited 影响特定的类继承查询。\",\"take\":\"可以标在哪里、何时能读到、是否继承，要分开回答。\",\"core\":false},{\"id\":\"exceptions\",\"cat\":\"metadata\",\"title\":\"异常类型与传播\",\"sub\":\"Throwable · throw · throws\",\"what\":\"异常发生后按调用栈和匹配规则查找处理器。受检异常受编译期捕获或声明约束。\",\"take\":\"throw 触发抛出，throws 描述方法可能向外传播的异常。\",\"core\":true},{\"id\":\"flow\",\"cat\":\"metadata\",\"title\":\"try/catch/finally\",\"sub\":\"正常与突然完成\",\"what\":\"return、throw 和 finally 有明确的完成规则。finally 若以新的 return 或 throw 结束，可以替换原来的完成原因。\",\"take\":\"把清理留给 finally 或资源语法，避免用 finally 改写返回值。\",\"core\":false},{\"id\":\"resources\",\"cat\":\"metadata\",\"title\":\"资源关闭与抑制异常\",\"sub\":\"AutoCloseable · suppressed\",\"what\":\"try-with-resources 逆序关闭资源。业务异常和关闭异常同时出现时，通常保留前者并附上 suppressed 异常。\",\"take\":\"对象内存的回收时机不等于文件、套接字的关闭时机。\",\"core\":false},{\"id\":\"lambda\",\"cat\":\"functional\",\"title\":\"函数式接口与 Lambda\",\"sub\":\"行为作为参数 · 方法引用\",\"what\":\"Lambda 在目标类型的约束下提供函数式接口实现。调用方可以把谓词、转换或排序行为传给通用流程。\",\"take\":\"局部变量捕获要求 final 或 effectively final。\",\"core\":true},{\"id\":\"stream\",\"cat\":\"functional\",\"title\":\"Stream 流水线\",\"sub\":\"中间操作 · 终止操作\",\"what\":\"Stream 将集合等源上的遍历表达成延迟执行的操作链，终止操作触发求值并消费该流。\",\"take\":\"可用 map、filter 和 collect 描述转换，避免在流水线上承载必要副作用。\",\"core\":true},{\"id\":\"parallel\",\"cat\":\"functional\",\"title\":\"并行 Stream\",\"sub\":\"Spliterator · 归约\",\"what\":\"并行流把源切分到多个任务，最终合并部分结果。收益取决于拆分、计算粒度和合并成本。\",\"take\":\"归约依赖结合性，避免共享可变容器或阻塞公共执行资源。\",\"core\":false},{\"id\":\"future\",\"cat\":\"functional\",\"title\":\"CompletableFuture\",\"sub\":\"阶段依赖 · 异常恢复\",\"what\":\"Future 可表达单个异步结果，CompletableFuture 还可串接、并发合并和处理阶段失败。\",\"take\":\"依赖已有结果用 thenCompose，合并独立结果用 thenCombine。\",\"core\":true},{\"id\":\"modern\",\"cat\":\"functional\",\"title\":\"Java 8 与 Java 21\",\"sub\":\"正式特性 · 预览特性\",\"what\":\"Java 8 带来 Lambda 和 Stream 等能力。Java 21 包括正式的虚拟线程和模式匹配特性，也有需要显式启用的预览能力。\",\"take\":\"在面试和代码中注明特性引入版本与正式状态。\",\"core\":false},{\"id\":\"virtual\",\"cat\":\"functional\",\"title\":\"虚拟线程\",\"sub\":\"每任务一线程 · I/O 等待\",\"what\":\"Java 21 的虚拟线程由 JVM 调度到载体线程，许多阻塞操作可以让出载体，适合大量等待任务。\",\"take\":\"降低等待任务的线程成本，同时仍需约束下游并发。\",\"core\":false},{\"id\":\"comparator\",\"cat\":\"functional\",\"title\":\"多字段排序\",\"sub\":\"主键 · 次键 · 比较器\",\"what\":\"Comparator 把排序顺序作为行为传入算法。thenComparing 只在主比较结果为 0 时调用次比较。\",\"take\":\"只想反转主键，就在连接次比较之前调用 reversed。\",\"core\":false},{\"id\":\"serialization\",\"cat\":\"engineering\",\"title\":\"序列化与对象图\",\"sub\":\"DTO · schema · 兼容性\",\"what\":\"序列化把选定的对象状态变成可传输数据。反序列化按协议重建对象，也可按协议恢复图内引用关系。\",\"take\":\"跨 JVM 传输的是状态，接收端创建自己进程中的对象。\",\"core\":true},{\"id\":\"framing\",\"cat\":\"engineering\",\"title\":\"二进制编码与帧\",\"sub\":\"UTF-8 · 长度 · 边界\",\"what\":\"端序、长度和字符编码定义字节含义。帧边界将 TCP 的连续字节拆成应用消息。\",\"take\":\"先校验长度再分配，支持分多次读写一条消息。\",\"core\":false},{\"id\":\"dcl\",\"cat\":\"engineering\",\"title\":\"单例与安全发布\",\"sub\":\"volatile · synchronized\",\"what\":\"双重检查锁定将互斥初始化和可见性结合。第二次检查防止重复构造，volatile 保证安全发布。\",\"take\":\"对象发布安全和对象内部状态的并发访问是不同问题。\",\"core\":false},{\"id\":\"proxy\",\"cat\":\"engineering\",\"title\":\"代理与适配器\",\"sub\":\"访问控制 · 接口转换\",\"what\":\"代理通常沿用目标契约，改变访问方式。适配器将已有服务转换成调用方需要的契约。\",\"take\":\"看想解决的是访问过程还是契约兼容问题。\",\"core\":false},{\"id\":\"chain\",\"cat\":\"engineering\",\"title\":\"责任链\",\"sub\":\"有序处理 · 短路\",\"what\":\"责任链把多步处理分成可组合处理器，各环节可继续、修改上下文或提前结束。\",\"take\":\"处理器顺序和继续条件属于业务语义。\",\"core\":false},{\"id\":\"strategy\",\"cat\":\"engineering\",\"title\":\"策略模式\",\"sub\":\"相同任务 · 可替换算法\",\"what\":\"策略把算法置于稳定接口后，调用者按需求选择实现。简单行为可用 Lambda 表达。\",\"take\":\"在一次决策中选择策略，多个阶段的编排由链或流程完成。\",\"core\":false},{\"id\":\"blocking\",\"cat\":\"engineering\",\"title\":\"阻塞网络 I/O\",\"sub\":\"Socket · 线程等待\",\"what\":\"阻塞读写在完成、超时或失败前等待。平台线程和虚拟线程都能运行阻塞式代码，等待成本和实现不同。\",\"take\":\"管理超时和资源上限比单纯增加线程更重要。\",\"core\":false},{\"id\":\"selector\",\"cat\":\"engineering\",\"title\":\"NIO 与就绪通知\",\"sub\":\"Channel · Buffer · Selector\",\"what\":\"Selector 一次等待多个通道就绪，应用再对非阻塞通道执行实际读写。缓冲区状态随连接保存。\",\"take\":\"就绪之后仍要处理半包、短写、关闭和背压。\",\"core\":true},{\"id\":\"asyncio\",\"cat\":\"engineering\",\"title\":\"AIO 与完成通知\",\"sub\":\"提交操作 · 回调 · Future\",\"what\":\"异步通道提交操作后将完成结果交给回调或 Future，底层提供者可能使用不同机制。\",\"take\":\"就绪通知和完成通知描述不同的时间点。\",\"core\":false},{\"id\":\"netty\",\"cat\":\"engineering\",\"title\":\"Netty 的事件循环\",\"sub\":\"EventLoop · Pipeline · ByteBuf\",\"what\":\"Netty 将网络传输、通道事件和处理器封装起来。应用处理解码后的消息，并控制慢连接和阻塞任务。\",\"take\":\"事件循环要保持短小，长时间业务调用需与其隔离。\",\"core\":true}],\"edges\":[{\"a\":\"java\",\"b\":\"bytecode\",\"kind\":\"基础依赖\",\"why\":\"Java 语法和类型检查发生在编译端，javac 把可执行语义写入 class 文件。\"},{\"a\":\"bytecode\",\"b\":\"vm\",\"kind\":\"基础依赖\",\"why\":\"class 文件是编译器与 JVM 的契约。JVM 负责验证和执行兼容的类文件。\"},{\"a\":\"vm\",\"b\":\"os\",\"kind\":\"实现关系\",\"why\":\"JVM 进程使用操作系统提供的内存映射、线程调度和 I/O，解释器与 JIT 执行在用户态。\"},{\"a\":\"vm\",\"b\":\"native\",\"kind\":\"实现关系\",\"why\":\"JVM 为 Java 方法与本地库建立调用边界，并处 stract\",\"kind\":\"实现关系\",\"why\":\"抽象类把共有状态、构造规则和公共实现放在基类，部分行为留给子类。\"},{\"a\":\"abstract\",\"b\":\"iface\",\"kind\":\"对比区别\",\"why\":\"抽象类能维护共有实例状态，接口便于跨层级复用同一能力契约。\"},{\"a\":\"iface\",\"b\":\"dispatch\",\"kind\":\"实现关系\",\"why\":\"接口变量调用重写的实例方法时，JVM 根据实际对象选择实现。\"},{\"a\":\"modifiers\",\"b\":\"abstract\",\"kind\":\"对比区别\",\"why\":\"抽象类要允许子类完成实现，final 类禁止继承，因此不能同时声明。\"},{\"a\":\"modifiers\",\"b\":\"dispatch\",\"kind\":\"对比区别\",\"why\":\"static 方法可被隐藏，final 实例方法不能重写，二者均改变常规多态的适用范围。\"},{\"a\":\"modifiers\",\"b\":\"nested\",\"kind\":\"基础依赖\",\"why\":\"static 嵌套类没有隐式外部实例引用，成员内部类可以通过 Outer.this 访问外层对象。\"},{\"a\":\"nested\",\"b\":\"bytecode\",\"kind\":\"实现关系\",\"why\":\"编译器可生成承载外部实例的参数或字段。访问私有成员可借助 JDK 11 的 nest 元数据。\"},{\"a\":\"nested\",\"b\":\"dcl\",\"kind\":\"工程应用\",\"why\":\"静态持有者类可以利用类初始化的同步与延迟触发实现单例。\"},{\"a\":\"creation\",\"b\":\"copy\",\"kind\":\"实现关系\",\"why\":\"Object.clone 默认只做字段级复制，深拷贝还需按对象图决定如何处理可变引用。\"},{\"a\":\"creation\",\"b\":\"reflection\",\"kind\":\"工程应用\",\"why\":\"反射可用 Constructor.newInstance 调用已知签名的构造器，框架据此装配对象。\"},{\"a\":\"creation\",\"b\":\"serialization\",\"kind\":\"实现关系\",\"why\":\"反序列化也能重建实例，其初始化规则取决于协议和对象类型。\"},{\"a\":\"creation\",\"b\":\"resources\",\"kind\":\"对比区别\",\"why\":\"GC 回收不可达对象占用的内存，外部资源须按生命周期显式关闭。\"},{\"a\":\"copy\",\"b\":\"serialization\",\"kind\":\"共享原理\",\"why\":\"两者都可能遍历对象图并处理共享引用。复制关注新图边界，序列化还要定义字节协议。\"},{\"a\":\"reflection\",\"b\":\"modules\",\"kind\":\"基础依赖\",\"why\":\"能发现 private 成员与能调用它是两回事，深反射还要通过模块开放检查。\"},{\"a\":\"reflection\",\"b\":\"annotation\",\"kind\":\"工程应用\",\"why\":\"运行期框架可用反射查找注解，再据注解元数据决定对象装配或方法处理。\"},{\"a\":\"annotation\",\"b\":\"retention\",\"kind\":\"基础依赖\",\"why\":\"只有保留到运行期的注解能用常规反射读取，编译期处理器也可使用 SOURCE 注解。\"},{\"a\":\"retention\",\"b\":\"bytecode\",\"kind\":\"实现关系\",\"why\":\"CLASS 与 RUNTIME 可写入类文件，区分运行期可见属性；SOURCE 会在编译后被丢弃。\"},{\"a\":\"reflection\",\"b\":\"proxy\",\"kind\":\"工程应用\",\"why\":\"JDK 动态代理的 InvocationHandler 接收 Method 和实参，可据此转发或增强。\"},{\"a\":\"exceptions\",\"b\":\"flow\",\"kind\":\"基础依赖\",\"why\":\"throw 引起突然完成，catch 按类型匹配，finally 根据完成规则决定最终结果。\"},{\"a\":\"flow\",\"b\":\"resources\",\"kind\":\"实现关系\",\"why\":\"资源语法自动安排 close，保留主异常并挂上关闭失败，避免清理覆盖错误。\"},{\"a\":\"exceptions\",\"b\":\"future\",\"kind\":\"工程应用\",\"why\":\"异步阶段将失败记录为异常完成。join、handle 和 exceptionally 提供不同的观察或恢复入口。\"},{\"a\":\"iface\",\"b\":\"lambda\",\"kind\":\"基础依赖\",\"why\":\"函数式接口提供单一抽象方法作为 Lambda 的目标类型。\"},{\"a\":\"lambda\",\"b\":\"stream\",\"kind\":\"工程应用\",\"why\":\"filter 和 map 接收函数式接口，Lambda 将筛选与转换规则交给流水线执行。\"},{\"a\":\"lambda\",\"b\":\"future\",\"kind\":\"工程应用\",\"why\":\"Future 回调用 Supplier、Function、BiFunction 等描述任务或依赖结果的组合方式。\"},{\"a\":\"stream\",\"b\":\"parallel\",\"kind\":\"深入追问\",\"why\":\"同一条流水线可切换到并行模式，拆分和合并要求无干扰行为及正确归约。\"},{\"a\":\"parallel\",\"b\":\"future\",\"kind\":\"对比区别\",\"why\":\"并行流把一个数据集合分片归约，Future 组合显式定义多个任务的先后和汇合。\"},{\"a\":\"modern\",\"b\":\"lambda\",\"kind\":\"实现关系\",\"why\":\"Java 8 引入 Lambda 和方法引用，函数式接口让行为可以进入通用 API。\"},{\"a\":\"modern\",\"b\":\"virtual\",\"kind\":\"实现关系\",\"why\":\"虚拟线程在 Java 21 转为正式特性，提供适合大量等待任务的线程实现。\"},{\"a\":\"virtual\",\"b\":\"os\",\"kind\":\"实现关系\",\"why\":\"虚拟线程由 JVM 调度到载体平台线程，载体仍由操作系统调度。\"},{\"a\":\"virtual\",\"b\":\"blocking\",\"kind\":\"工程应用\",\"why\":\"大量阻塞等待可使用虚拟线程表达，以同步调用栈保留控制流，但仍需限制下游资源。\"},{\"a\":\"lambda\",\"b\":\"comparator\",\"kind\":\"工程应用\",\"why\":\"比较器是函数式接口，方法引用和 thenComparing 可以组合主次排序键。\"},{\"a\":\"contract\",\"b\":\"comparator\",\"kind\":\"对比区别\",\"why\":\"compare 返回 0 表示同一排序位置，排序集合还会据此判断键的等价性，未必与 equals 一致。\"},{\"a\":\"lambda\",\"b\":\"strategy\",\"kind\":\"工程应用\",\"why\":\"只有一个核心操作的策略可用函数式接口表达，调用方传入 Lambda 替换算法。\"},{\"a\":\"oop\",\"b\":\"strategy\",\"kind\":\"工程应用\",\"why\":\"策略把可替换行为放到接口后，体现组合和面向契约的多态。\"},{\"a\":\"strategy\",\"b\":\"chain\",\"kind\":\"对比区别\",\"why\":\"策略为当前任务选算法，责任链决定请求要经过哪些阶段、何时短路。\"},{\"a\":\"iface\",\"b\":\"proxy\",\"kind\":\"基础依赖\",\"why\":\"同契约代理能替换目标对象，适配器则负责满足另一个调用方契约。\"},{\"a\":\"flow\",\"b\":\"chain\",\"kind\":\"工程应用\",\"why\":\"链的环绕处理器可用 finally 清理或记录失败路径，同时保留原异常。\"},{\"a\":\"chain\",\"b\":\"netty\",\"kind\":\"共享原理\",\"why\":\"ChannelPipeline 也按顺序传播事件，处理器可决定消费或继续转发。\"},{\"a\":\"modifiers\",\"b\":\"dcl\",\"kind\":\"基础依赖\",\"why\":\"单例静态字段绑定到类；需要 volatile 保护无锁读取时的安全发布。\"},{\"a\":\"serialization\",\"b\":\"framing\",\"kind\":\"实现关系\",\"why\":\"序列化把字段变成字节，帧协议提供消息边界，供接收方在连续字节中定位每条记录。\"},{\"a\":\"strings\",\"b\":\"framing\",\"kind\":\"基础依赖\",\"why\":\"字符串长度按 UTF-16 代码单元计数，UTF-8 帧头要写编码后的真实字节数。\"},{\"a\":\"os\",\"b\":\"selector\",\"kind\":\"实现关系\",\"why\":\"Selector 由平台提供者映射到内核多路复用机制，应用据就绪状态安排读写。\"},{\"a\":\"blocking\",\"b\":\"selector\",\"kind\":\"对比区别\",\"why\":\"阻塞读取由调用线程等待结果，Selector 集中等待多个通道就绪，应用再读写。\"},{\"a\":\"selector\",\"b\":\"asyncio\",\"kind\":\"对比区别\",\"why\":\"Selector 提示何时可以尝试读写，异步通道返回已提交读写的完成结果。\"},{\"a\":\"selector\",\"b\":\"netty\",\"kind\":\"工程应用\",\"why\":\"Netty 的 NIO 传输把 Selector 和通道注册、就绪处理收进 EventLoop。\"},{\"a\":\"framing\",\"b\":\"netty\",\"kind\":\"工程应用\",\"why\":\"Netty Pipeline 可用长度字段解码器聚合多次读取，给业务 Handler 交付完整帧。\"},{\"a\":\"future\",\"b\":\"asyncio\",\"kind\":\"共享原理\",\"why\":\"两者都可用 Future 表示尚未完成的操作，但回调和底层调度机制由各 API 决定。\"},{\"a\":\"resources\",\"b\":\"blocking\",\"kind\":\"工程应用\",\"why\":\"套接字、流和通道属于需要确定性释放的资源，异常路径也要关闭。\"}],\"routes\":[{\"id\":\"all\",\"icon\":\"◎\",\"title\":\"全章概览\",\"desc\":\"六组知识，从运行模型到工程实践\",\"nodes\":[]},{\"id\":\"platform\",\"icon\":\"01\",\"title\":\"源码如何跑起来？\",\"desc\":\"语言 → 字节码 → JVM → 系统边界\",\"nodes\":[\"java\",\"bytecode\",\"vm\",\"os\",\"native\",\"creation\"]},{\"id\":\"values\",\"icon\":\"02\",\"title\":\"值、引用与相等\",\"desc\":\"位宽、精度、装箱、复制和判等\",\"nodes\":[\"value\",\"primitive\",\"conversion\",\"decimal\",\"boxing\",\"intcache\",\"generic\",\"contract\",\"copy\",\"strings\",\"creation\"]},{\"id\":\"objects\",\"icon\":\"03\",\"title\":\"调用到底落到谁？\",\"desc\":\"重载、重写、接口与对象设计\",\"nodes\":[\"oop\",\"iface\",\"abstract\",\"dispatch\",\"overload\",\"modifiers\",\"nested\",\"proxy\",\"strategy\",\"dcl\"]},{\"id\":\"framework\",\"icon\":\"04\",\"title\":\"框架怎样发现和装配对象？\",\"desc\":\"构造、反射、注解与模块边界\",\"nodes\":[\"reflection\",\"modules\",\"annotation\",\"retention\",\"creation\",\"proxy\",\"bytecode\"]},{\"id\":\"errors\",\"icon\":\"05\",\"title\":\"异常后，谁来收尾？\",\"desc\":\"传播、finally、资源关闭与异步失败\",\"nodes\":[\"exceptions\",\"flow\",\"resources\",\"future\",\"creation\",\"chain\",\"blocking\"]},{\"id\":\"tasks\",\"icon\":\"06\",\"title\":\"如何描述批处理和异步任务？\",\"desc\":\"Lambda、Stream、Future、虚拟线程\",\"nodes\":[\"lambda\",\"iface\",\"stream\",\"parallel\",\"future\",\"modern\",\"virtual\",\"comparator\",\"strategy\"]},{\"id\":\"network\",\"icon\":\"07\",\"title\":\"对象如何跨进程传输？\",\"desc\":\"序列化、分帧、NIO、Netty 和背压\",\"nodes\":[\"serialization\",\"framing\",\"os\",\"native\",\"blocking\",\"selector\",\"asyncio\",\"netty\",\"virtual\",\"chain\",\"future\"]}],\"questions\":[{\"n\":1,\"title\":\"Java 的核心语言特性有哪些？\",\"short\":\"Java 采用静态类型检查，以类和接口组织程序，用规范化字节码和目标平台上的 JVM 提供可移植性。运行时负责管理对象内存，可借助 JIT 优化热点。标准库还提供线程、集合、I/O 等能力，支撑较复杂的应用。\",\"details\":[\"编译器按语言规则校验变量、参数和返回值的类型。类封装状态与行为，接口表达契约，重写支持运行时多态。\",\"源文件通常被 javac 编译成 .class。类文件约定了指令与结构，各平台 JVM 实现负责执行，并处理底层环境差异。\",\"垃圾收集器自动回收不可达对象占用的内存。文件、套接字等资源需要按其生命周期关闭，常见做法是 try-with-resources。\"],\"example\":\"同一个只依赖 Java SE 的订单程序可以在 Windows 开发，在兼容 JDK 的 Linux 服务端运行。业务代码通过接口替换订单存储实现，调用逻辑仍可复用。\",\"pitfall\":\"Java 同时拥有对象和基本类型，int 与 boolean 等值属于基本类型。只要程序还保有指向无用对象的强引用，GC 就无法回收它。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html\",\"anchor\":\"%E8%AF%B4%E4%B8%80%E4%B8%8Bjava%E7%9A%84%E7%89%B9%E7%82%B9\",\"node\":\"java\",\"chapter\":0,\"follow\":[3,5]},{\"n\":2,\"title\":\"Java 的工程优势与使用成本是什么？\",\"short\":\"Java 的优势是静态类型、成熟的库与诊断工具、跨平台运行，以及垃圾收集带来的内存管理便利。成本主要体现在部分场景的启动与预热、运行时内存占用，以及需要管理 GC 和依赖。选型要结合吞吐、冷启动、延迟和团队经验。\",\"details\":[\"长期运行的服务可利用 JIT 对频繁执行的路径做内联等优化。性能判断应区分启动、稳定运行、峰值以及尾延迟。\",\"堆是 Java 进程内存的一部分，线程栈、类元数据和直接内存等区域也会占用资源。低内存预算下要看进程实测指标。\",\"静态类型有利于重构与维护，但复杂依赖、启动初始化和序列化等开销也需要通过剖析判断来源。\"],\"example\":\"评估同一服务的两个实现时，可在相同 CPU、内存和负载下比较启动到可接流量的时间、稳定吞吐、P99 与常驻内存。只做一次短跑压测容易把 JVM 预热算进稳态性能。\",\"pitfall\":\"把 Java 的性能概括为总比 C++ 慢会遗漏工作负载、编译器优化、分配模式和库实现的差异。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/vm/java-hotspot-virtual-machine-performance-enhancements.html\",\"anchor\":\"java-%E7%9A%84%E4%BC%98%E5%8A%BF%E5%92%8C%E5%8A%A3%E5%8A%BF%E6%98%AF%E4%BB%80%E4%B9%88\",\"node\":\"java\",\"chapter\":0,\"follow\":[1,6]},{\"n\":3,\"title\":\"一份 Java 字节码为何能在多个平台运行？\",\"short\":\"javac 通常生成遵循 JVM 规范的类文件。不同系统和 CPU 上的 JVM 提供相同的字节码语义，并由本平台的解释器或 JIT 执行。部署时要满足类文件版本、标准库 API 和依赖条件，使用本地库的程序还要匹配目标平台。\",\"details\":[\"类文件定义指令、符号引用等结构。操作系统和指令集的差异由目标平台的 JVM 与标准库实现处理。\",\"新版本编译产物可能使用旧运行时不支持的类文件版本。用较新 javac 的 --release 可同时约束目标版本和可用的公开平台 API。\",\"JNI 库、硬编码路径、环境变量和外部命令属于程序的部署依赖，迁移平台时需要单独验证。\"],\"example\":\"在 JDK 21 上以 javac --release 17 编译单文件工具，类文件可交给兼容的 JDK 17。若工具加载本地动态库，仍要为目标操作系统和 CPU 提供对应构建。\",\"pitfall\":\"JAR 是打包格式，可移植性仍取决于包里的字节码版本、第三方依赖和外部环境。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/specs/man/javac.html#option-release\",\"anchor\":\"java%E4%B8%BA%E4%BB%80%E4%B9%88%E6%98%AF%E8%B7%A8%E5%B9%B3%E5%8F%B0%E7%9A%84\",\"node\":\"bytecode\",\"chapter\":0,\"follow\":[4,78]},{\"n\":4,\"title\":\"JDK、JRE 和 JVM 各负责什么？\",\"short\":\"JVM 执行类文件中的程序并提供运行机制。JRE 是运行时环境，包含 JVM、标准类库和运行组件。JDK 另外提供 javac、调试和打包等开发工具，也能运行程序。现代 JDK 可用 jlink 组合应用所需模块，生成定制运行时。\",\"details\":[\"开发流程中由 JDK 的 javac 生成 .class，启动器 java 启动 JVM 并建立程序所需的运行环境。\",\"标准类库与 JVM 的职责不同。业务程序对集合、字符串或 I/O 的调用依赖类库接口，再由运行时及本地组件落实。\",\"JDK 包含运行所需组件，但现代发行版的目录布局与发行形态各异，JDK 内部未必有独立的 jre 子目录。\"],\"example\":\"构建镜像用完整 JDK 编译和测试。部署镜像可带 jlink 生成的 Java 运行时，按应用所需模块打包并执行。\",\"pitfall\":\"概念上的包含关系描述的是职责。把某个发行版的文件布局当作语言规范，容易把 Java 8 的目录结构套到现代 JDK。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/specs/man/jlink.html\",\"anchor\":\"jvm%E3%80%81jdk%E3%80%81jre%E4%B8%89%E8%80%85%E5%85%B3%E7%B3%BB\",\"node\":\"vm\",\"chapter\":0,\"follow\":[3,7]},{\"n\":5,\"title\":\"Java 语言和 JVM 的边界在哪里？\",\"short\":\"Java 语言规范定义源码的语法、类型检查和执行语义，JVM 规范定义类文件、字节码与虚拟机运行规则。编译器连接两层。只要能生成符合规范的类文件，其他语言也可以运行在 JVM 上，例如 Kotlin 或 Scala 的 JVM 目标。\",\"details\":[\"源码层的泛型、重载解析和访问控制由 Java 编译器按照语言规范处理。生成类文件时可将部分源码结构转换成更基础的机制。\",\"虚拟机层依据类文件加载、链接并执行指令。HotSpot 属于实现，内部优化策略可随版本变化。\",\"Java SE 标准库提供 List、String 等 API。面试时可分别说明语言的表达规则、库的接口与虚拟机的执行职责。\"],\"example\":\"Java 的 List\\u003cString> 在编译期阻止往列表添加 Integer。运行时 List 对象不靠元素类型实参来执行 Java 源码级泛型检查，这能引出类型擦除。\",\"pitfall\":\"把 HotSpot 的内存布局和编译策略视为所有 JVM 实现的强制规则，会混淆规范与实现。\",\"ref\":\"https://docs.oracle.com/javase/specs/jvms/se21/html/jvms-2.html\",\"anchor\":\"jvm-%E5%92%8C-java-%E6%9C%89%E5%95%A5%E5%8C%BA%E5%88%AB\",\"node\":\"vm\",\"chapter\":0,\"follow\":[3,7]},{\"n\":6,\"title\":\"Java 为何同时涉及编译和解释执行？\",\"short\":\"编译发生在不同层次。javac 提前把 Java 源码编译成 JVM 字节码。以 HotSpot 为例，运行时可先用解释器执行并收集数据，再将热点方法或循环编译成机器码。分层编译用运行信息优化长期执行的路径，同时兼顾启动时间。\",\"details\":[\"javac 处理类型检查和源码转换，产出与具体 CPU 指令集解耦的类文件。\",\"HotSpot 的解释器和分层编译在运行中收集调用、分支等反馈。编译器可用这些信息做内联或去虚拟化，并在假设失效后去优化。\",\"JVM 规范要求实现保持指令的可观察语义。何时使用解释器、是否做 JIT 和何时切换属于虚拟机实现策略。\"],\"example\":\"一个服务刚启动时，请求可能进入解释执行或较低编译层级。相同路径多次运行后，热点代码的机器码被反复调用，吞吐趋于稳定。\",\"pitfall\":\"只执行一次的代码未必进入高优化层级。压测要区分冷启动、预热和稳态。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/vm/java-hotspot-virtual-machine-performance-enhancements.html\",\"anchor\":\"%E4%B8%BA%E4%BB%80%E4%B9%88java%E8%A7%A3%E9%87%8A%E5%92%8C%E7%BC%96%E8%AF%91%E9%83%BD%E6%9C%89\",\"node\":\"vm\",\"chapter\":0,\"follow\":[3,8]},{\"n\":7,\"title\":\"JVM 从加载到执行主要做哪些事？\",\"short\":\"JVM 是执行 JVM 类文件的抽象机器及其实现。它按规则加载、链接和初始化类，为调用建立栈帧，在堆中管理对象，并执行字节码。自动内存管理负责回收对象占用的空间，解释器、JIT 和垃圾收集器的细节由实现选择。\",\"details\":[\"类加载取得类的表示，链接包含验证、准备和可按需进行的解析。初始化阶段会按触发规则执行静态初始化。\",\"线程执行方法时使用栈帧保存局部变量和操作数等信息。对象和数组从 JVM 的堆分配，优化后的物理布局属于实现细节。\",\"字节码执行涉及方法调用、异常处理和同步等规则。JVMS 定义语义，HotSpot 则提供具体执行引擎与收集器。\"],\"example\":\"第一次读取某个类声明的非常量静态字段时，虚拟机需要在访问之前保证其类初始化完成。随后对同一已初始化类的访问不会再执行同一静态初始化。\",\"pitfall\":\"类加载、链接、初始化各有不同职责与触发时机。出现错误时，要结合异常类型和堆栈定位发生在哪一步。\",\"ref\":\"https://docs.oracle.com/javase/specs/jvms/se21/html/jvms-5.html\",\"anchor\":\"jvm%E6%98%AF%E4%BB%80%E4%B9%88\",\"node\":\"vm\",\"chapter\":0,\"follow\":[6,43]},{\"n\":8,\"title\":\"编译执行和解释执行该怎么区分？\",\"short\":\"编译把程序从一种表示转换成另一种表示，产物可以是机器码，也可以是字节码。解释器在运行中读取某种程序表示并实现其语义，JIT 则在运行时生成机器码。比较时应说明输入、目标表示、编译时机和具体实现。\",\"details\":[\"常见 AOT 流程在运行前就把源码或中间表示编译成机器码。产物可直接在目标平台运行，通常要匹配目标架构与 ABI。\",\"解释器可以接收源码转换后的字节码。字节码既可保存或复用，也可被虚拟机作为运行时编译的输入。\",\"JIT 利用运行时反馈优化热点，付出编译和预热成本。解释器的启动特性与 AOT 程序的部署属性也与具体实现相关。\"],\"example\":\"普通 Java 程序经 javac 生成 JVM 字节码，HotSpot 可解释或 JIT。常见 CPython 流程也先生成供自己的解释器使用的字节码。\",\"pitfall\":\"“编译型”和“解释型”适合描述某种实现的常见路径。给语言作绝对二分会漏掉混合执行方式。\",\"ref\":\"https://docs.python.org/3/library/dis.html\",\"anchor\":\"%E7%BC%96%E8%AF%91%E5%9E%8B%E8%AF%AD%E8%A8%80%E5%92%8C%E8%A7%A3%E9%87%8A%E5%9E%8B%E8%AF%AD%E8%A8%80%E7%9A%84%E5%8C%BA%E5%88%AB\",\"node\":\"bytecode\",\"chapter\":0,\"follow\":[6,9]},{\"n\":9,\"title\":\"Python 与 Java 的类型和运行方式有哪些差异？\",\"short\":\"Java 在编译期检查静态类型，常见路径是源码经 javac 变成类文件，再交给 JVM 执行。Python 的对象有类型，名称可重新绑定到不同类型的对象，常见 CPython 实现会生成字节码交给解释器。语言特性与运行时实现需要分别比较。\",\"details\":[\"Java 局部变量可用 var 推断类型，推断完成后仍遵守静态类型规则。Python 类型标注通常供检查器和工具使用，运行时不会仅因标注自动拒绝不匹配的实参。\",\"Java 区分 int 等基本类型与对象引用。Python 的 int 等值也由对象表示，其类型决定对象支持的操作。\",\"吞吐、启动、并发与可扩展能力涉及运行时版本、第三方库和具体任务。比较时应明确 JVM 实现、Python 实现以及计算主要发生在哪里。\"],\"example\":\"Python 中先写 x = 1 再写 x = 'ok' 会把同一名称重新绑定到字符串。Java 中 var x = 1 推断为 int，随后给 x 赋字符串会在编译时报错。\",\"pitfall\":\"把 Python 等同于“逐行执行且不编译”，或把常见 CPython 实现细节当作所有 Python 实现的约定，都无法解释真实运行流程。\",\"ref\":\"https://docs.python.org/3/reference/datamodel.html\",\"anchor\":\"python%E5%92%8Cjava%E5%8C%BA%E5%88%AB%E6%98%AF%E4%BB%80%E4%B9%88\",\"node\":\"java\",\"chapter\":0,\"follow\":[2,8]},{\"n\":10,\"title\":\"为什么说 Java 的参数传递统一采用值传递？\",\"short\":\"调用时会把实参表达式的值交给独立的形参变量。基本类型复制数值，引用类型复制引用值。两个引用可以指向同一对象，通过形参改对象的可变状态，调用方可看到变化。给形参重新赋值只改变形参自己的绑定。\",\"details\":[\"形参是本次方法调用的局部变量。对它赋新值，不会改写调用方变量所在的存储位置。\",\"复制引用值不会复制对象。若对象可变，任意持有同一对象引用的调用方都可能观察到状态变化。\",\"真正的引用传递可以借形参直接改写调用方变量的绑定。需要返回新对象时，Java 中常用返回值让调用方主动接收。\"],\"example\":\"执行 touch(a) 时，p[0] = 2 改到同一个数组，随后让 p 指向另一个数组不会让 a 改指向。调用结束后 a[0] 仍是 2。\",\"pitfall\":\"“对象状态被方法改了”表明共享同一对象。是否为引用传递要看形参重新绑定能否改动调用方的变量。\",\"code\":\"static void touch(int[] p) {\\n    p[0] = 2;\\n    p = new int[] {3};\\n}\\n\\n// 以下为调用处\\nint[] a = {1};\\ntouch(a);\\nSystem.out.println(a[0]); // 2\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.12.4.5\",\"anchor\":\"%E5%80%BC%E4%BC%A0%E9%80%92%E5%92%8C%E5%BC%95%E7%94%A8%E4%BC%A0%E9%80%92%E7%9A%84%E5%8C%BA%E5%88%AB\",\"node\":\"value\",\"chapter\":0,\"follow\":[38,56]},{\"n\":11,\"title\":\"Java 的八种基本类型如何分类？\",\"short\":\"整数类型是 byte、short、int、long 和 char，其中 char 表示无符号 UTF-16 代码单元。浮点类型是 float、double，采用 IEEE 754 二进制浮点表示。boolean 只有 true 与 false，语言规范未规定其统一存储大小。\",\"details\":[\"byte、short、int、long 是 8、16、32、64 位有符号补码整数。char 是 16 位无符号类型，取值从 0 到 65535。\",\"float 为 32 位 binary32，double 为 64 位 binary64。浮点还支持 NaN、正负无穷大与正负零。\",\"boolean 用于条件判断，不能通过 Java 基本类型转换规则直接和整数互转。类字段和数组元素有默认值，局部变量则需先赋值再使用。\"],\"example\":\"字符串 \\\"😀\\\" 含一个 Unicode 码点，UTF-16 表示要用两个 char，因而 length() 为 2，codePointCount(0, length()) 为 1。\",\"pitfall\":\"char 只容纳一个 UTF-16 代码单元。处理完整 Unicode 字符时，应考虑码点或更高层的文本分段。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.2\",\"anchor\":\"%E5%85%AB%E7%A7%8D%E5%9F%BA%E6%9C%AC%E7%9A%84%E6%95%B0%E6%8D%AE%E7%B1%BB%E5%9E%8B\",\"node\":\"primitive\",\"chapter\":1,\"follow\":[12,17]},{\"n\":12,\"title\":\"int 和 long 的位宽与范围分别是多少？\",\"short\":\"int 是 32 位、4 字节的有符号整数，范围为 −2³¹ 到 2³¹−1。long 是 64 位、8 字节的有符号整数，范围为 −2⁶³ 到 2⁶³−1。选择时要同时考虑最终结果和中间表达式是否超出范围。\",\"details\":[\"int 范围是 −2,147,483,648 到 2,147,483,647。long 范围是 −9,223,372,036,854,775,808 到 9,223,372,036,854,775,807。\",\"表达式通常先按操作数类型决定运算类型，再转换成赋值目标类型。两个 int 做乘法得到 int，给 long 赋值时才扩宽。\",\"用 L 写 long 字面量，或者先把一个操作数转换为 long，可使一般整数算术表达式以 long 运算。需要检测溢出时可用 Math.addExact 等方法。\"],\"example\":\"50,000 × 50,000 超过 int 的最大值。第一行先发生 int 溢出，第二行按 long 运算得 2,500,000,000。\",\"pitfall\":\"位宽描述基本类型的数值表示。一个包装对象的内存开销还涉及对象头和布局，不能由基本类型位宽直接推断。\",\"code\":\"long wrong = 50_000 * 50_000;   // -1794967296\\nlong right = 50_000L * 50_000;  // 2500000000\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.2.1\",\"anchor\":\"int%E5%92%8Clong%E6%98%AF%E5%A4%9A%E5%B0%91%E4%BD%8D-%E5%A4%9A%E5%B0%91%E5%AD%97%E8%8A%82%E7%9A%84\",\"node\":\"primitive\",\"chapter\":1,\"follow\":[13,15]},{\"n\":13,\"title\":\"int 和 long 如何互转并检查范围？\",\"short\":\"int 扩宽为 long 可隐式完成，数值保持精确。long 转 int 通常要显式强转，超范围时会丢弃高 32 位并按 int 解释。业务要求转换前后数值一致时，可以先校验范围，也可以用 Math.toIntExact 让越界显式失败。\",\"details\":[\"扩宽从 32 位有符号整数转到 64 位有符号整数，任何 int 均能用 long 精确表示。负数的符号也保留。\",\"窄化取低 32 位。若最高保留位为 1，结果按 int 补码解释为负数。强转本身不会因为数值越界抛异常。\",\"Math.toIntExact(long) 在结果不能表示为 int 时抛 ArithmeticException，适合解析外部输入、协议字段或旧接口参数。\"],\"example\":\"2,147,483,648L 比 int 上限大 1。强转得到 −2,147,483,648，精确转换则抛 ArithmeticException。\",\"pitfall\":\"符号变化只是某些越界输入的表现。检查转换结果是否为负无法覆盖所有截断。\",\"code\":\"int base = -7;\\nlong widened = base;                   // -7\\nlong limit = 2_147_483_648L;\\nint truncated = (int) limit;           // -2147483648\\nint checked = Math.toIntExact(limit);  // 抛出 ArithmeticException\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Math.html#toIntExact(long)\",\"anchor\":\"long%E5%92%8Cint%E5%8F%AF%E4%BB%A5%E4%BA%92%E8%BD%AC%E5%90%97\",\"node\":\"conversion\",\"chapter\":1,\"follow\":[14,15]},{\"n\":14,\"title\":\"Java 的类型转换分哪些场景？\",\"short\":\"常见场景有基本类型扩宽、显式窄化、引用向上或向下转型，以及装箱拆箱。参与表达式时还可能发生数值提升。字符串转数字属于 API 解析。是否允许隐式转换要结合赋值、方法调用和显式强转等上下文判断。\",\"details\":[\"赋值时可把 int 隐式扩宽到 long，long 到 int 通常需要强转。可表示的编译期整型常量赋给 byte、short 或 char 时有例外。\",\"引用向上转型通常可以隐式完成。向下转型会检查运行时类型，检查失败时抛 ClassCastException，可先用 instanceof 检查或绑定变量。\",\"装箱和拆箱在基本值与对应包装类之间转换。Integer.parseInt 把文本解释为数值，并按文本格式及取值范围校验。\"],\"example\":\"byte b = 7 可编译，因为 7 是可表示的整型常量。若声明 int i = 7，再写 byte b = i，则需要显式强转或按业务范围验证。\",\"pitfall\":\"转换上下文会影响规则。例如 byte b = 7 可以直接赋值，但调用仅接收 byte 的方法时，传入整型字面量 7 需要显式转换。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-5.html\",\"anchor\":\"%E6%95%B0%E6%8D%AE%E7%B1%BB%E5%9E%8B%E8%BD%AC%E6%8D%A2%E6%96%B9%E5%BC%8F%E4%BD%A0%E7%9F%A5%E9%81%93%E5%93%AA%E4%BA%9B\",\"node\":\"conversion\",\"chapter\":1,\"follow\":[15,17]},{\"n\":15,\"title\":\"类型转换可能丢数据或抛出什么异常？\",\"short\":\"整数窄化可截断高位，浮点与整数互转可能丢失精度或小数。引用向下转型可能抛 ClassCastException，空包装对象拆箱会抛 NullPointerException，非法或越界文本解析会抛 NumberFormatException。应按来源选择检查方式。\",\"details\":[\"某些扩宽仍会舍入。int 转 float、long 转 float 或 double 时，目标类型的有效精度未必足以保存原整数。\",\"double 转 int 时，正常有限值先向零截断，超范围值饱和到对应边界，NaN 转为 0。整数窄化则按低位截断，两类规则要分别判断。\",\"引用转型改变静态视角，运行时对象自身的类型保持原样。处理可能为 null 的包装值时，先明确缺失值的语义。\"],\"example\":\"16,777,217 转为 float 后会舍入为 16,777,216。若它是必须准确保存的订单编号，应使用足够宽的整数或字符串。\",\"pitfall\":\"显式强转表示允许按目标类型的规则转换，不能当作对数值范围、文本格式或对象类型的业务校验。\",\"code\":\"int id = 16_777_217;\\nfloat approx = id;\\nSystem.out.println((int) approx); // 16777216\\nSystem.out.println((int) -3.9);   // -3\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-5.html#jls-5.1\",\"anchor\":\"%E7%B1%BB%E5%9E%8B%E4%BA%92%E8%BD%AC%E4%BC%9A%E5%87%BA%E7%8E%B0%E4%BB%80%E4%B9%88%E9%97%AE%E9%A2%98%E5%90%97\",\"node\":\"conversion\",\"chapter\":1,\"follow\":[13,16]},{\"n\":16,\"title\":\"金额计算为什么常用 BigDecimal？\",\"short\":\"double 使用有限精度的二进制表示，许多十进制小数只能近似保存。BigDecimal 用整数和十进制 scale 表示数值，可精确输入和处理有限十进制小数。金额计算还需要明确舍入规则，遇到无限循环小数的除法要指定精度或小数位。\",\"details\":[\"BigDecimal 表示的数值等于 unscaledValue × 10 的负 scale 次方，例如 12.30 可由整数 1230 和 scale 2 表示。无精度限制的加减乘能计算精确结果。\",\"读取金额时优先从字符串或最小货币单位构造。BigDecimal.valueOf(double) 使用 double 的标准十进制字符串表示，无法恢复浮点运算已经丢失的信息。\",\"divide 若要求精确结果而商无法以有限十进制表示，会抛 ArithmeticException。规定 scale 和 RoundingMode 时要符合业务约定。\",\"compareTo 按数值比较，equals 同时比较数值和 scale。金额对象作为哈希键时，需要先确定是否要求统一 scale。\"],\"example\":\"用字符串构造 0.10 与 0.20 相加得到 0.30。把 1.00 平均分成 3 份时，逐项保留两位会有尾差，需要再按业务规则分配。\",\"pitfall\":\"new BigDecimal(0.1) 会精确转换已经近似的二进制浮点值，结果包含多位尾数。源值是文本金额时，直接解析文本。\",\"code\":\"BigDecimal total = new BigDecimal(\\\"0.10\\\").add(new BigDecimal(\\\"0.20\\\"));\\nBigDecimal share = BigDecimal.ONE.divide(BigDecimal.valueOf(3), 2, RoundingMode.HALF_UP);\\n// total 为 0.30，share 为 0.33\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/math/BigDecimal.html\",\"anchor\":\"%E4%B8%BA%E4%BB%80%E4%B9%88%E7%94%A8bigdecimal-%E4%B8%8D%E7%94%A8double\",\"node\":\"decimal\",\"chapter\":1,\"follow\":[15,57]},{\"n\":17,\"title\":\"自动装箱、拆箱分别发生了什么？\",\"short\":\"装箱把基本值转换成对应的包装对象，拆箱从包装对象取得基本值。例如给 Integer 赋 int 会装箱，参与 int 算术时会拆箱。javac 通常生成 valueOf 或 intValue 调用，拆箱 null 会抛 NullPointerException。\",\"details\":[\"例如 Integer x = 3 通常对应 Integer.valueOf(3)，包装对象可能复用。int y = x 则相当于取 x.intValue()。\",\"泛型集合常在存取两端触发转换，例如 List\\u003cInteger>.add 接收 Integer，传 int 时会装箱。从列表取出元素后参与整数运算则拆箱。\",\"两个 Integer 用 == 时比较引用。一个 Integer 与 int 用 == 时，Integer 会在数值比较前拆箱，可能触发空指针。\"],\"example\":\"含有 null 的 List\\u003cInteger> 可以存在，但用 for (int value : list) 遍历时，会在读到 null 的位置触发拆箱异常。\",\"pitfall\":\"自动转换省略了显式调用，运行语义仍要考虑空值、对象比较和潜在分配。\",\"code\":\"Integer boxed = 42;\\nint raw = boxed;\\nInteger missing = null;\\nint next = missing + 1; // 抛出 NullPointerException\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-5.html#jls-5.1.7\",\"anchor\":\"%E8%A3%85%E7%AE%B1%E5%92%8C%E6%8B%86%E7%AE%B1%E6%98%AF%E4%BB%80%E4%B9%88\",\"node\":\"boxing\",\"chapter\":1,\"follow\":[18,21]},{\"n\":18,\"title\":\"有了 int，为什么 Java 还提供 Integer？\",\"short\":\"int 用于表达基本整数值，Integer 让这个值能进入要求对象引用的接口，例如 List\\u003cInteger>、Comparable 或 Number。包装类型还可用 null 表达缺失，并允许装箱拆箱衔接两种表示。是否需要对象取决于 API 和业务语义。\",\"details\":[\"Java SE 21 的泛型类型实参要求引用类型，所以可用 List\\u003cInteger>，不能用 List\\u003cint>。同样，返回 Object 或 Number 的接口可以返回 Integer。\",\"Integer 是基于值的不可变包装类。把一个 Integer 变量改成另一个值会重新绑定引用，原包装对象本身不变。\",\"null 可区分“输入未提供”和“显式输入 0”，但该区分需要在边界显式处理，避免把空值直接传入基本类型参数。\"],\"example\":\"更新表单可以把年龄字段定义为 Integer，null 表示没有提交年龄，0 表示明确提交 0。校验后再交给只收 int 的计算方法。\",\"pitfall\":\"Java 的 Number 是类层级，int 本身不属于该层级。把 int 传给要求 Number 的 API 时，编译器可先装箱再向上转型。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Integer.html\",\"anchor\":\"java%E4%B8%BA%E4%BB%80%E4%B9%88%E8%A6%81%E6%9C%89integer\",\"node\":\"boxing\",\"chapter\":1,\"follow\":[17,40]},{\"n\":19,\"title\":\"Integer 相比 int 能提供哪些实际便利？\",\"short\":\"Integer 可以在对象 API 中携带整数，可用自然顺序排序、用 equals 做同类型数值比较，还可用 null 表达可选字段。Integer 类也提供进制解析和位操作等静态工具，其中不少方法可直接接收 int，使用时无须先创建包装对象。\",\"details\":[\"Integer 实现 Comparable\\u003cInteger>，可用 compareTo 做整数自然顺序比较。Objects.equals 适合比较可能为空的两个 Integer。\",\"Integer.parseInt 返回 int，Integer.valueOf 返回 Integer。需要原始数值时可直接用前者，需要兼容对象接口时用后者。\",\"Integer 还提供 compare、bitCount、toUnsignedString 等静态操作，适合对基本整数完成比较、位处理和格式化。\"],\"example\":\"解析配置值时，Integer.parseInt(\\\"ff\\\", 16) 得到 255。若配置字段需要区分缺失与 0，可将缺失保留为 null，将合法输入保存为 Integer。\",\"pitfall\":\"Integer.equals 只接受同类型且数值相等的包装对象。Integer.valueOf(1).equals(Long.valueOf(1)) 返回 false，跨类型比较应先选定合适的统一表示。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Integer.html\",\"anchor\":\"integer%E7%9B%B8%E6%AF%94int%E6%9C%89%E4%BB%80%E4%B9%88%E4%BC%98%E7%82%B9\",\"node\":\"boxing\",\"chapter\":1,\"follow\":[20,21]},{\"n\":20,\"title\":\"既然有 Integer，为什么运算里仍常用 int？\",\"short\":\"int 直接保存整数值，参与运算时无需装箱拆箱，也没有 null。大量数值存储或运算用 int、int[] 或 IntStream，可避免许多包装引用和潜在分配。跨对象 API 或需要缺失语义时，再在边界使用 Integer。\",\"details\":[\"int[] 存储基本类型元素，Integer[] 存储对象引用。包装元素可复用或分配，具体内存差异还受 JVM 引用宽度与对象布局影响。\",\"在循环中不断对 Integer 累加，语义上需要先拆箱计算再装箱。JIT 有时可消除分配，但编写数值密集路径时可直接采用基本类型。\",\"基本类型也有固定范围。若累加结果可能超出 int，应将累加器扩宽为 long 或按需要用精确运算工具。\"],\"example\":\"对百万个计数做求和时，可以用 int[] 保存原始数据，再用 long 累加，兼顾元素存储效率和总和的取值范围。\",\"pitfall\":\"选择 int 解决的是表达与开销问题。它不会自动避免整数溢出，也不适合用 0 冒充业务上的缺失值。\",\"code\":\"int[] counts = {1_000_000_000, 1_500_000_000};\\nlong total = java.util.Arrays.stream(counts).asLongStream().sum();\\n// total 为 2500000000\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/stream/IntStream.html\",\"anchor\":\"%E9%82%A3%E4%B8%BA%E4%BB%80%E4%B9%88%E8%BF%98%E8%A6%81%E4%BF%9D%E7%95%99int%E7%B1%BB%E5%9E%8B\",\"node\":\"primitive\",\"chapter\":1,\"follow\":[11,18]},{\"n\":21,\"title\":\"Integer 缓存会如何影响 == 的结果？\",\"short\":\"Integer.valueOf(int) 保证复用 −128 到 127 内的对象，范围外也可能复用。两个 Integer 用 == 比较引用身份，因此相同数值的 == 结果可能随缓存而不同。比较整数值用 equals，可能为空时用 Objects.equals。\",\"details\":[\"javac 对 Integer 的自动装箱通常调用 Integer.valueOf。JLS 对特定小值的编译期常量装箱还规定了身份一致性。\",\"缓存对象不可变，复用能降低常用小整数的分配成本。不要从缓存范围外的数值推断某次装箱一定新建对象。\",\"两个引用用 == 比较身份。若其中一个是基本 int，比较进入数值路径并发生拆箱，空 Integer 在这条路径会抛异常。\"],\"example\":\"两个 Integer 变量各装箱 127，== 为 true。值为 128 时，equals 仍为 true，== 的结果不应作为业务条件。\",\"pitfall\":\"Integer 是基于值的类。缓存对象可能跨代码复用，用它充当 synchronized 的锁对象会把独立操作意外绑在一起。\",\"code\":\"Integer a = 127, b = 127;\\nInteger c = 128, d = 128;\\nSystem.out.println(a == b);                    // true\\nSystem.out.println(java.util.Objects.equals(c, d)); // true\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Integer.html#valueOf(int)\",\"anchor\":\"%E8%AF%B4%E4%B8%80%E4%B8%8B-integer%E7%9A%84%E7%BC%93%E5%AD%98\",\"node\":\"intcache\",\"chapter\":1,\"follow\":[17,56]},{\"n\":22,\"title\":\"面向对象如何组织代码？封装、继承和多态分别管什么？\",\"short\":\"面向对象把状态和操作状态的行为放到对象中，再通过对象协作完成业务。封装负责保护对象状态和约束，继承让子类型沿用父类型契约并可复用实现，多态让调用方依赖统一契约，运行时由实际对象决定实例方法的实现。\",\"details\":[\"封装通过访问控制与有意义的操作维护不变量。账户余额设为 private，扣款入口负责校验金额、检查余额和更新状态。暴露一个允许任意写入余额的 setter 会削弱这种约束。\",\"继承表达可替换的 is-a 关系。Java 类只能直接继承一个父类，可以实现多个接口。只有共同能力、没有可替换关系时，可以把共用实现作为一个组件组合进来。\",\"多态通过父类或接口引用操作多种实现。编译器按声明类型检查调用，重写的实例方法在运行时按接收对象选择实现。新增子类型通常只影响选择或装配实现的位置。\"],\"example\":\"Checkout 只调用 Payment.pay，银行卡和钱包各自实现扣款，并各自封装余额与授权规则。接入新支付渠道时可新增实现并修改装配，结账算法继续依赖 Payment 契约。\",\"pitfall\":\"继承的重点是履行父类型契约。子类随意收紧可接受输入，可能让原本对父类型合法的调用在替换后失败。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html\",\"anchor\":\"%E6%80%8E%E4%B9%88%E7%90%86%E8%A7%A3%E9%9D%A2%E5%90%91%E5%AF%B9%E8%B1%A1-%E7%AE%80%E5%8D%95%E8%AF%B4%E8%AF%B4%E5%B0%81%E8%A3%85%E7%BB%A7%E6%89%BF%E5%A4%9A%E6%80%81\",\"node\":\"oop\",\"chapter\":2,\"follow\":[23,25]},{\"n\":23,\"title\":\"Java 的多态在调用和类型转换中如何体现？\",\"short\":\"Java 常把重载称为编译期多态，把重写的实例方法调用称为运行期多态。父类引用指向子类对象、接口引用指向实现对象，是使用运行期多态的方式。向上转型保留对象的实际类型，向下转型需要满足实际类型检查。\",\"details\":[\"重载选择发生在编译期，编译器使用接收表达式和实参的静态类型，在候选方法中决定签名。对象在运行时换成某个子类，已选签名仍保持原样。\",\"重写在已选签名上发生动态分派。父类变量或接口变量可以引用任一兼容对象，调用同一实例方法时按接收对象实际类型找实现。\",\"向上转型通常隐式完成，转换后可直接调用的方法受声明类型限制。恢复子类型 API 时可用 instanceof 检查并绑定子类型变量，避免对不兼容对象强转。\"],\"example\":\"Vehicle v = new Bike() 后，v.move() 可执行 Bike 的重写实现。调用重载方法 inspect(v) 时，实参的静态类型仍是 Vehicle，即便同时存在 inspect(Bike)。\",\"pitfall\":\"向下转型只改变这个表达式的静态类型，原对象保持原样。对不匹配的非 null 对象强转会抛出 ClassCastException。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.12\",\"anchor\":\"%E5%A4%9A%E6%80%81%E4%BD%93%E7%8E%B0%E5%9C%A8%E5%93%AA%E5%87%A0%E4%B8%AA%E6%96%B9%E9%9D%A2\",\"node\":\"dispatch\",\"chapter\":2,\"follow\":[26,28]},{\"n\":24,\"title\":\"运行时多态解决了哪些扩展问题？\",\"short\":\"多态把流程的调用接口和具体算法分开。调用方按稳定契约使用对象，运行时可以替换不同实现，公共流程因此能复用。新增实现时通常只需添加实现和配置，原来使用该契约的业务流程可以继续工作。\",\"details\":[\"如果结账、退款、补偿都按渠道手写分支，新增渠道就会同时触碰多处。提炼稳定的行为接口后，把有差异的行为放到各个实现，调用方保留公共流程。\",\"策略模式通常把一种可替换算法作为依赖注入。业务代码依赖抽象契约，生产可注入真实实现，单元测试可注入可预测的实现以覆盖故障场景。\",\"可替换性取决于行为契约。异常、金额精度、幂等语义等约定一致时，调用方才可以透明替换实现。\"],\"example\":\"新增一种运费规则时，实现 ShippingPolicy.quote，并更新规则装配。订单仍按原流程校验商品、计算运费、保存总价，已有订单用例继续覆盖公共流程。\",\"pitfall\":\"多态把按类型选实现的决策集中到装配或选择位置。由请求参数选择策略的业务决策仍需要一处明确的映射。\",\"anchor\":\"%E5%A4%9A%E6%80%81%E8%A7%A3%E5%86%B3%E4%BA%86%E4%BB%80%E4%B9%88%E9%97%AE%E9%A2%98\",\"node\":\"dispatch\",\"chapter\":2,\"follow\":[22,28]},{\"n\":25,\"title\":\"如何用面向对象设计原则控制代码的变化范围？\",\"short\":\"常见原则可以从 SOLID 说起。单一职责隔离变化来源，开闭原则让稳定逻辑通过扩展支持新需求，里氏替换保证实现守住契约，接口隔离缩小依赖面，依赖倒置让细节依附抽象。最少知识原则进一步减少跨对象的结构耦合。\",\"details\":[\"单一职责（SRP）按变化原因组织代码。开闭（OCP）先找确实频繁变化的行为，再给它设扩展点，使已有调用流程少改动。\",\"里氏替换（LSP）要求替代实现保留既有的行为约定。接口隔离（ISP）让调用方只依赖它所需的能力，读订单的客户端不必依赖取消订单的方法。\",\"依赖倒置（DIP）让业务策略使用稳定抽象，底层实现适配该抽象。构造器注入可用于装配，但即使使用了容器，业务若依赖具体数据库实现，依赖方向也没有倒置。\",\"最少知识原则建议通过直接协作者提供所需行为。让 Order 提供 deliveryCity() 比让业务层穿透多个对象的内部结构更容易维持边界。\"],\"example\":\"报价服务只依赖 TaxPolicy，新增地区税则就新增策略。各策略约定返回同一种币种和舍入规则，服务能安全替换策略，外部也不必知道税则表的结构。\",\"pitfall\":\"开闭原则关注已经识别出的变化点。每个类都配一个接口会增加阅读和装配成本，也可能无法隔离真正经常变化的部分。\",\"ref\":\"https://objectmentor.com/resources/articles/Principles_and_Patterns.pdf\",\"anchor\":\"%E9%9D%A2%E5%90%91%E5%AF%B9%E8%B1%A1%E7%9A%84%E8%AE%BE%E8%AE%A1%E5%8E%9F%E5%88%99%E4%BD%A0%E7%9F%A5%E9%81%93%E6%9C%89%E5%93%AA%E4%BA%9B%E5%90%97\",\"node\":\"iface\",\"chapter\":2,\"follow\":[28,72]},{\"n\":26,\"title\":\"同名方法何时算重载，何时算重写？\",\"short\":\"重载是同名方法有可区分的参数签名，编译器用静态类型和适用性规则选定一个签名。重写是子类型为继承的实例方法提供实现，运行时根据对象决定执行哪个方法体。返回类型不能单独区分重载，重写可使用协变的引用返回类型。\",\"details\":[\"重载可涉及本类和继承的方法。编译器依次考虑严格调用、允许装箱拆箱的宽松调用和可变参数，然后在适用候选中找最具体的方法。仅更换返回类型或参数名都不能形成重载。\",\"重写必须满足子签名等要求，访问权限不能收窄，受检异常不能新增或扩大，引用返回类型可更具体。用 @Override 让编译器检查意图。\",\"先按编译期信息选签名，再按运行时接收对象分派重写的方法体。静态方法是隐藏，private 方法不可被重写，final 方法禁止子类重写。\"],\"example\":\"p 的静态类型是 Parent，实参 text 的静态类型是 Object，编译期选 show(Object)，运行期调用 Child.show(Object)，不会换成 show(String)。\",\"code\":\"class Parent {\\n    String show(Object x) { return \\\"parent\\\"; }\\n    String show(String x) { return \\\"string\\\"; }\\n}\\nclass Child extends Parent {\\n    @Override String show(Object x) { return \\\"child\\\"; }\\n}\\n// 在调用方方法中\\nParent p = new Child();\\nObject text = \\\"hi\\\";\\nSystem.out.println(p.show(text)); // child\",\"pitfall\":\"List\\u003cString> 和 List\\u003cInteger> 在方法描述符中有相同擦除类型，不能仅靠这两个参数声明一对重载。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.4.8\",\"anchor\":\"%E9%87%8D%E8%BD%BD%E4%B8%8E%E9%87%8D%E5%86%99%E6%9C%89%E4%BB%80%E4%B9%88%E5%8C%BA%E5%88%AB\",\"node\":\"overload\",\"chapter\":2,\"follow\":[23,33]},{\"n\":27,\"title\":\"抽象类和具体类在定义与使用上有哪些区别？\",\"short\":\"具体类提供完整的可实例化类型，只要能访问合适的构造器就能创建对象。抽象类可以保留待子类实现的方法，不能直接实例化。它也可以包含构造器、字段和已实现的方法，用来建立共享状态和共同流程。\",\"details\":[\"声明了抽象方法的普通类声明必须标为 abstract。反过来，抽象类可以没有抽象方法，作者仍可禁止直接创建该类。\",\"具体子类需要把自己仍有义务实现的抽象方法补齐，也可以继承父类提供的实现。暂时不提供全部实现的子类仍可声明为 abstract。\",\"抽象父类的构造器会参与具体子类对象的初始化。父类还可把公共流程写成具体方法，通过受保护的抽象方法留出扩展点。\"],\"example\":\"抽象的 Report 把校验、生成时间和落盘写进公共流程，ExcelReport 只实现不同的渲染步骤。调用方构造 ExcelReport 后即可运行完整流程。\",\"pitfall\":\"抽象类可以有构造器和普通实例方法。构造器里调用可重写方法时，子类字段可能尚未初始化。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.1.1.1\",\"anchor\":\"%E6%8A%BD%E8%B1%A1%E7%B1%BB%E5%92%8C%E6%99%AE%E9%80%9A%E7%B1%BB%E5%8C%BA%E5%88%AB\",\"node\":\"abstract\",\"chapter\":2,\"follow\":[28,31]},{\"n\":28,\"title\":\"何时用抽象类，何时用接口？\",\"short\":\"接口适合声明多个类型都能履行的能力，一个类可实现多个接口，接口可提供默认方法但没有实例字段和构造器。抽象类适合共享父类型状态、构造过程和一部分实现。一个类的直接父类只有一个，因此要考虑继承契约与复用的边界。\",\"details\":[\"接口可以被彼此无关的类型实现，可以继承多个接口。它的字段隐式为 public static final，接口方法可按 Java 版本使用 abstract、default、static 或 private 等形式。\",\"抽象类可以有实例字段、构造器、不同可见性的方法和抽象扩展点，适合约束一族对象的共享状态或通用流程。\",\"可以先用接口定义契约，再提供一个可选的抽象基类承载通用实现。需要自定义继承层次的实现类仍然可以独立履行接口。\"],\"example\":\"JDK 的 List 给出列表契约，AbstractList 为一部分实现提供公共骨架。一个类可以直接实现 List，也可以继承 AbstractList 来复用骨架。\",\"pitfall\":\"default 方法可以调用实现对象提供的方法，但接口自身依旧没有为每个实例存储的字段。两个互不继承的接口提供冲突的默认实现时，具体类通常需要明确重写来消歧。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-9.html\",\"anchor\":\"java%E6%8A%BD%E8%B1%A1%E7%B1%BB%E5%92%8C%E6%8E%A5%E5%8F%A3%E7%9A%84%E5%8C%BA%E5%88%AB%E6%98%AF%E4%BB%80%E4%B9%88\",\"node\":\"iface\",\"chapter\":2,\"follow\":[29,30]},{\"n\":29,\"title\":\"为什么同一个类不能同时声明 abstract 和 final？\",\"short\":\"Java 在编译期禁止类同时带 abstract 和 final。abstract 表示该类不能直接创建对象，通常由子类补齐行为。final 禁止再定义子类。即使这个抽象类没有任何抽象方法，编译器也会拒绝这种修饰符组合。\",\"details\":[\"abstract 对类型施加不可直接实例化的限制。它可用于带有未实现方法的基类，也可用于没有抽象方法但仍不希望被直接构造的类。\",\"final 对类型施加不可被继承的限制。JLS 直接规定两个修饰符出现在同一个类上属于编译错误，与类体是否有抽象方法无关。\",\"抽象类可把已有实现的方法声明为 final，固定公共算法的一部分。方法若自身是 abstract，则不能同时是 final。\"],\"example\":\"abstract class Workflow 可以提供 final void run() 执行校验再调用抽象的 step()。子类实现 step()，调用者始终遵守同一运行顺序。\",\"pitfall\":\"可以让抽象基类限制允许的子类，例如使用 abstract sealed class 并按规则声明 permits。final 则完全禁止后续子类。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.1.1.2\",\"anchor\":\"%E6%8A%BD%E8%B1%A1%E7%B1%BB%E8%83%BD%E5%8A%A0final%E4%BF%AE%E9%A5%B0%E5%90%97\",\"node\":\"abstract\",\"chapter\":2,\"follow\":[27,36]},{\"n\":30,\"title\":\"接口里能写哪几种方法？从哪个 Java 版本开始？\",\"short\":\"接口的抽象实例方法默认是 public abstract。Java 8 加入带方法体的 default 和 static 方法，Java 9 允许带方法体的 private 实例方法与 private static 方法。调用或继承规则取决于这些修饰符。\",\"details\":[\"没有 private、default、static 修饰的接口方法隐式为 public abstract，声明用分号结束。具体实现类须履行抽象方法契约，可以继承已有实现。\",\"default 是带实现的公共实例方法，可供实现类继承或重写。接口的公共 static 方法属于声明它的接口，通常通过接口名调用，不会被子接口或实现类继承。\",\"private 实例方法可供接口里的实例方法复用，private static 可作为静态辅助方法。两种私有方法都不能在实现类中重写，也不会被继承。\"],\"example\":\"Parser.parse 是主要契约，parseTrimmed 是复用它的默认方法，standardName 是通过 Parser.standardName() 调用的静态方法，normalize 是接口内部的私有静态辅助方法。\",\"code\":\"interface Parser {\\n    int parse(String text);\\n    default int parseTrimmed(String text) {\\n        return parse(normalize(text));\\n    }\\n    static String standardName() { return \\\"decimal\\\"; }\\n    private static String normalize(String text) {\\n        return text.trim();\\n    }\\n}\",\"pitfall\":\"接口不能为与 Object 的非 private 方法覆盖等价的方法提供 default 实现，例如不能声明 default String toString()。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-9.html#jls-9.4\",\"anchor\":\"%E6%8E%A5%E5%8F%A3%E9%87%8C%E9%9D%A2%E5%8F%AF%E4%BB%A5%E5%AE%9A%E4%B9%89%E5%93%AA%E4%BA%9B%E6%96%B9%E6%B3%95\",\"node\":\"iface\",\"chapter\":2,\"follow\":[28,32]},{\"n\":31,\"title\":\"抽象类能否直接 new？匿名类和构造器怎么解释？\",\"short\":\"抽象类不能直接用 new 构造，但可以把它作为变量的声明类型，指向具体子类对象。new 抽象类名(...) 后跟类体的写法会声明并创建匿名子类。无论使用命名子类还是匿名子类，抽象父类的构造器都可以参与初始化。\",\"details\":[\"new Task(3) 会尝试直接实例化抽象类，编译器拒绝。Task 可以作为参数、返回值或变量类型，用来约束调用方可以使用的 API。\",\"new Task(3) { ... } 创建新的具体匿名子类，类体必须处理仍需实现的抽象方法。括号中的参数传给选定的父类构造器。\",\"父类构造器初始化的是同一个子类对象的父类状态。创建这个对象时不会另外分配一个独立的抽象父类实例。\"],\"example\":\"下面的 task 声明类型是 Task，实际类型是实现了 execute 的匿名子类。调用 execute() 时会打印 3。\",\"code\":\"abstract class Task {\\n    final int attempts;\\n    Task(int attempts) { this.attempts = attempts; }\\n    abstract void execute();\\n}\\n// 在调用方方法中\\nTask task = new Task(3) {\\n    @Override void execute() { System.out.println(attempts); }\\n};\\ntask.execute(); // 3\",\"pitfall\":\"反射取得抽象类的 Constructor 也不能直接构造实例，Constructor.newInstance 对抽象类会抛出 InstantiationException。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.9\",\"anchor\":\"%E6%8A%BD%E8%B1%A1%E7%B1%BB%E5%8F%AF%E4%BB%A5%E8%A2%AB%E5%AE%9E%E4%BE%8B%E5%8C%96%E5%90%97\",\"node\":\"abstract\",\"chapter\":2,\"follow\":[27,41]},{\"n\":32,\"title\":\"接口为什么没有构造器？接口引用里的对象从哪里来？\",\"short\":\"接口的声明规则没有构造器，也没有需要由它初始化的实例字段。接口引用指向具体实现类或匿名实现类的对象，构造和状态初始化由这个类负责。接口可以声明静态工厂，工厂创建或返回实现对象。\",\"details\":[\"构造器属于类的声明机制，负责某个类实例的初始化。接口字段都是类级常量式字段，default 方法提供行为但不会建立接口自己的实例存储。\",\"new 某接口名() 后紧跟类体会定义一个匿名实现类，new 表达式创建的是该匿名类实例。对于函数式接口，还可用 Lambda 表达式取得该接口的实现对象。\",\"接口的 static 工厂方法可隐藏实现类的选择、预校验参数或复用实例。通过接口名调用工厂后，返回结果仍由某个实现类型提供。\"],\"example\":\"Comparator.naturalOrder() 直接返回符合比较器契约的实现对象。调用方使用 Comparator 类型调用 compare，无需知道实现类如何构造。\",\"pitfall\":\"接口能初始化静态字段，但这属于接口初始化过程。初始化时执行的字段表达式不会变成实现类的构造器。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-9.html#jls-9.1.5\",\"anchor\":\"%E6%8E%A5%E5%8F%A3%E5%8F%AF%E4%BB%A5%E5%8C%85%E5%90%AB%E6%9E%84%E9%80%A0%E5%87%BD%E6%95%B0%E5%90%97\",\"node\":\"iface\",\"chapter\":2,\"follow\":[28,30]},{\"n\":33,\"title\":\"静态字段和静态方法怎样共享与调用？\",\"short\":\"静态字段属于声明它的类，每个运行时类只有一份该字段，同类实例看到的是共享值。静态方法也属于类，调用时没有隐式的 this，因此直接操作实例字段需要先取得一个对象。访问这两类成员通常用声明类的类名。\",\"details\":[\"实例字段随对象各自初始化，static 字段随类的准备与初始化建立默认值和显式初值。不同定义类加载器加载的同名类可以有不同的静态字段。\",\"static 方法可直接访问可见的静态成员。访问对象字段可以通过参数、显式创建的对象或静态字段保存的引用完成。\",\"子类声明同签名静态方法属于隐藏。通过类型限定调用可避免把静态选择误读成重写式动态分派。\"],\"example\":\"创建三个 Meter 对象时，每个对象可保存自己的读数。如果另有 Meter.totalCreated，三个构造过程都更新同一字段，之后用 Meter.totalCreated 读取。\",\"pitfall\":\"共享字段不会自动获得原子性或可见性。并发执行 count++ 可能丢失更新，计数可用 AtomicInteger 或用锁保护整个更新操作。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.3.1.1\",\"anchor\":\"%E8%A7%A3%E9%87%8Ajava%E4%B8%AD%E7%9A%84%E9%9D%99%E6%80%81%E5%8F%98%E9%87%8F%E5%92%8C%E9%9D%99%E6%80%81%E6%96%B9%E6%B3%95\",\"node\":\"modifiers\",\"chapter\":2,\"follow\":[34,37]},{\"n\":34,\"title\":\"成员内部类与静态嵌套类，创建和访问有什么区别？\",\"short\":\"普通成员内部类的对象关联一个外部类实例，外部创建时使用 outer.new Inner()，内部代码可引用 Outer.this。静态嵌套类没有隐式外部实例，直接 new Outer.Nested()，需要访问外部实例成员时显式传入对象。\",\"details\":[\"有外部实例绑定的成员内部类可以无前缀访问可见的外部成员。若名称被内部成员遮蔽，可写 Outer.this.field 来选择外部对象的字段。\",\"静态嵌套类在逻辑上归入外部类的命名空间。它可以直接访问外部类静态成员，也可以通过传入的 Outer 对象访问外部实例成员，访问控制允许时包括 private 成员。\",\"成员内部类适合明确依赖某个外部对象状态的协作者。需要独立生命周期的辅助类型可用静态嵌套类，避免长期持有不必要的外部对象。\"],\"example\":\"要读取某个容器实例的元素，迭代器可以设计成成员内部类。只负责创建容器的 Builder 可以是静态嵌套类，创建 Builder 时不需要先创建容器。\",\"pitfall\":\"Java 16 起，内部类也可声明静态成员和静态初始化器。判断两种嵌套类的关键是对象是否绑定外部实例。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.1.3\",\"anchor\":\"%E9%9D%9E%E9%9D%99%E6%80%81%E5%86%85%E9%83%A8%E7%B1%BB%E5%92%8C%E9%9D%99%E6%80%81%E5%86%85%E9%83%A8%E7%B1%BB%E7%9A%84%E5%8C%BA%E5%88%AB\",\"node\":\"nested\",\"chapter\":2,\"follow\":[35,37]},{\"n\":35,\"title\":\"内部类访问外部类的 private 方法，字节码如何实现？\",\"short\":\"源码层面，嵌套类可以访问同一顶层类范围内的私有成员。成员内部类调用外部实例方法时，还需要外部对象。旧版 javac 常生成合成访问器，Java 11 起可用类文件的 nestmate 属性，让 JVM 验证同巢关系后直接访问。\",\"details\":[\"要调用外部对象的实例方法，编译器先要拿到那个对象。对确实需要外部实例的内部类，javac 通常用额外构造参数传入外部实例，并存到类似 this$0 的合成字段。\",\"旧类文件目标的 JVM 访问控制以类为单位。javac 可以在外部类生成包级可见的合成方法，例如 access$000(Outer)，由它调用真正的 private 方法，内部类调用这个桥接入口。\",\"从 Java 11 的类文件目标起，可以借助 NestHost 和 NestMembers 表达同巢成员。JVM 检查同巢关系后可直接访问私有成员，常见的这类合成访问器便不再需要。静态嵌套类也能同巢，但访问外部实例方法时要先取得对象。\"],\"example\":\"把同一份 Vault.java 分别以 javac --release 8 和 --release 21 编译到两个目录，再用 javap -p -c -v 查看 Vault 和 Vault$Reader，能对照合成访问器与同巢属性。\",\"code\":\"class Vault {\\n    private int pin() { return 42; }\\n    class Reader {\\n        int read() { return Vault.this.pin(); }\\n    }\\n}\",\"pitfall\":\"this$0 和 access$000 是常见的 javac 产物，名称和生成条件属于编译器细节。外部实例的传递和私有成员的访问权限是两个独立问题。\",\"ref\":\"https://docs.oracle.com/javase/specs/jvms/se21/html/jvms-4.html#jvms-4.7.28\",\"anchor\":\"%E9%9D%9E%E9%9D%99%E6%80%81%E5%86%85%E9%83%A8%E7%B1%BB%E5%8F%AF%E4%BB%A5%E7%9B%B4%E6%8E%A5%E8%AE%BF%E9%97%AE%E5%A4%96%E9%83%A8%E6%96%B9%E6%B3%95-%E7%BC%96%E8%AF%91%E5%99%A8%E6%98%AF%E6%80%8E%E4%B9%88%E5%81%9A%E5%88%B0%E7%9A%84\",\"node\":\"nested\",\"chapter\":2,\"follow\":[34,45]},{\"n\":36,\"title\":\"final 用在变量、方法和类上分别有什么效果？\",\"short\":\"final 变量一旦完成赋值就不能重新赋值，引用类型仍允许对象按自己的规则改变。final 方法限制子类重写实例方法或隐藏同签名静态方法，final 类禁止子类。只有用常量表达式初始化的 final 基本类型或 String 变量才是编译期常量。\",\"details\":[\"final 局部变量可以先声明后赋值，但编译器必须能判断赋值时它尚未赋值、读取前它已赋值。空白 final 实例字段通常在初始化器或每条正常完成的构造路径中赋值。\",\"final 引用固定的是引用值。要建立不可变对象，还要考虑可变字段、构造时传入的共享对象、访问器是否泄露可变引用，以及对子类的约束。\",\"Java 内存模型还规定了 final 字段的特殊初始化可见性。正确构造并避免 this 在构造期间逸出有助于其他线程观察到正确的 final 字段，字段所指向对象的后续修改仍需遵守并发规则。\"],\"example\":\"下面的 names 可以增加元素，但把 names 重新指向另一份列表会编译失败。一个 final 工具类同样可以持有随时变化的实例或静态状态。\",\"code\":\"final java.util.List\\u003cString> names = new java.util.ArrayList\\u003c>();\\nnames.add(\\\"Ada\\\"); // 合法\\n// names = new java.util.ArrayList\\u003c>(); // 编译失败\",\"pitfall\":\"final 并不等同于不可变。public static final List 可以公开可变共享状态，除非该对象及所需的内部状态都受相应约束。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.12.4\",\"anchor\":\"java-%E4%B8%AD-final-%E4%BD%9C%E7%94%A8%E6%98%AF%E4%BB%80%E4%B9%88\",\"node\":\"modifiers\",\"chapter\":3,\"follow\":[29,38]},{\"n\":37,\"title\":\"static 能修饰什么？它和类初始化有什么关系？\",\"short\":\"static 可以声明类字段、类方法、静态成员嵌套类和类的静态初始化块。它把成员放到类级上下文，使代码无需先创建对象就能访问相应成员。首次主动使用通常会触发声明类的初始化，读取编译期常量是常见例外。\",\"details\":[\"static 字段适合表示类级状态或常量，static 方法适合不需要 this 的操作。类初始化时，普通静态字段的显式初始化式与静态代码块按源码顺序执行。\",\"创建类的实例、调用它声明的静态方法、写入它声明的静态字段或读取它声明的非常量静态字段，都是触发该类初始化的常见条件。字段即使用子类名访问，也看真正的声明类。\",\"static 成员嵌套类不需要外部对象，加载和初始化有各自的触发条件。import static 可以省略调用处的类名前缀，只影响源码的名称解析。\"],\"example\":\"对下面两个字段分别在新的 JVM 进程中做首次读取。只读 Config.PORT 不会为此触发 Config 的静态代码块。读 Config.NAME 会先初始化 Config。\",\"code\":\"class Config {\\n    static final int PORT = 8080;\\n    static final String NAME = System.getProperty(\\\"app.name\\\", \\\"demo\\\");\\n    static { System.out.println(\\\"Config 初始化\\\"); }\\n}\",\"pitfall\":\"static final 是否是编译期常量取决于类型和初始化表达式。方法调用产生的值即使只写入一次，仍然可能在运行时才确定。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-12.html#jls-12.4.1\",\"anchor\":\"java-%E4%B8%AD-static%E7%9A%84%E4%BD%9C%E7%94%A8%E6%98%AF%E4%BB%80%E4%B9%88\",\"node\":\"modifiers\",\"chapter\":3,\"follow\":[33,69]},{\"n\":38,\"title\":\"浅拷贝和深拷贝，差别在对象图的哪一层？\",\"short\":\"浅拷贝创建一个新的根对象并复制字段值，引用字段复制的是引用值，所以两个根仍可共享内部对象。深拷贝按约定进一步复制需要独立的可变子对象，目标是让副本里的修改不会透过这些引用影响原对象。\",\"details\":[\"直接赋值 b = a 连根对象都没有创建。浅拷贝则有两个不同的根，基本类型字段各自保存数值，引用字段在复制后可以指向同一个子对象。\",\"深拷贝从根沿引用进入要隔离的可变状态。已知不可变的值可以安全共享，文件句柄、线程等资源的处理取决于复制语义，需要单独约定。\",\"对象图可能含共享节点或环。如果要保留原来的拓扑，可维护按对象身份匹配的已复制映射，先登记副本，再递归处理其引用。\"],\"example\":\"new ArrayList\\u003c>(orders) 创建新列表，往副本加订单不改变旧列表长度。若两个列表中同一位置仍是同一个可变 Order，修改订单地址会同时影响两边看到的内容。\",\"pitfall\":\"List.copyOf 使返回列表不可通过其 API 增删元素，但列表里的可变元素仍可能被共享。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#clone()\",\"anchor\":\"%E6%B7%B1%E6%8B%B7%E8%B4%9D%E5%92%8C%E6%B5%85%E6%8B%B7%E8%B4%9D%E7%9A%84%E5%8C%BA%E5%88%AB\",\"node\":\"copy\",\"chapter\":4,\"follow\":[10,39]},{\"n\":39,\"title\":\"Java 中有哪些实现深拷贝的办法？\",\"short\":\"常见的三种方式是显式复制构造器或工厂、重写 clone 并复制可变字段，以及在可信的内存边界内做序列化往返。显式复制容易说明对象边界。clone 的默认字段复制较浅，序列化则要评估对象图支持、定制规则与成本。\",\"details\":[\"复制构造器或工厂显式列出共享与重建的字段。不可变值直接复用，列表和内部可变对象逐层复制。复杂对象图可以用 IdentityHashMap 记录源对象与副本的对应关系。\",\"Cloneable 表示允许 Object.clone 执行字段级复制。调用 super.clone 得到浅副本，再重建需隔离的内部对象。内部对象可通过构造器、工厂等方式复制，并不都要实现 Cloneable。\",\"对象流写出再读回可以重建可序列化对象图，通常保留图中的别名和环。默认序列化忽略 static 和 transient 字段，writeReplace、readResolve 等钩子也会改变结果，所以副本契约需验证。\"],\"example\":\"订单复制工厂可以新建 Order 和每条可变 LineItem，复用不可变的 BigDecimal 金额，再为副本生成独立的业务编号。此时更改副本商品数量不会影响原订单。\",\"pitfall\":\"不要把反序列化不可信字节流用作复制手段。即使数据来源可信，序列化往返也有额外的分配和编码成本。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/specs/serialization/index.html\",\"anchor\":\"%E5%AE%9E%E7%8E%B0%E6%B7%B1%E6%8B%B7%E8%B4%9D%E7%9A%84%E4%B8%89%E7%A7%8D%E6%96%B9%E6%B3%95%E6%98%AF%E4%BB%80%E4%B9%88\",\"node\":\"copy\",\"chapter\":4,\"follow\":[38,67]},{\"n\":40,\"title\":\"泛型怎样实现代码复用和编译期类型检查？\",\"short\":\"泛型用类型参数把算法和容器写成可复用的模板，使用时给出具体类型，由编译器检查能写入和读出哪些值。Java 主要通过擦除实现泛型，擦除后的运行时类通常相同，编译器按需生成转换和桥接方法。\",\"details\":[\"泛型可写在类、接口和方法上，例如 List\\u003cString> 与泛型方法 \\u003cT> T first(List\\u003cT>)。参数化类型让错误类型的写入在编译期报错，也省去大量手写强制转换。\",\"同一泛型类型的不同参数默认不互为子类型。用 ? extends T 接受可以安全按 T 读取的来源，用 ? super T 接受可以安全写入 T 的目的地。它们分别约束可读和可写的能力。\",\"类型变量在擦除后通常由最左侧上界表示，没有显式上界时是 Object。类文件仍可能保留 Signature 元数据，反射能读取某些声明上的泛型信息，但一般不能从对象直接恢复某个 ArrayList 实例原来使用的类型实参。\"],\"example\":\"下面的方法可从 List\\u003cInteger> 读取并写入 List\\u003cNumber>。不需要强制转换，编译器仍能阻止类型不兼容的调用。\",\"code\":\"static \\u003cT> void copyFirst(java.util.List\\u003c? extends T> from,\\n                          java.util.List\\u003c? super T> to) {\\n    to.add(from.get(0));\\n}\",\"pitfall\":\"不能直接使用 List\\u003cint>，可使用 List\\u003cInteger> 配合装箱。避免以原始类型 List 绕过检查，否则类型错误可能推迟到取值时才暴露。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.6\",\"anchor\":\"%E4%BB%80%E4%B9%88%E6%98%AF%E6%B3%9B%E5%9E%8B\",\"node\":\"generic\",\"chapter\":5,\"follow\":[18,45]},{\"n\":41,\"title\":\"Java 可以通过哪些途径创建对象？\",\"short\":\"常规方式是用 new 调用构造器。反射也能选择并调用构造器，适用于运行时才能确定类型的场景。Object.clone() 从已有对象复制字段，常规 Serializable 反序列化从字节流重建状态。回答时可以用是否执行目标类构造器来区分这些途径。\",\"details\":[\"new 表达式分配实例，字段先获得默认值，再按构造过程执行父类构造、实例字段初始化、实例初始化块及构造器体。构造器调用链可能通过 this(...) 委托到同类的另一构造器。\",\"Class.getDeclaredConstructor(参数类型...).newInstance(实参...) 会调用指定构造器，仍受访问权限约束。Class.newInstance() 已废弃，优先使用 Constructor.newInstance()。\",\"Object.clone() 一般按字段复制，不调用构造器，引用字段仍指向原来的对象。普通 Serializable 类反序列化会恢复状态并调用第一个非 Serializable 父类的无参构造器。Externalizable 则先调用自身的 public 无参构造器。\"],\"example\":\"某工厂根据配置选择支付实现，启动时反射创建实现实例，随后把对象交给业务层按接口调用。\",\"pitfall\":\"静态工厂是对外的取得对象方式，内部可以创建新对象，也可以返回缓存。一次工厂调用是否产生新对象取决于它的实现。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.9.4\",\"anchor\":\"java%E5%88%9B%E5%BB%BA%E5%AF%B9%E8%B1%A1%E6%9C%89%E5%93%AA%E4%BA%9B%E6%96%B9%E5%BC%8F\",\"node\":\"creation\",\"chapter\":6,\"follow\":[42,45]},{\"n\":42,\"title\":\"不用在调用处写 new，怎样得到一个新实例？\",\"short\":\"可以反射调用构造器、通过 Object.clone() 复制现有实例，或者由反序列化恢复对象。反射会执行选定的构造器，克隆通常复制已有字段，反序列化则按协议恢复状态。区分这三种方式，才能知道对象的不变式需要在哪里建立。\",\"details\":[\"运行时拿到 Class 后，用 getDeclaredConstructor 找到指定签名的构造器，再调用 newInstance。构造器抛出的异常通常由 InvocationTargetException 包装。\",\"Cloneable 是标记接口，没有声明 clone 方法。普通类调用 Object.clone() 时通常需要实现它，并按需要覆写 clone 来决定怎样处理可变子对象。\",\"对普通 Serializable 类，恢复字段时不会执行可序列化类的常规构造过程。Java record 的反序列化会调用规范构造器，枚举按名称解析已有常量。\"],\"example\":\"配置工具可以通过类名找到插件类型，检查它实现了约定接口，再通过公开无参构造器构造实例。示例以插件类名、接口和方法所在上下文已定义为前提。\",\"code\":\"Class\\u003c? extends Plugin> type = Class.forName(pluginClassName)\\n    .asSubclass(Plugin.class);\\nPlugin plugin = type.getConstructor().newInstance();\",\"pitfall\":\"用反序列化取得对象要考虑构造约束、类型许可与版本兼容。常规 Java 原生反序列化只应接收可信输入，并按需要配置反序列化过滤。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/io/ObjectInputStream.html\",\"anchor\":\"java%E5%88%9B%E5%BB%BA%E5%AF%B9%E8%B1%A1%E9%99%A4%E4%BA%86new%E8%BF%98%E6%9C%89%E5%88%AB%E7%9A%84%E4%BB%80%E4%B9%88%E6%96%B9%E5%BC%8F\",\"node\":\"creation\",\"chapter\":6,\"follow\":[39,66]},{\"n\":43,\"title\":\"一个 new 出来的对象什么时候能被 GC 回收？\",\"short\":\"GC 主要按可达性判断对象寿命。从活动线程、JNI 引用等根沿强引用无法再到达对象时，还要考虑软、弱等特殊引用的规则。满足回收条件只代表可以回收，实际回收时间取决于收集器的触发时机与收集范围。\",\"details\":[\"普通引用组成对象图。将一个变量赋成 null 只移除一条引用路径，集合、静态字段或其他仍可达的对象可能继续保留它。\",\"只要根没有通往一组对象的可达路径，组内对象互相引用也可以被回收。局部变量的词法作用域也无法保证对象一直活到作用域末尾，优化器可识别最后一次实际使用。\",\"弱引用、软引用和虚引用由 GC 按各自语义处理。System.gc() 是请求，不能用它保证指定对象立即释放。文件句柄和连接的生命周期应通过 close 或 try-with-resources 管理。\"],\"example\":\"某页面的数据模型已关闭，但仍被应用级监听器列表引用。只要列表由长生命周期对象持有，GC 就会保留这个模型，直到解除注册或整条路径消失。\",\"pitfall\":\"即使程序不再使用某个对象，只要存在强可达路径，GC 就会保留它。无界缓存和长期运行线程的 ThreadLocal 都可能造成这类内存滞留。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/ref/package-summary.html\",\"anchor\":\"new%E5%87%BA%E7%9A%84%E5%AF%B9%E8%B1%A1%E4%BB%80%E4%B9%88%E6%97%B6%E5%80%99%E5%9B%9E%E6%94%B6\",\"node\":\"creation\",\"chapter\":6,\"follow\":[10,41]},{\"n\":44,\"title\":\"怎样读取 private 字段或调用 private 方法？\",\"short\":\"优先使用类提供的 getter 或业务方法，让类维护自己的访问约束。确需深度反射时，可以先用 getDeclaredField 定位声明，再用 trySetAccessible 尝试开启访问，最后用 Field.get 读取。跨模块访问还取决于目标包是否对调用方开放。\",\"details\":[\"getField 查找 public 字段，包含继承来的公开字段。getDeclaredField 查本类声明的字段，包括 private。字段在父类声明时，要向父类的 Class 对象查找。查找和实际访问是两个步骤。\",\"trySetAccessible 在无法压制访问检查时可返回 false。setAccessible(true) 在模块封装不允许时可抛 InaccessibleObjectException。跨模块访问非公开成员通常需要目标包对调用模块 opens，仅有 exports 通常不够。\",\"Field.get 的接收者应为声明类或其子类的实例，静态字段读取可传 null。读取权限也不能推出修改权限，record 的 final 字段、static final 字段等有额外限制。\",\"私有方法同理，先用 getDeclaredMethod 按名称和参数类型查找，再尝试开启访问，最后用 Method.invoke 调用。目标方法抛出的异常会包在 InvocationTargetException 中。\"],\"example\":\"自家模块内的诊断代码可以用反射读取某个快照对象的调试字段，若权限不满足则停止，不假设任意库内部字段都可访问。\",\"code\":\"var field = Snapshot.class.getDeclaredField(\\\"status\\\");\\nif (!field.trySetAccessible()) {\\n    throw new IllegalStateException(\\\"status 字段未开放\\\");\\n}\\nObject status = field.get(snapshot);\",\"pitfall\":\"private 限制的是字段的访问，字段引用所指向的对象可能通过其他公开 API 被获得。读取字段也不会复制对象。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/reflect/AccessibleObject.html\",\"anchor\":\"%E5%A6%82%E4%BD%95%E8%8E%B7%E5%8F%96%E7%A7%81%E6%9C%89%E5%AF%B9%E8%B1%A1\",\"node\":\"modules\",\"chapter\":6,\"follow\":[45,48]},{\"n\":45,\"title\":\"Java 反射是什么？能在运行时做什么？\",\"short\":\"反射允许程序在运行时检查类型结构，并按实际取得的成员信息去构造对象、读写字段、调用方法或读取注解。入口通常是 Class，再分别用 Constructor、Field、Method 完成操作。成员能否被访问仍受 Java 权限和模块边界约束。\",\"details\":[\"已知类型时可用类型字面量 Foo.class，已有对象时可用 getClass，动态类名可用 Class.forName。单参数 Class.forName 通常会初始化类，只做类型检查时可用带 initialize 参数的重载传 false。\",\"getMethod 通过方法名和参数类型查找 public 方法，包含继承的公开方法。getDeclaredMethod 在本类中查找声明，可能得到 private 方法，但不把父类的声明直接算进来。\",\"Method.invoke 会在运行时校验接收者、参数和访问权限。被调用方法自己抛出的异常由 InvocationTargetException 包装，应查看 getCause() 以区分目标失败与反射调用失败。\"],\"example\":\"配置指定校验器的方法名时，工具可以用类型和参数签名定位方法，在启动时验证它存在，避免请求处理到一半才发现配置拼错。\",\"pitfall\":\"反射可以检查泛型声明保留的签名信息。运行时的 List 实例通常不会因为实际放入了某种对象，就能恢复调用方声明的泛型实参。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Class.html\",\"anchor\":\"%E4%BB%80%E4%B9%88%E6%98%AF%E5%8F%8D%E5%B0%84\",\"node\":\"reflection\",\"chapter\":7,\"follow\":[44,46]},{\"n\":46,\"title\":\"反射在业务工具和框架里具体用在哪里？\",\"short\":\"反射擅长把运行时的类型和元数据变成实际操作。容器可定位构造器并注入依赖，数据绑定工具可建立字段到属性的映射，测试工具可发现测试方法并调用。框架常把发现和绑定放在启动阶段，再复用已验证的元数据。\",\"details\":[\"依赖注入可以根据构造器参数确定依赖类型，再用构造器创建对象。发现候选类型可以读取 class 文件或预生成索引，只有需要加载或实例化时才进入相应运行时路径。\",\"ORM 或 JSON 映射常先检查构造器、属性、泛型签名和映射注解，再选择 setter、字段、record 构造器或自定义适配器。\",\"测试、路由注册和插件调用也可以把注解或外部配置转成调用入口。对于类型明确的业务代码，接口调用可以让编译器尽早发现签名错误。\"],\"example\":\"HTTP 路由框架读取控制器方法上的路径元数据，注册时核对请求参数如何映射到 Java 参数，请求抵达后再使用预先建立的调用入口。\",\"pitfall\":\"框架读取注解、调用反射 API、生成代理是不同步骤。看到注解并不能推断框架一定在每次请求时都走反射。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Class.html\",\"anchor\":\"%E5%8F%8D%E5%B0%84%E5%9C%A8%E4%BD%A0%E5%B9%B3%E6%97%B6%E5%86%99%E4%BB%A3%E7%A0%81%E6%88%96%E8%80%85%E6%A1%86%E6%9E%B6%E4%B8%AD%E7%9A%84%E5%BA%94%E7%94%A8%E5%9C%BA%E6%99%AF%E6%9C%89%E5%93%AA%E4%BA%9B\",\"node\":\"reflection\",\"chapter\":7,\"follow\":[45,47]},{\"n\":47,\"title\":\"Java 注解为什么能参与校验、生成代码或框架配置？\",\"short\":\"注解用 @interface 定义一组有类型的元数据。编译器按 Target 检查使用位置，按 Retention 决定保留阶段。编译器、注解处理器或运行时框架读取这些信息，并分别执行检查、生成代码、路由注册等行为。\",\"details\":[\"注解元素像无参方法，可以有 default 值，返回类型限于基本类型、String、Class、枚举、其他注解及这些类型的一维数组等。\",\"编译期处理器通过语言模型读取声明和注解，可生成源文件或资源。运行时框架通过反射等方式读取运行期可见注解，并按自己的规则解释。\",\"JVM class 文件用注解属性存放保留的元数据。注解的保留阶段、标记对象和消费者共同决定它在什么时候产生作用。\"],\"example\":\"给控制器方法加一个运行期保留的 @Route(\\\"/orders\\\")。只有启动时负责扫描的代码读取该注解并注册路径后，请求才会进入对应方法。\",\"code\":\"import java.lang.annotation.*;\\n\\n@Target(ElementType.METHOD)\\n@Retention(RetentionPolicy.RUNTIME)\\n@interface Route {\\n    String value();\\n}\",\"pitfall\":\"注解可以表达意图，功能来自读取和处理它的代码。自定义注解如果没有消费者，就只是一段元数据。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-9.html#jls-9.6\",\"anchor\":\"%E8%83%BD%E8%AE%B2%E4%B8%80%E8%AE%B2java%E6%B3%A8%E8%A7%A3%E7%9A%84%E5%8E%9F%E7%90%86%E5%90%97\",\"node\":\"annotation\",\"chapter\":8,\"follow\":[48,49]},{\"n\":48,\"title\":\"运行时是怎样把注解字节解析成注解对象的？\",\"short\":\"运行时可见的注解存放在 class 文件的注解属性里。解析器读取注解类型、元素名和元素值，再和注解类型的默认值合并。以 OpenJDK 21 为例，反射取得的注解实例由动态代理实现，调用元素方法时由处理器返回对应值。\",\"details\":[\"RuntimeVisibleAnnotations 存放类、字段、方法等声明的运行时可见注解。参数和类型使用位置有各自的属性，元素默认值保存在注解类型元素方法的 AnnotationDefault 属性里。\",\"OpenJDK 的 AnnotationParser 读取字节并利用常量池解码，从默认值建立元素值表，再用显式值覆盖，随后通过 Proxy 与 AnnotationInvocationHandler 实现注解接口。\",\"默认值在读取时生效。若旧业务 class 没有显式提供该元素，更新注解类型的默认值后，重新运行读取旧 class 可以看到新默认值。\"],\"example\":\"如果 @Route 的 timeout() 默认 500，标记 @Route(timeout = 200) 的方法经反射读取时得到 200。省略该参数的方法得到声明的默认值。\",\"pitfall\":\"Proxy 是 OpenJDK 的实现方式。业务代码应依赖注解接口、annotationType() 和 AnnotatedElement 的契约，避免依赖代理生成类的名称。\",\"ref\":\"https://raw.githubusercontent.com/openjdk/jdk21u/master/src/java.base/share/classes/sun/reflect/annotation/AnnotationParser.java\",\"anchor\":\"%E5%AF%B9%E6%B3%A8%E8%A7%A3%E8%A7%A3%E6%9E%90%E7%9A%84%E5%BA%95%E5%B1%82%E5%AE%9E%E7%8E%B0%E4%BA%86%E8%A7%A3%E5%90%97\",\"node\":\"annotation\",\"chapter\":8,\"follow\":[44,49]},{\"n\":49,\"title\":\"注解作用在哪些地方，保留到哪个阶段？\",\"short\":\"Target 限定位置，例如类、方法、字段或类型使用。Retention 决定保留阶段，SOURCE 可供源码处理和编译使用，CLASS 保存进 class 但普通运行时反射不可见，RUNTIME 还能在运行时读取。类级继承另由 Inherited 控制。\",\"details\":[\"未写 Retention 时默认为 CLASS。用于泛型实参、类型转换等位置的注解用 TYPE_USE 描述，运行时读取类型使用注解时应查看 AnnotatedType 系列 API。\",\"普通局部变量声明注解即便写 RUNTIME，也不会作为局部变量的声明注解写入 class。局部变量类型上的类型使用注解按类型注解规则处理。\",\"当注解类型带 @Inherited 且查询对象是 Class 时，getAnnotation 可沿父类查找。方法重写和接口实现不自动继承注解。可重复注解用 getAnnotationsByType 处理容器。\"],\"example\":\"检查 @Audit 时，如果它只允许标在方法且在运行时可见，框架需要读取实际参与调用的方法元数据。若设计要求实现类继承接口方法的审计标记，应在框架中显式查找接口。\",\"pitfall\":\"Retention 决定是否有运行时数据，Target 决定数据标在哪里。RUNTIME 和 TYPE_USE 同时出现，也不能用声明级 getAnnotation 读取所有类型使用位置。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/reflect/AnnotatedElement.html\",\"anchor\":\"java%E6%B3%A8%E8%A7%A3%E7%9A%84%E4%BD%9C%E7%94%A8%E5%9F%9F%E5%91%A2\",\"node\":\"retention\",\"chapter\":8,\"follow\":[47,48]},{\"n\":50,\"title\":\"Java 的异常体系怎样划分？\",\"short\":\"可抛出的类型都继承自 Throwable，主要分为 Error 和 Exception。Error 与 RuntimeException 及其子类属于非受检异常，其他 Throwable 类型属于受检异常。对于可能逃出方法的受检异常，编译器要求方法捕获或在方法的 throws 子句中声明。\",\"details\":[\"IOException、SQLException 等受检异常通常代表调用方需要纳入接口契约的失败。NullPointerException、IllegalArgumentException 等非受检异常常用于空引用或违反调用前置条件。\",\"Error 表示应用通常难以在局部恢复的失败，例如虚拟机资源耗尽或链接失败。基础设施可按边界需要记录失败并执行退出清理。\",\"异常对象可包含消息、栈轨迹、cause 与 suppressed exceptions。跨层封装时保留 cause，才能定位原始异常和首次失败位置。\"],\"example\":\"读取本地配置可能抛 IOException，调用方可以报告配置文件不可用。若方法拿到非法端口参数，可直接抛 IllegalArgumentException，清楚描述调用条件。\",\"pitfall\":\"受检与非受检是编译检查规则，不代表异常是否在运行时发生，也不能单凭这一点判断某个故障应怎样恢复。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-11.html\",\"anchor\":\"%E4%BB%8B%E7%BB%8D%E4%B8%80%E4%B8%8Bjava%E5%BC%82%E5%B8%B8\",\"node\":\"exceptions\",\"chapter\":9,\"follow\":[51,52]},{\"n\":51,\"title\":\"Java 可以用哪些机制处理或传播异常？\",\"short\":\"try/catch 用来在当前层处理异常，finally 适合执行收尾动作，AutoCloseable 资源优先交给 try-with-resources。当前层无法处理时，可以通过 throws 声明受检异常，或者用 throw 抛出含原始 cause 的业务异常。\",\"details\":[\"catch 按声明顺序找第一个类型匹配的分支。多个 catch 应先放更具体的异常，或者用 A | B 合并相同处理逻辑。\",\"try-with-resources 按初始化相反的顺序关闭已成功打开的资源。业务代码已经抛出异常时，后续 close 的异常通常会被记录为被抑制异常。\",\"在能够恢复、转换协议或提供上下文的边界处理。包装时保留原异常作为 cause，记录时保留请求上下文并避免重复日志。\"],\"example\":\"读配置时直接把 BufferedReader 放进 try-with-resources。若读取和关闭都失败，读失败作为主异常，关闭失败可通过 getSuppressed() 查看。\",\"code\":\"try (var reader = java.nio.file.Files.newBufferedReader(path)) {\\n    return reader.readLine();\\n} catch (java.io.IOException e) {\\n    throw new java.io.UncheckedIOException(\\\"读取配置失败\\\", e);\\n}\",\"pitfall\":\"空 catch 会丢失失败信号。捕获 InterruptedException 后若决定不继续向上抛，通常需要重新设置线程中断状态。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-14.html#jls-14.20\",\"anchor\":\"java%E5%BC%82%E5%B8%B8%E5%A4%84%E7%90%86%E6%9C%89%E5%93%AA%E4%BA%9B\",\"node\":\"exceptions\",\"chapter\":9,\"follow\":[52,53]},{\"n\":52,\"title\":\"throw 和 throws 分别负责什么？\",\"short\":\"throw 是执行语句，运行到这里会抛出异常并中断当前控制流。throws 是方法或构造器声明中的异常条款，用来声明可能向调用方传播的异常类型。\",\"details\":[\"throw 后面是求值结果为 Throwable 子类型的表达式。若结果为 null，运行时抛出 NullPointerException。\",\"throws 后面是类型列表。只要受检异常可能越过方法边界，就需要由方法捕获处理或声明，由上一层继续履行处理义务。\",\"重写方法可以省略或收窄受检异常范围，不能任意增加超出父类型契约的受检异常。RuntimeException 可以列在 throws 子句中，编译器不强制声明。\"],\"example\":\"方法声明写有 throws IOException，调用者要捕获这个受检异常或继续声明。实际读取失败时，底层 API 或本方法的 throw 语句才会触发异常控制流。\",\"code\":\"static String readConfig(java.nio.file.Path path)\\n        throws java.io.IOException {\\n    String content = java.nio.file.Files.readString(path);\\n    if (content.isBlank()) {\\n        throw new java.io.IOException(\\\"配置内容为空\\\");\\n    }\\n    return content;\\n}\",\"pitfall\":\"按 Java 语言规范，方法签名由方法名、类型参数和形参类型决定。两个方法仅有 throws 子句不同，无法据此重载。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-11.html#jls-11.2\",\"anchor\":\"%E6%8A%9B%E5%87%BA%E5%BC%82%E5%B8%B8%E4%B8%BA%E4%BB%80%E4%B9%88%E4%B8%8D%E7%94%A8throws\",\"node\":\"exceptions\",\"chapter\":9,\"follow\":[50,53]},{\"n\":53,\"title\":\"try、catch、finally 各在什么时候执行？\",\"short\":\"先执行 try。正常走完就跳过 catch。若抛出异常，选第一个类型匹配的 catch，找不到就准备向上传播。通常离开 try 或 catch 前会执行 finally。finally 如果正常结束，原来的返回或异常继续生效。\",\"details\":[\"try 内出异常时，抛出位置之后的语句不再执行。进入匹配的 catch 后，该 catch 再抛出的异常不会被同一组其他 catch 接住。\",\"return 表达式会先求值，然后进入 finally。若 finally 正常结束，就使用先前求得的值。若 finally 抛异常或再次 return，先前的控制流结果会被覆盖。\",\"JVM 退出、进程被强制终止或代码一直卡在 try 内时，finally 可能无法执行。资源管理优先使用 try-with-resources 来明确主异常和关闭异常的关系。\"],\"example\":\"以下代码依次打印 try、catch、finally。抛异常之后，try 内本来可能存在的后续业务逻辑会被跳过。\",\"code\":\"try {\\n    System.out.println(\\\"try\\\");\\n    throw new IllegalArgumentException();\\n} catch (IllegalArgumentException e) {\\n    System.out.println(\\\"catch\\\");\\n} finally {\\n    System.out.println(\\\"finally\\\");\\n}\",\"pitfall\":\"能执行 finally 不等于执行所有后续语句。finally 自己抛出的异常会改变传播结果。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-14.html#jls-14.20.2\",\"anchor\":\"try-catch%E4%B8%AD%E7%9A%84%E8%AF%AD%E5%8F%A5%E8%BF%90%E8%A1%8C%E6%83%85%E5%86%B5\",\"node\":\"flow\",\"chapter\":9,\"follow\":[51,54]},{\"n\":54,\"title\":\"try 返回 a、finally 返回 b，最终返回哪个值？\",\"short\":\"最终返回 b。try 的 return 先求出 a，返回动作在退出前暂缓，随后执行 finally。finally 中又执行一次 return，它的控制流结果会覆盖原本待执行的返回。如果 finally 正常结束，之前计算出来的 a 才会返回。\",\"details\":[\"Java 将 return、throw 等归为非正常完成。try 以某个原因结束后会进入 finally，finally 正常完成则保留原原因，否则采用 finally 自己的结束原因。\",\"try 求值时保存的是当时的值。若返回的是对象引用，finally 修改同一个对象的内容，调用者能看到修改。把局部变量改指向另一个对象则不会替换已保存的引用。\",\"finally 里的 return 也可能盖住原本要传播的异常。资源收尾通常应让 finally 正常完成，并保留原有返回或异常。\"],\"example\":\"调用 pick() 得到 b。即使 try 改成 throw new IllegalStateException()，这个 finally 的 return 仍会使调用者收到 b。\",\"code\":\"static String pick() {\\n    try {\\n        return \\\"a\\\";\\n    } finally {\\n        return \\\"b\\\";\\n    }\\n}\",\"pitfall\":\"把 finally 理解成在 return 表达式求值前执行，会误判基本类型局部变量修改、对象引用重绑定及可变对象内容变化。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-14.html#jls-14.20.2\",\"anchor\":\"try-return-a-finally-return-b-%E8%BF%99%E6%9D%A1%E8%AF%AD%E5%8F%A5%E8%BF%94%E5%9B%9E%E5%95%A5\",\"node\":\"flow\",\"chapter\":9,\"follow\":[52,53]},{\"n\":55,\"title\":\"Object 的常用方法有哪些？按作用怎样记？\",\"short\":\"可按用途记 Object 方法。对象身份和表示有 getClass、equals、hashCode、toString，复制有受保护的 clone，监视器协作有 wait、notify、notifyAll。此外还有已被标记为待移除的 finalize。\",\"details\":[\"getClass 返回实际运行时类型。Object 的 equals 默认按身份判断，hashCode 返回哈希值，toString 默认包含运行时类名及哈希值的十六进制表示。\",\"Object.clone() 是 protected 方法。通常需要 Cloneable，并由类决定是否对外公开复制方法。它的默认字段复制语义是浅拷贝。\",\"wait 有三个重载，调用线程必须持有对象监视器。wait 会释放该对象的监视器并在返回前重新获取。notify 和 notifyAll 发出唤醒信号，等待线程还要重新竞争锁。\"],\"example\":\"共享队列中，消费者在 synchronized(queue) 内用 while 检查队列是否为空，空时调用 queue.wait()。生产者修改队列后在同一监视器上通知消费者。\",\"pitfall\":\"默认 toString 里的十六进制部分不保证是内存地址。finalize 的调度也不可靠，资源释放应通过明确的关闭协议。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html\",\"anchor\":\"object%E7%B1%BB%E6%9C%89%E5%93%AA%E4%BA%9B%E6%96%B9%E6%B3%95\",\"node\":\"contract\",\"chapter\":10,\"follow\":[56,57]},{\"n\":56,\"title\":\"什么时候用 ==，什么时候用 equals？\",\"short\":\"基本类型的 == 按对应规则比较值，引用之间的 == 比较是否指向同一个对象或同为 null。equals 是实例方法，由具体类型定义相等语义。Object 默认仍比较身份，String 等类型则按内容比较，可能为 null 时可用 Objects.equals。\",\"details\":[\"两个不同 String 实例可以内容一致，此时 equals 为 true，而引用 == 为 false。字符串常量池可能让部分相同内容的引用恰好相同。\",\"数组继承 Object.equals 的身份语义，比较数组内容用 Arrays.
