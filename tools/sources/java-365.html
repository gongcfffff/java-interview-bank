 本地缓存；二级缓存按 Mapper namespace 跨 Session 共享（需配置）。 具体来说：一级缓存生命周期与 Session 相关，重复相同查询可命中，但更新会清理相关缓存。；二级缓存需要启用映射器 cache，存在序列化、失效、事务提交等约束。；分布式更新或多服务部署容易出现数据不一致，生产需谨慎使用二级缓存。。\",\"code\":\"\"},{\"id\":74,\"title\":\"resultType 和 resultMap 有什么区别？\",\"node\":\"mapping\",\"cat\":\"mybatis\",\"short\":\"resultType 声明简单结果对象类型；resultMap 用显式映射规则处理复杂列名及关联。\",\"details\":[\"列名与属性名基本对应时，resultType 简洁。\",\"resultMap 可指定 id/result、association、collection、嵌套结果等。\",\"复杂关联需要考虑 N+1 查询和嵌套映射的数据量。\"],\"example\":\"订单与订单项 1:N 联表结果可通过 resultMap collection 聚合。\",\"trap\":\"resultMap 不能自动解决 SQL 结果重复行、分页或 N+1 性能问题。\",\"interview\":\"resultType 声明简单结果对象类型；resultMap 用显式映射规则处理复杂列名及关联。 具体来说：列名与属性名基本对应时，resultType 简洁。；resultMap 可指定 id/result、association、collection、嵌套结果等。；复杂关联需要考虑 N+1 查询和嵌套映射的数据量。。\",\"code\":\"\"},{\"id\":75,\"title\":\"MybatisPlus和Mybatis的区别？\",\"node\":\"mybatisplus\",\"cat\":\"mybatis\",\"short\":\"MyBatis-Plus 是基于 MyBatis 的增强工具，提供通用 CRUD、Wrapper 等便利 API。\",\"details\":[\"MyBatis 保留高度显式的 SQL 配置和映射能力。\",\"MyBatis-Plus 在其上添加 BaseMapper、条件构造器、分页/插件与常见工程功能。\",\"复杂 SQL 仍可自定义 Mapper；注意插件链、生成 SQL 与索引使用。\"],\"example\":\"UserMapper extends BaseMapper\\u003cUser> 可以直接 selectById；复杂报表写专用 SQL。\",\"trap\":\"增强工具不意味着 SQL 更安全或性能自动更优。\",\"interview\":\"MyBatis-Plus 是基于 MyBatis 的增强工具，提供通用 CRUD、Wrapper 等便利 API。 具体来说：MyBatis 保留高度显式的 SQL 配置和映射能力。；MyBatis-Plus 在其上添加 BaseMapper、条件构造器、分页/插件与常见工程功能。；复杂 SQL 仍可自定义 Mapper；注意插件链、生成 SQL 与索引使用。。\",\"code\":\"\"},{\"id\":76,\"title\":\"MyBatis运用了哪些常见的设计模式？\",\"node\":\"patterns\",\"cat\":\"mybatis\",\"short\":\"MyBatis 使用代理、工厂、构建器、模板、责任链/插件拦截等思路。\",\"details\":[\"MapperProxy 在接口调用时执行映射 SQL。\",\"SqlSessionFactoryBuilder 构建 SqlSessionFactory，SqlSessionFactory 创建 Session。\",\"插件 Interceptor 包装 Executor、StatementHandler 等，ResultSetHandler 负责结果适配。\"],\"example\":\"Mapper 接口无需手写实现即可运行，关键是动态代理。\",\"trap\":\"没有一种模式能概括整个框架；要对应具体组件说明职责。\",\"interview\":\"MyBatis 使用代理、工厂、构建器、模板、责任链/插件拦截等思路。 具体来说：MapperProxy 在接口调用时执行映射 SQL。；SqlSessionFactoryBuilder 构建 SqlSessionFactory，SqlSessionFactory 创建 Session。；插件 Interceptor 包装 Executor、StatementHandler 等，ResultSetHandler 负责结果适配。。\",\"code\":\"\"},{\"id\":77,\"title\":\"了解SpringCloud吗，说一下他和SpringBoot的区别\",\"node\":\"cloud\",\"cat\":\"cloud\",\"short\":\"Spring Boot 侧重单个应用的配置与运行；Spring Cloud 侧重分布式服务治理的基础能力。\",\"details\":[\"Boot 提供容器启动、自动配置、Web/数据等应用内能力。\",\"Cloud 提供服务发现、配置管理、网关、负载均衡、熔断等集成接口或生态组件。\",\"Cloud 依赖 Boot/Framework 生态，并须使用兼容的版本组合。\"],\"example\":\"订单服务基于 Boot 构建，服务发现和网关由 Cloud 相关组件集成。\",\"trap\":\"Spring Cloud 不等于只安装一个全能 Server，具体能力需按组件引入。\",\"interview\":\"Spring Boot 侧重单个应用的配置与运行；Spring Cloud 侧重分布式服务治理的基础能力。 具体来说：Boot 提供容器启动、自动配置、Web/数据等应用内能力。；Cloud 提供服务发现、配置管理、网关、负载均衡、熔断等集成接口或生态组件。；Cloud 依赖 Boot/Framework 生态，并须使用兼容的版本组合。。\",\"code\":\"\"},{\"id\":78,\"title\":\"用过哪些微服务组件？\",\"node\":\"cloudcomponents\",\"cat\":\"cloud\",\"short\":\"按请求链路说明注册发现、网关、配置、负载均衡、远程调用、熔断、可观测性。\",\"details\":[\"注册发现可用 Consul/Nacos/Eureka 等生态选择；网关可用 Spring Cloud Gateway。\",\"远程调用常用 OpenFeign 或 RestClient/WebClient 配合负载均衡。\",\"故障隔离可用 Resilience4j / CircuitBreaker；链路观测配 Micrometer/Tracing。\"],\"example\":\"请求进入 Gateway → 服务发现 → 负载均衡 → OrderService → 支付服务（超时/熔断）。\",\"trap\":\"组件选择因公司技术栈而不同；不要把所有第三方项目说成 Spring Cloud 核心自带。\",\"interview\":\"按请求链路说明注册发现、网关、配置、负载均衡、远程调用、熔断、可观测性。 具体来说：注册发现可用 Consul/Nacos/Eureka 等生态选择；网关可用 Spring Cloud Gateway。；远程调用常用 OpenFeign 或 RestClient/WebClient 配合负载均衡。；故障隔离可用 Resilience4j / CircuitBreaker；链路观测配 Micrometer/Tracing。。\",\"code\":\"\"},{\"id\":79,\"title\":\"负载均衡有哪些算法？\",\"node\":\"balance\",\"cat\":\"cloud\",\"short\":\"典型轮询、随机、加权轮询、最少连接、最短响应与一致性哈希等。\",\"details\":[\"轮询简单均匀，权重方式允许高配置实例承载更多请求。\",\"最少连接/最短响应依赖实时指标，可能更贴合负载但实现复杂。\",\"一致性哈希适合按 key 保持相似路由，但需考虑实例变更、热点与健康检查。\"],\"example\":\"三台节点容量 1:2:4，可用加权策略分配预期请求比例。\",\"trap\":\"负载均衡算法不保证每个时刻绝对均匀，延迟和请求成本差异很大。\",\"interview\":\"典型轮询、随机、加权轮询、最少连接、最短响应与一致性哈希等。 具体来说：轮询简单均匀，权重方式允许高配置实例承载更多请求。；最少连接/最短响应依赖实时指标，可能更贴合负载但实现复杂。；一致性哈希适合按 key 保持相似路由，但需考虑实例变更、热点与健康检查。。\",\"code\":\"\"},{\"id\":80,\"title\":\"如何实现一直均衡给一个用户？\",\"node\":\"sticky\",\"cat\":\"cloud\",\"short\":\"如果要同一用户尽量命中固定节点，可按用户 ID 做一致性哈希或粘性会话，但最好服务无状态。\",\"details\":[\"从 cookie/token 或经认证的用户标识生成稳定路由 key。\",\"一致性哈希在实例增减时减少迁移，但节点故障会触发重映射。\",\"关键会话状态更推荐放 Redis/数据库，降低单实例故障和扩容风险。\"],\"example\":\"网关根据 userId 一致性哈希路由到同一组实例。\",\"trap\":\"粘性路由不等于一定命中同一实例；服务下线和弹性伸缩时必须有兜底。\",\"interview\":\"如果要同一用户尽量命中固定节点，可按用户 ID 做一致性哈希或粘性会话，但最好服务无状态。 具体来说：从 cookie/token 或经认证的用户标识生成稳定路由 key。；一致性哈希在实例增减时减少迁移，但节点故障会触发重映射。；关键会话状态更推荐放 Redis/数据库，降低单实例故障和扩容风险。。\",\"code\":\"\"},{\"id\":81,\"title\":\"介绍一下服务熔断\",\"node\":\"circuit\",\"cat\":\"cloud\",\"short\":\"以 Resilience4j 为例，熔断器处于 OPEN 时拒绝经过该熔断器的新调用，进入 HALF_OPEN 后才放行有限的探测调用。\",\"details\":[\"CLOSED 正常放行并记录调用结果。达到配置的最小调用数后，失败率或慢调用率达到阈值可触发 OPEN。\",\"OPEN 的新调用会收到 CallNotPermittedException。到达配置的等待时间后，熔断器可进入 HALF_OPEN，放行有限数量的探测调用。\",\"HALF_OPEN 根据探测调用的失败率或慢调用率决定恢复 CLOSED，还是重新进入 OPEN。\"],\"example\":\"支付调用的失败率触发熔断后，新的支付调用会快速失败。等待期后，有限的探测调用用于判断支付服务是否已恢复。\",\"trap\":\"熔断不是把故障彻底修好，也不是每个异常都应计入失败率。\",\"interview\":\"以 Resilience4j 为例，熔断器处于 OPEN 时拒绝经过该熔断器的新调用，进入 HALF_OPEN 后才放行有限的探测调用。 CLOSED 按窗口记录调用。探测结果达到恢复条件时回到 CLOSED，否则重新进入 OPEN。\",\"code\":\"\"},{\"id\":82,\"title\":\"介绍一下服务降级\",\"node\":\"degrade\",\"cat\":\"cloud\",\"short\":\"降级是在服务压力大或依赖异常时保留核心能力，牺牲非关键功能或返回替代结果。\",\"details\":[\"预先定义可降级模块和可接受的兜底结果。\",\"触发条件可来自熔断、限流、超时、手动开关等。\",\"重要金融/库存数据不能随便返回伪造成功，降级必须符合业务正确性。\"],\"example\":\"推荐系统不可用时首页显示热门商品缓存，订单提交不能伪造已支付。\",\"trap\":\"降级是业务策略，不等于所有请求都简单返回 null。\",\"interview\":\"降级是在服务压力大或依赖异常时保留核心能力，牺牲非关键功能或返回替代结果。 具体来说：预先定义可降级模块和可接受的兜底结果。；触发条件可来自熔断、限流、超时、手动开关等。；重要金融/库存数据不能随便返回伪造成功，降级必须符合业务正确性。。\",\"code\":\"\"},{\"id\":83,\"title\":\"限流、熔断和降级有什么区别？\",\"node\":\"resilience\",\"cat\":\"cloud\",\"short\":\"限流限制进入流量，熔断依据故障停止部分依赖调用，降级提供功能或结果上的退化策略。\",\"details\":[\"限流在入口保护容量，如令牌桶、漏桶、固定/滑动窗口。\",\"熔断根据失败/慢调用状态暂时不请求有问题的下游。\",\"降级说明被限制或故障后业务如何优雅退化，它可以由前两者触发。\"],\"example\":\"秒杀入口限流，支付故障时熔断，商品详情用缓存降级。\",\"trap\":\"三者目标相关但语义不同；限流不是只因下游故障触发。\",\"interview\":\"限流限制进入流量，熔断依据故障停止部分依赖调用，降级提供功能或结果上的退化策略。 具体来说：限流在入口保护容量，如令牌桶、漏桶、固定/滑动窗口。；熔断根据失败/慢调用状态暂时不请求有问题的下游。；降级说明被限制或故障后业务如何优雅退化，它可以由前两者触发。。\",\"code\":\"\"},{\"id\":84,\"title\":\"微服务调用失败后，能不能直接重试？\",\"node\":\"retry\",\"cat\":\"cloud\",\"short\":\"不能无脑重试，要先识别操作是否幂等、错误是否瞬时、超时预算是否允许。\",\"details\":[\"GET 查询或幂等写入更适合有限重试；扣款/下单等非幂等操作须使用幂等键和去重。\",\"使用指数退避+抖动、最大次数/总超时，防止重试风暴。\",\"可用断路器、限流、消息补偿及状态查询应对不确定提交结果。\"],\"example\":\"支付请求超时不代表支付失败，先按 requestId 查询支付状态再决定是否重试。\",\"trap\":\"连接超时、读超时都不等于服务端没处理请求；重试可能放大故障。\",\"interview\":\"不能无脑重试，要先识别操作是否幂等、错误是否瞬时、超时预算是否允许。 具体来说：GET 查询或幂等写入更适合有限重试；扣款/下单等非幂等操作须使用幂等键和去重。；使用指数退避+抖动、最大次数/总超时，防止重试风暴。；可用断路器、限流、消息补偿及状态查询应对不确定提交结果。。\",\"code\":\"\"}],\"sources\":[{\"name\":\"小林 Coding Spring 章节\",\"url\":\"https://xiaolincoding.com/interview/spring.html\"},{\"name\":\"Spring Framework 声明式事务参考\",\"url\":\"https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html\"},{\"name\":\"Spring Boot Auto-Configuration\",\"url\":\"https://docs.spring.io/spring-boot/reference/using/auto-configuration.html\"},{\"name\":\"MyBatis 文档\",\"url\":\"https://mybatis.org/mybatis-3/sqlmap-xml.html\"}]};\n\nconst el=id=>document.getElementById(id);\nconst esc=s=>String(s??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst nodeById=new Map(DB.nodes.map(n=>[n.id,n]));\nconst catById=new Map(DB.cats.map(c=>[c.id,c]));\nconst categoryTitle={spring:'Spring 核心',mvc:'Spring MVC',boot:'Spring Boot',mybatis:'MyBatis',cloud:'Spring Cloud'};\nconst typeColors={'基础':'#5a86be','深入':'#8766d2','共享机制':'#20a481','实现对比':'#d18f36','实战应用':'#d66e83'};\nlet selected='circular', activeRoute='cycle', catFocus=null, expanded=false, questionFilter='all', questionSearch='', currentQ=0;\nconst storageKey='spring_atlas_progress_2026_v1';let completed=new Set();try{completed=new Set(JSON.parse(localStorage.getItem(storageKey)||'[]'))}catch(e){};\nconst counts=DB.nodes.reduce((a,n)=>(a[n.cat]=(a[n.cat]||0)+1,a),{});\nconst locations=new Map();\nfor(const [ix,cat] of DB.cats.entries()){\n const nn=DB.nodes.filter(n=>n.cat===cat.id);\n nn.forEach((n,i)=>locations.set(n.id,{x:90+ix*350,y:145+i*78}));\n}\nconst fullscreen={x:0,y:0,w:2700,h:1550};let view={...fullscreen};\nconst svg=el('map'); const ns='http://www.w3.org/2000/svg';let pan=null,suppress=false;\nfunction createSVG(name,attrs={},child){let x=document.createElementNS(ns,name);Object.entries(attrs).forEach(([k,v])=>x.setAttribute(k,v));if(child!==undefined)x.textContent=String(child);return x}\nfunction updateView(){svg.setAttribute('viewBox',[view.x,view.y,view.w,view.h].join(' '))}\nfunction visibleNodes(){if(activeRoute){const ids=new Set(DB.routes.find(r=>r.id===activeRoute).nodes);ids.add(selected);return DB.nodes.filter(n=>ids.has(n.id))}if(catFocus){const ids=new Set(DB.nodes.filter(n=>n.cat===catFocus).map(n=>n.id));DB.edges.forEach(e=>{if(ids.has(e.a))ids.add(e.b);if(ids.has(e.b))ids.add(e.a)});ids.add(selected);return DB.nodes.filter(n=>ids.has(n.id))}if(expanded)return DB.nodes;const ids=new Set(DB.nodes.filter(n=>n.core).map(n=>n.id));ids.add(selected);DB.edges.forEach(e=>{if(e.a===selected)ids.add(e.b);if(e.b===selected)ids.add(e.a)});return DB.nodes.filter(n=>ids.has(n.id))}\nfunction draw(){const nodes=visibleNodes(),ids=new Set(nodes.map(n=>n.id));let exists=ids.has(selected);if(!exists){selected=nodes[0]?.id||selected}const relevant=new Set([selected]);DB.edges.forEach(e=>{if(e.a===selected)relevant.add(e.b);if(e.b===selected)relevant.add(e.a)});const frag=document.createDocumentFragment();\n const defs=createSVG('defs');for(const [kind,color] of Object.entries(typeColors)){let id='arrow_'+kind;let mark=createSVG('marker',{id,markerWidth:8,markerHeight:8,refX:6,refY:3,orient:'auto',markerUnits:'strokeWidth'});mark.append(createSVG('path',{d:'M0 0L6 3L0 6',stroke:color,'stroke-width':1.1,fill:'none'}));defs.append(mark)}frag.append(defs);\n DB.cats.forEach((cat,i)=>{const x=65+i*350;frag.append(createSVG('rect',{x:x-5,y:66,width:303,height:Math.max(1028,Math.max(...DB.cats.map(c=>counts[c.id]))*78+155),rx:17,fill:cat.color+'09',stroke:cat.color+'28'}));frag.append(createSVG('rect',{x:x+1,y:78,width:291,height:49,rx:12,fill:cat.color+'16',stroke:cat.color+'40'}));frag.append(createSVG('text',{x:x+13,y:98,class:'lane-title',fill:cat.color},cat.label));frag.append(createSVG('text',{x:x+13,y:115,class:'lane-help'},cat.help));});\n const drawn=DB.edges.filter(e=>ids.has(e.a)&&ids.has(e.b));drawn.forEach(e=>{let a=locations.get(e.a),b=locations.get(e.b);let x1=a.x+268,y1=a.y+25,x2=b.x,y2=b.y+25;let d;if(b.x\u003c=a.x){x1=a.x+136;x2=b.x+136;y1=a.y+53;y2=b.y+53;let side=(x1+x2)/2+35;d=`M${x1} ${y1}C${side} ${y1+48} ${side} ${y2+35} ${x2} ${y2}`}else{let delta=(x2-x1)*.44;d=`M${x1} ${y1}C${x1+delta} ${y1} ${x2-delta} ${y2} ${x2} ${y2}`}\n const highlight=e.a===selected||e.b===selected||activeRoute;\n let color=typeColors[e.kind]||'#8b98aa';let path=createSVG('path',{d,fill:'none',stroke:color,'stroke-width':highlight?2.5:1.25,'stroke-opacity':highlight?.83:.21,'marker-end':`url(#arrow_${e.kind})`,class:'edge'});path.dataset.from=e.a;path.dataset.to=e.b;path.addEventListener('click',ev=>{ev.stopPropagation();selected=e.b;renderAll();renderInspection(`关联：${e.why}`)});frag.append(path);\n });\n nodes.forEach(n=>{let p=locations.get(n.id),cat=catById.get(n.cat),sel=n.id===selected,linked=relevant.has(n.id),opacity=sel||linked||activeRoute?1:(expanded?.8:.97);let g=createSVG('g',{class:'node',role:'button',tabindex:'0','aria-label':n.title,opacity});g.dataset.node=n.id;\n g.append(createSVG('rect',{x:p.x,y:p.y,width:268,height:56,rx:10,class:'box',fill:sel?'#e8f2ff':n.core?'#fff':'#fbfcff',stroke:sel?'#3484d3':cat.color+(n.core?'88':'55'),'stroke-width':sel?2.8:n.core?1.5:1}));\n g.append(createSVG('rect',{x:p.x,y:p.y,width:5,height:56,rx:2,fill:cat.color}));\n let title=n.title.length>17?n.title.slice(0,16)+'…':n.title;let sub=n.sub.length>25?n.sub.slice(0,24)+'…':n.sub;\n g.append(createSVG('text',{x:p.x+14,y:p.y+23,class:'nodetxt'},title));g.append(createSVG('text',{x:p.x+14,y:p.y+42,class:'nodesub'},sub));\n if(n.core)g.append(createSVG('circle',{cx:p.x+251,cy:p.y+15,r:3.3,fill:cat.color}));\n g.addEventListener('click',e=>{e.stopPropagation();if(suppress)return;selected=n.id;renderAll()});\n g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selected=n.id;renderAll()}});\n frag.append(g) });svg.replaceChildren(frag);el('visibleCount').textContent=`当前显示 ${nodes.length} 个节点、${drawn.length} 条关联；共 77 节点 / 126 关联`;\n el('mapMode').textContent=activeRoute?'追问路线聚焦':catFocus?'主题聚焦':expanded?'全部节点':'核心节点 + 当前关联';\n el('expand').textContent=expanded?'− 只看核心节点':'＋ 展开全部';el('expand').classList.toggle('on',expanded);\n}\nfunction fitCurrent(margin=95){const all=visibleNodes();if(!all.length)return;const ps=all.map(n=>locations.get(n.id));let left=Math.min(...ps.map(p=>p.x)),right=Math.max(...ps.map(p=>p.x+268)),top=Math.min(...ps.map(p=>p.y)),bottom=Math.max(...ps.map(p=>p.y+56));\n const width=right-left+margin*2,height=bottom-top+margin*2,ratio=Math.max(.75,svg.clientWidth/Math.max(1,svg.clientHeight));let w=Math.max(width,height*ratio),h=w/ratio;if(h\u003cheight){h=height;w=h*ratio}view={x:(left+right-w)/2,y:(top+bottom-h)/2,w,h};updateView()}\nfunction zoomFromCenter(factor){\n const width=Math.max(350,Math.min(4200,view.w*factor));\n const height=view.h*width/view.w;\n view.x+=(view.w-width)/2;\n view.y+=(view.h-height)/2;\n view.w=width;\n view.h=height;\n updateView();\n}\nsvg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;svg.setPointerCapture(e.pointerId);pan={x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY};svg.classList.add('dragging')});\nsvg.addEventListener('pointermove',e=>{if(!pan)return;let rect=svg.getBoundingClientRect(),dx=e.clientX-pan.px,dy=e.clientY-pan.py;view.x-=dx*view.w/rect.width;view.y-=dy*view.h/rect.height;pan.px=e.clientX;pan.py=e.clientY;if(Math.abs(pan.x-e.clientX)+Math.abs(pan.y-e.clientY)>5)suppress=true;updateView()});\nfunction stopPan(){pan=null;svg.classList.remove('dragging');setTimeout(()=>suppress=false,0)}svg.addEventListener('pointerup',stopPan);svg.addEventListener('pointercancel',stopPan);\nel('zin').onclick=()=>zoomFromCenter(.8);\nel('zout').onclick=()=>zoomFromCenter(1.25);\nel('fit').onclick=()=>fitCurrent();\nel('expand').onclick=()=>{expanded=!expanded;activeRoute=null;catFocus=null;renderAll();fitCurrent()};\nel('clear').onclick=()=>{activeRoute=null;catFocus=null;expanded=false;selected='ioc';renderAll();fitCurrent()};\nfunction focusRoute(id){activeRoute=id;catFocus=null;expanded=false;const ids=new Set(DB.routes.find(r=>r.id===id).nodes);selected=ids.has(selected)?selected:DB.routes.find(r=>r.id===id).nodes[0];renderAll();fitCurrent()}\nfunction focusNode(id){activeRoute=null;catFocus=null;selected=id;expanded=false;renderAll();fitNeighborhood(id)}\nfunction fitNeighborhood(id){const ids=new Set([id]);DB.edges.forEach(e=>{if(e.a===id)ids.add(e.b);if(e.b===id)ids.add(e.a)});const ps=[...ids].map(x=>locations.get(x)).filter(Boolean);if(!ps.length)return;let x1=Math.min(...ps.map(p=>p.x)),x2=Math.max(...ps.map(p=>p.x+268)),y1=Math.min(...ps.map(p=>p.y)),y2=Math.max(...ps.map(p=>p.y+56));let desiredW=x2-x1+190,ratio=Math.max(.8,svg.clientWidth/Math.max(1,svg.clientHeight)),desiredH=y2-y1+170;view.w=Math.max(desiredW,desiredH*ratio);view.h=view.w/ratio;view.x=(x1+x2-view.w)/2;view.y=(y1+y2-view.h)/2;updateView()}\nfunction initControls(){el('routeList').innerHTML=DB.routes.map((r,i)=>`\u003cbutton class=\"route ${activeRoute===r.id?'active':''}\" data-route=\"${esc(r.id)}\">\u003cspan class=\"route-mark\">${String(i+1).padStart(2,'0')}\u003c/span>\u003cspan>\u003cstrong>${esc(r.label)}\u003c/strong>\u003csmall>${esc(r.desc)}\u003c/small>\u003c/span>\u003c/button>`).join('');\n el('catstrip').innerHTML=`\u003cbutton class=\"catbtn ${catFocus===null?'on':''}\" data-cat=\"all\">全部主题\u003c/button>`+DB.cats.map(c=>`\u003cbutton class=\"catbtn ${catFocus===c.id?'on':''}\" data-cat=\"${c.id}\">${esc(c.label.slice(5))} · ${counts[c.id]}\u003c/button>`).join('');\n el('legend').innerHTML=Object.entries(typeColors).map(([k,color])=>`\u003cdiv class=\"leg\">\u003cspan class=\"legline\" style=\"border-color:${color}\">\u003c/span>${esc(k)}\u003c/div>`).join('');\n}\nel('routeList').addEventListener('click',e=>{let b=e.target.closest('[data-route]');if(b)focusRoute(b.dataset.route)});\nel('catstrip').addEventListener('click',e=>{let b=e.target.closest('[data-cat]');if(!b)return;catFocus=b.dataset.cat==='all'?null:b.dataset.cat;activeRoute=null;expanded=false;const catNodes=DB.nodes.filter(n=>n.cat===catFocus);if(catNodes.length)selected=catNodes.find(n=>n.core)?.id||catNodes[0].id;renderAll();fitCurrent()});\ndocument.querySelectorAll('[data-mech]').forEach(b=>b.onclick=()=>{focusRoute(b.dataset.mech);el('mapWorkspace').scrollIntoView({behavior:'smooth',block:'start'})});\nel('viewMap').onclick=()=>el('mapWorkspace').scrollIntoView({behavior:'smooth'});\nfunction renderInspection(context=''){let n=nodeById.get(selected),cat=catById.get(n.cat),links=DB.edges.filter(e=>e.a===selected||e.b===selected).map(e=>({...e,other:e.a===selected?e.b:e.a}));\n links.sort((a,b)=>['共享机制','深入','实现对比','基础','实战应用'].indexOf(a.kind)-['共享机制','深入','实现对比','基础','实战应用'].indexOf(b.kind));\n let qs=DB.questions.filter(q=>q.node===selected);let snippet=`\u003cdiv class=\"eyelabel\" style=\"color:${cat.color}\">${esc(cat.label)} · 知识节点\u003c/div>\u003ch2>${esc(n.title)}\u003c/h2>\u003cdiv style=\"font-size:11px;color:#8795aa\">${esc(n.sub)}\u003c/div>\u003cp>${esc(n.desc)}\u003c/p>\u003cdiv class=\"soft\">\u003cb>一句话抓重点\u003c/b>\u003cbr>${esc(n.key)}\u003c/div>`;\n if(context)snippet+=`\u003cdiv class=\"soft\" style=\"background:#eaf5ff\">\u003cb>这条连线代表：\u003c/b>\u003cbr>${esc(context)}\u003c/div>`;\n snippet+=`\u003ch3>与它共享机制或形成追问的节点（${links.length}）\u003c/h3>\u003cdiv class=\"rel-list\">`+links.slice(0,15).map(l=>`\u003cbutton class=\"relbtn\" data-navigate=\"${l.other}\">${esc(nodeById.get(l.other).title)}\u003cspan>${esc(l.kind)} · ${esc(l.why)}\u003c/span>\u003c/button>`).join('')+`\u003c/div>`;\n snippet+=`\u003ch3>对应小林原章题目（${qs.length}）\u003c/h3>`+(qs.length?qs.map(q=>`\u003cbutton class=\"qa-btn\" data-openq=\"${q.id-1}\">第 ${q.id} 题 · ${esc(q.title)} →\u003c/button>`).join(''):'\u003cdiv class=\"empty\">这是跨题目的共同基础节点，点击关联可跳到对应原题。\u003c/div>');\n el('inspector').innerHTML=snippet;el('inspector').querySelectorAll('[data-navigate]').forEach(b=>b.onclick=()=>focusNode(b.dataset.navigate));el('inspector').querySelectorAll('[data-openq]').forEach(b=>b.onclick=()=>openQuestion(+b.dataset.openq));}\nfunction renderAll(){initControls();draw();renderInspection()}\nfunction renderProgress(){completed=new Set([...completed].filter(i=>Number.isInteger(i)&&i>=0&&i\u003c84));let n=completed.size;el('progressText').innerHTML=`\u003cb>${n}/84\u003c/b> 已掌握`;el('studyProgress').textContent=`已掌握 ${n} / 84`;el('progressBar').style.width=(n/84*100)+'%';try{localStorage.setItem(storageKey,JSON.stringify([...completed].sort((a,b)=>a-b)))}catch(e){}}\nconst chapters=[{id:'all',label:'全部 84 题'},{id:'spring',label:'Spring 核心 · 44'},{id:'mvc',label:'Spring MVC · 6'},{id:'boot',label:'Spring Boot · 16'},{id:'mybatis',label:'MyBatis · 10'},{id:'cloud',label:'Spring Cloud · 8'},{id:'todo',label:'只看未掌握'}];\nfunction renderQIndex(){el('tabs').innerHTML=chapters.map(ch=>`\u003cbutton class=\"tab ${questionFilter===ch.id?'active':''}\" data-tab=\"${ch.id}\">${ch.label}\u003c/button>`).join('');let terms=questionSearch.toLowerCase().trim();let qs=DB.questions.filter(q=>(questionFilter==='all'||(questionFilter==='todo'?!completed.has(q.id-1):questionFilter===q.cat))&&(!terms||[q.title,q.short,q.example,q.trap,q.node,...q.details].join(' ').toLowerCase().includes(terms)));\n el('qgrid').innerHTML=qs.map(q=>`\u003cbutton class=\"qitem ${completed.has(q.id-1)?'done':''}\" data-openq=\"${q.id-1}\">\u003cspan class=\"qnum\">${completed.has(q.id-1)?'✓':String(q.id).padStart(2,'0')}\u003c/span>\u003cspan class=\"qtitle\">${esc(q.title)}\u003cspan class=\"qnode\">关联：${esc(nodeById.get(q.node).title)}\u003c/span>\u003c/span>\u003c/button>`).join('')||'\u003cdiv class=\"empty\">没有匹配的题目，可以调整关键词或筛选条件。\u003c/div>'}\nel('tabs').addEventListener('click',e=>{let btn=e.target.closest('[data-tab]');if(btn){questionFilter=btn.dataset.tab;renderQIndex()}});\nel('qsearch').addEventListener('input',e=>{questionSearch=e.target.value;renderQIndex()});\nel('qgrid').addEventListener('click',e=>{let b=e.target.closest('[data-openq]');if(b)openQuestion(+b.dataset.openq)});\nel('startStudy').onclick=()=>openQuestion(0);el('reviewOpen').onclick=()=>{let next=DB.questions.find(q=>!completed.has(q.id-1));openQuestion(next?next.id-1:0)};\nlet lastActiveBeforeModal=null;\nfunction openQuestion(i){currentQ=Math.max(0,Math.min(83,i));if(el('modal').hidden)lastActiveBeforeModal=document.activeElement;el('modal').hidden=false;document.body.style.overflow='hidden';drawArticle();renderRail();renderProgress();el('closeModal').focus();try{history.replaceState(null,'','#q'+(currentQ+1))}catch(e){}}\nfunction closeModal(){el('modal').hidden=true;document.body.style.overflow='';try{if(location.hash.startsWith('#q'))history.replaceState(null,'',location.pathname+location.search)}catch(e){}if(lastActiveBeforeModal?.focus)lastActiveBeforeModal.focus()}\nfunction backToMap(){let id=DB.questions[currentQ].node;closeModal();focusNode(id);el('mapWorkspace').scrollIntoView({behavior:'smooth',block:'start'})}\nel('closeModal').onclick=closeModal;el('toGraph').onclick=backToMap;el('modal').addEventListener('click',e=>{if(e.target===el('modal'))closeModal()});\nfunction nearestQuestions(q){let peers=DB.questions.filter(t=>t.node===q.node&&t.id!==q.id).map(t=>t.id-1);let links=DB.edges.filter(e=>e.a===q.node||e.b===q.node).map(e=>e.a===q.node?e.b:e.a);let cross=DB.questions.filter(t=>links.includes(t.node)&&t.id!==q.id).map(t=>t.id-1);return [...new Set([...peers,...cross])].slice(0,7)}\nfunction drawArticle(){const q=DB.questions[currentQ],n=nodeById.get(q.node),links=DB.edges.filter(e=>e.a===q.node||e.b===q.node).slice(0,11),next=nearestQuestions(q);\n const html=`\u003cdiv class=\"kicker\">第 ${String(q.id).padStart(2,'0')} / 84 题 · ${categoryTitle[q.cat]}\u003c/div>\u003ch2>${esc(q.title)}\u003c/h2>\u003cdiv class=\"under\">关联概念：${esc(n.title)} · 独立撰写的学习整理，非原站答案复制\u003c/div>\n \u003csection class=\"answerbox quick\">\u003ch3>\u003cspan class=\"tag\">30 秒\u003c/span>先记住一句话\u003c/h3>\u003cp>${esc(q.short)}\u003c/p>\u003c/section>\n \u003csection class=\"answerbox\">\u003ch3>\u003cspan class=\"tag\">原理\u003c/span>一步步拆解\u003c/h3>\u003col>${q.details.map((x,i)=>`\u003cli>\u003cspan class=\"step\">${i+1}\u003c/span>\u003cspan>${esc(x)}\u003c/span>\u003c/li>`).join('')}\u003c/ol>\u003c/section>\n \u003csection class=\"answerbox\">\u003ch3>\u003cspan class=\"tag\">案例\u003c/span>结合代码与业务场景\u003c/h3>\u003cp>${esc(q.example)}\u003c/p>${q.code?`\u003cpre class=\"samplecode\">\u003ccode>${esc(q.code)}\u003c/code>\u003c/pre>`:''}\u003c/section>\n \u003csection class=\"answerbox warning\">\u003ch3>\u003cspan class=\"tag\">误区\u003c/span>面试不要这样回答\u003c/h3>\u003cp>${esc(q.trap)}\u003c/p>\u003c/section>\n \u003csection class=\"answerbox interview\">\u003ch3>\u003cspan class=\"tag\">口述\u003c/span>可以这样完整回答\u003c/h3>\u003cp>${esc(q.interview)}\u003c/p>\u003c/section>\n \u003csection class=\"answerbox\">\u003ch3>\u003cspan class=\"tag\">关联\u003c/span>共享底层机制与深入追问\u003c/h3>\u003cdiv class=\"chips\">\u003cbutton class=\"chip\" data-go-node=\"${q.node}\">◎ ${esc(n.title)}\u003csmall>返回知识网络\u003c/small>\u003c/button>${links.map(l=>{let id=l.a===q.node?l.b:l.a;return `\u003cbutton class=\"chip\" data-go-node=\"${id}\">${esc(nodeById.get(id).title)}\u003csmall>${esc(l.kind)} · ${esc(l.why)}\u003c/small>\u003c/button>`}).join('')}\u003c/div>\u003c/section>\n \u003csection class=\"answerbox\">\u003ch3>\u003cspan class=\"tag\">下一步\u003c/span>把这几道原题连起来学\u003c/h3>\u003cdiv class=\"chips\">${next.map(j=>`\u003cbutton class=\"chip\" data-openq=\"${j}\">第 ${j+1} 题：${esc(DB.questions[j].title)}\u003c/button>`).join('')||'\u003cspan class=\"empty\">先回到知识图选择相邻原理问题。\u003c/span>'}\u003c/div>\u003c/section>\n \u003cdiv class=\"studyactions\">\u003cbutton id=\"prev\" ${currentQ===0?'disabled':''}>← 上一题\u003c/button>\u003cbutton id=\"next\" ${currentQ===83?'disabled':''}>下一题 →\u003c/button>\u003cbutton class=\"learn ${completed.has(currentQ)?'done':''}\" id=\"markDone\">${completed.has(currentQ)?'✓ 已掌握 · 点击取消':'✓ 标记此题已掌握'}\u003c/button>\u003c/div>\u003cdiv class=\"study-source\">\u003ca href=\"https://xiaolincoding.com/interview/juc.html\" target=\"_blank\" rel=\"noopener noreferrer\">↗ 查看小林 coding 原章\u003c/a> · 版本提醒：Spring 5/6/7、Boot 2/3/4 的循环依赖、代理和自动装配实现可能不同。\u003c/div>`;\n el('article').innerHTML=html;el('article').scrollTop=0;\n el('article').querySelectorAll('[data-openq]').forEach(b=>b.onclick=()=>openQuestion(+b.dataset.openq));\n el('article').querySelectorAll('[data-go-node]').forEach(b=>b.onclick=()=>{let id=b.dataset.goNode;closeModal();focusNode(id);el('mapWorkspace').scrollIntoView({behavior:'smooth'})});\n el('prev').onclick=()=>openQuestion(currentQ-1);el('next').onclick=()=>openQuestion(currentQ+1);el('markDone').onclick=()=>{completed.has(currentQ)?completed.delete(currentQ):completed.add(currentQ);renderProgress();drawArticle();renderRail();renderQIndex()};\n}\nfunction renderRail(){let term=el('railSearch').value.trim().toLowerCase();let last=null,markup='';DB.questions.forEach(q=>{if(term&&![q.title,q.short,q.node,...q.details].join(' ').toLowerCase().includes(term))return;if(q.cat!==last){markup+=`\u003cdiv class=\"railcap\">${categoryTitle[q.cat]}\u003c/div>`;last=q.cat}markup+=`\u003cbutton class=\"railq ${currentQ===q.id-1?'active':''} ${completed.has(q.id-1)?'done':''}\" data-openq=\"${q.id-1}\">\u003cspan class=\"indexno\">${completed.has(q.id-1)?'✓':q.id}\u003c/span>\u003cspan>${esc(q.title)}\u003c/span>\u003c/button>`});el('railnav').innerHTML=markup||'\u003cdiv class=\"empty\">没有找到相关题目。\u003c/div>';el('railnav').querySelector('.railq.active')?.scrollIntoView({block:'nearest'})}\nel('railSearch').addEventListener('input',renderRail);el('railnav').addEventListener('click',e=>{let b=e.target.closest('[data-openq]');if(b)openQuestion(+b.dataset.openq)});\nwindow.addEventListener('keydown',e=>{if(el('modal').hidden)return;if(e.key==='Escape'){closeModal();return}if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')openQuestion(Math.min(83,currentQ+1));if(e.key==='ArrowLeft')openQuestion(Math.max(0,currentQ-1))});\nrenderAll();fitCurrent();renderProgress();renderQIndex();\nif(/^#q\\d+$/.test(location.hash)){let q=Number(location.hash.substring(2));if(q>0&&q\u003c=84)openQuestion(q-1)}\n\n\u003c/script>\u003c/body>\u003c/html>","questions":[{"title":"说一下你对 Spring 的理解","topic":"Spring 总览"},{"title":"spring的核心思想说说你的理解？","topic":"Spring 总览"},{"title":"Spring IoC和AOP 介绍一下","topic":"IoC 容器"},{"title":"Spring的aop介绍一下","topic":"AOP 术语"},{"title":"IOC和AOP是通过什么机制来实现的?","topic":"AOP 自动代理"},{"title":"怎么理解SpringIoc？","topic":"IoC 容器"},{"title":"依赖倒置，依赖注入，控制反转分别是什么？","topic":"依赖注入 DI"},{"title":"依赖注入了解吗？怎么实现依赖注入的？","topic":"依赖注入 DI"},{"title":"为什么更推荐构造器注入？","topic":"构造器注入"},{"title":"@Autowired 和 @Resource 有什么区别？","topic":"自动注入规则"},{"title":"如果让你设计一个SpringIoc，你觉得会从哪些方面考虑这个设计？","topic":"BeanDefinition"},{"title":"SpringAOP主要想解决什么问题","topic":"AOP 术语"},{"title":"AOP在spring中的应用，你知道哪些？","topic":"切面应用"},{"title":"谈谈你对 Spring AOP 的了解程度？","topic":"AOP 术语"},{"title":"SpringAOP的原理了解吗","topic":"AOP 自动代理"},{"title":"动态代理是什么？","topic":"JDK / CGLIB 代理"},{"title":"动态代理和静态代理的区别","topic":"JDK / CGLIB 代理"},{"title":"能使用静态代理的方式实现AOP吗？","topic":"JDK / CGLIB 代理"},{"title":"AOP实现有哪些注解？","topic":"切面注解"},{"title":"什么是反射？有哪些使用场景？","topic":"反射与实例化"},{"title":"spring是如何解决循环依赖的？","topic":"循环依赖"},{"title":"Spring为什么用3级缓存解决循环依赖问题？用2级缓存不行吗？","topic":"三级缓存 / 早期引用"},{"title":"spring三级缓存的数据结 <script>
"use strict";
const chapters = JSON.parse(document.getElementById("chapter-data").textContent);
const tabs = document.getElementById("tabs");
const views = document.getElementById("views");
const notice = document.getElementById("notice");
const dialog = document.getElementById("search");
const query = document.getElementById("query");
const status = document.getElementById("search-status");
const results = document.getElementById("results");
const normalize = text => text.normalize("NFKC").toLowerCase();

let activeChapter;
let activation = 0;
const questionIndex = chapters.flatMap(chapter => chapter.questions.map(({title, topic}, index) => ({
  chapter,
  number: index + 1,
  title,
  searchable: normalize(chapter.name + " " + title + " " + topic)
})));

for (const [index, chapter] of chapters.entries()) {
  const button = document.createElement("button");
  button.type = "button";
  button.id = "tab-" + chapter.id;
  button.className = "tab";
  button.setAttribute("role", "tab");
  button.setAttribute("aria-controls", "panel-" + chapter.id);
  button.append(chapter.name);
  const count = document.createElement("span");
  count.className = "tab-count";
  count.textContent = chapter.questions.length + " 题";
  button.append(count);
  button.addEventListener("click", () => selectChapter(chapter));
  button.addEventListener("keydown", event => {
    const next = {
      ArrowLeft: (index + chapters.length - 1) % chapters.length,
      ArrowRight: (index + 1) % chapters.length,
      Home: 0,
      End: chapters.length - 1
    }[event.key];
    if (next === undefined) return;
    event.preventDefault();
    selectChapter(chapters[next]);
    chapters[next].button.focus();
  });
  chapter.button = button;
  tabs.append(button);

  const panel = document.createElement("section");
  panel.id = "panel-" + chapter.id;
  panel.className = "panel";
  panel.setAttribute("role", "tabpanel");
  panel.setAttribute("aria-labelledby", button.id);
  chapter.panel = panel;
  views.append(panel);
}

function loadChapter(chapter) {
  if (chapter.ready) return;
  const frame = document.createElement("iframe");
  frame.title = chapter.name + "知识图谱与题解";
  chapter.frame = frame;
  chapter.ready = new Promise(resolve => frame.addEventListener("load", resolve, {once: true}));
  frame.srcdoc = chapter.html;
  chapter.panel.append(frame);
}

function selectChapter(chapter, updateAddress = true) {
  activeChapter = chapter;
  activation += 1;
  notice.hidden = true;
  for (const item of chapters) {
    const selected = item === chapter;
    item.button.setAttribute("aria-selected", String(selected));
    item.button.tabIndex = selected ? 0 : -1;
    item.panel.setAttribute("aria-hidden", String(!selected));
    item.panel.inert = !selected;
  }
  loadChapter(chapter);
  chapter.button.scrollIntoView({block: "nearest", inline: "nearest"});
  if (updateAddress && location.hash !== "#" + chapter.id) {
    try { history.replaceState(null, "", "#" + chapter.id); } catch {}
  }
}

function selectFromAddress() {
  const chapter = chapters.find(item => "#" + item.id === location.hash) || chapters[0];
  selectChapter(chapter, false);
}
window.addEventListener("hashchange", selectFromAddress);
selectFromAddress();

function renderResults() {
  const input = normalize(query.value).trim();
  results.replaceChildren();
  if (!input) {
    status.textContent = "输入题目或知识节点关键词。";
    return;
  }
  const words = input.split(/\s+/);
  const matches = questionIndex.filter(question => words.every(word => question.searchable.includes(word)));
  status.textContent = matches.length ? "找到 " + matches.length + " 道题" : "没有匹配的题目。";
  const fragment = document.createDocumentFragment();
  for (const question of matches) {
    const row = document.createElement("li");
    const button = document.createElement("button");
    button.type = "button";
    button.className = "result";
    const ref = document.createElement("span");
    ref.className = "result-ref";
    ref.textContent = question.chapter.name + " · " + String(question.number).padStart(2, "0");
    const title = document.createElement("span");
    title.textContent = question.title;
    button.append(ref, title);
    button.addEventListener("click", () => openResult(question));
    row.append(button);
    fragment.append(row);
  }
  results.append(fragment);
}

async function openResult(question) {
  dialog.close();
  const chapter = question.chapter;
  selectChapter(chapter);
  const requestedActivation = activation;
  await chapter.ready;
  if (activeChapter !== chapter || activation !== requestedActivation) return;
  try {
    const page = chapter.frame.contentWindow;
    page.focus();
    page.openQuestion(question.number - 1);
  } catch {
    notice.textContent = "请在" + chapter.name + "题库中打开第 " + question.number + " 题。";
    notice.hidden = false;
  }
}

document.getElementById("open-search").addEventListener("click", () => {
  dialog.showModal();
  renderResults();
  query.focus();
  query.select();
});
document.getElementById("close-search").addEventListener("click", () => dialog.close());
query.addEventListener("input", renderResults);
query.addEventListener("keydown", event => {
  if (event.key === "Enter") results.querySelector("button")?.click();
});
</script>
