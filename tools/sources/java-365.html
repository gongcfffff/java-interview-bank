ft:0}.workspace{display:flex;flex-direction:column}.sidebar{order:1}.map-panel{order:2}.inspector{order:3}.route-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.route{min-height:71px}.line-card{padding:13px}.mechanisms{grid-template-columns:1fr 1fr}.mechanism{padding:10px;min-height:128px}.viewport{height:490px;min-height:490px}.qgrid{grid-template-columns:1fr}.index{padding:14px}.idxsearch{width:100%;min-width:0}.modal{padding:0}.study{height:100dvh;width:100vw;border-radius:0}.studybody{display:block}.studyrail{display:none}.article{height:100%;padding:19px 18px 40px}.studyhead{padding:10px}.studyhead .progress-track{display:none}.studyhead span{font-size:10px}.studyactions .learn{margin-left:0}.maptools .tool{font-size:10px}}\n@media(max-width:430px){.mechanisms{grid-template-columns:1fr}.route-list{grid-template-columns:1fr 1fr}.route strong{font-size:11px}.viewport{height:460px;min-height:460px}}\n@media print{.hero,.sidebar,.map-panel,.inspector,.line-card,.index,.studyhead,.studyrail,.studyactions{display:none!important}.modal{position:static;display:block;background:none;padding:0}.study{display:block;box-shadow:none;height:auto;width:100%}.article{height:auto;overflow:visible;padding:0}.answerbox{break-inside:avoid}.article h2{font-size:22px}}\n\n/* Spring edition enhancements */\n.hero{background:radial-gradient(ellipse at 88% 16%,#255b84 0%,transparent 45%),linear-gradient(117deg,#0c243f,#174269 58%,#27677b)}.hero .primary{color:#165968;background:#daf7f1}.mechanism .branch{color:#147c75}.chapter-note{font-size:11px;color:#5a718f;background:#f3f9fb;padding:11px 14px;border:1px solid #dae9ee;border-radius:9px;margin-top:10px}.article pre{tab-size:2}\n\u003c/style>\u003c/head>\n\u003cbody>\u003cdiv class=\"shell\">\n\u003cheader class=\"hero\">\u003cdiv class=\"eyebrow\">SPRING ECOSYSTEM · INTERACTIVE KNOWLEDGE ATLAS\u003c/div>\n\u003ch1>Spring 全家桶 · 整章知识关联网络\u003c/h1>\n\u003cp>不是把知识点放成一棵树，而是沿着「Spring Boot 启动 → IoC 创建 Bean → AOP 包装 → MVC 处理请求 → 事务 → MyBatis 执行 SQL → Cloud 微服务治理」追踪真正的执行链；点击节点探索共同原理、版本差异与下一层追问。\u003c/p>\n\u003cdiv class=\"hero-bottom\">\u003cdiv class=\"metric\">\u003cb>84\u003c/b> 原章面试题\u003c/div>\u003cdiv class=\"metric\">\u003cb>77\u003c/b> 核心概念节点\u003c/div>\u003cdiv class=\"metric\">\u003cb>126\u003c/b> 条解释型关联\u003c/div>\u003cdiv class=\"metric\" id=\"progressText\">\u003cb>0/84\u003c/b> 已掌握\u003c/div>\u003ca class=\"hero-link\" href=\"https://xiaolincoding.com/interview/spring.html\" target=\"_blank\" rel=\"noopener noreferrer\">↗ 查看小林 coding 原章\u003c/a>\u003c/div>\n\u003cdiv class=\"hero-actions\">\u003cbutton class=\"primary\" id=\"startStudy\">📖 从第 1 题开始学习\u003c/button>\u003cbutton class=\"secondary-on-dark\" id=\"viewMap\">◎ 浏览知识关联图\u003c/button>\u003cbutton class=\"secondary-on-dark\" id=\"reviewOpen\">↗ 只看未掌握题目\u003c/button>\u003c/div>\u003c/header>\n\u003csection class=\"line-card\">\u003cdiv class=\"line-head\">\u003cdiv>\u003ch2>不是简单树形图：这些知识点共用什么底层原理？\u003c/h2>\u003cp>从共同机制入手，再分别进入具体实现；点卡片，知识网络会定位到这条追问路线。\u003c/p>\u003c/div>\u003cspan class=\"minor-pill\">横向关联 × 深入追问\u003c/span>\u003c/div>\n\u003cdiv class=\"mechanisms\">\n\u003cbutton class=\"mechanism\" data-mech=\"cycle\">\u003cb>三级缓存 ↔ AOP 早期代理\u003c/b>\u003cspan class=\"desc\">循环依赖并非单纯两个对象互相引用，它必须处理 Bean 生命周期与代理对象一致性。\u003c/span>\u003cdiv class=\"branch\">为什么三级缓存不能简单替成两个 Map？ ↗\u003c/div>\u003c/button>\n\u003cbutton class=\"mechanism\" data-mech=\"tx\">\u003cb>AOP → 事务 → this 失效\u003c/b>\u003cspan class=\"desc\">@Transactional 使用拦截器链；调用是否经过代理，决定传播与回滚规则是否真正生效。\u003c/span>\u003cdiv class=\"branch\">为什么捕获异常仍然回滚？ ↗\u003c/div>\u003c/button>\n\u003cbutton class=\"mechanism\" data-mech=\"boot\">\u003cb>Starter ≠ 自动配置\u003c/b>\u003cspan class=\"desc\">依赖进入 classpath 后，AutoConfiguration.imports 与 @Conditional 决定是否注册 Bean。\u003c/span>\u003cdiv class=\"branch\">为什么 starter 引入了也没生效？ ↗\u003c/div>\u003c/button>\n\u003cbutton class=\"mechanism\" data-mech=\"shared\">\u003cb>代理共性：AOP ↔ MyBatis\u003c/b>\u003cspan class=\"desc\">Spring AOP 代理增强方法；MyBatis MapperProxy 将接口调用转成 SQL，两者都复用代理思想。\u003c/span>\u003cdiv class=\"branch\">这两种代理又有什么不同？ ↗\u003c/div>\u003c/button>\n\u003c/div>\u003c/section>\n\u003cdiv class=\"workspace\" id=\"mapWorkspace\">\n\u003caside class=\"panel sidebar\">\u003csection>\u003ch3 class=\"cap\">从问题出发 · 选择探索路线\u003c/h3>\u003cdiv class=\"route-list\" id=\"routeList\">\u003c/div>\u003c/section>\n\u003csection>\u003ch3 class=\"cap\">连线代表什么\u003c/h3>\u003cdiv class=\"legend\" id=\"legend\">\u003c/div>\u003c/section>\n\u003cdiv class=\"tip\">\u003cb>读图方法\u003c/b>\u003cbr>① 选一个问题链；② 看高亮节点和连线；③ 点击节点，看它与其他机制如何关联；④ 点击题目进入完整答案。\u003cbr>\u003cbr>拖动画布可平移，用图上方的「−」「+」缩放，点「适应视图」看当前范围。\u003c/div>\u003c/aside>\n\u003cmain class=\"panel map-panel\">\u003cdiv class=\"maptools\">\n  \u003cstrong>知识联系网络\u003c/strong>\n  \u003cbutton class=\"tool\" id=\"expand\">＋ 展开全部\u003c/button>\n  \u003cbutton class=\"tool\" id=\"clear\">清除聚焦\u003c/button>\n  \u003cspan style=\"font-size:10px;color:#8795aa\" id=\"mapMode\">核心知识图\u003c/span>\n  \u003cdiv class=\"zoom\" role=\"group\" aria-label=\"图谱缩放\">\n    \u003cspan>缩放\u003c/span>\n    \u003cbutton type=\"button\" id=\"zout\" title=\"缩小\" aria-label=\"缩小\">−\u003c/button>\n    \u003cbutton type=\"button\" id=\"zin\" title=\"放大\" aria-label=\"放大\">+\u003c/button>\n    \u003cbutton type=\"button\" id=\"fit\">适应视图\u003c/button>\n  \u003c/div>\n\u003c/div>\n\u003cdiv class=\"catstrip\" id=\"catstrip\">\u003c/div>\u003cdiv class=\"viewport\" id=\"viewport\">\u003csvg id=\"map\" aria-label=\"Spring 知识网络，可拖动、点击节点\" viewBox=\"0 0 2700 1550\">\u003c/svg>\u003cdiv class=\"note\">点节点看解释 · 拖动画布平移\u003c/div>\u003c/div>\u003cdiv class=\"mapfoot\">\u003cspan id=\"visibleCount\">—\u003c/span>\u003cspan>连线只表示知识关联，不代表代码执行顺序\u003c/span>\u003c/div>\u003c/main>\n\u003caside class=\"panel inspector\" id=\"inspector\">\u003c/aside>\u003c/div>\n\u003csection class=\"index\" id=\"qIndex\">\u003cdiv class=\"index-top\">\u003cdiv>\u003ch2>原章 84 道题 · 每题都有完整解析\u003c/h2>\u003cp>包括核心结论、原理步骤、举例/代码、常见误区、面试口述，以及同原理题目跳转。\u003c/p>\u003c/div>\u003cinput class=\"idxsearch\" id=\"qsearch\" placeholder=\"搜索题目或答案：三级缓存、事务、自动装配、MyBatis…\" aria-label=\"搜索面试题\">\u003c/div>\u003cdiv class=\"tabbar\" id=\"tabs\">\u003c/div>\u003cdiv class=\"qgrid\" id=\"qgrid\">\u003c/div>\u003c/section>\n\u003cfooter class=\"footer\">\u003cspan>基于 \u003ca href=\"https://xiaolincoding.com/interview/spring.html\" target=\"_blank\" rel=\"noopener\">小林 coding · Spring 面试章\u003c/a> 的 84 个问题独立整理，解释而非转载原文。以现代 Spring Framework / Boot 为背景，版本、容器配置及数据访问实现会影响具体结论。\u003c/span>\u003cspan>单文件 HTML · 离线可用 · 浏览器本地保存学习进度 · 2026-11\u003c/span>\u003c/footer>\n\u003c/div>\n\u003cdiv class=\"modal\" id=\"modal\" hidden role=\"dialog\" aria-modal=\"true\" aria-label=\"面试题详细解析\">\u003cdiv class=\"study\">\u003cheader class=\"studyhead\">\u003cstrong>Spring 面试题精讲\u003c/strong>\u003cspan id=\"studyProgress\">已掌握 0 / 84\u003c/span>\u003cdiv class=\"progress-track\">\u003ci id=\"progressBar\">\u003c/i>\u003c/div>\u003cdiv class=\"spacer\">\u003c/div>\u003cbutton id=\"toGraph\">◎ 返回知识图\u003c/button>\u003cbutton id=\"closeModal\" aria-label=\"关闭\">✕ 关闭\u003c/button>\u003c/header>\u003cdiv class=\"studybody\">\u003caside class=\"studyrail\">\u003cinput class=\"studyfilter\" id=\"railSearch\" placeholder=\"在 84 道题里搜索…\" aria-label=\"搜索题目列表\">\u003cdiv class=\"railnav\" id=\"railnav\">\u003c/div>\u003c/aside>\u003carticle class=\"article\" id=\"article\">\u003c/article>\u003c/div>\u003c/div>\u003c/div>\n\u003cscript>const DB={\"chapters\":[{\"id\":\"spring\",\"label\":\"Spring 核心\",\"count\":44},{\"id\":\"mvc\",\"label\":\"Spring MVC\",\"count\":6},{\"id\":\"boot\",\"label\":\"Spring Boot\",\"count\":16},{\"id\":\"mybatis\",\"label\":\"MyBatis\",\"count\":10},{\"id\":\"cloud\",\"label\":\"Spring Cloud\",\"count\":8}],\"cats\":[{\"id\":\"base\",\"label\":\"01 · Spring 核心 / IoC\",\"color\":\"#4D7FD0\",\"help\":\"Bean 如何被声明、找到与组装？\"},{\"id\":\"bean\",\"label\":\"02 · Bean 生命周期\",\"color\":\"#24A284\",\"help\":\"对象如何创建、注入、增强与销毁？\"},{\"id\":\"cross\",\"label\":\"03 · AOP / 事务\",\"color\":\"#9268CF\",\"help\":\"方法怎样被增强，事务为什么失效？\"},{\"id\":\"mvc\",\"label\":\"04 · Spring MVC\",\"color\":\"#E48C4E\",\"help\":\"HTTP 请求如何找到并调用 Controller？\"},{\"id\":\"boot\",\"label\":\"05 · Spring Boot\",\"color\":\"#B47DBF\",\"help\":\"Starter 与条件装配怎样开箱即用？\"},{\"id\":\"db\",\"label\":\"06 · MyBatis / JDBC\",\"color\":\"#2E9BA5\",\"help\":\"SQL 怎样绑定、执行、映射与缓存？\"},{\"id\":\"cloud\",\"label\":\"07 · Spring Cloud\",\"color\":\"#CE6D75\",\"help\":\"多个服务怎样调用、容错和治理？\"}],\"nodes\":[{\"id\":\"spring\",\"cat\":\"base\",\"title\":\"Spring 总览\",\"sub\":\"说一下你对 Spring 的理解\",\"desc\":\"Spring 是以 IoC 容器为核心、用 AOP/事务等基础设施降低业务耦合的应用框架。\",\"key\":\"IoC 负责 Bean 定义、创建、注入和生命周期，使业务对象不必自行 new 所有依赖。\",\"core\":true},{\"id\":\"ioc\",\"cat\":\"base\",\"title\":\"IoC 容器\",\"sub\":\"Spring IoC和AOP 介绍一下\",\"desc\":\"IoC 管对象及依赖；AOP 管方法调用前后的横切增强，两者经常配合。\",\"key\":\"容器根据 BeanDefinition 实例化、注入并初始化对象。\",\"core\":true},{\"id\":\"di\",\"cat\":\"base\",\"title\":\"依赖注入 DI\",\"sub\":\"依赖倒置，依赖注入，控制反转分别是什么？\",\"desc\":\"DIP 是依赖抽象的设计原则；IoC 是控制权转移思想；DI 是从外部提供依赖的实现方式。\",\"key\":\"DIP：高层业务依赖接口，接口不依赖具体数据库/发送器。\",\"core\":true},{\"id\":\"constructor\",\"cat\":\"base\",\"title\":\"构造器注入\",\"sub\":\"为什么更推荐构造器注入？\",\"desc\":\"构造器注入能使必需依赖显式且完整，便于测试和维护。\",\"key\":\"构造完成就满足依赖不变量，可声明 final 引用。\",\"core\":false},{\"id\":\"autowire\",\"cat\":\"base\",\"title\":\"自动注入规则\",\"sub\":\"@Autowired 和 @Resource 有什么区\",\"desc\":\"@Autowired 是 Spring 注解，主要按类型解析；@Resource 来自 Jakarta/JSR，通常按名称优先再进行匹配。\",\"key\":\"@Autowired 支持构造器、字段、方法和 @Qualifier；单构造器在现代 Spring 中可省略注解。\",\"core\":false},{\"id\":\"beandef\",\"cat\":\"base\",\"title\":\"BeanDefinition\",\"sub\":\"如果让你设计一个SpringIoc，你觉得会从哪些方面\",\"desc\":\"先设计 Bean 定义与注册中心，再实现创建、注入、作用域、生命周期和扩展。\",\"key\":\"使用 BeanDefinition 描述类型、工厂、依赖、作用域等元数据，并提供 getBean API。\",\"core\":true},{\"id\":\"context\",\"cat\":\"base\",\"title\":\"ApplicationContext\",\"sub\":\"BeanFactory 和 ApplicationCo\",\"desc\":\"BeanFactory 是基础容器接口；ApplicationContext 进一步提供事件、资源、国际化与集成能力。\",\"key\":\"BeanFactory 定义 getBean 等获取与工厂功能。\",\"core\":false},{\"id\":\"factorybean\",\"cat\":\"base\",\"title\":\"FactoryBean\",\"sub\":\"BeanFactory 和 FactoryBean 有\",\"desc\":\"BeanFactory 是管理 Bean 的容器；FactoryBean\\u003cT> 是供容器创建特定产品对象的特殊 Bean。\",\"key\":\"BeanFactory 接口提供 getBean、containsBean 等容器操作。\",\"core\":false},{\"id\":\"annotations\",\"cat\":\"base\",\"title\":\"注解驱动\",\"sub\":\"spring 常用注解有什么？\",\"desc\":\"按用途记注解：声明 Bean、依赖注入、配置、AOP、事务、Web。\",\"key\":\"组件扫描：@Component、@Service、@Repository、@Controller。\",\"core\":false},{\"id\":\"reflection\",\"cat\":\"base\",\"title\":\"反射与实例化\",\"sub\":\"什么是反射？有哪些使用场景？\",\"desc\":\"反射是运行时读取类结构并创建实例、访问成员的方法，是框架基础设施之一。\",\"key\":\"Class/Constructor/Method/Field 可以在运行时描述和调用类型成员。\",\"core\":false},{\"id\":\"patterns\",\"cat\":\"base\",\"title\":\"设计模式\",\"sub\":\"spring框架中都用到了哪些设计模式\",\"desc\":\"Spring 大量使用工厂、代理、模板方法、策略、观察者、适配器等模式。\",\"key\":\"BeanFactory 体现工厂；AOP 体现代理；JdbcTemplate 体现模板方法/回调。\",\"core\":false},{\"id\":\"lifecycle\",\"cat\":\"bean\",\"title\":\"Bean 生命周期\",\"sub\":\"Bean的生命周期说一下？\",\"desc\":\"Bean 生命周期可按定义解析→实例化→依赖填充→初始化扩展→代理→使用→销毁理解。\",\"key\":\"容器读取 BeanDefinition，实例化后完成依赖注入和各类 Aware 回调。\",\"core\":true},{\"id\":\"scope\",\"cat\":\"bean\",\"title\":\"Bean 作用域\",\"sub\":\"Bean是否单例？\",\"desc\":\"Spring Bean 默认是 singleton 作用域，但也支持 prototype 和 Web 作用域。\",\"key\":\"singleton 是每个 IoC 容器中每个 Bean 定义通常一个共享实例，不是 JVM 级单例。\",\"core\":false},{\"id\":\"threadsafe\",\"cat\":\"bean\",\"title\":\"单例与线程安全\",\"sub\":\"Spring单例Bean是线程安全的吗？\",\"desc\":\"不是天然线程安全；如果持有可变共享字段仍会有竞态。\",\"key\":\"singleton 表示单容器共享实例，不提供并发访问互斥。\",\"core\":false},{\"id\":\"prototype\",\"cat\":\"bean\",\"title\":\"单例注入原型 Bean\",\"sub\":\"单例Bean里注入prototype Bean，每次使\",\"desc\":\"通常不会：singleton 构造/注入时解析 prototype 一次，后续持有同一个实例。\",\"key\":\"prototype 表示每次向容器请求新对象，不表示每次访问字段都自动刷新。\",\"core\":false},{\"id\":\"callbacks\",\"cat\":\"bean\",\"title\":\"初始化 / 销毁钩子\",\"sub\":\"在Spring中，在bean加载/销毁前后，如果想实现\",\"desc\":\"可使用 @PostConstruct/@PreDestroy、InitializingBean/DisposableBean、initMethod/destroyMethod 或后处理器。\",\"key\":\"单 Bean 初始化/销毁优先使用生命周期回调。\",\"core\":false},{\"id\":\"postprocessor\",\"cat\":\"bean\",\"title\":\"Bean 后处理器\",\"sub\":\"BeanFactoryPostProcessor 和 \",\"desc\":\"前者处理 BeanDefinition 元数据，后者处理具体 Bean 实例初始化前后。\",\"key\":\"BeanFactoryPostProcessor 在一般 Bean 实例化前修改配置定义。\",\"core\":false},{\"id\":\"extension\",\"cat\":\"bean\",\"title\":\"容器扩展点\",\"sub\":\"Spring给我们提供了很多扩展点，这些有了解吗？\",\"desc\":\"重点围绕 Bean 定义、初始化、上下文刷新、事件和启动器阶段的扩展点分层回答。\",\"key\":\"定义层：BeanDefinitionRegistryPostProcessor、BeanFactoryPostProcessor。\",\"core\":false},{\"id\":\"circular\",\"cat\":\"bean\",\"title\":\"循环依赖\",\"sub\":\"spring是如何解决循环依赖的？\",\"desc\":\"传统 Spring 单例的部分 Setter/字段循环依赖可以通过提前暴露对象引用解决。\",\"key\":\"实例化 A 后，可在依赖填充之前将早期引用工厂暴露到 singletonFactories。\",\"core\":true},{\"id\":\"threecache\",\"cat\":\"bean\",\"title\":\"三级缓存 / 早期引用\",\"sub\":\"Spring为什么用3级缓存解决循环依赖问题？用2级缓\",\"desc\":\"三级缓存的关键价值是通过 ObjectFactory 延迟生成早期引用，尤其处理 AOP 代理一致性。\",\"key\":\"一级 singletonObjects 放完整单例，二级 earlySingletonObjects 放已创建的早期引用。\",\"core\":true},{\"id\":\"aop\",\"cat\":\"cross\",\"title\":\"AOP 术语\",\"sub\":\"Spring的aop介绍一下\",\"desc\":\"AOP 把日志、权限、事务等横切逻辑抽成切面，在匹配的方法调用上执行通知。\",\"key\":\"Aspect 是切面，Pointcut 匹配连接点，Advice 定义执行动作。\",\"core\":true},{\"id\":\"aopproxy\",\"cat\":\"cross\",\"title\":\"AOP 自动代理\",\"sub\":\"IOC和AOP是通过什么机制来实现的?\",\"desc\":\"IoC 通过 BeanDefinition、工厂与依赖解析实现；Spring AOP 主要通过 JDK/CGLIB 代理实现。\",\"key\":\"容器扫描或读取 Bean 定义，利用构造器、工厂方法与反射等完成实例化。\",\"core\":true},{\"id\":\"aopuse\",\"cat\":\"cross\",\"title\":\"切面应用\",\"sub\":\"AOP在spring中的应用，你知道哪些？\",\"desc\":\"典型应用是事务、日志、权限、指标、重试与缓存切面。\",\"key\":\"@Transactional 使用事务拦截器创建/参与事务。\",\"core\":false},{\"id\":\"proxy\",\"cat\":\"cross\",\"title\":\"JDK / CGLIB 代理\",\"sub\":\"动态代理是什么？\",\"desc\":\"动态代理是在运行时创建代理对象，统一转发和增强目标方法调用。\",\"key\":\"JDK Proxy 生成实现接口的代理并由 InvocationHandler 分派。\",\"core\":true},{\"id\":\"aopanno\",\"cat\":\"cross\",\"title\":\"切面注解\",\"sub\":\"AOP实现有哪些注解？\",\"desc\":\"常见 @Aspect、@Pointcut、@Before、@After、@Around、@AfterReturning、@AfterThrowing。\",\"key\":\"@Aspect 标识切面，@Pointcut 复用切点表达式。\",\"core\":false},{\"id\":\"txproxy\",\"cat\":\"cross\",\"title\":\"事务拦截器\",\"sub\":\"Spring声明式事务的实现原理是什么？\",\"desc\":\"@Transactional 属于 AOP 代理型事务：事务拦截器根据元数据控制事务管理器。\",\"key\":\"容器创建符合条件的代理，调用通过 TransactionInterceptor。\",\"core\":true},{\"id\":\"txfail\",\"cat\":\"cross\",\"title\":\"事务失效\",\"sub\":\"Spring的事务什么情况下会失效？\",\"desc\":\"声明式事务失效先排查代理是否生效、异常是否触发回滚、事务管理器是否正确。\",\"key\":\"同类 this 自调用或对象不是 Spring 管理的 Bean，可能绕过代理。\",\"core\":true},{\"id\":\"selfinvoke\",\"cat\":\"cross\",\"title\":\"this 自调用\",\"sub\":\"Spring的事务，使用this调用是否生效？\",\"desc\":\"在默认代理事务模式中，this 调用自身方法绕过代理，因此目标方法上的事务增强不会被触发。\",\"key\":\"代理拦截发生在其他对象调用代理时，this 指向目标对象内部调用。\",\"core\":true},{\"id\":\"propagation\",\"cat\":\"cross\",\"title\":\"事务传播\",\"sub\":\"Spring事务的传播行为有哪些？\",\"desc\":\"常见 7 种传播行为：REQUIRED、REQUIRES_NEW、NESTED、SUPPORTS、MANDATORY、NOT_SUPPORTED、NEVER。\",\"key\":\"REQUIRED 默认：有事务就加入，没有则新建；REQUIRES_NEW 总开启新事务并挂起外层。\",\"core\":true},{\"id\":\"nested\",\"cat\":\"cross\",\"title\":\"REQUIRES_NEW vs NESTED\",\"sub\":\"REQUIRES_NEW 和 NESTED 有什么区别\",\"desc\":\"REQUIRES_NEW 使用独立物理事务，NESTED 通常在同一个物理事务里建立保存点。\",\"key\":\"REQUIRES_NEW 挂起外层事务资源并创建独立事务，内部提交不受外层回滚直接撤销。\",\"core\":false},{\"id\":\"rollbackonly\",\"cat\":\"cross\",\"title\":\"rollback-only\",\"sub\":\"为什么捕获了异常，事务还是回滚了？\",\"desc\":\"因为当前事务可能已被内部调用标记 rollback-only，外层即使捕获异常也不能再成功提交。\",\"key\":\"内层 REQUIRED 方法加入同一个物理事务；它抛 RuntimeException 时事务拦截器可标记回滚。\",\"core\":false},{\"id\":\"isolation\",\"cat\":\"cross\",\"title\":\"隔离级别 / readOnly\",\"sub\":\"@Transactional里的隔离级别和readOn\",\"desc\":\"isolation 指定数据库事务隔离要求；readOnly 是只读意图提示，不等于强制禁止写。\",\"key\":\"Isolation 常见 READ_UNCOMMITTED、READ_COMMITTED、REPEATABLE_READ、SERIALIZABLE 和 DEFAULT。\",\"core\":false},{\"id\":\"mvc\",\"cat\":\"mvc\",\"title\":\"MVC 分层\",\"sub\":\"MVC分层介绍一下\",\"desc\":\"MVC 分离 Model（模型）、View（视图）、Controller（请求协调）；后端工程还常以 Controller/Service/DAO 分层。\",\"key\":\"Controller 接收 HTTP 请求、参数校验和委托业务操作。\",\"core\":true},{\"id\":\"dispatch\",\"cat\":\"mvc\",\"title\":\"DispatcherServlet\",\"sub\":\"了解SpringMVC的处理流程吗？\",\"desc\":\"Servlet 请求先到 DispatcherServlet，再经映射器、适配器执行 Controller，最后处理返回值。\",\"key\":\"DispatcherServlet 接请求，HandlerMapping 找到 Handler 和拦截器链。\",\"core\":true},{\"id\":\"controller\",\"cat\":\"mvc\",\"title\":\"Controller / REST\",\"sub\":\"@Controller 和 @RestControll\",\"desc\":\"@RestController 相当于 @Controller + @ResponseBody，通常直接返回响应体。\",\"key\":\"@Controller 常配合视图名、Model 返回页面，也可单独给方法加 @ResponseBody。\",\"core\":false},{\"id\":\"binding\",\"cat\":\"mvc\",\"title\":\"参数绑定\",\"sub\":\"@RequestParam、@PathVariable\",\"desc\":\"@RequestParam 绑定查询或表单参数，@PathVariable 绑定 URL 路径变量，@RequestBody 读取请求体。\",\"key\":\"@RequestParam 对应 /users?page=2 中的 page，也可处理表单字段。\",\"core\":false},{\"id\":\"exception\",\"cat\":\"mvc\",\"title\":\"统一异常处理\",\"sub\":\"SpringMVC怎么统一处理异常？\",\"desc\":\"用 @ControllerAdvice/@RestControllerAdvice + @ExceptionHandler 统一将异常映射为 HTTP 响应。\",\"key\":\"Controller 执行异常被 HandlerExceptionResolver 体系处理。\",\"core\":false},{\"id\":\"handler\",\"cat\":\"mvc\",\"title\":\"Mapping / Adapter\",\"sub\":\"Handlermapping 和 handlerada\",\"desc\":\"HandlerMapping 负责“找谁处理”，HandlerAdapter 负责“怎么调用处理器”。\",\"key\":\"映射器依据 URL、HTTP 方法和注解等定位 HandlerExecutionChain。\",\"core\":false},{\"id\":\"boot\",\"cat\":\"boot\",\"title\":\"Boot 核心价值\",\"sub\":\"为什么使用springboot\",\"desc\":\"Spring Boot 的目标是快速搭建可运行 Spring 应用，减少样板配置与环境整合成本。\",\"key\":\"starter 提供按场景组织的依赖集合，减少人工挑选 Jar。\",\"core\":true},{\"id\":\"convention\",\"cat\":\"boot\",\"title\":\"约定大于配置\",\"sub\":\"怎么理解SpringBoot中的约定大于配置\",\"desc\":\"Boot 为常见场景提供合理默认配置，只有需要偏离默认时才显式覆盖。\",\"key\":\"约定包括配置文件命名、包扫描位置、starter 依赖组合和自动配置条件。\",\"core\":false},{\"id\":\"bootproject\",\"cat\":\"boot\",\"title\":\"项目结构 / 扫描\",\"sub\":\"SpringBoot的项目结构是怎么样的？\",\"desc\":\"通常将启动类放顶层包，按业务或分层组织 Controller、Service、Repository、配置与测试。\",\"key\":\"@SpringBootApplication 所在包决定默认组件扫描基准包。\",\"core\":false},{\"id\":\"autoconfig\",\"cat\":\"boot\",\"title\":\"自动配置\",\"sub\":\"SpringBoot自动装配原理是什么？\",\"desc\":\"@SpringBootApplication 开启自动配置，Boot 导入候选配置类，再由 @Conditional 等条件决定哪些 Bean 生效。\",\"key\":\"@SpringBootApplication 组合 @SpringBootConfiguration、@EnableAutoConfiguration、@ComponentScan。\",\"core\":true},{\"id\":\"starter\",\"cat\":\"boot\",\"title\":\"Starter 依赖\",\"sub\":\"说几个启动器（starter)？\",\"desc\":\"starter 是按使用场景聚合依赖的入口，不是负责扫描 Bean 的运行时引擎。\",\"key\":\"常见 web、data-jpa、jdbc、validation、security、actuator、test。\",\"core\":true},{\"id\":\"starterdev\",\"cat\":\"boot\",\"title\":\"自定义 Starter\",\"sub\":\"写过SpringBoot starter吗?\",\"desc\":\"自定义 Starter 应提供自动配置类、条件配置、属性绑定、元数据与自动配置导入文件。\",\"key\":\"创建业务模块并用 @ConfigurationProperties 定义可配置项，提供 @AutoConfiguration 类与条件。\",\"core\":false},{\"id\":\"bootstart\",\"cat\":\"boot\",\"title\":\"应用启动流程\",\"sub\":\"SpringBoot启动流程大致是什么？\",\"desc\":\"main 调用 SpringApplication.run，依次准备环境、创建上下文、加载 Bean、刷新容器并运行启动回调。\",\"key\":\"解析配置/环境与启动参数，发布启动阶段事件。\",\"core\":true},{\"id\":\"bootdebug\",\"cat\":\"boot\",\"title\":\"条件报告排查\",\"sub\":\"自动配置没有生效，怎么排查？\",\"desc\":\"先确认依赖与版本，再看条件评估报告、扫描范围、属性绑定和是否被用户 Bean 覆盖。\",\"key\":\"启动 --debug 或看 Actuator conditions 获取哪些 @Conditional 通过/未通过。\",\"core\":false},{\"id\":\"configprops\",\"cat\":\"boot\",\"title\":\"配置属性绑定\",\"sub\":\"@Value 和 @ConfigurationProp\",\"desc\":\"@Value 适合少量单值/表达式；@ConfigurationProperties 适合结构化、批量、类型安全配置。\",\"key\":\"@Value 支持 ${...}、SpEL，常直接注入一个字段或构造参数。\",\"core\":false},{\"id\":\"configorder\",\"cat\":\"boot\",\"title\":\"配置源优先级\",\"sub\":\"SpringBoot配置文件的优先级是怎样的？\",\"desc\":\"常见配置源从高到低是命令行参数、Java 系统属性、操作系统环境变量、配置文件。\",\"key\":\"在默认文件搜索顺序中，包外文件优先于包内文件。同一位置的 .properties 优先于 YAML。\",\"core\":false},{\"id\":\"filters\",\"cat\":\"boot\",\"title\":\"Filter / Interceptor\",\"sub\":\"SpringBoot 过滤器和拦截器说一下？\",\"desc\":\"Filter 属于 Servlet 规范，HandlerInterceptor 属于 Spring MVC，二者位置和可见上下文不同。\",\"key\":\"Filter 在 DispatcherServlet 前后的 Servlet 链上工作，可处理包装请求、跨域等。\",\"core\":false},{\"id\":\"jdbc\",\"cat\":\"db\",\"title\":\"JDBC 基础\",\"sub\":\"还记得JDBC连接数据库的步骤吗？\",\"desc\":\"典型 JDBC：获取 DataSource 连接→准备 SQL→绑定参数→执行→读取结果→关闭资源。\",\"key\":\"应用从连接池 DataSource 获取 Connection，而非每次手动创建物理连接。\",\"core\":false},{\"id\":\"mybatis\",\"cat\":\"db\",\"title\":\"MyBatis 核心\",\"sub\":\"与传统的JDBC相比，MyBatis的优点？\",\"desc\":\"MyBatis 是 SQL 映射框架，减少 JDBC 模板代码并管理参数绑定、结果映射、事务集成。\",\"key\":\"自动管理 PreparedStatement 的创建、参数设置与结果封装（具体资源由框架/session 管理）。\",\"core\":true},{\"id\":\"sqlsession\",\"cat\":\"db\",\"title\":\"SqlSession\",\"sub\":\"如果项目中要用到原生的mybatis去查询，该怎样写？\",\"desc\":\"原生 MyBatis 使用 SqlSessionFactory 打开 SqlSession，再通过 Mapper 调用 SQL 并提交/关闭。\",\"key\":\"通过配置创建 SqlSessionFactory，映射 XML 或注解语句。\",\"core\":false},{\"id\":\"param\",\"cat\":\"db\",\"title\":\"#{ } / ${ }\",\"sub\":\"Mybatis里的 # 和 $ 的区别？\",\"desc\":\"#{ } 通常绑定参数并转为 JDBC ?；${ } 是字符串直接替换，可能导致 SQL 注入。\",\"key\":\"#{name} 使用 PreparedStatement 参数绑定，适合用户输入值。\",\"core\":true},{\"id\":\"executor\",\"cat\":\"db\",\"title\":\"执行器 / MapperProxy\",\"sub\":\"MyBatis的执行流程是什么？\",\"desc\":\"Mapper 调用进入代理→定位 MappedStatement→Executor→StatementHandler/ParameterHandler→JDBC→ResultSetHandler。\",\"key\":\"MapperProxy 解析接口方法，找到绑定的 SQL 映射语句。\",\"core\":true},{\"id\":\"cache\",\"cat\":\"db\",\"title\":\"一二级缓存\",\"sub\":\"MyBatis的一级缓存和二级缓存有什么区别？\",\"desc\":\"一级缓存通常是 SqlSession 本地缓存；二级缓存按 Mapper namespace 跨 Session 共享（需配置）。\",\"key\":\"一级缓存生命周期与 Session 相关，重复相同查询可命中，但更新会清理相关缓存。\",\"core\":false},{\"id\":\"mapping\",\"cat\":\"db\",\"title\":\"resultType / resultMap\",\"sub\":\"resultType 和 resultMap 有什么区\",\"desc\":\"resultType 声明简单结果对象类型；resultMap 用显式映射规则处理复杂列名及关联。\",\"key\":\"列名与属性名基本对应时，resultType 简洁。\",\"core\":false},{\"id\":\"mybatisplus\",\"cat\":\"db\",\"title\":\"MyBatis-Plus\",\"sub\":\"MybatisPlus和Mybatis的区别？\",\"desc\":\"MyBatis-Plus 是基于 MyBatis 的增强工具，提供通用 CRUD、Wrapper 等便利 API。\",\"key\":\"MyBatis 保留高度显式的 SQL 配置和映射能力。\",\"core\":false},{\"id\":\"cloud\",\"cat\":\"cloud\",\"title\":\"Cloud / Boot 边界\",\"sub\":\"了解SpringCloud吗，说一下他和SpringB\",\"desc\":\"Spring Boot 侧重单个应用的配置与运行；Spring Cloud 侧重分布式服务治理的基础能力。\",\"key\":\"Boot 提供容器启动、自动配置、Web/数据等应用内能力。\",\"core\":true},{\"id\":\"cloudcomponents\",\"cat\":\"cloud\",\"title\":\"微服务组件链\",\"sub\":\"用过哪些微服务组件？\",\"desc\":\"按请求链路说明注册发现、网关、配置、负载均衡、远程调用、熔断、可观测性。\",\"key\":\"注册发现可用 Consul/Nacos/Eureka 等生态选择；网关可用 Spring Cloud Gateway。\",\"core\":false},{\"id\":\"balance\",\"cat\":\"cloud\",\"title\":\"负载均衡\",\"sub\":\"负载均衡有哪些算法？\",\"desc\":\"典型轮询、随机、加权轮询、最少连接、最短响应与一致性哈希等。\",\"key\":\"轮询简单均匀，权重方式允许高配置实例承载更多请求。\",\"core\":true},{\"id\":\"sticky\",\"cat\":\"cloud\",\"title\":\"粘性路由 / 哈希\",\"sub\":\"如何实现一直均衡给一个用户？\",\"desc\":\"如果要同一用户尽量命中固定节点，可按用户 ID 做一致性哈希或粘性会话，但最好服务无状态。\",\"key\":\"从 cookie/token 或经认证的用户标识生成稳定路由 key。\",\"core\":false},{\"id\":\"circuit\",\"cat\":\"cloud\",\"title\":\"熔断器\",\"sub\":\"介绍一下服务熔断\",\"desc\":\"以 Resilience4j 为例，熔断器处于 OPEN 时拒绝经过该熔断器的新调用，进入 HALF_OPEN 后才放行有限的探测调用。\",\"key\":\"CLOSED 观察失败率和慢调用率。达到配置阈值后进入 OPEN，探测结果决定是否恢复。\",\"core\":false},{\"id\":\"degrade\",\"cat\":\"cloud\",\"title\":\"服务降级\",\"sub\":\"介绍一下服务降级\",\"desc\":\"降级是在服务压力大或依赖异常时保留核心能力，牺牲非关键功能或返回替代结果。\",\"key\":\"预先定义可降级模块和可接受的兜底结果。\",\"core\":false},{\"id\":\"resilience\",\"cat\":\"cloud\",\"title\":\"限流 / 熔断 / 降级\",\"sub\":\"限流、熔断和降级有什么区别？\",\"desc\":\"限流限制进入流量，熔断依据故障停止部分依赖调用，降级提供功能或结果上的退化策略。\",\"key\":\"限流在入口保护容量，如令牌桶、漏桶、固定/滑动窗口。\",\"core\":true},{\"id\":\"retry\",\"cat\":\"cloud\",\"title\":\"重试 / 幂等\",\"sub\":\"微服务调用失败后，能不能直接重试？\",\"desc\":\"不能无脑重试，要先识别操作是否幂等、错误是否瞬时、超时预算是否允许。\",\"key\":\"GET 查询或幂等写入更适合有限重试；扣款/下单等非幂等操作须使用幂等键和去重。\",\"core\":true},{\"id\":\"container\",\"cat\":\"base\",\"title\":\"BeanFactory 依赖解析\",\"sub\":\"候选 Bean / Qualifier\",\"desc\":\"BeanFactory 对候选 Bean 进行按类型、名称、限定符和优先级的依赖解析。\",\"key\":\"找到候选≠依赖注入已完成。\",\"core\":true},{\"id\":\"earlyproxy\",\"cat\":\"bean\",\"title\":\"早期 AOP 代理\",\"sub\":\"getEarlyBeanReference\",\"desc\":\"三级缓存的工厂在循环依赖需要时可提前暴露适用的代理引用。\",\"key\":\"代理一致性才是理解第三级缓存的重要切入点。\",\"core\":false},{\"id\":\"methodchain\",\"cat\":\"cross\",\"title\":\"拦截器链\",\"sub\":\"Advice → Target\",\"desc\":\"代理对象内部按顺序执行 MethodInterceptor 链，最后调用目标方法。\",\"key\":\"链上的事务、缓存、重试顺序会改变语义。\",\"core\":true},{\"id\":\"transactionmanager\",\"cat\":\"cross\",\"title\":\"事务管理器\",\"sub\":\"PlatformTransactionManager\",\"desc\":\"TransactionInterceptor 委托事务管理器获取/提交/回滚事务。\",\"key\":\"单个本地事务管理器无法自动覆盖 RPC。\",\"core\":false},{\"id\":\"savepoint\",\"cat\":\"cross\",\"title\":\"保存点 Savepoint\",\"sub\":\"单物理事务局部回滚\",\"desc\":\"NESTED 常依赖 JDBC Savepoint 在已有事务中局部撤销。\",\"key\":\"保存点不等于独立数据库事务。\",\"core\":false},{\"id\":\"servlet\",\"cat\":\"mvc\",\"title\":\"Servlet / Filter 链\",\"sub\":\"HTTP 进入容器\",\"desc\":\"HTTP 请求在 Servlet 容器中先经过 Filter 等，再到 DispatcherServlet。\",\"key\":\"Filter 和 Spring MVC Interceptor 所处层次不同。\",\"core\":false},{\"id\":\"condition\",\"cat\":\"boot\",\"title\":\"@Conditional 条件\",\"sub\":\"OnClass / MissingBean\",\"desc\":\"根据类路径、属性和已有 Bean 判断是否应用某份自动配置。\",\"key\":\"Starter 存在不等于条件成立。\",\"core\":true},{\"id\":\"imports\",\"cat\":\"boot\",\"title\":\"AutoConfiguration.imports\",\"sub\":\"候选配置发现\",\"desc\":\"Spring Boot 3+ 常用 AutoConfiguration.imports 声明自动配置类。\",\"key\":\"与旧的 spring.factories 装配机制分清版本。\",\"core\":false},{\"id\":\"prepared\",\"cat\":\"db\",\"title\":\"PreparedStatement\",\"sub\":\"安全参数绑定\",\"desc\":\"SQL 语句结构与参数值分离，降低 SQL 注入风险并便于重复执行。\",\"key\":\"SQL 标识符不能用 ? 作为普通参数替代。\",\"core\":false},{\"id\":\"mapperproxy\",\"cat\":\"db\",\"title\":\"Mapper 动态代理\",\"sub\":\"接口 → SQL 映射\",\"desc\":\"MyBatis 使用代理把 Mapper 接口方法调用转换为 mapped statement 执行。\",\"key\":\"接口无实现类不等于 SQL 会自动生成。\",\"core\":true},{\"id\":\"idempotency\",\"cat\":\"cloud\",\"title\":\"幂等键 / 去重\",\"sub\":\"请求不确定结果\",\"desc\":\"跨服务重试前先确保重复请求不会造成重复扣款等副作用。\",\"key\":\"超时不代表业务操作没有完成。\",\"core\":true},{\"id\":\"timeout\",\"cat\":\"cloud\",\"title\":\"超时与容量预算\",\"sub\":\"调用链边界\",\"desc\":\"每层调用应控制超时、线程/连接池容量与重试预算，避免级联放大。\",\"key\":\"把重试加到熔断前可能显著放大负载。\",\"core\":false}],\"edges\":[{\"a\":\"spring\",\"b\":\"ioc\",\"kind\":\"基础\",\"why\":\"Spring 使用 IoC 管理业务组 "a\":\"sticky\",\"b\":\"idempotency\",\"kind\":\"实现对比\",\"why\":\"按用户定向路由不能替代数据层幂等保护\"},{\"a\":\"balance\",\"b\":\"timeout\",\"kind\":\"实战应用\",\"why\":\"负载均衡结合健康检查和容量\"},{\"a\":\"ioc\",\"b\":\"lifecycle\",\"kind\":\"共享机制\",\"why\":\"Bean 由容器创建后必须完成初始化才能安全使用\"},{\"a\":\"context\",\"b\":\"beandef\",\"kind\":\"共享机制\",\"why\":\"ApplicationContext 通过 BeanFactory 使用定义元数据\"},{\"a\":\"threadsafe\",\"b\":\"txproxy\",\"kind\":\"实战应用\",\"why\":\"事务不会自动保护单例内存字段的并发写入\"},{\"a\":\"aop\",\"b\":\"txfail\",\"kind\":\"实战应用\",\"why\":\"事务失败很多来自 AOP 代理边界\"},{\"a\":\"aopuse\",\"b\":\"txproxy\",\"kind\":\"实战应用\",\"why\":\"事务是最常见的 AOP 通知示例\"},{\"a\":\"aopproxy\",\"b\":\"bootdebug\",\"kind\":\"实战应用\",\"why\":\"缺少代理时应核对切面依赖和自动配置条件\"},{\"a\":\"annotations\",\"b\":\"autoconfig\",\"kind\":\"共享机制\",\"why\":\"自动配置注解注册出条件化的 Bean 定义\"},{\"a\":\"servlet\",\"b\":\"dispatch\",\"kind\":\"基础\",\"why\":\"请求在 Servlet 容器中进入前端控制器\"},{\"a\":\"handler\",\"b\":\"binding\",\"kind\":\"深入\",\"why\":\"HandlerAdapter 使用参数解析器给方法入参赋值\"},{\"a\":\"prepared\",\"b\":\"jdbc\",\"kind\":\"共享机制\",\"why\":\"MyBatis 参数化最终落到 JDBC 预编译语句\"},{\"a\":\"mapping\",\"b\":\"reflection\",\"kind\":\"共享机制\",\"why\":\"结果映射可能使用反射或对象工厂完成字段写入\"},{\"a\":\"autoconfig\",\"b\":\"mybatis\",\"kind\":\"实战应用\",\"why\":\"MyBatis Boot Starter 结合自动配置实现 Mapper 整合\"},{\"a\":\"cloudcomponents\",\"b\":\"retry\",\"kind\":\"实战应用\",\"why\":\"远程调用框架可能配置有限重试策略\"}],\"routes\":[{\"id\":\"main\",\"label\":\"从 Spring 请求到数据库\",\"desc\":\"Boot 启动 → IoC → MVC → AOP 事务 → MyBatis\",\"nodes\":[\"spring\",\"boot\",\"bootstart\",\"context\",\"ioc\",\"beandef\",\"lifecycle\",\"aopproxy\",\"dispatch\",\"handler\",\"controller\",\"txproxy\",\"transactionmanager\",\"mybatis\",\"mapperproxy\",\"executor\",\"jdbc\"]},{\"id\":\"ioc\",\"label\":\"IoC 是怎么真正创建 Bean 的？\",\"desc\":\"定义→依赖解析→构造器→初始化→扩展\",\"nodes\":[\"spring\",\"ioc\",\"beandef\",\"container\",\"autowire\",\"di\",\"constructor\",\"context\",\"lifecycle\",\"postprocessor\",\"callbacks\",\"extension\"]},{\"id\":\"cycle\",\"label\":\"循环依赖为什么扯到 AOP？\",\"desc\":\"实例化→三级缓存→早期引用→代理一致性\",\"nodes\":[\"beandef\",\"lifecycle\",\"circular\",\"threecache\",\"earlyproxy\",\"aopproxy\",\"postprocessor\",\"constructor\",\"scope\"]},{\"id\":\"aop\",\"label\":\"AOP、动态代理和事务有什么联系？\",\"desc\":\"切点→代理→拦截器链→事务管理器\",\"nodes\":[\"aop\",\"aopanno\",\"proxy\",\"aopproxy\",\"methodchain\",\"aopuse\",\"txproxy\",\"transactionmanager\",\"selfinvoke\",\"txfail\"]},{\"id\":\"tx\",\"label\":\"为什么 @Transactional 会失效？\",\"desc\":\"this→代理边界→异常→rollback-only→传播\",\"nodes\":[\"aopproxy\",\"selfinvoke\",\"txproxy\",\"txfail\",\"rollbackonly\",\"propagation\",\"nested\",\"savepoint\",\"isolation\",\"transactionmanager\"]},{\"id\":\"mvc\",\"label\":\"一次 HTTP 请求经历什么？\",\"desc\":\"Filter→DispatcherServlet→映射→适配→响应\",\"nodes\":[\"servlet\",\"filters\",\"dispatch\",\"handler\",\"controller\",\"binding\",\"exception\",\"mvc\"]},{\"id\":\"boot\",\"label\":\"Starter 为什么一导入就能用？\",\"desc\":\"依赖→导入→条件→属性→Bean\",\"nodes\":[\"boot\",\"starter\",\"imports\",\"autoconfig\",\"condition\",\"beandef\",\"configprops\",\"starterdev\",\"bootdebug\",\"convention\",\"configorder\",\"bootstart\"]},{\"id\":\"mybatis\",\"label\":\"Mapper 接口最终怎样执行 SQL？\",\"desc\":\"MapperProxy→Executor→PreparedStatement→映射\",\"nodes\":[\"mybatis\",\"sqlsession\",\"mapperproxy\",\"executor\",\"prepared\",\"param\",\"mapping\",\"cache\",\"jdbc\",\"factorybean\",\"txproxy\"]},{\"id\":\"cloud\",\"label\":\"微服务为什么不能直接重试？\",\"desc\":\"负载均衡→超时→熔断→降级→幂等\",\"nodes\":[\"cloud\",\"cloudcomponents\",\"balance\",\"sticky\",\"timeout\",\"resilience\",\"circuit\",\"degrade\",\"retry\",\"idempotency\"]},{\"id\":\"shared\",\"label\":\"从底层看共享机制\",\"desc\":\"工厂/代理/后处理/事务/Mapper 都如何复用\",\"nodes\":[\"patterns\",\"reflection\",\"beandef\",\"factorybean\",\"postprocessor\",\"aopproxy\",\"proxy\",\"methodchain\",\"txproxy\",\"mybatis\",\"mapperproxy\",\"executor\",\"autoconfig\",\"condition\"]}],\"questions\":[{\"id\":1,\"title\":\"说一下你对 Spring 的理解\",\"node\":\"spring\",\"cat\":\"spring\",\"short\":\"Spring 是以 IoC 容器为核心、用 AOP/事务等基础设施降低业务耦合的应用框架。\",\"details\":[\"IoC 负责 Bean 定义、创建、注入和生命周期，使业务对象不必自行 new 所有依赖。\",\"AOP 通过代理为方法调用添加事务、日志等横切行为。\",\"Spring Framework 提供事务、事件、资源访问和 MVC 等模块；Spring Boot 则在其上提供自动配置与应用启动体验。\"],\"example\":\"订单服务由容器注入 Repository，@Transactional 在调用时通过事务代理控制数据库提交。\",\"trap\":\"Spring 不等于 Spring Boot；IoC 不保证自动线程安全。\",\"interview\":\"Spring 是以 IoC 容器为核心、用 AOP/事务等基础设施降低业务耦合的应用框架。 具体来说：IoC 负责 Bean 定义、创建、注入和生命周期，使业务对象不必自行 new 所有依赖。；AOP 通过代理为方法调用添加事务、日志等横切行为。；Spring Framework 提供事务、事件、资源访问和 MVC 等模块；Spring Boot 则在其上提供自动配置与应用启动体验。。\",\"code\":\"\"},{\"id\":2,\"title\":\"spring的核心思想说说你的理解？\",\"node\":\"spring\",\"cat\":\"spring\",\"short\":\"核心是控制反转（IoC）、依赖注入（DI）和面向切面编程（AOP），目标是解耦。\",\"details\":[\"IoC 把对象组装的控制权交给容器。\",\"DI 将依赖从外部传入，可使用构造器、Setter 或字段注入。\",\"AOP 抽离跨服务的事务、安全、审计等横切逻辑。\"],\"example\":\"支付服务依赖 PaymentGateway 接口；容器注入真实实现；AOP 统一记录耗时。\",\"trap\":\"DI 是 IoC 的常见实现方式，不应当把三个概念完全等同。\",\"interview\":\"核心是控制反转（IoC）、依赖注入（DI）和面向切面编程（AOP），目标是解耦。 具体来说：IoC 把对象组装的控制权交给容器。；DI 将依赖从外部传入，可使用构造器、Setter 或字段注入。；AOP 抽离跨服务的事务、安全、审计等横切逻辑。。\",\"code\":\"\"},{\"id\":3,\"title\":\"Spring IoC和AOP 介绍一下\",\"node\":\"ioc\",\"cat\":\"spring\",\"short\":\"IoC 管对象及依赖；AOP 管方法调用前后的横切增强，两者经常配合。\",\"details\":[\"容器根据 BeanDefinition 实例化、注入并初始化对象。\",\"AOP 根据切点和通知构建代理对象，外部调用代理时执行拦截器链。\",\"声明式事务就是容器拿到 Bean 后，通过代理添加事务边界的典型组合。\"],\"example\":\"@Service 对象由容器提供；调用其 @Transactional 方法时代理先开事务。\",\"trap\":\"IoC 本身不是代理；AOP 默认也不会增强普通的 this 内部调用。\",\"interview\":\"IoC 管对象及依赖；AOP 管方法调用前后的横切增强，两者经常配合。 具体来说：容器根据 BeanDefinition 实例化、注入并初始化对象。；AOP 根据切点和通知构建代理对象，外部调用代理时执行拦截器链。；声明式事务就是容器拿到 Bean 后，通过代理添加事务边界的典型组合。。\",\"code\":\"\"},{\"id\":4,\"title\":\"Spring的aop介绍一下\",\"node\":\"aop\",\"cat\":\"spring\",\"short\":\"AOP 把日志、权限、事务等横切逻辑抽成切面，在匹配的方法调用上执行通知。\",\"details\":[\"Aspect 是切面，Pointcut 匹配连接点，Advice 定义执行动作。\",\"Spring AOP 主要拦截 Spring 管理 Bean 的方法执行，基于代理。\",\"@Before、@After、@AfterReturning、@AfterThrowing、@Around 分别处理不同执行阶段。\"],\"example\":\"给 @Service 的订单方法加 @Around，记录耗时并调用 proceed()。\",\"trap\":\"Spring AOP 的连接点通常是方法执行，不等于 AspectJ 全部织入能力。\",\"interview\":\"AOP 把日志、权限、事务等横切逻辑抽成切面，在匹配的方法调用上执行通知。 具体来说：Aspect 是切面，Pointcut 匹配连接点，Advice 定义执行动作。；Spring AOP 主要拦截 Spring 管理 Bean 的方法执行，基于代理。；@Before、@After、@AfterReturning、@AfterThrowing、@Around 分别处理不同执行阶段。。\",\"code\":\"\"},{\"id\":5,\"title\":\"IOC和AOP是通过什么机制来实现的?\",\"node\":\"aopproxy\",\"cat\":\"spring\",\"short\":\"IoC 通过 BeanDefinition、工厂与依赖解析实现；Spring AOP 主要通过 JDK/CGLIB 代理实现。\",\"details\":[\"容器扫描或读取 Bean 定义，利用构造器、工厂方法与反射等完成实例化。\",\"BeanPostProcessor 能在初始化后替换/包装 Bean，AOP 自动代理创建器便工作在这类扩展点上。\",\"代理把调用引到 Advice 链，然后执行目标方法；代理类型取决于配置和类型约束。\"],\"example\":\"@Transactional 看似只加一个注解，其实调用经由 TransactionInterceptor。\",\"trap\":\"不要说 IoC 只靠反射、AOP 只能用 CGLIB；代理和容器扩展机制都很重要。\",\"interview\":\"IoC 通过 BeanDefinition、工厂与依赖解析实现；Spring AOP 主要通过 JDK/CGLIB 代理实现。 具体来说：容器扫描或读取 Bean 定义，利用构造器、工厂方法与反射等完成实例化。；BeanPostProcessor 能在初始化后替换/包装 Bean，AOP 自动代理创建器便工作在这类扩展点上。；代理把调用引到 Advice 链，然后执行目标方法；代理类型取决于配置和类型约束。。\",\"code\":\"\"},{\"id\":6,\"title\":\"怎么理解SpringIoc？\",\"node\":\"ioc\",\"cat\":\"spring\",\"short\":\"IoC 是对象创建和依赖组装控制权从业务代码转移给容器。\",\"details\":[\"业务类声明依赖而非在内部强耦合地 new 具体实现。\",\"ApplicationContext / BeanFactory 负责维护 BeanDefinition、解析依赖、管理作用域。\",\"IoC 不等于没有 new，容器内部仍然需要实例化对象。\"],\"example\":\"OrderService(UserRepository repository) 可由容器传入数据库或测试实现。\",\"trap\":\"容器管理的是 Bean 生命周期；Java 对象内存最终仍由 GC 回收。\",\"interview\":\"IoC 是对象创建和依赖组装控制权从业务代码转移给容器。 具体来说：业务类声明依赖而非在内部强耦合地 new 具体实现。；ApplicationContext / BeanFactory 负责维护 BeanDefinition、解析依赖、管理作用域。；IoC 不等于没有 new，容器内部仍然需要实例化对象。。\",\"code\":\"\"},{\"id\":7,\"title\":\"依赖倒置，依赖注入，控制反转分别是什么？\",\"node\":\"di\",\"cat\":\"spring\",\"short\":\"DIP 是依赖抽象的设计原则；IoC 是控制权转移思想；DI 是从外部提供依赖的实现方式。\",\"details\":[\"DIP：高层业务依赖接口，接口不依赖具体数据库/发送器。\",\"DI：通过构造器或 Setter 把具体实现传给业务对象。\",\"IoC：由外部容器决定创建哪个实现及何时组装。\"],\"example\":\"OrderService 依赖 NotifySender 接口；Spring 注入 MailSender。\",\"trap\":\"DI 不一定需要 Spring；IoC、DI 和 DIP 不是同义词。\",\"interview\":\"DIP 是依赖抽象的设计原则；IoC 是控制权转移思想；DI 是从外部提供依赖的实现方式。 具体来说：DIP：高层业务依赖接口，接口不依赖具体数据库/发送器。；DI：通过构造器或 Setter 把具体实现传给业务对象。；IoC：由外部容器决定创建哪个实现及何时组装。。\",\"code\":\"\"},{\"id\":8,\"title\":\"依赖注入了解吗？怎么实现依赖注入的？\",\"node\":\"di\",\"cat\":\"spring\",\"short\":\"DI 是由外部提供对象所依赖的组件，Spring 支持构造器、Setter、字段等方式。\",\"details\":[\"构造器注入让必需依赖在对象构造完成时已就绪，便于 final 和单测。\",\"Setter 适合可选依赖或后期配置，字段注入隐藏依赖且测试较不方便。\",\"Spring 根据类型、名称、限定符、@Primary 等规则解析候选 Bean。\"],\"example\":\"用 @RequiredArgsConstructor 注入 UserRepository，服务类不负责创建 DAO。\",\"trap\":\"依赖注入并非按名字机械匹配；多个同类型 Bean 要解决歧义。\",\"interview\":\"DI 是由外部提供对象所依赖的组件，Spring 支持构造器、Setter、字段等方式。 具体来说：构造器注入让必需依赖在对象构造完成时已就绪，便于 final 和单测。；Setter 适合可选依赖或后期配置，字段注入隐藏依赖且测试较不方便。；Spring 根据类型、名称、限定符、@Primary 等规则解析候选 Bean。。\",\"code\":\"private final UserRepo repo;\\npublic UserService(UserRepo repo) { this.repo = repo; }\"},{\"id\":9,\"title\":\"为什么更推荐构造器注入？\",\"node\":\"constructor\",\"cat\":\"spring\",\"short\":\"构造器注入能使必需依赖显式且完整，便于测试和维护。\",\"details\":[\"构造完成就满足依赖不变量，可声明 final 引用。\",\"测试不启动容器也能传 Mock，且依赖过多时能暴露职责过重。\",\"构造器循环依赖通常直接失败，促使拆分耦合而非依赖三级缓存兜底。\"],\"example\":\"new OrderService(fakeRepo) 就可以单测订单规则。\",\"trap\":\"final 约束引用重新赋值，不自动保证 Bean 线程安全。\",\"interview\":\"构造器注入能使必需依赖显式且完整，便于测试和维护。 具体来说：构造完成就满足依赖不变量，可声明 final 引用。；测试不启动容器也能传 Mock，且依赖过多时能暴露职责过重。；构造器循环依赖通常直接失败，促使拆分耦合而非依赖三级缓存兜底。。\",\"code\":\"\"},{\"id\":10,\"title\":\"@Autowired 和 @Resource 有什么区别？\",\"node\":\"autowire\",\"cat\":\"spring\",\"short\":\"@Autowired 是 Spring 注解，主要按类型解析；@Resource 来自 Jakarta/JSR，通常按名称优先再进行匹配。\",\"details\":[\"@Autowired 支持构造器、字段、方法和 @Qualifier；单构造器在现代 Spring 中可省略注解。\",\"@Resource 常通过 name 指定 Bean 名，较常见于字段或 Setter。\",\"多候选 Bean 需明确限定符、名称或 @Primary，避免 NoUniqueBeanDefinitionException。\"],\"example\":\"两个 PaymentGateway 实现时，@Qualifier(\\\"wechatGateway\\\") 指定候选。\",\"trap\":\"不可简单说 @Autowired 只按类型、@Resource 永远只按名字；匹配规则和环境有细节。\",\"interview\":\"@Autowired 是 Spring 注解，主要按类型解析；@Resource 来自 Jakarta/JSR，通常按名称优先再进行匹配。 具体来说：@Autowired 支持构造器、字段、方法和 @Qualifier；单构造器在现代 Spring 中可省略注解。；@Resource 常通过 name 指定 Bean 名，较常见于字段或 Setter。；多候选 Bean 需明确限定符、名称或 @Primary，避免 NoUniqueBeanDefinitionException。。\",\"code\":\"\"},{\"id\":11,\"title\":\"如果让你设计一个SpringIoc，你觉得会从哪些方面考虑这个设计？\",\"node\":\"beandef\",\"cat\":\"spring\",\"short\":\"先设计 Bean 定义与注册中心，再实现创建、注入、作用域、生命周期和扩展。\",\"details\":[\"使用 BeanDefinition 描述类型、工厂、依赖、作用域等元数据，并提供 getBean API。\",\"设计单例缓存、构造器解析、依赖图与循环检测、BeanPostProcessor 扩展流程。\",\"考虑并发创建、顺序、销毁回调、环境配置、异常定位和代理对象可替换能力。\"],\"example\":\"最小 IoC 可用 Map\\u003cString,BeanDefinition> + 递归创建，随后加入拓扑检查和扩展。\",\"trap\":\"Map 存对象不等于完整 IoC；真正难点是依赖解析与生命周期一致性。\",\"interview\":\"先设计 Bean 定义与注册中心，再实现创建、注入、作用域、生命周期和扩展。 具体来说：使用 BeanDefinition 描述类型、工厂、依赖、作用域等元数据，并提供 getBean API。；设计单例缓存、构造器解析、依赖图与循环检测、BeanPostProcessor 扩展流程。；考虑并发创建、顺序、销毁回调、环境配置、异常定位和代理对象可替换能力。。\",\"code\":\"\"},{\"id\":12,\"title\":\"SpringAOP主要想解决什么问题\",\"node\":\"aop\",\"cat\":\"spring\",\"short\":\"AOP 解决通用横切逻辑散落在业务方法中造成的重复和耦合。\",\"details\":[\"识别与业务规则无关却需跨多个方法执行的职责：事务、监控、权限、审计。\",\"使用切点集中选择目标方法，用通知统一添加行为。\",\"AOP 有代理边界、调用顺序和异常处理成本，不应把核心领域逻辑放进切面。\"],\"example\":\"Service 方法无需手写 begin/commit/rollback，交给 @Transactional。\",\"trap\":\"AOP 不等于能拦截任何 Java 调用；内部调用和非容器对象会受到限制。\",\"interview\":\"AOP 解决通用横切逻辑散落在业务方法中造成的重复和耦合。 具体来说：识别与业务规则无关却需跨多个方法执行的职责：事务、监控、权限、审计。；使用切点集中选择目标方法，用通知统一添加行为。；AOP 有代理边界、调用顺序和异常处理成本，不应把核心领域逻辑放进切面。。\",\"code\":\"\"},{\"id\":13,\"title\":\"AOP在spring中的应用，你知道哪些？\",\"node\":\"aopuse\",\"cat\":\"spring\",\"short\":\"典型应用是事务、日志、权限、指标、重试与缓存切面。\",\"details\":[\"@Transactional 使用事务拦截器创建/参与事务。\",\"@Cacheable 等缓存能力可使用代理对方法结果进行处理。\",\"自定义 @Around 可以做耗时监控，但注意顺序和异常传播。\"],\"example\":\"统一切面统计接口耗时而不是每个 Controller 手写计时。\",\"trap\":\"@Async、@Cacheable、事务等多个代理型功能叠加时要注意自调用问题。\",\"interview\":\"典型应用是事务、日志、权限、指标、重试与缓存切面。 具体来说：@Transactional 使用事务拦截器创建/参与事务。；@Cacheable 等缓存能力可使用代理对方法结果进行处理。；自定义 @Around 可以做耗时监控，但注意顺序和异常传播。。\",\"code\":\"\"},{\"id\":14,\"title\":\"谈谈你对 Spring AOP 的了解程度？\",\"node\":\"aop\",\"cat\":\"spring\",\"short\":\"从切面概念、代理生成、拦截器链、调用限制四层说明 Spring AOP。\",\"details\":[\"@Aspect 与 Pointcut 决定哪些方法匹配通知。\",\"AbstractAutoProxyCreator 等 Bean 后处理扩展负责在合适阶段创建代理。\",\"代理调用沿拦截器链执行，再到目标方法；JDK 代理基于接口，CGLIB 基于子类。\"],\"example\":\"同一个 Service 上叠加审计与事务，需要明确切面顺序。\",\"trap\":\"不要把 Spring AOP 和 AspectJ 编译期织入混为一谈。\",\"interview\":\"从切面概念、代理生成、拦截器链、调用限制四层说明 Spring AOP。 具体来说：@Aspect 与 Pointcut 决定哪些方法匹配通知。；AbstractAutoProxyCreator 等 Bean 后处理扩展负责在合适阶段创建代理。；代理调用沿拦截器链执行，再到目标方法；JDK 代理基于接口，CGLIB 基于子类。。\",\"code\":\"\"},{\"id\":15,\"title\":\"SpringAOP的原理了解吗\",\"node\":\"aopproxy\",\"cat\":\"spring\",\"short\":\"Spring AOP 在 Bean 生命周期中识别切面并创建代理，调用时通过拦截器链增强目标方法。\",\"details\":[\"容器发现 Advisor/切点，筛选适用于 Bean 的增强器。\",\"BeanPostProcessor 在初始化周边构造 JDK 动态代理或类代理。\",\"外部持有代理对象并调用方法时进入 MethodInterceptor 链，最后调用目标方法。\"],\"example\":\"@Transactional 的业务 Bean 在容器中通常以代理形式提供给调用者。\",\"trap\":\"final 方法无法由类代理覆写；私有方法、自调用也不会被常规代理增强。\",\"interview\":\"Spring AOP 在 Bean 生命周期中识别切面并创建代理，调用时通过拦截器链增强目标方法。 具体来说：容器发现 Advisor/切点，筛选适用于 Bean 的增强器。；BeanPostProcessor 在初始化周边构造 JDK 动态代理或类代理。；外部持有代理对象并调用方法时进入 MethodInterceptor 链，最后调用目标方法。。\",\"code\":\"\"},{\"id\":16,\"title\":\"动态代理是什么？\",\"node\":\"proxy\",\"cat\":\"spring\",\"short\":\"动态代理是在运行时创建代理对象，统一转发和增强目标方法调用。\",\"details\":[\"JDK Proxy 生成实现接口的代理并由 InvocationHandler 分派。\",\"CGLIB/类代理通过生成目标类子类覆写可代理方法。\",\"代理用于事务、AOP、RPC 客户端等，调用必须走代理才有增强。\"],\"example\":\"PaymentService 代理在执行 pay() 前验证权限并记录日志。\",\"trap\":\"JDK 代理要求接口；类代理不能覆写 final/private 方法。\",\"interview\":\"动态代理是在运行时创建代理对象，统一转发和增强目标方法调用。 具体来说：JDK Proxy 生成实现接口的代理并由 InvocationHandler 分派。；CGLIB/类代理通过生成目标类子类覆写可代理方法。；代理用于事务、AOP、RPC 客户端等，调用必须走代理才有增强。。\",\"code\":\"\"},{\"id\":17,\"title\":\"动态代理和静态代理的区别\",\"node\":\"proxy\",\"cat\":\"spring\",\"short\":\"静态代理在编码/编译时已有代理类；动态代理运行时生成通用代理结构。\",\"details\":[\"静态代理通常一接口/类编写一个包装类，易理解但维护成本高。\",\"动态代理通过 InvocationHandler 或子类生成在运行时拦截调用。\",\"二者都可以执行代理逻辑，本质区别在生成时机与扩展成本。\"],\"example\":\"手写 LoggingOrderService 是静态代理；Spring 自动创建事务代理是动态代理。\",\"trap\":\"静态代理并非不能实现 AOP，只是扩展到大量类较繁琐。\",\"interview\":\"静态代理在编码/编译时已有代理类；动态代理运行时生成通用代理结构。 具体来说：静态代理通常一接口/类编写一个包装类，易理解但维护成本高。；动态代理通过 InvocationHandler 或子类生成在运行时拦截调用。；二者都可以执行代理逻辑，本质区别在生成时机与扩展成本。。\",\"code\":\"\"},{\"id\":18,\"title\":\"能使用静态代理的方式实现AOP吗？\",\"node\":\"proxy\",\"cat\":\"spring\",\"short\":\"可以，静态代理同样能做方法前后增强，但不适合大规模自动化织入。\",\"details\":[\"手写同接口代理，代理方法内部先执行通知再调用目标。\",\"静态代理需要维护每个被代理类型或方法的包装逻辑。\",\"Spring AOP 选择动态代理以适应容器自动发现大量 Bean 和切点。\"],\"example\":\"手写 OrderServiceProxy 加日志即一个 AOP 思想的简化实现。\",\"trap\":\"AOP 是设计思想而非“只能用动态代理”的实现限制。\",\"interview\":\"可以，静态代理同样能做方法前后增强，但不适合大规模自动化织入。 具体来说：手写同接口代理，代理方法内部先执行通知再调用目标。；静态代理需要维护每个被代理类型或方法的包装逻辑。；Spring AOP 选择动态代理以适应容器自动发现大量 Bean 和切点。。\",\"code\":\"\"},{\"id\":19,\"title\":\"AOP实现有哪些注解？\",\"node\":\"aopanno\",\"cat\":\"spring\",\"short\":\"常见 @Aspect、@Pointcut、@Before、@After、@Around、@AfterReturning、@AfterThrowing。\",\"details\":[\"@Aspect 标识切面，@Pointcut 复用切点表达式。\",\"@Around 通过 ProceedingJoinPoint.proceed() 决定是否继续调用目标。\",\"启用代理通常由 Boot AOP 自动配置或 @EnableAspectJAutoProxy 配合相应依赖完成。\"],\"example\":\"@Around(\\\"execution(* com.demo.service..*(..))\\\") 批量统计业务方法耗时。\",\"trap\":\"@After 与 @AfterReturning 含义不同；忘记 proceed 会导致目标方法不执行。\",\"interview\":\"常见 @Aspect、@Pointcut、@Before、@After、@Around、@AfterReturning、@AfterThrowing。 具体来说：@Aspect 标识切面，@Pointcut 复用切点表达式。；@Around 通过 ProceedingJoinPoint.proceed() 决定是否继续调用目标。；启用代理通常由 Boot AOP 自动配置或 @EnableAspectJAutoProxy 配合相应依赖完成。。\",\"code\":\"\"},{\"id\":20,\"title\":\"什么是反射？有哪些使用场景？\",\"node\":\"reflection\",\"cat\":\"spring\",\"short\":\"反射是运行时读取类结构并创建实例、访问成员的方法，是框架基础设施之一。\",\"details\":[\"Class/Constructor/Method/Field 可以在运行时描述和调用类型成员。\",\"Spring 借反射解析组件、注入属性与调用部分生命周期方法。\",\"MyBatis 也借反射和类型处理器完成结果映射；反射受可见性和模块封装限制。\"],\"example\":\"根据 @Component 注解扫描候选类并交由容器实例化。\",\"trap\":\"反射并非无条件能访问一切私有成员；Java 模块系统等会限制访问。\",\"interview\":\"反射是运行时读取类结构并创建实例、访问成员的方法，是框架基础设施之一。 具体来说：Class/Constructor/Method/Field 可以在运行时描述和调用类型成员。；Spring 借反射解析组件、注入属性与调用部分生命周期方法。；MyBatis 也借反射和类型处理器完成结果映射；反射受可见性和模块封装限制。。\",\"code\":\"\"},{\"id\":21,\"title\":\"spring是如何解决循环依赖的？\",\"node\":\"circular\",\"cat\":\"spring\",\"short\":\"传统 Spring 单例的部分 Setter/字段循环依赖可以通过提前暴露对象引用解决。\",\"details\":[\"实例化 A 后，可在依赖填充之前将早期引用工厂暴露到 singletonFactories。\",\"创建 B 需要 A 时，从早期引用工厂获取 A（必要时创建早期代理），随后完成 A/B 初始化。\",\"构造器循环依赖通常无法这样解决；原型循环依赖及 Boot 默认设置可能直接失败。\"],\"example\":\"A.setB(B)，B.setA(A) 在允许循环依赖的容器配置下可能成功。\",\"trap\":\"Spring Boot 2.6+ 默认禁止循环引用；不应依赖三级缓存作为设计方案。\",\"interview\":\"传统 Spring 单例的部分 Setter/字段循环依赖可以通过提前暴露对象引用解决。 具体来说：实例化 A 后，可在依赖填充之前将早期引用工厂暴露到 singletonFactories。；创建 B 需要 A 时，从早期引用工厂获取 A（必要时创建早期代理），随后完成 A/B 初始化。；构造器循环依赖通常无法这样解决；原型循环依赖及 Boot 默认设置可能直接失败。。\",\"code\":\"\"},{\"id\":22,\"title\":\"Spring为什么用3级缓存解决循环依赖问题？用2级缓存不行吗？\",\"node\":\"threecache\",\"cat\":\"spring\",\"short\":\"三级缓存的关键价值是通过 ObjectFactory 延迟生成早期引用，尤其处理 AOP 代理一致性。\",\"details\":[\"一级 singletonObjects 放完整单例，二级 earlySingletonObjects 放已创建的早期引用。\",\"三级 singletonFactories 放生成早期引用的工厂，只有实际发生循环依赖时才调用 getEarlyBeanReference。\",\"如果没有代理且简化场景，两级缓存也可能实现循环依赖；讨论三级要说明代理创建时机与完整生命周期。\"],\"example\":\"A 与 B 循环依赖且 A 应被 AOP 增强时，B 注入的应与最终暴露的代理尽量一致。\",\"trap\":\"三级缓存不是因为“三级比两级一定更安全”，它解决的是早期引用工厂与代理创建问题。\",\"interview\":\"三级缓存的关键价值是通过 ObjectFactory 延迟生成早期引用，尤其处理 AOP 代理一致性。 具体来说：一级 singletonObjects 放完整单例，二级 earlySingletonObjects 放已创建的早期引用。；三级 singletonFactories 放生成早期引用的工厂，只有实际发生循环依赖时才调用 getEarlyBeanReference。；如果没有代理且简化场景，两级缓存也可能实现循环依赖；讨论三级要说明代理创建时机与完整生命周期。。\",\"code\":\"\"},{\"id\":23,\"title\":\"spring三级缓存的数据结构是什么？\",\"node\":\"threecache\",\"cat\":\"spring\",\"short\":\"核心是三个 Map：singletonObjects、earlySingletonObjects、singletonFactories。\",\"details\":[\"第一级保存创建完成的单例对象，通常优先命中。\",\"第二级保存早期单例引用，第三级保存 ObjectFactory\\u003c?>，用于按需产生早期引用。\",\"缓存读写还涉及正在创建标记与并发同步，三级缓存不是普通缓存系统或 GC 分代。\"],\"example\":\"getSingleton 先查一级、再在创建中查二级，必要时从三级工厂获得早期引用并移至二级。\",\"trap\":\"区分缓存中的对象和 BeanDefinition；三级缓存不是放三个生命周期阶段的全部 Bean。\",\"interview\":\"核心是三个 Map：singletonObjects、earlySingletonObjects、singletonFactories。 具体来说：第一级保存创建完成的单例对象，通常优先命中。；第二级保存早期单例引用，第三级保存 ObjectFactory\\u003c?>，用于按需产生早期引用。；缓存读写还涉及正在创建标记与并发同步，三级缓存不是普通缓存系统或 GC 分代。。\",\"code\":\"\"},{\"id\":24,\"title\":\"spring框架中都用到了哪些设计模式\",\"node\":\"patterns\",\"cat\":\"spring\",\"short\":\"Spring 大量使用工厂、代理、模板方法、策略、观察者、适配器等模式。\",\"details\":[\"BeanFactory 体现工厂；AOP 体现代理；JdbcTemplate 体现模板方法/回调。\",\"ApplicationEventPublisher/Listener 是事件观察者思路。\",\"HandlerAdapter、BeanPostProcessor/策略接口等构成可扩展协议。\"],\"example\":\"为不同控制器适配调用方式使用 HandlerAdapter，而不是 DispatcherServlet 写满 if-else。\",\"trap\":\"不要机械地说所有类都“只用了某一种模式”，实际通常组合多种设计。\",\"interview\":\"Spring 大量使用工厂、代理、模板方法、策略、观察者、适配器等模式。 具体来说：BeanFactory 体现工厂；AOP 体现代理；JdbcTemplate 体现模板方法/回调。；ApplicationEventPublisher/Listener 是事件观察者思路。；HandlerAdapter、BeanPostProcessor/策略接口等构成可扩展协议。。\",\"code\":\"\"},{\"id\":25,\"title\":\"spring 常用注解有什么？\",\"node\":\"annotations\",\"cat\":\"spring\",\"short\":\"按用途记注解：声明 Bean、依赖注入、配置、AOP、事务、Web。\",\"details\":[\"组件扫描：@Component、@Service、@Repository、@Controller。\",\"配置注入：@Configuration、@Bean、@Autowired、@Qualifier、@Value。\",\"横切与 Web：@Transactional、@Aspect、@RequestMapping、@RestController。\"],\"example\":\"使用 @Configuration + @Bean 定义第三方 SDK 客户端；@Service 标记业务组件。\",\"trap\":\"注解只是元数据，必须有对应的容器和处理器，才会产生行为。\",\"interview\":\"按用途记注解：声明 Bean、依赖注入、配置、AOP、事务、Web。 具体来说：组件扫描：@Component、@Service、@Repository、@Controller。；配置注入：@Configuration、@Bean、@Autowired、@Qualifier、@Value。；横切与 Web：@Transactional、@Aspect、@RequestMapping、@RestController。。\",\"code\":\"\"},{\"id\":26,\"title\":\"Spring的事务什么情况下会失效？\",\"node\":\"txfail\",\"cat\":\"spring\",\"short\":\"声明式事务失效先排查代理是否生效、异常是否触发回滚、事务管理器是否正确。\",\"details\":[\"同类 this 自调用或对象不是 Spring 管理的 Bean，可能绕过代理。\",\"默认回滚 RuntimeException/Error；受检异常默认不回滚，可用 rollbackFor 配置。\",\"捕获异常不再抛出、错误的事务管理器、异步/跨线程及数据库引擎问题都可能影响预期。\"],\"example\":\"this.save() 调用被 @Transactional 注解的 save 时，不会从外部经过代理。\",\"trap\":\"Spring 6 类代理对部分非 public 方法规则已变化，不要笼统说所有非 public 必失效。\",\"interview\":\"声明式事务失效先排查代理是否生效、异常是否触发回滚、事务管理器是否正确。 具体来说：同类 this 自调用或对象不是 Spring 管理的 Bean，可能绕过代理。；默认回滚 RuntimeException/Error；受检异常默认不回滚，可用 rollbackFor 配置。；捕获异常不再抛出、错误的事务管理器、异步/跨线程及数据库引擎问题都可能影响预期。。\",\"code\":\"\"},{\"id\":27,\"title\":\"Spring的事务，使用this调用是否生效？\",\"node\":\"selfinvoke\",\"cat\":\"spring\",\"short\":\"在默认代理事务模式中，this 调用自身方法绕过代理，因此目标方法上的事务增强不会被触发。\",\"details\":[\"代理拦截发生在其他对象调用代理时，this 指向目标对象内部调用。\",\"如果外层已开启事务，内层代码仍在当前事务里执行，但内层 @Transactional 的新传播/回滚配置不会单独应用。\",\"常用改法是拆到另一个 Bean 通过代理调用，或使用 TransactionTemplate/AspectJ 模式。\"],\"example\":\"外部调 service.outer()，outer 内部 this.inner()；inner 上 REQUIRES_NEW 不会产生独立事务。\",\"trap\":\"说 this 调用“一定没有事务”不严谨：可能继承调用方已有事务。\",\"interview\":\"在默认代理事务模式中，this 调用自身方法绕过代理，因此目标方法上的事务增强不会被触发。 具体来说：代理拦截发生在其他对象调用代理时，this 指向目标对象内部调用。；如果外层已开启事务，内层代码仍在当前事务里执行，但内层 @Transactional 的新传播/回滚配置不会单独应用。；常用改法是拆到另一个 Bean 通过代理调用，或使用 TransactionTemplate/AspectJ 模式。。\",\"code\":\"public void outer(){ this.inner(); }\\n@Transactional(propagation=Propagation.REQUIRES_NEW)\\npublic void inner(){ /* ... */ }\"},{\"id\":28,\"title\":\"Spring声明式事务的实现原理是什么？\",\"node\":\"txproxy\",\"cat\":\"spring\",\"short\":\"@Transactional 属于 AOP 代理型事务：事务拦截器根据元数据控制事务管理器。\",\"details\":[\"容器创建符合条件的代理，调用通过 TransactionInterceptor。\",\"拦截器读取传播、隔离、超时、回滚规则并与 PlatformTransactionManager 协调。\",\"正常返回则提交；异常时按规则回滚或提交，同时释放绑定资源。\"],\"example\":\"订单落库和库存更新置于同一 @Transactional Service 方法。\",\"trap\":\"事务边界不自动跨线程、RPC 和所有数据库；一个本地事务管理器不等于分布式事务。\",\"interview\":\"@Transactional 属于 AOP 代理型事务：事务拦截器根据元数据控制事务管理器。 具体来说：容器创建符合条件的代理，调用通过 TransactionInterceptor。；拦截器读取传播、隔离、超时、回滚规则并与 PlatformTransactionManager 协调。；正常返回则提交；异常时按规则回滚或提交，同时释放绑定资源。。\",\"code\":\"\"},{\"id\":29,\"title\":\"Spring事务的传播行为有哪些？\",\"node\":\"propagation\",\"cat\":\"spring\",\"short\":\"常见 7 种传播行为：REQUIRED、REQUIRES_NEW、NESTED、SUPPORTS、MANDATORY、NOT_SUPPORTED、NEVER。\",\"details\":[\"REQUIRED 默认：有事务就加入，没有则新建；REQUIRES_NEW 总开启新事务并挂起外层。\",\"NESTED 在已有事务时使用保存点（取决于事务管理器支持）；SUPPORTS 有就加入、没有就非事务。\",\"MANDATORY 要求已有事务；NOT_SUPPORTED 非事务执行且可能挂起；NEVER 要求无事务。\"],\"example\":\"下单写库用 REQUIRED；独立审计记录可以评估 REQUIRES_NEW。\",\"trap\":\"REQUIRES_NEW 新事务通常需要额外连接，连接池不足会产生资源争用。\",\"interview\":\"常见 7 种传播行为：REQUIRED、REQUIRES_NEW、NESTED、SUPPORTS、MANDATORY、NOT_SUPPORTED、NEVER。 具体来说：REQUIRED 默认：有事务就加入，没有则新建；REQUIRES_NEW 总开启新事务并挂起外层。；NESTED 在已有事务时使用保存点（取决于事务管理器支持）；SUPPORTS 有就加入、没有就非事务。；MANDATORY 要求已有事务；NOT_SUPPORTED 非事务执行且可能挂起；NEVER 要求无事务。。\",\"code\":\"\"},{\"id\":30,\"title\":\"REQUIRES_NEW 和 NESTED 有什么区别？\",\"node\":\"nested\",\"cat\":\"spring\",\"short\":\"REQUIRES_NEW 使用独立物理事务，NESTED 通常在同一个物理事务里建立保存点。\",\"details\":[\"REQUIRES_NEW 挂起外层事务资源并创建独立事务，内部提交不受外层回滚直接撤销。\",\"NESTED 回滚到 savepoint，可撤销内部操作，但外层最终回滚仍会撤销整个事务。\",\"NESTED 依赖具体事务管理器/数据库支持保存点，不应假设 JPA 等所有场景可用。\"],\"example\":\"订单主事务里库存扣减若用 NESTED，失败可以回滚保存点并决定是否继续；独立审计更接近 REQUIRES_NEW。\",\"trap\":\"“REQUIRES_NEW 和 NESTED 都有独立事务”是错误说法。\",\"interview\":\"REQUIRES_NEW 使用独立物理事务，NESTED 通常在同一个物理事务里建立保存点。 具体来说：REQUIRES_NEW 挂起外层事务资源并创建独立事务，内部提交不受外层回滚直接撤销。；NESTED 回滚到 savepoint，可撤销内部操作，但外层最终回滚仍会撤销整个事务。；NESTED 依赖具体事务管理器/数据库支持保存点，不应假设 JPA 等所有场景可用。。\",\"code\":\"\"},{\"id\":31,\"title\":\"为什么捕获了异常，事务还是回滚了？\",\"node\":\"rollbackonly\",\"cat\":\"spring\",\"short\":\"因为当前事务可能已被内部调用标记 rollback-only，外层即使捕获异常也不能再成功提交。\",\"details\":[\"内层 REQUIRED 方法加入同一个物理事务；它抛 RuntimeException 时事务拦截器可标记回滚。\",\"外层 try/catch 捕获异常只改变 Java 控制流，不会清除 rollback-only 状态。\",\"提交时可能抛 UnexpectedRollbackException；可重构边界或考虑 REQUIRES_NEW/NESTED 但必须明确业务语义。\"],\"example\":\"outer @Transactional 调 inner @Transactional(REQUIRED)，inner 异常已被代理处理，outer 捕获后提交仍可能报错。\",\"trap\":\"不是所有捕获异常都会这样，关键看异常是否已经经过事务拦截器并标记事务。\",\"interview\":\"因为当前事务可能已被内部调用标记 rollback-only，外层即使捕获异常也不能再成功提交。 具体来说：内层 REQUIRED 方法加入同一个物理事务；它抛 RuntimeException 时事务拦截器可标记回滚。；外层 try/catch 捕获异常只改变 Java 控制流，不会清除 rollback-only 状态。；提交时可能抛 UnexpectedRollbackException；可重构边界或考虑 REQUIRES_NEW/NESTED 但必须明确业务语义。。\",\"code\":\"\"},{\"id\":32,\"title\":\"@Transactional里的隔离级别和readOnly有什么作用？\",\"node\":\"isolation\",\"cat\":\"spring\",\"short\":\"isolation 指定数据库事务隔离要求；readOnly 是只读意图提示，不等于强制禁止写。\",\"details\":[\"Isolation 常见 READ_UNCOMMITTED、READ_COMMITTED、REPEATABLE_READ、SERIALIZABLE 和 DEFAULT。\",\"readOnly 可让驱动/事务管理器/ORM 做只读优化，真实约束因实现与数据库而异。\",\"隔离设置通常作用于新开启的物理事务，加入已有事务时未必重新生效。\"],\"example\":\"查询报表 @Transactional(readOnly=true)，修改库存方法应使用可写事务。\",\"trap\":\"隔离级别属于数据库语义，Spring 注解无法消除所有业务并发问题。\",\"interview\":\"isolation 指定数据库事务隔离要求；readOnly 是只读意图提示，不等于强制禁止写。 具体来说：Isolation 常见 READ_UNCOMMITTED、READ_COMMITTED、REPEATABLE_READ、SERIALIZABLE 和 DEFAULT。；readOnly 可让驱动/事务管理器/ORM 做只读优化，真实约束因实现与数据库而异。；隔离设置通常作用于新开启的物理事务，加入已有事务时未必重新生效。。\",\"code\":\"\"},{\"id\":33,\"title\":\"Bean的生命周期说一下？\",\"node\":\"lifecycle\",\"cat\":\"spring\",\"short\":\"Bean 生命周期可按定义解析→实例化→依赖填充→初始化扩展→代理→使用→销毁理解。\",\"details\":[\"容器读取 BeanDefinition，实例化后完成依赖注入和各类 Aware 回调。\",\"BeanPostProcessor 的 before/after、@PostConstruct、InitializingBean 等在初始化阶段参与。\",\"销毁可执行 @PreDestroy/DisposableBean 等（主要对容器管理的相应作用域）；内存仍由 GC 管理。\"],\"example\":\"DataSource Bean 创建后配置连接池，关闭上下文时触发资源清理。\",\"trap\":\"Bean 实例化不等于初始化；AOP 代理出现的时机也不能被简化为所有情况下固定唯一时刻。\",\"interview\":\"Bean 生命周期可按定义解析→实例化→依赖填充→初始化扩展→代理→使用→销毁理解。 具体来说：容器读取 BeanDefinition，实例化后完成依赖注入和各类 Aware 回调。；BeanPostProcessor 的 before/after、@PostConstruct、InitializingBean 等在初始化阶段参与。；销毁可执行 @PreDestroy/DisposableBean 等（主要对容器管理的相应作用域）；内存仍由 GC 管理。。\",\"code\":\"\"},{\"id\":34,\"title\":\"Bean是否单例？\",\"node\":\"scope\",\"cat\":\"spring\",\"short\":\"Spring Bean 默认是 singleton 作用域，但也支持 prototype 和 Web 作用域。\",\"details\":[\"singleton 是每个 IoC 容器中每个 Bean 定义通常一个共享实例，不是 JVM 级单例。\",\"prototype 每次向容器请求会创建新实例；request/session 等需要相应 Web 上下文。\",\"单例 Bean 内有可变状态仍可能发生线程安全问题。\"],\"example\":\"@Service 默认 singleton，共享 UserService 实例供并发请求调用。\",\"trap\":\"prototype 注入 singleton 时通常只在注入时解析一次，不会每次使用自动创建。\",\"interview\":\"Spring Bean 默认是 singleton 作用域，但也支持 prototype 和 Web 作用域。 具体来说：singleton 是每个 IoC 容器中每个 Bean 定义通常一个共享实例，不是 JVM 级单例。；prototype 每次向容器请求会创建新实例；request/session 等需要相应 Web 上下文。；单例 Bean 内有可变状态仍可能发生线程安全问题。。\",\"code\":\"\"},{\"id\":35,\"title\":\"Bean的单例和非单例，生命周期是否一样\",\"node\":\"scope\",\"cat\":\"spring\",\"short\":\"不一样：singleton 通常由容器完整管理初始化和销毁，prototype 的销毁通常由调用方负责。\",\"details\":[\"两者一般都经历实例化、依赖注入、初始化。\",\"singleton 在上下文关闭时可调用销毁回调；prototype 创建并返回后通常不再被容器跟踪销毁。\",\"request/session 由相应作用域的生命周期管理器处理。\"],\"example\":\"prototype Bean 若持有文件或连接，需要使用者主动清理资源。\",\"trap\":\"Bean 无引用之后由 GC 回收，不等于 Spring 已执行销毁回调。\",\"interview\":\"不一样：singleton 通常由容器完整管理初始化和销毁，prototype 的销毁通常由调用方负责。 具体来说：两者一般都经历实例化、依赖注入、初始化。；singleton 在上下文关闭时可调用销毁回调；prototype 创建并返回后通常不再被容器跟踪销毁。；request/session 由相应作用域的生命周期管理器处理。。\",\"code\":\"\"},{\"id\":36,\"title\":\"Spring bean的作用域有哪些？\",\"node\":\"scope\",\"cat\":\"spring\",\"short\":\"常见 singleton、prototype；Web 场景还有 request、session、application、websocket。\",\"details\":[\"singleton 默认每个容器共享实例，prototype 每次 getBean 获取新实例。\",\"request 每次 HTTP 请求；session 每会话；application 与 ServletContext 相关。\",\"跨作用域注入可用作用域代理、ObjectProvider 或工厂按需获取。\"],\"example\":\"购物车会话状态适合 session 范围，业务 Service 通常保持无状态 singleton。\",\"trap\":\"不能把 Bean Scope 等同数据库事务范围或 JVM 内存分区。\",\"interview\":\"常见 singleton、prototype；Web 场景还有 request、session、application、websocket。 具体来说：singleton 默认每个容器共享实例，prototype 每次 getBean 获取新实例。；request 每次 HTTP 请求；session 每会话；application 与 ServletContext 相关。；跨作用域注入可用作用域代理、ObjectProvider 或工厂按需获取。。\",\"code\":\"\"},{\"id\":37,\"title\":\"Spring单例Bean是线程安全的吗？\",\"node\":\"threadsafe\",\"cat\":\"spring\",\"short\":\"不是天然线程安全；如果持有可变共享字段仍会有竞态。\",\"details\":[\"singleton 表示单容器共享实例，不提供并发访问互斥。\",\"无状态 Service 主要使用局部变量及线程安全依赖，通常更容易安全并发。\",\"可变共享缓存用 ConcurrentHashMap/锁/外部存储；尽量避免把每请求状态写进成员字段。\"],\"example\":\"单例 Controller 中成员变量 int count++ 可能丢失更新。\",\"trap\":\"Spring 容器安全创建 Bean，不代表 Bean 的所有方法线程安全。\",\"interview\":\"不是天然线程安全；如果持有可变共享字段仍会有竞态。 具体来说：singleton 表示单容器共享实例，不提供并发访问互斥。；无状态 Service 主要使用局部变量及线程安全依赖，通常更容易安全并发。；可变共享缓存用 ConcurrentHashMap/锁/外部存储；尽量避免把每请求状态写进成员字段。。\",\"code\":\"\"},{\"id\":38,\"title\":\"单例Bean里注入prototype Bean，每次使用都会创建新对象吗？\",\"node\":\"prototype\",\"cat\":\"spring\",\"short\":\"通常不会：singleton 构造/注入时解析 prototype 一次，后续持有同一个实例。\",\"details\":[\"prototype 表示每次向容器请求新对象，不表示每次访问字段都自动刷新。\",\"若要每次获得新对象，可注入 ObjectProvider\\u003cT> 并调用 getObject()。\",\"@Lookup 方法注入或作用域代理也可以在合适场景使用。\"],\"example\":\"@Service 注入 ObjectProvider\\u003cTaskContext>，每次请求时 getObject() 获得新 TaskContext。\",\"trap\":\"给类标上 @Scope(\\\"prototype\\\") 并不能修复单例字段里注入后一直复用的问题。\",\"interview\":\"通常不会：singleton 构造/注入时解析 prototype 一次，后续持有同一个实例。 具体来说：prototype 表示每次向容器请求新对象，不表示每次访问字段都自动刷新。；若要每次获得新对象，可注入 ObjectProvider\\u003cT> 并调用 getObject()。；@Lookup 方法注入或作用域代理也可以在合适场景使用。。\",\"code\":\"\"},{\"id\":39,\"title\":\"Spring容器里存的是什么？\",\"node\":\"beandef\",\"cat\":\"spring\",\"short\":\"既有 BeanDefinition 等配置元数据，也有按作用域管理的实例和创建/生命周期基础设施。\",\"details\":[\"BeanDefinition 保存类、作用域、工厂、依赖等定义。\",\"单例池保存完整实例，还可能维护早期引用与工厂。\",\"BeanFactoryPostProcessor/BeanPostProcessor 等扩展参与注册与创建，容器不只是 Map\\u003cString,Object>。\"],\"example\":\"ApplicationContext 能根据 bean 名和类型定位定义并取出实例。\",\"trap\":\"不是所有 Bean 都预先创建；prototype 在请求时创建，懒加载单例也可延迟。\",\"interview\":\"既有 BeanDefinition 等配置元数据，也有按作用域管理的实例和创建/生命周期基础设施。 具体来说：BeanDefinition 保存类、作用域、工厂、依赖等定义。；单例池保存完整实例，还可能维护早期引用与工厂。；BeanFactoryPostProcessor/BeanPostProcessor 等扩展参与注册与创建，容器不只是 Map\\u003cString,Object>。。\",\"code\":\"\"},{\"id\":40,\"title\":\"BeanFactory 和 ApplicationContext 有什么区别？\",\"node\":\"context\",\"cat\":\"spring\",\"short\":\"BeanFactory 是基础容器接口；ApplicationContext 进一步提供事件、资源、国际化与集成能力。\",\"details\":[\"BeanFactory 定义 getBean 等获取与工厂功能。\",\"ApplicationContext 扩展消息源、ApplicationEventPublisher、Environment 等特性。\",\"常见 ApplicationContext 实现会在刷新阶段预实例化非懒加载单例；不能简化为两者必然“懒/饿”。\"],\"example\":\"Boot 启动获得 ConfigurableApplicationContext，可发布事件并访问 Environment。\",\"trap\":\"BeanFactory 并不是 ApplicationContext 的对立品，后者本身继承相关能力。\",\"interview\":\"BeanFactory 是基础容器接口；ApplicationContext 进一步提供事件、资源、国际化与集成能力。 具体来说：BeanFactory 定义 getBean 等获取与工厂功能。；ApplicationContext 扩展消息源、ApplicationEventPublisher、Environment 等特性。；常见 ApplicationContext 实现会在刷新阶段预实例化非懒加载单例；不能简化为两者必然“懒/饿”。。\",\"code\":\"\"},{\"id\":41,\"title\":\"BeanFactory 和 FactoryBean 有什么区别？\",\"node\":\"factorybean\",\"cat\":\"spring\",\"short\":\"BeanFactory 是管理 Bean 的容器；FactoryBean\\u003cT> 是供容器创建特定产品对象的特殊 Bean。\",\"details\":[\"BeanFactory 接口提供 getBean、containsBean 等容器操作。\",\"FactoryBean 的 getObject() 返回产品对象，适合复杂代理/客户端构建。\",\"通常 getBean(\\\"name\\\") 拿到产品；getBean(\\\"&name\\\") 拿到 FactoryBean 本身。\"],\"example\":\"MyBatis 的 MapperFactoryBean 用 FactoryBean 机制生成 Mapper 代理。\",\"trap\":\"FactoryBean 不等于简单的 @Bean 工厂方法，也不是 Spring 容器本身。\",\"interview\":\"BeanFactory 是管理 Bean 的容器；FactoryBean\\u003cT> 是供容器创建特定产品对象的特殊 Bean。 具体来说：BeanFactory 接口提供 getBean、containsBean 等容器操作。；FactoryBean 的 getObject() 返回产品对象，适合复杂代理/客户端构建。；通常 getBean(\\\"name\\\") 拿到产品；getBean(\\\"&name\\\") 拿到 FactoryBean 本身。。\",\"code\":\"\"},{\"id\":42,\"title\":\"在Spring中，在bean加载/销毁前后，如果想实现某些逻辑，可以怎么做\",\"node\":\"callbacks\",\"cat\":\"spring\",\"short\":\"可使用 @PostConstruct/@PreDestroy、InitializingBean/DisposableBean、initMethod/destroyMethod 或后处理器。\",\"details\":[\"单 Bean 初始化/销毁优先使用生命周期回调。\",\"跨多个 Bean 的统一增强使用 BeanPostProcessor，不适合在每个类手写重复逻辑。\",\"需要全部单例就绪后执行工作，考虑 SmartInitializingSingleton / ApplicationReadyEvent 等。\"],\"example\":\"启动时缓存预热可用合适的就绪事件；关闭时释放外部连接。\",\"trap\":\"@PostConstruct 运行时代理和事务可能未完全准备好，不宜依赖同类事务方法自调用。\",\"interview\":\"可使用 @PostConstruct/@PreDestroy、InitializingBean/DisposableBean、initMethod/destroyMethod 或后处理器。 具体来说：单 Bean 初始化/销毁优先使用生命周期回调。；跨多个 Bean 的统一增强使用 BeanPostProcessor，不适合在每个类手写重复逻辑。；需要全部单例就绪后执行工作，考虑 SmartInitializingSingleton / ApplicationReadyEvent 等。。\",\"code\":\"\"},{\"id\":43,\"title\":\"BeanFactoryPostProcessor 和 BeanPostProcessor 有什么区别？\",\"node\":\"postprocessor\",\"cat\":\"spring\",\"short\":\"前者处理 BeanDefinition 元数据，后者处理具体 Bean 实例初始化前后。\",\"details\":[\"BeanFactoryPostProcessor 在一般 Bean 实例化前修改配置定义。\",\"BeanPostProcessor 的 before/afterInitialization 钩子可包装或替换 Bean 实例。\",\"AOP 自动代理创建器属于 BeanPostProcessor 的体系，BeanDefinitionRegistryPostProcessor 可更早注册定义。\"],\"example\":\"修改统一占位符配置用工厂后处理；给 Service 生成代理用 Bean 后处理器。\",\"trap\":\"两者操作时机、操作对象都不同，不能混称“Bean 初始化扩展点”。\",\"interview\":\"前者处理 BeanDefinition 元数据，后者处理具体 Bean 实例初始化前后。 具体来说：BeanFactoryPostProcessor 在一般 Bean 实例化前修改配置定义。；BeanPostProcessor 的 before/afterInitialization 钩子可包装或替换 Bean 实例。；AOP 自动代理创建器属于 BeanPostProcessor 的体系，BeanDefinitionRegistryPostProcessor 可更早注册定义。。\",\"code\":\"\"},{\"id\":44,\"title\":\"Spring给我们提供了很多扩展点，这些有了解吗？\",\"node\":\"extension\",\"cat\":\"spring\",\"short\":\"重点围绕 Bean 定义、初始化、上下文刷新、事件和启动器阶段的扩展点分层回答。\",\"details\":[\"定义层：BeanDefinitionRegistryPostProcessor、BeanFactoryPostProcessor。\",\"实例层：BeanPostProcessor、Aware、InitializingBean、FactoryBean。\",\"运行层：ApplicationListener、事件、SmartLifecycle、ApplicationRunner/CommandLineRunner（Boot）。\"],\"example\":\"自定义 BeanPostProcessor 给指定接口的 Bean 添加监控代理。\",\"trap\":\"选择扩展点要看生命周期时机；过早操作 Bean 可能造成尚未完成代理/注入的问题。\",\"interview\":\"重点围绕 Bean 定义、初始化、上下文刷新、事件和启动器阶段的扩展点分层回答。 具体来说：定义层：BeanDefinitionRegistryPostProcessor、BeanFactoryPostProcessor。；实例层：BeanPostProcessor、Aware、InitializingBean、FactoryBean。；运行层：ApplicationListener、事件、SmartLifecycle、ApplicationRunner/CommandLineRunner（Boot）。。\",\"code\":\"\"},{\"id\":45,\"title\":\"MVC分层介绍一下\",\"node\":\"mvc\",\"cat\":\"mvc\",\"short\":\"MVC 分离 Model（模型）、View（视图）、Controller（请求协调）；后端工程还常以 Controller/Service/DAO 分层。\",\"details\":[\"Controller 接收 HTTP 请求、参数校验和委托业务操作。\",\"Model 封装数据和业务表达；传统 View 渲染页面，REST 场景常返回 JSON。\",\"Service 处理业务，Repository/Mapper 负责数据访问，它们是工程分层而非 MVC 三要素的完全同义替换。\"],\"example\":\"GET /users/1 → Controller → UserService → Mapper → JSON 响应。\",\"trap\":\"不要说 MVC 的 Model 就是数据库实体，也不要把 Service 当成 MVC 的 View。\",\"interview\":\"MVC 分离 Model（模型）、View（视图）、Controller（请求协调）；后端工程还常以 Controller/Service/DAO 分层。 具体来说：Controller 接收 HTTP 请求、参数校验和委托业务操作。；Model 封装数据和业务表达；传统 View 渲染页面，REST 场景常返回 JSON。；Service 处理业务，Repository/Mapper 负责数据访问，它们是工程分层而非 MVC 三要素的完全同义替换。。\",\"code\":\"\"},{\"id\":46,\"title\":\"了解SpringMVC的处理流程吗？\",\"node\":\"dispatch\",\"cat\":\"mvc\",\"short\":\"Servlet 请求先到 DispatcherServlet，再经映射器、适配器执行 Controller，最后处理返回值。\",\"details\":[\"DispatcherServlet 接请求，HandlerMapping 找到 Handler 和拦截器链。\",\"HandlerAdapter 负责调用处理器，参数解析器、类型转换、校验器辅助入参绑定。\",\"返回值处理器和消息转换器将对象写入 JSON，或使用 ViewResolver 渲染视图；异常交由 HandlerExceptionResolver。\"],\"example\":\"GET /orders/9：匹配 @GetMapping、解析 id、执行 Controller、Jackson 返回 JSON。\",\"trap\":\"REST 接口不一定经历模板视图解析；Controller 不直接负责所有序列化。\",\"interview\":\"Servlet 请求先到 DispatcherServlet，再经映射器、适配器执行 Controller，最后处理返回值。 具体来说：DispatcherServlet 接请求，HandlerMapping 找到 Handler 和拦截器链。；HandlerAdapter 负责调用处理器，参数解析器、类型转换、校验器辅助入参绑定。；返回值处理器和消息转换器将对象写入 JSON，或使用 ViewResolver 渲染视图；异常交由 HandlerExceptionResolver。。\",\"code\":\"\"},{\"id\":47,\"title\":\"@Controller 和 @RestController 有什么区别？\",\"node\":\"controller\",\"cat\":\"mvc\",\"short\":\"@RestController 相当于 @Controller + @ResponseBody，通常直接返回响应体。\",\"details\":[\"@Controller 常配合视图名、Model 返回页面，也可单独给方法加 @ResponseBody。\",\"@RestController 的方法返回值默认交消息转换器写为 JSON/文本等响应体。\",\"使用 @ResponseStatus / ResponseEntity 可以明确控制 HTTP 状态和响应头。\"],\"example\":\"@RestController 返回 User DTO 转 JSON；@Controller 返回 \\\"users\\\" 可解析模板页面。\",\"trap\":\"@RestController 不等于只支持 JSON，最终媒体类型取决于 converter 和协商。\",\"interview\":\"@RestController 相当于 @Controller + @ResponseBody，通常直接返回响应体。 具体来说：@Controller 常配合视图名、Model 返回页面，也可单独给方法加 @ResponseBody。；@RestController 的方法返回值默认交消息转换器写为 JSON/文本等响应体。；使用 @ResponseStatus / ResponseEntity 可以明确控制 HTTP 状态和响应头。。\",\"code\":\"\"},{\"id\":48,\"title\":\"@RequestParam、@PathVariable 和 @RequestBody 有什么区别？\",\"node\":\"binding\",\"cat\":\"mvc\",\"short\":\"@RequestParam 绑定查询或表单参数，@PathVariable 绑定 URL 路径变量，@RequestBody 读取请求体。\",\"details\":[\"@RequestParam 对应 /users?page=2 中的 page，也可处理表单字段。\",\"@PathVariable 对应 /users/{id} 中路径片段 id。\",\"@RequestBody 通常用 HttpMessageConverter 解析 JSON 为 DTO，并可结合 @Valid 校验。\"],\"example\":\"POST /orders/9?dryRun=true 且 body 为 JSON：id 用 PathVariable，dryRun 用 RequestParam，JSON 用 RequestBody。\",\"trap\":\"@RequestBody 并不适用于 GET 查询字符串；请求体只能按流消费，需要注意重复读取。\",\"interview\":\"@RequestParam 绑定查询或表单参数，@PathVariable 绑定 URL 路径变量，@RequestBody 读取请求体。 具体来说：@RequestParam 对应 /users?page=2 中的 page，也可处理表单字段。；@PathVariable 对应 /users/{id} 中路径片段 id。；@RequestBody 通常用 HttpMessageConverter 解析 JSON 为 DTO，并可结合 @Valid 校验。。\",\"code\":\"\"},{\"id\":49,\"title\":\"SpringMVC怎么统一处理异常？\",\"node\":\"exception\",\"cat\":\"mvc\",\"short\":\"用 @ControllerAdvice/@RestControllerAdvice + @ExceptionHandler 统一将异常映射为 HTTP 响应。\",\"details\":[\"Controller 执行异常被 HandlerExceptionResolver 体系处理。\",\"编写不同异常类型处理器，封装统一错误码、信息、traceId、HTTP 状态。\",\"参数校验、业务异常、未知异常要区分，避免把所有错误当 HTTP 200。\"],\"example\":\"@RestControllerAdvice 捕获 BizException 返回 ResponseEntity.status(409).body(error)。\",\"trap\":\"异常响应不能泄露堆栈和内部 SQL；也不能把服务端 bug 默默吞掉。\",\"interview\":\"用 @ControllerAdvice/@RestControllerAdvice + @ExceptionHandler 统一将异常映射为 HTTP 响应。 具体来说：Controller 执行异常被 HandlerExceptionResolver 体系处理。；编写不同异常类型处理器，封装统一错误码、信息、traceId、HTTP 状态。；参数校验、业务异常、未知异常要区分，避免把所有错误当 HTTP 200。。\",\"code\":\"\"},{\"id\":50,\"title\":\"Handlermapping 和 handleradapter有了解吗？\",\"node\":\"handler\",\"cat\":\"mvc\",\"short\":\"HandlerMapping 负责“找谁处理”，HandlerAdapter 负责“怎么调用处理器”。\",\"details\":[\"映射器依据 URL、HTTP 方法和注解等定位 HandlerExecutionChain。\",\"适配器将实际处理器类型抽象为统一调用接口，避免 DispatcherServlet 依赖具体控制器签名。\",\"RequestMappingHandlerAdapter 负责常见 @RequestMapping 方法的参数绑定和返回值处理。\"],\"example\":\"@GetMapping(\\\"/users/{id}\\\") 先被映射选中，再由适配器反射执行方法并解析参数。\",\"trap\":\"两者都不等同拦截器；HandlerInterceptor 在执行链中另行参与。\",\"interview\":\"HandlerMapping 负责“找谁处理”，HandlerAdapter 负责“怎么调用处理器”。 具体来说：映射器依据 URL、HTTP 方法和注解等定位 HandlerExecutionChain。；适配器将实际处理器类型抽象为统一调用接口，避免 DispatcherServlet 依赖具体控制器签名。；RequestMappingHandlerAdapter 负责常见 @RequestMapping 方法的参数绑定和返回值处理。。\",\"code\":\"\"},{\"id\":51,\"title\":\"为什么使用springboot\",\"node\":\"boot\",\"cat\":\"boot\",\"short\":\"Spring Boot 的目标是快速搭建可运行 Spring 应用，减少样板配置与环境整合成本。\",\"details\":[\"starter 提供按场景组织的依赖集合，减少人工挑选 Jar。\",\"自动配置根据类路径、属性和已存在 Bean 进行条件装配。\",\"内嵌 Web Server、外部化配置、Actuator 等便于快速启动和运维。\"],\"example\":\"引入 spring-boot-starter-web 后写 @RestController，应用便可用内嵌容器处理 HTTP。\",\"trap\":\"Boot 不是替代 Spring 核心容器；自动配置依旧允许用户覆盖。\",\"interview\":\"Spring Boot 的目标是快速搭建可运行 Spring 应用，减少样板配置与环境整合成本。 具体来说：starter 提供按场景组织的依赖集合，减少人工挑选 Jar。；自动配置根据类路径、属性和已存在 Bean 进行条件装配。；内嵌 Web Server、外部化配置、Actuator 等便于快速启动和运维。。\",\"code\":\"\"},{\"id\":52,\"title\":\"SpringBoot比Spring好在哪里\",\"node\":\"boot\",\"cat\":\"boot\",\"short\":\"Spring Boot 建立在 Spring Framework 之上，优势是约定、依赖管理、自动配置和可部署性。\",\"details\":[\"传统 Spring 项目往往需要自行整合配置与运行环境；Boot 用 starter 和配置默认值减少重复工作。\",\"Boot 的可执行 Jar 和内嵌服务器降低部署复杂度。\",\"条件装配让常见能力开箱即用，但出问题要会看条件报告。\"],\"example\":\"对比手工配置 MVC/JSON/Servlet 容器与 Boot starter-web 的默认装配。\",\"trap\":\"不能说 Spring Framework 不支持自动装配或 Boot 性能必然更高。\",\"interview\":\"Spring Boot 建立在 Spring Framework 之上，优势是约定、依赖管理、自动配置和可部署性。 具体来说：传统 Spring 项目往往需要自行整合配置与运行环境；Boot 用 starter 和配置默认值减少重复工作。；Boot 的可执行 Jar 和内嵌服务器降低部署复杂度。；条件装配让常见能力开箱即用，但出问题要会看条件报告。。\",\"code\":\"\"},{\"id\":53,\"title\":\"SpringBoot用到哪些设计模式？\",\"node\":\"patterns\",\"cat\":\"boot\",\"short\":\"Boot 组合了自动配置中的条件策略、工厂、模板、观察者与装饰器等模式。\",\"details\":[\"自动配置类结合条件注解实现按环境选择的策略装配。\",\"AutoConfigurationImportSelector 类似配置导入选择器；Starter 主要是依赖约定，未必本身属于特定模式。\",\"SpringApplication 使用 ApplicationListener/事件机制贯穿启动，Web 过滤器链体现责任链。\"],\"example\":\"不同数据库驱动可触发不同 DataSource 配置条件。\",\"trap\":\"设计模式属于理解工具，别把 every starter 机械解释为“工厂模式”。\",\"interview\":\"Boot 组合了自动配置中的条件策略、工厂、模板、观察者与装饰器等模式。 具体来说：自动配置类结合条件注解实现按环境选择的策略装配。；AutoConfigurationImportSelector 类似配置导入选择器；Starter 主要是依赖约定，未必本身属于特定模式。；SpringApplication 使用 ApplicationListener/事件机制贯穿启动，Web 过滤器链体现责任链。。\",\"code\":\"\"},{\"id\":54,\"title\":\"怎么理解SpringBoot中的约定大于配置\",\"node\":\"convention\",\"cat\":\"boot\",\"short\":\"Boot 为常见场景提供合理默认配置，只有需要偏离默认时才显式覆盖。\",\"details\":[\"约定包括配置文件命名、包扫描位置、starter 依赖组合和自动配置条件。\",\"通过 application.yml、环境变量、@Bean、自定义配置类覆盖合适默认值。\",\"约定不是无法配置；理解生效顺序才能排查为什么自定义配置未生效。\"],\"example\":\"Spring Boot 默认扫描启动类所在包及子包，因此通常把启动类放顶层包。\",\"trap\":\"约定并非保证所有环境都适合默认设置，生产安全配置必须检查。\",\"interview\":\"Boot 为常见场景提供合理默认配置，只有需要偏离默认时才显式覆盖。 具体来说：约定包括配置文件命名、包扫描位置、starter 依赖组合和自动配置条件。；通过 application.yml、环境变量、@Bean、自定义配置类覆盖合适默认值。；约定不是无法配置；理解生效顺序才能排查为什么自定义配置未生效。。\",\"code\":\"\"},{\"id\":55,\"title\":\"SpringBoot的项目结构是怎么样的？\",\"node\":\"bootproject\",\"cat\":\"boot\",\"short\":\"通常将启动类放顶层包，按业务或分层组织 Controller、Service、Repository、配置与测试。\",\"details\":[\"@SpringBootApplication 所在包决定默认组件扫描基准包。\",\"按领域划分 order/user 等模块，模块内部再分 api/application/domain/infrastructure 或传统三层。\",\"资源目录存 application.yml 等配置，测试目录使用 JUnit 与 SpringBootTest。\"],\"example\":\"com.example.AppApplication 之下包含 com.example.order、com.example.user。\",\"trap\":\"这不是框架强制目录结构；组件不被扫描通常与包路径有关。\",\"interview\":\"通常将启动类放顶层包，按业务或分层组织 Controller、Service、Repository、配置与测试。 具体来说：@SpringBootApplication 所在包决定默认组件扫描基准包。；按领域划分 order/user 等模块，模块内部再分 api/application/domain/infrastructure 或传统三层。；资源目录存 application.yml 等配置，测试目录使用 JUnit 与 SpringBootTest。。\",\"code\":\"\"},{\"id\":56,\"title\":\"SpringBoot自动装配原理是什么？\",\"node\":\"autoconfig\",\"cat\":\"boot\",\"short\":\"@SpringBootApplication 开启自动配置，Boot 导入候选配置类，再由 @Conditional 等条件决定哪些 Bean 生效。\",\"details\":[\"@SpringBootApplication 组合 @SpringBootConfiguration、@EnableAutoConfiguration、@ComponentScan。\",\"当前 Boot 版本通常从 META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports 获取自动配置类；旧机制有 spring.factories。\",\"@ConditionalOnClass、@ConditionalOnMissingBean、@ConditionalOnProperty 等共同决定是否创建默认 Bean。\"],\"example\":\"classpath 存在 JDBC、未定义自己的 DataSource 且满足其他条件时，自动配置可能构造数据源。\",\"trap\":\"“导入 starter 就一定有 Bean”错误；自动配置取决于条件与运行环境。\",\"interview\":\"@SpringBootApplication 开启自动配置，Boot 导入候选配置类，再由 @Conditional 等条件决定哪些 Bean 生效。 具体来说：@SpringBootApplication 组合 @SpringBootConfiguration、@EnableAutoConfiguration、@ComponentScan。；当前 Boot 版本通常从 META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports 获取自动配置类；旧机制有 spring.factories。；@ConditionalOnClass、@ConditionalOnMissingBean、@ConditionalOnProperty 等共同决定是否创建默认 Bean。。\",\"code\":\"\"},{\"id\":57,\"title\":\"说几个启动器（starter)？\",\"node\":\"starter\",\"cat\":\"boot\",\"short\":\"starter 是按使用场景聚合依赖的入口，不是负责扫描 Bean 的运行时引擎。\",\"details\":[\"常见 web、data-jpa、jdbc、validation、security、actuator、test。\",\"Starter 通常依赖自动配置模块和第三方库，实际是否装配由条件配置决定。\",\"不同 Boot 大版本 starter 命名与模块拆分可能调整，查对应 BOM 和官方依赖文档。\"],\"example\":\"引入 starter-validation 常获得 Jakarta Bean Validation 相关依赖，使用 @Valid 校验请求 DTO。\",\"trap\":\"Starter 不等于 AutoConfiguration；前者偏依赖组织，后者偏运行时装配。\",\"interview\":\"starter 是按使用场景聚合依赖的入口，不是负责扫描 Bean 的运行时引擎。 具体来说：常见 web、data-jpa、jdbc、validation、security、actuator、test。；Starter 通常依赖自动配置模块和第三方库，实际是否装配由条件配置决定。；不同 Boot 大版本 starter 命名与模块拆分可能调整，查对应 BOM 和官方依赖文档。。\",\"code\":\"\"},{\"id\":58,\"title\":\"写过SpringBoot starter吗?\",\"node\":\"starterdev\",\"cat\":\"boot\",\"short\":\"自定义 Starter 应提供自动配置类、条件配置、属性绑定、元数据与自动配置导入文件。\",\"details\":[\"创建业务模块并用 @ConfigurationProperties 定义可配置项，提供 @AutoConfiguration 类与条件。\",\"在 META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports 注册自动配置类。\",\"starter 依赖该自动配置模块，提供默认 Bean 但允许使用者声明自己的同类 Bean 进行覆盖。\"],\"example\":\"实现 message-client-spring-boot-starter，配置 message.endpoint 后自动注册 MessageClient。\",\"trap\":\"不要要求用户手工 @ComponentScan 自家包，否则缺失自动配置体验；还应测试缺类/覆盖条件。\",\"interview\":\"自定义 Starter 应提供自动配置类、条件配置、属性绑定、元数据与自动配置导入文件。 具体来说：创建业务模块并用 @ConfigurationProperties 定义可配置项，提供 @AutoConfiguration 类与条件。；在 META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports 注册自动配置类。；starter 依赖该自动配置模块，提供默认 Bean 但允许使用者声明自己的同类 Bean 进行覆盖。。\",\"code\":\"@AutoConfiguration\\n@EnableConfigurationProperties(ClientProps.class)\\nclass ClientAutoConfig {\\n @Bean @ConditionalOnMissingBean Client client(ClientProps p) { return new Client(p.url()); }\\n}\"},{\"id\":59,\"title\":\"SpringBoot启动流程大致是什么？\",\"node\":\"bootstart\",\"cat\":\"boot\",\"short\":\"main 调用 SpringApplication.run，依次准备环境、创建上下文、加载 Bean、刷新容器并运行启动回调。\",\"details\":[\"解析配置/环境与启动参数，发布启动阶段事件。\",\"创建 ApplicationContext、加载应用定义，refresh() 触发 BeanFactory 后处理、单例创建、Web Server 初始化等。\",\"最后调用 Runner 并发布就绪事件；异常会触发失败事件及清理。\"],\"example\":\"SpringApplication.run(App.class,args) 返回 ConfigurableApplicationContext。\",\"trap\":\"自动配置主要属于上下文构建过程，不是单独在启动完成之后执行的一步。\",\"interview\":\"main 调用 SpringApplication.run，依次准备环境、创建上下文、加载 Bean、刷新容器并运行启动回调。 具体来说：解析配置/环境与启动参数，发布启动阶段事件。；创建 ApplicationContext、加载应用定义，refresh() 触发 BeanFactory 后处理、单例创建、Web Server 初始化等。；最后调用 Runner 并发布就绪事件；异常会触发失败事件及清理。。\",\"code\":\"\"},{\"id\":60,\"title\":\"自动配置没有生效，怎么排查？\",\"node\":\"bootdebug\",\"cat\":\"boot\",\"short\":\"先确认依赖与版本，再看条件评估报告、扫描范围、属性绑定和是否被用户 Bean 覆盖。\",\"details\":[\"启动 --debug 或看 Actuator conditions 获取哪些 @Conditional 通过/未通过。\",\"确认所需类确实在 classpath、AutoConfiguration.imports 文件路径正确、属性名称和值有效。\",\"检查 @ConditionalOnMissingBean 回退、自定义 @Bean、排除配置、Bean 加载顺序与冲突。\"],\"example\":\"自定义 Starter 没注入 Bean：先查 imports 是否打包进 jar，再看 OnClass 与 OnProperty 结果。\",\"trap\":\"不要直接靠乱加 @ComponentScan 绕过自动配置条件；可能引入重复 Bean。\",\"interview\":\"先确认依赖与版本，再看条件评估报告、扫描范围、属性绑定和是否被用户 Bean 覆盖。 具体来说：启动 --debug 或看 Actuator conditions 获取哪些 @Conditional 通过/未通过。；确认所需类确实在 classpath、AutoConfiguration.imports 文件路径正确、属性名称和值有效。；检查 @ConditionalOnMissingBean 回退、自定义 @Bean、排除配置、Bean 加载顺序与冲突。。\",\"code\":\"\"},{\"id\":61,\"title\":\"@Value 和 @ConfigurationProperties 有什么区别？\",\"node\":\"configprops\",\"cat\":\"boot\",\"short\":\"@Value 适合少量单值/表达式；@ConfigurationProperties 适合结构化、批量、类型安全配置。\",\"details\":[\"@Value 支持 ${...}、SpEL，常直接注入一个字段或构造参数。\",\"@ConfigurationProperties 按前缀绑定嵌套对象、列表、Map，并可结合校验。\",\"结构化设置建议使用不可变配置对象并在启动时验证。\"],\"example\":\"app.notify.timeout、app.notify.targets[] 等适合 AppNotifyProperties 统一绑定。\",\"trap\":\"两者都要注意配置源优先级；@Value 不天然具备复杂结构的统一验证模型。\",\"interview\":\"@Value 适合少量单值/表达式；@ConfigurationProperties 适合结构化、批量、类型安全配置。 具体来说：@Value 支持 ${...}、SpEL，常直接注入一个字段或构造参数。；@ConfigurationProperties 按前缀绑定嵌套对象、列表、Map，并可结合校验。；结构化设置建议使用不可变配置对象并在启动时验证。。\",\"code\":\"\"},{\"id\":62,\"title\":\"SpringBoot配置文件的优先级是怎样的？\",\"node\":\"configorder\",\"cat\":\"boot\",\"short\":\"只比较四种常见来源时，Spring Boot 默认按以下顺序覆盖，从高到低是命令行参数、Java 系统属性、操作系统环境变量、配置文件。\",\"details\":[\"例如 --server.port=9000 的优先级高于 -Dserver.port=8000，后者又高于 SERVER_PORT 和 application.properties 中的同名属性。\",\"在默认搜索位置中，配置文件从高到低依次是包外 profile 文件、包外普通文件、包内 profile 文件、包内普通文件。\",\"同一位置同时存在 .properties 和 YAML 配置时，.properties 优先。显式配置导入、测试属性和命令行开关等会影响实际优先级。\"],\"example\":\"如果 application.yml 配置端口为 8080，而启动时传入 --server.port=9000，默认使用 9000。\",\"trap\":\"上面的四类顺序是常见运行场景的子集。遇到测试属性、外部导入或自定义属性源时，按实际 PropertySource 顺序排查。\",\"interview\":\"只比较四种常见来源时，Spring Boot 默认按以下顺序覆盖，从高到低是命令行参数、Java 系统属性、操作系统环境变量、配置文件。 同一位置有 .properties 和 YAML 时，.properties 优先。用 profile 和外部配置时，还要检查文件位置和实际加载顺序。\",\"code\":\"\"},{\"id\":63,\"title\":\"SpringBoot里面有哪些重要的注解？还有一个配置相关的注解是哪个？\",\"node\":\"annotations\",\"cat\":\"boot\",\"short\":\"常见 @SpringBootApplication、@Configuration、@Bean、@ComponentScan、@ConditionalOn… 和 @ConfigurationProperties。\",\"details\":[\"@SpringBootApplication 聚合配置类、组件扫描与自动配置。\",\"@EnableConfigurationProperties 或 @ConfigurationPropertiesScan 用来注册属性绑定类。\",\"@ConditionalOnClass/OnMissingBean/OnProperty 控制自动配置条件。\"],\"example\":\"@ConfigurationProperties(prefix=\\\"service.sms\\\") 绑定短信客户端的连接参数。\",\"trap\":\"@ConfigurationProperties 加在普通类上不意味着一定被扫描和注册。\",\"interview\":\"常见 @SpringBootApplication、@Configuration、@Bean、@ComponentScan、@ConditionalOn… 和 @ConfigurationProperties。 具体来说：@SpringBootApplication 聚合配置类、组件扫描与自动配置。；@EnableConfigurationProperties 或 @ConfigurationPropertiesScan 用来注册属性绑定类。；@ConditionalOnClass/OnMissingBean/OnProperty 控制自动配置条件。。\",\"code\":\"\"},{\"id\":64,\"title\":\"springboot怎么开启事务？\",\"node\":\"txproxy\",\"cat\":\"boot\",\"short\":\"添加适当数据访问依赖与事务管理器，使用 @Transactional 声明边界；Boot 多数 JDBC/JPA 场景自动装配。\",\"details\":[\"确认 DataSource 与 PlatformTransactionManager 等基础设施已就绪。\",\"在 Spring 管理的 Service 对外可代理方法上标注 @Transactional。\",\"检查异常回滚规则、代理调用、线程边界和多数据源匹配。\"],\"example\":\"一个 Service 方法内插入订单并扣减库存，数据库异常时一起回滚。\",\"trap\":\"不是只加 @Transactional 注解就一定生效，前提是事务管理已配置。\",\"interview\":\"添加适当数据访问依赖与事务管理器，使用 @Transactional 声明边界；Boot 多数 JDBC/JPA 场景自动装配。 具体来说：确认 DataSource 与 PlatformTransactionManager 等基础设施已就绪。；在 Spring 管理的 Service 对外可代理方法上标注 @Transactional。；检查异常回滚规则、代理调用、线程边界和多数据源匹配。。\",\"code\":\"\"},{\"id\":65,\"title\":\"Springboot怎么做到导入就可以直接使用的？\",\"node\":\"autoconfig\",\"cat\":\"boot\",\"short\":\"Starter 带来依赖，自动配置类发现并通过条件判断注册 Bean，实现开箱即用。\",\"details\":[\"依赖管理确保相关 API/实现和自动配置模块进入 classpath。\",\"候选 AutoConfiguration 由框架加载，再由 @Conditional 判定运行环境。\",\"默认 Bean 可被用户显式配置覆盖，配置属性允许调节行为。\"],\"example\":\"加入 starter-web 后 MVC 处理器、JSON 转换器和内嵌服务器相关配置按条件生效。\",\"trap\":\"“Spring Boot 自动扫描所有 Jar 里的 @Component”并非自动配置的准确工作原理。\",\"interview\":\"Starter 带来依赖，自动配置类发现并通过条件判断注册 Bean，实现开箱即用。 具体来说：依赖管理确保相关 API/实现和自动配置模块进入 classpath。；候选 AutoConfiguration 由框架加载，再由 @Conditional 判定运行环境。；默认 Bean 可被用户显式配置覆盖，配置属性允许调节行为。。\",\"code\":\"\"},{\"id\":66,\"title\":\"SpringBoot 过滤器和拦截器说一下？\",\"node\":\"filters\",\"cat\":\"boot\",\"short\":\"Filter 属于 Servlet 规范，HandlerInterceptor 属于 Spring MVC，二者位置和可见上下文不同。\",\"details\":[\"Filter 在 DispatcherServlet 前后的 Servlet 链上工作，可处理包装请求、跨域等。\",\"HandlerInterceptor 位于匹配处理器后，可用 preHandle/postHandle/afterCompletion 处理 MVC 请求。\",\"认证/安全应优先评估 Spring Security；需要读取 body 时注意输入流一次消费问题。\"],\"example\":\"统一 traceId 可在 Filter 设置；记录 Controller handler 信息可在 Interceptor。\",\"trap\":\"过滤器并非只拦 Controller，拦截器不处理所有静态资源/非 MVC 调用。\",\"interview\":\"Filter 属于 Servlet 规范，HandlerInterceptor 属于 Spring MVC，二者位置和可见上下文不同。 具体来说：Filter 在 DispatcherServlet 前后的 Servlet 链上工作，可处理包装请求、跨域等。；HandlerInterceptor 位于匹配处理器后，可用 preHandle/postHandle/afterCompletion 处理 MVC 请求。；认证/安全应优先评估 Spring Security；需要读取 body 时注意输入流一次消费问题。。\",\"code\":\"\"},{\"id\":67,\"title\":\"与传统的JDBC相比，MyBatis的优点？\",\"node\":\"mybatis\",\"cat\":\"mybatis\",\"short\":\"MyBatis 是 SQL 映射框架，减少 JDBC 模板代码并管理参数绑定、结果映射、事务集成。\",\"details\":[\"自动管理 PreparedStatement 的创建、参数设置与结果封装（具体资源由框架/session 管理）。\",\"支持动态 SQL、Mapper XML/注解、复杂 resultMap。\",\"保留 SQL 的可控性，适合复杂查询，但需负责 SQL 质量与映射正确性。\"],\"example\":\"Mapper.selectById(id) 自动绑定参数并把 ResultSet 映射为 User。\",\"trap\":\"MyBatis 不是全自动 ORM：SQL 和索引优化责任仍属于开发者。\",\"interview\":\"MyBatis 是 SQL 映射框架，减少 JDBC 模板代码并管理参数绑定、结果映射、事务集成。 具体来说：自动管理 PreparedStatement 的创建、参数设置与结果封装（具体资源由框架/session 管理）。；支持动态 SQL、Mapper XML/注解、复杂 resultMap。；保留 SQL 的可控性，适合复杂查询，但需负责 SQL 质量与映射正确性。。\",\"code\":\"\"},{\"id\":68,\"title\":\"MyBatis觉得在哪方面做的比较好？\",\"node\":\"mybatis\",\"cat\":\"mybatis\",\"short\":\"优势在 SQL 可控、参数安全绑定、结果映射和动态 SQL 的工程化支持。\",\"details\":[\"Mapper 接口与 XML/注解解耦数据库访问代码。\",\"#{ } 默认使用参数绑定，有助于避免把用户值直接拼进 SQL。\",\"resultMap 处理关联映射，动态 if/choose/foreach 使可选条件更清晰。\"],\"example\":\"列表查询根据可选状态与多 ID 动态构造 WHERE / IN。\",\"trap\":\"动态 SQL 写得好不代表数据库一定执行得快，仍需 EXPLAIN 和索引分析。\",\"interview\":\"优势在 SQL 可控、参数安全绑定、结果映射和动态 SQL 的工程化支持。 具体来说：Mapper 接口与 XML/注解解耦数据库访问代码。；#{ } 默认使用参数绑定，有助于避免把用户值直接拼进 SQL。；resultMap 处理关联映射，动态 if/choose/foreach 使可选条件更清晰。。\",\"code\":\"\"},{\"id\":69,\"title\":\"还记得JDBC连接数据库的步骤吗？\",\"node\":\"jdbc\",\"cat\":\"mybatis\",\"short\":\"典型 JDBC：获取 DataSource 连接→准备 SQL→绑定参数→执行→读取结果→关闭资源。\",\"details\":[\"应用从连接池 DataSource 获取 Connection，而非每次手动创建物理连接。\",\"PreparedStatement 预编译/绑定参数，执行 query/update。\",\"用 try-with-resources 关闭 ResultSet、Statement、Connection（连接池中 close 通常为归还连接）。\"],\"example\":\"查询用户：getConnection() → prepareStatement(\\\"select ... where id=?\\\") → setLong(1,id) → executeQuery()。\",\"trap\":\"DriverManager.getConnection 只是方式之一，生产环境通常建议连接池。\",\"interview\":\"典型 JDBC：获取 DataSource 连接→准备 SQL→绑定参数→执行→读取结果→关闭资源。 具体来说：应用从连接池 DataSource 获取 Connection，而非每次手动创建物理连接。；PreparedStatement 预编译/绑定参数，执行 query/update。；用 try-with-resources 关闭 ResultSet、Statement、Connection（连接池中 close 通常为归还连接）。。\",\"code\":\"try (Connection c = ds.getConnection(); PreparedStatement p = c.prepareStatement(\\\"SELECT * FROM users WHERE id=?\\\")) {\\n p.setLong(1, id);\\n try (ResultSet r = p.executeQuery()) { while(r.next()) { /* map */ } }\\n}\"},{\"id\":70,\"title\":\"如果项目中要用到原生的mybatis去查询，该怎样写？\",\"node\":\"sqlsession\",\"cat\":\"mybatis\",\"short\":\"原生 MyBatis 使用 SqlSessionFactory 打开 SqlSession，再通过 Mapper 调用 SQL 并提交/关闭。\",\"details\":[\"通过配置创建 SqlSessionFactory，映射 XML 或注解语句。\",\"用 try-with-resources 打开 SqlSession 并 getMapper，执行查询与更新。\",\"非自动提交模式下显式 commit/rollback；Spring 集成时由 SqlSessionTemplate/事务同步管理。\"],\"example\":\"try(SqlSession s=factory.openSession()){ UserMapper m=s.getMapper(UserMapper.class); m.selectById(1L); }。\",\"trap\":\"不要在多线程间共享原生 SqlSession；通常每次业务操作使用自己的 Session。\",\"interview\":\"原生 MyBatis 使用 SqlSessionFactory 打开 SqlSession，再通过 Mapper 调用 SQL 并提交/关闭。 具体来说：通过配置创建 SqlSessionFactory，映射 XML 或注解语句。；用 try-with-resources 打开 SqlSession 并 getMapper，执行查询与更新。；非自动提交模式下显式 commit/rollback；Spring 集成时由 SqlSessionTemplate/事务同步管理。。\",\"code\":\"\"},{\"id\":71,\"title\":\"Mybatis里的 # 和 $ 的区别？\",\"node\":\"param\",\"cat\":\"mybatis\",\"short\":\"#{ } 通常绑定参数并转为 JDBC ?；${ } 是字符串直接替换，可能导致 SQL 注入。\",\"details\":[\"#{name} 使用 PreparedStatement 参数绑定，适合用户输入值。\",\"${column} 用于不能参数化的 SQL 标识符等结构，但必须严格白名单。\",\"动态排序/表名不能直接接受任意用户字符串拼接，应该做枚举映射。\"],\"example\":\"ORDER BY ${sortColumn} 时 sortColumn 只能从后端允许的固定列名中选择。\",\"trap\":\"`${}` 不是“比 #{} 灵活所以都用它”；直接拼用户值非常危险。\",\"interview\":\"#{ } 通常绑定参数并转为 JDBC ?；${ } 是字符串直接替换，可能导致 SQL 注入。 具体来说：#{name} 使用 PreparedStatement 参数绑定，适合用户输入值。；${column} 用于不能参数化的 SQL 标识符等结构，但必须严格白名单。；动态排序/表名不能直接接受任意用户字符串拼接，应该做枚举映射。。\",\"code\":\"\"},{\"id\":72,\"title\":\"MyBatis的执行流程是什么？\",\"node\":\"executor\",\"cat\":\"mybatis\",\"short\":\"Mapper 调用进入代理→定位 MappedStatement→Executor→StatementHandler/ParameterHandler→JDBC→ResultSetHandler。\",\"details\":[\"MapperProxy 解析接口方法，找到绑定的 SQL 映射语句。\",\"Executor 负责缓存与执行协调，StatementHandler 准备并执行 JDBC Statement。\",\"ParameterHandler 绑定 SQL 参数，ResultSetHandler 将结果映射为对象。\"],\"example\":\"调用 mapper.listOrders(filter) 时 XML 动态 SQL 生成 BoundSql，执行 SQL 后映射 DTO 列表。\",\"trap\":\"不是 Mapper 接口自己实现了 SQL；真正执行仍回到 JDBC。\",\"interview\":\"Mapper 调用进入代理→定位 MappedStatement→Executor→StatementHandler/ParameterHandler→JDBC→ResultSetHandler。 具体来说：MapperProxy 解析接口方法，找到绑定的 SQL 映射语句。；Executor 负责缓存与执行协调，StatementHandler 准备并执行 JDBC Statement。；ParameterHandler 绑定 SQL 参数，ResultSetHandler 将结果映射为对象。。\",\"code\":\"\"},{\"id\":73,\"title\":\"MyBatis的一级缓存和二级缓存有什么区别？\",\"node\":\"cache\",\"cat\":\"mybatis\",\"short\":\"一级缓存通常是 SqlSession 本地缓存；二级缓存按 Mapper namespace 跨 Session 共享（需配置）。\",\"details\":[\"一级缓存生命周期与 Session 相关，重复相同查询可命中，但更新会清理相关缓存。\",\"二级缓存需要启用映射器 cache，存在序列化、失效、事务提交等约束。\",\"分布式更新或多服务部署容易出现数据不一致，生产需谨慎使用二级缓存。\"],\"example\":\"同 SqlSession 两次查询相同参数可能复用一级缓存；另一个 SqlSession 不共享一级缓存。\",\"trap\":\"不能断言所有查询一定命中缓存；缓存 key、环境、刷新和事务条件都会影响。\",\"interview\":\"一级缓存通常是 SqlSession
