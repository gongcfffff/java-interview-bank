er-radius:15px;padding:18px 20px;margin-bottom:13px;box-shadow:0 4px 18px #223a6508}\n.study-panel h3{font-size:14px;margin:0 0 11px;color:#263d61;display:flex;align-items:center;gap:8px}.study-panel h3 .kicker{font-size:10px;font-weight:800;border-radius:6px;background:#e8f0ff;color:#3767b6;padding:4px 6px}\n.study-panel p{font-size:14px;line-height:1.9;margin:0;color:#40516c}.study-panel.quick{background:#eaf4ff;border-color:#cce0fb}.study-panel.quick p{font-size:15px;color:#1b477b;font-weight:600}\n.study-points{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}.study-points li{display:flex;gap:11px;line-height:1.83;color:#40516c;font-size:13px}\n.study-points .step{background:#eaf0f8;border-radius:7px;color:#3e6aa5;min-width:25px;height:25px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none;margin-top:1px}\n.study-panel.example{background:#f7fcf9;border-color:#d7eade}.study-panel.warning{background:#fff9f4;border-color:#f6e5d3}.study-panel.warning p{color:#8b5c31}\n.study-code{background:#192940;color:#d5edff;border-radius:10px;padding:15px 16px;line-height:1.65;font-size:12px;white-space:pre-wrap;overflow-x:auto;margin:12px 0 0;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}\n.study-nodechips,.study-followups{display:flex;flex-wrap:wrap;gap:8px}.study-chip{border:1px solid #dce5ef;background:#fff;border-radius:9px;padding:9px 11px;color:#3864a3;font-size:12px;text-align:left;line-height:1.5}.study-chip:hover{background:#edf5ff;border-color:#a8c9ef}.study-chip small{display:block;color:#8291a6;font-size:10px;margin-top:3px}\n.study-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:16px 0 5px}.study-actions button{border:1px solid #d7e2f1;background:#fff;border-radius:10px;padding:10px 13px;color:#35557c;font-size:12px}.study-actions button:hover{background:#edf4ff}.study-actions button.affirm{background:#2369bb;color:#fff;border-color:#2369bb;font-weight:750}.study-actions button.affirm.done{background:#178267;border-color:#178267}\n.study-note{font-size:11px;color:#8797ab;margin:12px 0}.study-source{display:inline-block;color:#2e6dbb;font-size:11px;margin-bottom:10px}\n.study-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}\n@media(max-width:800px){.study-overlay{padding:0}.study-sheet{width:100%;height:100vh;border-radius:0}.study-layout{grid-template-columns:1fr}.study-rail{display:none}.study-article{padding:19px 15px 28px}.study-top{padding:13px 15px}.study-article h2{font-size:22px}.study-panel{padding:16px}.study-summary{margin:10px 0}.study-toptools button:not(.close-study){display:none}.mobile-jump{display:block;max-width:150px}}\n\u003c/style>\u003c/head>\u003cbody>\u003cdiv class=\"shell\">\n\u003cheader class=\"hero\">\u003cdiv class=\"eyebrow\">JVM · INTERACTIVE KNOWLEDGE ATLAS\u003c/div>\u003ch1>JVM 整章知识关联网络 · 完整答案库\u003c/h1>\n\u003cp>一张可交互的知识关系图 + 全章 60 道题逐题精讲：从底层共用算法出发，沿「基础 → 原理 → 实现分叉 → 深入追问 → 排障应用」逐层理解，并记录学习进度。\u003c/p>\n\u003cdiv class=\"hero-bottom\">\u003cdiv class=\"metric\">\u003cstrong id=\"nodeStat\">—\u003c/strong> 知识节点\u003c/div>\u003cdiv class=\"metric\">\u003cstrong id=\"edgeStat\">—\u003c/strong> 解释型关联\u003c/div>\u003cdiv class=\"metric\">\u003cstrong>60 / 60\u003c/strong> 对应原章问题\u003c/div>\u003ca class=\"source\" href=\"https://xiaolincoding.com/interview/jvm.html\" target=\"_blank\" rel=\"noopener\">↗ 原文：小林 coding · JVM 面试篇\u003c/a>\u003c/div>\u003cdiv class=\"hero-actions\">\u003cbutton id=\"heroOpenBtn\" class=\"primary-study\">📖 开始阅读 60 道完整答案\u003c/button>\u003cbutton id=\"heroBrowseBtn\" class=\"ghost-study\">先浏览全部题目 ↓\u003c/button>\u003cspan style=\"font-size:12px;color:#c5e0fb\">离线可用 · 知识图可拖动缩放 · 原题逐题链接\u003c/span>\u003c/div>\u003c/header>\n\u003csection class=\"connection\">\u003cdiv class=\"connhead\">\u003cspan class=\"pill\">核心示例\u003c/span>\u003ch2>G1 和 ZGC 会指向同一套底层算法吗？\u003c/h2>\u003cp>会共享抽象原理，但采用的具体算法和停顿策略不完全一样。\u003c/p>\u003c/div>\n\u003cdiv class=\"connrow\">\n\u003cdiv class=\"conncard\">\u003ch3 style=\"color:#7f59c9\">G1 的实现分支\u003c/h3>\u003cdiv class=\"tagrow\">\u003cspan class=\"tinytag\">Region / CSet\u003c/span>\u003cspan class=\"tinytag\">SATB + 写前屏障\u003c/span>\u003cspan class=\"tinytag\">RSet / 卡表\u003c/span>\u003cspan class=\"tinytag\">STW 对象转移\u003c/span>\u003c/div>\u003cp>通过并发标记选择收益高的区域，Young / Mixed GC 在 STW 中复制存活对象。\u003c/p>\u003c/div>\n\u003cdiv class=\"conncard shared\">\u003ch3 style=\"color:#168c6a\">共同算法底座（从这里分叉）\u003c/h3>\u003cdiv class=\"tagrow\">\u003cspan class=\"tinytag\">GC Roots\u003c/span>\u003cspan class=\"tinytag\">可达性分析\u003c/span>\u003cspan class=\"tinytag\">标记存活\u003c/span>\u003cspan class=\"tinytag\">对象转移 / 复制\u003c/span>\u003cspan class=\"tinytag\">并发工作\u003c/span>\u003cspan class=\"tinytag\">分代思想\u003c/span>\u003c/div>\u003cp>同样需要判断哪些对象活着、回收垃圾占用的空间，并在移动对象时保持引用正确。\u003c/p>\u003c/div>\n\u003cdiv class=\"conncard\">\u003ch3 style=\"color:#6d4cbe\">ZGC 的实现分支\u003c/h3>\u003cdiv class=\"tagrow\">\u003cspan class=\"tinytag\">分代 ZGC\u003c/span>\u003cspan class=\"tinytag\">染色指针\u003c/span>\u003cspan class=\"tinytag\">加载 / 写屏障\u003c/span>\u003cspan class=\"tinytag\">并发对象转移\u003c/span>\u003c/div>\u003cp>也基于可达性与对象转移，但依靠引用状态与屏障机制把大量转移工作放到并发阶段。\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"connfoot\">\u003cspan>✓ \u003cb>算法\u003c/b> ≠ \u003cb>收集器\u003c/b>：算法是解决问题的方法，收集器是多种机制的工程组合。\u003c/span>\u003cspan>✓ 现代 ZGC 是分代的；不能套用“ZGC 不分代”的旧资料。\u003c/span>\u003c/div>\u003c/section>\n\n\u003csection class=\"study-summary\" id=\"answerHub\" aria-label=\"60 题完整答案入口\">\n  \u003cdiv>\u003cstrong>📖 新增：60 道面试题逐题精讲\u003c/strong>\u003cp>每题有面试回答、原理分层、例子、易错点和下一层追问；题目之间可点击跳转。\u003c/p>\u003c/div>\n  \u003cdiv style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap\">\u003cdiv>\u003cdiv class=\"progressline\">\u003cspan id=\"hubProgressFill\" style=\"width:0\">\u003c/span>\u003c/div>\u003cdiv id=\"hubProgressText\" style=\"color:#7487a1;font-size:11px;margin-top:4px\">已掌握 0/60\u003c/div>\u003c/div>\u003cbutton class=\"primary-study\" id=\"hubOpenBtn\" style=\"background:#285da9;color:#fff\">进入完整答案库 ↗\u003c/button>\u003c/div>\n\u003c/section>\n\u003cdiv class=\"workspace\">\n\u003caside class=\"panel sidebar\">\u003cdiv>\u003cdiv class=\"section-cap\">按问题深入 · 点击探索\u003c/div>\u003cdiv class=\"routes\" id=\"routes\">\u003c/div>\u003c/div>\u003cdiv>\u003cdiv class=\"section-cap\">连线代表什么\u003c/div>\n\u003cdiv class=\"legendrow\">\u003cspan class=\"legline\" style=\"border-color:#547aab\">\u003c/span>整章主线 / 前置基础\u003c/div>\n\u003cdiv class=\"legendrow\">\u003cspan class=\"legline shared\">\u003c/span>共享原理（G1、ZGC 共用）\u003c/div>\n\u003cdiv class=\"legendrow\">\u003cspan class=\"legline deep\">\u003c/span>深入追问（为什么之后是什么）\u003c/div>\n\u003cdiv class=\"legendrow\">\u003cspan class=\"legline contrast\">\u003c/span>实现差异 / 易混淆\u003c/div>\n\u003cdiv class=\"legendrow\">\u003cspan class=\"legline apply\">\u003c/span>排障 / 工程应用\u003c/div>\u003c/div>\n\u003cdiv class=\"help\">\u003cb style=\"color:#374963\">怎么看这张图？\u003c/b>\u003cbr>① 点左侧一条问题链\u003cbr>② 看图中高亮的节点和线\u003cbr>③ 点知识节点，右边解释“为什么关联”\u003cbr>④ 下方可以检索原章 60 道题\u003cbr>\u003cbr>\u003cb>小提示：\u003c/b>「展开全部」会显示更多细节点。拖动地图可平移，用图上方的「－」「＋」缩放。\u003c/div>\u003c/aside>\n\u003cmain class=\"panel map-panel\">\n\u003cdiv class=\"toolbar\">\n  \u003cstrong>知识关系图\u003c/strong>\n  \u003cbutton class=\"toolbtn\" id=\"expandBtn\">＋ 展开全部知识点\u003c/button>\n  \u003cbutton class=\"toolbtn\" id=\"resetBtn\">清除选择\u003c/button>\n  \u003cspan style=\"font-size:11px;color:#8592a7\" id=\"mapInfo\">按路径高亮\u003c/span>\n  \u003cdiv class=\"map-zoom\" role=\"group\" aria-label=\"图谱缩放\">\n    \u003cspan>缩放\u003c/span>\n    \u003cbutton type=\"button\" id=\"zoomOut\" title=\"缩小\" aria-label=\"缩小\">−\u003c/button>\n    \u003cbutton type=\"button\" id=\"zoomIn\" title=\"放大\" aria-label=\"放大\">+\u003c/button>\n    \u003cbutton type=\"button\" id=\"fitBtn\">适应视图\u003c/button>\n  \u003c/div>\n\u003c/div>\n\u003cdiv class=\"catnav\" id=\"catnav\">\u003c/div>\u003cdiv class=\"viewport\" id=\"viewport\">\u003csvg id=\"map\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"JVM 交互知识关联图\">\u003c/svg>\u003c/div>\n\u003cdiv class=\"map-footer\">\u003cspan id=\"shownStat\">—\u003c/span>\u003cspan>拖动画布平移 · 点节点看关联\u003c/span>\u003c/div>\u003c/main>\n\u003caside class=\"panel detail\" id=\"detail\">\u003c/aside>\u003c/div>\n\u003csection class=\"questions\" id=\"questionIndex\">\u003cdiv class=\"questions-header\">\u003cdiv>\u003ch2>原章 60 道面试题 → 完整答案 + 关联知识点\u003c/h2>\u003cp>小林 coding 的全部四大节目录；点击任意题目打开详细解答、案例和关联追问；也能从知识节点反向进入对应题目。\u003c/p>\u003c/div>\u003cinput class=\"qsearch\" type=\"search\" id=\"qsearch\" placeholder=\"搜索：比如 SATB、堆、双亲委派、CPU…\" aria-label=\"搜索原章问题\">\u003c/div>\u003cdiv class=\"qgroups\" id=\"qgroups\">\u003c/div>\u003c/section>\n\u003cfooter class=\"footer\">\u003cspan>依据 \u003ca href=\"https://xiaolincoding.com/interview/jvm.html\" target=\"_blank\" rel=\"noopener\">小林 coding · JVM 章节\u003c/a> 的 60 道题重构；技术依据：\u003ca href=\"https://docs.oracle.com/en/java/javase/24/gctuning/garbage-first-g1-garbage-collector1.html\" target=\"_blank\" rel=\"noopener\">Oracle G1 文档\u003c/a>、\u003ca href=\"https://docs.oracle.com/en/java/javase/24/gctuning/z-garbage-collector.html\" target=\"_blank\" rel=\"noopener\">Oracle ZGC 文档\u003c/a>。箭头表示学习依赖或实现关联，并非 JVM 执行时间先后。\u003c/span>\u003cspan>离线单文件 HTML · 无外部脚本依赖 · 2026-11\u003c/span>\u003c/footer>\n\u003c/div>\u003cscript>\nconst DATA={\"cats\":[{\"id\":\"load\",\"label\":\"01 · 类加载与执行\",\"color\":\"#4178E0\",\"desc\":\"源码怎样变成 JVM 正在执行的代码？\"},{\"id\":\"memory\",\"label\":\"02 · 内存结构\",\"color\":\"#0F9A84\",\"desc\":\"类、对象、方法现场分别放哪里？\"},{\"id\":\"object\",\"label\":\"03 · 对象分配\",\"color\":\"#20A777\",\"desc\":\"new 之后经历哪些阶段？\"},{\"id\":\"theory\",\"label\":\"04 · 判活与基础算法\",\"color\":\"#C48B2F\",\"desc\":\"对象何时可以回收，怎么回收？\"},{\"id\":\"collect\",\"label\":\"05 · 收集器与机制\",\"color\":\"#8B65D9\",\"desc\":\"不同收集器共享什么、区别在哪？\"},{\"id\":\"ops\",\"label\":\"06 · 故障与调优\",\"color\":\"#D66F60\",\"desc\":\"线上出现异常怎么定位根因？\"}],\"nodes\":[{\"cat\":\"load\",\"id\":\"source\",\"title\":\"源码 → 字节码\",\"sub\":\"javac / .class\",\"what\":\"Java 源文件经编译生成 class 字节码；JVM 不是直接执行 .java 文件。\",\"take\":\"先有 class，才有类加载、验证和运行。\",\"core\":true},{\"cat\":\"load\",\"id\":\"loading\",\"title\":\"类加载全过程\",\"sub\":\"加载 · 验证与准备 · 初始化\",\"what\":\"类或接口初始化前必须完成加载、验证与准备。解析属于链接，可以按需延后到初始化之后。\",\"take\":\"按 JVMS，ConstantValue 在初始化阶段赋值，早于 \\u003cclinit> 调用。\",\"core\":true},{\"cat\":\"load\",\"id\":\"loaders\",\"title\":\"三层类加载器\",\"sub\":\"Bootstrap / Platform / App\",\"what\":\"不同类加载器负责不同可见范围；自定义加载器可用于插件和隔离。\",\"take\":\"父加载器默认不知道有哪些子加载器。\",\"core\":false},{\"cat\":\"load\",\"id\":\"delegate\",\"title\":\"双亲委派\",\"sub\":\"子找父 / 父失败子再试\",\"what\":\"应用类加载器先请求父加载器，父级找不到时再自行尝试，降低重复与核心类替换风险。\",\"take\":\"双亲委派是一种类加载策略，而非 JVM 所有场景不可打破的铁律。\",\"core\":true},{\"cat\":\"load\",\"id\":\"tccl\",\"title\":\"SPI / TCCL\",\"sub\":\"JDK 代码找应用实现\",\"what\":\"JDBC 等 SPI 代码借线程上下文类加载器发现应用类路径里的实现；不必修改所有类的委派顺序。\",\"take\":\"突破的是父级代码的类可见性，不是直接篡改 Java 核心类。\",\"core\":false},{\"cat\":\"load\",\"id\":\"identity\",\"title\":\"类加载器隔离\",\"sub\":\"类身份 = 类名 + 定义加载器\",\"what\":\"同名类被不同定义类加载器加载后，也可能是不同运行时类型。\",\"take\":\"引出插件隔离、ClassCastException 和类卸载。\",\"core\":false},{\"cat\":\"load\",\"id\":\"initialize\",\"title\":\"何时类初始化\",\"sub\":\"new / 静态字段 / 主类等\",\"what\":\"主动使用类可能触发初始化；JVM 保证同一类初始化过程的同步。\",\"take\":\"类加载可能早于初始化；初始化也不等于对象构造。\",\"core\":false},{\"cat\":\"load\",\"id\":\"execute\",\"title\":\"解释器与栈帧\",\"sub\":\"字节码执行 / 局部变量\",\"what\":\"方法调用会形成逻辑栈帧；解释器逐条解释字节码，线程的 PC 记录执行位置。\",\"take\":\"方法元数据在方法区，但方法不是“在方法区里运行”。\",\"core\":true},{\"cat\":\"load\",\"id\":\"jit\",\"title\":\"JIT / 逃逸优化\",\"sub\":\"热点代码编译 / 内联\",\"what\":\"热点方法经 JIT 编译为机器码；内联、标量替换等可减少调用或分配开销。\",\"take\":\"性能差异不只由 GC 决定，也受 JIT 影响。\",\"core\":true},{\"cat\":\"load\",\"id\":\"codecache\",\"title\":\"代码缓存\",\"sub\":\"JIT 机器码所在位置\",\"what\":\"JIT 编译出的机器码位于 Code Cache，它不属于 Java 堆，也不应与元空间混为一谈。\",\"take\":\"线程执行机器码与堆中对象生命周期是两个层次。\",\"core\":false},{\"cat\":\"memory\",\"id\":\"areas\",\"title\":\"JVM 运行时数据区\",\"sub\":\"堆 / 方法区 / 栈 / PC / 本地栈\",\"what\":\"JVM 规范定义 5 类运行时数据区；堆和方法区共享，栈、PC、本地方法栈是线程私有。\",\"take\":\"Java 内存结构是“数据在哪”，不是 JMM 多线程可见性。\",\"core\":true},{\"cat\":\"memory\",\"id\":\"jmm\",\"title\":\"Java 内存模型 JMM\",\"sub\":\"可见性 / 有序性 / happens-before\",\"what\":\"JMM 讨论线程之间如何正确读写共享变量，是并发语义，不是把内存切成物理分区。\",\"take\":\"别把 JMM 主内存/工作内存等同堆/栈。\",\"core\":false},{\"cat\":\"memory\",\"id\":\"heap\",\"title\":\"Java 堆\",\"sub\":\"对象实例 / 数组\",\"what\":\"大部分对象与数组分配在 Java 堆，GC 主要回收这里；Java 堆不是进程的全部内存。\",\"take\":\"-Xms/-Xmx 调的是堆，元空间和直接内存另计。\",\"core\":true},{\"cat\":\"memory\",\"id\":\"stack\",\"title\":\"Java 虚拟机栈\",\"sub\":\"栈帧 / 局部变量 / 操作数栈\",\"what\":\"每个线程有自己的栈；调用方法创建栈帧，递归过深会 StackOverflowError。\",\"take\":\"局部变量引用在栈帧，不代表引用指向的对象也在栈里。\",\"core\":true},{\"cat\":\"memory\",\"id\":\"pc\",\"title\":\"程序计数器\",\"sub\":\"每线程独立字节码位置\",\"what\":\"记录当前线程执行到哪条字节码指令，便于各线程分别维护执行现场。\",\"take\":\"它不能替代操作系统保存的全部 CPU 上下文。\",\"core\":false},{\"cat\":\"memory\",\"id\":\"methodarea\",\"title\":\"方法区（规范）\",\"sub\":\"类级别信息 / 运行时常量池\",\"what\":\"方法区是 JVM 规范中的逻辑概念，内容包括类结构、方法字节码与运行时常量池等。\",\"take\":\"方法区 ≠ 一个确定的物理内存块 ≠ 元空间的全部。\",\"core\":true},{\"cat\":\"memory\",\"id\":\"metaspace\",\"title\":\"元空间（实现）\",\"sub\":\"HotSpot JDK 8+ / 本地内存\",\"what\":\"HotSpot 用本地内存中的元空间存储类元数据；频繁动态生成类或类加载器泄漏可造成 Metaspace OOM。\",\"take\":\"Class 镜像对象、静态字段等还涉及 Java 堆。\",\"core\":true},{\"cat\":\"memory\",\"id\":\"string\",\"title\":\"字符串对象 / 常量池\",\"sub\":\"String / intern / 堆\",\"what\":\"JDK 7+ 的驻留 String 对象通常在堆；运行时常量池与字符串常量池不是同一回事。\",\"take\":\"相同字面量共享驻留对象。new String(\\\"abc\\\") 成功求值后会得到身份不同的实例。\",\"core\":false},{\"cat\":\"memory\",\"id\":\"intern\",\"title\":\"String.intern()\",\"sub\":\"返回驻留字符串引用\",\"what\":\"intern() 返回字符串池中内容相同的规范化字符串引用；与 new String 的新实例相区别。\",\"take\":\"用对象身份问题联系字符串常量池。\",\"core\":false},{\"cat\":\"memory\",\"id\":\"direct\",\"title\":\"直接内存 / NIO\",\"sub\":\"堆外分配 / DirectByteBuffer\",\"what\":\"直接内存不是规范中的运行时数据区；NIO 可用来降低部分 IO 中间拷贝开销。\",\"take\":\"堆没满但进程内存高，要怀疑它。\",\"core\":true},{\"cat\":\"memory\",\"id\":\"refs\",\"title\":\"强、软、弱、虚引用\",\"sub\":\"引用强度影响回收\",\"what\":\"强引用对象一般不会被 GC 当垃圾；软、弱、虚引用有不同回收与通知语义。\",\"take\":\"WeakReference 与 ThreadLocalMap 的弱键仅是一个常见应用。\",\"core\":false},{\"cat\":\"memory\",\"id\":\"oom\",\"title\":\"内存溢出类型\",\"sub\":\"Heap / Metaspace / Direct / Stack\",\"what\":\"OOM 不是只有 Java heap space；还有元空间、直接内存、无法创建本地线程等。\",\"take\":\"先区分哪里耗尽，再决定看堆还是 Native Memory。\",\"core\":true},{\"cat\":\"object\",\"id\":\"newobj\",\"title\":\"new 对象的流程\",\"sub\":\"类检查→分配→零值→对象头→构造\",\"what\":\"类准备好以后，为对象申请空间、设置初值/对象头并执行构造逻辑；对象通常在 Java 堆。\",\"take\":\"对象创建依赖类加载，也产生分配速率与 GC 压力。\",\"core\":true},{\"cat\":\"object\",\"id\":\"tlab\",\"title\":\"TLAB 线程分配缓冲\",\"sub\":\"线程私有的堆内分配区\",\"what\":\"线程可以在 Java 堆内的 TLAB 中用指针碰撞快速分配对象，减少竞争。缓冲区来源随垃圾收集器而变。\",\"take\":\"G1 的 TLAB 通常来自 Eden Region。TLAB 仍属于 Java 堆。\",\"core\":false},{\"cat\":\"object\",\"id\":\"escape\",\"title\":\"逃逸分析 / 标量替换\",\"sub\":\"对象未逃逸可优化\",\"what\":\"JIT 可判断对象是否逃出方法/线程，并通过标量替换等消除实际分配。\",\"take\":\"“对象一定在栈上”不是逃逸分析的正确结论。\",\"core\":false},{\"cat\":\"object\",\"id\":\"lifetime\",\"title\":\"对象生命周期\",\"sub\":\"创建→使用→不可达→回收\",\"what\":\"对象什么时候被回收，由 GC Roots 可达性及 GC 执行决定，并非方法结束后立刻回收。\",\"take\":\"连接分配、引用关系、可达性分析。\",\"core\":true},{\"cat\":\"object\",\"id\":\"generation\",\"title\":\"新生代 / 老年代\",\"sub\":\"Eden / Survivor / Old\",\"what\":\"分代收集基于多数对象朝生夕灭；G1 用 Region 实现逻辑新老代，不能生搬硬套连续布局。\",\"take\":\"JDK 24+ ZGC 同样采用分代模式。\",\"core\":true},{\"cat\":\"object\",\"id\":\"promotion\",\"title\":\"对象晋升老年代\",\"sub\":\"年龄 / Survivor / 空间\",\"what\":\"年轻代对象经历回收后可进入 Survivor，达到年龄或空间条件时晋升到老年代。\",\"take\":\"晋升失败、老年代压力可影响 GC。\",\"core\":false},{\"cat\":\"object\",\"id\":\"humongous\",\"title\":\"大对象 Humongous\",\"sub\":\"G1 超过半个 Region\",\"what\":\"G1 中超过单个 Region 一半大小的对象通常使用连续 Humongous Region，可能带来空间压力。\",\"take\":\"大对象不总是“直接进老年代”，要看 GC。\",\"core\":false},{\"cat\":\"object\",\"id\":\"crossrefs\",\"title\":\"跨代 / 跨区引用\",\"sub\":\"Old → Young\",\"what\":\"老年代对象引用年轻代对象，Young GC 就必须考虑这些外部引用。\",\"take\":\"由此引出 RSet、卡表与写屏障。\",\"core\":true},{\"cat\":\"theory\",\"id\":\"gcroots\",\"title\":\"GC Roots\",\"sub\":\"判活的起点集合\",\"what\":\"栈中的活动引用、静态字段、JNI 等可作为可达性分析起点，具体取决于 JVM 运行状态。\",\"take\":\"根是“引用起点”，不同于 G1 根区域扫描。\",\"core\":true},{\"cat\":\"theory\",\"id\":\"reachable\",\"title\":\"可达性分析\",\"sub\":\"从根沿对象引用图遍历\",\"what\":\"从 GC Roots 出发，沿引用链能找到的对象视为存活；无法到达的对象可能被回收。\",\"take\":\"G1、ZGC 等追踪式 GC 都离不开它。\",\"core\":true},{\"cat\":\"theory\",\"id\":\"mark\",\"title\":\"标记存活 / 三色抽象\",\"sub\":\"白 / 灰 / 黑\",\"what\":\"标记阶段通过遍历对象图分辨已扫描、待扫描与未标记对象；并发修改引用会带来正确性问题。\",\"take\":\"从这里深化到 SATB、写屏障及重新标记。\",\"core\":true},{\"cat\":\"theory\",\"id\":\"sweep\",\"title\":\"标记-清除\",\"sub\":\"标记垃圾 / 清空块\",\"what\":\"标记后直接清理不可达对象，简单但容易产生空间碎片；CMS 以此为主要回收思路。\",\"take\":\"了解缺点才能理解为什么需要整理/复制。\",\"core\":false},{\"cat\":\"theory\",\"id\":\"copy\",\"title\":\"标记-复制 / 对象转移\",\"sub\":\"搬运存活对象、释放原空间\",\"what\":\"将存活对象转移到其他空间并更新引用；适合年轻代，G1 和 ZGC 都涉及对象转移。\",\"take\":\"共用抽象 ≠ 完全相同的移动实现。\",\"core\":true},{\"cat\":\"theory\",\"id\":\"compact\",\"title\":\"标记-整理\",\"sub\":\"压缩存活对象、消除碎片\",\"what\":\"移动存活对象以获得更连续的可用空间；常用于老年代与退化回收。\",\"take\":\"整理与并发转移都要处理引用更新。\",\"core\":false},{\"cat\":\"theory\",\"id\":\"safepoint\",\"title\":\"安全点 / 安全区域\",\"sub\":\"协调 STW 和根扫描\",\"what\":\"JVM 需要在可获得可靠根信息的位置协调线程暂停等操作；安全点不等于每行代码都能停。\",\"take\":\"理解停顿发生在什么时刻。\",\"core\":false},{\"cat\":\"theory\",\"id\":\"stw\",\"title\":\"STW 暂停业务线程\",\"sub\":\"应用线程暂停\",\"what\":\"Young/Mixed 等停顿可能包括扫描、对象移动和引用更新；ZGC 也有短暂停顿。\",\"take\":\"低停顿不等于零 STW。\",\"core\":true},{\"cat\":\"theory\",\"id\":\"concurrent\",\"title\":\"并发标记\",\"sub\":\"GC 与业务同时运行\",\"what\":\"GC 尽量与业务并发地标记存活对象，降低集中停顿，但必须解决引用变化引发的一致性问题。\",\"take\":\"G1、ZGC 均采用并发标记理念。\",\"core\":true},{\"cat\":\"theory\",\"id\":\"satb\",\"title\":\"SATB 原始快照\",\"sub\":\"G1 保守维持起始可达集\",\"what\":\"G1 通过写前屏障保存必要的旧引用，避免并发标记过程漏标，可能形成浮动垃圾。\",\"take\":\"SATB 是 G1 的机制，不要直接断言 ZGC 也用相同算法。\",\"core\":false},{\"cat\":\"theory\",\"id\":\"prebarrier\",\"title\":\"写前屏障\",\"sub\":\"覆盖前记录旧引用\",\"what\":\"G1 在并发标记期间通过写前屏障记录需要保留的旧引用，以支持 SATB。\",\"take\":\"从“并发标记怎么防漏标”继续追问。\",\"core\":false},{\"cat\":\"theory\",\"id\":\"cardtable\",\"title\":\"卡表 Card Table\",\"sub\":\"追踪被修改的卡页\",\"what\":\"将堆内存分为 Card；引用写入会标记相关 Card，供 GC 后续处理跨区域引用。\",\"take\":\"Card 不是对象，也不是 Region。\",\"core\":false},{\"cat\":\"theory\",\"id\":\"rset\",\"title\":\"RSet 记忆集\",\"sub\":\"定位收集集外部引用\",\"what\":\"G1 利用 RSet 跟踪从收集集外部指向待回收区域的引用，避免 Young GC 每次扫描整个老年代。\",\"take\":\"RSet 是跨区引用索引，与根区域扫描不同。\",\"core\":true},{\"cat\":\"theory\",\"id\":\"rootregions\",\"title\":\"根区域扫描\",\"sub\":\"Survivor → Old\",\"what\":\"G1 初始标记后扫描 Survivor 中指向老年代的引用，为并发标记提供起点；要求在下一次 Young GC 前完成。\",\"take\":\"根区域不是 GC Roots。\",\"core\":false},{\"cat\":\"theory\",\"id\":\"barrier\",\"title\":\"引用屏障（总称）\",\"sub\":\"读/写引用时附加 GC 逻辑\",\"what\":\"写屏障、加载屏障服务不同目标；G1 多用写前/写后屏障，ZGC 结合染色指针和加载屏障等。\",\"take\":\"两个收集器都用屏障，但作用和实现不同。\",\"core\":true},{\"cat\":\"collect\",\"id\":\"gctypes\",\"title\":\"Young / Mixed / Full\",\"sub\":\"回收范围与目标不同\",\"what\":\"Young 主要回收年轻代；G1 Mixed 回收年轻代+选中老年代；Full 往往涉及全堆，名称和实现依 GC 而异。\",\"take\":\"Mixed 不是 Full；并发标记也不是 Mixed GC。\",\"core\":true},{\"cat\":\"collect\",\"id\":\"serial\",\"title\":\"Serial\",\"sub\":\"串行回收 / STW\",\"what\":\"单 GC 工作线程，额外开销小，适用于部分小堆或受限环境。\",\"take\":\"与 Parallel 的区别先看工作线程数。\",\"core\":false},{\"cat\":\"collect\",\"id\":\"parallel\",\"title\":\"Parallel\",\"sub\":\"并行 STW / 吞吐量\",\"what\":\"多个 GC 线程并行完成回收阶段，追求总体吞吐量；STW 并未消失。\",\"take\":\"并行是 GC 线程一起干活，并发是和业务同时干活。\",\"core\":false},{\"cat\":\"collect\",\"id\":\"cms\",\"title\":\"CMS（旧版）\",\"sub\":\"并发标记清除 / 碎片\",\"what\":\"以降低停顿为目标，主要采用标记清除，易碎片化；JDK 14 已移除。\",\"take\":\"历史对比对象，不是现代默认推荐。\",\"core\":false},{\"cat\":\"collect\",\"id\":\"g1\",\"title\":\"G1 收集器\",\"sub\":\"Region / 吞吐与停顿平衡\",\"what\":\"G1 的 Young 和 Mixed 回收在 STW 中转移对象，同时通过并发标记、RSet 等减少停顿成本。\",\"take\":\"重点：Region、收集集、SATB、RSet、Mixed GC。\",\"core\":true},{\"cat\":\"collect\",\"id\":\"region\",\"title\":\"G1 Region / CSet\",\"sub\":\"分区 + 选择待回收区\",\"what\":\"堆划分成等大小 Region；CSet 由本次选定的待回收 Region 组成，可按停顿目标选取。\",\"take\":\"高垃圾比例只是收益因素之一。\",\"core\":true},{\"cat\":\"collect\",\"id\":\"younggc\",\"title\":\"Young GC\",\"sub\":\"回收 Eden/Survivor\",\"what\":\"G1 Young GC 暂停业务，将存活对象复制到新 Region，回收年轻代空间。\",\"take\":\"为什么不用扫整个老年代？→ RSet。\",\"core\":false},{\"cat\":\"collect\",\"id\":\"g1cycle\",\"title\":\"G1 并发标记周期\",\"sub\":\"初始→根区→并发→Remark→Cleanup\",\"what\":\"G1 在 young-only 周期中启动并发标记，为后续 Mixed GC 判断老年代回收价值。\",\"take\":\"Young GC 在并发标记期间仍可发生。\",\"core\":true},{\"cat\":\"collect\",\"id\":\"mixed\",\"title\":\"Mixed GC\",\"sub\":\"年轻代 + 部分老年代\",\"what\":\"G1 根据老年代 Region 的回收收益选择部分 Region，联合年轻代执行 STW 对象转移。\",\"take\":\"它不是全堆回收。\",\"core\":false},{\"cat\":\"collect\",\"id\":\"fullgc\",\"title\":\"Full GC / 退化\",\"sub\":\"全堆回收 / 长停顿风险\",\"what\":\"当正常增量回收难以释放空间时，G1 可能退化到 STW 全堆压缩回收。\",\"take\":\"频繁 Full GC 常需查内存增长、存活率与分配压力。\",\"core\":false},{\"cat\":\"collect\",\"id\":\"zgc\",\"title\":\"ZGC（现代分代）\",\"sub\":\"低延迟 / 并发转移\",\"what\":\"ZGC 也追踪可达对象并转移对象，但其大部分标记和转移可与业务并发进行；JDK 24 起仅分代模式。\",\"take\":\"与 G1 共享判活/移动思想，停顿实现不同。\",\"core\":true},{\"cat\":\"collect\",\"id\":\"colored\",\"title\":\"染色指针\",\"sub\":\"引用中携带 GC 元信息\",\"what\":\"ZGC 在引用里编码 GC 所需的标记或重定位状态，辅助屏障做正确处理。\",\"take\":\"不是普通 Java 引用随意可见的“颜色字段”。\",\"core\":false},{\"cat\":\"collect\",\"id\":\"loadbarrier\",\"title\":\"加载屏障\",\"sub\":\"访问引用时检查/修复\",\"what\":\"ZGC 可在访问对象引用时检查和处理状态，协调并发转移期间的正确引用访问。\",\"take\":\"ZGC 也可能使用写屏障，不能说只有加载屏障。\",\"core\":false},{\"cat\":\"collect\",\"id\":\"concmove\",\"title\":\"并发对象转移\",\"sub\":\"GC 搬对象时业务继续运行\",\"what\":\"ZGC 利用屏障和元数据协调对象位置变化，减少长时间 STW 的需要。\",\"take\":\"与 G1 的 STW evacuation 形成关键对比。\",\"core\":true},{\"cat\":\"collect\",\"id\":\"pause\",\"title\":\"吞吐量 vs 尾延迟\",\"sub\":\"业务约束决定选型\",\"what\":\"Parallel 重吞吐量；G1 追求平衡；ZGC 聚焦低延迟。堆大小、分配速率、CPU 也影响最终结果。\",\"take\":\"低停顿目标不是每次 GC 的硬性承诺。\",\"core\":false},{\"cat\":\"ops\",\"id\":\"gclog\",\"title\":\"GC 日志\",\"sub\":\"频率 / 停顿 / 回收前后内存\",\"what\":\"-Xlog:gc* 等日志可检查分配速率、Young/Mixed/Full 次数及停顿异常。\",\"take\":\"第一步先有数据，不能凭感觉调 -Xmx。\",\"core\":true},{\"cat\":\"ops\",\"id\":\"jcmd\",\"title\":\"jcmd / jstat\",\"sub\":\"JVM 运行状态 / GC 统计\",\"what\":\"jcmd、jstat 能查看堆、GC、类等相关信息；工具支持项依 JDK 版本变化。\",\"take\":\"先确认进程和 GC 活动，再抓取更重的证据。\",\"core\":false},{\"cat\":\"ops\",\"id\":\"jstack\",\"title\":\"线程栈 / CPU 飙高\",\"sub\":\"jstack / top -H\",\"what\":\"线程占 CPU 高时找出热线程并结合栈帧定位循环、锁竞争或 GC 线程行为。\",\"take\":\"高 CPU 未必是 GC。\",\"core\":true},{\"cat\":\"ops\",\"id\":\"heapdump\",\"title\":\"Heap Dump\",\"sub\":\"保留对象关系快照\",\"what\":\"通过 jcmd 等方式导出堆快照，看到对象实例和引用关系，为内存泄漏定位提供证据。\",\"take\":\"Dump 可能较大，要注意生产环境开销。\",\"core\":false},{\"cat\":\"ops\",\"id\":\"mat\",\"title\":\"MAT 泄漏分析\",\"sub\":\"Dominator Tree / Retained Heap\",\"what\":\"通过支配树和保留大小找出哪些对象或集合一直持有大量对象，以及到 GC Roots 的路径。\",\"take\":\"对象占用大不等于泄漏；还要判断是否不合理地被保留。\",\"core\":true},{\"cat\":\"ops\",\"id\":\"jfr\",\"title\":\"JFR / 火焰图\",\"sub\":\"分配热点 / CPU / 锁\",\"what\":\"通过 JFR 等运行时记录分析分配、CPU、锁和 GC 行为，补足单纯堆快照的盲点。\",\"take\":\"搭配日志对比调优前后吞吐和 P99。\",\"core\":false},{\"cat\":\"ops\",\"id\":\"gcfreq\",\"title\":\"频繁 Young / Full GC\",\"sub\":\"分配快 / 存活多 / 堆紧张\",\"what\":\"GC 频繁需区分短命对象分配过快、老年代增长或不合理堆配置，再用证据定位。\",\"take\":\"引出 GC 日志 → 直方图/Dump → 代码修复。\",\"core\":true},{\"cat\":\"ops\",\"id\":\"oomheap\",\"title\":\"Java heap space / 泄漏\",\"sub\":\"对象太多 vs 一直被持有\",\"what\":\"内存泄漏指不再需要的对象仍被引用；OOM 是无法满足新的内存申请，两者不是同义词。\",\"take\":\"看 Retained Heap 和 GC Roots 链，判断谁在持有。\",\"core\":false},{\"cat\":\"ops\",\"id\":\"nativehigh\",\"title\":\"堆未满进程仍很大\",\"sub\":\"元空间/直接内存/线程栈\",\"what\":\"RSS 高但 Java 堆占用正常，需查 Native Memory、线程数量、直接缓冲区和 Code Cache。\",\"take\":\"-Xmx 只限制堆，不限制进程全部内存。\",\"core\":false},{\"cat\":\"ops\",\"id\":\"tuning\",\"title\":\"JVM 调优闭环\",\"sub\":\"现象→指标→根因→优化→验证\",\"what\":\"先确认问题和约束，再收集日志/堆快照/线程栈，优先修代码和容量问题，最后评估参数。\",\"take\":\"没有业务 SLO 和基线就很难判断调优是否成功。\",\"core\":true}],\"edges\":[{\"a\":\"source\",\"b\":\"loading\",\"kind\":\"主线\",\"why\":\"有字节码 JVM 才能加载类型\"},{\"a\":\"loading\",\"b\":\"ar e-link\" href=\"${originalUrl()}\" target=\"_blank\" rel=\"noopener\">↗ 阅读小林 coding 原章节\u003c/a>`;\n document.querySelectorAll('[data-related]').forEach(el=>el.onclick=()=>selectNode(el.dataset.related,true));}\nfunction selectNode(id,zoom){selected=id;let vis=groupNodes();if(!vis.some(n=>n.id===id)){route='all';expanded=true;makeRoutes()}drawGraph();showDetail();if(zoom)focusOn(id);window.scrollTo({top:document.querySelector('.workspace').getBoundingClientRect().top+window.scrollY-12,behavior:'smooth'})}\nfunction makeQuestions(){const needle=document.getElementById('qsearch').value.trim().toLowerCase();const groups=['memory','load','theory','ops'];let qCount=0;document.getElementById('qgroups').innerHTML=groups.map(g=>{let filtered=DATA.questions.map((q,i)=>({...q,idx:i})).filter(q=>q.cat===g&&(q.q.toLowerCase().includes(needle)||byId.get(q.node).title.toLowerCase().includes(needle)));qCount+=filtered.length;return `\u003cdiv class=\"qgroup\">\u003cdiv class=\"qhead\">${chapterName(g)} \u003cspan class=\"qcount\">${filtered.length} 题\u003c/span>\u003c/div>\u003cdiv class=\"qlist\">${filtered.map(q=>`\u003cbutton class=\"question-item\" data-qnode=\"${q.node}\">\u003cb>${String(q.idx+1).padStart(2,'0')}\u003c/b>${esc(q.q)}\u003c/button>`).join('')||'\u003cdiv class=\"empty\">无匹配问题\u003c/div>'}\u003c/div>\u003c/div>`}).join('');document.querySelectorAll('[data-qnode]').forEach(el=>el.onclick=()=>selectNode(el.dataset.qnode,true))}\nfunction zoomFromCenter(scale){\n const box=svg.getBoundingClientRect();\n const w=Math.max(260,Math.min(4400,view.w*scale));\n const h=w*(box.height||620)/(box.width||1000);\n view={x:view.x+(view.w-w)/2,y:view.y+(view.h-h)/2,w,h};\n setView();\n}\nsvg.addEventListener('pointerdown',e=>{if(e.button!==0)return;if(e.target.closest?.('.svg-node,.svg-edge'))return;isDragging=true;suppressClick=false;dragStart={x:e.clientX,y:e.clientY,ox:view.x,oy:view.y};svg.setPointerCapture(e.pointerId);svg.classList.add('dragging')});\nsvg.addEventListener('pointermove',e=>{if(!isDragging||!dragStart)return;let dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y;if(Math.abs(dx)+Math.abs(dy)>5)suppressClick=true;view.x=dragStart.ox-dx*view.w/(svg.clientWidth||1);view.y=dragStart.oy-dy*view.h/(svg.clientHeight||1);setView()});\nsvg.addEventListener('pointerup',e=>{isDragging=false;dragStart=null;svg.classList.remove('dragging');setTimeout(()=>suppressClick=false,90)});svg.addEventListener('pointercancel',()=>{isDragging=false;dragStart=null});\ndocument.getElementById('zoomIn').onclick=()=>zoomFromCenter(.8);\ndocument.getElementById('zoomOut').onclick=()=>zoomFromCenter(1.25);\ndocument.getElementById('fitBtn').onclick=fitGraph;\ndocument.getElementById('resetBtn').onclick=()=>{route='all';selected='g1';makeRoutes();drawGraph();fitGraph();showDetail()};\ndocument.getElementById('expandBtn').onclick=()=>{expanded=!expanded;document.getElementById('expandBtn').textContent=expanded?'－ 收起次级知识点':'＋ 展开全部知识点';document.getElementById('expandBtn').classList.toggle('active',expanded);drawGraph();fitGraph()};\ndocument.getElementById('qsearch').addEventListener('input',makeQuestions);\nfunction focusCategory(cat){expanded=true;document.getElementById('expandBtn').textContent='－ 收起次级知识点';document.getElementById('expandBtn').classList.add('active');route='all';makeRoutes();drawGraph();const idx=DATA.cats.findIndex(c=>c.id===cat);const b=svg.getBoundingClientRect();const w=770,h=w*(b.height||620)/(b.width||1000);view={x:50+idx*361-175,y:100,w,h};setView();selected=DATA.nodes.find(n=>n.cat===cat&&n.core)?.id||selected;drawGraph();showDetail()}\ndocument.getElementById('catnav').innerHTML=DATA.cats.map(c=>`\u003cbutton style=\"border-left:3px solid ${c.color}\" data-category=\"${c.id}\">${esc(c.label.replace(/^\\d+ · /,''))}\u003c/button>`).join('');document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>focusCategory(b.dataset.category));\nwindow.addEventListener('resize',()=>setView());makeRoutes();drawGraph();showDetail();makeQuestions();requestAnimationFrame(()=>fitGraph());\n\u003c/script>\n\u003cdiv id=\"studyOverlay\" class=\"study-overlay\" hidden>\n  \u003cdiv class=\"study-sheet\" role=\"dialog\" aria-modal=\"true\" aria-label=\"JVM 面试题完整答案库\">\n    \u003cdiv class=\"study-top\">\u003cdiv>\u003csmall>JVM · INTERACTIVE STUDY LIBRARY\u003c/small>\u003ch2>60 道 JVM 面试题 · 逐题完整解答\u003c/h2>\u003c/div>\n      \u003cdiv class=\"study-toptools\">\u003cselect id=\"mobileJump\" class=\"mobile-jump\" aria-label=\"跳转到任意面试题\">\u003c/select>\u003cbutton id=\"openMapFromStudy\">返回知识关联图\u003c/button>\u003cbutton class=\"close-study\" id=\"closeStudy\" aria-label=\"关闭答案\">×\u003c/button>\u003c/div>\u003c/div>\n    \u003cdiv class=\"study-layout\">\u003caside class=\"study-rail\">\u003cdiv class=\"study-progress\">\u003cstrong id=\"studyProgressText\">学习进度 0/60\u003c/strong>\u003cp>已学标记保存在当前浏览器，随时可以从上次的位置继续。\u003c/p>\u003cdiv class=\"progressline\" style=\"width:100%\">\u003cspan id=\"studyProgressFill\" style=\"width:0\">\u003c/span>\u003c/div>\u003cinput id=\"studyFilter\" type=\"search\" placeholder=\"搜索 60 道题、答案或关键字\" autocomplete=\"off\" />\u003c/div>\u003cdiv id=\"studyRailNav\" class=\"study-rail-nav\">\u003c/div>\u003c/aside>\u003carticle id=\"studyArticle\" class=\"study-article\" tabindex=\"-1\">\u003c/article>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\nconst BANK=[{\"short\":\"JVM 运行时数据区按规范分为堆、方法区、虚拟机栈、本地方法栈和程序计数器；“JVM 内存模型”在这里通常指运行时数据区。\",\"details\":[\"堆与方法区由线程共享；每个线程都有自己的虚拟机栈、本地方法栈和程序计数器，彼此作用不同。\",\"堆主要保存对象实例；方法区保存类级别结构及运行时常量池等；虚拟机栈由方法调用形成栈帧，包含局部变量表、操作数栈等。\",\"HotSpot JDK 8+ 的类元数据主要在本地内存的 Metaspace，方法区是规范概念，不能等同于一块名叫“元空间”的全部物理内存。\"],\"example\":\"例如 new User() 通常在堆中分配实例，User 类元数据在元空间，方法中的局部引用在栈帧。\",\"pitfall\":\"“堆 + 栈 + 元空间 = JVM 全部内存”不对；还有线程、直接内存、Code Cache 等进程内存开销。\",\"interview\":\"JVM 运行时数据区按规范分为堆、方法区、虚拟机栈、本地方法栈和程序计数器；“JVM 内存模型”在这里通常指运行时数据区。 堆与方法区由线程共享；每个线程都有自己的虚拟机栈、本地方法栈和程序计数器，彼此作用不同。；堆主要保存对象实例；方法区保存类级别结构及运行时常量池等；虚拟机栈由方法调用形成栈帧，包含局部变量表、操作数栈等。；HotSpot JDK 8+ 的类元数据主要在本地内存的 Metaspace，方法区是规范概念，不能等同于一块名叫“元空间”的全部物理内存。\",\"code\":null},{\"short\":\"JVM 内存结构描述“数据放在哪里”；JMM（Java Memory Model）规定“线程怎样安全地读写共享变量”。\",\"details\":[\"运行时数据区包含堆、栈、方法区等，用来解释对象分配、栈帧和 OOM。\",\"JMM 规定线程间的可见性、有序性及 happens-before 关系，涉及 volatile、synchronized、final 等语义。\",\"JMM 中抽象的主内存、工作内存不是 HotSpot 堆、虚拟机栈的逐一对应物；实现还受 CPU 缓存、编译重排序等影响。\"],\"example\":\"两个线程读写共享 int flag，是否能及时看到变化是 JMM 问题；flag 所属对象在哪里是运行时数据区问题。\",\"pitfall\":\"不要将 JMM 的“工作内存”直接画为每个线程的 JVM 虚拟机栈。\",\"interview\":\"JVM 内存结构描述“数据放在哪里”；JMM（Java Memory Model）规定“线程怎样安全地读写共享变量”。 运行时数据区包含堆、栈、方法区等，用来解释对象分配、栈帧和 OOM。；JMM 规定线程间的可见性、有序性及 happens-before 关系，涉及 volatile、synchronized、final 等语义。；JMM 中抽象的主内存、工作内存不是 HotSpot 堆、虚拟机栈的逐一对应物；实现还受 CPU 缓存、编译重排序等影响。\",\"code\":null},{\"short\":\"堆存放大多数 Java 对象；栈主要存储每次方法调用的执行现场，二者在共享性、生命周期和常见错误上不同。\",\"details\":[\"堆线程共享，主要由垃圾回收器管理；局部变量持有的引用可指向堆里的同一对象。\",\"虚拟机栈每线程一份，方法调用时压入栈帧，返回时弹出；栈帧包含局部变量表、操作数栈等。\",\"堆不足可能报 Java heap space；递归过深可能报 StackOverflowError；线程过多也可能耗尽本地内存。\"],\"example\":\"void f(){ User u=new User(); }：u 是局部引用，User 实例一般在堆中；f 返回后实例未必立即被 GC。\",\"pitfall\":\"“对象一定存堆、基本类型一定存栈”是错误的绝对说法：字段可以是对象内部一部分，JIT 还可能消除分配。\",\"interview\":\"堆存放大多数 Java 对象；栈主要存储每次方法调用的执行现场，二者在共享性、生命周期和常见错误上不同。 堆线程共享，主要由垃圾回收器管理；局部变量持有的引用可指向堆里的同一对象。；虚拟机栈每线程一份，方法调用时压入栈帧，返回时弹出；栈帧包含局部变量表、操作数栈等。；堆不足可能报 Java heap space；递归过深可能报 StackOverflowError；线程过多也可能耗尽本地内存。\",\"code\":null},{\"short\":\"局部变量表中保存的是 Java 引用值，不是对象本体；“指针”只是实现层面的便于理解的说法。\",\"details\":[\"Java 语言层面的引用是一种类型，语义上能定位对象，但规范没有要求一定用裸机器地址表示。\",\"对象实例通常在堆；局部引用可能在栈帧的局部变量表中，JIT 优化后也可能进入寄存器。\",\"对象字段若是引用字段，引用值则随着对象一起存在堆中；静态字段又由类关联结构管理。\"],\"example\":\"User u=new User(); 中 u 不是 User 对象，它保存用于访问 User 实例的引用。\",\"pitfall\":\"不要回答“栈保存全部对象”或“Java 引用必定是 64 位物理地址”。\",\"interview\":\"局部变量表中保存的是 Java 引用值，不是对象本体；“指针”只是实现层面的便于理解的说法。 Java 语言层面的引用是一种类型，语义上能定位对象，但规范没有要求一定用裸机器地址表示。；对象实例通常在堆；局部引用可能在栈帧的局部变量表中，JIT 优化后也可能进入寄存器。；对象字段若是引用字段，引用值则随着对象一起存在堆中；静态字段又由类关联结构管理。\",\"code\":null},{\"short\":\"按经典分代思路，堆分为年轻代与老年代；年轻代常用 Eden、Survivor 0、Survivor 1 描述。\",\"details\":[\"大多数对象朝生夕灭，年轻代回收频繁；老年代容纳长期存活或提前晋升的对象。\",\"经典分代收集器使用相对连续的年轻代/老年代布局，G1 则把堆划成 Region，各区域动态承担 Eden、Survivor、Old 角色。\",\"新一代分代 ZGC 也区分代际，但内部布局和回收方式与 G1 不相同；不能把经典 8:1:1 比例当作所有 GC 的规则。\"],\"example\":\"G1 中若某个 Region 当前是 Eden，它回收后可重新被用作其他角色，不是永久固定的 Eden 区。\",\"pitfall\":\"Young/Old 是逻辑代际概念；Region 与新老代不是并列的不同内存。\",\"interview\":\"按经典分代思路，堆分为年轻代与老年代；年轻代常用 Eden、Survivor 0、Survivor 1 描述。 大多数对象朝生夕灭，年轻代回收频繁；老年代容纳长期存活或提前晋升的对象。；经典分代收集器使用相对连续的年轻代/老年代布局，G1 则把堆划成 Region，各区域动态承担 Eden、Survivor、Old 角色。；新一代分代 ZGC 也区分代际，但内部布局和回收方式与 G1 不相同；不能把经典 8:1:1 比例当作所有 GC 的规则。\",\"code\":null},{\"short\":\"大对象分配位置取决于所用收集器和 JVM 版本；G1 会采用 Humongous Region 机制。\",\"details\":[\"在 G1 中，对象大小超过单个 Region 容量的一半时通常被视为 Humongous 对象，需要占用一个或多个连续的 Humongous Region。\",\"大对象容易影响内存碎片、Region 使用效率和 GC 触发；其他垃圾回收器的大对象分配策略不一样。\",\"排查大对象问题，应结合 GC 日志、对象分配分析和堆快照，而不是先断言“大对象一定进入老年代”。\"],\"example\":\"G1 Region 为 4 MiB 时，一个 3 MiB 的 byte[] 通常属于 Humongous 对象。\",\"pitfall\":\"“所有大对象直接进 Old”不是通用规则；大小阈值、分配规则均依实现而变。\",\"interview\":\"大对象分配位置取决于所用收集器和 JVM 版本；G1 会采用 Humongous Region 机制。 在 G1 中，对象大小超过单个 Region 容量的一半时通常被视为 Humongous 对象，需要占用一个或多个连续的 Humongous Region。；大对象容易影响内存碎片、Region 使用效率和 GC 触发；其他垃圾回收器的大对象分配策略不一样。；排查大对象问题，应结合 GC 日志、对象分配分析和堆快照，而不是先断言“大对象一定进入老年代”。\",\"code\":null},{\"short\":\"程序计数器（PC）保存本线程当前执行的字节码指令位置，因此每个线程必须独立拥有一个。\",\"details\":[\"线程切换后需要知道从哪条字节码继续，彼此的执行位置不同，所以程序计数器线程私有。\",\"执行 Java 方法时可记录字节码指令地址；若执行本地 Native 方法，JVM 规范将其值定义为未定义。\",\"JVM 规范没有规定该区域出现 OutOfMemoryError 的情况。\"],\"example\":\"线程 A 在调用 foo()，线程 B 在执行 bar()，两者都需要保留自己的逻辑执行位置。\",\"pitfall\":\"PC 不等于 Java 虚拟机栈，也不等于操作系统保存的全部 CPU 寄存器上下文。\",\"interview\":\"程序计数器（PC）保存本线程当前执行的字节码指令位置，因此每个线程必须独立拥有一个。 线程切换后需要知道从哪条字节码继续，彼此的执行位置不同，所以程序计数器线程私有。；执行 Java 方法时可记录字节码指令地址；若执行本地 Native 方法，JVM 规范将其值定义为未定义。；JVM 规范没有规定该区域出现 OutOfMemoryError 的情况。\",\"code\":null},{\"short\":\"方法区保存的是方法的类级别元数据/字节码等信息，真正执行方法要靠线程的栈帧、解释器或 JIT 编译后的机器码。\",\"details\":[\"类加载后，方法签名、修饰符、字节码及相关元数据进入 JVM 管理的类信息结构。\",\"调用方法时当前线程创建栈帧，利用局部变量表和操作数栈执行指令；返回时栈帧弹出。\",\"热点方法可能被 JIT 编译为机器码，机器码进入代码缓存 Code Cache；方法不会“在元空间内跑起来”。\"],\"example\":\"foo(int x) 的方法元数据和 foo() 的一次调用栈帧是两回事：一个和类有关，一个和线程当次调用有关。\",\"pitfall\":\"不要说方法代码和局部变量都保存在方法区。\",\"interview\":\"方法区保存的是方法的类级别元数据/字节码等信息，真正执行方法要靠线程的栈帧、解释器或 JIT 编译后的机器码。 类加载后，方法签名、修饰符、字节码及相关元数据进入 JVM 管理的类信息结构。；调用方法时当前线程创建栈帧，利用局部变量表和操作数栈执行指令；返回时栈帧弹出。；热点方法可能被 JIT 编译为机器码，机器码进入代码缓存 Code Cache；方法不会“在元空间内跑起来”。\",\"code\":null},{\"short\":\"方法区是 JVM 规范中的逻辑区域，包含类结构、方法信息、字段信息、运行时常量池等。\",\"details\":[\"类被加载后，JVM 需要保存类名、父类、接口、字段、方法定义及其字节码等类型相关信息。\",\"运行时常量池是类相关的常量信息；字符串常量池的 String 实例在现代 HotSpot 中通常位于堆，二者不要混为一谈。\",\"在 HotSpot JDK 8+ 中类元数据主要使用 Metaspace；java.lang.Class 镜像对象通常在堆中。\"],\"example\":\"一个 User 类生成两万个实例，只需要其定义类加载器的一套 User 类型元数据，但堆中通常有两万个实例。\",\"pitfall\":\"方法区不等于元空间的所有内存；“静态变量一定在元空间”也不严谨。\",\"interview\":\"方法区是 JVM 规范中的逻辑区域，包含类结构、方法信息、字段信息、运行时常量池等。 类被加载后，JVM 需要保存类名、父类、接口、字段、方法定义及其字节码等类型相关信息。；运行时常量池是类相关的常量信息；字符串常量池的 String 实例在现代 HotSpot 中通常位于堆，二者不要混为一谈。；在 HotSpot JDK 8+ 中类元数据主要使用 Metaspace；java.lang.Class 镜像对象通常在堆中。\",\"code\":null},{\"short\":\"永久代是旧 HotSpot 的方法区实现；JDK 8 使用本地内存元空间存储类元数据，改善容量管理，但仍可能 OOM。\",\"details\":[\"PermGen 往往受相对固定的大小限制，动态代理、框架大量生成类时易触顶；元空间按需向本地内存申请。\",\"元空间默认可增长但受机器内存、进程限制和 JVM 参数限制，仍可能出现 OutOfMemoryError: Metaspace。\",\"常用 -XX:MaxMetaspaceSize 限制最大容量；-XX:MetaspaceSize 更偏向初始触发 GC 的阈值，不是保留的固定大小。\"],\"example\":\"应用频繁创建新的自定义 ClassLoader 且长期保留，相关类无法卸载，元空间持续增长。\",\"pitfall\":\"元空间使用本地内存 ≠ 无限大；元空间不是 Java Heap。\",\"interview\":\"永久代是旧 HotSpot 的方法区实现；JDK 8 使用本地内存元空间存储类元数据，改善容量管理，但仍可能 OOM。 PermGen 往往受相对固定的大小限制，动态代理、框架大量生成类时易触顶；元空间按需向本地内存申请。；元空间默认可增长但受机器内存、进程限制和 JVM 参数限制，仍可能出现 OutOfMemoryError: Metaspace。；常用 -XX:MaxMetaspaceSize 限制最大容量；-XX:MetaspaceSize 更偏向初始触发 GC 的阈值，不是保留的固定大小。\",\"code\":\"-XX:MetaspaceSize=128m\\n-XX:MaxMetaspaceSize=256m\"},{\"short\":\"现代 HotSpot 的 String 实例和驻留字符串对象都位于 Java 堆。相同内容的字符串字面量引用同一个驻留 String 实例。\",\"details\":[\"JDK 9 起，HotSpot 的 String 实现通常使用 byte[] 和编码标志保存内容。旧版本的内部布局不同。\",\"字符串字面量 \\\"abc\\\" 和求值为同一内容的字符串常量表达式，会引用同一个驻留实例。这项语言保证不以出现在同一个类中为前提。\",\"类文件常量池记录常量描述，运行时常量池属于类或接口的运行时数据，字符串池则提供驻留 String 的规范引用。\"],\"example\":\"String a = \\\"abc\\\", b = \\\"abc\\\"。比较 a == b 的结果为 true。\",\"pitfall\":\"“String 一定在方法区”不对；不能用旧版本 char[] 内部布局解释所有现代 JDK。\",\"interview\":\"现代 HotSpot 中，String 对象和驻留字符串都在堆中。相同内容的字符串字面量按语言规范共享一个 String 实例。类文件常量池、运行时常量池与字符串池分别负责不同层次的数据。\",\"code\":null},{\"short\":\"表达式 new String(\\\"abc\\\") 得到一个新的 String 实例，字面量 \\\"abc\\\" 引用驻留实例。局部变量 s 保存新实例的引用。\",\"details\":[\"字面量 \\\"abc\\\" 引用驻留 String。每次成功求值 new String(\\\"abc\\\") 都产生一个在语言语义上不同的 String 实例。\",\"在现代 HotSpot 中，String 对象位于 Java 堆，局部变量 s 在虚拟机的抽象执行模型中保存的是引用。\",\"驻留实例可能早已存在。JIT 也可以在保留可观察语义的前提下消除实际分配，因此不要把表达式等同于固定的物理分配次数。\"],\"example\":\"在 String s = new String(\\\"abc\\\") 成功执行后，s == \\\"abc\\\" 为 false，s.equals(\\\"abc\\\") 为 true。\",\"pitfall\":\"“new String() 每次一定创建两个对象”不准确；字面量可能早已驻留。\",\"interview\":\"字面量引用驻留对象，new 表达式成功求值后得到一个身份不同的新 String。两者内容相等，但引用不同。字符串池已有实例和 JIT 优化都可能影响实际分配次数。\",\"code\":\"String s = new String(\\\"abc\\\");\\nSystem.out.println(s == \\\"abc\\\"); // false\\nSystem.out.println(s.equals(\\\"abc\\\")); // true\"},{\"short\":\"String.intern() 返回字符串池中内容相等的规范化 String 引用，可用于说明“内容相等”和“引用相同”的差别。\",\"details\":[\"如果池中已有按 equals 比较相等的 String，intern() 返回池中的引用。否则将当前 String 实例加入池，并返回它的引用。\",\"equals 比较字符内容，== 比较引用身份。相同内容的字面量与 intern() 的返回值指向同一驻留实例。\",\"大量动态字符串都调用 intern() 可能增加字符串池的管理开销，是否使用应结合重复率和实际测量。\"],\"example\":\"String a = new String(\\\"hi\\\")。a.intern() == \\\"hi\\\" 为 true。\",\"pitfall\":\"intern() 不会把原变量自动改成池中引用，需要使用返回值。\",\"interview\":\"intern() 让相同内容的字符串共享规范引用。已有等值实例时返回池中的实例，否则将当前实例加入池并返回它。调用方要使用返回值，原变量的引用不会被重新赋值。\",\"code\":\"String a = new String(\\\"hi\\\");\\nString b = a.intern();\\nSystem.out.println(b == \\\"hi\\\"); // true\"},{\"short\":\"Java 主要有强引用、软引用、弱引用、虚引用，不同强度决定垃圾回收器如何处理被引用对象。\",\"details\":[\"强引用（普通 new 得到的引用）仍可达时一般不会回收；软引用常用于内存敏感缓存，但回收时机不适合作严格缓存保证。\",\"弱引用的对象在仅弱可达时可被 GC 清理；虚引用 get() 始终返回 null，主要配合 ReferenceQueue 跟踪回收事件/资源管理。\",\"引用强度的语义和对象实际何时被收集不同；GC 可能延后执行，不能凭引用类型保证精确回收时间。\"],\"example\":\"WeakHashMap 的键采用弱引用；若没有其他强引用持有键，条目可能随 GC 被清理。\",\"pitfall\":\"不要说“弱引用在赋 null 以后马上回收”，也不要用软引用保证永不 OOM。\",\"interview\":\"Java 主要有强引用、软引用、弱引用、虚引用，不同强度决定垃圾回收器如何处理被引用对象。 强引用（普通 new 得到的引用）仍可达时一般不会回收；软引用常用于内存敏感缓存，但回收时机不适合作严格缓存保证。；弱引用的对象在仅弱可达时可被 GC 清理；虚引用 get() 始终返回 null，主要配合 ReferenceQueue 跟踪回收事件/资源管理。；引用强度的语义和对象实际何时被收集不同；GC 可能延后执行，不能凭引用类型保证精确回收时间。\",\"code\":null},{\"short\":\"弱引用适合不想阻止某个对象回收的场景，例如 WeakHashMap 的键、某些元数据映射。\",\"details\":[\"WeakReference\\u003cT> 的 referent 若只剩弱引用，则下一次相关 GC 可以将其清除。\",\"ThreadLocalMap 的 Entry 键采用弱引用，但 value 仍可能通过 Thread → ThreadLocalMap → Entry 强可达，线程池中尤其应 remove()。\",\"弱引用并不是自动消灭所有内存泄漏，需要弄清楚完整 GC Roots 引用链。\"],\"example\":\"在线程池中用完 ThreadLocal 后 finally { local.remove(); }，避免值长时间留在工作线程里。\",\"pitfall\":\"ThreadLocal 的值不在“线程虚拟机栈”，Thread 对象及相关 Map 通常在 Java 堆。\",\"interview\":\"弱引用适合不想阻止某个对象回收的场景，例如 WeakHashMap 的键、某些元数据映射。 WeakReference\\u003cT> 的 referent 若只剩弱引用，则下一次相关 GC 可以将其清除。；ThreadLocalMap 的 Entry 键采用弱引用，但 value 仍可能通过 Thread → ThreadLocalMap → Entry 强可达，线程池中尤其应 remove()。；弱引用并不是自动消灭所有内存泄漏，需要弄清楚完整 GC Roots 引用链。\",\"code\":\"try { local.set(context); work(); }\\nfinally { local.remove(); }\"},{\"short\":\"直接内存是 Java 堆外的内存，不属于 JVM 规范的五类运行时数据区；NIO 常用它保存直接缓冲区内容。\",\"details\":[\"ByteBuffer.allocateDirect() 通常使用堆外本地内存存储字节，配合 DirectByteBuffer 这样的堆内包装对象。\",\"直接缓冲区可减少部分 IO 路径的额外数据拷贝或提高与本地系统交互效率，但申请、释放开销往往高于普通堆缓冲区。\",\"堆使用率低也可能因 DirectByteBuffer、native 分配或线程栈造成进程 RSS 很高；需检查 -XX:MaxDirectMemorySize 及 NMT/JFR 等。\"],\"example\":\"大量未及时释放的 allocateDirect 可能出现 Direct buffer memory 错误，而不是 Java heap space。\",\"pitfall\":\"“直接内存完全不归 JVM 管”不准确，JVM/NIO 会跟踪和协调某些直接缓冲区的释放。\",\"interview\":\"直接内存是 Java 堆外的内存，不属于 JVM 规范的五类运行时数据区；NIO 常用它保存直接缓冲区内容。 ByteBuffer.allocateDirect() 通常使用堆外本地内存存储字节，配合 DirectByteBuffer 这样的堆内包装对象。；直接缓冲区可减少部分 IO 路径的额外数据拷贝或提高与本地系统交互效率，但申请、释放开销往往高于普通堆缓冲区。；堆使用率低也可能因 DirectByteBuffer、native 分配或线程栈造成进程 RSS 很高；需检查 -XX:MaxDirectMemorySize 及 NMT/JFR 等。\",\"code\":\"ByteBuffer b = ByteBuffer.allocateDirect(1024 * 1024);\"},{\"short\":\"内存泄漏是对象或资源已经不需要却仍被引用；内存溢出是分配请求无法满足，二者有关但不是同义词。\",\"details\":[\"Java 的典型泄漏不是“忘记 free”，而是长生命周期对象意外持有短生命周期对象，比如 static Map、监听器、ThreadLocal 值。\",\"OOM 可能由泄漏、正常业务需求超出容量、瞬时峰值、堆外或线程资源不足等多种原因造成。\",\"排查应识别哪一类 OOM、观察使用趋势、借助堆快照和 GC Roots 链确认谁在持有对象，最后回到代码修复。\"],\"example\":\"static List\\u003cObject> cache 无上限地添加对象并永不删除，既可能构成泄漏，也可能最终触发 heap space OOM。\",\"pitfall\":\"一次 OOM 并不能证明存在泄漏；短时间合法的大量数据也可能超出堆容量。\",\"interview\":\"内存泄漏是对象或资源已经不需要却仍被引用；内存溢出是分配请求无法满足，二者有关但不是同义词。 Java 的典型泄漏不是“忘记 free”，而是长生命周期对象意外持有短生命周期对象，比如 static Map、监听器、ThreadLocal 值。；OOM 可能由泄漏、正常业务需求超出容量、瞬时峰值、堆外或线程资源不足等多种原因造成。；排查应识别哪一类 OOM、观察使用趋势、借助堆快照和 GC Roots 链确认谁在持有对象，最后回到代码修复。\",\"code\":null},{\"short\":\"不同 JVM 内存资源耗尽可能触发不同错误：Heap、Metaspace、直接内存、线程栈/线程创建等。\",\"details\":[\"堆对象无法分配时典型为 OutOfMemoryError: Java heap space；类元数据耗尽可能为 Metaspace OOM。\",\"直接缓冲区无法申请可见 Direct buffer memory；无限递归常先抛 StackOverflowError，并不是同一种 OOM。\",\"若本地内存不足，创建线程可能出现 unable to create native thread；应结合操作系统限制、线程数量和内存占用检查。\"],\"example\":\"异常消息是第一条线索：Heap OOM 看堆快照，Metaspace OOM 查类/类加载器，Native thread 查线程数量与栈占用。\",\"pitfall\":\"不能只把 -Xmx 调大来解决所有 Java 进程的内存错误。\",\"interview\":\"不同 JVM 内存资源耗尽可能触发不同错误：Heap、Metaspace、直接内存、线程栈/线程创建等。 堆对象无法分配时典型为 OutOfMemoryError: Java heap space；类元数据耗尽可能为 Metaspace OOM。；直接缓冲区无法申请可见 Direct buffer memory；无限递归常先抛 StackOverflowError，并不是同一种 OOM。；若本地内存不足，创建线程可能出现 unable to create native thread；应结合操作系统限制、线程数量和内存占用检查。\",\"code\":null},{\"short\":\"堆溢出排查遵循“确认异常 → 收集证据 → 找出保留者 → 修复代码/容量 → 回归验证”。\",\"details\":[\"首先确认具体异常是 Java heap space 还是 GC overhead limit exceeded 等，并读取 GC 日志判断回收后占用是否长期居高。\",\"通过 jcmd GC.heap_dump 或启动参数保存 Heap Dump，用 MAT 查看 Histogram、Dominator Tree、Retained Heap 和到 GC Roots 的路径。\",\"确认是无界集合、缓存、监听器等泄漏，还是合法的业务峰值；优先修复无界增长或减少对象保留，再结合负载调整 -Xmx。\"],\"example\":\"一个 Map 里存了百万个会话对象，MAT 显示 static Map 支配大量内存；设置过期淘汰比单纯扩大堆更根本。\",\"pitfall\":\"不要在没分析现场时直接调大堆；抓 Dump 可能暂停应用且文件很大，生产要评估风险。\",\"interview\":\"堆溢出排查遵循“确认异常 → 收集证据 → 找出保留者 → 修复代码/容量 → 回归验证”。 首先确认具体异常是 Java heap space 还是 GC overhead limit exceeded 等，并读取 GC 日志判断回收后占用是否长期居高。；通过 jcmd GC.heap_dump 或启动参数保存 Heap Dump，用 MAT 查看 Histogram、Dominator Tree、Retained Heap 和到 GC Roots 的路径。；确认是无界集合、缓存、监听器等泄漏，还是合法的业务峰值；优先修复无界增长或减少对象保留，再结合负载调整 -Xmx。\",\"code\":\"-XX:+HeapDumpOnOutOfMemoryError\\n-XX:HeapDumpPath=/var/log/app\"},{\"short\":\"栈溢出常由调用层级过深造成，尤其无限递归；还要区分栈容量不足与无法创建新线程。\",\"details\":[\"每次 Java 方法调用建立栈帧；递归无终止条件时栈帧不断增加，最终可能抛 StackOverflowError。\",\"可以通过异常栈检查重复的方法、递归终止条件和深度，必要时重写为迭代或减少单次栈帧占用。\",\"-Xss 控制线程栈大小（具体适用由 JVM/平台决定），增大栈只可能缓解深度限制，却会提高每线程内存成本。\"],\"example\":\"函数 f(){f();} 会不断调用自身，典型抛 StackOverflowError。\",\"pitfall\":\"无限递归优先修逻辑；盲目调大 -Xss 可能降低进程能承受的线程数量。\",\"interview\":\"栈溢出常由调用层级过深造成，尤其无限递归；还要区分栈容量不足与无法创建新线程。 每次 Java 方法调用建立栈帧；递归无终止条件时栈帧不断增加，最终可能抛 StackOverflowError。；可以通过异常栈检查重复的方法、递归终止条件和深度，必要时重写为迭代或减少单次栈帧占用。；-Xss 控制线程栈大小（具体适用由 JVM/平台决定），增大栈只可能缓解深度限制，却会提高每线程内存成本。\",\"code\":\"void f() { f(); } // StackOverflowError\"},{\"short\":\"典型泄漏例子包括静态集合、ThreadLocal 值、监听器/回调和类加载器引用；定位重点是“谁仍然持有它”。\",\"details\":[\"长期 static List 持有请求对象：业务已结束但列表未清理，GC Roots 经静态字段一直能到达这些对象。\",\"线程池复用导致 ThreadLocal value 残留、事件监听器未注销、类加载器被线程或静态字段引用，可能让对象或类元数据长期不能回收。\",\"使用堆快照找 Retained Heap 与 GC Roots 路径，必要时对比不同时间点快照；最后限流/过期、remove()、注销或关闭资源，并用监控验证。\"],\"example\":\"MAT 如果显示 Thread → ThreadLocalMap → value → 大对象，可以排查任务执行后未 remove()。\",\"pitfall\":\"MAT 的可疑报告只能提供线索；“大对象存在”不自动等于泄漏。\",\"interview\":\"典型泄漏例子包括静态集合、ThreadLocal 值、监听器/回调和类加载器引用；定位重点是“谁仍然持有它”。 长期 static List 持有请求对象：业务已结束但列表未清理，GC Roots 经静态字段一直能到达这些对象。；线程池复用导致 ThreadLocal value 残留、事件监听器未注销、类加载器被线程或静态字段引用，可能让对象或类元数据长期不能回收。；使用堆快照找 Retained Heap 与 GC Roots 路径，必要时对比不同时间点快照；最后限流/过期、remove()、注销或关闭资源，并用监控验证。\",\"code\":null},{\"short\":\"创建对象通常依次经过类检查、空间分配、零值初始化、对象头设置以及构造器执行，最后返回对象引用。\",\"details\":[\"执行 new 时先确认类已经完成必要的加载、链接与初始化；未完成则先执行相关类加载过程。\",\"HotSpot 一般从堆中分配内存，线程可优先从 TLAB 快速分配；对象内存先有默认零值，设置对象头后执行 \\u003cinit> 构造过程。\",\"构造器会执行实例字段初始化与构造代码；对象最终可被引用，但 JIT 可能通过逃逸分析消除某些物理分配。\"],\"example\":\"new User() 不等于“只把构造器代码跑一次”，构造之前还要保证类元数据可用并得到对象存储空间。\",\"pitfall\":\"“分配后马上执行构造，所以所有字段初始都是你指定的值”忽略了 JVM 零值初始化阶段。\",\"interview\":\"创建对象通常依次经过类检查、空间分配、零值初始化、对象头设置以及构造器执行，最后返回对象引用。 执行 new 时先确认类已经完成必要的加载、链接与初始化；未完成则先执行相关类加载过程。；HotSpot 一般从堆中分配内存，线程可优先从 TLAB 快速分配；对象内存先有默认零值，设置对象头后执行 \\u003cinit> 构造过程。；构造器会执行实例字段初始化与构造代码；对象最终可被引用，但 JIT 可能通过逃逸分析消除某些物理分配。\",\"code\":null},{\"short\":\"对象可抽象为创建、可达使用、失去必要引用、变为不可达、等待 GC、回收空间几个阶段。\",\"details\":[\"对象创建后可能先在 Eden/TLAB 分配；不断被使用时，可能经历 Young GC、Survivor 和晋升 Old。\",\"对象能否回收取决于从 GC Roots 的可达性及引用类型等，而不是简单看变量是否离开作用域。\",\"对象变为不可达并不保证马上回收；GC 何时执行由分配压力、收集器策略和运行环境决定。\"],\"example\":\"一个对象被放进 static List 后，即使创建它的方法返回，也可能一直可达，直到从 List 移除。\",\"pitfall\":\"方法结束不等于堆对象立刻消失；所谓年龄也不等于真实时间秒数。\",\"interview\":\"对象可抽象为创建、可达使用、失去必要引用、变为不可达、等待 GC、回收空间几个阶段。 对象创建后可能先在 Eden/TLAB 分配；不断被使用时，可能经历 Young GC、Survivor 和晋升 Old。；对象能否回收取决于从 GC Roots 的可达性及引用类型等，而不是简单看变量是否离开作用域。；对象变为不可达并不保证马上回收；GC 何时执行由分配压力、收集器策略和运行环境决定。\",\"code\":null},{\"short\":\"从 Java 语言的直观模型看对象通常在堆，但 JIT 逃逸分析和标量替换可能令实际对象分配被消除。\",\"details\":[\"逃逸分析判断对象引用是否会离开当前方法、线程或被无法追踪的位置保存。\",\"如果编译器能证明不需要真实对象身份和分配，就可能将对象字段拆为标量、保存在寄存器等位置。\",\"这是一项编译器优化，不意味着所有未逃逸对象都“真实存到 Java 栈”；能否触发取决于 JIT 和代码形态。\"],\"example\":\"只在方法内部计算 Point(x,y) 的两个字段，若无逃逸，JIT 可能消除 Point 实例。\",\"pitfall\":\"不要背“逃逸分析 = 栈上分配”；HotSpot 更典型的是标量替换和分配消除。\",\"interview\":\"从 Java 语言的直观模型看对象通常在堆，但 JIT 逃逸分析和标量替换可能令实际对象分配被消除。 逃逸分析判断对象引用是否会离开当前方法、线程或被无法追踪的位置保存。；如果编译器能证明不需要真实对象身份和分配，就可能将对象字段拆为标量、保存在寄存器等位置。；这是一项编译器优化，不意味着所有未逃逸对象都“真实存到 Java 栈”；能否触发取决于 JIT 和代码形态。\",\"code\":\"int sum(int x, int y) {\\n  Point p = new Point(x, y);\\n  return p.x + p.y;\\n}\"},{\"short\":\"TLAB 是 HotSpot 在 Java 堆内为线程提供的分配缓冲区。线程可在自己的缓冲区快速分配对象，具体来源由垃圾收集器决定。\",\"details\":[\"分配小对象时，线程可以在自己的 TLAB 内移动分配指针，减少对共享堆分配路径的竞争。\",\"TLAB 属于 Java 堆，分配在其中的对象仍受垃圾收集器管理。以 G1 为例，TLAB 通常来自 Eden Region。\",\"对象放不下当前 TLAB 时，可能申请新 TLAB，或转入其他分配路径。具体策略取决于收集器、对象大小和运行时设置。\"],\"example\":\"两个业务线程各自连续 new 对象时，常能在不同 TLAB 上低竞争地分配。\",\"pitfall\":\"“TLAB 是每线程一个独立堆”不对；GC 仍管理这些对象的生命周期。\",\"interview\":\"HotSpot 的 TLAB 是堆内的一段线程专用分配缓冲。对象能放下时，线程移动自己的分配指针即可完成快速分配。不同收集器的堆布局和 TLAB 来源可能不同。\",\"code\":null},{\"short\":\"常见类加载器有 Bootstrap、Platform、Application，以及用户自定义 ClassLoader。\",\"details\":[\"Bootstrap 加载 Java 核心类；Platform 主要加载平台模块；Application 加载应用类路径或模块路径中的应用类，职责以 JDK 9+ 为基准。\",\"自定义加载器可以从网络、文件或插件中定义类，实现模块隔离、热部署等；父子关系是委派关系，不是 Java 类继承关系。\",\"类的运行时身份由类全限定名和定义它的类加载器共同确定；Bootstrap 在 Java API 里常用 null 表示。\"],\"example\":\"Tomcat 的不同 Web 应用可由不同类加载器定义同名业务类，彼此不一定兼容。\",\"pitfall\":\"JDK 8 常说 Extension ClassLoader；JDK 9+ 的名称/职责已经改为 Platform ClassLoader。\",\"interview\":\"常见类加载器有 Bootstrap、Platform、Application，以及用户自定义 ClassLoader。 Bootstrap 加载 Java 核心类；Platform 主要加载平台模块；Application 加载应用类路径或模块路径中的应用类，职责以 JDK 9+ 为基准。；自定义加载器可以从网络、文件或插件中定义类，实现模块隔离、热部署等；父子关系是委派关系，不是 Java 类继承关系。；类的运行时身份由类全限定名和定义它的类加载器共同确定；Bootstrap 在 Java API 里常用 null 表示。\",\"code\":null},{\"short\":\"双亲委派是：类加载请求先交给父加载器尝试，父级无法加载时再由当前加载器查找并定义。\",\"details\":[\"loadClass 通常先检查是否已加载，再向父加载器委派；只有委派找不到才调用自身的 findClass。\",\"这样能避免核心类被普通应用随意替换，并使父级可见的共享类尽量由统一的加载器定义。\",\"双亲委派是常见策略而非所有场景强制固定；SPI 的 TCCL 和容器的特定子优先策略是常见扩展。\"],\"example\":\"AppClassLoader 加载 java.lang.String 时，会优先委派到 Bootstrap，而不是使用同名用户类。\",\"pitfall\":\"“父加载器一定能访问所有子加载器的 jar 包”不对，正常委派只有子主动向父请求。\",\"interview\":\"双亲委派是：类加载请求先交给父加载器尝试，父级无法加载时再由当前加载器查找并定义。 loadClass 通常先检查是否已加载，再向父加载器委派；只有委派找不到才调用自身的 findClass。；这样能避免核心类被普通应用随意替换，并使父级可见的共享类尽量由统一的加载器定义。；双亲委派是常见策略而非所有场景强制固定；SPI 的 TCCL 和容器的特定子优先策略是常见扩展。\",\"code\":null},{\"short\":\"双亲委派的主要价值是核心类安全性和类的一致性，而不是“整个 JVM 永远只加载一个同名类”。\",\"details\":[\"父优先使核心类使用上层统一实现，降低低层 ClassLoader 对核心 API 的替换风险。\",\"共享依赖尽可能由共同父加载器定义，可减少重复加载并保证跨模块的类型身份更一致。\",\"不同隔离加载器仍可以各自定义相同全限定名的类；这种隔离本身是容器、插件的能力。\"],\"example\":\"插件 A 和插件 B 各自定义 com.demo.Plugin，可以得到两个不兼容的 Class。\",\"pitfall\":\"双亲委派不是垃圾回收规则，也不能阻止所有类重复定义。\",\"interview\":\"双亲委派的主要价值是核心类安全性和类的一致性，而不是“整个 JVM 永远只加载一个同名类”。 父优先使核心类使用上层统一实现，降低低层 ClassLoader 对核心 API 的替换风险。；共享依赖尽可能由共同父加载器定义，可减少重复加载并保证跨模块的类型身份更一致。；不同隔离加载器仍可以各自定义相同全限定名的类；这种隔离本身是容器、插件的能力。\",\"code\":null},{\"short\":\"类或接口必须先加载、验证和准备，才能初始化。符号引用的解析可以按需延后，甚至延续到初始化之后。\",\"details\":[\"加载建立运行时类或接口。链接包括验证、准备以及解析。按 JVMS，准备阶段创建静态字段并赋默认值。\",\"解析把符号引用定位到实际的类、字段或方法。JVM 可以提前解析，也可以等到相关引用被使用时再解析。\",\"按 JVMS，静态字段的 ConstantValue 在初始化阶段赋值，早于 \\u003cclinit> 的调用。其余需要执行代码的静态初始化逻辑由 \\u003cclinit> 执行，前提是类或接口有这个方法。\"],\"example\":\"static int x = 10 在准备阶段先取默认值 0，初始化时执行赋值。带 ConstantValue 的 static final int N = 5 在初始化阶段、调用 \\u003cclinit> 前得到常量值。\",\"pitfall\":\"把验证和准备视为初始化前的必经步骤。解析允许延后。\\u003cclinit> 负责类或接口初始化，\\u003cinit> 负责实例初始化。\",\"interview\":\"类先加载，再验证和准备，之后才能初始化。符号引用可以按需解析，无须在初始化前全部完成。准备阶段把静态字段设为默认值，初始化阶段先处理 ConstantValue，再调用存在的 \\u003cclinit>。\",\"code\":null},{\"short\":\"类加载过程和双亲委派是两个维度：前者回答“加载类要经历哪些阶段”，后者回答“由谁去找并定义类”。\",\"details\":[\"加载、验证、准备、解析、初始化是 JVM 完成类型准备的逻辑步骤。\",\"双亲委派则是类加载器遇到类名时的请求路径；AppClassLoader 通常先委派父级，找不到才自己加载。\",\"SPI/TCCL 可能改变发现应用实现的查找路径，但这不改变 JVM 对新定义类仍需做验证、链接、初始化等处理。\"],\"example\":\"JDBC 的 DriverManager 可以借 TCCL 发现 MySQL 驱动；MySQL 驱动被定义后仍要走类加载生命周期。\",\"pitfall\":\"“打破双亲委派就不用验证类字节码了”是错误的。\",\"interview\":\"类加载过程和双亲委派是两个维度：前者回答“加载类要经历哪些阶段”，后者回答“由谁去找并定义类”。 加载、验证、准备、解析、初始化是 JVM 完成类型准备的逻辑步骤。；双亲委派则是类加载器遇到类名时的请求路径；AppClassLoader 通常先委派父级，找不到才自己加载。；SPI/TCCL 可能改变发现应用实现的查找路径，但这不改变 JVM 对新定义类仍需做验证、链接、初始化等处理。\",\"code\":null},{\"short\":\"首次主动使用一个尚未初始化的类时通常会触发初始化，例如 new、读写非编译时常量静态字段、调用静态方法等。\",\"details\":[\"JVM 规范列出了主动使用的典型情形：new、getstatic/putstatic、invokestatic、部分反射操作、初始化子类时父类先初始化、启动主类等。\",\"访问编译时常量可能直接内联到使用方，不触发定义该常量的类初始化；通过子类访问父类静态字段通常只初始化真正声明它的父类。\",\"类加载可以早于初始化，ClassLoader.loadClass 默认也不意味着执行 \\u003cclinit>。\"],\"example\":\"System.out.println(Const.VALUE) 若 VALUE 是编译期常量，可能不会触发 Const 的 static 初始化块。\",\"pitfall\":\"不要说“只要用到 class 字面量就一定初始化”；要区分加载、解析和主动使用。\",\"interview\":\"首次主动使用一个尚未初始化的类时通常会触发初始化，例如 new、读写非编译时常量静态字段、调用静态方法等。 JVM 规范列出了主动使用的典型情形：new、getstatic/putstatic、invokestatic、部分反射操作、初始化子类时父类先初始化、启动主类等。；访问编译时常量可能直接内联到使用方，不触发定义该常量的类初始化；通过子类访问父类静态字段通常只初始化真正声明它的父类。；类加载可以早于初始化，ClassLoader.loadClass 默认也不意味着执行 \\u003cclinit>。\",\"code\":null},{\"short\":\"类初始化具备 JVM 级同步机制：同一个类的 \\u003cclinit> 在并发情况下不会由多个线程同时执行。\",\"details\":[\"JVM 对类/接口初始化过程实施同步，一个线程执行 \\u003cclinit>，其他线程使用该类时可能等待其结束。\",\"初始化包含静态字段赋值和 static 块，执行顺序受源码顺序影响；若抛异常，该类可能进入初始化失败状态。\",\"不同类或类加载器定义的同名类是不同类型，其初始化过程彼此独立；互相等待还可能造成复杂初始化死锁。\"],\"example\":\"两个线程同时首次调用 Foo.work()，Foo 的 static 初始化通常只执行一次。\",\"pitfall\":\"初始化线程安全不意味着静态可变集合的所有后续读写都是线程安全的。\",\"interview\":\"类初始化具备 JVM 级同步机制：同一个类的 \\u003cclinit> 在并发情况下不会由多个线程同时执行。 JVM 对类/接口初始化过程实施同步，一个线程执行 \\u003cclinit>，其他线程使用该类时可能等待其结束。；初始化包含静态字段赋值和 static 块，执行顺序受源码顺序影响；若抛异常，该类可能进入初始化失败状态。；不同类或类加载器定义的同名类是不同类型，其初始化过程彼此独立；互相等待还可能造成复杂初始化死锁。\",\"code\":null},{\"short\":\"可以在特定需求下突破传统委派路径：SPI/TCCL 解决 JDK 代码找应用实现；容器子优先实现类隔离。\",\"details\":[\"JDBC、ServiceLoader 等 SPI 需要 JDK 提供的框架代码发现应用类路径中实现；通过线程上下文类加载器指定查找加载器。\",\"Tomcat 等容器可能对 WebApp 类实施有条件的子优先，防止不同应用的第三方依赖版本互相污染；核心类和容器 API 仍有保护。\",\"自定义 ClassLoader 可重写 loadClass 调整指定包的委派策略，但不意味着可以覆盖 java.* 核心类或绕过 JVM 校验。\"],\"example\":\"DriverManager 使用 SPI 机制，借 TCCL 使用应用类加载器发现 mysql-connector 的 Driver 实现。\",\"pitfall\":\"“JDBC 的驱动原来必须由 Bootstrap 加载”错误：驱动通常仍由应用类加载器定义。\",\"interview\":\"可以在特定需求下突破传统委派路径：SPI/TCCL 解决 JDK 代码找应用实现；容器子优先实现类隔离。 JDBC、ServiceLoader 等 SPI 需要 JDK 提供的框架代码发现应用类路径中实现；通过线程上下文类加载器指定查找加载器。；Tomcat 等容器可能对 WebApp 类实施有条件的子优先，防止不同应用的第三方依赖版本互相污染；核心类和容器 API 仍有保护。；自定义 ClassLoader 可重写 loadClass 调整指定包的委派策略，但不意味着可以覆盖 java.* 核心类或绕过 JVM 校验。\",\"code\":null},{\"short\":\"两个相同全限定名的类未必是同一个类；运行时类身份取决于名称与定义类加载器的组合。\",\"details\":[\"类加载器隔离意味着 PluginAClassLoader 和 PluginBClassLoader 都能定义 com.demo.User，它们的 Class 对象不同。\",\"即使结构和字节码一致，来自不同定义类加载器的对象也可能 ClassCastException；反射、代理、容器交互常遇到。\",\"共享 API 最好交给共同父加载器，插件实现由各自加载器定义；正确设计可兼顾接口兼容与隔离。\"],\"example\":\"Object a=loaderA.loadClass(\\\"demo.User\\\").getConstructor().newInstance(); 不能随意强制转成 loaderB 定义的 demo.User。\",\"pitfall\":\"“全限定名相同 = 运行时同一 Class”在多类加载器环境下不成立。\",\"interview\":\"两个相同全限定名的类未必是同一个类；运行时类身份取决于名称与定义类加载器的组合。 类加载器隔离意味着 PluginAClassLoader 和 PluginBClassLoader 都能定义 com.demo.User，它们的 Class 对象不同。；即使结构和字节码一致，来自不同定义类加载器的对象也可能 ClassCastException；反射、代理、容器交互常遇到。；共享 API 最好交给共同父加载器，插件实现由各自加载器定义；正确设计可兼顾接口兼容与隔离。\",\"code\":null},{\"short\":\"Java GC 是 JVM 自动识别不再需要的对象并回收内存的机制；触发取决于分配压力、代际占用及收集器策略。\",\"details\":[\"应用 new 对象后大多由堆统一管理；对象不可达后成为候选垃圾，但不保证立刻回收。\",\"常见触发包括年轻代分配空间不足、老年代达到并发标记阈值、分配失败或元数据回收压力等，规则依收集器不同。\",\"System.gc() 通常只是建议 JVM 进行 GC，不保证一定执行；GC 不是由 Java 程序主动逐个 free 对象。\"],\"example\":\"短命对象持续分配会增多 Young GC；G1 老年代占用上升可能触发并发标记，随后出现 Mixed GC。\",\"pitfall\":\"不要将 Young、Mixed、Full 当作所有 GC 都完全一致的固定阶段。\",\"interview\":\"Java GC 是 JVM 自动识别不再需要的对象并回收内存的机制；触发取决于分配压力、代际占用及收集器策略。 应用 new 对象后大多由堆统一管理；对象不可达后成为候选垃圾，但不保证立刻回收。；常见触发包括年轻代分配空间不足、老年代达到并发标记阈值、分配失败或元数据回收压力等，规则依收集器不同。；System.gc() 通常只是建议 JVM 进行 GC，不保证一定执行；GC 不是由 Java 程序主动逐个 free 对象。\",\"code\":null},{\"short\":\"现代 Java 主流追踪式垃圾回收依靠 GC Roots 可达性分析判断存活，而不是简单统计引用次数。\",\"details\":[\"从线程栈的活动引用、静态字段、JNI 等 GC Roots 出发，沿引用关系能到达的对象被认为是存活。\",\"不可达对象可能被回收；不同引用强度会影响软/弱/虚可达的特殊处理。\",\"单纯引用计数无法自然处理对象循环引用，例如 A 引 B、B 引 A 但外界都不再持有它们。\"],\"example\":\"A.next=B，B.next=A，且两个对象均不被 GC Roots 访问时，可达性分析仍可判定二者不可达。\",\"pitfall\":\"“两个对象互相引用就永远回收不了”不是 Java 追踪式 GC 的一般结论。\",\"interview\":\"现代 Java 主流追踪式垃圾回收依靠 GC Roots 可达性分析判断存活，而不是简单统计引用次数。 从线程栈的活动引用、静态字段、JNI 等 GC Roots 出发，沿引用关系能到达的对象被认为是存活。；不可达对象可能被回收；不同引用强度会影响软/弱/虚可达的特殊处理。；单纯引用计数无法自然处理对象循环引用，例如 A 引 B、B 引 A 但外界都不再持有它们。\",\"code\":null},{\"short\":\"垃圾回收算法解决“发现垃圾之后怎样释放空间”的问题，常见标记-清除、标记-复制、标记-整理。\",\"details\":[\"标记-清除：标记垃圾后释放不再使用的对象空间，实现简单，但可能产生碎片。\",\"标记-复制：把存活对象搬到新区域，整体释放旧区域，适合存活对象少的场景；移动和空间预留有代价。\",\"标记-整理：压缩存活对象以获得连续空间，降低碎片，但需要搬迁和修正引用；真实收集器通常混合多种机制。\"],\"example\":\"G1 选中的 Region 通常通过 evacuation 复制存活对象，CMS 则主要采用并发标记清除思路。\",\"pitfall\":\"算法不等于收集器：G1 和 ZGC 都会移动对象，但 STW 策略和屏障实现并不相同。\",\"interview\":\"垃圾回收算法解决“发现垃圾之后怎样释放空间”的问题，常见标记-清除、标记-复制、标记-整理。 标记-清除：标记垃圾后释放不再使用的对象空间，实现简单，但可能产生碎片。；标记-复制：把存活对象搬到新区域，整体释放旧区域，适合存活对象少的场景；移动和空间预留有代价。；标记-整理：压缩存活对象以获得连续空间，降低碎片，但需要搬迁和修正引用；真实收集器通常混合多种机制。\",\"code\":null},{\"short\":\"GC 机制可以按“判活 → 标记 → 回收 → 调整内存布局”的主线理解，再区分年轻代/老年代和并发/STW。\",\"details\":[\"判活主要使用可达性分析，GC Roots 决定从哪里出发；分代收集利用大部分对象生命周期较短的经验事实。\",\"STW 阶段暂停业务线程；并发阶段允许业务继续运行。并行意味着多个 GC 线程同时工作，和并发不是一回事。\",\"不同收集器组合标记清除、对象复制/整理、记忆集、写屏障等机制，例如 G1 和 ZGC。\"],\"example\":\"一次 G1 Young GC 通常 STW 并移动新生代存活对象，而 G1 并发标记阶段可与业务同时进行。\",\"pitfall\":\"“并发 GC 绝对零停顿”是错误的；部分根处理和同步阶段仍可能 STW。\",\"interview\":\"GC 机制可以按“判活 → 标记 → 回收 → 调整内存布局”的主线理解，再区分年轻代/老年代和并发/STW。 判活主要使用可达性分析，GC Roots 决定从哪里出发；分代收集利用大部分对象生命周期较短的经验事实。；STW 阶段暂停业务线程；并发阶段允许业务继续运行。并行意味着多个 GC 线程同时工作，和并发不是一回事。；不同收集器组合标记清除、对象复制/整理、记忆集、写屏障等机制，例如 G1 和 ZGC。\",\"code\":null},{\"short\":\"常见 GC 基础算法有标记-清除、复制、标记-整理，比较时关注碎片、存活对象复制成本和停顿。\",\"details\":[\"标记-清除不会主动整理剩余对象，可能留下离散的空洞；大对象需要连续空间时尤其不利。\",\"复制算法把存活对象搬到另一块区域，回收旧空间快，但需要目标空间且搬迁有成本，适合年轻代等场景。\",\"整理算法压缩存活对象并修正引用，碎片少但移动成本高；现代 G1/ZGC 都有对象转移，但执行时机不同。\"],\"example\":\"两片各空 2MB 的碎片并不一定能满足一个连续 3MB 的对象分配请求，整理可以缓解这类问题。\",\"pitfall\":\"不要将“标记-复制”理解为复制所有对象，只复制存活对象才有意义。\",\"interview\":\"常见 GC 基础算法有标记-清除、复制、标记-整理，比较时关注碎片、存活对象复制成本和停顿。 标记-清除不会主动整理剩余对象，可能留下离散的空洞；大对象需要连续空间时尤其不利。；复制算法把存活对象搬到另一块区域，回收旧空间快，但需要目标空间且搬迁有成本，适合年轻代等场景。；整理算法压缩存活对象并修正引用，碎片少但移动成本高；现代 G1/ZGC 都有对象转移，但执行时机不同。\",\"code\":null},{\"short\":\"对象晋升老年代通常与存活年龄、Survivor 空间、分配策略有关；具体阈值由 GC 实现决定。\",\"details\":[\"年轻代对象经历 GC 后仍存活，通常可进入 Survivor 并累积年龄，符合条件时晋升 Old。\",\"Survivor 空间不够、年龄分布和收集器策略可能导致提前晋升；G1 的 Region 角色和传统连续分区不同。\",\"G1 的 Humongous 对象有特殊分配方式，不应简单套用“所有对象先 Eden 再按固定年龄晋升”的模型。\"],\"example\":\"对象年龄较大或 Survivor 容量紧张，Young GC 时可能直接复制到 Old Region。\",\"pitfall\":\"“一定经过 15 次 GC 才会晋升”不成立：参数、实际阈值、年龄分布和收集器都会改变行为。\",\"interview\":\"对象晋升老年代通常与存活年龄、Survivor 空间、分配策略有关；具体阈值由 GC 实现决定。 年轻代对象经历 GC 后仍存活，通常可进入 Survivor 并累积年龄，符合条件时晋升 Old。；Survivor 空间不够、年龄分布和收集器策略可能导致提前晋升；G1 的 Region 角色和传统连续分区不同。；G1 的 Humongous 对象有特殊分配方式，不应简单套用“所有对象先 Eden 再按固定年龄晋升”的模型。\",\"code\":null},{\"short\":\"HotSpot 常见收集器包括 Serial、Parallel、旧 CMS、G1、ZGC、Shenandoah；各自侧重不同目标。\",\"details\":[\"Serial 使用少量/单个 GC 工作线程，额外开销小；Parallel 多线程 STW，重吞吐量。\",\"CMS 以减少停顿为目标，采用并发标记清除思路，可能碎片化，JDK 14 已移除；G1 用 Region 和 STW evacuation 平衡暂停与吞吐。\",\"ZGC 通过并发标记与并发转移等技术追求极低延迟，现代 ZGC 已分代；Shenandoah 也关注低延迟。\"],\"example\":\"普通服务先观察 G1 默认表现；业务要求极低 P99 时可评估 ZGC，必须用真实负载测量 CPU、吞吐和停顿。\",\"pitfall\":\"CMS 已不是现代 JDK 的可选 GC；不要说 ZGC 一定不分代。\",\"interview\":\"HotSpot 常见收集器包括 Serial、Parallel、旧 CMS、G1、ZGC、Shenandoah；各自侧重不同目标。 Serial 使用少量/单个 GC 工作线程，额外开销小；Parallel 多线程 STW，重吞吐量。；CMS 以减少停顿为目标，采用并发标记清除思路，可能碎片化，JDK 14 已移除；G1 用 Region 和 STW evacuation 平衡暂停与吞吐。；ZGC 通过并发标记与并发转移等技术追求极低延迟，现代 ZGC 已分代；Shenandoah 也关注低延迟。\",\"code\":null},{\"short\":\"标记-清除的主要问题是内存碎片及可能的分配效率下降；它并不自动压缩存活对象。\",\"details\":[\"清除死亡对象后，堆中可能留下许多不连续的空闲块，虽然总剩余容量不少，单块却不足以放下大对象。\",\"碎片可能令后续分配变复杂、触发额外回收或压缩，从而出现长时间暂停。\",\"标记-整理或复制存活对象能减少碎片，但也要承担移动对象和更新引用的成本；算法是不同取舍。\"],\"example\":\"有空洞 1MB、1MB、1MB，申请连续 2MB 时可能仍失败；整理后空闲区连贯更容易分配。\",\"pitfall\":\"“标记清除速度一定比其他算法慢”不是普适结论；要看活跃对象占比和工作负载。\",\"interview\":\"标记-清除的主要问题是内存碎片及可能的分配效率下降；它并不自动压缩存活对象。 清除死亡对象后，堆中可能留下许多不连续的空闲块，虽然总剩余容量不少，单块却不足以放下大对象。；碎片可能令后续分配变复杂、触发额外回收或压缩，从而出现长时间暂停。；标记-整理或复制存活对象能减少碎片，但也要承担移动对象和更新引用的成本；算法是不同取舍。\",\"code\":null},{\"short\":\"是否 STW 与收集器和具体阶段有关；G1 Young/Mixed 的对象转移是 STW，G1 并发标记的主体不是。\",\"details\":[\"需要稳定扫描根、同步线程状态或迁移并修正引用时，很多 GC 会安排短暂或较长的 STW 阶段。\",\"G1 Initial Mark 通常搭配 Young GC 暂停，Remark 有 STW，Cleanup 包含暂停工作；并发标记主体能与应用一起运行。\",\"ZGC 的大部分标记/对象转移是并发，但并不等于完全零 STW；Full GC 也不等于所有 GC 都一定采用同一算法。\"],\"example\":\"Young GC = 可能暂停；并发标记 = 多数时间不暂停；Remark = 需要停顿完成剩余标记工作。\",\"pitfall\":\"“并行”不是“并发”；多 GC 线程同时 STW 回收仍属于并行而非并发业务执行。\",\"interview\":\"是否 STW 与收集器和具体阶段有关；G1 Young/Mixed 的对象转移是 STW，G1 并发标记的主体不是。 需要稳定扫描根、同步线程状态或迁移并修正引用时，很多 GC 会安排短暂或较长的 STW 阶段。；G1 Initial Mark 通常搭配 Young GC 暂停，Remark 有 STW，Cleanup 包含暂停工作；并发标记主体能与应用一起运行。；ZGC 的大部分标记/对象转移是并发，但并不等于完全零 STW；Full GC 也不等于所有 GC 都一定采用同一算法。\",\"code\":null},{\"short\":\"安全点是 JVM 能以可靠方式获取线程执行状态和 GC 根信息的协作位置，用于安全地协调线程暂停。\",\"details\":[\"JVM 不能随意在任意机器指令处暂停并假定所有对象引用都可被准确识别，需要在合适的位置保存/描述引用信息。\",\"方法调用、循环回边等常有安全点检查；安全区域用于某些暂时不执行 Java 字节码的线程等情况。\",\"线程到达安全点或安全区域后，JVM 才能可靠地实施某些 STW 操作，部分线程长时间不配合可能导致“到达安全点耗时”增加。\"],\"example\":\"GC 日志显示暂停前的 safepoint 同步时间很长，可能需要检查线程是否运行长时间不可中断的代码段。\",\"pitfall\":\"安全点不是“对象将被回收的点”，也不是每行 Java 代码都有一个安全点。\",\"interview\":\"安全点是 JVM 能以可靠方式获取线程执行状态和 GC 根信息的协作位置，用于安全地协调线程暂停。 JVM 不能随意在任意机器指令处暂停并假定所有对象引用都可被准确识别，需要在合适的位置保存/描述引用信息。；方法调用、循环回边等常有安全点检查；安全区域用于某些暂时不执行 Java 字节码的线程等情况。；线程到达安全点或安全区域后，JVM 才能可靠地实施某些 STW 操作，部分线程长时间不配合可能导致“到达安全点耗时”增加。\",\"code\":null},{\"short\":\"Minor/Young GC 主要回收年轻代，Major GC 常被用于老年代回收但术语不统一，Full GC 通常意味着全堆层面的完整回收。\",\"details\":[\"Young/Minor 常由年轻代分配压力引发；G1 Mixed 不等于 Major 或 Full，而是年轻代 + 选中老年代 Region。\",\"Full GC 的触发可能来自分配失败、晋升/空间不足、退化回收，或某些显式请求与收集器配置。\",\"GC 名称的日志显示与具体机制依收集器而不同；不要以为 Old 区被回收一点就叫 Full GC。\"],\"example\":\"G1 日志中的 Pause Young (Mixed) 是 Mixed GC，不代表发生一次整个堆的 Full GC。\",\"pitfall\":\"“Major GC 必然等于 Full GC”不严谨，最好在回答中说明所讨论的 JVM/GC。\",\"interview\":\"Minor/Young GC 主要回收年轻代，Major GC 常被用于老年代回收但术语不统一，Full GC 通常意味着全堆层面的完整回收。 Young/Minor 常由年轻代分配压力引发；G1 Mixed 不等于 Major 或 Full，而是年轻代 + 选中老年代 Region。；Full GC 的触发可能来自分配失败、晋升/空间不足、退化回收，或某些显式请求与收集器配置。；GC 名称的日志显示与具体机制依收集器而不同；不要以为 Old 区被回收一点就叫 Full GC。\",\"code\":null},{\"short\":\"CMS 和 G1 都希望降低停顿，但 CMS 主要并发标记清除，G1 用 Region + evacuation 来减少碎片并控制暂停工作量。\",\"details\":[\"CMS 在老年代采用并发标记清除，缺点包括浮动垃圾、空间碎片和并发模式失败后可能较长停顿。\",\"G1 将堆分为 Region，通过并发标记筛选有价值的老年代 Region，Young/Mixed GC 则在 STW 下搬移存活对象。\",\"G1 的 RSet 辅助处理跨区引用，SATB 支持并发标记；G1 也有停顿和开销，并非一切场景吞吐都更好。\"],\"example\":\"CMS 回收后 Old 可能剩很多空洞；G1 移走存活对象后可整体腾出被回收的 Region。\",\"pitfall\":\"CMS 从 JDK 14 起已移除，现代 JDK 的“选 CMS 还是 G1”是历史题。\",\"interview\":\"CMS 和 G1 都希望降低停顿，但 CMS 主要并发标记清除，G1 用 Region + evacuation 来减少碎片并控制暂停工作量。 CMS 在老年代采用并发标记清除，缺点包括浮动垃圾、空间碎片和并发模式失败后可能较长停顿。；G1 将堆分为 Region，通过并发标记筛选有价值的老年代 Region，Young/Mixed GC 则在 STW 下搬移存活对象。；G1 的 RSet 辅助处理跨区引用，SATB 支持并发标记；G1 也有停顿和开销，并非一切场景吞吐都更好。\",\"code\":null},{\"short\":\"在旧 JDK 环境下 CMS 更偏低停顿，但现代 HotSpot 中应优先评估 G1 或 ZGC，而不是选择已移除的 CMS。\",\"details\":[\"CMS 主要为早期对暂停敏感的老年代场景设计，但会带来内存碎片和退化风险。\",\"G1 通过 Region、混合回收和暂停预测，兼顾年轻代与老年代，通常适合作为现代服务的默认基线。\",\"超低延迟需求可评估 ZGC；真实选型需要对比 P99/P999、吞吐量、CPU 使用、堆容量、GC 频率等指标。\"],\"example\":\"JDK 8 老服务历史上可能使用 CMS；迁移到新 JDK 后要核实参数是否已经失效或拒绝启动。\",\"pitfall\":\"CMS 的适用场景是版本相关知识；不要在 JDK 17/21+ 的新部署中推荐配置 UseConcMarkSweepGC。\",\"interview\":\"在旧 JDK 环境下 CMS 更偏低停顿，但现代 HotSpot 中应优先评估 G1 或 ZGC，而不是选择已移除的 CMS。 CMS 主要为早期对暂停敏感的老年代场景设计，但会带来内存碎片和退化风险。；G1 通过 Region、混合回收和暂停预测，兼顾年轻代与老年代，通常适合作为现代服务的默认基线。；超低延迟需求可评估 ZGC；真实选型需要对比 P99/P999、吞吐量、CPU 使用、堆容量、GC 频率等指标。\",\"code\":null},{\"short\":\"G1 特色是 Region 分区、分代收集、可预测停顿目标、并发标记、RSet 与复制整理。\",\"details\":[\"整个堆分为等大小 Region，Eden、Survivor、Old 是动态的逻辑角色，降低固定连续分代布局的限制。\",\"Young GC 回收年轻代；并发标记计算老年代存活情况；随后 Mixed GC 选择部分 Old Region 与年轻代一起回收。\",\"G1 用 RSet/写屏障处理外部引用，标记阶段使用 SATB；对象转移主要在 STW 完成，MaxGCPauseMillis 仅是软目标。\"],\"example\":\"设置 -XX:MaxGCPauseMillis=200 意味着希望平均停顿控制在目标附近，不保证每次暂停都 ≤ 200ms。\",\"pitfall\":\"Region 垃圾比例越高通常回收收益越好，但还要考虑存活对象移动成本和时间预算。\",\"interview\":\"G1 特色是 Region 分区、分代收集、可预测停顿目标、并发标记、RSet 与复制整理。 整个堆分为等大小 Region，Eden、Survivor、Old 是动态的逻辑角色，降低固定连续分代布局的限制。；Young GC 回收年轻代；并发标记计算老年代存活情况；随后 Mixed GC 选择部分 Old Region 与年轻代一起回收。；G1 用 RSet/写屏障处理外部引用，标记阶段使用 SATB；对象转移主要在 STW 完成，MaxGCPauseMillis 仅是软目标。\",\"code\":null},{\"short\":\"G1 常先运行 Young GC；老年代压力达到条件后进入并发标记周期；标记完成后可能多次 Mixed GC。\",\"details\":[\"Young GC 在 STW 下回收 Eden/Survivor，并将存活对象复制到 Survivor 或 Old。\",\"某次 Concurrent Start Young GC 启动标记；根区域扫描（Survivor→Old）、并发标记、Remark、Cleanup 分别承担起点补充、追踪与候选区统计。\",\"并发标记期间仍能穿插 Young GC；随后若回收收益足够，Mixed GC 多次回收年轻代加部分老年代，而非一次清空整个 Old。\"],\"example\":\"G1 可在 Old 占用达到 IHOP 相关阈值时启动并发标记，标记完成后再安排老年代增量回收。\",\"pitfall\":\"并发标记 ≠ Mixed GC：前者主要分析存活/收益，后者真正执行选中 Region 的回收。\",\"interview\":\"G1 常先运行 Young GC；老年代压力达到条件后进入并发标记周期；标记完成后可能多次 Mixed GC。 Young GC 在 STW 下回收 Eden/Survivor，并将存活对象复制到 Survivor 或 Old。；某次 Concurrent Start Young GC 启动标记；根区域扫描（Survivor→Old）、并发标记、Remark、Cleanup 分别承担起点补充、追踪与候选区统计。；并发标记期间仍能穿插 Young GC；随后若回收收益足够，Mixed GC 多次回收年轻代加部分老年代，而非一次清空整个 Old。\",\"code\":null},{\"short\":\"Young GC 不必每次扫描整个老年代，因为 G1 利用 Remembered Set 定位从收集集外部指向年轻代的引用。\",\"details\":[\"假设老年代对象 A 引用 Eden 中 B；B 虽不在 GC Roots 直接引用里，但仍可能存活，必须处理这种跨区/跨代引用。\",\"G1 通过写屏障、Card Table/脏卡处理等维护跨 Region 引用信息，RSet 通常定位到可能包含相关引用的卡页位置。\",\"Young GC 把 RSet 提供的外部引用作为扫描线索，结合其他根与引用遍历确认存活对象，而不是完整扫描所有 Old 对象。\"],\"example\":\"Old 中 A.friend=B，Young GC 会通过 RSet 等信息找到 A→B，让 B 被正确保留。\",\"pitfall\":\"根区域扫描关注 Survivor→Old 的并发标记入口，不等于 Young GC 使用 RSet 查 Old→Young。\",\"interview\":\"Young GC 不必每次扫描整个老年代，因为 G1 利用 Remembered Set 定位从收集集外部指向年轻代的引用。 假设老年代对象 A 引用 Eden 中 B；B 虽不在 GC Roots 直接引用里，但仍可能存活，必须处理这种跨区/跨代引用。；G1 通过写屏障、Card Table/脏卡处理等维护跨 Region 引用信息，RSet 通常定位到可能包含相关引用的卡页位置。；Young GC 把 RSet 提供的外部引用作为扫描线索，结合其他根与引用遍历确认存活对象，而不是完整扫描所有 Old 对象。\",\"code\":null},{\"short\":\"G1 使用 SATB 原始快照、写前屏障以及 Remark，避免业务线程改引用造成并发标记漏标。\",\"details\":[\"三色抽象：黑已扫描、灰已发现未扫描、白还未标记；若业务把灰→白的边删除，又将白对象挂到已扫描的黑对象上，GC 可能漏掉它。\",\"SATB 保守维持标记开始时可达对象的存活性；写前屏障在满足条件时记录被覆盖的旧引用到缓冲区。\",\"GC 处理 SATB 信息，Remark STW 完成本轮剩余标记；代价是一些已失去引用的对象可能暂时作为浮动垃圾保留到下轮。\"],\"example\":\"B.next=C 改为 B.next=null 时，SATB 可记录旧值 C，避免它因引用删除而从本轮标记中消失。\",\"pitfall\":\"SATB 不是复制完整堆快照，也不是简单地只检查新引用；G1 的 RSet 写后屏障解决的是另一类问题。\",\"interview\":\"G1 使用 SATB 原始快照、写前屏障以及 Remark，避免业务线程改引用造成并发标记漏标。 三色抽象：黑已扫描、灰已发现未扫描、白还未标记；若业务把灰→白的边删除，又将白对象挂到已扫描的黑对象上，GC 可能漏掉它。；SATB 保守维持标记开始时可达对象的存活性；写前屏障在满足条件时记录被覆盖的旧引用到缓冲区。；GC 处理 SATB 信息，Remark STW 完成本轮剩余标记；代价是一些已失去引用的对象可能暂时作为浮动垃圾保留到下轮。\",\"code\":null},{\"short\":\"G1 偏向吞吐与停顿均衡，ZGC 偏向极低停顿；二者共享可达性、对象转移等抽象原理，但搬迁机制不同。\",\"details\":[\"G1 使用 Region/CSet，Young/Mixed GC 在 STW 下复制存活对象，并通过 RSet、SATB 等减少暂停工作。\",\"ZGC 大量标记和对象转移与业务并发，借助染色指针、加载/写屏障等机制保持引用正确；仍有短 STW，且可能增加并发 CPU/空间开销。\",\"现代 ZGC 已是分代的：JDK 21 引入分代 ZGC、JDK 23 成为默认 ZGC 模式，JDK 24 移除非分代实现。\"],\"example\":\"同样都要判断“谁存活”和搬移对象：G1 主要停下来搬，ZGC 设计成尽量边运行边搬。\",\"pitfall\":\"不能说 ZGC 不需要标记或不移动对象，也不能保证 ZGC 的实际业务吞吐一定低于 G1。\",\"interview\":\"G1 偏向吞吐与停顿均衡，ZGC 偏向极低停顿；二者共享可达性、对象转移等抽象原理，但搬迁机制不同。 G1 使用 Region/CSet，Young/Mixed GC 在 STW 下复制存活对象，并通过 RSet、SATB 等减少暂停工作。；ZGC 大量标记和对象转移与业务并发，借助染色指针、加载/写屏障等机制保持引用正确；仍有短 STW，且可能增加并发 CPU/空间开销。；现代 ZGC 已是分代的：JDK 21 引入分代 ZGC、JDK 23 成为默认 ZGC 模式，JDK 24 移除非分代实现。\",\"code\":null},{\"short\":\"GC 主要管理 Java 堆对象，但某些 GC 周期也会触发类卸载、引用处理、元空间回收等相关工作。\",\"details\":[\"堆中的普通 Java 对象是 GC 的主要回收对象；方法区逻辑数据中的类元数据若满足类卸载条件，HotSpot 可释放相关元空间。\",\"DirectByteBuffer 对象本身在堆中，关联的 native 内存可能借 Cleaner/引用处理配合释放，但本地内存不是“GC 直接扫描的 Java 堆”。\",\"线程栈和 Code Cache 的生命周期及释放机制与堆对象 GC 不完全相同，应按各自内存资源诊断。\"],\"example\":\"类加载器没有可达引用且它定义的类可卸载时，相关元空间可能释放；不是把整个元空间当 Eden 复制。\",\"pitfall\":\"“GC 只和堆有关，Metaspace 永不回收”不对；“GC 直接管理所有本地内存”也不对。\",\"interview\":\"GC 主要管理 Java 堆对象，但某些 GC 周期也会触发类卸载、引用处理、元空间回收等相关工作。 堆中的普通 Java 对象是 GC 的主要回收对象；方法区逻辑数据中的类元数据若满足类卸载条件，HotSpot 可释放相关元空间。；DirectByteBuffer 对象本身在堆中，关联的 native 内存可能借 Cleaner/引用处理配合释放，但本地内存不是“GC 直接扫描的 Java 堆”。；线程栈和 Code Cache 的生命周期及释放机制与堆对象 GC 不完全相同，应按各自内存资源诊断。\",\"code\":null},{\"short\":\"解释器保证字节码能快速开始执行；JIT 将热点方法/循环编译为机器码，以换取后续更高执行性能。\",\"details\":[\"解释器逐条执行字节码，启动成本小、对冷代码友好；只靠解释执行，热点循环重复解析的成本较高。\",\"JIT 依据运行剖析信息执行热点编译、方法内联、逃逸分析、标量替换等优化，产出的机器码存于 Code Cache。\",\"JIT 编译本身消耗 CPU 和内存，优化也可能基于假设而去优化（deoptimization），所以采用解释器+编译器混合执行。\"],\"example\":\"一个只执行一次的初始化方法可能解释执行；调用百万次的业务热点方法更有机会被 JIT 编译优化。\",\"pitfall\":\"“Java 运行一定先全部编译为机器码才执行”错误；JIT 不是垃圾回收器。\",\"interview\":\"解释器保证字节码能快速开始执行；JIT 将热点方法/循环编译为机器码，以换取后续更高执行性能。 解释器逐条执行字节码，启动成本小、对冷代码友好；只靠解释执行，热点循环重复解析的成本较高。；JIT 依据运行剖析信息执行热点编译、方法内联、逃逸分析、标量替换等优化，产出的机器码存于 Code Cache。；JIT 编译本身消耗 CPU 和内存，优化也可能基于假设而去优化（deoptimization），所以采用解释器+编译器混合执行。\",\"code\":null},{\"short\":\"线上 GC 频繁时，先看 GC 日志判断类型、频率、停顿和回收后占用，再定位分配速率或存活对象增长。\",\"details\":[\"先确认是否频繁 Young GC、Mixed GC 或 Full GC；记录堆占用、回收前后变化、对象晋升量、暂停时间与业务响应延迟。\",\"Young GC 很频繁而回收后迅速下降，多考虑短期高分配；Full GC 频繁且回收后占用仍很高，多查保留对象、内存泄漏和老年代容量。\",\"用 jstat/jcmd/JFR/Heap Dump 找到分配热点、对象持有链或异常配置，优先改代码/缓存生命周期，再测量堆大小和 GC 参数。\"],\"example\":\"日志显示 Young GC 每秒多次，GC 后仍很空：先找每秒对象创建热点；如果回收后 Old 持续攀升则考虑 Dump。\",\"pitfall\":\"GC 频繁不必然表示内存泄漏；绝不能只凭一次峰值盲目扩大 -Xmx。\",\"interview\":\"线上 GC 频繁时，先看 GC 日志判断类型、频率、停顿和回收后占用，再定位分配速率或存活对象增长。 先确认是否频繁 Young GC、Mixed GC 或 Full GC；记录堆占用、回收前后变化、对象晋升量、暂停时间与业务响应延迟。；Young GC 很频繁而回收后迅速下降，多考虑短期高分配；Full GC 频繁且回收后占用仍很高，多查保留对象、内存泄漏和老年代容量。；用 jstat/jcmd/JFR/Heap Dump 找到分配热点、对象持有链或异常配置，优先改代码/缓存生命周期，再测量堆大小和 GC 参数。\",\"code\":\"-Xlog:gc*,safepoint:file=gc.log:time,uptime,level,tags\\njstat -gcutil \\u003cpid> 1000 10\"},{\"short\":\"JVM 排查工具按问题选：jcmd 看运行时信息，jstat 看 GC 统计，jstack 看线程，Heap Dump/MAT 看对象，JFR 看综合事件。\",\"details\":[\"jcmd \\u003cpid> VM.flags、GC.heap_info 等能读取 JVM 参数和堆信息；jstat -gcutil 跟踪代际占用和 GC 变化。\",\"jstack 或 jcmd Thread.print 观察线程栈与锁；jcmd GC.heap_dump 导出堆快照，MAT 查 Retained Heap、Dominator Tree 与 GC Roots 链。\",\"JFR 对 CPU、对象分配、锁竞争、GC 事件等分析很有帮助；可配合 OS top、pidstat、pmap 和 Native Memory Tracking。\"],\"example\":\"CPU 飙高优先 top -H 找线程并取线程栈；OOM 优先 GC 日志 + Heap Dump，而不是统一用 jstack。\",\"pitfall\":\"各工具命令与支持的子命令随 JDK 版本变化；Dump、JFR/NMT 等应评估开销。\",\"interview\":\"JVM 排查工具按问题选：jcmd 看运行时信息，jstat 看 GC 统计，jstack 看线程，Heap Dump/MAT 看对象，JFR 看综合事件。 jcmd \\u003cpid> VM.flags、GC.heap_info 等能读取 JVM 参数和堆信息；jstat -gcutil 跟踪代际占用和 GC 变化。；jstack 或 jcmd Thread.print 观察线程栈与锁；jcmd GC.heap_dump 导出堆快照，MAT 查 Retained Heap、Dominator Tree 与 GC Roots 链。；JFR 对 CPU、对象分配、锁竞争、GC 事件等分析很有帮助；可配合 OS top、pidstat、pmap 和 Native Memory Tracking。\",\"code\":\"jcmd \\u003cpid> VM.flags\\njcmd \\u003cpid> GC.heap_info\\njcmd \\u003cpid> Thread.print\\njstat -gcutil \\u003cpid> 1000 10\"},{\"short\":\"Heap Dump 定位泄漏的关键不是只看对象数量，而是“谁通过 GC Roots 长期保留了大量对象”。\",\"details\":[\"先用 histogram 找占用量大的对象类型，再用 Dominator Tree 和 Retained Heap 找持有大量对象的支配者。\",\"查看 Paths to GC Roots，找到 static Map、ThreadLocalMap、监听器、缓存、类加载器等持有链，并结合业务语义判断是否应释放。\",\"最好对比不同时间快照或压测后的占用趋势，确认对象数量是否持续增长；修复后再用相同负载验证。\"],\"example\":\"某个 static Map 本身浅堆很小，却可以支配上 GB 的会话对象；Retained Heap 比 Shallow Heap 更能揭示影响。\",\"pitfall\":\"Histogram 的大对象不必然是泄漏；Heap Dump 可能有较大暂停和磁盘成本。\",\"interview\":\"Heap Dump 定位泄漏的关键不是只看对象数量，而是“谁通过 GC Roots 长期保留了大量对象”。 先用 histogram 找占用量大的对象类型，再用 Dominator Tree 和 Retained Heap 找持有大量对象的支配者。；查看 Paths to GC Roots，找到 static Map、ThreadLocalMap、监听器、缓存、类加载器等持有链，并结合业务语义判断是否应释放。；最好对比不同时间快照或压测后的占用趋势，确认对象数量是否持续增长；修复后再用相同负载验证。\",\"code\":\"jcmd \\u003cpid> GC.heap_dump /tmp/heap.hprof\"},{\"short\":\"Java 进程 CPU 飙高先区分是业务线程、GC 线程还是系统调用/锁竞争，再按线程定位热点代码。\",\"details\":[\"用 top -H -p \\u003cpid> 或 pidstat -t 找到高 CPU 线程 TID，把十进制线程号转换成十六进制 nid，与 jstack/jcmd Thread.print 匹配。\",\"阅读热点线程栈：不断循环可能是忙等/死循环，频繁 GC 可能体现 GC 线程占用，锁竞争与 JNI 也要结合监控判断。\",\"可用 JFR/async-profiler 等 CPU 采样或火焰图进一步确认热点，优化前后比较 CPU、吞吐和延迟。\"],\"example\":\"TID=12345，hex 为 0x3039；在线程 Dump 中找 nid=0x3039 对应栈，定位高占用方法。\",\"pitfall\":\"CPU 高不代表“JVM GC 有问题”；先确认实际占用线程和 CPU profile。\",\"interview\":\"Java 进程 CPU 飙高先区分是业务线程、GC 线程还是系统调用/锁竞争，再按线程定位热点代码。 用 top -H -p \\u003cpid> 或 pidstat -t 找到高 CPU 线程 TID，把十进制线程号转换成十六进制 nid，与 jstack/jcmd Thread.print 匹配。；阅读热点线程栈：不断循环可能是忙等/死循环，频繁 GC 可能体现 GC 线程占用，锁竞争与 JNI 也要结合监控判断。；可用 JFR/async-profiler 等 CPU 采样或火焰图进一步确认热点，优化前后比较 CPU、吞吐和延迟。\",\"code\":\"top -H -p \\u003cpid>\\nprintf \\\"%x\\\\n\\\" \\u003ctid>\\njcmd \\u003cpid> Thread.print\"},{\"short\":\"Java 堆没有满但进程 RSS 高，常见原因是元空间、直接内存、线程栈、Code Cache、JNI/native 分配或内存映射。\",\"details\":[\"-Xmx 限制的只是 Java 堆容量，不是 JVM 进程的内存上限；不同本地内存区域有不同的增长行为。\",\"先对比 RSS、实际堆使用、线程数量、Metaspace、DirectBufferPool，再检查 JVM Native Memory Tracking（启动时开启）和系统内存映射。\",\"根据主因处理：线程太多调整线程池，DirectBuffer 未释放检查缓存生命周期，类加载器泄漏检查 class unloading，native 库分配问题需要 native 工具。\"],\"example\":\"堆使用 1GB 但 RSS 3GB，可能还有 500 个线程栈、Metaspace、DirectByteBuffer 和 code cache 等。\",\"pitfall\":\"“堆没满就不存在 JVM 内存问题”错误；NMT 也不保证涵盖进程全部第三方 native 分配。\",\"interview\":\"Java 堆没有满但进程 RSS 高，常见原因是元空间、直接内存、线程栈、Code Cache、JNI/native 分配或内存映射。 -Xmx 限制的只是 Java 堆容量，不是 JVM 进程的内存上限；不同本地内存区域有不同的增长行为。；先对比 RSS、实际堆使用、线程数量、Metaspace、DirectBufferPool，再检查 JVM Native Memory Tracking（启动时开启）和系统内存映射。；根据主因处理：线程太多调整线程池，DirectBuffer 未释放检查缓存生命周期，类加载器泄漏检查 class unloading，native 库分配问题需要 native 工具。\",\"code\":\"-XX:NativeMemoryTracking=summary\\njcmd \\u003cpid> VM.native_memory summary\"},{\"short\":\"JVM 调优不是背参数，而是形成“现象 → 指标 → 根因 → 方案 → 验证”的闭环。\",\"details\":[\"定义业务目标：吞吐、P95/P99 延迟、内存成本、GC 暂停预算；先记录稳定负载下的基线。\",\"以 GC 日志、JFR、线程栈、Heap Dump/NMT 等证据区分对象分配过快、泄漏、堆设置过小、GC 选型与线程问题。\",\"优先修复对象保留、缓存、批处理或无界队列，再评估 -Xms/-Xmx、收集器和停顿目标；每次只修改少量变量并做回归对比。\"],\"example\":\"如果 P99 突增与 G1 Mixed GC 停顿高度一致，可评估对象分配/晋升、堆容量及暂停目标，必要时用真实压测对比 ZGC。\",\"pitfall\":\"没有监控基线、直接抄某套“最优 JVM 参数”往往不可复现。\",\"interview\":\"JVM 调优不是背参数，而是形成“现象 → 指标 → 根因 → 方案 → 验证”的闭环。 定义业务目标：吞吐、P95/P99 延迟、内存成本、GC 暂停预算；先记录稳定负载下的基线。；以 GC 日志、JFR、线程栈、Heap Dump/NMT 等证据区分对象分配过快、泄漏、堆设置过小、GC 选型与线程问题。；优先修复对象保留、缓存、批处理或无界队列，再评估 -Xms/-Xmx、收集器和停顿目标；每次只修改少量变量并做回归对比。\",\"code\":\"java -Xms2g -Xmx2g -XX:+UseG1GC -Xlog:gc*:file=gc.log:time -jar app.jar\"}];\nconst Q n-item').forEach(b=>{const i=Number(b.querySelector('b')?.textContent)-1;b.classList.toggle('learned',progressSet.has(i))})}\nfunction studyNav(){const activeSelect=document.getElementById('mobileJump');if(activeSelect)activeSelect.value=String(currentQuestion);const term=document.getElementById('studyFilter').value.trim().toLowerCase();let last='';let html='';DATA.questions.forEach((q,i)=>{const ans=BANK[i];const body=[q.q,ans.short,...ans.details,ans.example,ans.pitfall].join(' ').toLowerCase();if(term&&!body.includes(term))return;if(last!==q.cat){html+=`\u003cdiv class=\"study-rail-label\">${esc(chapterTitle[q.cat])}\u003c/div>`;last=q.cat}html+=`\u003cbutton class=\"study-qnav ${i===currentQuestion?'active':''} ${progressSet.has(i)?'done':''}\" data-studyq=\"${i}\">\u003cspan class=\"num\">${progressSet.has(i)?'✓':String(i+1).padStart(2,'0')}\u003c/span>\u003cspan class=\"txt\">${esc(q.q)}\u003c/span>\u003c/button>`});document.getElementById('studyRailNav').innerHTML=html||'\u003cp style=\"padding:14px;color:#7787a0\">没有匹配的题目\u003c/p>';const selectedBtn=document.querySelector('.study-qnav.active');if(selectedBtn && !term)selectedBtn.scrollIntoView({block:'nearest'})}\nfunction chooseRelatedNodes(id){let arr=DATA.edges.filter(e=>e.a===id||e.b===id).map(e=>({id:e.a===id?e.b:e.a,why:e.why,kind:e.kind}));let priority={'共享原理':0,'深入追问':1,'对比区别':2,'基础依赖':3,'实现关系':3,'排障应用':4,'主线':5};arr.sort((a,b)=>(priority[a.kind]??4)-(priority[b.kind]??4));return arr.slice(0,7)}\nfunction openQuestion(idx){idx=Math.max(0,Math.min(59,idx));currentQuestion=idx;overlay.hidden=false;document.body.style.overflow='hidden';drawAnswer();studyNav();renderProgress();if(window.location.hash!=='#q'+(idx+1))(()=>{try{history.replaceState(null,'','#q'+(idx+1))}catch(e){}})()}\nfunction closeQuestion(){overlay.hidden=true;document.body.style.overflow='';if(/^#q\\d+$/.test(location.hash))(()=>{try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}})()}\nfunction goNode(id){closeQuestion();selectNode(id,true)}\nfunction drawAnswer(){let q=DATA.questions[currentQuestion],a=BANK[currentQuestion],n=byId.get(q.node),related=chooseRelatedNodes(q.node),follow=Q_FOLLOW[String(currentQuestion)]||[];\nconst ex=[`\u003cp>${esc(a.example)}\u003c/p>`];if(a.code)ex.push(`\u003cpre class=\"study-code\">${esc(a.code)}\u003c/pre>`);\nconst answer=`\n\u003cdiv class=\"study-eyebrow\">第 ${String(currentQuestion+1).padStart(2,'0')} / 60 题 · ${esc(chapterTitle[q.cat])}\u003c/div>\n\u003ch2>${esc(q.q)}\u003c/h2>\n\u003cdiv class=\"study-intro\">关联核心节点：${esc(n.title)} · 内容为独立整理的面试学习笔记，并非复制原文\u003c/div>\n\u003csection class=\"study-panel quick\">\u003ch3>\u003cspan class=\"kicker\">30 秒\u003c/span>先记住这句话\u003c/h3>\u003cp>${esc(a.short)}\u003c/p>\u003c/section>\n\u003csection class=\"study-panel\">\u003ch3>\u003cspan class=\"kicker\">深入\u003c/span>原理拆开讲\u003c/h3>\u003col class=\"study-points\">${a.details.map((x,i)=>`\u003cli>\u003cspan class=\"step\">${i+1}\u003c/span>\u003cspan>${esc(x)}\u003c/span>\u003c/li>`).join('')}\u003c/ol>\u003c/section>\n\u003csection class=\"study-panel example\">\u003ch3>\u003cspan class=\"kicker\">案例\u003c/span>结合代码或实际场景\u003c/h3>${ex.join('')}\u003c/section>\n\u003csection class=\"study-panel warning\">\u003ch3>\u003cspan class=\"kicker\">误区\u003c/span>这句话不要讲错\u003c/h3>\u003cp>${esc(a.pitfall)}\u003c/p>\u003c/section>\n\u003csection class=\"study-panel\">\u003ch3>\u003cspan class=\"kicker\">口述\u003c/span>适合面试的一段完整回答\u003c/h3>\u003cp>${esc(a.interview)}\u003c/p>\u003c/section>\n\u003csection class=\"study-panel\">\u003ch3>\u003cspan class=\"kicker\">关联\u003c/span>继续向下追问，会通向哪些知识？\u003c/h3>\u003cdiv class=\"study-nodechips\">\u003cbutton class=\"study-chip\" data-gonode=\"${q.node}\" style=\"border-color:#bad3f7;background:#f0f6ff\">◎ ${esc(n.title)}\u003csmall>返回关系图定位主节点\u003c/small>\u003c/button>${related.map(r=>`\u003cbutton class=\"study-chip\" data-gonode=\"${r.id}\">${esc(byId.get(r.id).title)}\u003csmall>${esc(r.kind)} · ${esc(r.why)}\u003c/small>\u003c/button>`).join('')}\u003c/div>\u003c/section>\n\u003csection class=\"study-panel\">\u003ch3>\u003cspan class=\"kicker\">拓展\u003c/span>建议连着看这几道原题\u003c/h3>\u003cdiv class=\"study-followups\">${follow.map(j=>`\u003cbutton class=\"study-chip\" data-openq=\"${j}\">第 ${j+1} 题 · ${esc(DATA.questions[j].q)}\u003c/button>`).join('')}\u003c/div>\u003c/section>\n\u003cdiv class=\"study-actions\">\u003cdiv class=\"study-foot\">\u003cbutton id=\"studyPrev\" ${currentQuestion===0?'disabled':''}>← 上一题\u003c/button>\u003cbutton id=\"studyNext\" ${currentQuestion===59?'disabled':''}>下一题 →\u003c/button>\u003c/div>\u003cbutton class=\"affirm ${progressSet.has(currentQuestion)?'done':''}\" id=\"markLearned\">${progressSet.has(currentQuestion)?'✓ 已掌握 · 点击取消':'✓ 标记这题已掌握'}\u003c/button>\u003c/div>\n\u003ca class=\"study-source\" href=\"https://xiaolincoding.com/interview/jvm.html\" target=\"_blank\" rel=\"noopener\">查看小林 coding JVM 原章 ↗\u003c/a>\u003cdiv class=\"study-note\">技术说明：内容按 HotSpot 的现代 JDK 语境整理；具体实现依 JDK 版本和 GC 收集器而异。相关基础：Oracle G1、ZGC 官方调优指南。\u003c/div>`;\nconst box=document.getElementById('studyArticle');box.innerHTML=answer;box.scrollTop=0;\nbox.querySelectorAll('[data-gonode]').forEach(b=>b.onclick=()=>goNode(b.dataset.gonode));\nbox.querySelectorAll('[data-openq]').forEach(b=>b.onclick=()=>openQuestion(Number(b.dataset.openq)));\nbox.querySelector('#studyPrev').onclick=()=>openQuestion(currentQuestion-1);box.querySelector('#studyNext').onclick=()=>openQuestion(currentQuestion+1);\nbox.querySelector('#markLearned').onclick=()=>{if(progressSet.has(currentQuestion))progressSet.delete(currentQuestion);else progressSet.add(currentQuestion);saveProgress();drawAnswer();studyNav()};\n}\ndocument.getElementById('hubOpenBtn').onclick=()=>openQuestion(currentQuestion);\ndocument.getElementById('heroOpenBtn').onclick=()=>openQuestion(currentQuestion);\ndocument.getElementById('heroBrowseBtn').onclick=()=>document.getElementById('questionIndex').scrollIntoV
