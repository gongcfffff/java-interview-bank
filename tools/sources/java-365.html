"a\":\"deadlock\",\"b\":\"metrics\",\"kind\":\"实战应用\",\"why\":\"线程 Dump 可以定位锁等待环\"},{\"a\":\"pool\",\"b\":\"threadleak\",\"kind\":\"实战应用\",\"why\":\"线程数和待处理任务堆积导致资源压力\"},{\"a\":\"platform\",\"b\":\"threadleak\",\"kind\":\"实战应用\",\"why\":\"平台线程过多占用本地栈与调度资源\"},{\"a\":\"reentrant\",\"b\":\"deadlock\",\"kind\":\"实现对比\",\"why\":\"锁可重入不代表多个锁不会死锁\"},{\"a\":\"communicate\",\"b\":\"orderingexample\",\"kind\":\"实战应用\",\"why\":\"用同步事件而不是 sleep 控制先后顺序\"},{\"a\":\"jmm\",\"b\":\"monitor\",\"kind\":\"共享机制\",\"why\":\"锁通过同步规则保证可见性\"},{\"a\":\"jmm\",\"b\":\"volatile\",\"kind\":\"共享机制\",\"why\":\"volatile 遵循同一 JMM 规范\"}],\"routes\":[{\"id\":\"main\",\"label\":\"整章主线\",\"desc\":\"从线程执行开始，一直追到线程池与工程排查\",\"nodes\":[\"threads\",\"jmm\",\"safety\",\"atomicity\",\"cas\",\"aqs\",\"rlock\",\"pool\",\"poolflow\",\"reject\",\"capacity\",\"metrics\"]},{\"id\":\"jmm\",\"label\":\"为什么 volatile 不保证线程安全？\",\"desc\":\"共享变量→可见性→原子性→volatile→CAS→DCL\",\"nodes\":[\"threads\",\"jmm\",\"visibility\",\"atomicity\",\"hb\",\"volatile\",\"reorder\",\"publication\",\"dcl\",\"cas\",\"increment\"]},{\"id\":\"locks\",\"label\":\"CAS、synchronized、AQS 怎样关联？\",\"desc\":\"原子操作、监视器、等待队列与两种锁的实现差异\",\"nodes\":[\"cas\",\"aba\",\"stamped\",\"monitor\",\"markword\",\"reentrant\",\"aqs\",\"aqstate\",\"aqq\",\"rlock\",\"fair\",\"lockcompare\",\"deadlock\"]},{\"id\":\"coop\",\"label\":\"线程协作：从 wait 追到 Condition\",\"desc\":\"线程状态→等待→通知→Condition→阻塞队列/同步器\",\"nodes\":[\"states\",\"wait\",\"notify\",\"communicate\",\"condition\",\"latch\",\"barrier\",\"semaphore\",\"prodcons\",\"sequence\",\"orderingexample\"]},{\"id\":\"pool\",\"label\":\"线程池为什么会把服务拖垮？\",\"desc\":\"提交→队列→扩线程→拒绝→资源治理→异步结果\",\"nodes\":[\"platform\",\"pool\",\"poolparams\",\"workqueue\",\"poolflow\",\"reject\",\"pooltune\",\"capacity\",\"metrics\",\"threadleak\",\"future\",\"completable\",\"shutdown\"]},{\"id\":\"threadlocal\",\"label\":\"ThreadLocal 为什么会泄漏？\",\"desc\":\"线程复用→Map 弱键→强值→串请求→清理\",\"nodes\":[\"threads\",\"pool\",\"threadlocal\",\"tlmap\",\"context\",\"threadleak\",\"metrics\"]},{\"id\":\"collections\",\"label\":\"JUC 工具哪些共享底层机制？\",\"desc\":\"CAS 在 AQS、原子类、ConcurrentHashMap 中的不同角色\",\"nodes\":[\"juc\",\"cas\",\"optimistic\",\"adder\",\"chm\",\"monitor\",\"aqs\",\"aqq\",\"aqstate\",\"latch\",\"barrier\",\"semaphore\"]},{\"id\":\"virtual\",\"label\":\"Java 21+ 虚拟线程的变化\",\"desc\":\"平台线程与虚拟线程、阻塞与 synchronized 版本差异\",\"nodes\":[\"threads\",\"platform\",\"virtual\",\"states\",\"wait\",\"monitor\",\"pool\",\"pooltune\",\"capacity\"]}],\"questions\":[{\"id\":1,\"title\":\"Java 的内存模型（JMM）介绍一下\",\"node\":\"jmm\",\"cat\":\"thread\",\"short\":\"JMM 是多线程读写共享变量的语义规范，核心围绕可见性、原子性、有序性和 happens-before。\",\"details\":[\"可见性：线程对共享变量的写，必须通过适当同步建立让其他线程观察到的保证；不能把 JMM 主内存/工作内存直接当成物理堆/CPU 缓存。\",\"原子性：一次 read-modify-write 如 count++ 不是不可分操作；volatile 不提供复合操作的原子性，原子类或互斥锁才可解决。\",\"有序性：编译器、CPU 可以优化执行顺序，但必须遵守 JMM 的 happens-before 约束；volatile 写→后续读、锁释放→同锁后续获取都是关键规则。\"],\"example\":\"线程 A 设置 volatile ready=true；线程 B 观察到 ready 为 true 后，能看见在该 volatile 写之前完成的普通共享写入。\",\"trap\":\"“JMM 的工作内存就是线程栈”错误；happens-before 也不是要求所有机器指令物理上禁止重排。\",\"interview\":\"JMM 是多线程读写共享变量的语义规范，核心围绕可见性、原子性、有序性和 happens-before。 可见性：线程对共享变量的写，必须通过适当同步建立让其他线程观察到的保证；不能把 JMM 主内存/工作内存直接当成物理堆/CPU 缓存。；原子性：一次 read-modify-write 如 count++ 不是不可分操作；volatile 不提供复合操作的原子性，原子类或互斥锁才可解决。；有序性：编译器、CPU 可以优化执行顺序，但必须遵守 JMM 的 happens-before 约束；volatile 写→后续读、锁释放→同锁后续获取都是关键规则。。\",\"code\":\"int data = 0;\\nvolatile boolean ready = false;\\n// 线程 A：data = 42; ready = true;\\n// 线程 B：if (ready) System.out.println(data); // 能看到 42\"},{\"id\":2,\"title\":\"java多线程是什么？需要注意什么？\",\"node\":\"threads\",\"cat\":\"thread\",\"short\":\"多线程让同一进程的多个执行流并发执行；它能提升资源利用率，但共享数据带来竞态、锁竞争和管理成本。\",\"details\":[\"线程共享堆中对象，执行栈与程序计数器独立；计算密集任务不一定因线程多而更快。\",\"共享状态需要同步、不可变对象、并发容器或消息传递；尤其要防止竞态、死锁与线程泄漏。\",\"线程创建、上下文切换、异常传播、取消和任务积压都需要生命周期管理；生产环境通常把任务交给线程池或虚拟线程执行器。\"],\"example\":\"一个线程读 Kafka 消息，另一个线程写数据库；若共享 HashMap，未同步更新会造成数据竞争。\",\"trap\":\"并发不等于并行；线程越多不一定越快，受 CPU 核数、IO 和下游容量限制。\",\"interview\":\"多线程让同一进程的多个执行流并发执行；它能提升资源利用率，但共享数据带来竞态、锁竞争和管理成本。 线程共享堆中对象，执行栈与程序计数器独立；计算密集任务不一定因线程多而更快。；共享状态需要同步、不可变对象、并发容器或消息传递；尤其要防止竞态、死锁与线程泄漏。；线程创建、上下文切换、异常传播、取消和任务积压都需要生命周期管理；生产环境通常把任务交给线程池或虚拟线程执行器。。\",\"code\":\"\"},{\"id\":3,\"title\":\"java里面的线程和操作系统的线程一样吗？\",\"node\":\"virtual\",\"cat\":\"thread\",\"short\":\"要分平台线程与虚拟线程：平台线程通常与 OS 线程 1:1，Java 21+ 虚拟线程由 JVM 调度映射到载体线程。\",\"details\":[\"平台线程需要操作系统线程栈和调度资源，频繁创建成本较高。\",\"虚拟线程轻量，适合大量阻塞式 IO；阻塞时 JVM 通常可卸载虚拟线程，复用载体平台线程。\",\"虚拟线程不提高 CPU 算力；JDK 21 的 synchronized 阻塞可能产生 pinning，JDK 24 的 JEP 491 改善了这类问题，具体以版本为准。\"],\"example\":\"高并发 HTTP 调用可以采用每任务一虚拟线程，但查询数据库连接数仍由连接池上限决定。\",\"trap\":\"“虚拟线程总是比平台线程快”“所有阻塞都会卸载载体”均不成立。\",\"interview\":\"要分平台线程与虚拟线程：平台线程通常与 OS 线程 1:1，Java 21+ 虚拟线程由 JVM 调度映射到载体线程。 平台线程需要操作系统线程栈和调度资源，频繁创建成本较高。；虚拟线程轻量，适合大量阻塞式 IO；阻塞时 JVM 通常可卸载虚拟线程，复用载体平台线程。；虚拟线程不提高 CPU 算力；JDK 21 的 synchronized 阻塞可能产生 pinning，JDK 24 的 JEP 491 改善了这类问题，具体以版本为准。。\",\"code\":\"Thread.startVirtualThread(() -> queryRemote()); // JDK 21+\"},{\"id\":4,\"title\":\"使用多线程要注意哪些问题？\",\"node\":\"safety\",\"cat\":\"thread\",\"short\":\"关注原子性、可见性、有序性，再补充活性和资源治理：正确性优先于并发度。\",\"details\":[\"共享变量的复合读改写需要锁或原子类；用 volatile 不能保护 count++。\",\"线程协作必须遵守 happens-before 规则，避免错误发布对象、读取过期状态。\",\"锁顺序不当会死锁；队列无界会积压；阻塞、异常、取消都应有明确策略。\"],\"example\":\"订单库存先查询再扣减不能靠普通 HashMap 读写保护，应在正确的并发边界用事务/锁/CAS 控制。\",\"trap\":\"“没有抛异常”不等于线程安全，数据丢失可能悄悄发生。\",\"interview\":\"关注原子性、可见性、有序性，再补充活性和资源治理：正确性优先于并发度。 共享变量的复合读改写需要锁或原子类；用 volatile 不能保护 count++。；线程协作必须遵守 happens-before 规则，避免错误发布对象、读取过期状态。；锁顺序不当会死锁；队列无界会积压；阻塞、异常、取消都应有明确策略。。\",\"code\":\"\"},{\"id\":5,\"title\":\"保证数据的一致性有哪些方案呢？\",\"node\":\"safety\",\"cat\":\"thread\",\"short\":\"先划定一致性的范围：进程内共享状态用锁/原子性/不可变设计，跨请求或数据库状态还需事务和版本校验。\",\"details\":[\"悲观并发控制通过互斥锁或行锁串行化临界区；适合冲突高、逻辑需要整体原子性。\",\"乐观并发控制使用版本号或 CAS 检测更新冲突，失败时重试或告知用户。\",\"数据库事务解决数据库操作的原子提交和隔离，不能自动覆盖 JVM 内存状态与远程调用的一致性。\"],\"example\":\"库存 SQL 使用 UPDATE stock SET qty=qty-1 WHERE id=? AND qty>0；多节点共享库存以数据库为最终一致性边界。\",\"trap\":\"锁住 Java 对象不能锁住其他服务器进程；跨系统一致性还需幂等、消息/事务方案。\",\"interview\":\"先划定一致性的范围：进程内共享状态用锁/原子性/不可变设计，跨请求或数据库状态还需事务和版本校验。 悲观并发控制通过互斥锁或行锁串行化临界区；适合冲突高、逻辑需要整体原子性。；乐观并发控制使用版本号或 CAS 检测更新冲突，失败时重试或告知用户。；数据库事务解决数据库操作的原子提交和隔离，不能自动覆盖 JVM 内存状态与远程调用的一致性。。\",\"code\":\"\"},{\"id\":6,\"title\":\"线程的创建方式有哪些?\",\"node\":\"create\",\"cat\":\"thread\",\"short\":\"本质是创建 Thread 并启动或提交任务；Runnable、Callable、线程池和虚拟线程是不同层次的实现手段。\",\"details\":[\"继承 Thread 或向 new Thread 传 Runnable；调用 start() 才新建执行流。\",\"Callable 有返回值/受检异常，通常配合 FutureTask 或 ExecutorService.submit 使用。\",\"线程池复用平台线程并控制并发；Java 21+ 可用虚拟线程按任务创建，不宜把每个请求都变成无边界工作。\"],\"example\":\"使用 Future\\u003cInteger> result=executor.submit(() -> 1+2)，通过 get() 拿结果，但 get() 可能阻塞。\",\"trap\":\"“实现 Runnable 就创建了线程”不对，任务不是线程，必须由执行器调度。\",\"interview\":\"本质是创建 Thread 并启动或提交任务；Runnable、Callable、线程池和虚拟线程是不同层次的实现手段。 继承 Thread 或向 new Thread 传 Runnable；调用 start() 才新建执行流。；Callable 有返回值/受检异常，通常配合 FutureTask 或 ExecutorService.submit 使用。；线程池复用平台线程并控制并发；Java 21+ 可用虚拟线程按任务创建，不宜把每个请求都变成无边界工作。。\",\"code\":\"Thread t = new Thread(() -> System.out.println(\\\"run\\\"));\\nt.start();  // 创建新线程\\n// t.run(); 只是当前线程直接调用方法\"},{\"id\":7,\"title\":\"怎么启动线程 ？\",\"node\":\"start\",\"cat\":\"thread\",\"short\":\"调用 Thread.start() 调度新线程执行任务。同一个 Thread 实例只能启动一次。\",\"details\":[\"start() 将线程交给调度器。平台线程和虚拟线程都可能在 start() 返回后才开始执行任务。\",\"直接调用带 Runnable 任务的平台线程的 run()，任务会在调用者线程执行。Java 21 的虚拟线程直接调用 run() 则不会执行任务。\",\"再次对同一个 Thread 对象调用 start() 会抛出 IllegalThreadStateException，即使它已经终止。\"],\"example\":\"用 new Thread(task) 创建平台线程时，直接调用 t.run() 会在调用者线程运行 task。调用 t.start() 则让新线程运行 task。\",\"trap\":\"不能用 start() 调用返回作为任务已执行完的证据。\",\"interview\":\"用 start() 启动线程，且一个 Thread 实例只能启动一次。直接调用带 Runnable 任务的平台线程的 run()，任务会在调用者线程执行。Java 21 的虚拟线程直接调用 run() 则不会执行任务。\",\"code\":\"Thread t = new Thread(() -> System.out.println(Thread.currentThread().getName()));\\nt.start();  // 新线程\\n// t.run(); // 不会创建新线程\"},{\"id\":8,\"title\":\"如何停止一个线程的运行?\",\"node\":\"interrupt\",\"cat\":\"thread\",\"short\":\"推荐协作式取消：发出停止信号，工作线程检查信号、处理中断并清理资源。\",\"details\":[\"纯计算循环可用 volatile 标志或 isInterrupted()；带阻塞等待的任务更适合 interrupt()。\",\"interrupt() 不是强杀，sleep/wait/join 等可中断阻塞会抛 InterruptedException，并通常清除中断标志。\",\"捕获中断后决定退出或恢复标志，结合 finally 清理资源；不要调用已废弃的不安全 Thread.stop()。\"],\"example\":\"服务关闭时先设 running=false 再 worker.interrupt()，让线程从阻塞睡眠中及时退出。\",\"trap\":\"设置 volatile 停止标志不会自动唤醒一个被阻塞的线程。\",\"interview\":\"推荐协作式取消：发出停止信号，工作线程检查信号、处理中断并清理资源。 纯计算循环可用 volatile 标志或 isInterrupted()；带阻塞等待的任务更适合 interrupt()。；interrupt() 不是强杀，sleep/wait/join 等可中断阻塞会抛 InterruptedException，并通常清除中断标志。；捕获中断后决定退出或恢复标志，结合 finally 清理资源；不要调用已废弃的不安全 Thread.stop()。。\",\"code\":\"try {\\n  while (!Thread.currentThread().isInterrupted()) doWork();\\n} catch (InterruptedException e) {\\n  Thread.currentThread().interrupt();\\n} finally { cleanup(); }\"},{\"id\":9,\"title\":\"调用 interrupt 是如何让线程抛出异常的?\",\"node\":\"interrupt\",\"cat\":\"thread\",\"short\":\"interrupt 设置中断请求；线程执行可中断阻塞操作时检查到它，才通常抛出 InterruptedException。\",\"details\":[\"对普通 RUNNABLE 线程调用 interrupt() 通常只改变中断状态，不会自动抛异常。\",\"对 sleep、wait、join 等阻塞操作，中断使等待提前结束并抛 InterruptedException，抛出时一般会清除中断状态。\",\"Lock.lockInterruptibly、Condition.await、BlockingQueue.take 等也是常见的可中断等待 API。\"],\"example\":\"线程在 Thread.sleep(10000) 时被 interrupt，会立即走到 catch 分支，而不是等满 10 秒。\",\"trap\":\"中断并非 JVM 向线程任意位置注入异常；IO 和 native 调用的响应要看各 API 约定。\",\"interview\":\"interrupt 设置中断请求；线程执行可中断阻塞操作时检查到它，才通常抛出 InterruptedException。 对普通 RUNNABLE 线程调用 interrupt() 通常只改变中断状态，不会自动抛异常。；对 sleep、wait、join 等阻塞操作，中断使等待提前结束并抛 InterruptedException，抛出时一般会清除中断状态。；Lock.lockInterruptibly、Condition.await、BlockingQueue.take 等也是常见的可中断等待 API。。\",\"code\":\"\"},{\"id\":10,\"title\":\"Java线程的状态有哪些？\",\"node\":\"states\",\"cat\":\"thread\",\"short\":\"Java Thread.State 有 6 种：NEW、RUNNABLE、BLOCKED、WAITING、TIMED_WAITING、TERMINATED。\",\"details\":[\"NEW 尚未 start；RUNNABLE 包含实际占 CPU 运行和等待 OS 调度两种情形；TERMINATED 为执行结束。\",\"BLOCKED 专指等待获取 synchronized 监视器；WAITING 常见于 Object.wait()、join()、park()。\",\"TIMED_WAITING 如 sleep(1000)、wait(1000)、带超时 join；Java 状态不是操作系统状态的一一映射。\"],\"example\":\"两个线程竞争 synchronized(this)，未拿到锁的线程显示 BLOCKED；LockSupport.park() 通常显示 WAITING。\",\"trap\":\"拿不到 ReentrantLock 不一定显示 BLOCKED：AQS park 的线程常显示 WAITING。\",\"interview\":\"Java Thread.State 有 6 种：NEW、RUNNABLE、BLOCKED、WAITING、TIMED_WAITING、TERMINATED。 NEW 尚未 start；RUNNABLE 包含实际占 CPU 运行和等待 OS 调度两种情形；TERMINATED 为执行结束。；BLOCKED 专指等待获取 synchronized 监视器；WAITING 常见于 Object.wait()、join()、park()。；TIMED_WAITING 如 sleep(1000)、wait(1000)、带超时 join；Java 状态不是操作系统状态的一一映射。。\",\"code\":\"\"},{\"id\":11,\"title\":\"sleep 和 wait的区别是什么？\",\"node\":\"wait\",\"cat\":\"thread\",\"short\":\"sleep 是 Thread 的定时休眠，不释放已持有的监视器；wait 是 Object 的条件等待，会释放对应对象的监视器。\",\"details\":[\"Thread.sleep 不要求 synchronized；Object.wait 必须在持有该对象监视器的同步块中调用，否则 IllegalMonitorStateException。\",\"wait 后线程进入等待集合，需 notify/notifyAll、中断或超时等事件才可继续参与抢锁；等待必须用 while 重查条件。\",\"sleep 不释放同步锁，但当前线程会让出 CPU 执行机会；两者的中断处理均可抛 InterruptedException。\"],\"example\":\"生产者队列空时 synchronized(lock){while(queue.isEmpty())lock.wait();}，添加任务后 notifyAll。\",\"trap\":\"notify 不等于立即继续执行，wait 返回前仍要重新获得原来的监视器。\",\"interview\":\"sleep 是 Thread 的定时休眠，不释放已持有的监视器；wait 是 Object 的条件等待，会释放对应对象的监视器。 Thread.sleep 不要求 synchronized；Object.wait 必须在持有该对象监视器的同步块中调用，否则 IllegalMonitorStateException。；wait 后线程进入等待集合，需 notify/notifyAll、中断或超时等事件才可继续参与抢锁；等待必须用 while 重查条件。；sleep 不释放同步锁，但当前线程会让出 CPU 执行机会；两者的中断处理均可抛 InterruptedException。。\",\"code\":\"synchronized (lock) {\\n  while (queue.isEmpty()) lock.wait();\\n  queue.remove();\\n}\"},{\"id\":12,\"title\":\"sleep会释放cpu吗？\",\"node\":\"wait\",\"cat\":\"thread\",\"short\":\"通常会：sleep 把当前线程移到定时等待，不继续占用 CPU 运行时间；但不会释放已经持有的 Java 锁。\",\"details\":[\"线程进入 TIMED_WAITING，调度器可把 CPU 分给其他可运行线程。\",\"醒来后变为可运行状态，并不保证正好到期立即执行，也不保证公平调度。\",\"持有 synchronized 时 sleep，其他线程仍可能因等待该锁而 BLOCKED；需要释放锁的条件等待应用 wait/Condition。\"],\"example\":\"线程 A 在 synchronized 内 sleep(1s)，线程 B 获取同一锁往往必须等 A 退出同步块。\",\"trap\":\"让出 CPU 与释放锁是两回事；Thread.yield() 也不保证把 CPU 交给指定线程。\",\"interview\":\"通常会：sleep 把当前线程移到定时等待，不继续占用 CPU 运行时间；但不会释放已经持有的 Java 锁。 线程进入 TIMED_WAITING，调度器可把 CPU 分给其他可运行线程。；醒来后变为可运行状态，并不保证正好到期立即执行，也不保证公平调度。；持有 synchronized 时 sleep，其他线程仍可能因等待该锁而 BLOCKED；需要释放锁的条件等待应用 wait/Condition。。\",\"code\":\"\"},{\"id\":13,\"title\":\"blocked和waiting有啥区别\",\"node\":\"states\",\"cat\":\"thread\",\"short\":\"BLOCKED 是等待进入 synchronized 监视器；WAITING 是因 wait/join/park 等主动进入无限期等待。\",\"details\":[\"线程竞争对象监视器失败时，Java Thread.State 可能是 BLOCKED；获取监视器成功后才可进入同步块。\",\"调用 Object.wait() 会释放对象监视器并等待通知；LockSupport.park() 也可能进入 WAITING。\",\"ReentrantLock 使用 AQS 等待队列和 park，未拿锁的线程常显示 WAITING 而不是 BLOCKED。\"],\"example\":\"jstack 里 blocked on monitor entry 指 monitor 竞争；parking to wait for 指 LockSupport/AQS 等候。\",\"trap\":\"不是所有“等锁”都标记 BLOCKED，需看锁的实现与 Thread.State 语义。\",\"interview\":\"BLOCKED 是等待进入 synchronized 监视器；WAITING 是因 wait/join/park 等主动进入无限期等待。 线程竞争对象监视器失败时，Java Thread.State 可能是 BLOCKED；获取监视器成功后才可进入同步块。；调用 Object.wait() 会释放对象监视器并等待通知；LockSupport.park() 也可能进入 WAITING。；ReentrantLock 使用 AQS 等待队列和 park，未拿锁的线程常显示 WAITING 而不是 BLOCKED。。\",\"code\":\"\"},{\"id\":14,\"title\":\"wait 状态下的线程如何恢复到 RUNNABLE 状态?\",\"node\":\"wait\",\"cat\":\"thread\",\"short\":\"先满足唤醒条件，再重新竞争所需锁；只有拿到锁后，才能从 wait 返回继续执行。\",\"details\":[\"Object.wait 可因 notify/notifyAll、中断或限时等待到期而结束等待；也允许虚假唤醒，所以用 while。\",\"被 notify 选中后不代表直接进入 RUNNABLE 执行用户逻辑；持锁线程不退出同步块时仍需等待监视器。\",\"Condition.await 由 signal/signalAll 等触发并在返回前重新获取对应的 ReentrantLock。\"],\"example\":\"消费者 wait 被唤醒后必须 while(queue.isEmpty()) 重新判断，防止别的消费者先拿走任务。\",\"trap\":\"只发 notify 却没有改变条件可能导致线程醒来又继续等待。\",\"interview\":\"先满足唤醒条件，再重新竞争所需锁；只有拿到锁后，才能从 wait 返回继续执行。 Object.wait 可因 notify/notifyAll、中断或限时等待到期而结束等待；也允许虚假唤醒，所以用 while。；被 notify 选中后不代表直接进入 RUNNABLE 执行用户逻辑；持锁线程不退出同步块时仍需等待监视器。；Condition.await 由 signal/signalAll 等触发并在返回前重新获取对应的 ReentrantLock。。\",\"code\":\"\"},{\"id\":15,\"title\":\"notify 和 notifyAll 的区别?\",\"node\":\"wait\",\"cat\":\"thread\",\"short\":\"notify 任意唤醒一个等待同一对象监视器的线程；notifyAll 唤醒所有等待者，但大家仍需竞争锁。\",\"details\":[\"notify 没有公平顺序保证，唤醒一个线程并不等于马上交出锁。\",\"多个条件共用一个监视器时，notify 可能选中条件不满足的线程造成卡住；notifyAll 更保险但会有额外唤醒竞争。\",\"若要精确按条件唤醒，ReentrantLock 的不同 Condition（notFull、notEmpty）更合适。\"],\"example\":\"一个对象上同时有生产者和消费者等待，随便 notify 可能叫醒同类线程，队列仍无法推进。\",\"trap\":\"notifyAll 也不是让多个线程同时拿到锁；一定要在 synchronized 中调用。\",\"interview\":\"notify 任意唤醒一个等待同一对象监视器的线程；notifyAll 唤醒所有等待者，但大家仍需竞争锁。 notify 没有公平顺序保证，唤醒一个线程并不等于马上交出锁。；多个条件共用一个监视器时，notify 可能选中条件不满足的线程造成卡住；notifyAll 更保险但会有额外唤醒竞争。；若要精确按条件唤醒，ReentrantLock 的不同 Condition（notFull、notEmpty）更合适。。\",\"code\":\"\"},{\"id\":16,\"title\":\"notify 选择哪个线程?\",\"node\":\"wait\",\"cat\":\"thread\",\"short\":\"没有顺序保证；规范不承诺先来先唤醒，也不能据此实现公平调度。\",\"details\":[\"notify 只在该对象的等待集合中选一个等待线程；真正获得 monitor 的顺序由后续竞争决定。\",\"实现内部可能采用某种队列策略，但代码不可依赖该细节。\",\"需要确定顺序就使用显式条件变量、Semaphore、阻塞队列或自己维护状态机。\"],\"example\":\"让线程 A、B、C 按顺序打印：用每线程一个 Semaphore 传递许可，比连续调用 notify() 可控。\",\"trap\":\"“notify() 唤醒最早 wait() 的线程”没有 Java 规范保证。\",\"interview\":\"没有顺序保证；规范不承诺先来先唤醒，也不能据此实现公平调度。 notify 只在该对象的等待集合中选一个等待线程；真正获得 monitor 的顺序由后续竞争决定。；实现内部可能采用某种队列策略，但代码不可依赖该细节。；需要确定顺序就使用显式条件变量、Semaphore、阻塞队列或自己维护状态机。。\",\"code\":\"\"},{\"id\":17,\"title\":\"不同的线程之间如何通信？\",\"node\":\"communicate\",\"cat\":\"thread\",\"short\":\"线程通信核心是共享状态 + 同步信号，也可通过线程安全队列等消息传递方式协作。\",\"details\":[\"共享 volatile 标志适合简单通知，但它不会自动阻塞或唤醒线程。\",\"wait/notify、Condition、LockSupport 可以等待条件；CountDownLatch、Semaphore 控制同步点或许可。\",\"BlockingQueue、CompletableFuture、Future 更适合任务/数据的传递和结果协调，通常比手写 wait/notify 更清晰。\"],\"example\":\"生产者 consumer.put(msg)，消费者 consumer.take()：队列同时解决数据传递、可见性和阻塞等待。\",\"trap\":\"“线程之间通信一定用 wait/notify”太局限；要优先考虑抽象层更高的 API。\",\"interview\":\"线程通信核心是共享状态 + 同步信号，也可通过线程安全队列等消息传递方式协作。 共享 volatile 标志适合简单通知，但它不会自动阻塞或唤醒线程。；wait/notify、Condition、LockSupport 可以等待条件；CountDownLatch、Semaphore 控制同步点或许可。；BlockingQueue、CompletableFuture、Future 更适合任务/数据的传递和结果协调，通常比手写 wait/notify 更清晰。。\",\"code\":\"\"},{\"id\":18,\"title\":\"线程间通信方式有哪些？\",\"node\":\"communicate\",\"cat\":\"thread\",\"short\":\"常见方式有 volatile 共享变量、wait/notify、Condition、BlockingQueue、Semaphore、Latch 和 Future。\",\"details\":[\"单次状态通知可用 volatile；多线程等待某条件则用 Condition 或阻塞容器。\",\"一个任务结束后让其他任务继续，可以用 join、Future.get 或 CountDownLatch。\",\"需要多阶段同步可用 CyclicBarrier/Phaser；需要异步组合任务可以用 CompletableFuture。\"],\"example\":\"三个子任务都返回后汇总：CountDownLatch(3) 或 CompletableFuture.allOf(...)。\",\"trap\":\"选择 API 先问“数据传递还是时序协作”，避免为了用并发工具而用工具。\",\"interview\":\"常见方式有 volatile 共享变量、wait/notify、Condition、BlockingQueue、Semaphore、Latch 和 Future。 单次状态通知可用 volatile；多线程等待某条件则用 Condition 或阻塞容器。；一个任务结束后让其他任务继续，可以用 join、Future.get 或 CountDownLatch。；需要多阶段同步可用 CyclicBarrier/Phaser；需要异步组合任务可以用 CompletableFuture。。\",\"code\":\"\"},{\"id\":19,\"title\":\"如何停止一个线程？\",\"node\":\"interrupt\",\"cat\":\"thread\",\"short\":\"停止线程应靠协作式取消：volatile 信号、中断和 Future.cancel(true)，并在任务中正确清理。\",\"details\":[\"如果线程在 sleep/BlockingQueue.take 中阻塞，中断通常比只设置标志更有效。\",\"线程可以选择忽略中断；外部线程无法安全保证“立即结束”。\",\"线程池中可先 shutdown 发出温和停止，必要时再 shutdownNow 尝试中断。\"],\"example\":\"轮询任务收到中断后关闭文件和连接、释放业务资源，然后退出循环。\",\"trap\":\"不能把 Thread.stop() 当成正常停止方式；捕获中断后直接吞掉也容易导致停止失效。\",\"interview\":\"停止线程应靠协作式取消：volatile 信号、中断和 Future.cancel(true)，并在任务中正确清理。 如果线程在 sleep/BlockingQueue.take 中阻塞，中断通常比只设置标志更有效。；线程可以选择忽略中断；外部线程无法安全保证“立即结束”。；线程池中可先 shutdown 发出温和停止，必要时再 shutdownNow 尝试中断。。\",\"code\":\"\"},{\"id\":20,\"title\":\"Go 的协程和 Java 的线程有啥区别？\",\"node\":\"virtual\",\"cat\":\"thread\",\"short\":\"传统 Java 平台线程由 OS 调度；Go goroutine 和 Java 虚拟线程更像用户态调度的轻量执行单元。\",\"details\":[\"平台线程通常 1:1 对应 OS 线程；Java 21+ 虚拟线程采用大量任务复用少量 carrier 线程的调度方式。\",\"Go goroutine 由 Go runtime 的调度器在 OS 线程上运行；Java 虚拟线程主要通过 JDK 的调度器运行，两者栈增长、阻塞处理和运行时机制不同。\",\"二者均能高效承载大量 IO 等待任务，但性能取决于程序、下游资源和运行时，不能用语言标签下结论。\"],\"example\":\"一个网关有十万等待网络响应的任务，虚拟线程和 goroutine 都比一任务一平台线程更适合评估。\",\"trap\":\"Java “所有线程都对应系统线程”从 Java 21 开始不再全面成立。\",\"interview\":\"传统 Java 平台线程由 OS 调度；Go goroutine 和 Java 虚拟线程更像用户态调度的轻量执行单元。 平台线程通常 1:1 对应 OS 线程；Java 21+ 虚拟线程采用大量任务复用少量 carrier 线程的调度方式。；Go goroutine 由 Go runtime 的调度器在 OS 线程上运行；Java 虚拟线程主要通过 JDK 的调度器运行，两者栈增长、阻塞处理和运行时机制不同。；二者均能高效承载大量 IO 等待任务，但性能取决于程序、下游资源和运行时，不能用语言标签下结论。。\",\"code\":\"\"},{\"id\":21,\"title\":\"juc包下你常用的类？\",\"node\":\"juc\",\"cat\":\"sync\",\"short\":\"按功能记：线程池、锁/同步器、并发集合、原子类、异步任务四组。\",\"details\":[\"线程池：ThreadPoolExecutor、ScheduledThreadPoolExecutor；Future/CompletableFuture 用于任务结果与组合。\",\"锁与同步器：ReentrantLock、Condition、Semaphore、CountDownLatch、CyclicBarrier、Phaser。\",\"数据结构与原子类：ConcurrentHashMap、BlockingQueue、CopyOnWriteArrayList、AtomicInteger、LongAdder；按读写特点选用。\"],\"example\":\"在线订单服务中使用 ConcurrentHashMap 保存临时状态，Semaphore 限制下游并发，CompletableFuture 聚合并行查询。\",\"trap\":\"不要仅列一堆名字：面试最好解释“遇到什么并发问题才选这个工具”。\",\"interview\":\"按功能记：线程池、锁/同步器、并发集合、原子类、异步任务四组。 线程池：ThreadPoolExecutor、ScheduledThreadPoolExecutor；Future/CompletableFuture 用于任务结果与组合。；锁与同步器：ReentrantLock、Condition、Semaphore、CountDownLatch、CyclicBarrier、Phaser。；数据结构与原子类：ConcurrentHashMap、BlockingQueue、CopyOnWriteArrayList、AtomicInteger、LongAdder；按读写特点选用。。\",\"code\":\"\"},{\"id\":22,\"title\":\"ConcurrentHashMap 是怎么保证线程安全的？\",\"node\":\"chm\",\"cat\":\"sync\",\"short\":\"以 JDK 8+ 为例，ConcurrentHashMap 用 CAS、桶级同步和 volatile 可见性保证并发读写安全。\",\"details\":[\"桶为空时可通过 CAS 放入节点；桶非空时，写操作对桶头等进行同步，树桶有专门的协调机制。\",\"get() 通常无需整体加锁，节点和表中的关键字段采用可见性保证；扩容可由多线程协作迁移。\",\"JDK 7 是 Segment 分段锁方案，JDK 8 改用数组+链表/红黑树+CAS+局部同步；复合“先判断后修改”仍需用 compute/merge 等原子方法。\"],\"example\":\"多个线程执行 map.computeIfAbsent(key, k -> loadValue()) 比 get 后 put 更能表达一次性并发计算；计算函数应尽量短。\",\"trap\":\"线程安全的单次 put/get 不等于 get→检查→put 整个复合流程自动原子。\",\"interview\":\"以 JDK 8+ 为例，ConcurrentHashMap 用 CAS、桶级同步和 volatile 可见性保证并发读写安全。 桶为空时可通过 CAS 放入节点；桶非空时，写操作对桶头等进行同步，树桶有专门的协调机制。；get() 通常无需整体加锁，节点和表中的关键字段采用可见性保证；扩容可由多线程协作迁移。；JDK 7 是 Segment 分段锁方案，JDK 8 改用数组+链表/红黑树+CAS+局部同步；复合“先判断后修改”仍需用 compute/merge 等原子方法。。\",\"code\":\"map.merge(\\\"key\\\", 1, Integer::sum); // 对该 key 的更新具备原子语义\"},{\"id\":23,\"title\":\"怎么保证多线程安全？\",\"node\":\"safety\",\"cat\":\"sync\",\"short\":\"首先判断共享数据和并发边界，再按“隔离/不可变 → 原子操作 → 锁 → 队列”选择最简单的正确方案。\",\"details\":[\"不共享即可少同步：方法局部状态、不可变对象、线程封闭、ThreadLocal 都可减少竞争。\",\"单变量计数使用 AtomicInteger/LongAdder；多字段必须满足一致性条件时使用 synchronized 或 ReentrantLock。\",\"使用 ConcurrentHashMap/BlockingQueue 等经过验证的并发容器；跨数据库和分布式服务时还需要事务和幂等。\"],\"example\":\"账户转账包含扣款与入账两个步骤，单个 AtomicInteger 不能保证整体约束，应把临界操作整体保护。\",\"trap\":\"“使用 volatile 就线程安全”错误：需要区分可见性与复合操作原子性。\",\"interview\":\"首先判断共享数据和并发边界，再按“隔离/不可变 → 原子操作 → 锁 → 队列”选择最简单的正确方案。 不共享即可少同步：方法局部状态、不可变对象、线程封闭、ThreadLocal 都可减少竞争。；单变量计数使用 AtomicInteger/LongAdder；多字段必须满足一致性条件时使用 synchronized 或 ReentrantLock。；使用 ConcurrentHashMap/BlockingQueue 等经过验证的并发容器；跨数据库和分布式服务时还需要事务和幂等。。\",\"code\":\"\"},{\"id\":24,\"title\":\"Java中有哪些常用的锁，在什么场景下使用？\",\"node\":\"locktypes\",\"cat\":\"sync\",\"short\":\"synchronized 简单互斥，ReentrantLock 提供可中断/超时/Condition，读写锁和 StampedLock 服务特定读多写少场景。\",\"details\":[\"synchronized 自动释放监视器，适合短小互斥代码；ReentrantLock 要在 finally unlock。\",\"ReentrantReadWriteLock 允许并发读、独占写；StampedLock 有乐观读，但不可重入且要 validate，维护复杂。\",\"乐观/悲观、公平/非公平、可重入/不可重入是锁的属性或策略，不能混成 Java API 列表。\"],\"example\":\"缓存读取频繁、更新少且读逻辑不短时可评估 ReadWriteLock，但读开销非常低时未必优于普通锁。\",\"trap\":\"锁的选择基于实际冲突率和持锁时长，不要默认“读写锁永远比互斥锁快”。\",\"interview\":\"synchronized 简单互斥，ReentrantLock 提供可中断/超时/Condition，读写锁和 StampedLock 服务特定读多写少场景。 synchronized 自动释放监视器，适合短小互斥代码；ReentrantLock 要在 finally unlock。；ReentrantReadWriteLock 允许并发读、独占写；StampedLock 有乐观读，但不可重入且要 validate，维护复杂。；乐观/悲观、公平/非公平、可重入/不可重入是锁的属性或策略，不能混成 Java API 列表。。\",\"code\":\"\"},{\"id\":25,\"title\":\"怎么在实践中用锁的？\",\"node\":\"locktypes\",\"cat\":\"sync\",\"short\":\"先识别临界区和资源归属，再选择锁对象与加锁粒度，最后防止异常泄锁、死锁和性能退化。\",\"details\":[\"明确哪些字段必须作为整体维护不变量；操作这些字段的所有路径都必须用同一把锁或同一同步策略。\",\"ReentrantLock 使用 try/finally；获取多个锁保持全局顺序，避免锁内做不可控远程 IO。\",\"针对热点共享状态缩小临界区、减少全局锁，实测争用、等待时间与吞吐量再优化。\"],\"example\":\"两个账户转账按账户 id 小→大固定顺序加锁，避免 A→B 与 B→A 两个线程反向抢锁。\",\"trap\":\"“每个方法都 synchronized”可能过度串行；锁住不同对象则可能根本没有保护共同数据。\",\"interview\":\"先识别临界区和资源归属，再选择锁对象与加锁粒度，最后防止异常泄锁、死锁和性能退化。 明确哪些字段必须作为整体维护不变量；操作这些字段的所有路径都必须用同一把锁或同一同步策略。；ReentrantLock 使用 try/finally；获取多个锁保持全局顺序，避免锁内做不可控远程 IO。；针对热点共享状态缩小临界区、减少全局锁，实测争用、等待时间与吞吐量再优化。。\",\"code\":\"lock.lock();\\ntry { updateSharedState(); }\\nfinally { lock.unlock(); }\"},{\"id\":26,\"title\":\"Java 并发工具你知道哪些？\",\"node\":\"juc\",\"cat\":\"sync\",\"short\":\"并发工具解决不同的协作问题：等任务完成、限制并发、阶段对齐、传递数据或组合异步计算。\",\"details\":[\"CountDownLatch 等一组任务结束；CyclicBarrier 让一组参与者到齐后进入下一阶段。\",\"Semaphore 限制同时访问某个资源的许可数；BlockingQueue 解耦生产和消费。\",\"CompletableFuture 组合结果、处理异常与超时；ConcurrentHashMap 支持高并发 Key-Value 访问。\"],\"example\":\"初始化服务时同时加载用户配置/字典/缓存，用 CompletableFuture.allOf 等待三个任务聚合。\",\"trap\":\"CountDownLatch 是一次性的；Semaphore 不等同于互斥锁，许可数可以大于 1。\",\"interview\":\"并发工具解决不同的协作问题：等任务完成、限制并发、阶段对齐、传递数据或组合异步计算。 CountDownLatch 等一组任务结束；CyclicBarrier 让一组参与者到齐后进入下一阶段。；Semaphore 限制同时访问某个资源的许可数；BlockingQueue 解耦生产和消费。；CompletableFuture 组合结果、处理异常与超时；ConcurrentHashMap 支持高并发 Key-Value 访问。。\",\"code\":\"\"},{\"id\":27,\"title\":\"CountDownLatch 是做什么的讲一讲？\",\"node\":\"latch\",\"cat\":\"sync\",\"short\":\"CountDownLatch 是一次性倒计数门闩：一个或多个线程 await，其他任务完成后 countDown，计数归零时放行。\",\"details\":[\"构造时指定计数 N；countDown 每调用一次减 1，await 等待到 0，允许设置超时。\",\"它常用于多个初始化任务全部结束后继续主流程，countDown 通常放 finally 避免异常导致永等。\",\"计数归零后不能重置，也不负责管理被等待任务的执行或异常；若需要复用屏障，考虑 CyclicBarrier/Phaser。\"],\"example\":\"三个文件并行加载，每个任务结束调用 latch.countDown()，主线程 latch.await() 后合并。\",\"trap\":\"如果有任务抛异常却没有 countDown，调用 await 的线程可能永久卡住。\",\"interview\":\"CountDownLatch 是一次性倒计数门闩：一个或多个线程 await，其他任务完成后 countDown，计数归零时放行。 构造时指定计数 N；countDown 每调用一次减 1，await 等待到 0，允许设置超时。；它常用于多个初始化任务全部结束后继续主流程，countDown 通常放 finally 避免异常导致永等。；计数归零后不能重置，也不负责管理被等待任务的执行或异常；若需要复用屏障，考虑 CyclicBarrier/Phaser。。\",\"code\":\"CountDownLatch latch = new CountDownLatch(3);\\nfor (int i=0;i\\u003c3;i++) executor.execute(() -> {\\n  try { doTask(); } finally { latch.countDown(); }\\n});\\nlatch.await();\"},{\"id\":28,\"title\":\"CountDownLatch 和 CyclicBarrier 有什么区别？\",\"node\":\"barrier\",\"cat\":\"sync\",\"short\":\"CountDownLatch 是 N 次事件完成后放行的“一次性倒计数”；CyclicBarrier 是 N 个参与者相互等待的“可复用汇合点”。\",\"details\":[\"Latch 的 countDown 与 await 可以由不同线程调用；Barrier 的 await 通常由所有参与者各自调用。\",\"Latch 计数到 0 不可重置；CyclicBarrier 达到参与人数后进入下一代，可反复使用，并可配置屏障动作。\",\"CyclicBarrier 某参与线程中断或超时可能使当前屏障进入 broken 状态，相关等待者抛异常。\"],\"example\":\"批处理有 4 个 worker，每轮都必须一起进入下一步：用 CyclicBarrier；主线程等 4 个一次性任务完成用 CountDownLatch。\",\"trap\":\"它们不是“都可以让主线程等一下，所以完全一样”。\",\"interview\":\"CountDownLatch 是 N 次事件完成后放行的“一次性倒计数”；CyclicBarrier 是 N 个参与者相互等待的“可复用汇合点”。 Latch 的 countDown 与 await 可以由不同线程调用；Barrier 的 await 通常由所有参与者各自调用。；Latch 计数到 0 不可重置；CyclicBarrier 达到参与人数后进入下一代，可反复使用，并可配置屏障动作。；CyclicBarrier 某参与线程中断或超时可能使当前屏障进入 broken 状态，相关等待者抛异常。。\",\"code\":\"\"},{\"id\":29,\"title\":\"synchronized和reentrantlock及其应用场景？\",\"node\":\"lockcompare\",\"cat\":\"sync\",\"short\":\"两者都能提供可重入互斥；简单场景优先 synchronized，需超时/中断/多 Condition 时考虑 ReentrantLock。\",\"details\":[\"synchronized 是语言内置 monitor，进入和退出由 JVM 管理，异常退出也能自动释放。\",\"ReentrantLock 基于 AQS 实现可重入，支持 lockInterruptibly、tryLock(timeout)、公平策略、多个 Condition。\",\"正确使用 ReentrantLock 必须在 finally 释放，性能优劣取决于竞争与版本，不存在绝对胜者。\"],\"example\":\"队列有 notFull 与 notEmpty 两个不同条件时，ReentrantLock 的多个 Condition 更易精准唤醒。\",\"trap\":\"“synchronized 不可重入”是错的；“ReentrantLock 必然更快”也是错的。\",\"interview\":\"两者都能提供可重入互斥；简单场景优先 synchronized，需超时/中断/多 Condition 时考虑 ReentrantLock。 synchronized 是语言内置 monitor，进入和退出由 JVM 管理，异常退出也能自动释放。；ReentrantLock 基于 AQS 实现可重入，支持 lockInterruptibly、tryLock(timeout)、公平策略、多个 Condition。；正确使用 ReentrantLock 必须在 finally 释放，性能优劣取决于竞争与版本，不存在绝对胜者。。\",\"code\":\"\"},{\"id\":30,\"title\":\"除了用synchronized，还有什么方法可以实现线程同步？\",\"node\":\"locktypes\",\"cat\":\"sync\",\"short\":\"可以用 ReentrantLock/读写锁、Atomic/CAS、volatile、并发容器、Semaphore 或其他协调工具，但保证的语义不同。\",\"details\":[\"互斥保护复杂操作：ReentrantLock、ReadWriteLock；单变量原子更新：AtomicInteger 等。\",\"volatile 保证特定读写的可见性/顺序，不保证 count++ 原子性。\",\"BlockingQueue、CountDownLatch、Condition、Semaphore 用于任务传递或协作，不是“都相当于一把互斥锁”。\"],\"example\":\"线程安全累加器可用 AtomicLong；要保护余额与交易次数两个共享字段的一致性，用同一把锁。\",\"trap\":\"方法名里带“并发”不意味着能自动保护你自己的任意业务复合操作。\",\"interview\":\"可以用 ReentrantLock/读写锁、Atomic/CAS、volatile、并发容器、Semaphore 或其他协调工具，但保证的语义不同。 互斥保护复杂操作：ReentrantLock、ReadWriteLock；单变量原子更新：AtomicInteger 等。；volatile 保证特定读写的可见性/顺序，不保证 count++ 原子性。；BlockingQueue、CountDownLatch、Condition、Semaphore 用于任务传递或协作，不是“都相当于一把互斥锁”。。\",\"code\":\"\"},{\"id\":31,\"title\":\"synchronized锁静态方法和普通方法区别？\",\"node\":\"monitor\",\"cat\":\"sync\",\"short\":\"实例 synchronized 方法锁 this；静态 synchronized 方法锁对应的 Class 对象，它们不是同一把锁。\",\"details\":[\"实例同步方法等价于进入当前对象 this 的监视器，不同实例通常互不阻塞。\",\"静态同步方法等价于锁 Class 对象（例如 User.class），同一运行时类的所有调用共享该监视器。\",\"若实例方法与静态方法操作同一份共享状态，必须明确使用同一锁，否则可能产生数据竞争。\"],\"example\":\"两个不同 User 实例同时调用 synchronized void f() 不一定互斥；同时调用 static synchronized g() 会竞争 User.class。\",\"trap\":\"“synchronized 锁的是代码而不是对象/类监视器”是误解。\",\"interview\":\"实例 synchronized 方法锁 this；静态 synchronized 方法锁对应的 Class 对象，它们不是同一把锁。 实例同步方法等价于进入当前对象 this 的监视器，不同实例通常互不阻塞。；静态同步方法等价于锁 Class 对象（例如 User.class），同一运行时类的所有调用共享该监视器。；若实例方法与静态方法操作同一份共享状态，必须明确使用同一锁，否则可能产生数据竞争。。\",\"code\":\"synchronized void a() {}       // 监视器：this\\nstatic synchronized void b() {} // 监视器：User.class\"},{\"id\":32,\"title\":\"synchronized和reentrantlock区别？\",\"node\":\"lockcompare\",\"cat\":\"sync\",\"short\":\"共同点是可重入互斥和内存可见性；关键差异是加锁 API、等待策略、可中断/超时、公平配置和多条件变量。\",\"details\":[\"synchronized 进入同步块时尝试监视器，离开作用域自动释放，配套 wait/notify。\",\"ReentrantLock 需显式 lock/unlock，配套 Condition，可以尝试获取、超时等待以及响应中断。\",\"非公平 ReentrantLock 默认采用可插队策略；公平性不是 Java synchronized 的 API 保证。\"],\"example\":\"请求可以放弃等待锁时用 lockInterruptibly()/tryLock(timeout)，避免无限期卡住。\",\"trap\":\"不要忽略 JDK 版本差异；锁升级“四阶段”只适合解释部分历史 HotSpot 实现。\",\"interview\":\"共同点是可重入互斥和内存可见性；关键差异是加锁 API、等待策略、可中断/超时、公平配置和多条件变量。 synchronized 进入同步块时尝试监视器，离开作用域自动释放，配套 wait/notify。；ReentrantLock 需显式 lock/unlock，配套 Condition，可以尝试获取、超时等待以及响应中断。；非公平 ReentrantLock 默认采用可插队策略；公平性不是 Java synchronized 的 API 保证。。\",\"code\":\"\"},{\"id\":33,\"title\":\"怎么理解可重入锁？\",\"node\":\"reentrant\",\"cat\":\"sync\",\"short\":\"可重入表示同一线程已经持有锁时，可以再次获取同一把锁而不会把自己锁死。\",\"details\":[\"同步调用链方法 A→B 都用同一把锁时，重入避免线程自己阻塞自己。\",\"ReentrantLock 用持有线程标识与 state 重入计数管理；多次 lock 必须对应同次数 unlock。\",\"synchronized 监视器天然支持同线程重复进入，退出嵌套同步块时对应减少持有深度。\"],\"example\":\"synchronized void a(){b();} 与 synchronized void b() 在同一对象上可顺利运行。\",\"trap\":\"可重入 != 多线程同时持有同一把独占锁；只放宽同一线程再次进入。\",\"interview\":\"可重入表示同一线程已经持有锁时，可以再次获取同一把锁而不会把自己锁死。 同步调用链方法 A→B 都用同一把锁时，重入避免线程自己阻塞自己。；ReentrantLock 用持有线程标识与 state 重入计数管理；多次 lock 必须对应同次数 unlock。；synchronized 监视器天然支持同线程重复进入，退出嵌套同步块时对应减少持有深度。。\",\"code\":\"\"},{\"id\":34,\"title\":\"synchronized 支持重入吗？如何实现的?\",\"node\":\"reentrant\",\"cat\":\"sync\",\"short\":\"支持，Java 监视器记录锁持有者与重入深度；持有线程再次进入同一监视器可以直接通过。\",\"details\":[\"首次进入 monitor 时取得所有权；同线程再次进入增加相应重入计数或锁记录。\",\"每次退出嵌套 synchronized 区域对应释放一层；最终完全退出时，其他线程才可能获取监视器。\",\"具体锁头/锁记录布局是 HotSpot 实现细节，解释机制时不要把某个版本 Mark Word 的图当作规范固定格式。\"],\"example\":\"一个 synchronized 实例方法递归调用自己不会因为获取同一把锁而自我死锁（但递归可能栈溢出）。\",\"trap\":\"不同对象的 monitor 不是同一把锁，不能混淆“重入”和“锁顺序”。\",\"interview\":\"支持，Java 监视器记录锁持有者与重入深度；持有线程再次进入同一监视器可以直接通过。 首次进入 monitor 时取得所有权；同线程再次进入增加相应重入计数或锁记录。；每次退出嵌套 synchronized 区域对应释放一层；最终完全退出时，其他线程才可能获取监视器。；具体锁头/锁记录布局是 HotSpot 实现细节，解释机制时不要把某个版本 Mark Word 的图当作规范固定格式。。\",\"code\":\"\"},{\"id\":35,\"title\":\"synchronized锁升级的过程讲一下\",\"node\":\"monitor\",\"cat\":\"sync\",\"short\":\"经典 JDK 8 HotSpot 常讲无锁→偏向锁→轻量级锁→膨胀监视器；现代 JDK 不能照搬为唯一流程。\",\"details\":[\"偏向锁针对同一线程反复进入降低开销，但 JDK 15 起默认禁用，后续版本的实现已有变化。\",\"轻量级获取依赖对象头/锁记录和原子操作；竞争激烈或某些操作下会膨胀到 ObjectMonitor，等待线程可能阻塞。\",\"自旋减少短锁的阻塞成本，但会耗 CPU；监视器可在合适时机解除关联，故“只能升级永不降级”并非绝对。\"],\"example\":\"回答时先标明“以早期 HotSpot JDK 8 常见实现为例”，再补充实际 JDK 的锁机制可能不同。\",\"trap\":\"锁升级不是代码每次执行都必须走四步；不同版本对锁形态和对象头编码差异较大。\",\"interview\":\"经典 JDK 8 HotSpot 常讲无锁→偏向锁→轻量级锁→膨胀监视器；现代 JDK 不能照搬为唯一流程。 偏向锁针对同一线程反复进入降低开销，但 JDK 15 起默认禁用，后续版本的实现已有变化。；轻量级获取依赖对象头/锁记录和原子操作；竞争激烈或某些操作下会膨胀到 ObjectMonitor，等待线程可能阻塞。；自旋减少短锁的阻塞成本，但会耗 CPU；监视器可在合适时机解除关联，故“只能升级永不降级”并非绝对。。\",\"code\":\"\"},{\"id\":36,\"title\":\"JVM对Synchornized的优化？\",\"node\":\"monitor\",\"cat\":\"sync\",\"short\":\"HotSpot 对 synchronized 的主要优化方向是减少无竞争获取成本、缩短等待与消除不必要的锁。\",\"details\":[\"JIT 可以锁消除（对象不逃逸时）和锁粗化（连续获取同锁时减少重复进入）等优化。\",\"轻量级加锁、短时间自旋和 ObjectMonitor 管理使不同竞争程度有不同成本；部分优化随 JDK 变化。\",\"偏向锁属于旧实现的优化，JDK 15 默认关闭；不要把它描述成现代 JVM 一定启用。\"],\"example\":\"循环里对不会逃逸的临时对象加锁，JIT 有机会消除锁；反之高竞争临界区更该优化持锁逻辑。\",\"trap\":\"“锁粗化必然更快”不对，它可能扩大持锁范围，应交给运行时与测量判断。\",\"interview\":\"HotSpot 对 synchronized 的主要优化方向是减少无竞争获取成本、缩短等待与消除不必要的锁。 JIT 可以锁消除（对象不逃逸时）和锁粗化（连续获取同锁时减少重复进入）等优化。；轻量级加锁、短时间自旋和 ObjectMonitor 管理使不同竞争程度有不同成本；部分优化随 JDK 变化。；偏向锁属于旧实现的优化，JDK 15 默认关闭；不要把它描述成现代 JVM 一定启用。。\",\"code\":\"\"},{\"id\":37,\"title\":\"介绍一下AQS\",\"node\":\"aqs\",\"cat\":\"sync\",\"short\":\"AQS（AbstractQueuedSynchronizer）是构建锁/同步器的框架：同步状态 state + 等待队列 + park/unpark 协调。\",\"details\":[\"子类定义获取和释放资源的规则；AQS 封装排队、取消、等待/唤醒，以及独占和共享两种模式。\",\"ReentrantLock 通过 AQS 管独占锁；Semaphore 和 CountDownLatch 利用 AQS 的共享获取语义。\",\"AQS 状态更新可用 CAS；有 FIFO 等待队列不代表所有基于 AQS 的锁都保证公平，公平取决于具体获取规则。\"],\"example\":\"线程抢 ReentrantLock 失败，AQS 把它排进等待队列并 park；持有者 unlock 后由同步器唤醒后继。\",\"trap\":\"不能把 AQS 说成“一个自旋 CAS 工具”；它还负责阻塞、排队和取消。\",\"interview\":\"AQS（AbstractQueuedSynchronizer）是构建锁/同步器的框架：同步状态 state + 等待队列 + park/unpark 协调。 子类定义获取和释放资源的规则；AQS 封装排队、取消、等待/唤醒，以及独占和共享两种模式。；ReentrantLock 通过 AQS 管独占锁；Semaphore 和 CountDownLatch 利用 AQS 的共享获取语义。；AQS 状态更新可用 CAS；有 FIFO 等待队列不代表所有基于 AQS 的锁都保证公平，公平取决于具体获取规则。。\",\"code\":\"\"},{\"id\":38,\"title\":\"CAS 和 AQS 有什么关系？\",\"node\":\"aqs\",\"cat\":\"sync\",\"short\":\"CAS 是单次条件原子更新的底层原语，AQS 是用这些原语加队列/阻塞构建同步器的上层框架。\",\"details\":[\"CAS 做 compareAndSet：当前值与预期相符才修改，失败则返回，常用于 AQS.state 的竞争获取。\",\"AQS 获取失败会排队并可能 park，而不是让每个线程无限空转 CAS。\",\"AQS 的所有状态变化并非都必须 CAS：独占持有线程可按规则直接更新重入计数。\"],\"example\":\"ReentrantLock 非公平锁空闲时 CAS state 0→1；失败后进入 AQS 获取与排队流程。\",\"trap\":\"“CAS 解决不了阻塞，所以 AQS 不可能用 CAS”完全混淆原语层与框架层。\",\"interview\":\"CAS 是单次条件原子更新的底层原语，AQS 是用这些原语加队列/阻塞构建同步器的上层框架。 CAS 做 compareAndSet：当前值与预期相符才修改，失败则返回，常用于 AQS.state 的竞争获取。；AQS 获取失败会排队并可能 park，而不是让每个线程无限空转 CAS。；AQS 的所有状态变化并非都必须 CAS：独占持有线程可按规则直接更新重入计数。。\",\"code\":\"\"},{\"id\":39,\"title\":\"如何用 AQS 实现一个可重入的公平锁？\",\"node\":\"aqs\",\"cat\":\"sync\",\"short\":\"使用 AQS 实现独占获取/释放：state 作为重入次数、owner 记录持有者、公平路径检查 hasQueuedPredecessors。\",\"details\":[\"首次获取：只有没有排队前驱且 state==0 才 CAS state→1 并设 owner；持有者再次获取则 state++。\",\"释放：只有 owner 才能 unlock，state 减 1；降到 0 时清空 owner 并返回 true 触发后继唤醒。\",\"外层 Lock 实现 lock/tryLock/unlock/newCondition 等；公平保证通常仅针对 lock 的获取策略，tryLock 无参可能允许插队。\"],\"example\":\"多个线程按入队顺序申请一把临界资源锁，公平实现防止新来的线程频繁插队，但降低吞吐。\",\"trap\":\"公平不是绝对的调度先后顺序保证，也要处理取消和中断；重入次数不能与同一资源的许可数混淆。\",\"interview\":\"使用 AQS 实现独占获取/释放：state 作为重入次数、owner 记录持有者、公平路径检查 hasQueuedPredecessors。 首次获取：只有没有排队前驱且 state==0 才 CAS state→1 并设 owner；持有者再次获取则 state++。；释放：只有 owner 才能 unlock，state 减 1；降到 0 时清空 owner 并返回 true 触发后继唤醒。；外层 Lock 实现 lock/tryLock/unlock/newCondition 等；公平保证通常仅针对 lock 的获取策略，tryLock 无参可能允许插队。。\",\"code\":\"// tryAcquire 关键逻辑（伪代码）：\\nif (state == 0 && !hasQueuedPredecessors()\\n        && compareAndSetState(0, 1)) {\\n    setExclusiveOwnerThread(current); return true;\\n}\\nif (current == getExclusiveOwnerThread()) {\\n    setState(state + 1); return true;\\n}\\nreturn false;\"},{\"id\":40,\"title\":\"Threadlocal作用，原理，具体里面存的key value是啥，会有什么问题，如何解决?\",\"node\":\"threadlocal\",\"cat\":\"sync\",\"short\":\"ThreadLocal 是按线程隔离变量的访问入口，实际条目存在线程持有的 ThreadLocalMap 中；不正确清理可能长期滞留值。\",\"details\":[\"Thread 对象持有 ThreadLocalMap；Entry 的 key 是 ThreadLocal 的弱引用，value 是普通强引用（如用户上下文）。\",\"ThreadLocal 对象无强引用后，key 可能被 GC 清掉而 value 仍暂留；线程池线程寿命长，未 remove 的值还可能串请求。\",\"在 try/finally 中 remove；尤其是任务线程复用时不要把 ThreadLocal 当成普通全局变量。\"],\"example\":\"Web 请求过滤器把 traceId 放 ThreadLocal，处理完必须 finally remove，否则下一个请求可能拿到旧值。\",\"trap\":\"ThreadLocal 的值一般在堆中，不是栈上；弱 key 不代表 value 会立刻被 GC。\",\"interview\":\"ThreadLocal 是按线程隔离变量的访问入口，实际条目存在线程持有的 ThreadLocalMap 中；不正确清理可能长期滞留值。 Thread 对象持有 ThreadLocalMap；Entry 的 key 是 ThreadLocal 的弱引用，value 是普通强引用（如用户上下文）。；ThreadLocal 对象无强引用后，key 可能被 GC 清掉而 value 仍暂留；线程池线程寿命长，未 remove 的值还可能串请求。；在 try/finally 中 remove；尤其是任务线程复用时不要把 ThreadLocal 当成普通全局变量。。\",\"code\":\"try {\\n    traceId.set(id);\\n    handleRequest();\\n} finally {\\n    traceId.remove();\\n}\"},{\"id\":41,\"title\":\"悲观锁和乐观锁的区别？\",\"node\":\"optimistic\",\"cat\":\"sync\",\"short\":\"悲观锁先排他保护资源再改；乐观并发控制先读/计算、提交时校验是否被别人修改。\",\"details\":[\"悲观锁如 synchronized/ReentrantLock 或数据库行锁，冲突时阻塞等待，适合高冲突或复杂约束。\",\"乐观方式用 CAS 或数据库版本号 compare-and-update，冲突失败需重试/回滚或提示冲突。\",\"乐观不是“完全无锁”；锁也不等于一定性能差，冲突高时疯狂 CAS 可能更耗 CPU。\"],\"example\":\"更新订单 UPDATE ... WHERE id=? AND version=?；若更新行数为 0，则表示发生版本冲突。\",\"trap\":\"“CAS 等于业务级乐观锁的全部”不对：一次 CAS 无法自动保护远程服务和多字段事务。\",\"interview\":\"悲观锁先排他保护资源再改；乐观并发控制先读/计算、提交时校验是否被别人修改。 悲观锁如 synchronized/ReentrantLock 或数据库行锁，冲突时阻塞等待，适合高冲突或复杂约束。；乐观方式用 CAS 或数据库版本号 compare-and-update，冲突失败需重试/回滚或提示冲突。；乐观不是“完全无锁”；锁也不等于一定性能差，冲突高时疯狂 CAS 可能更耗 CPU。。\",\"code\":\"\"},{\"id\":42,\"title\":\"Java中想实现一个乐观锁，都有哪些方式？\",\"node\":\"cas\",\"cat\":\"sync\",\"short\":\"常见乐观方式有 Atomic/VarHandle 的 CAS、版本戳、数据库版本列；选择取决于更新粒度和 ABA 风险。\",\"details\":[\"单变量可用 AtomicInteger.compareAndSet 或 updateAndGet；Java 9+ VarHandle 提供更底层的访问模式。\",\"引用可能发生 ABA 且业务在乎变化历史时，可使用 AtomicStampedReference 把版本和引用一起比较。\",\"跨进程数据库更新应通过版本字段和条件 SQL，JVM 进程内的 CAS 对其他服务器不起互斥作用。\"],\"example\":\"重试抢库存：先读取 qty/version，再 UPDATE qty=?,version=version+1 WHERE version=?。\",\"trap\":\"乐观锁失败必须决定重试次数、退避和冲突处理，不能写无界 while(true) 重试。\",\"interview\":\"常见乐观方式有 Atomic/VarHandle 的 CAS、版本戳、数据库版本列；选择取决于更新粒度和 ABA 风险。 单变量可用 AtomicInteger.compareAndSet 或 updateAndGet；Java 9+ VarHandle 提供更底层的访问模式。；引用可能发生 ABA 且业务在乎变化历史时，可使用 AtomicStampedReference 把版本和引用一起比较。；跨进程数据库更新应通过版本字段和条件 SQL，JVM 进程内的 CAS 对其他服务器不起互斥作用。。\",\"code\":\"\"},{\"id\":43,\"title\":\"CAS 有什么缺点？\",\"node\":\"cas\",\"cat\":\"sync\",\"short\":\"CAS 的问题主要是高竞争自旋开销、ABA、只能原子更新指定状态，以及失败重试/饥饿风险。\",\"details\":[\"高竞争时反复 CAS 会占用 CPU，可引入退避、分段累加或改用队列与锁。\",\"ABA 表示值经历 A→B→A，CAS 只比较当前值时可能误以为“没变化”，必要时加入版本戳。\",\"一次 CAS 保护一个内存单元的更新；复杂跨字段不变量可用不可变快照+引用 CAS 或互斥锁。\"],\"example\":\"热点统计总数用 LongAdder 分散写竞争；转账涉及两账户余额则需要整体一致性方案。\",\"trap\":\"“CAS 永远无锁所以必然更快”不对，高冲突时失败重试成本很高。\",\"interview\":\"CAS 的问题主要是高竞争自旋开销、ABA、只能原子更新指定状态，以及失败重试/饥饿风险。 高竞争时反复 CAS 会占用 CPU，可引入退避、分段累加或改用队列与锁。；ABA 表示值经历 A→B→A，CAS 只比较当前值时可能误以为“没变化”，必要时加入版本戳。；一次 CAS 保护一个内存单元的更新；复杂跨字段不变量可用不可变快照+引用 CAS 或互斥锁。。\",\"code\":\"\"},{\"id\":44,\"title\":\"为什么不能所有的锁都用CAS？\",\"node\":\"aqs\",\"cat\":\"sync\",\"short\":\"CAS 是单次原子更新，不自动提供等待、条件队列、超时、中断与复杂临界区的整体互斥。\",\"details\":[\"长时间持有共享资源时，如果其他线程用 CAS 自旋，容易浪费 CPU，应使用阻塞队列/锁。\",\"多个相关字段一起变更时，一次 CAS 不足以维护所有业务不变量。\",\"AQS 就把 CAS 与排队/park 结合：快路径 CAS，失败后进入更有秩序的等待。\"],\"example\":\"锁内要执行 200ms 数据库操作，竞争方持续 CAS 空转很不划算，ReentrantLock 阻塞等待更合理。\",\"trap\":\"“CAS 的原子性可以替代事务”错误，它只原子地更新被 CAS 操作覆盖的那部分状态。\",\"interview\":\"CAS 是单次原子更新，不自动提供等待、条件队列、超时、中断与复杂临界区的整体互斥。 长时间持有共享资源时，如果其他线程用 CAS 自旋，容易浪费 CPU，应使用阻塞队列/锁。；多个相关字段一起变更时，一次 CAS 不足以维护所有业务不变量。；AQS 就把 CAS 与排队/park 结合：快路径 CAS，失败后进入更有秩序的等待。。\",\"code\":\"\"},{\"id\":45,\"title\":\"CAS 有什么问题，Java是怎么解决的？\",\"node\":\"aba\",\"cat\":\"sync\",\"short\":\"典型追问是 ABA：中间发生过 A→B→A，单次 CAS 仍可成功；需要历史感知时使用版本戳。\",\"details\":[\"AtomicStampedReference 同时维护引用和值的版本号，compareAndSet 比较两者。\",\"AtomicMarkableReference 只有布尔标记，适合状态标注但不能通用地记录修改次数。\",\"高竞争下 CAS 仍会重试，适当使用 LongAdder、Striped 方案或锁；版本戳不是解决 CPU 自旋开销的办法。\"],\"example\":\"无锁栈中某节点被弹出又被放回，引用变回 A，但链表内部连接已变化，可能破坏算法假设。\",\"trap\":\"ABA 并非所有 CAS 更新都有害，例如纯计数器的值回到原数不一定需要追踪历史。\",\"interview\":\"典型追问是 ABA：中间发生过 A→B→A，单次 CAS 仍可成功；需要历史感知时使用版本戳。 AtomicStampedReference 同时维护引用和值的版本号，compareAndSet 比较两者。；AtomicMarkableReference 只有布尔标记，适合状态标注但不能通用地记录修改次数。；高竞争下 CAS 仍会重试，适当使用 LongAdder、Striped 方案或锁；版本戳不是解决 CPU 自旋开销的办法。。\",\"code\":\"AtomicStampedReference\\u003cObject> ref =\\n    new AtomicStampedReference\\u003c>(initial, 0);\\n// 必须同时比较引用和预期版本号\"},{\"id\":46,\"title\":\"AtomicLong 和 LongAdder 有什么区别？\",\"node\":\"adder\",\"cat\":\"sync\",\"short\":\"AtomicLong 对单一变量 CAS 更新并支持强一致快照；LongAdder 分散热点更新，吞吐往往更好但 sum 非原子快照。\",\"details\":[\"AtomicLong 使用单一原子值，incrementAndGet、get 等操作有清晰的原子语义，适合序号/严格计数。\",\"LongAdder 使用 base 和多个 Cell 分摊高并发写入争用；sum 汇总各 Cell，在并发更新时不保证原子瞬时快照。\",\"低竞争时 LongAdder 额外结构未必划算，且不能直接替代需要 CAS 条件判断的 AtomicLong。\"],\"example\":\"接口 QPS、埋点计数可选 LongAdder；生成严格单调 ID/判断阈值需要 AtomicLong 或更强同步。\",\"trap\":\"LongAdder.sum() 在并发更新中可能看到非一致瞬间值，不用于必须精确实时判断的余额。\",\"interview\":\"AtomicLong 对单一变量 CAS 更新并支持强一致快照；LongAdder 分散热点更新，吞吐往往更好但 sum 非原子快照。 AtomicLong 使用单一原子值，incrementAndGet、get 等操作有清晰的原子语义，适合序号/严格计数。；LongAdder 使用 base 和多个 Cell 分摊高并发写入争用；sum 汇总各 Cell，在并发更新时不保证原子瞬时快照。；低竞争时 LongAdder 额外结构未必划算，且不能直接替代需要 CAS 条件判断的 AtomicLong。。\",\"code\":\"\"},{\"id\":47,\"title\":\"voliatle关键字有什么作用？\",\"node\":\"volatile\",\"cat\":\"sync\",\"short\":\"volatile 主要保证共享变量的可见性和围绕该变量读写的顺序语义，不保证 count++ 这类复合操作原子性。\",\"details\":[\"volatile 写与同一变量后续 volatile 读建立 happens-before，能把此前相关写入的结果安全发布出去。\",\"编译器和处理器不得做破坏 volatile 语义的重排序，但不是禁止所有重排序。\",\"适合停止标志、状态发布和双重检查单例的引用；多个字段整体约束或累加仍需要锁/CAS。\"],\"example\":\"worker 循环读取 volatile running，控制线程设 false 后 worker 可观察停止状态。\",\"trap\":\"volatile 不是互斥锁，也不保证多个线程轮流独占执行一段代码。\",\"interview\":\"volatile 主要保证共享变量的可见性和围绕该变量读写的顺序语义，不保证 count++ 这类复合操作原子性。 volatile 写与同一变量后续 volatile 读建立 happens-before，能把此前相关写入的结果安全发布出去。；编译器和处理器不得做破坏 volatile 语义的重排序，但不是禁止所有重排序。；适合停止标志、状态发布和双重检查单例的引用；多个字段整体约束或累加仍需要锁/CAS。。\",\"code\":\"private volatile boolean running = true;\\nwhile (running) { doTask(); }\\n// 控制线程：running = false;\"},{\"id\":48,\"title\":\"指令重排序的原理是什么？\",\"node\":\"reorder\",\"cat\":\"sync\",\"short\":\"编译器和 CPU 为提高吞吐会在不破坏单线程语义前提下重新安排执行；JMM 用 happens-before 约束跨线程可观察结果。\",\"details\":[\"源码顺序与机器执行顺序不必一一对应；编译器优化、处理器乱序、内存系统都会影响可观察次序。\",\"正确同步通过 volatile、锁、final 安全发布等机制建立有序性；在这些语义边界之外允许优化。\",\"典型 DCL 问题中，若缺少 volatile，其他线程可能看到已发布引用，却没有获得构造初始化的安全可见性。\"],\"example\":\"对象构造与把引用写入共享字段的顺序，不能只靠“代码写在上面”来保证其他线程看到正确初始化。\",\"trap\":\"指令重排序≠JVM 随意打乱单线程逻辑；有序性约束不要求 CPU 每条指令都按源码机械执行。\",\"interview\":\"编译器和 CPU 为提高吞吐会在不破坏单线程语义前提下重新安排执行；JMM 用 happens-before 约束跨线程可观察结果。 源码顺序与机器执行顺序不必一一对应；编译器优化、处理器乱序、内存系统都会影响可观察次序。；正确同步通过 volatile、锁、final 安全发布等机制建立有序性；在这些语义边界之外允许优化。；典型 DCL 问题中，若缺少 volatile，其他线程可能看到已发布引用，却没有获得构造初始化的安全可见性。。\",\"code\":\"\"},{\"id\":49,\"title\":\"volatile可以保证线程安全吗？\",\"node\":\"volatile\",\"cat\":\"sync\",\"short\":\"不一定。volatile 能保证对该变量的可见性与部分有序性；多个步骤的复合更新仍可能丢失数据。\",\"details\":[\"count++ 分为读、加、写，两个线程可读取相同旧值并写回相同结果，即使 count 是 volatile。\",\"如果状态是“一个写线程、多个读线程”的开关/配置引用，volatile 可能足够。\",\"需要原子增量用 AtomicInteger；需要维护多字段不变量，用 synchronized 或 ReentrantLock。\"],\"example\":\"两个线程每个对 volatile int count 加 50 次，结果不一定是 100。\",\"trap\":\"“可见性好”不等于“写入过程中不会插进其他线程”。\",\"interview\":\"不一定。volatile 能保证对该变量的可见性与部分有序性；多个步骤的复合更新仍可能丢失数据。 count++ 分为读、加、写，两个线程可读取相同旧值并写回相同结果，即使 count 是 volatile。；如果状态是“一个写线程、多个读线程”的开关/配置引用，volatile 可能足够。；需要原子增量用 AtomicInteger；需要维护多字段不变量，用 synchronized 或 ReentrantLock。。\",\"code\":\"volatile int count = 0;\\n// 错误预期：并发执行 count++ 一定不丢更新\\nAtomicInteger safe = new AtomicInteger();\\nsafe.incrementAndGet();\"},{\"id\":50,\"title\":\"volatile和sychronized比较？\",\"node\":\"lockcompare\",\"cat\":\"sync\",\"short\":\"volatile 是变量访问语义；synchronized 是监视器互斥，既能建立可见性顺序，也能保护一段复合操作的原子性。\",\"details\":[\"volatile 不提供互斥，适合状态发布、单次赋值/读取和停止标志。\",\"synchronized 一次只允许一个线程持有同一 monitor，释放/再次获取同一锁也建立 happens-before。\",\"锁有竞争、阻塞和调度成本；选择依据是业务是否需要临界区原子性，而不是简单比较快慢。\"],\"example\":\"设置配置快照引用用 volatile；实现 transfer(from,to,amount) 这种多字段约束用互斥。\",\"trap\":\"不同 synchronized 锁对象之间没有共享互斥保证；不能只看到关键字就认定数据安全。\",\"interview\":\"volatile 是变量访问语义；synchronized 是监视器互斥，既能建立可见性顺序，也能保护一段复合操作的原子性。 volatile 不提供互斥，适合状态发布、单次赋值/读取和停止标志。；synchronized 一次只允许一个线程持有同一 monitor，释放/再次获取同一锁也建立 happens-before。；锁有竞争、阻塞和调度成本；选择依据是业务是否需要临界区原子性，而不是简单比较快慢。。\",\"code\":\"\"},{\"id\":51,\"title\":\"什么是公平锁和非公平锁？\",\"node\":\"fair\",\"cat\":\"sync\",\"short\":\"公平锁尽量按等待队列先后获取；非公平锁允许新来线程在条件允许时插队抢锁。\",\"details\":[\"公平 ReentrantLock 在获取时查看队列中是否已有等待更久的前驱（例如 hasQueuedPredecessors）。\",\"非公平路径允许新线程直接尝试 CAS 获取，减少交接空档，通常吞吐较好但等待时间分布可能更不稳定。\",\"公平不是操作系统层面的绝对先来先服务；线程调度、取消、tryLock 等边界会影响顺序。\"],\"example\":\"限流型任务若要求长时间排队的请求也应持续获得机会，可评估公平锁，但需测量吞吐。\",\"trap\":\"使用非公平锁不是线程“永远拿不到”的必然结论，只是可能增加饥饿风险。\",\"interview\":\"公平锁尽量按等待队列先后获取；非公平锁允许新来线程在条件允许时插队抢锁。 公平 ReentrantLock 在获取时查看队列中是否已有等待更久的前驱（例如 hasQueuedPredecessors）。；非公平路径允许新线程直接尝试 CAS 获取，减少交接空档，通常吞吐较好但等待时间分布可能更不稳定。；公平不是操作系统层面的绝对先来先服务；线程调度、取消、tryLock 等边界会影响顺序。。\",\"code\":\"\"},{\"id\":52,\"title\":\"非公平锁吞吐量为什么比公平锁大？\",\"node\":\"fair\",\"cat\":\"sync\",\"short\":\"非公平锁允许正在 CPU 上运行的线程直接获取刚释放的锁，减少唤醒队列头线程的交接空档。\",\"details\":[\"公平锁通常要照顾排队前驱；等待线程被唤醒后还需 OS 调度，可能产生锁空闲窗口。\",\"非公平锁允许“插队”，有时更能利用运行中的线程及缓存局部性。\",\"实际效果受锁持有时间、CPU 负载、竞争程度影响；非公平锁等待尾延迟可能更差。\"],\"example\":\"线程 B 正等待被唤醒，新来的运行中线程 C 恰好碰到空锁；非公平锁可让 C 直接拿到。\",\"trap\":\"非公平并不是不排队：快路径失败后也可能进入 AQS 队列。\",\"interview\":\"非公平锁允许正在 CPU 上运行的线程直接获取刚释放的锁，减少唤醒队列头线程的交接空档。 公平锁通常要照顾排队前驱；等待线程被唤醒后还需 OS 调度，可能产生锁空闲窗口。；非公平锁允许“插队”，有时更能利用运行中的线程及缓存局部性。；实际效果受锁持有时间、CPU 负载、竞争程度影响；非公平锁等待尾延迟可能更差。。\",\"code\":\"\"},{\"id\":53,\"title\":\"Synchronized是公平锁吗？\",\"node\":\"fair\",\"cat\":\"sync\",\"short\":\"Java 规范未对 synchronized 监视器获取顺序承诺公平性，不能依赖先来先得。\",\"details\":[\"竞争线程进入监视器的顺序由 JVM 实现与调度共同决定，通常不能视为严格 FIFO。\",\"Object.notify 也没有公平唤醒保证，收到通知的线程仍需竞争同一把锁。\",\"如果业务确实要求尽量公平，可以评估 new ReentrantLock(true)，但也要理解其限制和吞吐成本。\"],\"example\":\"多个线程依次打印“请求锁”，最终谁先进入 synchronized 块的顺序不受规范保证。\",\"trap\":\"不要把 synchronized 说成“天然 FIFO 队列公平锁”。\",\"interview\":\"Java 规范未对 synchronized 监视器获取顺序承诺公平性，不能依赖先来先得。 竞争线程进入监视器的顺序由 JVM 实现与调度共同决定，通常不能视为严格 FIFO。；Object.notify 也没有公平唤醒保证，收到通知的线程仍需竞争同一把锁。；如果业务确实要求尽量公平，可以评估 new ReentrantLock(true)，但也要理解其限制和吞吐成本。。\",\"code\":\"\"},{\"id\":54,\"title\":\"ReentrantLock是怎么实现公平锁的？\",\"node\":\"fair\",\"cat\":\"sync\",\"short\":\"公平 ReentrantLock 的获取路径先检查 AQS 队列是否存在更早等待的线程，再决定能否 CAS 获取空闲锁。\",\"details\":[\"公平获取通常要求 state==0、没有已排队前驱且 CAS 成功，才占有锁；同线程已持锁时依旧允许重入。\",\"竞争失败由 AQS 队列管理，unlock 后唤醒合适的后继节点重新竞争。\",\"new ReentrantLock(true) 指定公平策略，但无参 tryLock() 等操作不一定遵守同等公平限制。\"],\"example\":\"高竞争下公平策略减少插队倾向，但因为唤醒与交接开销，吞吐量可能不如非公平。\",\"trap\":\"公平锁的 FIFO 等待机制不代表每次 CPU 调度都严格按入队顺序发生。\",\"interview\":\"公平 ReentrantLock 的获取路径先检查 AQS 队列是否存在更早等待的线程，再决定能否 CAS 获取空闲锁。 公平获取通常要求 state==0、没有已排队前驱且 CAS 成功，才占有锁；同线程已持锁时依旧允许重入。；竞争失败由 AQS 队列管理，unlock 后唤醒合适的后继节点重新竞争。；new ReentrantLock(true) 指定公平策略，但无参 tryLock() 等操作不一定遵守同等公平限制。。\",\"code\":\"ReentrantLock lock = new ReentrantLock(true); // 公平策略\\nlock.lock();\\ntry { critical(); } finally { lock.unlock(); }\"},{\"id\":55,\"title\":\"什么情况会产生死锁问题？如何解决？\",\"node\":\"deadlock\",\"cat\":\"sync\",\"short\":\"死锁需要互斥、占有且等待、不可抢占、循环等待等条件形成环；排查与预防关键在统一锁顺序和减少嵌套。\",\"details\":[\"经典例子：线程 A 持锁 L1 等 L2，线程 B 持锁 L2 等 L1，双方互等无法推进。\",\"预防：统一所有资源的加锁顺序、使用 tryLock(timeout)、避免锁内未知回调和远程 IO。\",\"排查：jcmd Thread.print / jstack 观察线程状态和锁持有关系；结合业务超时及监控判断是否真死锁。\"],\"example\":\"两个账户转账无论转账方向都按账户 ID 升序获得两把锁，破坏循环等待条件。\",\"trap\":\"线程都处于 WAITING 不一定是死锁，也可能在正常等待任务或队列消息。\",\"interview\":\"死锁需要互斥、占有且等待、不可抢占、循环等待等条件形成环；排查与预防关键在统一锁顺序和减少嵌套。 经典例子：线程 A 持锁 L1 等 L2，线程 B 持锁 L2 等 L1，双方互等无法推进。；预防：统一所有资源的加锁顺序、使用 tryLock(timeout)、避免锁内未知回调和远程 IO。；排查：jcmd Thread.print / jstack 观察线程状态和锁持有关系；结合业务超时及监控判断是否真死锁。。\",\"code\":\"\"},{\"id\":56,\"title\":\"线程池怎么使用？\",\"node\":\"pool\",\"cat\":\"pool\",\"short\":\"用 ThreadPoolExecutor 配合有界队列、明确线程数、命名工厂、拒绝策略与关闭流程，避免随意创建不可控线程。\",\"details\":[\"使用 execute 提交无返回值 Runnable，使用 submit 提交 Callable/Future；用 Future.get 等待结果时要考虑阻塞与超时。\",\"选择核心/最大线程数、keepAlive、任务队列和拒绝策略，并评估任务类别、CPU 与下游容量。\",\"生命周期明确：shutdown 温和停止、awaitTermination 等待、必要时 shutdownNow 尝试取消；记录拒绝数和排队耗时。\"],\"example\":\"异步写审计任务使用单独有界线程池，避免占满业务请求池；后台线程名称有利于 jstack 排查。\",\"trap\":\"Executors 的无界队列或无界线程数可能在高压下积累内存/线程，不能默认安全。\",\"interview\":\"用 ThreadPoolExecutor 配合有界队列、明确线程数、命名工厂、拒绝策略与关闭流程，避免随意创建不可控线程。 使用 execute 提交无返回值 Runnable，使用 submit 提交 Callable/Future；用 Future.get 等待结果时要考虑阻塞与超时。；选择核心/最大线程数、keepAlive、任务队列和拒绝策略，并评估任务类别、CPU 与下游容量。；生命周期明确：shutdown 温和停止、awaitTermination 等待、必要时 shutdownNow 尝试取消；记录拒绝数和排队耗时。。\",\"code\":\"ThreadPoolExecutor pool = new ThreadPoolExecutor(\\n  4, 8, 30, TimeUnit.SECONDS,\\n  new ArrayBlockingQueue\\u003c>(100),\\n  Executors.defaultThreadFactory(),\\n  new ThreadPoolExecutor.AbortPolicy()\\n);\\ntry { pool.execute(this::runTask); } finally { pool.shutdown(); }\"},{\"id\":57,\"title\":\"介绍一下线程池的工作原理\",\"node\":\"poolflow\",\"cat\":\"pool\",\"short\":\"ThreadPoolExecutor 的提交顺序：先建核心线程 → 再尝试入队 → 队列不接收时增至最大线程 → 最后拒绝。\",\"details\":[\"worker 数小于 corePoolSize 时优先创建新工作线程，即使已有空闲线程；核心数达到后优先向 workQueue.offer 提交。\",\"当队列无法接收任务时尝试创建非核心线程，直到 maximumPoolSize；如果线程数满且无法入队，则触发拒绝处理。\",\"worker 循环从队列取任务执行；超过核心的空闲线程可在 keepAliveTime 到期退出，是否允许核心超时由配置决定。\"],\"example\":\"core=2,max=4,queue=2：连续提交 7 个耗时任务且不结束，前 2 建线程、再 2 入队、再 2 建线程，第 7 个拒绝。\",\"trap\":\"无界队列通常不满，max 可能永远发挥不了作用；SynchronousQueue 没有存储容量，分支又不同。\",\"interview\":\"ThreadPoolExecutor 的提交顺序：先建核心线程 → 再尝试入队 → 队列不接收时增至最大线程 → 最后拒绝。 worker 数小于 corePoolSize 时优先创建新工作线程，即使已有空闲线程；核心数达到后优先向 workQueue.offer 提交。；当队列无法接收任务时尝试创建非核心线程，直到 maximumPoolSize；如果线程数满且无法入队，则触发拒绝处理。；worker 循环从队列取任务执行；超过核心的空闲线程可在 keepAliveTime 到期退出，是否允许核心超时由配置决定。。\",\"code\":\"\"},{\"id\":58,\"title\":\"线程池的参数有哪些？\",\"node\":\"poolparams\",\"cat\":\"pool\",\"short\":\"核心七个参数：corePoolSize、maximumPoolSize、keepAliveTime、unit、workQueue、threadFactory、handler。\",\"details\":[\"corePoolSize/maximumPoolSize 决定线程数区间，keepAliveTime+unit 决定非核心空闲退出时间。\",\"workQueue 容量和类型改变扩容时机：ArrayBlockingQueue 有界、LinkedBlockingQueue 可有界/无界、SynchronousQueue 直接交接。\",\"线程工厂便于命名、异常处理与上下文控制；拒绝策略规定饱和/关闭后的任务处理方式。\"],\"example\":\"如果 core=8,max=32 且队列无界，通常最多只扩到约 8 个 worker，而不是自然扩到 32。\",\"trap\":\"配线程数时不能只看 CPU 核数，还要看等待/计算比例、限流和下游线程/连接上限。\",\"interview\":\"核心七个参数：corePoolSize、maximumPoolSize、keepAliveTime、unit、workQueue、threadFactory、handler。 corePoolSize/maximumPoolSize 决定线程数区间，keepAliveTime+unit 决定非核心空闲退出时间。；workQueue 容量和类型改变扩容时机：ArrayBlockingQueue 有界、LinkedBlockingQueue 可有界/无界、SynchronousQueue 直接交接。；线程工厂便于命名、异常处理与上下文控制；拒绝策略规定饱和/关闭后的任务处理方式。。\",\"code\":\"\"},{\"id\":59,\"title\":\"线程池工作队列满了有哪些拒接策略？\",\"node\":\"reject\",\"cat\":\"pool\",\"short\":\"标准策略有 AbortPolicy、CallerRunsPolicy、DiscardPolicy、DiscardOldestPolicy；适用性取决于任务是否允许丢失。\",\"details\":[\"AbortPolicy（常见默认）抛 RejectedExecutionException，让上游显式知晓饱和。\",\"CallerRunsPolicy 在执行器未关闭时让提交任务的线程自己执行，形成背压，但会拉长提交方延迟。\",\"DiscardPolicy 静默丢弃；DiscardOldestPolicy 丢队头再尝试提交，均可能造成数据丢失，重要业务不宜随意使用。\"],\"example\":\"日志非关键上报可以有明确降级策略；支付任务拒绝时应返回可重试结果而非静默丢弃。\",\"trap\":\"CallerRuns 并不总会执行任务：线程池关闭时可能直接不运行；不能当成绝对不丢任务保证。\",\"interview\":\"标准策略有 AbortPolicy、CallerRunsPolicy、DiscardPolicy、DiscardOldestPolicy；适用性取决于任务是否允许丢失。 AbortPolicy（常见默认）抛 RejectedExecutionException，让上游显式知晓饱和。；CallerRunsPolicy 在执行器未关闭时让提交任务的线程自己执行，形成背压，但会拉长提交方延迟。；DiscardPolicy 静默丢弃；DiscardOldestPolicy 丢队头再尝试提交，均可能造成数据丢失，重要业务不宜随意使用。。\",\"code\":\"\"},{\"id\":60,\"title\":\"有线程池参数设置的经验吗？\",\"node\":\"pooltune\",\"cat\":\"pool\",\"short\":\"线程池参数应由任务类型、请求到达速率、等待时间、下游承载量和压测数据共同决定。\",\"details\":[\"CPU 密集任务线程数可从可用核数附近开始；IO 密集可按 CPU×目标利用率×(1+等待/计算) 做初步估算。\",\"队列需要有界，并结合可接受排队延迟估容量；区分在线请求与离线任务，隔离线程池防止相互拖垮。\",\"监控活跃线程、队列长度、排队等待、任务耗时、拒绝数和 P99；负载上升时优先检查下游而非盲目加线程。\"],\"example\":\"8 核、任务 10ms 计算+90ms IO 等待，估算约几十个线程作为压测起点，仍要受 DB 连接池/接口限流制约。\",\"trap\":\"“IO 密集一定按 2N 配置”没有通用依据；无界队列只是推迟暴露容量问题。\",\"interview\":\"线程池参数应由任务类型、请求到达速率、等待时间、下游承载量和压测数据共同决定。 CPU 密集任务线程数可从可用核数附近开始；IO 密集可按 CPU×目标利用率×(1+等待/计算) 做初步估算。；队列需要有界，并结合可接受排队延迟估容量；区分在线请求与离线任务，隔离线程池防止相互拖垮。；监控活跃线程、队列长度、排队等待、任务耗时、拒绝数和 P99；负载上升时优先检查下游而非盲目加线程。。\",\"code\":\"\"},{\"id\":61,\"title\":\"核心线程数设置为0可不可以？\",\"node\":\"poolflow\",\"cat\":\"pool\",\"short\":\"可以，ThreadPoolExecutor 允许 corePoolSize=0（max>0）；但仍可能创建 worker 来执行已入队任务。\",\"details\":[\"有界/无界队列入队成功后若当前 worker 数为 0，线程池会尝试启动工作线程消费队列。\",\"SynchronousQueue 没有存储队列容量，交接失败可直接进入按 maximumPoolSize 创建线程的分支。\",\"0 核心 + 无界队列往往只有少量线程消费队列，并不等于自动扩到 max；空闲线程可超时退出。\"],\"example\":\"core=0,max=10,LinkedBlockingQueue 无界：任务入队后为避免无工人消费，会创建 worker，但不因队列变长自然增到 10。\",\"trap\":\"把 core 设置为 0 不等于“池中永远一个线程也没有”，也不是所有队列都能很好地利用 max。\",\"interview\":\"可以，ThreadPoolExecutor 允许 corePoolSize=0（max>0）；但仍可能创建 worker 来执行已入队任务。 有界/无界队列入队成功后若当前 worker 数为 0，线程池会尝试启动工作线程消费队列。；SynchronousQueue 没有存储队列容量，交接失败可直接进入按 maximumPoolSize 创建线程的分支。；0 核心 + 无界队列往往只有少量线程消费队列，并不等于自动扩到 max；空闲线程可超时退出。。\",\"code\":\"\"},{\"id\":62,\"title\":\"线程池种类有哪些？\",\"node\":\"pooltypes\",\"cat\":\"pool\",\"short\":\"常见有 Fixed、Cached、Single、Scheduled、WorkStealing（ForkJoinPool），还可使用显式 ThreadPoolExecutor 或虚拟线程执行器。\",\"details\":[\"Fixed 的 worker 固定，但工厂默认通常使用无界工作队列，任务过载可能积压。\",\"Cached 主要搭配 SynchronousQueue，线程数上限很大，突发任务可能创建过多线程；Scheduled 用于周期/延迟任务。\",\"ForkJoinPool 为细粒度可拆分任务提供工作窃取；虚拟线程每任务执行器适合大量阻塞任务，并不自动限流。\"],\"example\":\"下载文件并聚合结果可考虑可控的自定义线程池；定时清理任务考虑 ScheduledThreadPoolExecutor。\",\"trap\":\"“Executors 工厂方法都有安全默认队列上限”不对，需检查具体队列与线程数。\",\"interview\":\"常见有 Fixed、Cached、Single、Scheduled、WorkStealing（ForkJoinPool），还可使用显式 ThreadPoolExecutor 或虚拟线程执行器。 Fixed 的 worker 固定，但工厂默认通常使用无界工作队列，任务过载可能积压。；Cached 主要搭配 SynchronousQueue，线程数上限很大，突发任务可能创建过多线程；Scheduled 用于周期/延迟任务。；ForkJoinPool 为细粒度可拆分任务提供工作窃取；虚拟线程每任务执行器适合大量阻塞任务，并不自动限流。。\",\"code\":\"\"},{\"id\":63,\"title\":\"线程池一般是怎么用的？\",\"node\":\"pool\",\"cat\":\"pool\",\"short\":\"生产中通常按业务类型建立独立线程池，配置有界队列、拒绝策略、监控和正确关闭机制。\",\"details\":[\"区分 CPU/IO 任务，避免长时间阻塞任务拖住对延迟敏感的请求。\",\"将超时、取消、异常处理与日志、traceId 传播设计清楚；线程池复用线程时要清理 ThreadLocal。\",\"在服务关闭阶段有序停止、排空或显式处理未完成任务；用压测验证吞吐、等待和拒绝。\"],\"example\":\"在线订单请求池和报表导出池分开，报表积压不应让订单接口无响应。\",\"trap\":\"线程池不是无限并发许可证；任务不受控排队可能比直接拒绝更难排查。\",\"interview\":\"生产中通常按业务类型建立独立线程池，配置有界队列、拒绝策略、监控和正确关闭机制。 区分 CPU/IO 任务，避免长时间阻塞任务拖住对延迟敏感的请求。；将超时、取消、异常处理与日志、traceId 传播设计清楚；线程池复用线程时要清理 ThreadLocal。；在服务关闭阶段有序停止、排空或显式处理未完成任务；用压测验证吞吐、等待和拒绝。。\",\"code\":\"\"},{\"id\":64,\"title\":\"线程池和三个线程同时并发比有什么优势？\",\"node\":\"pool\",\"cat\":\"pool\",\"short\":\"任务规模固定且只有三个任务时差异不一定大；线程池优势在大量重复任务的复用、限流、排队与统一管理。\",\"details\":[\"反复创建平台线程有栈、调度与销毁成本，线程池能复用 worker。\",\"线程池明确最大并发数、任务队列、拒绝和监控，便于控制业务成本。\",\"对于单次短任务、少量固定线程，直接 new Thread 更简单也可能足够；不应盲目套池。\"],\"example\":\"每秒处理 1000 个小任务，更适合让一个已配置容量的线程池承接，而不是每个任务启动平台线程。\",\"trap\":\"线程池不会把三个 CPU 密集任务变成超过机器算力的“超并行”。\",\"interview\":\"任务规模固定且只有三个任务时差异不一定大；线程池优势在大量重复任务的复用、限流、排队与统一管理。 反复创建平台线程有栈、调度与销毁成本，线程池能复用 worker。；线程池明确最大并发数、任务队列、拒绝和监控，便于控制业务成本。；对于单次短任务、少量固定线程，直接 new Thread 更简单也可能足够；不应盲目套池。。\",\"code\":\"\"},{\"id\":65,\"title\":\"线程池用了哪些设计模式？\",\"node\":\"pool\",\"cat\":\"pool\",\"short\":\"可从工厂模式、生产者-消费者、Worker/命令模式、策略模式理解线程池，但设计模式只是帮助理解，不是严格源码分类题。\",\"details\":[\"Executors 或 ThreadFactory 提供创建逻辑，适合用工厂视角理解。\",\"任务作为 Runnable/Callable 命令被提交，工作线程从阻塞队列取任务执行，呈生产者-消费者结构。\",\"拒绝处理器 RejectedExecutionHandler 可替换不同处理策略，体现策略模式。\"],\"example\":\"不同业务采用相同 ThreadPoolExecutor 内核，但注入不同 ThreadFactory 和 RejectedExecutionHandler。\",\"trap\":\"不要只背“单例模式”，线程池并不天然是单例，是否共享实例是应用架构决策。\",\"interview\":\"可从工厂模式、生产者-消费者、Worker/命令模式、策略模式理解线程池，但设计模式只是帮助理解，不是严格源码分类题。 Executors 或 ThreadFactory 提供创建逻辑，适合用工厂视角理解。；任务作为 Runnable/Callable 命令被提交，工作线程从阻塞队列取任务执行，呈生产者-消费者结构。；拒绝处理器 RejectedExecutionHandler 可替换不同处理策略，体现策略模式。。\",\"code\":\"\"},{\"id\":66,\"title\":\"线程池中shutdown ()，shutdownNow()这两个方法有什么作用？\",\"node\":\"shutdown\",\"cat\":\"pool\",\"short\":\"shutdown 不再接收新任务但尝试执行已提交任务；shutdownNow 尝试中断运行任务并返回尚未开始的队列任务。\",\"details\":[\"shutdown 是平滑关闭：正在执行和队列中的已提交任务仍继续执行。\",\"shutdownNow 尝试中断 worker，并清空待运行队列返回 Runnable 列表，但不能保证任务立即结束。\",\"awaitTermination 用于等待终止，可设置超时；应结合中断响应、资源清理与业务补偿。\"],\"example\":\"应用停机先 shutdown→等待 10 秒，超时后 shutdownNow→处理返回的未执行任务。\",\"trap\":\"不要把 shutdownNow 理解为强制杀死一切线程，也不要假设队列任务一定全部执行完。\",\"interview\":\"shutdown 不再接收新任务但尝试执行已提交任务；shutdownNow 尝试中断运行任务并返回尚未开始的队列任务。 shutdown 是平滑关闭：正在执行和队列中的已提交任务仍继续执行。；shutdownNow 尝试中断 worker，并清空待运行队列返回 Runnable 列表，但不能保证任务立即结束。；awaitTermination 用于等待终止，可设置超时；应结合中断响应、资源清理与业务补偿。。\",\"code\":\"pool.shutdown();\\nif (!pool.awaitTermination(10, TimeUnit.SECONDS)) {\\n    List\\u003cRunnable> pending = pool.shutdownNow();\\n}\"},{\"id\":67,\"title\":\"execute 和 submit 有什么区别？\",\"node\":\"future\",\"cat\":\"pool\",\"short\":\"execute 接收 Runnable 不返回任务结果；submit 返回 Future，可观察结果/异常并取消。\",\"details\":[\"execute(Runnable) 是 Executor 的基础 API，任务异常由 worker/未捕获异常处理链等机制呈现。\",\"submit(Runnable/Callable) 由 ExecutorService 包装为 FutureTask 等，异常通常保存到 Future，需要 get() 才以 ExecutionException 形式感知。\",\"两者都可能受线程池拒绝策略影响；submit 返回 Future 并不表示任务已经完成。\"],\"example\":\"如果忽略 submit 返回的 Future，任务抛异常可能不容易在日志里显式出现，应主动观察。\",\"trap\":\"“submit 永远不会抛拒绝异常”错误；“execute 可以提交 Callable”也不成立。\",\"interview\":\"execute 接收 Runnable 不返回任务结果；submit 返回 Future，可观察结果/异常并取消。 execute(Runnable) 是 Executor 的基础 API，任务异常由 worker/未捕获异常处理链等机制呈现。；submit(Runnable/Callable) 由 ExecutorService 包装为 FutureTask 等，异常通常保存到 Future，需要 get() 才以 ExecutionException 形式感知。；两者都可能受线程池拒绝策略影响；submit 返回 Future 并不表示任务已经完成。。\",\"code\":\"pool.execute(() -> log());\\nFuture\\u003cInteger> f = pool.submit(() -> compute());\\nint x = f.get(); // 可能阻塞/抛 ExecutionException\"},{\"id\":68,\"title\":\"提交给线程池中的任务可以被撤回吗？\",\"node\":\"future\",\"cat\":\"pool\",\"short\":\"可以尝试用 Future.cancel() 取消，但无法保证任意时刻强制撤回已经运行的任务。\",\"details\":[\"取消前尚未执行时可使 Future 进入取消状态；是否能避免执行取决于竞争时序。\",\"cancel(true) 尝试中断正在执行任务的线程；cancel(false) 不请求中断，但不意味着任务一定能停。\",\"业务逻辑需支持中断/取消检查，必要时做好幂等和补偿；取消后 Future.get 会抛 CancellationException。\"],\"example\":\"批量请求超时后 cancel(true)，HTTP 调用是否立即中断仍取决于客户端实现。\",\"trap\":\"成功设置 Future 为取消状态不等于远程副作用已回滚。\",\"interview\":\"可以尝试用 Future.cancel() 取消，但无法保证任意时刻强制撤回已经运行的任务。 取消前尚未执行时可使 Future 进入取消状态；是否能避免执行取决于竞争时序。；cancel(true) 尝试中断正在执行任务的线程；cancel(false) 不请求中断，但不意味着任务一定能停。；业务逻辑需支持中断/取消检查，必要时做好幂等和补偿；取消后 Future.get 会抛 CancellationException。。\",\"code\":\"\"},{\"id\":69,\"title\":\"CompletableFuture 和 Future 有什么区别？\",\"node\":\"completable\",\"cat\":\"pool\",\"short\":\"Future 代表单个异步结果，主要用 get/cancel；CompletableFuture 支持回调、组合、异常恢复和并行编排。\",\"details\":[\"Future.get 通常阻塞等待，难直接声明“任务 A 完成后再 B、再汇总 C”。\",\"CompletableFuture 的 thenApply、thenCompose、thenCombine、allOf、exceptionally 等把依赖关系写成 DAG。\",\"默认 async 操作常使用 ForkJoinPool.commonPool，生产中可显式指定执行器、超时与异常处理，避免任务串联造成饥饿。\"],\"example\":\"同时获取价格与库存，通过 thenCombine 生成订单报价；失败时 exceptionally 生成可接受降级结果。\",\"trap\":\"CompletableFuture 不会让 IO 自动变为非阻塞；在线程池里调用阻塞式接口仍会占用线程。\",\"interview\":\"Future 代表单个异步结果，主要用 get/cancel；CompletableFuture 支持回调、组合、异常恢复和并行编排。 Future.get 通常阻塞等待，难直接声明“任务 A 完成后再 B、再汇总 C”。；CompletableFuture 的 thenApply、thenCompose、thenCombine、allOf、exceptionally 等把依赖关系写成 DAG。；默认 async 操作常使用 ForkJoinPool.commonPool，生产中可显式指定执行器、超时与异常处理，避免任务串联造成饥饿。。\",\"code\":\"CompletableFuture\\u003cInteger> a = CompletableFuture.supplyAsync(this::price, pool);\\nCompletableFuture\\u003cInteger> b = CompletableFuture.supplyAsync(this::stock, pool);\\nreturn a.thenCombine(b, (p,s) -> p * s);\"},{\"id\":70,\"title\":\"多线程打印奇偶数，怎么控制打印的顺序\",\"node\":\"sequence\",\"cat\":\"scene\",\"short\":\"用共享状态与 Condition 或 Semaphore 做明确交替，而不是依赖线程调度顺序或 sleep。\",\"details\":[\"两个线程共享 next 数值：奇数线程等待 next 为奇，偶数线程等待 next 为偶，打印后 next++ 再 signalAll。\",\"条件等待必须放 while 里；signal 后释放锁，确保另一方能继续；设置停止条件避免最后一个线程永久等待。\",\"也可用两个 Semaphore 传许可：odd 初始 1、even 初始 0，打印一项后释放对方。\"],\"example\":\"打印 1..10：奇数打印 1 后 signal 偶数，偶数打印 2 后 signal 奇数，最终顺序可控。\",\"trap\":\"单靠 Thread.sleep(10) 无法保证顺序；notify 任意选择线程也不适合精确轮转。\",\"interview\":\"用共享状态与 Condition 或 Semaphore 做明确交替，而不是依赖线程调度顺序或 sleep。 两个线程共享 next 数值：奇数线程等待 next 为奇，偶数线程等待 next 为偶，打印后 next++ 再 signalAll。；条件等待必须放 while 里；signal 后释放锁，确保另一方能继续；设置停止条件避免最后一个线程永久等待。；也可用两个 Semaphore 传许可：odd 初始 1、even 初始 0，打印一项后释放对方。。\",\"code\":\"Semaphore odd = new Semaphore(1), even = new Semaphore(0);\\n// 奇线程：odd.acquire(); print(i); even.release();\\n// 偶线程：even.acquire(); print(i); odd.release();\"},{\"id\":71,\"title\":\"单例模型既然已经用了synchronized，为什么还要在加volatile？\",\"node\":\"dcl\",\"cat\":\"scene\",\"short\":\"双重检查锁 DCL 只有创建分支持锁，第一次无锁读取 instance；volatile 确保安全发布并限制危险重排。\",\"details\":[\"创建对象涉及分配内存、初始化和发布引用；无锁读可能观察到非正确初始化的实例。\",\"volatile 写与后续读建立 happens-before，保证完成构造的结果对读取该引用的线程可见。\",\"若整个 getInstance 都 synchronized，可不依赖这个 DCL 的 volatile；但使用双检锁的快速路径时必须保证安全发布。\"],\"example\":\"DCL 用 volatile static Singleton instance，内层 synchronized 只在 instance==null 时创建一次。\",\"trap\":\"“只要有 synchronized，所有线程读取都安全”忽视了外层未加锁读取路径。\",\"interview\":\"双重检查锁 DCL 只有创建分支持锁，第一次无锁读取 instance；volatile 确保安全发布并限制危险重排。 创建对象涉及分配内存、初始化和发布引用；无锁读可能观察到非正确初始化的实例。；volatile 写与后续读建立 happens-before，保证完成构造的结果对读取该引用的线程可见。；若整个 getInstance 都 synchronized，可不依赖这个 DCL 的 volatile；但使用双检锁的快速路径时必须保证安全发布。。\",\"code\":\"private static volatile Singleton instance;\\nstatic Singleton getInstance() {\\n    if (instance == null) {\\n        synchronized (Singleton.class) {\\n            if (instance == null) instance = new Singleton();\\n        }\\n    }\\n    return instance;\\n}\"},{\"id\":72,\"title\":\"3个线程并发执行，1个线程等待这三个线程全部执行完在执行，怎么实现？\",\"node\":\"latch\",\"cat\":\"scene\",\"short\":\"可用 CountDownLatch(3)、Future.get/CompletableFuture.allOf 或 join，让汇总线程等全部任务完成。\",\"details\":[\"Latch：三任务 finally countDown()，汇总线程 await()；它只通知结束，不自动传播每个任务的异常。\",\"如果任务本来就在 ExecutorService 中，持有三个 Future 并分别 get() 可获取结果并处理异常。\",\"CompletableFuture.allOf(f1,f2,f3) 能声明依赖并进一步 thenRun/thenApply 做汇总。\"],\"example\":\"并发加载缓存、规则和字典，三个加载都结束后才切换服务状态为 READY。\",\"trap\":\"仅用 sleep 固定秒数不等于等三个任务完成，等待工具应处理异常和超时。\",\"interview\":\"可用 CountDownLatch(3)、Future.get/CompletableFuture.allOf 或 join，让汇总线程等全部任务完成。 Latch：三任务 finally countDown()，汇总线程 await()；它只通知结束，不自动传播每个任务的异常。；如果任务本来就在 ExecutorService 中，持有三个 Future 并分别 get() 可获取结果并处理异常。；CompletableFuture.allOf(f1,f2,f3) 能声明依赖并进一步 thenRun/thenApply 做汇总。。\",\"code\":\"CountDownLatch done = new CountDownLatch(3);\\nfor (int i=0;i\\u003c3;i++) pool.execute(() -> {\\n    try { job(); } finally { done.countDown(); }\\n});\\ndone.await();\"},{\"id\":73,\"title\":\"假设两个线程并发读写同一个整型变量，初始值为零，每个线程加 50 次，结果可能是什么？\",\"node\":\"increment\",\"cat\":\"scene\",\"short\":\"未同步的 int count++ 可能丢失更新；结果不保证等于 100，必须先明确假设，不能把竞态程序当成确定性算术题。\",\"details\":[\"count++ 是读取旧值、计算新值、写回三个步骤；两个线程读取同一个值就可能覆盖彼此更新。\",\"即使变量是 volatile，复合操作仍不原子；普通 int 的数据竞争还缺少 happens-before，可见性/观察顺序不作正确性保证。\",\"正确写法：synchronized 保护整个 ++，或 AtomicInteger.incrementAndGet；两线程均完成后通过 join 等待再读取最终值。\"],\"example\":\"两个线程各执行 50 次：都在读 count=0 后分别写 1，会丢失一次；后续交错不同，最终可能小于 100。\",\"trap\":\"不要无条件背“结果一定是 50~100”：乱序读取/延迟写入等复杂交错下，下界并非简单由每线程递增次数确定。\",\"interview\":\"未同步的 int count++ 可能丢失更新；结果不保证等于 100，必须先明确假设，不能把竞态程序当成确定性算术题。 count++ 是读取旧值、计算新值、写回三个步骤；两个线程读取同一个值就可能覆盖彼此更新。；即使变量是 volatile，复合操作仍不原子；普通 int 的数据竞争还缺少 happens-before，可见性/观察顺序不作正确性保证。；正确写法：synchronized 保护整个 ++，或 AtomicInteger.incrementAndGet；两线程均完成后通过 join 等待再读取最终值。。\",\"code\":\"AtomicInteger count = new AtomicInteger(0);\\n// 两个线程各调用 50 次 count.incrementAndGet();\\n// join 完再读：count.get() == 100\"}],\"sources\":[{\"name\":\"小林 coding · Java 并发面试题\",\"url\":\"https://xiaolincoding.com/interview/juc.html\"},{\"name\":\"Oracle · ThreadPoolExecutor\",\"url\":\"https://docs.oracle.com/en/java/javase/24/docs/api/java.base/java/util/concurrent/ThreadPoolExecutor.html\"},{\"name\":\"Oracle · Java 24 变更\",\"url\":\"https://docs.oracle.com/en/java/javase/24/migrate/significant-changes-jdk-24.html\"},{\"name\":\"OpenJDK · 虚拟线程 JEP 444\",\"url\":\"https://openjdk.org/jeps/444\"},{\"name\":\"Java 语言规范 · 内存模型\",\"url\":\"https://docs.oracle.com/javase/specs/jls/se24/html/jls-17.html\"}]};\n\nconst el=id=>document.getElementById(id);\nconst esc=s=>String(s??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst nodeById=new Map(DB.nodes.map(n=>[n.id,n]));\nconst catById=new Map(DB.cats.map(c=>[c.id,c]));\nconst categoryTitle={thread:'多线程',sync:'并发安全',pool:'线程池',scene:'场景题'};\nconst typeColors={'基础':'#5a86be','深入':'#8766d2','共享机制':'#20a481','实现对比':'#d18f36','实战应用':'#d66e83'};\nlet selected='cas', activeRoute=null, catFocus=null, expanded=false, questionFilter='all', questionSearch='', currentQ=0;\nconst storageKey='juc_atlas_progress_2026_v1';let completed=new Set();try{completed=new Set(JSON.parse(localStorage.getItem(storageKey)||'[]'))}catch(e){};\nconst counts=DB.nodes.reduce((a,n)=>(a[n.cat]=(a[n.cat]||0)+1,a),{});\nconst locations=new Map();\nfor(const [ix,cat] of DB.cats.entries()){\n const nn=DB.nodes.filter(n=>n.cat===cat.id);\n nn.forEach((n,i)=>locations.set(n.id,{x:90+ix*350,y:145+i*78}));\n}\nconst fullscreen={x:0,y:0,w:2180,h:1100};let view={...fullscreen};\nconst svg=el('map'); const ns='http://www.w3.org/2000/svg';let pan=null,suppress=false;\nfunction createSVG(name,attrs={},child){let x=document.createElementNS(ns,name);Object.entries(attrs).forEach(([k,v])=>x.setAttribute(k,v));if(child!==undefined)x.textContent=String(child);return x}\nfunction updateView(){svg.setAttribute('viewBox',[view.x,view.y,view.w,view.h].join(' '))}\nfunction visibleNodes(){if(activeRoute){const ids=new Set(DB.routes.find(r=>r.id===activeRoute).nodes);ids.add(selected);return DB.nodes.filter(n=>ids.has(n.id))}if(catFocus){const ids=new Set(DB.nodes.filter(n=>n.cat===catFocus).map(n=>n.id));DB.edges.forEach(e=>{if(ids.has(e.a))ids.add(e.b);if(ids.has(e.b))ids.add(e.a)});ids.add(selected);return DB.nodes.filter(n=>ids.has(n.id))}if(expanded)return DB.nodes;const ids=new Set(DB.nodes.filter(n=>n.core).map(n=>n.id));ids.add(selected);DB.edges.forEach(e=>{if(e.a===selected)ids.add(e.b);if(e.b===selected)ids.add(e.a)});return DB.nodes.filter(n=>ids.has(n.id))}\nfunction draw(){const nodes=visibleNodes(),ids=new Set(nodes.map(n=>n.id));let exists=ids.has(selected);if(!exists){selected=nodes[0]?.id||selected}const relevant=new Set([selected]);DB.edges.forEach(e=>{if(e.a===selected)relevant.add(e.b);if(e.b===selected)relevant.add(e.a)});const frag=document.createDocumentFragment();\n const defs=createSVG('defs');for(const [kind,color] of Object.entries(typeColors)){let id='arrow_'+kind;let mark=createSVG('marker',{id,markerWidth:8,markerHeight:8,refX:6,refY:3,orient:'auto',markerUnits:'strokeWidth'});mark.append(createSVG('path',{d:'M0 0L6 3L0 6',stroke:color,'stroke-width':1.1,fill:'none'}));defs.append(mark)}frag.append(defs);\n DB.cats.forEach((cat,i)=>{const x=65+i*350;frag.append(createSVG('rect',{x:x-5,y:66,width:303,height:1028,rx:17,fill:cat.color+'09',stroke:cat.color+'28'}));frag.append(createSVG('rect',{x:x+1,y:78,width:291,height:49,rx:12,fill:cat.color+'16',stroke:cat.color+'40'}));frag.append(createSVG('text',{x:x+13,y:98,class:'lane-title',fill:cat.color},cat.label));frag.append(createSVG('text',{x:x+13,y:115,class:'lane-help'},cat.help));});\n const drawn=DB.edges.filter(e=>ids.has(e.a)&&ids.has(e.b));drawn.forEach(e=>{let a=locations.get(e.a),b=locations.get(e.b);let x1=a.x+268,y1=a.y+25,x2=b.x,y2=b.y+25;let d;if(b.x\u003c=a.x){x1=a.x+136;x2=b.x+136;y1=a.y+53;y2=b.y+53;let side=(x1+x2)/2+35;d=`M${x1} ${y1}C${side} ${y1+48} ${side} ${y2+35} ${x2} ${y2}`}else{let delta=(x2-x1)*.44;d=`M${x1} ${y1}C${x1+delta} ${y1} ${x2-delta} ${y2} ${x2} ${y2}`}\n const highlight=e.a===selected||e.b===selected||activeRoute;\n let color=typeColors[e.kind]||'#8b98aa';let path=createSVG('path',{d,fill:'none',stroke:color,'stroke-width':highlight?2.5:1.25,'stroke-opacity':highlight?.83:.21,'marker-end':`url(#arrow_${e.kind})`,class:'edge'});path.dataset.from=e.a;path.dataset.to=e.b;path.addEventListener('click',ev=>{ev.stopPropagation();selected=e.b;renderAll();renderInspection(`关联：${e.why}`)});frag.append(path);\n });\n nodes.forEach(n=>{let p=locations.get(n.id),cat=catById.get(n.cat),sel=n.id===selected,linked=relevant.has(n.id),opacity=sel||linked||activeRoute?1:(expanded?.8:.97);let g=createSVG('g',{class:'node',role:'button',tabindex:'0','aria-label':n.title,opacity});g.dataset.node=n.id;\n g.append(createSVG('rect',{x:p.x,y:p.y,width:268,height:56,rx:10,class:'box',fill:sel?'#e8f2ff':n.core?'#fff':'#fbfcff',stroke:sel?'#3484d3':cat.color+(n.core?'88':'55'),'stroke-width':sel?2.8:n.core?1.5:1}));\n g.append(createSVG('rect',{x:p.x,y:p.y,width:5,height:56,rx:2,fill:cat.color}));\n let title=n.title.length>17?n.title.slice(0,16)+'…':n.title;let sub=n.sub.length>25?n.sub.slice(0,24)+'…':n.sub;\n g.append(createSVG('text',{x:p.x+14,y:p.y+23,class:'nodetxt'},title));g.append(createSVG('text',{x:p.x+14,y:p.y+42,class:'nodesub'},sub));\n if(n.core)g.append(createSVG('circle',{cx:p.x+251,cy:p.y+15,r:3.3,fill:cat.color}));\n g.addEventListener('click',e=>{e.stopPropagation();if(suppress)return;selected=n.id;renderAll()});\n g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selected=n.id;renderAll()}});\n frag.append(g) });svg.replaceChildren(frag);el('visibleCount').textContent=`当前显示 ${nodes.length} 个节点、${drawn.length} 条关联；共 67 节点 / 127 关联`;\n el('mapMode').textContent=activeRoute?'追问路线聚焦':catFocus?'主题聚焦':expanded?'全部节点':'核心节点 + 当前关联';\n el('expand').textContent=expanded?'− 只看核心节点':'＋ 展开全部';el('expand').classList.toggle('on',expanded);\n}\nfunction fitCurrent(margin=95){const all=visibleNodes();if(!all.length)return;const ps=all.map(n=>locations.get(n.id));let left=Math.min(...ps.map(p=>p.x)),right=Math.max(...ps.map(p=>p.x+268)),top=Math.min(...ps.map(p=>p.y)),bottom=Math.max(...ps.map(p=>p.y+56));\n const width=right-left+margin*2,height=bottom-top+margin*2,ratio=Math.max(.75,svg.clientWidth/Math.max(1,svg.clientHeight));let w=Math.max(width,height*ratio),h=w/ratio;if(h\u003cheight){h=height;w=h*ratio}view={x:(left+right-w)/2,y:(top+bottom-h)/2,w,h};updateView()}\nfunction zoomFromCenter(factor){\n const width=Math.max(350,Math.min(4200,view.w*factor));\n const height=view.h*width/view.w;\n view.x+=(view.w-width)/2;\n view.y+=(view.h-height)/2;\n view.w=width;\n view.h=height;\n updateView();\n}\nsvg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;svg.setPointerCapture(e.pointerId);pan={x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY};svg.classList.add('dragging')});\nsvg.addEventListener('pointermove',e=>{if(!pan)return;let rect=svg.getBoundingClientRect(),dx=e.clientX-pan.px,dy=e.clientY-pan.py;view.x-=dx*view.w/rect.width;view.y-=dy*view.h/rect.height;pan.px=e.clientX;pan.py=e.clientY;if(Math.abs(pan.x-e.clientX)+Math.abs(pan.y-e.clientY)>5)suppress=true;updateView()});\nfunction stopPan(){pan=null;svg.classList.remove('dragging');setTimeout(()=>suppress=false,0)}svg.addEventListener('pointerup',stopPan);svg.addEventListener('pointercancel',stopPan);\nel('zin').onclick=()=>zoomFromCenter(.8);\nel('zout').onclick=()=>zoomFromCenter(1.25);\nel('fit').onclick=()=>fitCurrent();\nel('expand').onclick=()=>{expanded=!expanded;activeRoute=null;catFocus=null;renderAll();fitCurrent()};\nel('clear').onclick=()=>{activeRoute=null;catFocus=null;expanded=false;selected='cas';renderAll();fitCurrent()};\nfunction focusRoute(id){activeRoute=id;catFocus=null;expanded=false;const ids=new Set(DB.routes.find(r=>r.id===id).nodes);selected=ids.has(selected)?selected:DB.routes.find(r=>r.id===id).nodes[0];renderAll();fitCurrent()}\nfunction focusNode(id){activeRoute=null;catFocus=null;selected=id;expanded=false;renderAll();fitNeighborhood(id)}\nfunction fitNeighborhood(id){const ids=new Set([id]);DB.edges.forEach(e=>{if(e.a===id)ids.add(e.b);if(e.b===id)ids.add(e.a)});const ps=[...ids].map(x=>locations.get(x)).filter(Boolean);if(!ps.length)return;let x1=Math.min(...ps.map(p=>p.x)),x2=Math.max(...ps.map(p=>p.x+268)),y1=Math.min(...ps.map(p=>p.y)),y2=Math.max(...ps.map(p=>p.y+56));let desiredW=x2-x1+190,ratio=Math.max(.8,svg.clientWidth/Math.max(1,svg.clientHeight)),desiredH=y2-y1+170;view.w=Math.max(desiredW,desiredH*ratio);view.h=view.w/ratio;view.x=(x1+x2-view.w)/2;view.y=(y1+y2-view.h)/2;updateView()}\nfunction initControls(){el('routeList').innerHTML=DB.routes.map((r,i)=>`\u003cbutton class=\"route ${activeRoute===r.id?'active':''}\" data-route=\"${esc(r.id)}\">\u003cspan class=\"route-mark\">${String(i+1).padStart(2,'0')}\u003c/span>\u003cspan>\u003cstrong>${esc(r.label)}\u003c/strong>\u003csmall>${esc(r.desc)}\u003c/small>\u003c/span>\u003c/button>`).join('');\n el('catstrip').innerHTML=`\u003cbutton class=\"catbtn ${catFocus===null?'on':''}\" data-cat=\"all\">全部主题\u003c/button>`+DB.cats.map(c=>`\u003cbutton class=\"catbtn ${catFocus===c.id?'on':''}\" data-cat=\"${c.id}\">${esc(c.label.slice(5))} · ${counts[c.id]}\u003c/button>`).join('');\n el('legend').innerHTML=Object.entries(typeColors).map(([k,color])=>`\u003cdiv class=\"leg\">\u003cspan class=\"legline\" style=\"border-color:${color}\">\u003c/span>${esc(k)}\u003c/div>`).join('');\n}\nel('routeList').addEventListener('click',e=>{let b=e.target.closest('[data-route]');if(b)focusRoute(b.dataset.route)});\nel('catstrip').addEventListener('click',e=>{let b=e.target.closest('[data-cat]');if(!b)return;catFocus=b.dataset.cat==='all'?null:b.dataset.cat;activeRoute=null;expanded=false;const catNodes=DB.nodes.filter(n=>n.cat===catFocus);if(catNodes.length)selected=catNodes.find(n=>n.core)?.id||catNodes[0].id;renderAll();fitCurrent()});\ndocument.querySelectorAll('[data-mech]').forEach(b=>b.onclick=()=>{focusRoute(b.dataset.mech);el('mapWorkspace').scrollIntoView({behavior:'smooth',block:'start'})});\nel('viewMap').onclick=()=>el('mapWorkspace').scrollIntoView({behavior:'smooth'});\nfunction renderInspection(context=''){let n=nodeById.get(selected),cat=catById.get(n.cat),links=DB.edges.filter(e=>e.a===selected||e.b===selected).map(e=>({...e,other:e.a===selected?e.b:e.a}));\n links.sort((a,b)=>['共享机制','深入','实现对比','基础','实战应用'].indexOf(a.kind)-['共享机制','深入','实现对比','基础','实战应用'].indexOf(b.kind));\n let qs=DB.questions.filter(q=>q.node===selected);let snippet=`\u003cdiv class=\"eyelabel\" style=\"color:${cat.color}\">${esc(cat.label)} · 知识节点\u003c/div>\u003ch2>${esc(n.title)}\u003c/h2>\u003cdiv style=\"font-size:11px;color:#8795aa\">${esc(n.sub)}\u003c/div>\u003cp>${esc(n.desc)}\u003c/p>\u003cdiv class=\"soft\">\u003cb>一句话抓重点\u003c/b>\u003cbr>${esc(n.key)}\u003c/div>`;\n if(context)snippet+=`\u003cdiv class=\"soft\" style=\"background:#eaf5ff\">\u003cb>这条连线代表：\u003c/b>\u003cbr>${esc(context)}\u003c/div>`;\n snippet+=`\u003ch3>与它共享机制或形成追问的节点（${links.length}）\u003c/h3>\u003cdiv class=\"rel-list\">`+links.slice(0,15).map(l=>`\u003cbutton class=\"relbtn\" data-navigate=\"${l.other}\">${esc(nodeById.get(l.other).title)}\u003cspan>${esc(l.kind)} · ${esc(l.why)}\u003c/span>\u003c/button>`).join('')+`\u003c/div>`;\n snippet+=`\u003ch3>对应小林原章题目（${qs.length}）\u003c/h3>`+(qs.length?qs.map(q=>`\u003cbutton class=\"qa-btn\" data-openq=\"${q.id-1}\">第 ${q.id} 题 · ${esc(q.title)} →\u003c/button>`).join(''):'\u003cdiv class=\"empty\">这是跨题目的共同基础节点，点击关联可跳到对应原题。\u003c/div>');\n el('inspector').innerHTML=snippet;el('inspector').querySelectorAll('[data-navigate]').forEach(b=>b.onclick=()=>focusNode(b.dataset.navigate));el('inspector').querySelectorAll('[data-openq]').forEach(b=>b.onclick=()=>openQuestion(+b.dataset.openq));}\nfunction renderAll(){initControls();draw();renderInspection()}\nfunction renderProgress(){completed=new Set([...completed].filter(i=>Number.isInteger(i)&&i>=0&&i\u003c73));let n=completed.size;el('progressText').innerHTML=`\u003cb>${n}/73\u003c/b> 已掌握`;el('studyProgress').textContent=`已掌握 ${n} / 73`;el('progressBar').style.width=(n/73*100)+'%';try{l y{history.replaceState(null,'','#q'+(currentQ+1))}catch(e){}}\nfunction closeModal(){el('modal').hidden=true;document.body.style.overflow='';try{if(location.hash.startsWith('#q'))history.replaceState(null,'',location.pathname+location.search)}catch(e){}if(lastActiveBeforeModal?.focus)lastActiveBeforeModal.focus()}\nfunction backToMap(){let id=DB.questions[currentQ].node;closeModal();focusNode(id);el('mapWorkspace').scrollIntoView({behavior:'smooth',block:'start'})}\nel('closeModal').onclick=closeModal;el('toGraph').onclick=backToMap;el('modal').addEventListener('click',e=>{if(e.target===el('modal'))closeModal()});\nfunction nearestQuestions(q){let peers=DB.questions.filter(t=>t.node===q.node&&t.id!==q.id).map(t=>t.id-1);let links=DB.edges.filter(e=>e.a===q.node||e.b===q.node).map(e=>e.a===q.node?e.b:e.a);let cross=DB.questions.filter(t=>links.includes(t.node)&&t.id!==q.id).map(t=>t.id-1);return [...new Set([...peers,...cross])].slice(0,7)}\nfunction drawArticle(){const q=DB.questions[currentQ],n=nodeById.get(q.node),links=DB.edges.filter(e=>e.a===q.node||e.b===q.node).slice(0,11),next=nearestQuestions(q);\n const html=`\u003cdiv class=\"kicker\">第 ${String(q.id).padStart(2,'0')} / 73 题 · ${categoryTitle[q.cat]}\u003c/div>\u003ch2>${esc(q.title)}\u003c/h2>\u003cdiv class=\"under\">关联概念：${esc(n.title)} · 独立撰写的学习整理，非原站答案复制\u003c/div>\n \u003csection class=\"answerbox quick\">\u003ch3>\u003cspan class=\"tag\">30 秒\u003c/span>先记住一句话\u003c/h3>\u003cp>${esc(q.short)}\u003c/p>\u003c/section>\n \u003csection class=\"answerbox\">\u003ch3>\u003cspan class=\"tag\">原理\u003c/span>一步步拆解\u003c/h3>\u003col>${q.details.map((x,i)=>`\u003cli>\u003cspan class=\"step\">${i+1}\u003c/span>\u003cspan>${esc(x)}\u003c/span>\u003c/li>`).join('')}\u003c/ol>\u003c/section>\n \u003csection class=\"answerbox\">\u003ch3>\u003cspan class=\"tag\">案例\u003c/span>结合代码与业务场景\u003c/h3>\u003cp>${esc(q.example)}\u003c/p>${q.code?`\u003cpre class=\"samplecode\">\u003ccode>${esc(q.code)}\u003c/code>\u003c/pre>`:''}\u003c/section>\n \u003csection class=\"answerbox warning\">\u003ch3>\u003cspan class=\"tag\">误区\u003c/span>面试不要这样回答\u003c/h3>\u003cp>${esc(q.trap)}\u003c/p>\u003c/section>\n \u003csection class=\"answerbox interview\">\u003ch3>\u003cspan class=\"tag\">口述\u003c/span>可以这样完整回答\u003c/h3>\u003cp>${esc(q.interview)}\u003c/p>\u003c/section>\n \u003csection class=\"answerbox\">\u003ch3>\u003cspan class=\"tag\">关联\u003c/span>共享底层机制与深入追问\u003c/h3>\u003cdiv class=\"chips\">\u003cbutton class=\"chip\" data-go-node=\"${q.node}\">◎ ${esc(n.title)}\u003csmall>返回知识网络\u003c/small>\u003c/button>${links.map(l=>{let id=l.a===q.node?l.b:l.a;return `\u003cbutton class=\"chip\" data-go-node=\"${id}\">${esc(nodeById.get(id).title)}\u003csmall>${esc(l.kind)} · ${esc(l.why)}\u003c/small>\u003c/button>`}).join('')}\u003c/div>\u003c/section>\n \u003csection class=\"answerbox\">\u003ch3>\u003cspan class=\"tag\">下一步\u003c/span>把这几道原题连起来学\u003c/h3>\u003cdiv class=\"chips\">${next.map(j=>`\u003cbutton class=\"chip\" data-openq=\"${j}\">第 ${j+1} 题：${esc(DB.questions[j].title)}\u003c/button>`).join('')||'\u003cspan class=\"empty\">先回到知识图选择相邻原理问题。\u003c/span>'}\u003c/div>\u003c/section>\n \u003cdiv class=\"studyactions\">\u003cbutton id=\"prev\" ${currentQ===0?'disabled':''}>← 上一题\u003c/button>\u003cbutton id=\"next\" ${currentQ===72?'disabled':''}>下一题 →\u003c/button>\u003cbutton class=\"learn ${completed.has(currentQ)?'done':''}\" id=\"markDone\">${completed.has(currentQ)?'✓ 已掌握 · 点击取消':'✓ 标记此题已掌握'}\u003c/button>\u003c/div>\u003cdiv class=\"study-source\">\u003ca href=\"https://xiaolincoding.com/interview/juc.html\" target=\"_blank\" rel=\"noopener noreferrer\">↗ 查看小林 coding 原章\u003c/a> · 版本提醒：锁升级、虚拟线程等实现细节须按所用 JDK 核对。\u003c/div>`;\n el('article').innerHTML=html;el('article').scrollTop=0;\n el('article').querySelectorAll('[data-openq]').forEach(b=>b.onclick=()=>openQuestion(+b.dataset.openq));\n el('article').querySelectorAll('[data-go-node]').forEach(b=>b.onclick=()=>{let id=b.dataset.goNode;closeModal();focusNode(id);el('mapWorkspace').scrollIntoView({behavior:'smooth'})});\n el('prev').onclick=()=>openQuestion(currentQ-1);el('next').onclick=()=>openQuestion(currentQ+1);el('markDone').onclick=()=>{completed.has(currentQ)?completed.delete(currentQ):completed.add(currentQ);renderProgress();drawArticle();renderRail();renderQIndex()};\n}\nfunction renderRail(){let term=el('railSearch').value.trim().toLowerCase();let last=null,markup='';DB.questions.forEach(q=>{if(term&&![q.title,q.short,q.node,...q.details].join(' ').toLowerCase().includes(term))return;if(q.cat!==last){markup+=`\u003cdiv class=\"railcap\">${categoryTitle[q.cat]}\u003c/div>`;last=q.cat}markup+=`\u003cbutton class=\"railq ${currentQ===q.id-1?'active':''} ${completed.has(q.id-1)?'done':''}\" data-openq=\"${q.id-1}\">\u003cspan class=\"indexno\">${completed.has(q.id-1)?'✓':q.id}\u003c/span>\u003cspan>${esc(q.title)}\u003c/span>\u003c/button>`});el('railnav').innerHTML=markup||'\u003cdiv class=\"empty\">没有找到相关题目。\u003c/div>';el('railnav').querySelector('.railq.active')?.scrollIntoView({block:'nearest'})}\nel('railSearch').addEventListener('input',renderRail);el('railnav').addEventListener('click',e=>{let b=e.target.closest('[data-openq]');if(b)openQuestion(+b.dataset.openq)});\nwindow.addEventListener('keydown',e=>{if(el('modal').hidden)return;if(e.key==='Escape'){closeModal();return}if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')openQuestion(Math.min(72,currentQ+1));if(e.key==='ArrowLeft')openQuestion(Math.max(0,currentQ-1))});\nrenderAll();fitCurrent();renderProgress();renderQIndex();\nif(/^#q\\d+$/.test(location.hash)){let q=Number(location.hash.substring(2));if(q>0&&q\u003c=73)openQuestion(q-1)}\n\n\u003c/script>\u003c/body>\u003c/html>","questions":[{"title":"Java 的内存模型（JMM）介绍一下","topic":"Java 内存模型 JMM"},{"title":"java多线程是什么？需要注意什么？","topic":"线程 / 并发 / 并行"},{"title":"java里面的线程和操作系统的线程一样吗？","topic":"虚拟线程"},{"title":"使用多线程要注意哪些问题？","topic":"线程
