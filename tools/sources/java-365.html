cInteger> 存 Integer 引用，写入 int 时由自动装箱转换。数组在运行期保有元素类型，泛型集合主要依靠编译期检查。\",\"ArrayList 支持高效按索引读取，HashSet 适合成员判断和去重，HashMap 通过键寻找值。集合的具体语义决定了业务代码如何使用它。\"],\"example\":\"固定的七日计数可以用 int[7]。处理数量未知的事件用 ArrayList\\u003cEvent>，按用户 ID 累计则用 HashMap\\u003cLong, Integer>。\",\"pitfall\":\"List 接口把增删定义为可选操作。Arrays.asList 返回的列表能替换元素，但它的大小与数组长度绑定。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Collection.html\",\"anchor\":\"%E6%95%B0%E7%BB%84%E4%B8%8E%E9%9B%86%E5%90%88%E5%8C%BA%E5%88%AB-%E7%94%A8%E8%BF%87%E5%93%AA%E4%BA%9B\",\"node\":\"array\",\"chapter\":0,\"follow\":[2,19]},{\"n\":2,\"title\":\"怎样按接口职责理解 Java 集合框架？\",\"short\":\"集合框架由接口、实现和通用算法组成。Collection 这条分支管理一组元素，常见子接口有 List、Set、Queue 和 Deque。Map 独立表达键值映射，通过三个视图把键、值和条目暴露成集合。\",\"details\":[\"List 表达位置与顺序，通常允许重复。Set 表达元素唯一。Queue 表达取出规则，既可按先进先出取元素，也可以像 PriorityQueue 那样由优先级决定队头。Deque 允许两端操作。\",\"Map 对每个键至多保留一条映射。keySet、values 和 entrySet 分别暴露键、值及键值对，values 是 Collection，因为不同键可以对应相同的值。\",\"接口约定能做什么，实现决定成本和顺序保证。Java 21 还引入 SequencedCollection、SequencedSet 和 SequencedMap，统一表达有明确相遇顺序的集合及其首尾访问。\"],\"example\":\"处理购物车时，List 保存展示顺序，Set 跟踪已选 ID，Map 按商品 ID 索引商品详情，Deque 支持从头部取待处理任务。\",\"pitfall\":\"把对象声明成 Map 或 Set 不会得到某种固定顺序。需要保持插入顺序或按键排序时，要选择提供相应契约的实现。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/package-summary.html\",\"anchor\":\"%E8%AF%B4%E8%AF%B4java%E4%B8%AD%E7%9A%84%E9%9B%86%E5%90%88\",\"node\":\"interfaces\",\"chapter\":0,\"follow\":[4,22]},{\"n\":3,\"title\":\"Java 中常用的线程安全集合有哪些？\",\"short\":\"可以按操作需求选型。并发键值访问用 ConcurrentHashMap，需要排序用 ConcurrentSkipListMap。读多写少的列表用 CopyOnWriteArrayList，生产者和消费者之间用 BlockingQueue。同步包装和 Vector、Hashtable 也提供不同粒度的同步。\",\"details\":[\"Collections.synchronizedList、synchronizedSet、synchronizedMap 返回同步包装。线程要通过同一包装访问原集合。遍历或多步业务操作通常还要在同一把锁内完成。\",\"ConcurrentHashMap 提供 putIfAbsent、compute、merge 等原子的单键操作。CopyOnWriteArrayList 的迭代器使用旧数组快照。ConcurrentLinkedQueue 提供非阻塞的先进先出队列。\",\"BlockingQueue 在队列为空或有界队列已满时可以让消费方或生产方等待。单个集合方法的安全性和跨方法业务约束的原子性应分别判断。\"],\"example\":\"并发统计商品浏览量，可用 ConcurrentHashMap 的 counts.merge(id, 1, Integer::sum)，避免读出旧值后再写回时丢失计数。\",\"pitfall\":\"ConcurrentHashMap 的线程安全只覆盖其映射及所承诺的操作。将普通 ArrayList 放进 value 后，多个线程仍需要协调对该 List 的写入。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/package-summary.html\",\"anchor\":\"java%E4%B8%AD%E7%9A%84%E7%BA%BF%E7%A8%8B%E5%AE%89%E5%85%A8%E7%9A%84%E9%9B%86%E5%90%88%E6%98%AF%E4%BB%80%E4%B9%88\",\"node\":\"sync\",\"chapter\":0,\"follow\":[13,53]},{\"n\":4,\"title\":\"Collection 接口和 Collections 工具类分别负责什么？\",\"short\":\"Collection\\u003cE> 是管理一组元素的接口，约定 size、contains、iterator 等实例方法，并允许实现选择是否支持变更操作。Collections 是静态工具类，提供排序、搜索、交换以及同步、只读等包装。\",\"details\":[\"当参数声明为 Collection\\u003cOrder> 时，方法可以接收多种集合实现并依赖公共契约。要按索引访问，参数应要求 List 或采用迭代器。\",\"Collections.sort、reverse 等算法需要具体的列表能力，例如排序要求列表支持元素替换。synchronizedList 和 unmodifiableList 返回以原集合为后盾的包装。\",\"查看具体方法的前置条件。Collections.binarySearch 要求数据已按相同的比较规则排好序，Collections.copy 要求目标列表的 size 足够。\"],\"example\":\"接口参数用 Collection\\u003cString> 接收订单号。要得到排序后的副本，可以先构造一个 ArrayList，再调用 Collections.sort。\",\"pitfall\":\"Collections.unmodifiableList 原地保留了底层列表。持有底层引用的一方仍能改动它，改动会反映到包装的读取结果里。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Collections.html\",\"anchor\":\"collections%E5%92%8Ccollection%E7%9A%84%E5%8C%BA%E5%88%AB\",\"node\":\"utilities\",\"chapter\":0,\"follow\":[2,7]},{\"n\":5,\"title\":\"遍历集合时，索引、迭代器和 Stream 怎样选？\",\"short\":\"只读顺序遍历常用增强 for 或 forEach。需要受支持的遍历中删除，显式使用 Iterator。ListIterator 支持双向访问和可选的编辑。随机访问列表可用下标循环，过滤、映射、聚合可用 Stream。\",\"details\":[\"对实现 Iterable 的集合，增强 for 使用迭代器。遍历 LinkedList 时，顺序前进可以复用当前位置。用 get(i) 反复定位会把整次扫描拖到 O(n²)。\",\"Iterator.remove 删除最近一次 next 返回的元素，且每次 next 最多对应一次 remove。ListIterator 还提供 previous、set 和 add 等操作，实际支持情况由实现决定。\",\"Map 同时需要键和值时，遍历 entrySet 或用 Map.forEach。Stream 适合组合多步数据处理，若并行处理且要求有序输出，可以考虑 forEachOrdered。\"],\"example\":\"遍历订单时，只收集状态可用增强 for。删除已取消的订单可用受支持的 Iterator.remove 或一次 removeIf。计算已支付订单金额总和可用 Stream。\",\"pitfall\":\"对普通可变集合使用增强 for 时，直接调用原集合的 add 或 remove 可能破坏正在执行的迭代。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Iterator.html\",\"anchor\":\"%E9%9B%86%E5%90%88%E9%81%8D%E5%8E%86%E7%9A%84%E6%96%B9%E6%B3%95%E6%9C%89%E5%93%AA%E4%BA%9B\",\"node\":\"iter\",\"chapter\":0,\"follow\":[6,28]},{\"n\":6,\"title\":\"快速失败、快照迭代和弱一致迭代分别承诺什么？\",\"short\":\"ArrayList 这类集合的 fail-fast 迭代器会尽力检测意外的结构修改并报 ConcurrentModificationException。CopyOnWriteArrayList 读创建迭代器时的快照，ConcurrentHashMap 则允许遍历与更新重叠，结果可能反映其中一部分更新。\",\"details\":[\"以 ArrayList 为例，创建迭代器时保存 expectedModCount，部分迭代操作将它与列表的 modCount 比较。用受支持的迭代器 remove 后，迭代器会同步自己的预期修改次数。\",\"CopyOnWriteArrayList 的迭代器固定读取旧数组，新增、删除和替换不会改动本次看到的元素引用。快照中的可变对象依然可能被修改。\",\"ConcurrentHashMap 迭代器是弱一致的，可以返回迭代开始时或之后观察到的条目。弱一致结果不能用作整个映射在同一时刻的业务快照。\"],\"example\":\"创建迭代器后，另一处代码增加一个监听器。ArrayList 迭代可能报错，CopyOnWriteArrayList 当前迭代不包含新监听器，ConcurrentHashMap 的类似新增条目则可能被遍历看到。\",\"pitfall\":\"单线程也会触发 ConcurrentModificationException。并发时即使没有抛异常，也无法由此推断访问安全或结果完整。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayList.html\",\"anchor\":\"fail-fast-%E6%98%AF%E4%BB%80%E4%B9%88-%E7%BA%BF%E7%A8%8B%E5%AE%89%E5%85%A8%E7%9A%84%E9%9B%86%E5%90%88%E9%81%8D%E5%8E%86%E5%B0%B1%E4%B8%80%E5%AE%9A%E8%83%BD%E7%9C%8B%E5%88%B0%E6%9C%80%E6%96%B0%E6%95%B0%E6%8D%AE%E5%90%97\",\"node\":\"failfast\",\"chapter\":0,\"follow\":[9,17]},{\"n\":7,\"title\":\"只读视图、不可修改副本和深层不可变有什么区别？\",\"short\":\"Collections.unmodifiableList 给现有列表套一层只读视图，底层修改仍可见。List.copyOf 返回不随来源集合后续变化的不可修改列表，List.of 可直接构造这种列表。若元素可变，还需要单独处理元素的共享。\",\"details\":[\"只读视图会拒绝通过视图进行增删和替换，读取则委托给后备集合。适合让调用方查看组件内部列表的实时状态。\",\"从 Java 10 起，List.copyOf 返回按输入迭代顺序排列的不可修改结果，并拒绝 null 元素。对于合适的不可修改输入，运行库可能复用已有实例，业务应依赖内容语义。\",\"列表结构固定只约束元素的数量、位置和引用。共享元素若有可变字段，字段变化依然可能被看到。要保证深层不可变，需要使用不可变元素或在明确边界内转换、复制。\"],\"example\":\"内部列表初值为 [A]。调用 List.copyOf 和 Collections.unmodifiableList 后，在内部列表加入 B，前者仍为 [A]，后者读取到 [A, B]。\",\"pitfall\":\"Arrays.asList 的大小固定，但 set 可以改变元素，同时修改原数组。把固定大小当作不可修改会遗漏这个别名。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Collection.html\",\"anchor\":\"%E4%B8%8D%E5%8F%AF%E4%BF%AE%E6%94%B9%E9%9B%86%E5%90%88%E5%92%8C%E4%B8%8D%E5%8F%AF%E5%8F%98%E9%9B%86%E5%90%88%E6%9C%89%E4%BB%80%E4%B9%88%E5%8C%BA%E5%88%AB\",\"node\":\"views\",\"chapter\":0,\"follow\":[19,20]},{\"n\":8,\"title\":\"ArrayList、LinkedList、Vector 和写时复制列表如何选型？\",\"short\":\"ArrayList 用动态数组支持高效随机访问和摊还常数时间尾加。LinkedList 用双向链表支持两端操作，按下标访问需定位。Vector 为多数单个操作加同步。CopyOnWriteArrayList 用快照读和复制写换取读多写少时的遍历稳定性。\",\"details\":[\"ArrayList 按索引取值是 O(1)。中间插入或删除通常移动后续引用。LinkedList 中间改动要先找到节点，已持有迭代位置时链接改动才是 O(1)。\",\"Vector 和 ArrayList 都用可增长数组。Vector 的单方法同步可保护单次操作，检查后再执行等跨调用约束需要合并到同一个同步范围。\",\"CopyOnWriteArrayList 的迭代器不会被后来变更干扰。改变内容的写入通常要复制数组，频繁写入时，拷贝、分配及快照保留旧数组的成本会增加。\"],\"example\":\"读写都在同一线程且需按索引读取，选 ArrayList。跨线程频繁通知但很少注册或注销监听器时，CopyOnWriteArrayList 的快照迭代有用。\",\"pitfall\":\"只凭 List 接口推断所有 get(i) 都是 O(1)，会让链表遍历和按位置访问出现性能问题。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/List.html\",\"anchor\":\"%E8%AE%B2%E4%B8%80%E4%B8%8Bjava%E9%87%8C%E9%9D%A2list%E7%9A%84%E5%87%A0%E7%A7%8D%E5%AE%9E%E7%8E%B0-%E5%87%A0%E7%A7%8D%E5%AE%9E%E7%8E%B0%E6%9C%89%E4%BB%80%E4%B9%88%E4%B8%8D%E5%90%8C\",\"node\":\"list\",\"chapter\":1,\"follow\":[11,12]},{\"n\":9,\"title\":\"遍历 List 时怎样安全地删除、插入或替换？\",\"short\":\"在同一线程遍历可修改 List 时，用受支持的 Iterator.remove 删除当前元素，用 ListIterator.add 或 set 编辑。批量过滤可用 removeIf。结构修改必须与迭代协议一致，并发访问还需要选合适的实现或加锁。\",\"details\":[\"使用增强 for 遍历 ArrayList 时，调用 list.remove 或 list.add 会绕过迭代器。迭代器继续运行时可能检测到结构改变，或出现跳项等不符合预期的结果。\",\"对支持变更的 ListIterator，可以在 next 或 previous 后执行 remove 或 set，并可用 add 在当前游标处插入。应遵守方法规定的调用顺序。\",\"ArrayList 的 set 替换元素引用，通常不视为结构修改。并发下仍有可见性和语义问题。CopyOnWriteArrayList 允许通过列表方法更新，但它的快照迭代器不支持任何编辑。\"],\"example\":\"删掉值为 0 的全部元素，可以让迭代器在读到 0 时删除当前元素。若只是对现有项做转换，可用 List.replaceAll。\",\"code\":\"List\\u003cInteger> values = new ArrayList\\u003c>(List.of(1, 0, 0, 2));\\nfor (Iterator\\u003cInteger> it = values.iterator(); it.hasNext();) {\\n    if (it.next() == 0) it.remove();\\n}\\nSystem.out.println(values); // [1, 2]\",\"pitfall\":\"Iterator.remove 是可选操作。List.of、Arrays.asList 的结构删除和 CopyOnWriteArrayList 迭代器的 remove 都可能因不支持而失败。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ListIterator.html\",\"anchor\":\"list%E5%8F%AF%E4%BB%A5%E4%B8%80%E8%BE%B9%E9%81%8D%E5%8E%86%E4%B8%80%E8%BE%B9%E4%BF%AE%E6%94%B9%E5%85%83%E7%B4%A0%E5%90%97\",\"node\":\"failfast\",\"chapter\":1,\"follow\":[6,21]},{\"n\":10,\"title\":\"已知 List 下标时，删除操作能有多快？\",\"short\":\"直接调用 remove(index) 可删除指定位置并返回旧元素。ArrayList 找位置是 O(1)，但维持顺序需要移动下标之后的引用。LinkedList 先遍历找到节点，再以 O(1) 调整链接。删除位置和是否已定位决定主要成本。\",\"details\":[\"ArrayList.remove(index) 检查下标，再移动右侧 n - index - 1 项，末尾旧槽位置空。删最后一项无需移动，删靠前位置时成本接近线性。\",\"LinkedList 按下标查找时可以从较近的一端开始。已处于正确位置的 ListIterator 可以直接删除最近返回的节点。\",\"如果已经确定业务可以打乱顺序，可在随机访问列表中先用末项覆盖目标下标，再删末项。若要删除连续区间并保持顺序，ArrayList 的 subList(from, to).clear() 可一次完成尾部移动。\"],\"example\":\"从 [A, B, C, D] 删除下标 1，保序结果为 [A, C, D]。若这是只关心成员的候选池，可用 D 覆盖 B 后删除尾部，得到 [A, D, C]。\",\"pitfall\":\"交换尾项会改变相遇顺序和元素位置。外部还依赖位置、分页结果或稳定顺序时，保留正常的 remove(index) 语义。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/ArrayList.html#remove(int)\",\"anchor\":\"list%E5%A6%82%E4%BD%95%E5%BF%AB%E9%80%9F%E5%88%A0%E9%99%A4%E6%9F%90%E4%B8%AA%E6%8C%87%E5%AE%9A%E4%B8%8B%E6%A0%87%E7%9A%84%E5%85%83%E7%B4%A0\",\"node\":\"arraylist\",\"chapter\":1,\"follow\":[11,21]},{\"n\":11,\"title\":\"ArrayList 和 LinkedList 的结构、复杂度与线程安全有何区别？\",\"short\":\"ArrayList 底层是可增长的数组，随机访问快，插删中部通常需要搬移引用。LinkedList 底层是双向链表，首尾操作方便，按下标读写需遍历。两者都要求调用方协调并发结构修改。\",\"details\":[\"ArrayList 在容量足够时尾加为 O(1)，扩容会复制已有引用，连续尾加的摊还成本为 O(1)。数组槽位相邻通常有较好的局部性。\",\"LinkedList 每项额外保存前驱和后继。已知节点或迭代器位置时可以常数时间改链接，按下标定位则需要沿链遍历。\",\"两者的迭代器都可能尽力报告意外结构修改。如果有多个线程共享且至少一个会结构性修改，应使用一致的外部同步策略，或选并发集合。\"],\"example\":\"用 for (int i = 0; i \\u003c list.size(); i++) 逐项 get 时，ArrayList 是线性扫描，LinkedList 会为每个 i 重新定位。改用增强 for 可让 LinkedList 从当前节点直接前进。\",\"pitfall\":\"数组中的引用相邻并不意味着这些引用指向的对象也在内存中相邻。局部性优势首先来自访问引用槽位。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/LinkedList.html\",\"anchor\":\"arraylist%E5%92%8Clinkedlist%E7%9A%84%E5%8C%BA%E5%88%AB-%E5%93%AA%E4%B8%AA%E9%9B%86%E5%90%88%E6%98%AF%E7%BA%BF%E7%A8%8B%E5%AE%89%E5%85%A8%E7%9A%84\",\"node\":\"linkedlist\",\"chapter\":1,\"follow\":[15,16]},{\"n\":12,\"title\":\"同为动态数组，Vector 与 ArrayList 有何差异？\",\"short\":\"两者都可以按下标高效访问。ArrayList 适合调用方控制并发的场景，Vector 的许多方法用内置监视器同步。它们还采用不同的增长策略，Vector 支持指定增长步长。\",\"details\":[\"Vector 的 get、add 等常用单次操作使用同一实例的监视器协调。多个调用之间仍允许其他线程插入操作。ArrayList 没有内建的这种同步。\",\"Vector 的 capacityIncrement 为正时优先按步长增长，默认值为零时通常按两倍增长。OpenJDK 的 ArrayList 常见优先增长量约为旧容量的一半，具体行为还取决于最低需求及边界条件。\",\"Vector 还保留 elements() 这样的旧式 Enumeration API。它与 iterator() 的行为有别，后者采用尽力检测结构修改的 fail-fast 语义。\"],\"example\":\"线程 A 看到 Vector 中还有任务，线程 B 先取走最后一个。A 随后执行 remove(0) 仍可能越界。检查和取出必须作为一个组合操作处理。\",\"pitfall\":\"把同步方法分别调用一遍，只保证这些方法各自使用锁。维护业务不变量时，需要保护覆盖整个读改写过程的范围。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Vector.html\",\"anchor\":\"arraylist%E5%92%8Cvector-%E5%8C%BA%E5%88%AB%E6%98%AF%E4%BB%80%E4%B9%88\",\"node\":\"vector\",\"chapter\":1,\"follow\":[13,64]},{\"n\":13,\"title\":\"多线程共享 ArrayList 时有哪些可行的同步方式？\",\"short\":\"可以让所有访问经过 Collections.synchronizedList 包装，也可以由调用方用同一把锁保护读取、写入及组合操作。读多写少且适合快照遍历时可改用 CopyOnWriteArrayList。只需发布只读数据时，可发布不可修改副本。\",\"details\":[\"同步包装仍引用原 ArrayList。共享范围内只暴露包装，遍历时按文档对返回的包装加锁，并把检查后添加等多步逻辑也放在同一个锁内。\",\"外部锁必须覆盖所有读写路径，保证线程间的可见性和原子性。较长的业务处理可以先在锁内复制一份列表，再在锁外处理快照。\",\"CopyOnWriteArrayList 的正常遍历不需要额外锁，写入成本通常随列表大小增长。若按条件只添加一次，可考虑用 addIfAbsent 表达对应的原子操作。\"],\"example\":\"同步包装常用于多个线程访问同一列表的遗留代码。并发注册、低频修改且经常遍历的监听器表，可以使用 CopyOnWriteArrayList。\",\"code\":\"List\\u003cString> shared = Collections.synchronizedList(new ArrayList\\u003c>());\\nsynchronized (shared) {\\n    for (String value : shared) {\\n        System.out.println(value);\\n    }\\n}\",\"pitfall\":\"同步包装和原列表指向相同数据。绕过包装用原引用访问，会破坏约定的锁保护范围。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Collections.html#synchronizedList(java.util.List)\",\"anchor\":\"arraylist%E7%BA%BF%E7%A8%8B%E5%AE%89%E5%85%A8%E5%90%97-%E6%8A%8Aarraylist%E5%8F%98%E6%88%90%E7%BA%BF%E7%A8%8B%E5%AE%89%E5%85%A8%E6%9C%89%E5%93%AA%E4%BA%9B%E6%96%B9%E6%B3%95\",\"node\":\"sync\",\"chapter\":1,\"follow\":[14,17]},{\"n\":14,\"title\":\"ArrayList 的 add 在并发时怎样丢失更新？\",\"short\":\"append 要读 size、检查容量、写数组，再完成 size 更新。ArrayList 没有将这些动作放进一个同步操作。两个线程可能拿到同一个槽位并互相覆盖，扩容与写入交错也会破坏数组和长度的一致性。\",\"details\":[\"假设 size 为 5，两个线程都读到 5，都准备写下标 5。两个 add 都可能返回成功，最后只有一次写入留在槽位中，size 也只到 6。\",\"OpenJDK 8 的尾加使用 elementData[size++] = e，后缀自增取旧下标并在数组赋值之前完成自增。OpenJDK 21 的辅助方法先写 elementData[s] 再把 size 设为 s + 1。两种写法都没有原子的追加协议。\",\"扩容竞争和无同步读写还可能引起观察到旧值、槽位为 null、元素丢失或下标越界，具体结果依赖线程交错与实现版本。\"],\"example\":\"两个线程都试图向已含五项的共享列表追加一项。结束后长度应为七，但某次执行可能只留下六项，说明一次更新被覆盖。\",\"pitfall\":\"即便把 size 的单次读写做成可见或原子操作，容量检查、数组引用替换和元素发布也仍需要共同的协调机制。\",\"ref\":\"https://github.com/openjdk/jdk21u/blob/master/src/java.base/share/classes/java/util/ArrayList.java\",\"anchor\":\"%E4%B8%BA%E4%BB%80%E4%B9%88arraylist%E4%B8%8D%E6%98%AF%E7%BA%BF%E7%A8%8B%E5%AE%89%E5%85%A8%E7%9A%84-%E5%85%B7%E4%BD%93%E6%9D%A5%E8%AF%B4%E6%98%AF%E5%93%AA%E9%87%8C%E4%B8%8D%E5%AE%89%E5%85%A8\",\"node\":\"list-race\",\"chapter\":1,\"follow\":[13,16]},{\"n\":15,\"title\":\"哪些访问模式适合 ArrayList，哪些适合 LinkedList？\",\"short\":\"大量按下标读取、遍历和尾部追加，ArrayList 通常更合适。LinkedList 适合使用它的双向链接能力，例如已经持有迭代位置的局部插删，或同时需要 List 接口与双端队列操作。\",\"details\":[\"ArrayList 的索引查找直接，顺序遍历访问相邻引用槽。若预估批量数据规模，可以预留容量减少复制。\",\"LinkedList 按下标改动需要定位，频繁访问任意下标通常不占优势。已经持有 ListIterator 时，可在游标附近插删而无需重新扫描。\",\"业务只需要栈或普通双端队列时，ArrayDeque 也是相应的队列实现，使用数组并提供首尾操作。实现选择要结合随机访问、遍历、插删位置和并发约束。\"],\"example\":\"要把查询结果按索引分页展示，通常用 ArrayList。一个已经用 ListIterator 扫描到目标位置、并要连续在附近插删的处理器，可以利用 LinkedList 的局部编辑成本。\",\"pitfall\":\"在 LinkedList 上反复执行 add(size() / 2, e)，每次都需要重新定位中点，不能只计算链接改动的时间。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/LinkedList.html\",\"anchor\":\"arraylist-%E5%92%8C-linkedlist-%E7%9A%84%E5%BA%94%E7%94%A8%E5%9C%BA%E6%99%AF\",\"node\":\"linkedlist\",\"chapter\":1,\"follow\":[8,67]},{\"n\":16,\"title\":\"ArrayList 什么时候扩容，新的容量怎样计算？\",\"short\":\"ArrayList 新增元素时若现有容量不足，就分配更大的数组并复制现有元素引用。OpenJDK 21 的无参构造通常在第一次追加时分配十个槽位，之后普通增长优先增加约一半旧容量，还要满足本次实际需求。\",\"details\":[\"size 是已经存入的元素数，capacity 是底层数组长度。预留容量不增加 size，也不能据此用 set 写入尚不存在的下标。\",\"以 OpenJDK 21 的默认列表为例，逐个尾加时容量通常按 10、15、22、33 演进。一次 addAll 或 ensureCapacity 要求更多空间时，最低所需容量可能主导计算。显式 new ArrayList\\u003c>(0) 和无参构造的空数组标记也不同。\",\"扩容本身需要复制引用，成本为 O(n)。增长因子使一系列追加的摊还成本为 O(1)。容量估计准确时可用构造器或 ensureCapacity 减少中间扩容。\"],\"example\":\"已知要导入大约 1000 条记录，可以用 new ArrayList\\u003cRecord>(1000) 预留槽位。构造后 size 仍为 0，第一条记录要用 add 写入。\",\"pitfall\":\"约 1.5 倍属于 OpenJDK 的实现细节。ArrayList 的公开文档保证追加的摊还复杂度，代码不应依赖每次扩容后的确切槽位数。\",\"ref\":\"https://github.com/openjdk/jdk21u/blob/master/src/java.base/share/classes/java/util/ArrayList.java\",\"anchor\":\"arraylist%E7%9A%84%E6%89%A9%E5%AE%B9%E6%9C%BA%E5%88%B6%E8%AF%B4%E4%B8%80%E4%B8%8B\",\"node\":\"list-grow\",\"chapter\":1,\"follow\":[14,44]},{\"n\":17,\"title\":\"CopyOnWriteArrayList 如何让读和写安全并发？\",\"short\":\"写方互斥执行，在通常的变更路径上构造新数组并一次发布。读方读取当前数组引用，迭代器持有创建时的数组快照。复制只涉及引用，改变元素对象自身的状态仍要按该对象的并发约定处理。\",\"details\":[\"OpenJDK 21 用内置监视器保护写操作，OpenJDK 8 使用 ReentrantLock。底层数组引用通过 volatile 发布，使普通读取可以看到已发布的完整数组。\",\"同一次迭代只使用一个数组版本。调用 List 方法完成新写入后，旧迭代器继续按旧版本前进，迭代器的 remove、set 和 add 不受支持。分开的 get、size 调用则可能各自看到不同版本。\",\"修改内容一般需要分配并复制数组，成本与大小相关。持有旧迭代器还会延长旧数组的生命周期。读多写少、允许本轮读取旧版本的任务更适合这种取舍。\"],\"example\":\"通知正在遍历监听器 A、B 时，另一线程新增 C。本轮通知仍遍历 A、B，新建的下一轮迭代器才可能读到 C。\",\"code\":\"var listeners = new CopyOnWriteArrayList\\u003c>(List.of(\\\"A\\\", \\\"B\\\"));\\nIterator\\u003cString> current = listeners.iterator();\\nlisteners.add(\\\"C\\\");\\ncurrent.forEachRemaining(System.out::println); // A, B\",\"pitfall\":\"快照保存元素引用。如果 A 是共享可变对象，旧迭代器仍可能观察到 A 内部字段的修改，具体可见性取决于元素的同步方式。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/CopyOnWriteArrayList.html\",\"anchor\":\"%E7%BA%BF%E7%A8%8B%E5%AE%89%E5%85%A8%E7%9A%84-list-copyonwritearraylist%E6%98%AF%E5%A6%82%E4%BD%95%E5%AE%9E%E7%8E%B0%E7%BA%BF%E7%A8%8B%E5%AE%89%E5%85%A8%E7%9A%84\",\"node\":\"cow\",\"chapter\":1,\"follow\":[6,13]},{\"n\":18,\"title\":\"为什么 List\\u003cint> 编译失败，List\\u003cInteger> 却能接收 int？\",\"short\":\"Java 的泛型类型实参要求引用类型，所以 List\\u003cint> 不合法。使用 List\\u003cInteger> 后，把 int 交给 add 会自动装箱，把取出的 Integer 赋给 int 会自动拆箱。\",\"details\":[\"Integer 是 int 对应的包装类型，ArrayList\\u003cInteger> 保存的是 Integer 引用。调用 list.add(42) 通常会被编译成先调用 Integer.valueOf(42) 再传给列表。\",\"从列表取元素后的拆箱相当于从包装对象读取基本类型值。元素若为 null，这一步会抛 NullPointerException。\",\"int[] 自己属于引用类型，因此 List\\u003cint[]> 合法，每个列表元素是一整个数组。大量数值可用原生数组存储，或在计算过程中用 IntStream 避免逐个包装。\"],\"example\":\"用 List\\u003cInteger> 收集动态数量的整数。若要在单个集合里保存多组原始整型数据，可用 List\\u003cint[]>，这两种元素粒度不同。\",\"code\":\"List\\u003cInteger> values = new ArrayList\\u003c>();\\nvalues.add(42);\\nint answer = values.get(0);\\nList\\u003cint[]> rows = Collections.singletonList(new int[]{1, 2});\",\"pitfall\":\"装箱只在符合语言转换规则的值传递处发生。它既不会让 List\\u003cint> 成为合法类型，也不会自动把 int[] 转成 Integer[]。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html#jls-4.5.1\",\"anchor\":\"list-%E9%87%8C%E9%9D%A2%E5%A1%AB%E5%9F%BA%E6%9C%AC%E6%95%B0%E6%8D%AE%E7%B1%BB%E5%9E%8B%E4%B8%BA%E4%BB%80%E4%B9%88%E4%BC%9A%E6%8A%A5%E9%94%99\",\"node\":\"boxing\",\"chapter\":1,\"follow\":[19,21]},{\"n\":19,\"title\":\"数组和 List 如何互转，什么时候会共享底层数据？\",\"short\":\"对象数组转列表可以用 Arrays.asList，它返回共享原数组的固定大小视图。需要独立且可增删时再用 new ArrayList\\u003c>(...)。列表转对象数组可用 toArray(String[]::new)，基本类型数组需要显式装箱或拆箱。\",\"details\":[\"Arrays.asList(array) 的 set 会写回原数组，直接改数组槽也会在列表里可见。new ArrayList\\u003c>(view) 复制元素引用并拥有独立容器，元素对象本身仍可能共享。\",\"不带参数的 toArray() 产生 Object[]。Java 11 起可以传数组构造器获取所需的运行期数组类型，更早版本可用 list.toArray(new String[0])。\",\"Arrays.asList(new int[]{1, 2}) 会得到含一个 int[] 元素的 List\\u003cint[]>。想得到 List\\u003cInteger>，可用 Arrays.stream(ints).boxed()。反向可用 mapToInt 转成 int[]，应先明确 null 如何处理。\"],\"example\":\"把来自外部接口的 String[] 交给会追加元素的业务方法前，先构造独立的 ArrayList。输出需要 String[] 时，再调用带类型的 toArray。\",\"code\":\"String[] original = {\\\"a\\\", \\\"b\\\"};\\nList\\u003cString> view = Arrays.asList(original);\\nview.set(0, \\\"x\\\"); // original[0] 也是 x\\nList\\u003cString> copy = new ArrayList\\u003c>(view);\\ncopy.add(\\\"c\\\");\\nString[] output = copy.toArray(String[]::new);\",\"pitfall\":\"把无参 toArray() 返回的 Object[] 强制转换成 String[]，即使元素全是 String，也可能因数组的运行期类型不匹配而失败。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Arrays.html#asList(T...)\",\"anchor\":\"list%E5%92%8C%E6%95%B0%E7%BB%84%E5%A6%82%E4%BD%95%E4%BA%92%E7%9B%B8%E8%BD%AC%E6%8D%A2\",\"node\":\"views\",\"chapter\":1,\"follow\":[7,18]},{\"n\":20,\"title\":\"ArrayList.subList 返回区间视图还是副本？\",\"short\":\"subList(from, to) 返回左闭右开的区间视图。通过它进行受支持的修改会反映到原列表，原列表的非结构性替换也能反映到视图。需要独立保存区间时，用 new ArrayList\\u003c>(subList) 或 List.copyOf(subList)。\",\"details\":[\"视图把自己的相对位置映射回原列表。subList(1, 4) 含原下标 1、2、3。可以用 subList(from, to).clear() 表达从原列表删除一段。\",\"取得视图后，如果绕过该视图在后备列表上执行结构修改，List 契约规定视图语义未定义。ArrayList 的部分操作可能检测并抛出 ConcurrentModificationException。\",\"长期保留视图也可能保留整个原列表和底层数据。复制得到独立的容器可解除这种结构依赖，但不会复制各个元素对象。\"],\"example\":\"从 [A, B, C, D] 获取 subList(1, 3)，得到 [B, C]。调用视图 set(0, X) 后，原列表变成 [A, X, C, D]。\",\"code\":\"var original = new ArrayList\\u003c>(List.of(\\\"A\\\", \\\"B\\\", \\\"C\\\", \\\"D\\\"));\\nList\\u003cString> middle = original.subList(1, 3);\\nList\\u003cString> snapshot = new ArrayList\\u003c>(middle);\\nmiddle.clear();\\n// original 为 [A, D]，snapshot 为 [B, C]\",\"pitfall\":\"把 subList 当独立的分页结果长期缓存，会留下原列表的依赖。来源后续会改动时，复制区间更符合独立结果的语义。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/List.html#subList(int,int)\",\"anchor\":\"arraylist-%E7%9A%84-sublist-%E6%98%AF%E5%A4%8D%E5%88%B6%E4%BA%86%E4%B8%80%E4%BB%BD%E6%96%B0%E5%88%97%E8%A1%A8%E5%90%97\",\"node\":\"views\",\"chapter\":1,\"follow\":[7,9]},{\"n\":21,\"title\":\"为什么 List\\u003cInteger>.remove(1) 会删第二项？\",\"short\":\"List 同时有 remove(int index) 和 remove(Object value)。字面量 1 的类型是 int，会选中按下标删除的重载。若想删第一个等于数值 1 的元素，调用 remove(Integer.valueOf(1))。\",\"details\":[\"重载在编译期按实参类型决定。int 实参可以直接匹配 remove(int)，无需先装箱。Integer 实参则可以向上转换成 Object，因此先匹配按值删除。\",\"remove(int) 返回删除的元素，并要求下标在有效范围内。remove(Object) 找到第一个相等元素后删除，返回是否找到并删除。\",\"若要删除所有匹配值，可以使用受支持的 removeIf。将静态声明改为 Collection\\u003cInteger> 时，接口上只暴露 remove(Object)，同样的 int 字面量调用会变成装箱后按值删除。\"],\"example\":\"原列表为 [1, 7, 1]。按下标删除 1，移除的是 7。按对象值删除 1，则移除第一个数值为 1 的元素。\",\"code\":\"var byIndex = new ArrayList\\u003c>(List.of(1, 7, 1));\\nbyIndex.remove(1); // [1, 1]\\nvar byValue = new ArrayList\\u003c>(List.of(1, 7, 1));\\nbyValue.remove(Integer.valueOf(1)); // [7, 1]\",\"pitfall\":\"按值删除只移除第一个匹配项。业务要求去掉所有重复值时，应明确使用过滤或批量删除。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/List.html#remove(int)\",\"anchor\":\"list-%E4%B8%AD%E7%9A%84-remove-1-%E5%88%A0%E9%99%A4%E7%9A%84%E6%98%AF%E4%B8%8B%E6%A0%87%E8%BF%98%E6%98%AF%E5%85%83%E7%B4%A0\",\"node\":\"overload\",\"chapter\":1,\"follow\":[9,18]},{\"n\":22,\"title\":\"什么时候用 List，什么时候用 Set？\",\"short\":\"List 表示有位置的元素序列，允许重复，可按下标访问。Set 表示互不重复的元素集合，接口没有按下标访问的约定。保留顺序并允许重复选 List，主要做去重或成员检测选 Set，再决定是否需要插入顺序或排序。\",\"details\":[\"List 的索引从 0 开始。两份 List 相等要求元素数量、对应位置的元素都相等。get(index) 的速度由实现决定，ArrayList 通常是常数时间，LinkedList 要沿链表定位。\",\"两份普通 Set 相等取决于成员是否相同，与遍历顺序无关。HashSet 无顺序承诺，LinkedHashSet 通常按插入顺序遍历，TreeSet 按比较规则遍历。\",\"两类接口都允许实现对增删、null 等操作设置限制。例如 List.of 和 Set.of 都不允许 null，后者还会拒绝重复输入。\"],\"example\":\"访问日志需要保留用户的多次点击，放入 List。活动报名只关心哪些用户来过，并要保留首次报名顺序，可把用户 ID 放入 LinkedHashSet。\",\"pitfall\":\"List 的有序指位置和遍历次序，无自动排序含义。Set 的去重也与遍历顺序是两个维度。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Set.html\",\"anchor\":\"java-%E9%9B%86%E5%90%88%E4%B8%AD-list-%E5%92%8C-set%E5%8C%BA%E5%88%AB%E6%98%AF%E4%BB%80%E4%B9%88\",\"node\":\"set\",\"chapter\":2,\"follow\":[23,26]},{\"n\":23,\"title\":\"HashSet 怎样判重，自定义对象为什么可能漏去重？\",\"short\":\"HashSet 把元素存作内部 HashMap 的键。加入时先用 hashCode 定位，再在候选桶内用引用相同或 equals 判定是否已有同一键。相等对象必须有相同的哈希码，存入后也要保持参与判等的字段稳定。\",\"details\":[\"内部 Map 的值只用一个固定占位对象，因此相同元素再次加入只会遇到已有键，HashSet.add 返回 false。哈希碰撞只说明候选位置相同，equals 仍负责区分元素。\",\"默认 Object.equals 比较对象身份。若希望两个不同实例只要用户 ID 一致就去重，须用这个业务身份定义 equals 和 hashCode，或直接存储 ID。Java 16 起可用 record 表达按组件相等的值对象。\",\"如果对象在集合里修改了参与判等的字段，现有节点仍带着插入时的哈希。contains 或 remove 可能定位到别处，遍历却仍能见到该对象。\"],\"example\":\"批量导入时可以用只含 id 的 record 作去重元素。两个独立创建的 UserKey(42) 比较相等，第二次 add 返回 false。\",\"code\":\"record UserKey(long id) {}\\nSet\\u003cUserKey> seen = new HashSet\\u003c>();\\nseen.add(new UserKey(42)); // true\\nseen.add(new UserKey(42)); // false\",\"pitfall\":\"只重写 equals，或误写成 equals(UserKey) 而没有覆盖 equals(Object)，都可能使去重结果偏离业务定义。用 @Override 让编译器检查签名。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/HashSet.html\",\"anchor\":\"hashset-%E6%80%8E%E4%B9%88%E4%BF%9D%E8%AF%81%E5%85%83%E7%B4%A0%E4%B8%8D%E9%87%8D%E5%A4%8D-%E8%87%AA%E5%AE%9A%E4%B9%89%E5%AF%B9%E8%B1%A1%E4%B8%BA%E4%BB%80%E4%B9%88%E6%9C%89%E6%97%B6%E5%8E%BB%E9%87%8D%E5%A4%B1%E8%B4%A5\",\"node\":\"hashset\",\"chapter\":2,\"follow\":[27,41]},{\"n\":24,\"title\":\"已有一个 Set，怎样按想要的顺序遍历？\",\"short\":\"只需某次排序时，把元素复制到 List 后排序，也可以用流的 sorted 得到有序结果。若后续插入时也要维持排序并支持范围查询，则用带自然顺序或 Comparator 的 TreeSet。\",\"details\":[\"复制到 List 保留原 Set 已有的所有元素。排序比较结果为 0 时，列表中这些元素仍在，具体并列顺序可用额外的比较字段明确。\",\"TreeSet 按比较结果为 0 判断元素是否重复。自定义比较器若只按名字或分数比较，可能把多个原有元素合并，需要根据业务身份设计比较规则。\",\"LinkedHashSet 记录进入集合的顺序。若输入来自无顺序承诺的 HashSet，直接构造 LinkedHashSet 只固定当前遍历结果，无法恢复历史上的插入顺序。\"],\"example\":\"对一批去重后的用户名按长度、再按字典序显示，先复制为列表。后续如果还要查某个名字区间，则考虑 TreeSet。\",\"code\":\"List\\u003cString> sorted = new ArrayList\\u003c>(names);\\nsorted.sort(Comparator.comparingInt(String::length)\\n    .thenComparing(Comparator.naturalOrder()));\",\"pitfall\":\"对 TreeSet 不可直接套用只负责展示分组的比较器。如果比较相等的元素也要全部展示，列表排序更符合需求。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/TreeSet.html\",\"anchor\":\"%E5%A6%82%E4%BD%95%E5%AF%B9set%E6%8E%92%E5%BA%8F\",\"node\":\"treeset\",\"chapter\":2,\"follow\":[26,27]},{\"n\":25,\"title\":\"Set 的唯一性由什么规则保证？\",\"short\":\"Set 对外存的是元素。哈希实现用哈希码缩小查找范围，再用 equals 判等。树形实现依赖比较结果是否为 0。Null 支持、遍历顺序和并发语义由具体实现决定。\",\"details\":[\"Set 接口规定不能有两个相等的元素。对支持添加的常规实现，已有元素再次 add 会返回 false，原元素仍留在集合里。\",\"HashSet 借助 HashMap 的唯一键约束实现这一点。LinkedHashSet 保留同一套去重规则，再维护遍历次序。TreeSet 借助有序映射维护元素，比较规则应与 equals 一致以符合一般 Set 契约。\",\"工厂方法的失败策略另有规定。例如 Set.of 遇到重复参数会抛 IllegalArgumentException，且不接受 null。HashSet 可以保存一个 null。\"],\"example\":\"去重商品编码只需要常规 HashSet。需要在去重后按编码范围搜索时，可以用自然顺序的 TreeSet\\u003cString>。\",\"pitfall\":\"把两个对象映射到同一个哈希值，只会让它们参与同一批候选比较。它们是否重复仍要看 equals。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Set.html\",\"anchor\":\"set%E9%9B%86%E5%90%88%E6%9C%89%E4%BB%80%E4%B9%88%E7%89%B9%E7%82%B9-%E5%A6%82%E4%BD%95%E5%AE%9E%E7%8E%B0key%E6%97%A0%E9%87%8D%E5%A4%8D%E7%9A%84\",\"node\":\"set\",\"chapter\":2,\"follow\":[23,29]},{\"n\":26,\"title\":\"按插入顺序遍历与按元素排序，分别该选哪个 Set？\",\"short\":\"保留首次加入的顺序用 LinkedHashSet。需要按元素值或自定义规则排序用 TreeSet。HashSet 可以做去重，但调用方不能依赖它的当前遍历次序。\",\"details\":[\"LinkedHashSet 在哈希结构之外维护双向链表，所以查重方式和 HashSet 一致，遍历却按确定的遇见顺序进行。普通 add 再次加入已有元素时，它的位置不变。\",\"TreeSet 在加入时通过自然顺序或 Comparator 找到位置，基本的 add、remove 和 contains 操作有 O(log n) 的保证，也支持 floor、ceiling 和范围视图。\",\"JDK 21 中 LinkedHashSet 实现 SequencedSet，addFirst 和 addLast 可显式把元素移到端点。早期版本要先删除再加入才能让已有元素移动到末尾。\"],\"example\":\"按 B、A、B、C 的顺序加入 LinkedHashSet，得到 B、A、C。按同样顺序加入使用自然顺序的 TreeSet，得到 A、B、C。\",\"pitfall\":\"LinkedHashSet 的普通 add 保留已有元素位置。如果要按最近操作更新顺序，需要显式调整。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/LinkedHashSet.html\",\"anchor\":\"%E6%9C%89%E5%BA%8F%E7%9A%84set%E6%98%AF%E4%BB%80%E4%B9%88-%E8%AE%B0%E5%BD%95%E6%8F%92%E5%85%A5%E9%A1%BA%E5%BA%8F%E7%9A%84%E9%9B%86%E5%90%88%E6%98%AF%E4%BB%80%E4%B9%88\",\"node\":\"orderedset\",\"chapter\":2,\"follow\":[24,50]},{\"n\":27,\"title\":\"两个对象 equals 为 false，为什么 TreeSet 可能只保存一个？\",\"short\":\"TreeSet 沿比较器或 Comparable 的结果查找元素。compare(a, b) 或 compareTo 返回 0 就占用同一个排序位置，因此后加入的对象会被拒绝。要让 TreeSet 符合一般 Set 契约，排序等价关系应与 equals 一致。\",\"details\":[\"如果比较器只比较分数，那么两位同分学生会得到 0，即便 equals 能根据身份区分两人。这个规则也作用于 contains 和 remove，查询或删除可命中比较等价的另一个实例。\",\"若业务要求保留同分对象，应加入可区分身份的后续比较字段，并确认比较器和业务相等定义一致。若只想把对象分组或展示时并列，Map\\u003c分数, List\\u003c学生>> 或列表排序更直接。\",\"自然顺序也可能与 equals 不一致。BigDecimal.compareTo 会把数值相同的 1.0 和 1.00 视作同一排序位置，BigDecimal.equals 还比较 scale。\"],\"example\":\"依次向 TreeSet\\u003cBigDecimal> 加入 1.0、1.00，size 为 1，第二次 add 返回 false。相同输入放入 HashSet\\u003cBigDecimal> 后 size 为 2。\",\"code\":\"Set\\u003cBigDecimal> ordered = new TreeSet\\u003c>();\\nordered.add(new BigDecimal(\\\"1.0\\\"));\\nordered.add(new BigDecimal(\\\"1.00\\\")); // false\\nSystem.out.println(ordered.size()); // 1\",\"pitfall\":\"修改已入树对象的排序字段会破坏它在树中的定位。若确需改排序字段，先删除旧元素，再以更新后的值重新加入。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/TreeSet.html\",\"anchor\":\"treeset-%E4%B8%BA%E4%BB%80%E4%B9%88%E4%BC%9A%E6%8A%8A%E4%B8%A4%E4%B8%AA%E4%B8%8D%E5%90%8C%E7%9A%84%E5%AF%B9%E8%B1%A1%E5%BD%93%E6%88%90%E9%87%8D%E5%A4%8D%E5%85%83%E7%B4%A0\",\"node\":\"comparator\",\"chapter\":2,\"follow\":[23,51]},{\"n\":28,\"title\":\"怎样遍历 Map，能直接拿到键和值？\",\"short\":\"键和值都要时，用 entrySet 遍历或 map.forEach，直接消费条目，省去逐键调用 get。只要键用 keySet，只要值用 values。删除和并发访问要遵循具体 Map 与迭代器的规则。\",\"details\":[\"entrySet 给出键值条目视图。用增强 for 可同时得到 getKey 和 getValue，也能在需要时改为显式 Iterator，以使用实现支持的 iterator.remove。\",\"在 HashMap 中，迭代需要走过桶数组和桶中的映射，成本与容量和条目数之和有关。因此为遍历性能盲目预留极大的容量可能适得其反。\",\"视图由 Map 支撑。遍历时从外部增删映射，普通 HashMap 的迭代器可能抛 ConcurrentModificationException。ConcurrentHashMap 允许并发迭代，读到的是弱一致结果。\"],\"example\":\"把每种商品的数量输出成报表，遍历条目即可得到商品编码和数量。只统计总数量时，可直接遍历 values。\",\"code\":\"for (Map.Entry\\u003cString, Integer> entry : counts.entrySet()) {\\n    System.out.println(entry.getKey() + \\\": \\\" + entry.getValue());\\n}\",\"pitfall\":\"map.forEach 写法短，性能仍取决于实现与工作负载。对 HashMap 也不要把遍历次序当作稳定的排序结果。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/HashMap.html\",\"anchor\":\"%E5%A6%82%E4%BD%95%E5%AF%B9map%E8%BF%9B%E8%A1%8C%E5%BF%AB%E9%80%9F%E9%81%8D%E5%8E%86\",\"node\":\"mapviews\",\"chapter\":3,\"follow\":[34,52]},{\"n\":29,\"title\":\"JDK 8 HashMap 如何把键映射到桶里？\",\"short\":\"OpenJDK 8 的 HashMap 以桶数组为主体。键的哈希码经过高低位混合后，用数组长度减 1 的掩码求下标。桶内可以是单节点、链表或红黑树，同一候选哈希下继续检查键是否相等。\",\"details\":[\"桶的长度是 2 的幂，索引为 (n - 1) & hash。节点保存混合哈希、键、值与链接。许多键能落到不同桶时，get 和 put 通常具有接近常数的查找成本。\",\"非空桶遇到新键时要先辨别它是已有键还是碰撞。已有键更新对应值，碰撞键可并存在同一个桶。链较长、表容量满足条件时，会用树形结构控制桶高度。\",\"条目数越过扩容阈值后，通常扩大桶数组并搬迁节点。节点已存有混合哈希，翻倍时可根据新增的掩码位决定保留原下标还是移动一个旧容量。\"],\"example\":\"当前容量为 16，两个节点的混合哈希分别是 5 和 21，低 4 位相同，先落在桶 5。容量翻倍到 32 后，新增位将它们分别送到桶 5 和桶 21。\",\"pitfall\":\"散列表的性能依赖分布和键的比较成本。不能把均匀分布下的常见 O(1) 说成每次调用的最坏保证。\",\"ref\":\"https://raw.githubusercontent.com/openjdk/jdk8u/master/jdk/src/share/classes/java/util/HashMap.java\",\"anchor\":\"hashmap%E5%AE%9E%E7%8E%B0%E5%8E%9F%E7%90%86%E4%BB%8B%E7%BB%8D%E4%B8%80%E4%B8%8B\",\"node\":\"hash\",\"chapter\":3,\"follow\":[30,35]},{\"n\":30,\"title\":\"HashMap 的桶何时树化，何时还原成链表？\",\"short\":\"以 OpenJDK 8 的普通 put 为例，桶内已有 8 个链表节点时再追加第 9 个，会尝试树化。表长至少为 64 才允许树化，否则先扩容。树桶随扩容拆分时，某一侧节点数不超过 6 就链表化，普通删除另有结构判断。\",\"details\":[\"TREEIFY_THRESHOLD 为 8。普通 put 只有在确认是新键并追加节点后才检查树化，计数变量的起点使尝试发生在第 9 个节点。compute 等入口的计数路径不同。\",\"MIN_TREEIFY_CAPACITY 为 64。小表更适合先增加可用下标，让不同完整哈希有机会分开。完整哈希全部相同的节点无法靠容量翻倍分到不同桶。\",\"UNTREEIFY_THRESHOLD 为 6，扩容时对树桶拆出的低位组和高位组各自统计。普通 remove 的树形缩小判断则依赖树结构，不能用一次删除后的固定数量替代。\",\"树节点增加了指针和维护成本。哈希相同且比较方向难以区分时，树桶查找可能检查两个分支，树高的对数上界不等于所有查找都有对数成本。\"],\"example\":\"一个已分配 64 个桶的表中，连续往同一链桶插入 9 个互不相等的键，普通 put 会尝试树化。后来一次扩容将树桶拆成 4 个与 7 个节点，前一组还原为链表，后一组保留树形。\",\"pitfall\":\"「8 转树，6 转链」容易混淆常量与触发行为。先交代调用路径、当时桶长度和表容量。\",\"ref\":\"https://raw.githubusercontent.com/openjdk/jdk8u/master/jdk/src/share/classes/java/util/HashMap.java\",\"anchor\":\"hashmap-%E9%93%BE%E8%A1%A8%E8%BD%AC%E7%BA%A2%E9%BB%91%E6%A0%91%E3%80%81%E7%BA%A2%E9%BB%91%E6%A0%91%E9%80%80%E5%8C%96%E6%88%90%E9%93%BE%E8%A1%A8%E7%9A%84%E6%9D%A1%E4%BB%B6%E6%98%AF%E4%BB%80%E4%B9%88\",\"node\":\"treeify\",\"chapter\":3,\"follow\":[38,44]},{\"n\":31,\"title\":\"冲突桶为何选红黑树来替代长链表？\",\"short\":\"红黑树和 AVL 都是自平衡搜索树。红黑树用较宽松的平衡约束把树高限制在对数级，插入或删除时通过旋转和重新着色恢复结构。用于 HashMap 的局部冲突桶时，它兼顾查找和更新。\",\"details\":[\"短链在空间和实现上都简单，链拉长后逐节点查找的开销才明显。哈希分布正常时，很少有桶需要树化，数组与普通节点仍是主体。\",\"AVL 对每个节点的左右子树高度差要求更严，通常树更矮。红黑树约束根到叶路径上的黑节点数量并限制相邻红节点，允许更大的高度差，维护平衡时可用重新着色承担部分工作。\",\"两者都提供对数级的树高。这个设计解释是对数据结构成本的分析，具体运行速度还要看比较成本、更新模式与数据分布。\"],\"example\":\"如果一批互不相等的键被挤在一个桶，而它们的完整哈希可以区分搜索方向，树桶能按哈希走一条路径，链表则可能扫描整个桶。\",\"pitfall\":\"红黑树本身就是平衡搜索树。面试题里的另一种「平衡二叉树」通常特指 AVL。\",\"ref\":\"https://raw.githubusercontent.com/openjdk/jdk8u/master/jdk/src/share/classes/java/util/HashMap.java\",\"anchor\":\"hashmap%E9%93%BE%E8%A1%A8%E5%8F%91%E7%94%9F%E8%BD%AC%E6%8D%A2%E5%90%8E%E4%B8%BA%E4%BB%80%E4%B9%88%E4%B8%8D%E7%94%A8%E5%B9%B3%E8%A1%A1%E4%BA%8C%E5%8F%89%E6%A0%91\",\"node\":\"rbtree\",\"chapter\":3,\"follow\":[30,39]},{\"n\":32,\"title\":\"哈希冲突除了拉链法，还有哪些处理办法？\",\"short\":\"拉链法把落到同一下标的记录挂在同一桶内。开放寻址把记录直接放在表的其他槽位，冲突后按探测规则继续查找，常见规则有线性、二次和双重散列。\",\"details\":[\"Java HashMap 使用拉链式分桶，长链可以树化。每个键先定位到桶，再在桶内做判等。桶的数量与存储条目数量可以独立规划。\",\"开放寻址的查询须遵循与插入相同的探测规则。线性探测按相邻槽推进，局部性好但可能形成聚集。二次探测改变间隔，双重散列用第二个哈希决定步长，步长应与表长相容。\",\"开放寻址中的删除若直接清空槽位，后续查询可能过早停止。常见做法是保留删除标记，或在允许的探测方案中移动后续条目。JDK 的 IdentityHashMap 就采用线性探测，且键的判等使用引用身份。\"],\"example\":\"两个不同键都从槽 3 起步。拉链法把它们都挂在桶 3，线性探测则在槽 3 已占用时尝试槽 4。\",\"pitfall\":\"双重散列用第二个函数决定探测路径。扩容后重新安排旧元素也常被称作 rehash，但它发生在表容量变化时。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/IdentityHashMap.html\",\"anchor\":\"%E4%BA%86%E8%A7%A3%E7%9A%84%E5%93%88%E5%B8%8C%E5%86%B2%E7%AA%81%E8%A7%A3%E5%86%B3%E6%96%B9%E6%B3%95%E6%9C%89%E5%93%AA%E4%BA%9B\",\"node\":\"collision\",\"chapter\":3,\"follow\":[29,45]},{\"n\":33,\"title\":\"多个线程同时使用 HashMap，风险在哪里？\",\"short\":\"HashMap 本身不提供同步。共享实例在有线程写入时要建立并发控制，否则多个线程可能覆盖彼此的修改，读线程也可能看见过期状态。单线程拥有的 Map，或安全发布且随后只读的 Map，可以按各自的约束使用。\",\"details\":[\"put 可能经历读桶、判重、接链、更新 size 或扩容。若两个线程同时发现一个桶为空，分别写入节点，就可能只保留最后写入的一项。对已有键做读改写也可能丢失更新。\",\"写入与读取缺少 happens-before 时，没有可靠的可见性保证。即使写入仅替换旧键的值，不改变 size，仍然需要同步来协调读写。\",\"可选择所有访问都走同一个 synchronizedMap 包装，遍历时按文档锁住包装对象。需要读写并发时可选 ConcurrentHashMap，并用 merge、compute 等操作表达单键原子更新。\"],\"example\":\"多个工作线程累计请求次数时，map.put(path, map.getOrDefault(path, 0) + 1) 可能少计。可以用 ConcurrentHashMap\\u003cString, Integer> 的 merge(path, 1, Integer::sum) 表达单键累加。\",\"pitfall\":\"只锁写方法不足以保护仍然直接访问原 Map 的读线程。外部锁方案要求所有参与者遵守同一访问规则。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/HashMap.html\",\"anchor\":\"hashmap%E6%98%AF%E7%BA%BF%E7%A8%8B%E5%AE%89%E5%85%A8%E7%9A%84%E5%90%97\",\"node\":\"hash-race\",\"chapter\":3,\"follow\":[37,43]},{\"n\":34,\"title\":\"HashMap.get 如何从键找到值？\",\"short\":\"OpenJDK 8 的 get 先从键算出混合哈希，再用掩码定位桶。桶头命中可直接返回，未命中就沿链表查找或进入树桶查找。哈希一致后还要检查引用或 equals，找不到条目时返回 null。\",\"details\":[\"非 null 键先取得 hashCode，再与其无符号右移 16 位的结果做异或，使高位也能影响下标。null 键的混合哈希为 0。空表或目标桶为空时，查询可以直接结束。\",\"命中候选节点需要保存的哈希相同，并且查询键与节点键是同一引用或 equals 为 true。树桶先用完整哈希缩小方向，必要时参考兼容的 Comparable 顺序。\",\"链表查找的成本随桶中节点数增长。树桶中若许多键哈希完全相同且缺少有效的比较方向，也可能查看多个分支。\"],\"example\":\"容量为 16 时，混合哈希 9 和 25 都定位到桶 9。get 先比较节点的完整混合哈希，再在相同哈希的候选中按键身份判等。\",\"pitfall\":\"get 返回 null 可能表示键缺失，也可能表示已经映射到了 null。单线程或已同步的判断中，可用 containsKey 区分。\",\"ref\":\"https://raw.githubusercontent.com/openjdk/jdk8u/master/jdk/src/share/classes/java/util/HashMap.java\",\"anchor\":\"%E5%9C%A8-java-%E7%9A%84-hashmap-%E4%B8%AD-get%E4%B8%80%E4%B8%AA%E5%85%83%E7%B4%A0%E7%9A%84%E8%BF%87%E7%A8%8B%E6%98%AF%E6%80%8E%E6%A0%B7%E7%9A%84\",\"node\":\"hash\",\"chapter\":3,\"follow\":[35,40]},{\"n\":35,\"title\":\"HashMap.put 怎样插入、覆盖并决定扩容？\",\"short\":\"OpenJDK 8 的普通 put 先计算哈希，必要时分配桶数组。空桶直接放新节点，非空桶在链或树中查找。命中旧键时更新值并返回旧值，写入新键时增加 size，超过扩容阈值后通常扩容。\",\"details\":[\"默认构造的 HashMap 初始可没有数组。第一次写入会分配表，随后通过 (n - 1) & hash 找到桶。即使桶已占用，也要先检查桶头键是否匹配。\",\"命中旧键时，普通 put 替换对应节点的值，沿用原节点的键对象，size 不变。未命中时，空桶直接挂新节点，链桶追加或尝试树化，树桶走树插入。\",\"新增映射通常触发 ++size > threshold 的检查。链冲突导致的小表扩容是另一个入口。不同写入方法的内部顺序与检查时机不宜一概而论。\"],\"example\":\"默认参数下第一次 put 初始化容量 16，阈值为 12。第 13 个不同键通常让容量变成 32。连续给同一键覆盖 13 次仍只有一条映射。\",\"pitfall\":\"put 的返回值为 null 也有歧义。它既可能是新键，也可能是旧键先前对应 null。\",\"ref\":\"https://raw.githubusercontent.com/openjdk/jdk8u/master/jdk/src/share/classes/java/util/HashMap.java\",\"anchor\":\"hashmap%E7%9A%84put%E8%BF%87%E7%A8%8B%E4%BB%8B%E7%BB%8D%E4%B8%80%E4%B8%8B\",\"node\":\"hash\",\"chapter\":3,\"follow\":[30,44]},{\"n\":36,\"title\":\"put 和 get 如何复用同一套 HashMap 定位规则？\",\"short\":\"put 和 get 都把键转成相同算法的混合哈希，按当前表长定位桶，再用哈希和键相等性找节点。get 读出命中值，put 命中时覆盖值或在未命中时创建映射。\",\"details\":[\"同一逻辑键必须由稳定的 equals 与 hashCode 定义。两个不同实例只要是相等键并遵守哈希契约，就会沿相同定位过程命中同一条映射。\",\"扩容改变索引掩码，节点会被搬到新位置。只要键的哈希稳定，后续 get 用新表长重新定位就仍能命中。\",\"共享桶内可以容纳多个不同键。put 不会只因桶下标相同而覆盖，get 也不会把桶头当作任意键的查询结果。\"],\"example\":\"用 new String(\\\"order-7\\\") 写入订单状态，再用另一份内容相同的字符串查询，两者引用不同但内容相等，仍能读到状态。再次 put 同一逻辑键会覆盖原状态。\",\"pitfall\":\"对哈希键改名可能改变它的 hashCode 和 equals 结果，已保存的节点不会自动跟着键迁移。\",\"ref\":\"https://raw.githubusercontent.com/openjdk/jdk8u/master/jdk/src/share/classes/java/util/HashMap.java\",\"anchor\":\"hashmap%E7%9A%84put-key-val-%E5%92%8Cget-key-%E8%BF%87%E7%A8%8B\",\"node\":\"hash\",\"chapter\":3,\"follow\":[34,35]},{\"n\":37,\"title\":\"HashMap.get 只读取数据，多线程调用是否安全？\",\"short\":\"要看是否同时写入，以及 Map 怎样交给读线程。构建完成后安全发布且始终只读时，可以让多线程调用 get。若与 put、remove 或扩容并发，则必须采用统一同步方案或改用并发 Map。\",\"details\":[\"安全发布要保证读线程能看到构建完成的状态。可使用类初始化、volatile 引用或锁等建立 happens-before。发布一个随后仍在写入的 HashMap，需要为后续读写另外建立并发控制。\",\"并发写入可能更新旧值、替换桶或迁移表。HashMap.get 不提供与这些更新协调的同步协议，读线程可能错过映射或读到旧值。迭代器的 fail-fast 和 get 的可见性是不同问题。\",\"对仅供查询的配置，可以先构建独立快照并安全发布。若 value 本身可变，对 value 的并发访问仍要满足它自己的可见性和同步约束。\"],\"example\":\"每次刷新路由表时先完整构造新 Map，再把只读快照写入 volatile 字段。读请求从该字段取一个快照进行查找，旧快照仍可由正在执行的请求继续使用。\",\"pitfall\":\"仅用 Collections.unmodifiableMap 包住一个仍会被其他代码修改的 HashMap，不会把底层数据变成快照。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-17.html#jls-17.4.5\",\"anchor\":\"hashmap-%E8%B0%83%E7%94%A8get%E6%96%B9%E6%B3%95%E4%B8%80%E5%AE%9A%E5%AE%89%E5%85%A8%E5%90%97\",\"node\":\"hash-race\",\"chapter\":3,\"follow\":[33,54]},{\"n\":38,\"title\":\"怎样设计 HashMap 的键，String 有哪些合适的特性？\",\"short\":\"键要用稳定的业务身份判等，equals 相等的实例应得到相同的 hashCode。String 的内容不可变，按内容判等并计算哈希，所以常用于名称、编码等自然文本键。复合身份也可用不可变值对象表达。\",\"details\":[\"哈希容器先根据哈希定位，再根据相等规则确认。使用不可变键可避免存入后身份变化导致查找失败。适当的哈希分布也能减少碰撞。\",\"String 的比较区分大小写。如果业务认为不同大小写的某类标识相同，应在键的边界统一规范化，避免对同一逻辑键采用多种表示。\",\"若唯一性由多个字段决定，可用 record 或手写值对象。同一套身份字段要同时决定 equals 和 hashCode。record 的组件引用固定，组件本身的可变性仍需考虑。\"],\"example\":\"订单号是天然文本身份，可用 String。若订单号只在租户内唯一，用 record OrderKey(long tenantId, String orderNo) {} 表示两部分身份。\",\"pitfall\":\"StringBuilder 与 String 的内容可能看起来相同，但 StringBuilder 既可变，也没有与 String 相同的内容判等语义。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/String.html\",\"anchor\":\"hashmap%E4%B8%80%E8%88%AC%E7%94%A8%E4%BB%80%E4%B9%88%E5%81%9Akey-%E4%B8%BA%E5%95%A5string%E9%80%82%E5%90%88%E5%81%9Akey%E5%91%A2\",\"node\":\"equality\",\"chapter\":3,\"follow\":[41,42]},{\"n\":39,\"title\":\"比较 AVL 和红黑树时，怎样说明 HashMap 的选择？\",\"short\":\"先确定是在比较两种自平衡搜索树，再说明 HashMap 的树只处理长碰撞桶。AVL 平衡更紧，树通常更矮。红黑树容许更大的高度差，在桶仍会频繁变化时，可用较宽松的平衡规则控制维护代价。\",\"details\":[\"桶短时优先保留普通节点有助于节约空间。桶长时，能沿单一方向查找的键更能从树结构受益。比较 AVL 与红黑树也应从这一局部场景出发。\",\"更新成本不能只用旋转次数概括。AVL 维护高度约束，红黑树维护颜色和黑高。插入、删除、寻找后继与指针调整都会影响实际成本。\",\"即使红黑树高度是 O(log n)，HashMap 对大量同哈希且缺少有效比较顺序的键也可能搜索多个分支。树高、比较规则和实际访问节点数要分开讨论。\"],\"example\":\"同一个桶先持续写入再删除一批条目，树需要同时支持查找和结构维护。如果键都有完全相同的哈希、又不可比较，仍要考虑查询可能查看很多节点。\",\"pitfall\":\"不要把 AVL 描述成每次插入都要多次旋转，也不要保证红黑树对所有工作负载都更快。说明选择背后的成本取舍即可。\",\"ref\":\"https://raw.githubusercontent.com/openjdk/jdk8u/master/jdk/src/share/classes/java/util/HashMap.java\",\"anchor\":\"%E4%B8%BA%E4%BB%80%E4%B9%88hashmap%E8%A6%81%E7%94%A8%E7%BA%A2%E9%BB%91%E6%A0%91%E8%80%8C%E4%B8%8D%E6%98%AF%E5%B9%B3%E8%A1%A1%E4%BA%8C%E5%8F%89%E6%A0%91\",\"node\":\"rbtree\",\"chapter\":3,\"follow\":[30,31]},{\"n\":40,\"title\":\"HashMap 可以存 null 键或 null 值吗？\",\"short\":\"HashMap 支持一个 null 键和多个 null 值。重复 put(null, value) 会更新同一个键。查询返回 null 时，需要结合 containsKey 区分键缺失和已映射到 null。\",\"details\":[\"OpenJDK 8 对 null 键计算出的混合哈希为 0，因此定位到桶 0。其他键也可能落在桶 0，实际是否同键还要通过身份或 equals 确认。\",\"put(k, null) 仍是一条映射，会计入 size，并出现在 entrySet、keySet 和 values 的相应视图中。getOrDefault 只在没有映射时使用默认值，对映射到 null 的键仍返回 null。\",\"null 策略由实现决定。ConcurrentHashMap 禁止 null 键和值，因此它的 get 返回 null 可直接表示该次查询没有结果。\"],\"example\":\"缓存把「已查询但不存在」存成 null 时，先用 containsKey 判断是否已有查询记录。在共享可变缓存中还要解决两次访问之间的竞争。\",\"code\":\"Map\\u003cString, Integer> values = new HashMap\\u003c>();\\nvalues.put(null, 3);\\nvalues.put(\\\"known\\\", null);\\nvalues.getOrDefault(\\\"known\\\", -1); // null\\nvalues.getOrDefault(\\\"missing\\\", -1); // -1\",\"pitfall\":\"Map 接口没有规定所有实现都支持 null。切换为 ConcurrentHashMap 或 Map.of 前应重新检查 null 的用法。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/HashMap.html\",\"anchor\":\"hashmap-key%E5%8F%AF%E4%BB%A5%E4%B8%BAnull%E5%90%97\",\"node\":\"nulls\",\"chapter\":3,\"follow\":[34,56]},{\"n\":41,\"title\":\"自定义 HashMap 键时，怎样配套实现 equals 和 hashCode？\",\"short\":\"先确定键的业务身份字段，再用同一套字段实现 equals(Object) 和 hashCode()。相等键必须返回相同哈希码，反向条件不成立。键在 Map 中时应保持这些字段的判等行为稳定。\",\"details\":[\"equals 要满足自反、对称、传递和一致性，对 null 返回 false。使用 @Override 确认签名。继承体系若引入参与判等的新字段，应特别检查父子实例之间的对称性与传递性。\",\"hashCode 的职责是把相等对象导向同一候选位置。可组合所有身份字段改善分布，也要确保 equals 所认定相等的字段值给出同样的哈希。\",\"若用数组表示键的一部分，先明确想要引用相等还是内容相等。内容相等需要配套使用数组内容比较与内容哈希，并防止数组内容在作为键期间改变。\"],\"example\":\"同一租户同一订单号代表同一订单，不同展示名称不改变订单身份。可以直接用只含 tenantId 和 orderNo 的 record 作为键。\",\"code\":\"record OrderKey(long tenantId, String orderNo) {}\\nMap\\u003cOrderKey, String> states = new HashMap\\u003c>();\\nstates.put(new OrderKey(7, \\\"A01\\\"), \\\"PAID\\\");\\nstates.get(new OrderKey(7, \\\"A01\\\")); // PAID\",\"pitfall\":\"若 equals 只比较 ID，hashCode 却还加入可变昵称，则同一个逻辑键可能计算出不同哈希，无法互相查询。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#hashCode()\",\"anchor\":\"%E9%87%8D%E5%86%99hashmap%E7%9A%84equal%E5%92%8Chashcode%E6%96%B9%E6%B3%95%E9%9C%80%E8%A6%81%E6%B3%A8%E6%84%8F%E4%BB%80%E4%B9%88\",\"node\":\"equality\",\"chapter\":3,\"follow\":[23,38]},{\"n\":42,\"title\":\"键的 equals 写错时，HashMap 会出现哪些症状？\",\"short\":\"相等键的 hashCode 不同时，原本应覆盖的映射可能并存，查询和删除也可能失效。equals 过于宽松且哈希随之把不同业务对象归到一起时，则可能错误覆盖旧值。\",\"details\":[\"仅重写 equals 却保留 Object.hashCode，两个独立实例可能判等却得到不同哈希。HashMap 会先筛选保存的哈希，再比较键，因此有机会同时保存两份逻辑上重复的条目。\",\"如果 equals 与 hashCode 都只使用错误的身份字段，两者可以形式上遵守契约，但业务结果仍然错误。例如只按年龄判等会使两位同龄用户共用一个键。\",\"若 equals 不满足对称或传递，命中结果可能依赖查询对象与已存对象的角色和插入顺序。用独立但应当相等的两个实例分别验证 add、get、put 覆盖和 remove，可以定位这类故障。\"],\"example\":\"测试 UserKey(42, \\\"Alice\\\") 和 UserKey(42, \\\"Alicia\\\")。若 ID 是身份，两键应相等且哈希相同，第二次 put 后 size 仍为 1。再加入 ID 为 43 的同名用户后，size 应为 2。\",\"pitfall\":\"哈希碰撞本身不说明 equals 写错。不同键允许拥有相同哈希，只要 equals 能区分它们。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#equals(java.lang.Object)\",\"anchor\":\"%E9%87%8D%E5%86%99hashmap%E7%9A%84equal%E6%96%B9%E6%B3%95%E4%B8%8D%E5%BD%93%E4%BC%9A%E5%87%BA%E7%8E%B0%E4%BB%80%E4%B9%88%E9%97%AE%E9%A2%98\",\"node\":\"equality\",\"chapter\":3,\"follow\":[38,41]},{\"n\":43,\"title\":\"多个线程同时操作 HashMap，会出现什么结果？\",\"short\":\"普通 HashMap 没有为共享读写提供同步。多个线程写同一张表可能覆盖彼此的更新、让 size 与实际映射数不符，也可能在迁移过程中读不到原有映射。需要共享读写时，要统一使用外部同步或采用并发容器。\",\"details\":[\"写入一个新键要定位桶、查重、接入节点，再更新计数。两个线程即使写不同的键，只要定位到同一个空桶，就可能都判定可直接安装节点，最后一次写入覆盖前一次。\",\"普通 HashMap 的表迁移和字段读写缺少跨线程的可见性与协作机制。读者可能看见过时的数据或迁移中的状态。JDK 7 的头插式迁移存在并发成环的经典故障，JDK 8 改用高低链拆分，仍然需要同步。\",\"迭代器的 ConcurrentModificationException 只是尽力发现结构变化。构建完成后安全发布且不再修改的表，可以被多个线程读取。还要另行管理键和值对象本身的可变状态。\"],\"example\":\"桶 3 原来为空，线程 A 和线程 B 各读到空。A 把订单 A 写进桶 3，B 随后把不同的订单 B 写到同一个位置，订单 A 可能从表中消失。\",\"pitfall\":\"即使预分配足够大的数组，桶竞争、计数竞争和可见性问题仍可能出现。禁用容量增长无法建立线程安全。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/HashMap.html\",\"anchor\":\"%E5%88%97%E4%B8%BEhashmap%E5%9C%A8%E5%A4%9A%E7%BA%BF%E7%A8%8B%E4%B8%8B%E5%8F%AF%E8%83%BD%E4%BC%9A%E5%87%BA%E7%8E%B0%E7%9A%84%E9%97%AE%E9%A2%98\",\"node\":\"hash-race\",\"chapter\":3,\"follow\":[33,53]},{\"n\":44,\"title\":\"HashMap 扩容时，旧桶中的节点如何迁移？\",\"short\":\"以 OpenJDK 8u 为例，新增映射使 size 超过阈值时，HashMap 通常把桶数组扩大到原来的两倍。迁移复用节点中已存储的散列值。普通链表按 hash 的 oldCap 位分成两组，分别留在旧索引或移动 oldCap 个位置。\",\"details\":[\"首次插入通常先按默认值或构造参数分配数组。后续常规 put 会在新增映射后检查 size 是否大于 threshold。容量较小时尝试树化也可能触发增长。达到最大容量后停止翻倍。\",\"容量从 n 变为 2n 时，下标掩码仅多出权重为 n 的一位。单节点可直接用新掩码定位。链表节点依据 (hash & n) 是否为 0 拆分，高低两组各自保持原先的相对顺序。\",\"树桶也按这一位拆分，拆分后节点很少的一侧可以退回链表。一次迁移需要扫描旧桶数组和已有节点，偶尔进行，不能把单次触发扩容的 put 算作常数时间。\"],\"example\":\"旧容量 16 时，已混合的散列值 5 和 21 都在桶 5。扩到 32 后，5 留在桶 5，21 的二进制权重 16 位为 1，因此到桶 21。\",\"pitfall\":\"常说的 rehash 在这里是重新安排桶位置。它通常复用节点保存的 hash，不会对每个旧键重新调用用户实现的 hashCode()。\",\"ref\":\"https://github.com/openjdk/jdk8u/blob/master/jdk/src/share/classes/java/util/HashMap.java\",\"anchor\":\"hashmap%E7%9A%84%E6%89%A9%E5%AE%B9%E6%9C%BA%E5%88%B6%E4%BB%8B%E7%BB%8D%E4%B8%80%E4%B8%8B\",\"node\":\"hash-resize\",\"chapter\":3,\"follow\":[30,45]},{\"n\":45,\"title\":\"桶数组长度取 2 的幂，为什么有利于定位和扩容？\",\"short\":\"当容量 n 是 2 的幂时，n - 1 的低位全部为 1，使用 hash & (n - 1) 可以得到 0 到 n - 1 的桶索引。容量翻倍只增加一位掩码，因此每个旧桶迁移时最多分到两个确定的位置。\",\"details\":[\"例如 n = 16 时，掩码为二进制 1111。与运算保留散列值的低 4 位，对负数散列也会得到非负索引。使用其他长度时，同样的掩码公式可能让某些桶永远用不到。\",\"OpenJDK 8u 的 HashMap 会用高 16 位与原始散列值异或，让部分高位参与小表的索引计算。它只能改善分散机会，无法分开散列值完全相同的键。\",\"翻倍时新索引要么与旧索引相同，要么等于旧索引加旧容量。扩容可以按旧桶分两条链，无需对每个旧键重新算 hashCode。\"],\"example\":\"容量 16 的掩码是 15，容量 32 的掩码是 31。散列值 21 分别与这两个掩码相与得到 5 和 21，差值正好是旧容量 16。\",\"pitfall\":\"2 的幂是 HashMap 实现中的桶数组容量规则。实际映射数 size 可以是任意允许的数量，负载因子也不会要求 size 是 2 的幂。\",\"ref\":\"https://github.com/openjdk/jdk8u/blob/master/jdk/src/share/classes/java/util/HashMap.java\",\"anchor\":\"hashmap%E7%9A%84%E5%A4%A7%E5%B0%8F%E4%B8%BA%E4%BB%80%E4%B9%88%E6%98%AF2%E7%9A%84n%E6%AC%A1%E6%96%B9%E5%A4%A7%E5%B0%8F%E5%91%A2\",\"node\":\"mask\",\"chapter\":3,\"follow\":[44,47]},{\"n\":46,\"title\":\"默认 HashMap 插入 20 个不同的键，会扩大几次？\",\"short\":\"对 OpenJDK 8u 中的 new HashMap\\u003c>()，按普通 put 插入 20 个不同键且不因桶冲突提前扩容，首次插入分配 16 个桶。第 13 个新键令 size 超过 12，表扩大到 32 个桶，阈值变为 24。因此已有数组只扩大一次。\",\"details\":[\"默认负载因子为 0.75。容量 16 时，阈值是 12。size 达到 12 仍可继续使用这张表，新增第 13 个映射后才超过阈值。\",\"扩到 32 后，常规阈值变为 24。若继续按相同假设插入，第 25 个新映射会触发下一次增长。覆盖已有键的值不会增加映射数。\",\"第一次创建桶数组与既有数组扩大要区分。两条路径在这版源码里都能调用 resize()，因此若问 resize() 被调用几次，按上述假设是两次。\"],\"example\":\"依次放入整数键 0 到 19。前 12 个留在初始表，第 13 个触发 16 → 32 的迁移，随后还有足够容量容纳剩余 7 个。\",\"pitfall\":\"回答前说明初始容量、键是否重复以及是否存在严重冲突。小表的长冲突链也可能走先扩容的路径，单看元素数无法涵盖该分支。\",\"ref\":\"https://github.com/openjdk/jdk8u/blob/master/jdk/src/share/classes/java/util/HashMap.java\",\"anchor\":\"%E5%BE%80hashmap%E5%AD%9820%E4%B8%AA%E5%85%83%E7%B4%A0-%E4%BC%9A%E6%89%A9%E5%AE%B9%E5%87%A0%E6%AC%A1\",\"node\":\"threshold\",\"chapter\":3,\"follow\":[47,48]},{\"n\":47,\"title\":\"已知要放 20 条映射，new HashMap(20) 会不会扩容？\",\"short\":\"在 OpenJDK 8u 中，new HashMap\\u003c>(20) 首次分配时把桶数组长度向上取为 32，默认负载因子对应阈值 24。散列分布正常时可放入 20 条映射而不触发阈值扩容。20 是容量参数，这个例子依赖向上取整后的余量。\",\"details\":[\"构造阶段记录预定容量，通常到第一次插入才分配实际桶数组。20 向上取到 32，分配后按负载因子算出阈值 24。极端冲突仍可能让小容量表提前增长。\",\"换一个数字就能看出区别。new HashMap\\u003c>(16) 的首个数组为 16，阈值 12，所以预计放入 16 条映射时仍会遇到增长。\",\"手动预估时可以从 ceil(预期映射数 / 负载因子) 起算，再由实现按 2 的幂取整。Java 19 起也可以直接通过 HashMap.newHashMap(预期映射数) 表达这个意图。\"],\"example\":\"预期 20 条，20 / 0.75 向上取整为 27，给构造器传 27 后也会取到 32。这与恰好传 20 的结果相同，但估算方法适用于更多目标值。\",\"pitfall\":\"构造参数不是容器的硬上限。即使按预期数量预估容量，碰撞引发的提前扩容也属于另一条触发路径。\",\"code\":\"Map\\u003cString, Integer> counts = HashMap.newHashMap(20); // Java 19+\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/HashMap.html#newHashMap(int)\",\"anchor\":\"%E9%A2%84%E8%AE%A1%E6%94%BE-20-%E4%B8%AA%E5%85%83%E7%B4%A0-new-hashmap-20-%E5%B0%B1%E8%83%BD%E9%81%BF%E5%85%8D%E6%89%A9%E5%AE%B9%E5%90%97\",\"node\":\"threshold\",\"chapter\":3,\"follow\":[44,46]},{\"n\":48,\"title\":\"负载因子怎样影响 HashMap 的空间和查找成本？\",\"short\":\"负载因子把桶数组的容量换算成常规扩容阈值，默认是 0.75。较低的负载因子会更早扩容，用更多桶换取更低的平均桶负载。较高的负载因子减少桶数组占用，但碰撞和桶内查找的成本通常更高。\",\"details\":[\"以容量 64 为例，0.75 对应阈值 48。普通 put 新增第 49 条映射后越过阈值，随后分配更大的表。重复覆盖不改变 size，判断的也不是非空桶的比例。\",\"在相同容量下，更高的阈值让表能累积更多映射。分布良好时平均每桶节点数会上升，发生桶内比较的机会也会上升。碰撞严重时还要看散列质量和键的分布。\",\"桶数组也会影响遍历。HashMap 的视图遍历开销与容量和映射数都有关，预留过多空桶会让迭代变慢。\"],\"example\":\"容量 64、负载因子 0.5 时阈值 32，放入第 33 条时通常增长。同容量且负载因子 0.75 时则能继续容纳到第 48 条。\",\"pitfall\":\"0.75 表示计算阈值的比率，不能据此推断有 75% 的桶被占用，也无法推断不存在长冲突链。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/HashMap.html\",\"anchor\":\"%E8%AF%B4%E8%AF%B4hashmap%E7%9A%84%E8%B4%9F%E8%BD%BD%E5%9B%A0%E5%AD%90\",\"node\":\"threshold\",\"chapter\":3,\"follow\":[46,47]},{\"n\":49,\"title\":\"HashMap 和 Hashtable 有哪些区别，常见业务怎么用？\",\"short\":\"两者都是键值表。HashMap 允许一个 null 键和多个 null 值，自身不提供同步。Hashtable 的常用读写方法在实例级别同步，键和值都拒绝 null。局部查表、频次统计和键到对象的索引都适合用 HashMap。\",\"details\":[\"HashMap 适合线程封闭，或构建完毕后安全发布、且后续无修改的场景。共享可变映射可以考虑 ConcurrentHashMap，也可以按业务需要对访问统一加锁。\",\"Hashtable 是继承 Dictionary 的早期实现。实例级同步使同一张表上的许多操作相互排斥，也不会自动把跨多个方法的业务步骤合并成一个原子动作。\",\"日常可把变量和参数声明为 Map，再按是否需要稳定的遍历顺序、按键排序或并发更新来选择实现。普通 HashMap 和 Hashtable 都不承诺遍历顺序。\"],\"example\":\"单个请求内统计每种商品的数量，可以在局部 Map 上调用 merge。多个线程共享一张在线会话表时，再根据并发语义选择实现。\",\"pitfall\":\"HashMap.get 返回 null 既可能是键缺失，也可能是键对应 null 值。需要区分时，应按业务逻辑查看 containsKey 或改用明确的值表示。\",\"code\":\"Map\\u003cString, Integer> quantities = new HashMap\\u003c>();\\nquantities.merge(\\\"sku-42\\\", 1, Integer::sum);\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/HashMap.html\",\"anchor\":\"hashmap%E5%92%8Chashtable%E6%9C%89%E4%BB%80%E4%B9%88%E4%B8%8D%E4%B8%80%E6%A0%B7%E7%9A%84-hashmap%E4%B8%80%E8%88%AC%E6%80%8E%E4%B9%88%E7%94%A8\",\"node\":\"table\",\"chapter\":3,\"follow\":[63,66]},{\"n\":50,\"title\":\"LinkedHashMap 怎样保序，如何用它实现 LRU？\",\"short\":\"LinkedHashMap 在 HashMap 的桶结构之外维护一条贯穿所有条目的双向链。默认按插入顺序遍历，启用 accessOrder 后，指定访问操作会把命中的条目移到最近使用的一端。超过容量上限时淘汰链首，就得到一个基础 LRU。\",\"details\":[\"桶结构服务于按键查找，双向链服务于遍历顺序。插入顺序模式下，普通 put 更新已有键通常保留原顺序。访问顺序模式下，命中的 get、put 等规定操作会刷新位置。\",\"子类可以覆盖 removeEldestEntry。插入新条目后该钩子会检查最早条目，返回 size() > limit 即可在超过上限时移除它。\",\"访问顺序模式下，get 可能修改链条顺序。多个线程使用缓存时，读和写都需要纳入同步策略。该结构按条目数控制容量，不包含过期时间或权重等缓存策略。\"],\"example\":\"上限为 2，先 put A、put B，再 get A，访问顺序变成 B、A。put C 后 B 被淘汰，留下 A、C。\",\"pitfall\":\"构造器第三个参数如果是 false，淘汰的是插入时间最早的条目。调用 containsKey 或遍历视图也不会像 get 那样刷新最近访问时间。\",\"code\":\"Map\\u003cString, String> cache = new LinkedHashMap\\u003cString, String>(4, 0.75f, true) {\\n    @Override\\n    protected boolean removeEldestEntry(Map.Entry\\u003cString, String> eldest) {\\n        return size() > 2;\\n    }\\n};\\ncache.put(\\\"A\\\", \\\"alpha\\\");\\ncache.put(\\\"B\\\", \\\"beta\\\");\\ncache.get(\\\"A\\\");\\ncache.put(\\\"C\\\", \\\"gamma\\\");\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/LinkedHashMap.html\",\"anchor\":\"linkedhashmap-%E6%80%8E%E4%B9%88%E4%BF%9D%E8%AF%81%E6%9C%89%E5%BA%8F-%E6%80%8E%E4%B9%88%E7%94%A8%E5%AE%83%E5%AE%9E%E7%8E%B0-lru\",\"node\":\"linkedmap\",\"chapter\":3,\"follow\":[26,52]},{\"n\":51,\"title\":\"按键查找、范围查询分别适合哪种 Map？\",\"short\":\"HashMap 依赖散列，分布良好时按键查找和写入通常是 O(1)，也不承诺键的顺序。TreeMap 以红黑树维护自然顺序或 Comparator 顺序，基础查改为 O(log n)，并支持按范围查询和找相邻键。\",\"details\":[\"HashMap 先按散列定位桶，再用键相等关系确定映射。它适合仅凭商品 ID 等固定键查记录的场景。\",\"TreeMap 用 compareTo 或 Comparator 的结果导航。firstKey、floorKey、ceilingKey 和 subMap 可利用树上的顺序，分别完成取最小值、查邻近键和查区间。\",\"如果比较结果为 0，TreeMap 会把两个键视作同一个排序位置。比较规则应与 equals 一致，才能满足一般 Map 契约。自然排序通常不接受 null 键，显式比较器可自行定义 null 的位置。\"],\"example\":\"按订单号取详情可用 HashMap。按时间索引事件时，可以用 TreeMap 的 subMap(start, true, end, false) 取半开时间区间。\",\"pitfall\":\"如果按姓名长度比较，两个长度相等的不同姓名在 TreeMap 中可能覆盖彼此。排序键既决定次序，也参与判断是否已有同一个键。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/TreeMap.html\",\"anchor\":\"treemap-%E5%92%8C-hashmap-%E6%9C%89%E4%BB%80%E4%B9%88%E5%8C%BA%E5%88%AB-%E4%BB%80%E4%B9%88%E5%9C%BA%E6%99%AF%E7%94%A8-treemap\",\"node\":\"treemap\",\"chapter\":3,\"follow\":[27,50]},{\"n\":52,\"title\":\"Map 的三个集合视图怎样联动，什么时候要复制？\",\"short\":\"Map.keySet()、values() 和 entrySet() 是由原 Map 支撑的视图。原映射的变更会反映在视图里。对支持删除的 Map，通过这些视图移除条目也会修改原表。需要独立的键列表时可以显式复制。\",\"details\":[\"keySet 是唯一键的 Set，values 是允许重复值的 Collection，entrySet 是键值对的 Set。HashMap 的三个视图都支持经由删除操作移除映射，直接 add 不受支持。特定实现可能另有工厂或扩展语义。\",\"从可修改 HashMap 的 entrySet 迭代器取得的 entry 可通过 setValue 更新原表中的值。迭代期间删除应用迭代器的 remove，避免在普通 HashMap 的遍历中直接结构性修改原表。\",\"new ArrayList\\u003c>(map.keySet()) 会复制当前的键引用，形成独立的容器结构。它不会复制键对象。并发更新期间形成的副本是否对应单一时刻，要看所用容器和同步策略。\"],\"example\":\"删除 map.keySet() 中的订单号会同时删除原表的订单映射。修改从 keySet 复制出来的列表，只会修改该列表。\",\"pitfall\":\"一个值可能对应多个键。调用 values().remove(v) 只删除一个匹配映射，想删掉全部匹配条目应明确使用 removeIf 等操作。\",\"code\":\"Map\\u003cString, Integer> map = new HashMap\\u003c>();\\nmap.put(\\\"A\\\", 1);\\nList\\u003cString> snapshot = new ArrayList\\u003c>(map.keySet());\\nmap.keySet().remove(\\\"A\\\");\\nSystem.out.println(map.isEmpty()); // true\\nSystem.out.println(snapshot); // [A]\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Map.html#entrySet()\",\"anchor\":\"map-%E7%9A%84-keyset%E3%80%81values%E3%80%81entryset-%E6%98%AF%E4%B8%80%E4%BB%BD%E5%89%AF%E6%9C%AC%E5%90%97\",\"node\":\"mapviews\",\"chapter\":3,\"follow\":[7,28]},{\"n\":53,\"title\":\"ConcurrentHashMap 的并发设计在 JDK 7 和 JDK 8 如何演变？\",\"short\":\"OpenJDK 7u 将表拆成多个 Segment，每段拥有独立桶表和锁。OpenJDK 8u 改成统一桶数组，空桶常用 CAS 安装节点，非空桶更新一般在桶首对象的监视器保护下进行。读操作通过可见性机制访问节点，扩容可以由多个线程协作。\",\"details\":[\"JDK 7 的散列先选择 Segment，再选该段内的桶。段内修改和扩容持有该段的 ReentrantLock，其他段仍可分别写入。\",\"JDK 8 的桶可容纳链表或树结构。直接在空槽发布单个节点可用 CAS，链表或树的复合修改则需要桶内互斥。取值一般不拿写入用的桶监视器。\",\"迁移时旧桶会放置转发节点。读线程可沿转发节点查新表，写线程可能协助迁移并重试。线程安全的边界由 API 定义，具体字段和同步手段属于实现细节。\"],\"example\":\"两个写线程在 JDK 7 中即使写不同的桶，只要归属同一段，也会竞争段锁。JDK 8 中若落入两个独立空桶，可以各自尝试 CAS。\",\"pitfall\":\"JDK 8 的构造器仍可能接受 concurrencyLevel 参数，它用于估算初始大小。它不再表示将创建同等数量的活跃段锁。\",\"ref\":\"https://raw.githubusercontent.com/openjdk/jdk8u/master/jdk/src/share/classes/java/util/concurrent/ConcurrentHashMap.java\",\"anchor\":\"concurrenthashmap%E6%80%8E%E4%B9%88%E5%AE%9E%E7%8E%B0%E7%9A%84\",\"node\":\"chm\",\"chapter\":3,\"follow\":[54,59]},{\"n\":54,\"title\":\"ConcurrentHashMap 的 get 怎样读到可见的更新？\",\"short\":\"JDK 8 的 get 会用带可见性语义的方式读取桶首，再查链表、树桶或转发节点。节点的值和链表后继可被读线程看见。API 保证，对同一个键的更新与读到该更新结果的非 null 获取之间具有 happens-before 关系。\",\"details\":[\"写线程通过 CAS 或相应的发布写入把节点接入表。读线程通过桶槽的 volatile 读取语义取得头节点，链表中 value 和 next 也用 volatile 字段维护相应可见性。\",\"读到迁移后的 ForwardingNode 会转向新表。树桶可能借助内部读状态遍历树，在有写者或等待写入时可从链表查找，以避免等待普通桶监视器。\",\"返回值描述的是一个键在该次读取中的结果。多个键的连续 get、整表遍历或对值对象的后续修改，有各自的同步语义。\"],\"example\":\"线程 A 完成 put(\\\"job\\\", done) 后，线程 B 的 get(\\\"job\\\") 若返回该 done，就能依赖发布这个映射建立的可见性关系。\",\"pitfall\":\"一次 get 的可见性保证无法把 get 后的业务判断与下一次 put 合并为原子操作，也不会自动保护值对象发布后的可变字段。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ConcurrentHashMap.html\",\"anchor\":\"concurrenthashmap-%E7%9A%84-get-%E4%B8%BA%E4%BB%80%E4%B9%88%E9%80%9A%E5%B8%B8%E4%B8%8D%E9%9C%80%E8%A6%81%E5%8A%A0%E9%94%81\",\"node\":\"publish\",\"chapter\":3,\"follow\":[53,55]},{\"n\":55,\"title\":\"ConcurrentHashMap 扩容时怎样迁移，读写还可以继续吗？\",\"short\":\"以 OpenJDK 8u 为例，发起线程创建新表，迁移线程通过 transferIndex 领取旧桶区间。每个旧桶迁完后会放入 ForwardingNode，读线程可以跟到新表，写线程遇到已转发的桶可能帮助迁移，再在合适的表中重试。\",\"details\":[\"sizeCtl 在不同阶段保存初始化提示、扩容阈值或扩容协调状态。进入扩容后，它配合迁移标记管理参与者，transferIndex 用来分发区间。\",\"容量翻倍时，桶内节点依据 hash 的 oldCap 位分成低位组和高位组。非空桶的迁移需要与该桶的写入协调。完成后，旧桶由指向 nextTable 的转发节点接管。\",\"get 可以从尚未迁移的旧桶查找，也可以沿转发节点读新桶。其他写入可继续，但特定桶上可能出现互斥、重试或帮助迁移的开销。最终由收尾线程发布新表并设置下一次阈值。\"],\"example\":\"旧表桶 5 已迁完，get 从它的转发节点进入新表，按新容量重新定位。另一个线程对该桶 put 时，可能先帮忙搬运其他区间，再重试写入。\",\"pitfall\":\"支持扩容期间读写，只表示没有把整个表统一锁住。单次写操作可能因局部竞争或协作迁移而延迟。\",\"ref\":\"https://raw.githubusercontent.com/openjdk/jdk8u/master/jdk/src/share/classes/java/util/concurrent/ConcurrentHashMap.java\",\"anchor\":\"concurrenthashmap-%E6%80%8E%E4%B9%88%E6%89%A9%E5%AE%B9-%E6%89%A9%E5%AE%B9%E6%97%B6%E5%85%B6%E4%BB%96%E7%BA%BF%E7%A8%8B%E8%BF%98%E8%83%BD%E8%AF%BB%E5%86%99%E5%90%97\",\"node\":\"transfer\",\"chapter\":3,\"follow\":[44,54]},{\"n\":56,\"title\":\"ConcurrentHashMap 为什么禁止 null 键和值？\",\"short\":\"ConcurrentHashMap 规定键和值均不得为 null。这样 get(k) 返回 null 时，调用方可以把它解释为本次查找没有映射。若还允许存入 null 值，就需要另外判断键是否存在，而两次方法调用之间映射可能已变化。\",\"details\":[\"普通 HashMap 可以让 containsKey 区分缺失键和映射为 null 的键，但在并发读写期间，两次查询观察的可能是不同状态。\",\"ConcurrentHashMap 也把 null 用作计算接口中的控制信号。computeIfAbsent 返回 null 时不安装映射，compute 或 merge 的重映射函数返回 null 时可移除该键。\",\"业务上需要表达“查过但结果为空”时，可以用 Optional 或自定义非 null 哨兵表示，并明确区分这种状态与键完全缺失。\"],\"example\":\"缓存里用 Optional.empty() 表示已经查询、确认没有结果。get 返回 null 则表示本次读取未发现任何缓存条目。\",\"pitfall\":\"null 键禁用是这个容器的契约选择。普通 HashMap 可以给 null 键定义桶位置，因此不能把拒绝 null 键归因于散列结构的限制。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ConcurrentHashMap.html\",\"anchor\":\"concurrenthashmap-%E4%B8%BA%E4%BB%80%E4%B9%88%E4%B8%8D%E5%85%81%E8%AE%B8-null-key-%E5%92%8C-null-value\",\"node\":\"chm-null\",\"chapter\":3,\"follow\":[40,57]},{\"n\":57,\"title\":\"ConcurrentHashMap 的 get 再 put 为什么会丢更新？\",\"short\":\"ConcurrentHashMap 能保证自身提供的单个并发操作符合契约。应用层分开的 get、判断和 put 之间，其他线程可以改动同一个键。按键初始化可用 putIfAbsent 或 computeIfAbsent，按当前值更新可用 compute 或 merge。\",\"details\":[\"两个线程可能先后读到同一个旧值，再各自写出相同的新值。每个 get 和 put 都正确完成，但业务上的两次加一只记录了一次。\",\"用 merge 做计数时，键不存在就写入初值，存在则原子地合并当前值。计算回调应短小，不要在其中修改同一张表。computeIfAbsent 的计算返回 null 或抛异常后，后续调用仍可能再次计算。\",\"原子计算只解决该映射的更新。跨键转账、容量限制或值对象内部的复合更新，需要额外的同步或业务约束。\"],\"example\":\"初值为 10，两线程用 get 后 put 都可能写成 11。改用 merge 后，每次都基于该键当时的当前值合并，结果是 12。\",\"pitfall\":\"先 putIfAbsent 再写入其他键仍是多步流程。多个键参与同一个业务条件时，要单独设计保证条件成立的边界。\",\"code\":\"ConcurrentHashMap\\u003cString, Integer> count = new ConcurrentHashMap\\u003c>();\\ncount.merge(\\\"click\\\", 1, Integer::sum);\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ConcurrentHashMap.html#merge(K,V,java.util.function.BiFunction)\",\"anchor\":\"concurrenthashmap-%E6%98%AF%E7%BA%BF%E7%A8%8B%E5%AE%89%E5%85%A8%E7%9A%84-%E5%85%88-get-%E5%86%8D-put-%E5%B0%B1%E4%B8%80%E5%AE%9A%E5%AE%89%E5%85%A8%E5%90%97\",\"node\":\"atomic\",\"chapter\":3,\"follow\":[54,58]},{\"n\":58,\"title\":\"ConcurrentHashMap 的 size 如何统计，能否拿它做并发判定？\",\"short\":\"在 OpenJDK 8u 中，低竞争时更新基础计数 baseCount，发生竞争后可分散到 CounterCell。size 会汇总这些计数并返回 int。并发增删时，结果适合监控和估算，用它先判定再执行业务写入无法保证条件持续成立。\",\"details\":[\"将写入分散到多份计数可以减少线程争抢单个变量。查询时逐个读取并累加，这些读取与其他线程的修改可以交错，所以没有取得整张表的统一快照。\",\"size 的返回类型是 int，结果过大时上限为 Integer.MAX_VALUE。mappingCount 返回 long，更适合大规模映射的估算，但并发修改时仍然是估计值。\",\"计数稳定且不再有并发修改时，结果可用于普通统计。若要严格限制新条目数量，容量检查、占用和失败时释放需要在一个一致的协议里处理。\"],\"example\":\"当前容量限制 100，两个线程都读到 size 为 99，随后各写入不同的新键，表可能增长到 101。\",\"pitfall\":\"把 size 换成 mappingCount 只改变返回范围。检查计数后再插入仍然存在竞态。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ConcurrentHashMap.html#mappingCount()\",\"anchor\":\"concurrenthashmap-%E7%9A%84-size-%E6%98%AF%E6%80%8E%E4%B9%88%E7%BB%9F%E8%AE%A1%E7%9A%84-%E5%B9%B6%E5%8F%91%E6%97%B6%E8%83%BD%E4%BD%9C%E4%B8%BA%E5%88%A4%E6%96%AD%E4%BE%9D%E6%8D%AE%E5%90%97\",\"node\":\"counts\",\"chapter\":3,\"follow\":[53,57]},{\"n\":59,\"title\":\"JDK 7 的分段锁怎样定位锁并执行写入？\",\"short\":\"OpenJDK 7u 的 ConcurrentHashMap 根据散列值定位 Segment，再在该段内部定位桶。Segment 继承 ReentrantLock，写线程需要持有目标段的锁，因此同段写入互斥，不同段上的写入可以并行。\",\"details\":[\"构造参数 concurrencyLevel 会用于确定段数，默认值为 16，段数按实现规则取 2 的幂。段数组创建后长度固定，除第一个段外可按需初始化。\",\"put 在找到目标 Segment 后，先尝试 tryLock。若失败，源码可一边扫描桶链一边重试，最终必要时阻塞等待锁。获得锁后重新读取实际桶并完成修改，最后释放锁。\",\"该段到达自己的容量阈值时，可以在锁内扩展段内桶表。普通 get 通过有可见性保证的读操作查段和桶，通常无需获取这把段锁。\"],\"example\":\"假设键 A 和 B 对应第 2 段的不同桶，它们的写入仍会争夺同一把锁。键 C 位于第 5 段时，可以与 A 在不同段上并行写入。\",\"pitfall\":\"segment 是这一版的锁粒度，桶是段内的存储粒度。谈 JDK 8 的实现时要换成统一桶数组的模型。\",\"ref\":\"https://raw.githubusercontent.com/openjdk/jdk7u/master/jdk/src/share/classes/java/util/concurrent/ConcurrentHashMap.java\",\"anchor\":\"jdk-1-7-%E4%B8%AD%E7%9A%84%E5%88%86%E6%AE%B5%E9%94%81%E6%98%AF%E6%80%8E%E4%B9%88%E5%8A%A0%E9%94%81%E7%9A%84\",\"node\":\"segment\",\"chapter\":3,\"follow\":[60,62]},{\"n\":60,\"title\":\"JDK 7 的 Segment 锁允许同一线程重复获取吗？\",\"short\":\"允许。OpenJDK 7u 的 Segment 继承 ReentrantLock。持锁线程可以再次获取同一把锁，每成功获取一次就增加一层持有次数，必须匹配相应次数的 unlock，其他线程才有机会取得锁。\",\"details\":[\"可重入的判断单位是线程和锁实例。同一线程持有 A 段锁，可以再次获取 A 段锁，访问 B 段则仍按 B 段自身的竞争规则处理。\",\"多层调用里如果同一线程间接回到一段受同一把锁保护的代码，可重入允许它继续执行。不同线程同时进入同一段的写临界区仍会互斥。\",\"Segment 锁属于实现内部机制，应用代码只能通过 Map 接口使用它。应用如果需要跨操作协调，应设计自己的同步范围。\"],\"example\":\"线程 T 对同一把 ReentrantLock 获取两次后，第一次 unlock 只把持有次数减为 1，第二次才真正释放。\",\"pitfall\":\"可重入不保证多个线程以同样的顺序获取不同的锁，跨锁调用仍需遵守一致的加锁顺序。\",\"ref\":\"https://raw.githubusercontent.com/openjdk/jdk7u/master/jdk/src/share/classes/java/util/concurrent/ConcurrentHashMap.java\",\"anchor\":\"%E5%88%86%E6%AE%B5%E9%94%81%E6%98%AF%E5%8F%AF%E9%87%8D%E5%85%A5%E7%9A%84%E5%90%97\",\"node\":\"segment\",\"chapter\":3,\"follow\":[59,61]},{\"n\":61,\"title\":\"ConcurrentHashMap 为什么把 CAS 和 synchronized 配合使用？\",\"short\":\"空桶插入可以化为一次比较并替换数组槽，CAS 足以完成这一步。非空桶更新常涉及查重、连接节点或调整树结构，OpenJDK 8u 一般用桶首对象上的 synchronized 保护整段逻辑。两条路径对应不同范围的修改。\",\"details\":[\"CAS 的前提是当前槽仍为空，成功就直接发布新节点。若另一个线程已抢先插入，当前操作会重新查看桶状态并选择相应分支。\",\"已有桶结构中的更新可能触及多处字段。进入桶监视器后还要复核桶首是否仍是此前读到的对象，避免在桶迁移或头部变化后操作过期位置。\",\"CAS 还用于协调表初始化、计数和扩容任务领取。它节省了某些路径的锁竞争，但发生竞争时也会带来重试，适用性与操作范围和竞争程度有关。\"],\"example\":\"A 和 B 同时想给空桶 7 放节点，只有一个 CAS 能成功。另一个线程重新读取桶 7，若需要往链表追加，就进入桶内同步路径。\",\"pitfall\":\"非空桶上的互斥针对该桶。映射状态涉及多个键时，桶内同步不会自动保护应用层的跨键业务条件。\",\"ref\":\"https://raw.githubusercontent.com/openjdk/jdk8u/master/jdk/src/share/classes/java/util/concurrent/ConcurrentHashMap.java\",\"anchor\":\"%E5%B7%B2%E7%BB%8F%E7%94%A8%E4%BA%86synchronized-%E4%B8%BA%E4%BB%80%E4%B9%88%E8%BF%98%E8%A6%81%E7%94%A8cas%E5%91%A2\",\"node\":\"cas\",\"chapter\":3,\"follow\":[53,62]},{\"n\":62,\"title\":\"从乐观更新和互斥更新看 ConcurrentHashMap 的不同路径\",\"short\":\"按 OpenJDK 8u 的执行路径区分。空桶插入用 CAS，先尝试在预期状态下完成更新，失败再重试，属于乐观更新。非空桶的结构修改通常先获取桶监视器，属于互斥更新。多数读操作依靠可见性与专用读路径完成。\",\"details\":[\"用“乐观”描述 CAS 时，强调线程先尝试提交，再根据是否有竞争决定重试。CAS 自身是一条原子更新机制。\",\"用“悲观”描述桶内同步时，强调先获取互斥权，再完成多步骤修改。竞争通常发生在同一个桶，其他桶仍能处理独立的写入。\",\"比较 JDK 版本时，OpenJDK 7u 的主要写入互斥单位是 Segment，OpenJDK 8u 是桶级更新。两代实现都需要可见性和原子操作来协调内部状态。\"],\"example\":\"同一张表里，put 到一个空桶可走 CAS。put 到已有长冲突链的桶通常走桶内互斥。get 则可与这两条路径并发运行。\",\"pitfall\":\"给整张表只贴一个乐观或悲观的标签，会遗漏读操作、不同桶状态和版本差异。面试时用具体操作描述适用机制。\",\"ref\":\"https://raw.githubusercontent.com/openjdk/jdk8u/master/jdk/src/share/classes/java/util/concurrent/ConcurrentHashMap.java\",\"anchor\":\"concurrenthashmap%E7%94%A8%E4%BA%86%E6%82%B2%E8%A7%82%E9%94%81%E8%BF%98%E6%98%AF%E4%B9%90%E8%A7%82%E9%94%81\",\"node\":\"cas\",\"chapter\":3,\"follow\":[59,61]},{\"n\":63,\"title\":\"Hashtable 怎样定位桶、处理冲突和扩容？\",\"short\":\"Hashtable 是基于桶数组和单向链表的哈希表。它根据键的 hashCode 定位桶，在桶内用哈希值和 equals 找匹配键。新增键达到阈值时会 rehash，现有键更新只替换值。键和值都不能为 null。\",\"details\":[\"在 OpenJDK 8u 的经典实现里，用 (hash & 0x7fffffff) % table.length 计算下标。冲突节点链接到同一桶，桶内比较时先检查缓存的哈希值，再检查键相等。\",\"默认初始容量为 11，默认负载因子为 0.75。新增键且现有条目数已达到 threshold 时，rehash 通常把容量增为 2 * oldCapacity + 1，再按新长度重新取模。实际实现还有容量上限。\",\"同桶节点使用链表。大规模碰撞会拉长桶内扫描路径。Hashtable 的常用读写由同一实例监视器保护。\"],\"example\":\"初始容量为 11，默认阈值为 8。已经有 8 个不同键时再插入第 9 个不同键，经典实现会先 rehash 到 23，再将新条目放入对应桶。\",\"pitfall\":\"不要把 Hashtable 的取模、容量增长和链表结构套成 HashMap 的位掩码、倍增和树桶。\",\"ref\":\"https://github.com/openjdk/jdk8u/blob/master/jdk/src/share/classes/java/util/Hashtable.java\",\"anchor\":\"hashtable-%E5%BA%95%E5%B1%82%E5%AE%9E%E7%8E%B0%E5%8E%9F%E7%90%86%E6%98%AF%E4%BB%80%E4%B9%88\",\"node\":\"table\",\"chapter\":3,\"follow\":[49,64]},{\"n\":64,\"title\":\"Hashtable 靠什么同步？多步操作怎样保证原子性？\",\"short\":\"Hashtable 的常用读写方法在实例上使用 synchronized。获得监视器的线程执行操作，其他需要同一把锁的线程等待。单次 get 或 put 受保护。若业务要把查询、判断和更新合成一步，应使用适用的原子方法，或将整个序列放进同一锁。\",\"details\":[\"get、put、remove 和 rehash 都在同一个 Hashtable 实例的同步边界内执行。实例之间使用各自的锁。\",\"监视器提供互斥，并通过解锁与后续加锁建立可见性。读写都获取同一把锁，访问不同桶也会竞争。\",\"集合视图是活视图。需要与所有写入互斥地遍历时，要按集合文档约定在 Hashtable 实例上同步整个遍历过程。旧 Enumeration 和视图迭代器的修改检测语义不同。\"],\"example\":\"两个线程都要对计数加一。分别调用 get 和 put，两个线程可能都读到 5 并写入 6。可在 synchronized (table) 中覆盖整个读改写，或用该类提供的 merge。\",\"code\":\"table.merge(\\\"hits\\\", 1, Integer::sum);\",\"pitfall\":\"方法加锁不会自动保护从 Map 取出的可变对象，也不会把任意多个调用合并为一个事务。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Hashtable.html\",\"anchor\":\"hashtable%E7%BA%BF%E7%A8%8B%E5%AE%89%E5%85%A8%E6%98%AF%E6%80%8E%E4%B9%88%E5%AE%9E%E7%8E%B0%E7%9A%84\",\"node\":\"table\",\"chapter\":3,\"follow\":[57,65]},{\"n\":65,\"title\":\"Hashtable 和 ConcurrentHashMap 的并发差异是什么？\",\"short\":\"两者都是线程安全的 Map 实现，也都拒绝 null 键和值。Hashtable 主要用实例级监视器串行化读写。现代 ConcurrentHashMap 的普通读通常不加锁，写入结合 CAS 与桶内同步，还能协作迁移桶，更适合多个线程共享且热点分散的映射。\",\"details\":[\"Hashtable 的不同键仍共用实例锁。现代 ConcurrentHashMap 对空桶安装可走 CAS，已有节点的桶通常只在更新那个桶时同步。\",\"并发读通过可见性机制读取节点。ConcurrentHashMap 的迭代器弱一致，遍历时可以继续更新。Hashtable 的普通视图迭代器一般是尽力而为的 fail-fast。\",\"ConcurrentHashMap 支持按键原子的 putIfAbsent、compute 和 merge。需要全表一致快照或跨键不变量时，应额外设计同步或数据模型。\"],\"example\":\"多个线程分别更新不同用户的访问计数时，按键 merge 可以分散竞争。所有线程都改同一个热门用户时，仍会在该键所在的更新路径发生竞争。\",\"pitfall\":\"ConcurrentHashMap 的并发收益取决于键分布和临界区耗时。不能从线程安全推出任意遍历或聚合都看到同一时刻的状态。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ConcurrentHashMap.html\",\"anchor\":\"hashtable-%E5%92%8C-concurrenthashmap%E6%9C%89%E4%BB%80%E4%B9%88%E5%8C%BA%E5%88%AB\",\"node\":\"chm\",\"chapter\":3,\"follow\":[53,66]},{\"n\":66,\"title\":\"HashMap、Hashtable、ConcurrentMap 分别适合什么场景？\",\"short\":\"HashMap 适合线程封闭、外部同步或安全发布后只读的场景，允许 null 键和值。Hashtable 是使用整实例锁的传统实现。ConcurrentMap 是并发 Map 接口，强调原子更新操作，ConcurrentHashMap 是常见实现。先看调用者需要的并发、排序和空值契约。\",\"details\":[\"HashMap 的普通读写没有同步保护。若用 Collections.synchronizedMap 包装，外部代码应统一经包装对象访问，迭代按其文档使用同一把锁。\",\"Hashtable 是具体类，ConcurrentMap 是接口。并发且按键排序时可考虑 ConcurrentSkipListMap。需要插入顺序时可考虑外部同步保护的 LinkedHashMap。\",\"变量用 ConcurrentMap 声明，可以直接表达按键原子更新的需求。对 null 的处理要看具体实现及方法契约，ConcurrentHashMap 明确拒绝 null。\"],\"example\":\"一次请求内聚合订单，用本地 HashMap。服务中跨线程缓存计算结果，用 ConcurrentMap\\u003cK,V> 声明并以 ConcurrentHashMap 实现，再用 computeIfAbsent 原子装入结果。\",\"code\":\"ConcurrentMap\\u003cString, Quote> cache = new ConcurrentHashMap\\u003c>();\\nQuote quote = cache.computeIfAbsent(sku, this::loadQuote);\",\"pitfall\":\"computeIfAbsent 的计算不应递归更新该映射，耗时的远程请求也会拖长同键等待。对重 I/O 缓存应独立设计并发和超时。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ConcurrentMap.html\",\"anchor\":\"%E8%AF%B4%E4%B8%80%E4%B8%8Bhashmap%E5%92%8Chashtable%E3%80%81concurrentmap%E7%9A%84%E5%8C%BA%E5%88%AB\",\"node\":\"sync\",\"chapter\":3,\"follow\":[3,65]},{\"n\":67,\"title\":\"Queue 和 Deque 有什么区别？空队列或满队列时怎么选方法？\",\"short\":\"Queue 表达入队和从队头取元素，常见实现按 FIFO，PriorityQueue 则按优先级。Deque 是双端队列，可以从两端加入和取出元素，因此既能模拟 FIFO 队列，也能用同一端模拟 LIFO 栈。选方法时要看失败应抛异常还是返回特殊值。\",\"details\":[\"Queue 的 add、remove、element 在相应失败时抛异常。offer 对容量不足返回 false，poll 和 peek 在为空时返回 null。poll 会删除队头，peek 只查看。\",\"Deque 按两端扩展为 offerFirst/Last、pollFirst/Last、peekFirst/Last。addLast 加入、pollFirst 取出可表达 FIFO。push/pop 分别对应从首端压入和弹出。\",\"ArrayDeque 可用于单线程 FIFO 或栈。它禁止 null，并且没有内部同步。并发共享时按是否需要阻塞和容量限制选择相应实现。\"],\"example\":\"BFS 从尾端添加新发现的节点，从首端弹出待处理节点。处理嵌套括号时则从同一端 push 和 pop。\",\"code\":\"Deque\\u003cInteger> queue = new ArrayDeque\\u003c>();\\nqueue.offerLast(3);\\nqueue.offerLast(5);\\nSystem.out.println(queue.pollFirst()); // 3\",\"pitfall\":\"Queue 接口不保证 FIFO。若需要双端语义，代码和声明都应表达 Deque，并明确使用哪一端。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Deque.html\",\"anchor\":\"queue-%E5%92%8C-deque-%E6%9C%89%E4%BB%80%E4%B9%88%E5%8C%BA%E5%88%AB-%E5%B8%B8%E7%94%A8%E6%96%B9%E6%B3%95%E6%9C%89%E4%BB%80%E4%B9%88%E5%8C%BA%E5%88%AB\",\"node\":\"deque\",\"chapter\":4,\"follow\":[15,69]},{\"n\":68,\"title\":\"PriorityQueue 为什么能快速取最小元素？怎样得到有序结果？\",\"short\":\"PriorityQueue 通常用数组表示二叉最小堆，默认按自然顺序，也可传 Comparator。堆只要求父节点的优先级不大于子节点，所以队首就是最优元素。迭代顺序没有排序保证。需要按优先级输出时，连续 poll，或对副本排序。\",\"details\":[\"数组下标 i 的子节点在 2i+1、2i+2。插入时从末尾上滤，弹出时用尾部补根再下滤。peek 为 O(1)，offer/poll 通常为 O(log n)。\",\"任意位置删除和 contains 通常要线性扫描。堆约束只连接父子，不保证兄弟或不同子树的顺序，同优先级的元素也没有稳定性保证。\",\"若要保留原队列，可复制为新的 PriorityQueue 后持续 poll。入队后直接修改影响比较结果的字段不会触发重新建堆，应移除后重新入队，或使用不可变任务键。\"],\"example\":\"任务按到期时间排序时，peek 只查看最近的截止时间。要按时序导出所有任务，可逐个 poll 副本。\",\"code\":\"var pq = new PriorityQueue\\u003c>(List.of(9, 2, 7, 3));\\nwhile (!pq.isEmpty()) System.out.println(pq.poll()); // 2, 3, 7, 9\",\"pitfall\":\"堆不是完整排序数组。想让同优先级按提交顺序处理，需要把递增序号写进比较器的第二排序键。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/PriorityQueue.html\",\"anchor\":\"priorityqueue-%E7%9A%84%E5%BA%95%E5%B1%82%E6%98%AF%E4%BB%80%E4%B9%88-%E9%81%8D%E5%8E%86%E7%BB%93%E6%9E%9C%E4%B8%80%E5%AE%9A%E6%9C%89%E5%BA%8F%E5%90%97\",\"node\":\"heap\",\"chapter\":4,\"follow\":[24,69]},{\"n\":69,\"title\":\"BlockingQueue 如何让生产者和消费者等待？常见实现怎么选？\",\"short\":\"BlockingQueue 在队列为空时让 take 等待，有界队列满时让 put 等待，也提供限时的 offer 和 poll。以 ArrayBlockingQueue 为例，用一把锁和 notEmpty、notFull 两个条件协调。选型要同时考虑容量、顺序、等待方式和背压。\",\"details\":[\"ArrayBlockingQueue 使用定长循环数组。生产者在锁内检查满条件，消费者在锁内检查空条件，await 会释放锁并在返回前重新获取。唤醒后用循环重查条件。\",\"LinkedBlockingQueue 用链表和分别用于插入、取出的锁，适合需要灵活容量的场景，通常应显式设上限。SynchronousQueue 没有存储容量，生产者和消费者直接交接。\",\"PriorityBlockingQueue 按比较器取元素，逻辑无界，put 不因满而阻塞。需要限制积压时应额外限制生产速率，或选择有界队列。\"],\"example\":\"文件任务超过处理能力时，可用容量为 256 的 ArrayBlockingQueue 加限时 offer。生产端超时后返回忙碌或采用业务定义的降级策略。\",\"code\":\"BlockingQueue\\u003cTask> queue = new ArrayBlockingQueue\\u003c>(256);\\nboolean accepted = queue.offer(task, 200, TimeUnit.MILLISECONDS);\\n// 消费线程使用 queue.take()，并处理 InterruptedException。\",\"pitfall\":\"阻塞队列不内置关闭协议。停止消费者通常需要中断、结束信号或由线程池管理生命周期。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/BlockingQueue.html\",\"anchor\":\"blockingqueue-%E6%80%8E%E4%B9%88%E5%AE%9E%E7%8E%B0%E7%94%9F%E4%BA%A7%E8%80%85%E3%80%81%E6%B6%88%E8%B4%B9%E8%80%85%E7%AD%89%E5%BE%85-%E5%B8%B8%E8%A7%81%E5%AE%9E%E7%8E%B0%E6%80%8E%E4%B9%88%E9%80%89\",\"node\":\"blocking\",\"chapter\":4,\"follow\":[57,67]}]};\nconst $ = id => document.getElementById(id);\nconst esc = value => String(value).replace(/[&\u003c>\"']/g, ch => (\n  {'&':'&amp;', '\u003c':'&lt;', '>':'&gt;', '\"':'&quot;', \"'\":'&#39;'}[ch]\n));\nconst questionNo = index => String(index + 1).padStart(2, '0');\nconst byId = new Map(DATA.nodes.map(node => [node.id, node]));\nconst byCat = new Map(DATA.cats.map(cat => [cat.id, cat]));\nconst byRoute = new Map(DATA.routes.map(item => [item.id, item]));\nconst edgeColors = {\n  基础依赖:'#547aab', 实现关系:'#527796', 共享原理:'#168769',\n  深入追问:'#6d62bb', 对比区别:'#c05765', 工程应用:'#aa6d24'\n};\nconst nodeEdges = id => DATA.edges.filter(edge => edge.a === id || edge.b === id);\nconst questionsByNode = new Map(DATA.nodes.map(node => [node.id, []]));\nDATA.questions.forEach((question, index) => questionsByNode.get(question.node).push(index));\n\nconst svg = $('map');\nconst state = {route:'all', category:null, selected:'hash', expanded:false};\nlet layout;\nlet view;\nlet drag;\nlet panelRatio = 0;\nconst pixelRatio = () => (svg.clientWidth || 860) / (svg.clientHeight || 555);\nconst columnsForWidth = () => (svg.clientWidth || 860) \u003c 545 ? 2 : 3;\n\nfunction makeSVG(tag, attrs = {}, content) {\n  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);\n  for (const [name, value] of Object.entries(attrs)) el.setAttribute(name, value);\n  if (content !== undefined) el.textContent = content;\n  return el;\n}\n\nfunction visibleNodes() {\n  if (state.category) return DATA.nodes.filter(node => node.cat === state.category);\n  const route = byRoute.get(state.route);\n  return DATA.nodes.filter(node =>\n    state.expanded || node.id === state.selected ||\n    (route.id === 'all' ? node.core : route.nodes.includes(node.id))\n  );\n}\n\nfunction arrange(nodes) {\n  const groups = DATA.cats.map(cat => ({\n    cat, nodes:nodes.filter(node => node.cat === cat.id)\n  })).filter(group => group.nodes.length);\n  const columns = Math.min(columnsForWidth(), groups.length);\n  const laneW = 218;\n  const gap = 42;\n  const step = 61;\n  const margin = 22;\n  const positions = new Map();\n  let rowY = margin;\n  for (let start = 0; start \u003c groups.length; start += columns) {\n    const row = groups.slice(start, start + columns);\n    const rowHeight = 80 + Math.max(...row.map(group => group.nodes.length)) * step;\n    row.forEach((group, col) => {\n      const x = margin + col * (laneW + gap);\n      Object.assign(group, {x, y:rowY, w:laneW, h:rowHeight});\n      group.nodes.forEach((node, index) => positions.set(node.id, {\n        x:x + 10, y:rowY + 75 + index * step, w:laneW - 20, h:48\n      }));\n    });\n    rowY += rowHeight + gap;\n  }\n  return {positions, groups, columns, width:2 * margin + columns * laneW + (columns - 1) * gap,\n    height:rowY - gap + margin};\n}\n\nfunction setView() {\n  svg.setAttribute('viewBox', [view.x, view.y, view.w, view.h].join(' '));\n}\n\nfunction fitGraph() {\n  panelRatio = pixelRatio();\n  const w = Math.max(layout.width, layout.height * panelRatio);\n  const h = w / panelRatio;\n  view = {x:(layout.width - w) / 2, y:(layout.height - h) / 2, w, h};\n  setView();\n}\n\nfunction focusNode(id) {\n  const pos = layout.positions.get(id);\n  const w = Math.max(310, Math.min(560, svg.clientWidth || 560));\n  const h = w / pixelRatio();\n  view = {x:pos.x + (pos.w - w) / 2, y:pos.y + (pos.h - h) / 2, w, h};\n  setView();\n}\n\nfunction zoomFromCenter(scale) {\n  const fitWidth = Math.max(layout.width, layout.height * pixelRatio());\n  const w = Math.max(185, Math.min(Math.max(850, 2 * fitWidth), view.w * scale));\n  const h = w / pixelRatio();\n  view = {x:view.x + (view.w - w) / 2, y:view.y + (view.h - h) / 2, w, h};\n  setView();\n}\n\nfunction edgePath(from, to) {\n  const dx = to.x - from.x;\n  const dy = to.y - from.y;\n  if (Math.abs(dx) > 1) {\n    const right = dx > 0;\n    const x1 = from.x + (right ? from.w : 0);\n    const x2 = to.x + (right ? 0 : to.w);\n    const mid = (x1 + x2) / 2;\n    const y1 = from.y + from.h / 2;\n    const y2 = to.y + to.h / 2;\n    return `M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`;\n  }\n  const x = from.x + from.w;\n  const y1 = from.y + from.h / 2;\n  const y2 = to.y + to.h / 2;\n  return `M ${x} ${y1} C ${x + 38} ${y1}, ${x + 38} ${y2}, ${x} ${y2}`;\n}\n\nfunction drawGraph() {\n  const route = byRoute.get(state.route);\n  const nodes = visibleNodes();\n  layout = arrange(nodes);\n  const {positions, groups, width, height} = layout;\n  const related = new Set(nodeEdges(state.selected).flatMap(edge => [edge.a, edge.b]));\n  const linked = edge => edge.a === state.selected || edge.b === state.selected;\n  const onRoute = edge => route.id !== 'all' && route.nodes.includes(edge.a) && route.nodes.includes(edge.b);\n  const edges = DATA.edges.filter(edge => positions.has(edge.a) && positions.has(edge.b));\n  edges.sort((a,b) => Number(linked(a)) - Number(linked(b)));\n\n  const defs = makeSVG('defs');\n  const pattern = makeSVG('pattern', {id:'grid', width:20, height:20, patternUnits:'userSpaceOnUse'});\n  pattern.append(makeSVG('circle', {cx:1, cy:1, r:1, fill:'#dce4ef'}));\n  defs.append(pattern);\n  Object.entries(edgeColors).forEach(([kind,color], index) => {\n    const marker = makeSVG('marker', {id:'arrow' + index, viewBox:'0 0 8 8', refX:7,\n      refY:4, markerWidth:6, markerHeight:6, orient:'auto', markerUnits:'userSpaceOnUse'});\n    marker.append(makeSVG('path', {d:'M 0 0 L 8 4 L 0 8 Z', fill:color}));\n    defs.append(marker);\n  });\n  const stage = makeSVG('g');\n  stage.append(makeSVG('rect', {width, height, fill:'url(#grid)'}));\n  for (const {cat,x,y,w,h,nodes:members} of groups) {\n    stage.append(\n      makeSVG('rect', {x,y,width:w,height:h,rx:16,fill:cat.color,'fill-opacity':'.055',stroke:cat.color,'stroke-opacity':'.23'}),\n      makeSVG('text', {x:x + 11,y:y + 24,class:'svg-catlabel',fill:cat.color}, cat.label),\n      makeSVG('text', {x:x + 11,y:y + 44,class:'svg-catdesc'}, cat.desc),\n      makeSVG('text', {x:x + 11,y:y + 61,class:'svg-count'}, `${members.length} 个可见节点`)\n    );\n  }\n  const edgeLayer = makeSVG('g');\n  for (const edge of edges) {\n    const active = linked(edge);\n    const featured = onRoute(edge);\n    const path = makeSVG('path', {\n      d:edgePath(positions.get(edge.a), positions.get(edge.b)), fill:'none', class:'svg-edge',\n      stroke:edgeColors[edge.kind], 'stroke-width':active ? 3 : featured ? 2.3 : 1.4,\n      'stroke-opacity':active ? '.95' : featured ? '.75' : '.33',\n      'stroke-linecap':'round'\n    });\n    if (edge.kind === '对比区别') path.setAttribute('stroke-dasharray', '5 4');\n    if (active || featured) path.setAttribute('marker-end', `url(#arrow${Object.keys(edgeColors).indexOf(edge.kind)})`);\n    path.append(makeSVG('title', {}, `${byId.get(edge.a).title} → ${byId.get(edge.b).title}\\n${edge.why}`));\n    path.addEventListener('click', () => selectNode(edge.b, false, edge));\n    edgeLayer.append(path);\n  }\n  stage.append(edgeLayer);\n  const nodeLayer = makeSVG('g');\n  for (const node of nodes) {\n    const pos = positions.get(node.id);\n    const color = byCat.get(node.cat).color;\n    const selected = node.id === state.selected;\n    const card = makeSVG('g', {\n      transform:`translate(${pos.x},${pos.y})`,class:'svg-node','data-node':node.id,\n      tabindex:0,role:'button','aria-label':node.title,'aria-pressed':String(selected)\n    });\n    card.append(\n      makeSVG('rect', {width:pos.w,height:pos.h,rx:9,class:'nodebox',fill:'#fff',\n        stroke:selected || related.has(node.id) ? color : '#cdd9e8','stroke-width':selected ? 2.5 : 1}),\n      makeSVG('rect', {width:4,height:pos.h,rx:2,fill:color}),\n      makeSVG('text', {x:12,y:20,class:'svg-title'}, node.title),\n      makeSVG('text', {x:12,y:36,class:'svg-sub'}, node.sub),\n      makeSVG('title', {}, node.what)\n    );\n    card.addEventListener('click', () => selectNode(node.id));\n    card.addEventListener('keydown', event => {\n      if (event.key !== 'Enter' && event.key !== ' ') return;\n      event.preventDefault();\n      selectNode(node.id);\n      svg.querySelector(`[data-node=\"${node.id}\"]`)?.focus();\n    });\n    nodeLayer.append(card);\n  }\n  stage.append(nodeLayer);\n  svg.replaceChildren(defs, stage);\n  $('shownStat').textContent = `显示 ${nodes.length}/${DATA.nodes.length} 个节点 · ${edges.length} 条关系`;\n  $('mapInfo').textContent = state.category ? byCat.get(state.category).label.slice(5) : route.title;\n}\n\nfunction renderDetail(clickedEdge) {\n  const node = byId.get(state.selected);\n  const cat = byCat.get(node.cat);\n  const items = questionsByNode.get(node.id);\n  const neighbors = nodeEdges(node.id);\n  $('detail').innerHTML = `\n    \u003cdiv class=\"detail-type\">\u003cspan class=\"categorylabel\" style=\"background:${cat.color}18;color:${cat.color}\">${esc(cat.label)}\u003c/span>\u003c/div>\n    \u003ch2>${esc(node.title)}\u003c/h2>\u003cdiv class=\"subtitle\">${esc(node.sub)}\u003c/div>\u003cp>${esc(node.what)}\u003c/p>\n    \u003cdiv class=\"info-card\">\u003ch4>面试时要讲清楚\u003c/h4>\u003cp>${esc(node.take)}\u003c/p>\u003c/div>\n    ${clickedEdge ? `\u003cdiv class=\"info-card edge-detail\">\u003ch4>${esc(byId.get(clickedEdge.a).title)} → ${esc(byId.get(clickedEdge.b).title)}\u003c/h4>\u003cp>${esc(clickedEdge.why)}\u003c/p>\u003c/div>` : ''}\n    \u003cdiv>\u003cdiv class=\"section-cap\">为什么与这些知识相关\u003c/div>\u003cdiv class=\"related\">${neighbors.map(edge => {\n      const outbound = edge.a === node.id;\n      const other = byId.get(outbound ? edge.b : edge.a);\n      return `\u003cbutton class=\"related-btn\" data-related=\"${other.id}\">\u003cb style=\"color:${edgeColors[edge.kind]}\">${outbound ? '→' : '←'} ${edge.kind}\u003c/b>　${esc(other.title)}\u003csmall>${esc(edge.why)}\u003c/small>\u003c/button>`;\n    }).join('')}\u003c/div>\u003c/div>\n    \u003cdiv class=\"info-card\">\u003ch4>关联面试题 · ${items.length} 道\u003c/h4>${items.length\n      ? `\u003cdiv class=\"detail-questions\">${items.map(index => `\u003cbutton class=\"related-btn\" data-openq=\"${index}\">${questionNo(index)} · ${esc(DATA.questions[index].title)}\u003c/button>`).join('')}\u003c/div>`\n      : '\u003cp>可通过上方关联进入相邻主题的题解。\u003c/p>'}\u003c/div>`;\n}\n\nfunction selectNode(id, locate = false, edge) {\n  if (!layout.positions.has(id)) {\n    state.route = 'all';\n    state.category = null;\n    state.expanded = true;\n    state.selected = id;\n    refreshScope();\n  } else {\n    state.selected = id;\n    drawGraph();\n    renderDetail(edge);\n  }\n  if (locate) focusNode(id);\n}\n\nfunction updateScopeControls() {\n  $('expandBtn').textContent = state.expanded ? '− 收起次级知识点' : '＋ 展开全部知识点';\n  $('expandBtn').setAttribute('aria-pressed', String(state.expanded));\n  $('expandBtn').classList.toggle('active', state.expanded);\n  document.querySelectorAll('[data-route]').forEach(button => {\n    const active = !state.category && button.dataset.route === state.route;\n    button.classList.toggle('active', active);\n    button.setAttribute('aria-pressed', String(active));\n  });\n  document.querySelectorAll('[data-category]').forEach(button => {\n    const active = button.dataset.category === state.category;\n    button.classList.toggle('active', active);\n    button.setAttribute('aria-pressed', String(active));\n  });\n}\n\nfunction refreshScope() {\n  updateScopeControls();\n  drawGraph();\n  fitGraph();\n  renderDetail();\n}\n\nfunction chooseRoute(id) {\n  const route = byRoute.get(id);\n  state.route = id;\n  state.category = null;\n  state.expanded = false;\n  state.selected = route.nodes[0] || 'hash';\n  refreshScope();\n}\n\n$('routes').innerHTML = DATA.routes.map(route => `\n  \u003cbutton class=\"route-btn\" data-route=\"${route.id}\">\u003cstrong>${route.icon}　${esc(route.title)}\u003c/strong>\u003cspan>${esc(route.desc)}\u003c/span>\u003c/button>\n`).join('');\n$('catnav').innerHTML = DATA.cats.map(cat => `\n  \u003cbutton data-category=\"${cat.id}\" style=\"border-left:3px solid ${cat.color}\">${esc(cat.label.slice(5))}\u003c/button>\n`).join('');\n$('routes').addEventListener('click', event => {\n  const button = event.target.closest('[data-route]');\n  if (button) chooseRoute(button.dataset.route);\n});\n$('catnav').addEventListener('click', event => {\n  const button = event.target.closest('[data-category]');\n  if (!button) return;\n  state.category = button.dataset.category;\n  state.route = 'all';\n  state.expanded = false;\n  state.selected = DATA.nodes.find(node => node.cat === state.category && node.core).id;\n  refreshScope();\n});\n$('detail').addEventListener('click', event => {\n  const button = event.target.closest('[data-related]');\n  if (button) selectNode(button.datas
