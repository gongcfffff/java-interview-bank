et.related, true);\n});\n$('resetBtn').onclick = () => chooseRoute('all');\n$('expandBtn').onclick = () => {\n  state.expanded = !state.expanded || Boolean(state.category);\n  state.category = null;\n  refreshScope();\n};\n$('zoomOut').onclick = () => zoomFromCenter(1.25);\n$('zoomIn').onclick = () => zoomFromCenter(.8);\n$('fitBtn').onclick = fitGraph;\n$('heroGraphBtn').onclick = () => $('graphArea').scrollIntoView({behavior:'smooth'});\n\nsvg.addEventListener('pointerdown', event => {\n  if (!event.isPrimary || event.button !== 0 || event.target.closest('.svg-node,.svg-edge')) return;\n  drag = {id:event.pointerId, x:event.clientX, y:event.clientY, vx:view.x, vy:view.y};\n  svg.setPointerCapture(event.pointerId);\n  svg.classList.add('dragging');\n});\nsvg.addEventListener('pointermove', event => {\n  if (drag?.id !== event.pointerId) return;\n  view.x = drag.vx - (event.clientX - drag.x) * view.w / (svg.clientWidth || 1);\n  view.y = drag.vy - (event.clientY - drag.y) * view.h / (svg.clientHeight || 1);\n  setView();\n});\nfor (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {\n  svg.addEventListener(type, event => {\n    if (drag?.id !== event.pointerId) return;\n    drag = null;\n    svg.classList.remove('dragging');\n  });\n}\nfunction resizeGraph() {\n  const desired = Math.min(columnsForWidth(), layout.groups.length);\n  if (desired !== layout.columns) {\n    drawGraph();\n    fitGraph();\n  } else if (Math.abs(panelRatio - pixelRatio()) > .001) {\n    const h = view.w / pixelRatio();\n    view.y += (view.h - h) / 2;\n    view.h = h;\n    panelRatio = pixelRatio();\n    setView();\n  }\n}\nrefreshScope();\nif ('ResizeObserver' in window) new ResizeObserver(resizeGraph).observe(svg);\nelse window.addEventListener('resize', resizeGraph);\n\nconst totalQuestions = DATA.questions.length;\nconst progressKey = 'java_collections_atlas_learned_v1';\nconst overlay = $('studyOverlay');\nconst article = $('studyArticle');\nconst searchText = DATA.questions.map(question => [\n  question.title, question.short, ...question.details, question.example,\n  question.pitfall, question.code || '', byId.get(question.node).title, DATA.chapters[question.chapter]\n].join(' ').toLowerCase());\nlet progress = new Set();\nlet currentQuestion = 0;\nlet lastFocused;\ntry {\n  const saved = JSON.parse(localStorage.getItem(progressKey) || '[]');\n  if (Array.isArray(saved)) progress = new Set(saved.filter(i => Number.isInteger(i) && i >= 0 && i \u003c totalQuestions));\n} catch {}\n\nconst matches = (index, term) => term.split(/\\s+/).every(word => searchText[index].includes(word));\nconst groupedQuestions = DATA.chapters.map((_, chapter) =>\n  DATA.questions.flatMap((question, index) => question.chapter === chapter ? [index] : [])\n);\n\nfunction renderProgress() {\n  const amount = `${progress.size} / ${totalQuestions}`;\n  $('hubProgressText').textContent = '已学 ' + amount;\n  $('studyProgressText').textContent = '学习进度 ' + amount;\n  for (const id of ['hubProgressFill','studyProgressFill']) {\n    $(id).style.width = progress.size / totalQuestions * 100 + '%';\n  }\n}\n\nfunction renderIndex() {\n  const term = $('qsearch').value.trim().toLowerCase();\n  let count = 0;\n  $('qgroups').innerHTML = groupedQuestions.map((indices, chapter) => {\n    const shown = indices.filter(index => matches(index, term));\n    count += shown.length;\n    if (!shown.length) return '';\n    const buttons = shown.map(index => `\n      \u003cbutton class=\"question-item${progress.has(index) ? ' learned' : ''}\" data-openq=\"${index}\">\n        \u003cb>${questionNo(index)}\u003c/b>${esc(DATA.questions[index].title)}\n      \u003c/button>`).join('');\n    return `\u003csection class=\"qgroup\">\u003cdiv class=\"qhead\">${esc(DATA.chapters[chapter])}\n      \u003cspan class=\"qcount\">${shown.length} 题\u003c/span>\u003c/div>\u003cdiv class=\"qlist\">${buttons}\u003c/div>\u003c/section>`;\n  }).join('') || '\u003cp class=\"empty\">没有匹配的题目。\u003c/p>';\n  $('indexCount').textContent = `${count} / ${totalQuestions} 道`;\n}\n\nfunction renderStudyNav() {\n  $('mobileJump').value = String(currentQuestion);\n  const term = $('studyFilter').value.trim().toLowerCase();\n  $('studyRailNav').innerHTML = groupedQuestions.map((indices, chapter) => {\n    const shown = indices.filter(index => matches(index, term));\n    if (!shown.length) return '';\n    return `\u003cdiv class=\"study-rail-label\">${esc(DATA.chapters[chapter])}\u003c/div>` +\n      shown.map(index => `\n        \u003cbutton class=\"study-qnav${index === currentQuestion ? ' active' : ''}${progress.has(index) ? ' done' : ''}\"\n          data-openq=\"${index}\"${index === currentQuestion ? ' aria-current=\"true\"' : ''}>\n          \u003cspan class=\"num\">${progress.has(index) ? '✓' : questionNo(index)}\u003c/span>\n          \u003cspan class=\"txt\">${esc(DATA.questions[index].title)}\u003c/span>\n        \u003c/button>`).join('');\n  }).join('') || '\u003cp class=\"empty\">没有匹配的题目。\u003c/p>';\n  if (!term) $('studyRailNav').querySelector('[aria-current]')?.scrollIntoView({block:'nearest'});\n}\n\nfunction renderAnswer() {\n  const question = DATA.questions[currentQuestion];\n  const node = byId.get(question.node);\n  const edges = nodeEdges(node.id);\n  article.innerHTML = `\n    \u003cdiv class=\"study-eyebrow\">第 ${questionNo(currentQuestion)} / ${totalQuestions} 题 · ${esc(DATA.chapters[question.chapter])}\u003c/div>\n    \u003ch2>${esc(question.title)}\u003c/h2>\n    \u003cdiv class=\"study-intro\">图谱节点 · ${esc(node.title)}\u003c/div>\n    \u003csection class=\"study-panel quick\">\u003ch3>\u003cspan class=\"kicker\">口述\u003c/span>面试时怎么答\u003c/h3>\u003cp>${esc(question.short)}\u003c/p>\u003c/section>\n    \u003csection class=\"study-panel\">\u003ch3>\u003cspan class=\"kicker\">原理\u003c/span>机制拆解\u003c/h3>\n      \u003col class=\"study-points\">${question.details.map((point, i) => `\u003cli>\u003cspan class=\"step\">${i + 1}\u003c/span>\u003cspan>${esc(point)}\u003c/span>\u003c/li>`).join('')}\u003c/ol>\n    \u003c/section>\n    \u003csection class=\"study-panel example\">\u003ch3>\u003cspan class=\"kicker\">例子\u003c/span>放到代码或场景里看\u003c/h3>\n      \u003cp>${esc(question.example)}\u003c/p>${question.code ? `\u003cpre class=\"study-code\">\u003ccode>${esc(question.code)}\u003c/code>\u003c/pre>` : ''}\n    \u003c/section>\n    \u003csection class=\"study-panel warning\">\u003ch3>\u003cspan class=\"kicker\">边界\u003c/span>常见易错点\u003c/h3>\u003cp>${esc(question.pitfall)}\u003c/p>\u003c/section>\n    \u003csection class=\"study-panel\">\u003ch3>\u003cspan class=\"kicker\">图谱\u003c/span>为什么会追问到这里\u003c/h3>\n      \u003cdiv class=\"study-nodechips\">\n        \u003cbutton class=\"study-chip main-chip\" data-gonode=\"${node.id}\">◎ ${esc(node.title)}\u003csmall>返回图谱定位\u003c/small>\u003c/button>\n        ${edges.map(edge => {\n          const other = byId.get(edge.a === node.id ? edge.b : edge.a);\n          return `\u003cbutton class=\"study-chip\" data-gonode=\"${other.id}\">${esc(other.title)}\u003csmall>${edge.kind} · ${esc(edge.why)}\u003c/small>\u003c/button>`;\n        }).join('')}\n      \u003c/div>\n    \u003c/section>\n    \u003csection class=\"study-panel\">\u003ch3>\u003cspan class=\"kicker\">下一题\u003c/span>适合连起来看的题\u003c/h3>\n      \u003cdiv class=\"study-followups\">${question.follow.map(n => `\n        \u003cbutton class=\"study-chip\" data-openq=\"${n - 1}\">${questionNo(n - 1)} · ${esc(DATA.questions[n - 1].title)}\u003c/button>`).join('')}\u003c/div>\n    \u003c/section>\n    \u003cdiv class=\"study-actions\">\u003cdiv class=\"study-foot\">\n      \u003cbutton data-openq=\"${currentQuestion - 1}\" ${currentQuestion === 0 ? 'disabled' : ''}>← 上一题\u003c/button>\n      \u003cbutton data-openq=\"${currentQuestion + 1}\" ${currentQuestion === totalQuestions - 1 ? 'disabled' : ''}>下一题 →\u003c/button>\n    \u003c/div>\u003cbutton class=\"affirm${progress.has(currentQuestion) ? ' done' : ''}\" id=\"markLearned\">${progress.has(currentQuestion) ? '✓ 已学 · 点击取消' : '标记为已学'}\u003c/button>\u003c/div>\n    \u003cdiv class=\"study-foot\">\n      \u003ca class=\"study-source\" href=\"${DATA.source}#${question.anchor}\" target=\"_blank\" rel=\"noopener\">查看原题 ↗\u003c/a>\n      ${question.ref ? `\u003ca class=\"study-source\" href=\"${esc(question.ref)}\" target=\"_blank\" rel=\"noopener\">技术参考 ↗\u003c/a>` : ''}\n    \u003c/div>`;\n}\n\nfunction replaceHash(hash) {\n  try { history.replaceState(null, '', hash || location.pathname + location.search); } catch {}\n}\n\nfunction openQuestion(index) {\n  if (!Number.isInteger(index) || index \u003c 0 || index >= totalQuestions) return;\n  if (overlay.hidden) {\n    lastFocused = document.activeElement;\n    overlay.hidden = false;\n    $('shell').inert = true;\n    document.body.style.overflow = 'hidden';\n  }\n  currentQuestion = index;\n  renderAnswer();\n  renderStudyNav();\n  article.scrollTop = 0;\n  article.focus({preventScroll:true});\n  if (location.hash !== '#q' + (index + 1)) replaceHash('#q' + (index + 1));\n}\n\nfunction closeQuestion(restoreFocus = true) {\n  overlay.hidden = true;\n  $('shell').inert = false;\n  document.body.style.overflow = '';\n  if (/^#q\\d+$/.test(location.hash)) replaceHash('');\n  if (restoreFocus) lastFocused?.focus({preventScroll:true});\n}\n\nfunction goToGraph(id) {\n  closeQuestion(false);\n  selectNode(id, true);\n  $('graphArea').scrollIntoView({behavior:'smooth'});\n  svg.querySelector(`[data-node=\"${id}\"]`)?.focus({preventScroll:true});\n}\n\n$('nodeStat').textContent = DATA.nodes.length;\n$('edgeStat').textContent = DATA.edges.length;\n$('heroOpenBtn').onclick = $('hubOpenBtn').onclick = () => openQuestion(currentQuestion);\n$('heroBrowseBtn').onclick = () => $('questionIndex').scrollIntoView({behavior:'smooth'});\n$('closeStudy').onclick = () => closeQuestion();\n$('openMapFromStudy').onclick = () => goToGraph(DATA.questions[currentQuestion].node);\n$('qsearch').addEventListener('input', renderIndex);\n$('studyFilter').addEventListener('input', renderStudyNav);\n$('mobileJump').innerHTML = DATA.questions.map((question, index) =>\n  `\u003coption value=\"${index}\">${questionNo(index)} · ${esc(question.title)}\u003c/option>`\n).join('');\n$('mobileJump').onchange = event => openQuestion(Number(event.target.value));\n\ndocument.addEventListener('click', event => {\n  const question = event.target.closest('[data-openq]');\n  const graphNode = event.target.closest('[data-gonode]');\n  if (question && !question.disabled) openQuestion(Number(question.dataset.openq));\n  else if (graphNode) goToGraph(graphNode.dataset.gonode);\n  else if (event.target.id === 'markLearned') {\n    if (progress.has(currentQuestion)) progress.delete(currentQuestion);\n    else progress.add(currentQuestion);\n    try { localStorage.setItem(progressKey, JSON.stringify([...progress])); } catch {}\n    renderProgress();\n    $('qgroups').querySelector(`[data-openq=\"${currentQuestion}\"]`)\n      ?.classList.toggle('learned', progress.has(currentQuestion));\n    renderAnswer();\n    renderStudyNav();\n    $('markLearned').focus({preventScroll:true});\n  } else if (event.target === overlay) closeQuestion();\n});\n\ndocument.addEventListener('keydown', event => {\n  if (overlay.hidden) return;\n  if (event.key === 'Escape') {\n    closeQuestion();\n    return;\n  }\n  if (event.target.closest('input, select, textarea, button, a')) return;\n  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {\n    event.preventDefault();\n    openQuestion(currentQuestion + (event.key === 'ArrowLeft' ? -1 : 1));\n  }\n});\nrenderProgress();\nrenderIndex();\nconst initialQuestion = location.hash.match(/^#q(\\d+)$/);\nif (initialQuestion) openQuestion(Number(initialQuestion[1]) - 1);\n\n\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","questions":[{"title":"数组与集合在容量、元素类型和访问方式上有什么差别？","topic":"数组与集合"},{"title":"怎样按接口职责理解 Java 集合框架？","topic":"集合接口体系"},{"title":"Java 中常用的线程安全集合有哪些？","topic":"同步包装与并发 d7f0e5}.study-source{font-size:11px;color:#7990a8;margin-top:18px}.progress-track{height:6px;width:110px;border-radius:8px;background:#e6ebf2;overflow:hidden}.progress-track i{display:block;background:#23a17c;height:100%;width:0;border-radius:9px;transition:width .2s}\n@media(max-width:1450px){.shell{padding:16px}.workspace{grid-template-columns:224px minmax(360px,1fr) 276px}.sidebar{padding:13px 9px}.mechanisms{gap:7px}}\n@media(max-width:1160px){.workspace{grid-template-columns:235px minmax(0,1fr)}.inspector{grid-column:1/-1}.rel-list{max-height:210px}.mechanisms{grid-template-columns:repeat(2,minmax(0,1fr))}.qgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media(max-width:770px){.shell{padding:9px}.hero{padding:24px 18px 20px}.hero-link{margin-left:0}.workspace{display:flex;flex-direction:column}.sidebar{order:1}.map-panel{order:2}.inspector{order:3}.route-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.route{min-height:71px}.line-card{padding:13px}.mechanisms{grid-template-columns:1fr 1fr}.mechanism{padding:10px;min-height:128px}.viewport{height:490px;min-height:490px}.qgrid{grid-template-columns:1fr}.index{padding:14px}.idxsearch{width:100%;min-width:0}.modal{padding:0}.study{height:100dvh;width:100vw;border-radius:0}.studybody{display:block}.studyrail{display:none}.article{height:100%;padding:19px 18px 40px}.studyhead{padding:10px}.studyhead .progress-track{display:none}.studyhead span{font-size:10px}.studyactions .learn{margin-left:0}.maptools .tool{font-size:10px}}\n@media(max-width:430px){.mechanisms{grid-template-columns:1fr}.route-list{grid-template-columns:1fr 1fr}.route strong{font-size:11px}.viewport{height:460px;min-height:460px}}\n@media print{.hero,.sidebar,.map-panel,.inspector,.line-card,.index,.studyhead,.studyrail,.studyactions{display:none!important}.modal{position:static;display:block;background:none;padding:0}.study{display:block;box-shadow:none;height:auto;width:100%}.article{height:auto;overflow:visible;padding:0}.answerbox{break-inside:avoid}.article h2{font-size:22px}}\n\u003c/style>\u003c/head>\n\u003cbody>\u003cdiv class=\"shell\">\n\u003cheader class=\"hero\">\u003cdiv class=\"eyebrow\">JAVA CONCURRENCY · INTERACTIVE KNOWLEDGE ATLAS\u003c/div>\n\u003ch1>Java 并发编程 · 整章知识关联网络\u003c/h1>\n\u003cp>不是按目录背答案，而是把「线程 → JMM → 原子性 → CAS / Monitor → AQS → 并发容器 / 线程池 → 工程排查」串起来。点击节点可看它共享的底层机制，点击题目阅读完整解析、代码、误区与下一层追问。\u003c/p>\n\u003cdiv class=\"hero-bottom\">\u003cdiv class=\"metric\">\u003cb>73\u003c/b> 原章面试题\u003c/div>\u003cdiv class=\"metric\">\u003cb>67\u003c/b> 核心概念节点\u003c/div>\u003cdiv class=\"metric\">\u003cb>127\u003c/b> 条解释型关联\u003c/div>\u003cdiv class=\"metric\" id=\"progressText\">\u003cb>0/73\u003c/b> 已掌握\u003c/div>\u003ca class=\"hero-link\" href=\"https://xiaolincoding.com/interview/juc.html\" target=\"_blank\" rel=\"noopener noreferrer\">↗ 查看小林 coding 原章\u003c/a>\u003c/div>\n\u003cdiv class=\"hero-actions\">\u003cbutton class=\"primary\" id=\"startStudy\">📖 从第 1 题开始学习\u003c/button>\u003cbutton class=\"secondary-on-dark\" id=\"viewMap\">◎ 浏览知识关联图\u003c/button>\u003cbutton class=\"secondary-on-dark\" id=\"reviewOpen\">↗ 只看未掌握题目\u003c/button>\u003c/div>\u003c/header>\n\u003csection class=\"line-card\">\u003cdiv class=\"line-head\">\u003cdiv>\u003ch2>不是简单树形图：这些知识点共用什么底层原理？\u003c/h2>\u003cp>从共同机制入手，再分别进入具体实现；点卡片，知识网络会定位到这条追问路线。\u003c/p>\u003c/div>\u003cspan class=\"minor-pill\">横向关联 × 深入追问\u003c/span>\u003c/div>\n\u003cdiv class=\"mechanisms\">\n\u003cbutton class=\"mechanism\" data-mech=\"jmm\">\u003cb>JMM → volatile → DCL\u003c/b>\u003cspan class=\"desc\">可见性、happens-before、安全发布共享同一套内存语义。\u003c/span>\u003cdiv class=\"branch\">为什么 volatile 不能保护 count++？ ↗\u003c/div>\u003c/button>\n\u003cbutton class=\"mechanism\" data-mech=\"collections\">\u003cb>CAS → 原子类 / AQS / CHM\u003c/b>\u003cspan class=\"desc\">都是原子更新基础，但分别负责单值更新、同步队列与 Map 协调。\u003c/span>\u003cdiv class=\"branch\">CAS 和 AQS 是什么关系？ ↗\u003c/div>\u003c/button>\n\u003cbutton class=\"mechanism\" data-mech=\"locks\">\u003cb>synchronized ↔ ReentrantLock\u003c/b>\u003cspan class=\"desc\">共同保证互斥与可见性，但底层等待机制、API 和配置不同。\u003c/span>\u003cdiv class=\"branch\">再深入：公平锁、可重入、死锁 ↗\u003c/div>\u003c/button>\n\u003cbutton class=\"mechanism\" data-mech=\"pool\">\u003cb>线程池 → 队列 → 背压\u003c/b>\u003cspan class=\"desc\">core → queue → max → reject；队列设计决定扩容和拒绝行为。\u003c/span>\u003cdiv class=\"branch\">为什么 maxPoolSize 可能无效？ ↗\u003c/div>\u003c/button>\n\u003c/div>\u003c/section>\n\u003cdiv class=\"workspace\" id=\"mapWorkspace\">\n\u003caside class=\"panel sidebar\">\u003csection>\u003ch3 class=\"cap\">从问题出发 · 选择探索路线\u003c/h3>\u003cdiv class=\"route-list\" id=\"routeList\">\u003c/div>\u003c/section>\n\u003csection>\u003ch3 class=\"cap\">连线代表什么\u003c/h3>\u003cdiv class=\"legend\" id=\"legend\">\u003c/div>\u003c/section>\n\u003cdiv class=\"tip\">\u003cb>读图方法\u003c/b>\u003cbr>① 选一个问题链；② 看高亮节点和连线；③ 点击节点，看它与其他机制如何关联；④ 点击题目进入完整答案。\u003cbr>\u003cbr>拖动画布可平移，用图上方的「−」「+」缩放，点「适应视图」看当前范围。\u003c/div>\u003c/aside>\n\u003cmain class=\"panel map-panel\">\u003cdiv class=\"maptools\">\n  \u003cstrong>知识联系网络\u003c/strong>\n  \u003cbutton class=\"tool\" id=\"expand\">＋ 展开全部\u003c/button>\n  \u003cbutton class=\"tool\" id=\"clear\">清除聚焦\u003c/button>\n  \u003cspan style=\"font-size:10px;color:#8795aa\" id=\"mapMode\">核心知识图\u003c/span>\n  \u003cdiv class=\"zoom\" role=\"group\" aria-label=\"图谱缩放\">\n    \u003cspan>缩放\u003c/span>\n    \u003cbutton type=\"button\" id=\"zout\" title=\"缩小\" aria-label=\"缩小\">−\u003c/button>\n    \u003cbutton type=\"button\" id=\"zin\" title=\"放大\" aria-label=\"放大\">+\u003c/button>\n    \u003cbutton type=\"button\" id=\"fit\">适应视图\u003c/button>\n  \u003c/div>\n\u003c/div>\n\u003cdiv class=\"catstrip\" id=\"catstrip\">\u003c/div>\u003cdiv class=\"viewport\" id=\"viewport\">\u003csvg id=\"map\" aria-label=\"Java 并发编程知识网络，可拖动、点击节点\" viewBox=\"0 0 2180 1090\">\u003c/svg>\u003cdiv class=\"note\">点节点看解释 · 拖动画布平移\u003c/div>\u003c/div>\u003cdiv class=\"mapfoot\">\u003cspan id=\"visibleCount\">—\u003c/span>\u003cspan>连线只表示知识关联，不代表代码执行顺序\u003c/span>\u003c/div>\u003c/main>\n\u003caside class=\"panel inspector\" id=\"inspector\">\u003c/aside>\u003c/div>\n\u003csection class=\"index\" id=\"qIndex\">\u003cdiv class=\"index-top\">\u003cdiv>\u003ch2>原章 73 道题 · 每题都有完整解析\u003c/h2>\u003cp>包括核心结论、原理步骤、举例/代码、常见误区、面试口述，以及同原理题目跳转。\u003c/p>\u003c/div>\u003cinput class=\"idxsearch\" id=\"qsearch\" placeholder=\"搜索题目或答案：volatile、AQS、线程池、死锁…\" aria-label=\"搜索面试题\">\u003c/div>\u003cdiv class=\"tabbar\" id=\"tabs\">\u003c/div>\u003cdiv class=\"qgrid\" id=\"qgrid\">\u003c/div>\u003c/section>\n\u003cfooter class=\"footer\">\u003cspan>基于 \u003ca href=\"https://xiaolincoding.com/interview/juc.html\" target=\"_blank\" rel=\"noopener\">小林 coding · 并发面试章\u003c/a> 的 73 个问题独立整理，解释而非转载原文。回答以现代 Java / HotSpot 为背景，特定实现应按 JDK 版本核对。\u003c/span>\u003cspan>单文件 HTML · 离线可用 · 浏览器本地保存学习进度 · 2026-11\u003c/span>\u003c/footer>\n\u003c/div>\n\u003cdiv class=\"modal\" id=\"modal\" hidden role=\"dialog\" aria-modal=\"true\" aria-label=\"面试题详细解析\">\u003cdiv class=\"study\">\u003cheader class=\"studyhead\">\u003cstrong>JUC 面试题精讲\u003c/strong>\u003cspan id=\"studyProgress\">已掌握 0 / 73\u003c/span>\u003cdiv class=\"progress-track\">\u003ci id=\"progressBar\">\u003c/i>\u003c/div>\u003cdiv class=\"spacer\">\u003c/div>\u003cbutton id=\"toGraph\">◎ 返回知识图\u003c/button>\u003cbutton id=\"closeModal\" aria-label=\"关闭\">✕ 关闭\u003c/button>\u003c/header>\u003cdiv class=\"studybody\">\u003caside class=\"studyrail\">\u003cinput class=\"studyfilter\" id=\"railSearch\" placeholder=\"在 73 道题里搜索…\" aria-label=\"搜索题目列表\">\u003cdiv class=\"railnav\" id=\"railnav\">\u003c/div>\u003c/aside>\u003carticle class=\"article\" id=\"article\">\u003c/article>\u003c/div>\u003c/div>\u003c/div>\n\u003cscript>const DB={\"chapters\":[{\"id\":\"thread\",\"label\":\"多线程\",\"count\":20},{\"id\":\"sync\",\"label\":\"并发安全\",\"count\":35},{\"id\":\"pool\",\"label\":\"线程池\",\"count\":14},{\"id\":\"scene\",\"label\":\"实战场景\",\"count\":4}],\"cats\":[{\"id\":\"thread\",\"label\":\"01 · 线程与运行\",\"color\":\"#487CCE\",\"help\":\"谁在执行、等待和取消？\"},{\"id\":\"memory\",\"label\":\"02 · JMM 与安全性\",\"color\":\"#149688\",\"help\":\"线程之间怎样看见正确状态？\"},{\"id\":\"atomic\",\"label\":\"03 · 锁与原子机制\",\"color\":\"#8562C6\",\"help\":\"怎么原子地修改共享数据？\"},{\"id\":\"sync\",\"label\":\"04 · 同步器 / 并发容器\",\"color\":\"#C38C30\",\"help\":\"底层原语怎样组成工具？\"},{\"id\":\"pool\",\"label\":\"05 · 线程池与异步\",\"color\":\"#DB6E83\",\"help\":\"任务如何被调度、管理和组合？\"},{\"id\":\"practice\",\"label\":\"06 · 场景与工程排查\",\"color\":\"#237F9E\",\"help\":\"从原理到业务怎么落地？\"}],\"nodes\":[{\"cat\":\"thread\",\"id\":\"threads\",\"title\":\"线程 / 并发 / 并行\",\"sub\":\"共享堆 · 独立栈\",\"desc\":\"线程是进程内的执行流；共享堆中状态，拥有独立执行栈。并发是时间段重叠，并行是同刻真正同时执行。\",\"key\":\"线程多并不自动让计算变快。\",\"core\":true},{\"cat\":\"thread\",\"id\":\"platform\",\"title\":\"平台线程\",\"sub\":\"Java ↔ OS 1:1\",\"desc\":\"传统 Java 平台线程通常对应一个操作系统线程，创建与切换有较显著的系统成本。\",\"key\":\"它的成本推动线程池和虚拟线程。\",\"core\":false},{\"cat\":\"thread\",\"id\":\"virtual\",\"title\":\"虚拟线程\",\"sub\":\"JDK 21+ · M:N\",\"desc\":\"轻量级执行单元，许多虚拟线程由少量载体线程调度；适合大量等待 IO 的任务。JDK 24 改进 synchronized pinning。\",\"key\":\"虚拟线程提升并发承载能力，不提升 CPU 算力。\",\"core\":true},{\"cat\":\"thread\",\"id\":\"create\",\"title\":\"任务与线程创建\",\"sub\":\"Thread / Runnable / Callable\",\"desc\":\"Runnable/Callable 定义任务，Thread 或 Executor 负责执行；Callable 通常与 Future 协作提供结果。\",\"key\":\"定义任务≠已经启动线程。\",\"core\":false},{\"cat\":\"thread\",\"id\":\"start\",\"title\":\"start vs run\",\"sub\":\"线程启动 happens-before\",\"desc\":\"start() 调度新线程执行任务。直接调用带 Runnable 任务的平台线程的 run() 会在调用者线程运行任务。直接调用虚拟线程的 run() 不执行任务。\",\"key\":\"调用 start() 之前的操作 happens-before 新线程中的操作。等待任务完成可用 join()。\",\"core\":false},{\"cat\":\"thread\",\"id\":\"states\",\"title\":\"线程六种状态\",\"sub\":\"NEW / RUNNABLE / BLOCKED…\",\"desc\":\"Thread.State 包含 NEW、RUNNABLE、BLOCKED、WAITING、TIMED_WAITING、TERMINATED；与 OS 状态不一一对应。\",\"key\":\"等待锁的线程不一定是 BLOCKED。\",\"core\":true},{\"cat\":\"thread\",\"id\":\"wait\",\"title\":\"sleep / wait / notify\",\"sub\":\"条件等待与监视器\",\"desc\":\"sleep 让出 CPU 但不释放 monitor；Object.wait 释放对应监视器；通知后等待者还需抢锁。\",\"key\":\"等待条件必须用 while 检查。\",\"core\":true},{\"cat\":\"thread\",\"id\":\"notify\",\"title\":\"notify / notifyAll\",\"sub\":\"唤醒策略无顺序保证\",\"desc\":\"notify 任意唤醒一个在对象 wait-set 中等待的线程；notifyAll 唤醒全部，但都不直接交锁。\",\"key\":\"notify 不保证公平或唤醒最早等待者。\",\"core\":false},{\"cat\":\"thread\",\"id\":\"interrupt\",\"title\":\"interrupt / 取消\",\"sub\":\"协作式停止 · 中断标志\",\"desc\":\"interrupt 发出中断请求；阻塞式可中断 API 抛 InterruptedException，代码需自行响应并清理。\",\"key\":\"中断不是强制杀线程。\",\"core\":true},{\"cat\":\"thread\",\"id\":\"communicate\",\"title\":\"线程协作\",\"sub\":\"标志 / Condition / 队列\",\"desc\":\"共享状态+通知、阻塞队列、信号量、门闩、Future 都能实现线程协作；选择依问题而定。\",\"key\":\"先问要传数据还是控制时序。\",\"core\":false},{\"cat\":\"thread\",\"id\":\"join\",\"title\":\"join 等待\",\"sub\":\"任务完成后可见\",\"desc\":\"成功 join 等待另一线程结束后，其执行的操作对等待方建立 happens-before。\",\"key\":\"join 是等待结束，不是自动取消。\",\"core\":false},{\"cat\":\"memory\",\"id\":\"jmm\",\"title\":\"Java 内存模型 JMM\",\"sub\":\"规范 · 多线程可见性\",\"desc\":\"JMM 定义共享变量访问的可见性和允许的排序，重要的是 happens-before，不是堆/栈分布图。\",\"key\":\"JMM 主内存/工作内存是抽象，不对应 JVM 具体物理区。\",\"core\":true},{\"cat\":\"memory\",\"id\":\"safety\",\"title\":\"线程安全三要素\",\"sub\":\"原子性 / 可见性 / 有序性\",\"desc\":\"并发正确性从共享状态、读写竞争和同步边界出发，解决原子性、可见性、顺序及活性问题。\",\"key\":\"先保证正确，再考虑优化。\",\"core\":true},{\"cat\":\"memory\",\"id\":\"visibility\",\"title\":\"可见性\",\"sub\":\"写入何时被其他线程看到\",\"desc\":\"一个线程改共享字段，其他线程能否观察到它需要通过适当同步建立保障。\",\"key\":\"volatile 和监视器解锁/加锁都能建立可见性。\",\"core\":false},{\"cat\":\"memory\",\"id\":\"atomicity\",\"title\":\"原子性\",\"sub\":\"count++ 的读改写\",\"desc\":\"读→计算→写是复合操作，即使变量声明 volatile 也可能出现竞态；可用原子类或互斥。\",\"key\":\"可见性≠原子性。\",\"core\":true},{\"cat\":\"memory\",\"id\":\"ordering\",\"title\":\"有序性\",\"sub\":\"重排与观察约束\",\"desc\":\"编译器和 CPU 可优化指令顺序；多线程可观察结果必须符合 JMM 的同步与 happens-before 规则。\",\"key\":\"不能把所有重排都当成错误。\",\"core\":false},{\"cat\":\"memory\",\"id\":\"hb\",\"title\":\"happens-before\",\"sub\":\"volatile / monitor / start / join\",\"desc\":\"描述两个动作之间的可见性、顺序保证，核心包括 volatile 写-读、监视器释放-获取、start、join、传递性。\",\"key\":\"它是语义关系，不要求 CPU 物理逐句执行。\",\"core\":true},{\"cat\":\"memory\",\"id\":\"volatile\",\"title\":\"volatile\",\"sub\":\"可见性 + 顺序\",\"desc\":\"通过 JMM 保证相应共享变量读写的可见性和排序要求；不能单独使自增原子化。\",\"key\":\"适合停止标志和发布引用，不适合多步读改写。\",\"core\":true},{\"cat\":\"memory\",\"id\":\"reorder\",\"title\":\"指令重排序\",\"sub\":\"编译器 / CPU 优化\",\"desc\":\"优化允许重排，只要不破坏 Java 单线程与 JMM 必须满足的多线程观察语义。\",\"key\":\"未安全发布对象可能被其他线程看见非正确初始化状态。\",\"core\":false},{\"cat\":\"memory\",\"id\":\"publication\",\"title\":\"安全发布\",\"sub\":\"final / volatile / 锁\",\"desc\":\"发布对象引用需要让其他线程看到构造完成的状态，可通过同步、volatile、final 语义或静态初始化实现。\",\"key\":\"引用非 null 不等于对象安全发布。\",\"core\":false},{\"cat\":\"memory\",\"id\":\"dcl\",\"title\":\"DCL 双重检查单例\",\"sub\":\"volatile + synchronized\",\"desc\":\"双检锁快路径不加锁，因此要用 volatile 安全发布实例引用；内层锁只阻止多次构造。\",\"key\":\"只有 synchronized 内层不足以保护外层无锁读。\",\"core\":true},{\"cat\":\"memory\",\"id\":\"threadlocal\",\"title\":\"ThreadLocal\",\"sub\":\"按线程隔离上下文\",\"desc\":\"每个 Thread 内含 ThreadLocalMap，使用 ThreadLocal 键访问对应值；隔离不是共享同步。\",\"key\":\"线程池复用时记得 remove。\",\"core\":true},{\"cat\":\"memory\",\"id\":\"tlmap\",\"title\":\"ThreadLocalMap · 弱 key\",\"sub\":\"弱引用 Key / 强引用 Value\",\"desc\":\"键被回收后 Entry 中可能遗留 value，线程活得久时造成滞留；业务上下文还可能串请求。\",\"key\":\"弱键不会自动让值立即消失。\",\"core\":false},{\"cat\":\"atomic\",\"id\":\"cas\",\"title\":\"CAS 原子更新\",\"sub\":\"compareAndSet\",\"desc\":\"比较当前值与预期值后原子写入；适合短小状态更新，冲突时可能反复失败重试。\",\"key\":\"CAS 是一个操作，不是一套任务调度框架。\",\"core\":true},{\"cat\":\"atomic\",\"id\":\"optimistic\",\"title\":\"乐观 vs 悲观\",\"sub\":\"版本校验 vs 排他互斥\",\"desc\":\"乐观控制更新时验证未冲突；悲观控制先互斥再操作，冲突/临界区长度决定性价比。\",\"key\":\"CAS 与锁不总是互斥选项。\",\"core\":false},{\"cat\":\"atomic\",\"id\":\"aba\",\"title\":\"ABA 问题\",\"sub\":\"A→B→A\",\"desc\":\"比较值未变可能掩盖中间状态变化；依业务需要用版本戳或更复杂协议解决。\",\"key\":\"不是所有数值回到 A 都构成真实漏洞。\",\"core\":false},{\"cat\":\"atomic\",\"id\":\"stamped\",\"title\":\"版本戳 CAS\",\"sub\":\"AtomicStampedReference\",\"desc\":\"把引用与版本号一起检查更新，避免需要观测历史的 ABA 问题。\",\"key\":\"MarkableReference 的布尔标志不是通用版本戳。\",\"core\":false},{\"cat\":\"atomic\",\"id\":\"adder\",\"title\":\"LongAdder vs AtomicLong\",\"sub\":\"分片写入 · 快照语义\",\"desc\":\"AtomicLong 的单值操作原子；LongAdder 通过 base/Cell 分散竞争，但 sum 非并发瞬时快照。\",\"key\":\"精确余额/序号别直接用 LongAdder。\",\"core\":false},{\"cat\":\"atomic\",\"id\":\"monitor\",\"title\":\"synchronized · Monitor\",\"sub\":\"对象监视器 / STW 无关\",\"desc\":\"synchronized 是可重入监视器互斥，释放与后续获取建立 HB；锁实现依 HotSpot/JDK 版本而变。\",\"key\":\"同步方法锁 this，静态同步方法锁 Class。\",\"core\":true},{\"cat\":\"atomic\",\"id\":\"markword\",\"title\":\"Mark Word / 历史锁升级\",\"sub\":\"偏向→轻量→膨胀（旧版）\",\"desc\":\"早期 HotSpot JDK 8 教材常见的锁状态，JDK 15 起偏向锁默认禁用；现代实现不应机械套四阶段。\",\"key\":\"先说使用的 JDK 版本。\",\"core\":false},{\"cat\":\"atomic\",\"id\":\"lockopt\",\"title\":\"JIT 锁优化\",\"sub\":\"锁消除 / 锁粗化 / 自旋\",\"desc\":\"优化无竞争锁开销，并在监视器竞争时采用适当等待；具体行为高度依赖 JVM。\",\"key\":\"不能靠无条件加锁提升性能。\",\"core\":false},{\"cat\":\"atomic\",\"id\":\"reentrant\",\"title\":\"可重入\",\"sub\":\"锁持有者 + 重入计数\",\"desc\":\"同一线程可以重复获取自己已经持有的独占锁，递归调用不会因这把锁直接自死锁。\",\"key\":\"多次 lock 应匹配多次 unlock。\",\"core\":false},{\"cat\":\"atomic\",\"id\":\"fair\",\"title\":\"公平 / 非公平\",\"sub\":\"队列前驱检查 · 插队\",\"desc\":\"公平路径尽量照顾已排队线程；非公平快路径允许新线程直接尝试获取，吞吐与等待公平性权衡。\",\"key\":\"公平不是严格的 OS 调度先后承诺。\",\"core\":true},{\"cat\":\"atomic\",\"id\":\"locktypes\",\"title\":\"常用锁选择\",\"sub\":\"互斥 / 读写 / 乐观\",\"desc\":\"选锁以正确性为先：短临界区 synchronized，需要超时/中断用 ReentrantLock，读多写少再评估读写锁。\",\"key\":\"锁类别是语义分类而不是固定 API。\",\"core\":true},{\"cat\":\"atomic\",\"id\":\"lockcompare\",\"title\":\"synchronized vs ReentrantLock\",\"sub\":\"内置监视器 vs AQS\",\"desc\":\"都可重入与互斥；后者有超时、可中断、多个 Condition 与可配置公平策略。\",\"key\":\"ReentrantLock 必须 finally unlock。\",\"core\":true},{\"cat\":\"sync\",\"id\":\"aqs\",\"title\":\"AQS\",\"sub\":\"state + 排队 + park/unpark\",\"desc\":\"用于独占/共享同步器的基础框架，封装排队与取消唤醒，由子类定义 acquire/release 规则。\",\"key\":\"AQS 的 FIFO 排队不代表锁一定公平。\",\"core\":true},{\"cat\":\"sync\",\"id\":\"aqstate\",\"title\":\"同步状态 state\",\"sub\":\"0/1 · 重入数 / 许可数\",\"desc\":\"ReentrantLock 用 state 表示重入深度，Semaphore 可表示许可，CountDownLatch 可表示剩余计数。\",\"key\":\"同一个 state 在不同同步器里语义不同。\",\"core\":false},{\"cat\":\"sync\",\"id\":\"aqq\",\"title\":\"CLH 风格等待队列\",\"sub\":\"失败入队 · park / unpark\",\"desc\":\"竞争失败的线程排队等待，不会无休止自旋；被唤醒仍需按获取规则重新争抢。\",\"key\":\"不要把阻塞队列和 AQS 同步队列混为一谈。\",\"core\":false},{\"cat\":\"sync\",\"id\":\"rlock\",\"title\":\"ReentrantLock\",\"sub\":\"独占 / Condition / 超时\",\"desc\":\"基于 AQS 的显式可重入互斥锁，支持 lockInterruptibly、tryLock、多个 Condition。\",\"key\":\"与 synchronized 在复杂等待策略上功能不同。\",\"core\":true},{\"cat\":\"sync\",\"id\":\"condition\",\"title\":\"Condition\",\"sub\":\"await / signal\",\"desc\":\"关联特定 Lock 的条件等待，await 通常释放关联锁，再次返回前重新获取；可为不同条件建立等待队列。\",\"key\":\"while 重查条件防止虚假唤醒。\",\"core\":false},{\"cat\":\"sync\",\"id\":\"latch\",\"title\":\"CountDownLatch\",\"sub\":\"一次性倒计数门闩\",\"desc\":\"countDown 减少计数，await 等至归零；内部同步机制使用 AQS 共享方式。\",\"key\":\"要在 finally countDown 防止永等。\",\"core\":true},{\"cat\":\"sync\",\"id\":\"barrier\",\"title\":\"CyclicBarrier\",\"sub\":\"可复用汇合点\",\"desc\":\"所有参与线程到齐后同时进入下阶段，可反复使用；与 Latch 的单向倒计数不同。\",\"key\":\"参与线程中断/超时可能打破这一轮屏障。\",\"core\":false},{\"cat\":\"sync\",\"id\":\"semaphore\",\"title\":\"Semaphore\",\"sub\":\"许可数 · 控制并发\",\"desc\":\"多个线程可按许可数同时访问受控资源；常用来限制下游并发量。\",\"key\":\"Semaphore 是许可，不必然只是一个互斥锁。\",\"core\":false},{\"cat\":\"sync\",\"id\":\"chm\",\"title\":\"ConcurrentHashMap\",\"sub\":\"CAS + 桶级同步\",\"desc\":\"JDK 8+ 主要通过 CAS、桶级 synchronized、可见性字段和协作扩容实现并发安全。\",\"key\":\"单次操作线程安全不等于复合业务流程原子。\",\"core\":true},{\"cat\":\"sync\",\"id\":\"juc\",\"title\":\"JUC 常用工具\",\"sub\":\"同步器 / 原子类 / 容器\",\"desc\":\"java.util.concurrent 为协调、限流、容器、线程池和异步任务提供高层抽象。\",\"key\":\"选工具前先明确要解决哪类问题。\",\"core\":false},{\"cat\":\"sync\",\"id\":\"readwrite\",\"title\":\"读写锁 / StampedLock\",\"sub\":\"多读单写 / 乐观读\",\"desc\":\"读写锁可让多个读者并行；StampedLock 的乐观读需要 validate，且不可重入。\",\"key\":\"读多写少也未必总比互斥锁快。\",\"core\":false},{\"cat\":\"pool\",\"id\":\"pool\",\"title\":\"ThreadPoolExecutor\",\"sub\":\"平台线程池复用\",\"desc\":\"将任务提交给复用的
