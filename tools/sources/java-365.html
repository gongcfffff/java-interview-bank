equals，多维数组按需要用 Arrays.deepEquals。\",\"混合比较包装数值与基本数值时，可能触发拆箱和数值提升。包装值为 null 时，拆箱会抛 NullPointerException。\"],\"example\":\"以下两行分别输出 false、true。它们区分的是引用身份与字符串内容。\",\"code\":\"String a = new String(\\\"id\\\");\\nString b = new String(\\\"id\\\");\\nSystem.out.println(a == b);\\nSystem.out.println(a.equals(b));\",\"pitfall\":\"不能用 == 比较 String 或 Integer 的内容。池化和缓存让某些样例碰巧为 true，但该结果不能推广到所有输入。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.21\",\"anchor\":\"%E4%B8%8E-equals-%E6%9C%89%E4%BB%80%E4%B9%88%E5%8C%BA%E5%88%AB\",\"node\":\"contract\",\"chapter\":10,\"follow\":[21,57]},{\"n\":57,\"title\":\"重写 equals 为什么通常也要重写 hashCode？\",\"short\":\"契约要求 equals 判为相等的两个对象具有相同的 hashCode，哈希相同的对象仍可能不相等。HashMap 或 HashSet 会先用哈希缩小候选范围，再判断是否相等。如果两者不一致，等价键可能被放入不同位置，导致查询失败或集合去重失效。\",\"details\":[\"equals 应满足自反、对称、传递、一致，并对 null 返回 false。hashCode 在参与相等判断的信息不变时，应在同一次运行中保持一致。\",\"写实体键时，以同一组稳定信息实现 equals 与 hashCode 最直接。允许哈希碰撞，均匀分布能减少容器内的额外比较。\",\"对象放入哈希容器后再修改参与比较和哈希的字段，容器仍按插入时的哈希存放它，之后的查找和删除可能失败。\"],\"example\":\"用客户编号作为客户键时，两个不同实例只要编号相同，就应当能互相查到同一条记录。record 可按其组件生成一致的 equals 和 hashCode。\",\"code\":\"record CustomerKey(long id) {}\\nvar customers = new java.util.HashMap\\u003cCustomerKey, String>();\\ncustomers.put(new CustomerKey(42), \\\"Ada\\\");\\nSystem.out.println(customers.get(new CustomerKey(42))); // Ada\",\"pitfall\":\"hashCode 没有全局唯一保证，也不保证跨进程稳定。不能拿它当业务 ID 或据它单独认定两个对象相等。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html#hashCode()\",\"anchor\":\"hashcode%E5%92%8Cequals%E6%96%B9%E6%B3%95%E6%9C%89%E4%BB%80%E4%B9%88%E5%85%B3%E7%B3%BB\",\"node\":\"contract\",\"chapter\":10,\"follow\":[16,56]},{\"n\":58,\"title\":\"String 常用 API 怎样分类，使用时有哪些边界？\",\"short\":\"String 常用操作包括判断、查找、提取、替换和拆分。比如 isEmpty、isBlank、equals、indexOf、substring、replace、split。String 不可变，转换会返回结果字符串。索引按 UTF-16 代码单元计算，split 的参数则按正则表达式解释。\",\"details\":[\"判空用 isEmpty，判断空串或 Java 空白字符用 isBlank。equals 比较内容，compareTo 按词典顺序比较。查找可用 contains、indexOf、startsWith、endsWith。\",\"substring(start, end) 左闭右开。length 和 charAt 按 UTF-16 代码单元工作，例如 \\\"😀\\\".length() 是 2。需按 Unicode 码点处理时可用 codePointAt、codePointCount 或 codePoints。\",\"replace(CharSequence, CharSequence) 做字面替换，replaceAll 和 split 接受正则。split 默认丢弃末尾空字段，保留它们可以传负的 limit。strip 和 isBlank 自 Java 11 提供。\"],\"example\":\"解析点号分隔字段时，把点号转义成字面量并使用负 limit，结果保留末尾的空列。若业务需要自然语言排序，应用 Collator 等工具按语言规则处理。\",\"code\":\"String text = \\\"east..west.\\\";\\nString[] fields = text.split(\\\"\\\\\\\\.\\\", -1);\\nSystem.out.println(java.util.Arrays.toString(fields)); // [east, , west, ]\",\"pitfall\":\"String 不可变，调用 strip、substring 或 replace 后需接收返回值。length() 在包含某些 emoji 时会大于 Unicode 码点数量。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/String.html\",\"anchor\":\"java-%E9%87%8C-string%E7%9A%84%E5%B8%B8%E7%94%A8%E6%96%B9%E6%B3%95%E6%9C%89%E5%93%AA%E4%BA%9B\",\"node\":\"strings\",\"chapter\":10,\"follow\":[56,59]},{\"n\":59,\"title\":\"String、StringBuilder、StringBuffer 各适合什么场景？\",\"short\":\"String 表示不可变文本，适合传递、共享和做键。StringBuilder 用可变缓冲区高效累积文本，适合单线程或线程内局部构造。StringBuffer 也可变，常用方法提供同步，适合需要共享同一缓冲区且单次调用足以满足同步边界的场景。\",\"details\":[\"对 String 做拼接或替换会得到结果字符串，原内容保持不变。编译器会折叠常量拼接，现代 JDK 对运行时拼接也可采用 invokedynamic 等实现。\",\"StringBuilder.append 在同一个缓冲区追加，容量不足时扩容。循环里构造长文本时，可以让 builder 留在当前线程，最后一次调用 toString() 获取不可变结果。\",\"StringBuffer 的同步保证以操作为单位。先检查长度再删除这样的复合流程仍需要统一加锁或改变设计，不能只依赖两个方法各自同步。\"],\"example\":\"导出日志时让每个线程在局部 StringBuilder 拼接一行，再把最终 String 交给日志组件。\",\"code\":\"var line = new StringBuilder();\\nfor (String field : fields) {\\n    if (!line.isEmpty()) line.append(' ');\\n    line.append(field);\\n}\\nString message = line.toString();\",\"pitfall\":\"StringBuilder 与 StringBuffer 的 equals 默认仍比较身份。需要比较缓冲区文本时可以转换为 String，或使用适当的内容比较 API。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/StringBuffer.html\",\"anchor\":\"string%E3%80%81stringbuffer%E3%80%81stringbuilder%E7%9A%84%E5%8C%BA%E5%88%AB%E5%92%8C%E8%81%94%E7%B3%BB\",\"node\":\"strings\",\"chapter\":10,\"follow\":[58,62]},{\"n\":60,\"title\":\"Java 8 带来了哪些常用能力？\",\"short\":\"Java 8 把行为作为参数带入日常 Java 开发。Lambda 和方法引用为函数式接口提供实现，Stream 用流水线处理数据，接口新增默认方法和静态方法。标准库还加入 java.time、Optional 和 CompletableFuture。\",\"details\":[\"Lambda 的目标类型是只有一个抽象方法的函数式接口。Predicate 表达条件，Function 表达转换，Consumer 表达消费。Comparator 也能用方法引用组合。\",\"Stream 负责批量处理数据，Optional 表达可能缺失的结果，CompletableFuture 表达未来才完成的计算。三者解决的场景不同。\",\"LocalDate 表达日历日期，Instant 表达时间轴上的瞬间，ZonedDateTime 带时区。接口默认方法可为已有实现补充通用行为。\"],\"example\":\"统计有效订单时，用 Predicate 过滤、Stream 汇总，用 Instant 保存下单时间。异步查询订单详情时，可用 CompletableFuture 组合外部请求。\",\"pitfall\":\"并行流需要主动选择。Stream 使用 Lambda 也不会自动并行。List.of 和 var 分别来自 Java 9 和 Java 10。\",\"ref\":\"https://docs.oracle.com/javase/8/docs/technotes/guides/language/enhancements.html\",\"anchor\":\"java-8-%E4%BD%A0%E7%9F%A5%E9%81%93%E6%9C%89%E4%BB%80%E4%B9%88%E6%96%B0%E7%89%B9%E6%80%A7\",\"node\":\"modern\",\"chapter\":11,\"follow\":[61,65]},{\"n\":61,\"title\":\"Lambda 表达式怎样对应函数式接口？\",\"short\":\"Lambda 把一段可调用行为写成参数列表、箭头和函数体。编译器根据赋值位置或调用位置推断函数式接口，再用它唯一的抽象方法检查参数、返回值和受检异常。Lambda 可捕获 final 或事实上保持不变的局部变量。\",\"details\":[\"函数式接口可以拥有多个默认或静态方法。@FunctionalInterface 会让编译器检查接口是否满足单一抽象方法约束。\",\"同样的表达式需要目标类型。例如 Predicate\\u003cString> 的抽象方法是 boolean test(String s)，因此 s -> !s.isBlank() 的参数是 String，返回值是 boolean。\",\"Lambda 内的 this 指向外层实例，和匿名类引入自己的 this 不同。javac 通常用 invokedynamic 配合 LambdaMetafactory 连接调用点。\"],\"example\":\"把订单筛选规则作为 Predicate\\u003cOrder> 传给过滤方法，调用方可换规则，过滤流程可以复用。\",\"code\":\"int limit = 60;\\nIntPredicate passed = score -> score >= limit;\\nSystem.out.println(passed.test(75)); // true\",\"pitfall\":\"捕获的是局部变量的值。捕获一个保持不变的引用仍可通过它修改对象，这些修改需要遵循并发安全规则。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html#jls-15.27\",\"anchor\":\"lambda-%E8%A1%A8%E8%BE%BE%E5%BC%8F%E4%BA%86%E8%A7%A3%E5%90%97\",\"node\":\"lambda\",\"chapter\":11,\"follow\":[30,62]},{\"n\":62,\"title\":\"Stream 的流水线和常用 API 怎么用？\",\"short\":\"Stream 从集合、数组等数据源建立流水线。filter、map、flatMap 和 sorted 是中间操作，通常延迟执行。终止操作如 collect、reduce、count 和 findFirst 会驱动流水线并给出结果，完成后流就被消费。\",\"details\":[\"filter 保留满足条件的元素，map 将一个元素变成一个结果，flatMap 将每个元素展开成一个流并合并，适用于订单展开成明细。\",\"sorted 和 distinct 通常要记住部分状态。limit、findFirst 和 anyMatch 可在适当条件下短路，面对无限流也可能及时结束。\",\"toList 收集结果，groupingBy 分组，reduce 按结合性规则归约。IntStream 等原始类型特化能减少装箱。\"],\"example\":\"订单列表先筛有效单，再展开商品明细，最后按 SKU 分组。查询首个有效单时可以用 findFirst 避免收集整张结果表。\",\"code\":\"var skus = orders.stream()\\n    .filter(Order::paid)\\n    .flatMap(order -> order.items().stream())\\n    .map(Item::sku)\\n    .distinct()\\n    .toList();\",\"pitfall\":\"流只能使用一次。避免在 map、peek 中承载必须执行的副作用。某些终止操作可省略不影响结果的中间步骤。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/stream/package-summary.html\",\"anchor\":\"java%E4%B8%ADstream%E7%9A%84api%E4%BB%8B%E7%BB%8D%E4%B8%80%E4%B8%8B\",\"node\":\"stream\",\"chapter\":11,\"follow\":[61,63]},{\"n\":63,\"title\":\"怎样启用并行 Stream？什么时候能加速？\",\"short\":\"从集合调用 parallelStream()，或在已有流上调用 parallel()，可以启用并行模式，sequential() 可切回顺序模式。并行把数据切成子任务再合并结果，适合可拆分、计算量足够、任务间无共享可变状态的工作。\",\"details\":[\"数据源由 Spliterator 提供遍历和切分能力。常见 JDK 实现通过 Fork/Join 执行，普通入口通常使用公共池。切分、调度和结果合并本身有成本。\",\"reduce 的合并规则要满足结合性，初始值应为单位元。共享 ArrayList 上调用 forEach(list::add) 会发生数据竞争，使用 toList 或适当的 Collector。\",\"有序流的 forEachOrdered、findFirst 和有序 limit 可能增加协调成本。阻塞 I/O 容易占用共享工作线程，独立执行器能隔离这类工作。\"],\"example\":\"对很大的数组做每项代价较高且独立的变换可以基准测试并行收益。对十几个数字求和时，顺序执行通常更简单。\",\"code\":\"long total = Arrays.stream(values).parallel()\\n    .mapToLong(value -> Math.abs((long) value))\\n    .sum();\",\"pitfall\":\"并行流不承诺更快，也不承诺任务完成顺序。对 int 的最小值取绝对值时，先转换成 long 可避免 Math.abs(int) 的边界溢出。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/stream/package-summary.html\",\"anchor\":\"stream%E6%B5%81%E7%9A%84%E5%B9%B6%E8%A1%8Capi%E6%98%AF%E4%BB%80%E4%B9%88\",\"node\":\"parallel\",\"chapter\":11,\"follow\":[62,64]},{\"n\":64,\"title\":\"CompletableFuture 怎样组合异步任务？\",\"short\":\"CompletableFuture 可以承载异步结果，也能把多个阶段拼成依赖图。thenApply 同步映射阶段结果，thenCompose 展平返回新 Future 的操作，thenCombine 合并两个独立结果。异常可用 exceptionally 或 handle 处理，阻塞取结果放在调用边界。\",\"details\":[\"supplyAsync 用于有返回值的任务，runAsync 用于无返回值的任务。不指定执行器的异步方法通常使用 ForkJoinPool.commonPool()，阻塞 I/O 更适合单独安排执行器。\",\"thenApply 等非 Async 回调可能由完成前一阶段的线程等执行。Async 变体把执行交给默认或显式执行器。需要让后一步本身返回 Future 时，用 thenCompose 避免嵌套。\",\"exceptionally 只恢复异常路径，handle 可处理成功和失败，whenComplete 常用来观察结果。allOf 只聚合完成信号，结果仍从各 Future 读取。join 将失败包装成非受检 CompletionException。\"],\"example\":\"并发请求库存和价格，用 thenCombine 组合出报价，给外部请求设置超时，将超时和业务失败分别处理。\",\"code\":\"var quote = CompletableFuture.supplyAsync(this::loadPrice, ioPool)\\n    .thenCombine(CompletableFuture.supplyAsync(this::loadStock, ioPool),\\n                 Quote::new)\\n    .orTimeout(500, TimeUnit.MILLISECONDS);\",\"pitfall\":\"orTimeout 或取消 Future 不保证底层任务随即停止。HTTP 请求仍应设置超时，并管理取消和资源释放。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/CompletableFuture.html\",\"anchor\":\"completablefuture%E6%80%8E%E4%B9%88%E7%94%A8%E7%9A%84\",\"node\":\"future\",\"chapter\":11,\"follow\":[53,63]},{\"n\":65,\"title\":\"Java 21 有哪些正式特性和预览特性？\",\"short\":\"Java 21 是长期支持版本。面试可按三类说。语言方面，record patterns 和 switch 模式匹配转正。库方面，Sequenced Collections 统一有序集合的首尾操作。并发方面，虚拟线程转正，适合大量等待 I/O 的任务。\",\"details\":[\"record pattern 能同时匹配 record 的结构并提取组件。switch 模式匹配可按类型分支，sealed 层级有助于编译器验证分支是否穷尽。\",\"SequencedCollection、SequencedSet 和 SequencedMap 提供统一的首尾操作或反向视图。支持的修改操作仍取决于具体实现。\",\"虚拟线程由 JVM 调度，许多阻塞操作等待时可让出载体线程，使一请求一线程更容易扩展。Structured Concurrency 和 Scoped Values 在 Java 21 属于预览特性。\",\"字符串模板在 JDK 21 首次预览，需要显式启用预览选项。它在 JDK 22 再次预览，JDK 23 撤回了当时的设计。\"],\"example\":\"并发处理大量短 HTTP 请求时，可以采用每任务一个虚拟线程保留直观调用栈，用信号量约束下游服务并发。\",\"code\":\"try (var executor = Executors.newVirtualThreadPerTaskExecutor()) {\\n    var future = executor.submit(() -> fetchOrder());\\n    System.out.println(future.get());\\n}\",\"pitfall\":\"虚拟线程不会加快 CPU 密集计算，Java 21 某些 synchronized 或本地调用场景还可能固定载体线程。不要把预览 API 当成 Java 21 的正式承诺。\",\"ref\":\"https://docs.oracle.com/en/java/javase/23/language/java-language-changes-release.html\",\"anchor\":\"java-21-%E6%96%B0%E7%89%B9%E6%80%A7%E7%9F%A5%E9%81%93%E5%93%AA%E4%BA%9B\",\"node\":\"virtual\",\"chapter\":11,\"follow\":[60,73]},{\"n\":66,\"title\":\"怎样把一个对象的数据交给另一个 JVM？\",\"short\":\"先把双方约定的对象状态编码成可传输数据，通过网络、文件或消息系统传递，再由接收方解码重建对象。两个 JVM 的堆和引用空间相互独立，接收方得到新实例。跨语言或跨版本时，通常选 JSON、Protobuf 等明确的契约。\",\"details\":[\"传输的是 DTO 的字段和必要标识。线程、打开的文件句柄和连接等进程资源需要由接收端重新建立。\",\"Java 对象流可保存可序列化对象图并恢复图内共享引用。接收方需要兼容类，serialVersionUID 影响兼容检查，static 字段和默认的 transient 字段不作为对象状态传输。\",\"线上要设计字段演进、默认值和异常数据处理。Java 原生反序列化应限制来源和类型，优先使用更窄的数据协议处理外部输入。\"],\"example\":\"订单服务把 orderId、金额和币种写入事件，下游按同一协议解析成自己的 OrderCreated，再根据 orderId 建立业务关联。\",\"pitfall\":\"同一个订单编号是业务身份。接收端无法直接使用发送端的引用、锁或对象地址。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/specs/serialization/\",\"anchor\":\"%E6%80%8E%E4%B9%88%E6%8A%8A%E4%B8%80%E4%B8%AA%E5%AF%B9%E8%B1%A1%E4%BB%8E%E4%B8%80%E4%B8%AAjvm%E8%BD%AC%E7%A7%BB%E5%88%B0%E5%8F%A6%E4%B8%80%E4%B8%AAjvm\",\"node\":\"serialization\",\"chapter\":12,\"follow\":[38,67]},{\"n\":67,\"title\":\"自己实现序列化和反序列化，会怎样设计？\",\"short\":\"先确定支持的数据模型，再制定可版本化的协议。编码器按协议把类型和字段写成字节，解码器校验头部、长度和版本后按类型重建对象。若支持任意对象图，还需要给对象编号以表示重复引用和环。\",\"details\":[\"为字段分配稳定编号，定义整数端序、字符串编码、空值规则和消息长度。用长度边界让解码器能跳过可忽略的未知字段。\",\"对循环图可维护对象身份到编号的映射。解码时先登记对象壳或中间表示，再填充引用，避免递归重复构造。若协议只支持树，应显式拒绝循环。\",\"在分配前限制消息大小、集合元素数和嵌套深度，只实例化白名单类型，测试跨版本、残缺帧、非法长度和往返一致性。\"],\"example\":\"购物车协议先约定版本和项目数，再为每个商品写 SKU 和数量。旧解码器按字段长度跳过新版新增的备注字段。\",\"pitfall\":\"直接遍历反射字段并依赖返回顺序容易破坏兼容性。对象重建还要验证业务约束，不能仅检查字节能否读完。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/specs/serialization/\",\"anchor\":\"%E5%BA%8F%E5%88%97%E5%8C%96%E5%92%8C%E5%8F%8D%E5%BA%8F%E5%88%97%E5%8C%96%E8%AE%A9%E4%BD%A0%E8%87%AA%E5%B7%B1%E5%AE%9E%E7%8E%B0%E4%BD%A0%E4%BC%9A%E6%80%8E%E4%B9%88%E5%81%9A\",\"node\":\"serialization\",\"chapter\":12,\"follow\":[66,68]},{\"n\":68,\"title\":\"对象如何具体编码为二进制字节流？\",\"short\":\"把对象拆成协议字段，再为每种字段约定二进制布局。固定长度整数可按大端写入，字符串先编码为 UTF-8，再写长度和内容。解码器按完全相同的次序读取。Java 的 ObjectOutputStream 则提供了另一套完整的对象流格式。\",\"details\":[\"以简化协议为例，写入魔数、版本、id、UTF-8 字节数和正文。DataOutputStream 的 writeInt 按高位字节在前输出四字节。\",\"解码先校验魔数和版本，检查长度上下界，再使用 readFully 读取完整正文。在线上传输多条消息时需要约定帧边界，TCP 的一次 read 无法保证读到一条完整消息。\",\"ObjectOutputStream.writeObject 按 Java 序列化协议输出类型描述、字段和对象引用句柄。自定义 DTO 协议可只写业务字段，减少耦合。\"],\"example\":\"id 为 42 且姓名为「李」时，按下面布局写入 4 字节 id、4 字节长度值 3，再写入 3 个 UTF-8 字节。实际协议还应在前面写魔数和版本。\",\"code\":\"byte[] name = user.name().getBytes(StandardCharsets.UTF_8);\\nout.writeInt(user.id());\\nout.writeInt(name.length);\\nout.write(name);\",\"pitfall\":\"String.length() 计数 UTF-16 代码单元，长度前缀应写实际编码字节数。DataOutputStream.writeUTF 使用的是修改版 UTF-8。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/io/DataOutputStream.html\",\"anchor\":\"%E5%B0%86%E5%AF%B9%E8%B1%A1%E8%BD%AC%E4%B8%BA%E4%BA%8C%E8%BF%9B%E5%88%B6%E5%AD%97%E8%8A%82%E6%B5%81%E5%85%B7%E4%BD%93%E6%80%8E%E4%B9%88%E5%AE%9E%E7%8E%B0\",\"node\":\"framing\",\"chapter\":12,\"follow\":[67,75]},{\"n\":69,\"title\":\"volatile 与 synchronized 怎样配合实现单例？\",\"short\":\"双重检查锁定先在锁外读 volatile 实例，已有实例就直接返回。发现为空才进入 synchronized，并在锁内再检查一次后创建。锁保证同一时刻只有一个初始化者，volatile 写与后续读之间的 happens-before 保证构造结果的安全发布。\",\"details\":[\"第一次检查保留初始化后的快路径。第二次检查避免多个线程先后进入临界区并重复创建。两个检查解决的是不同阶段的问题。\",\"构造和 volatile 写发生在发布线程，读取该引用的线程也能看到写之前完成的初始化。只在写侧加锁不足以保护没有获取同一锁的读侧。\",\"若只需要按类加载器懒初始化，可用静态内部类持有者，借助类初始化的同步保证。枚举单例还提供标准的序列化身份语义。\"],\"example\":\"多个线程首次同时取得配置中心实例时，只有第一个进入锁且发现 instance 仍为空的线程会构造对象。\",\"code\":\"private static volatile Config instance;\\nstatic Config get() {\\n    Config result = instance;\\n    if (result == null) {\\n        synchronized (Config.class) {\\n            result = instance;\\n            if (result == null) instance = result = new Config();\\n        }\\n    }\\n    return result;\\n}\",\"pitfall\":\"volatile 不能把检查和创建整体变成原子操作。还应避免构造过程中让 this 提前逸出，实例后续可变状态也要独立保护。\",\"ref\":\"https://docs.oracle.com/javase/specs/jls/se21/html/jls-17.html#jls-17.4.5\",\"anchor\":\"volatile%E5%92%8Csychronized%E5%A6%82%E4%BD%95%E5%AE%9E%E7%8E%B0%E5%8D%95%E4%BE%8B%E6%A8%A1%E5%BC%8F\",\"node\":\"dcl\",\"chapter\":13,\"follow\":[37,65]},{\"n\":70,\"title\":\"代理模式和适配器模式怎样区分？\",\"short\":\"代理在调用方与真实服务之间控制访问，通常沿用同一个接口以便透明替换，适合权限、缓存、延迟加载和远程访问。适配器把已有接口或数据形式转换成调用方期待的契约，适合接入接口不兼容的旧系统。\",\"details\":[\"代理把调用交给目标前后可执行附加逻辑。JDK 动态代理可在运行时为接口创建代理类，由 InvocationHandler 处理调用。\",\"适配器重点是契约转换，包括方法名、参数格式、返回值和错误语义。组合已有对象的做法可减少对旧实现的耦合。\",\"二者可同时存在。适配器统一供应商支付接口，外层代理再对同一个统一接口做鉴权或记录日志。\"],\"example\":\"某旧网关只暴露 chargeInCents(long)，适配器将业务 Money 转成分后调用它。RetryingPaymentGateway 和真实网关实现同一接口，代理只加重试规则。\",\"pitfall\":\"看两者的设计目的。实现里都可能持有另一个对象并转发，单凭是否用了包装无法区分。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/reflect/Proxy.html\",\"anchor\":\"%E4%BB%A3%E7%90%86%E6%A8%A1%E5%BC%8F%E5%92%8C%E9%80%82%E9%85%8D%E5%99%A8%E6%A8%A1%E5%BC%8F%E6%9C%89%E4%BB%80%E4%B9%88%E5%8C%BA%E5%88%AB\",\"node\":\"proxy\",\"chapter\":13,\"follow\":[28,46]},{\"n\":71,\"title\":\"责任链模式适合哪些处理场景？\",\"short\":\"责任链将多个处理器按顺序串接，每个处理器可以处理请求并结束，也可以补充上下文后继续传递。它适合处理步骤有明确顺序、单步可复用且需要灵活组合的场景，例如网关鉴权、限流与参数校验。\",\"details\":[\"为处理器约定统一的输入和继续条件。链可以按注册顺序执行，遇到失败或某个处理器接管时立即短路。\",\"有些链采用拦截器形态，可在 next 前后分别处理请求和响应。需要约定是否允许继续、返回值含义以及异常向哪一层传播。\",\"链的顺序影响业务语义。例如先做身份认证，再做依赖身份的授权。统一记录链路日志和短路原因，方便定位请求停在哪里。\"],\"example\":\"API 网关先填充追踪 ID，再认证 token，再按身份限流。限流失败时直接返回 429，业务服务不用接到请求。\",\"pitfall\":\"日志、审计等在异常时也要执行的逻辑应配合 try/finally。不要让处理器忘记调用 next 造成无声短路。\",\"anchor\":\"%E8%B4%A3%E4%BB%BB%E9%93%BE%E6%A8%A1%E5%BC%8F%E4%BD%BF%E7%94%A8%E5%9C%BA%E6%99%AF%E6%98%AF%E4%BB%80%E4%B9%88\",\"node\":\"chain\",\"chapter\":13,\"follow\":[53,72]},{\"n\":72,\"title\":\"策略模式和责任链模式分别解决什么问题？\",\"short\":\"策略模式为同一种任务提供多个可替换算法，调用方选定一个策略执行。责任链模式把多个处理器按次序接起来，一个请求可能经过多个处理器，也可能提前结束。前者把选择与算法实现分离，后者把请求与处理流程分离。\",\"details\":[\"定价可按会员、活动或地区选择一个实现共同接口的策略。策略的选择可来自配置或工厂，调用方只依赖统一契约。\",\"风控链则可依次执行地址检查、黑名单检查、额度校验，每一步决定传递或拒绝。链顺序以及是否短路都是行为的一部分。\",\"两种模式可以组合。责任链中的某个处理器按商户类型选择不同风控评分策略，链仍继续其余步骤。\"],\"example\":\"运费计算在自提和快递策略中选其一。下单校验依次经过库存、地址和支付资格处理器，任一步失败都能终止请求。\",\"pitfall\":\"连续做多个校验通常属于链或流水线。把大量算法用 if 分开只是起点，策略模式的关键是稳定接口和可替换实现。\",\"anchor\":\"%E4%BB%8B%E7%BB%8D%E4%B8%80%E4%B8%8B%E7%AD%96%E7%95%A5%E6%A8%A1%E5%BC%8F%E5%92%8C%E8%B4%A3%E4%BB%BB%E9%93%BE%E6%A8%A1%E5%BC%8F-%E5%88%86%E5%88%AB%E7%94%A8%E5%9C%A8%E5%93%AA%E4%BA%9B%E5%9C%BA%E6%99%AF\",\"node\":\"strategy\",\"chapter\":13,\"follow\":[24,71]},{\"n\":73,\"title\":\"Java 怎样支撑高并发网络 I/O？\",\"short\":\"常见做法是用 NIO 把多个非阻塞连接注册到 Selector，让少量事件循环线程处理就绪事件，把耗时业务交给工作线程。Java 21 也可用每任务一个虚拟线程保留阻塞式代码。两种方式都需要并发上限、超时和背压。\",\"details\":[\"Reactor 模型可将接入和连接读写分工。事件循环只做短操作，按通道维护解码状态。读到半帧时缓存，写不完时保留剩余数据。\",\"把数据库、远程调用或 CPU 密集工作从事件循环隔离。对慢客户端限制待写队列和缓冲区，否则少数连接也可能耗尽内存。\",\"虚拟线程允许大量等待任务以顺序代码表达，仍需限制数据库连接和外部服务的负荷。选型时衡量长连接数量、处理成本和尾延迟。\"],\"example\":\"聊天服务可用 Netty 的事件循环复用大量空闲连接。普通请求响应服务可让每个虚拟线程处理一个请求，并限制并发查库。\",\"pitfall\":\"连接数、吞吐量和延迟是不同指标。增加工作线程不解决下游饱和，事件循环中阻塞会拖慢同组的其他连接。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/core/virtual-threads.html\",\"anchor\":\"java%E6%80%8E%E4%B9%88%E5%AE%9E%E7%8E%B0%E7%BD%91%E7%BB%9Cio%E9%AB%98%E5%B9%B6%E5%8F%91%E7%BC%96%E7%A8%8B\",\"node\":\"netty\",\"chapter\":14,\"follow\":[65,74]},{\"n\":74,\"title\":\"BIO、NIO、AIO 的等待和通知有何不同？\",\"short\":\"BIO 的阻塞调用在结果可用前挂起调用线程。NIO 的典型 Selector 用法让应用等待通道就绪，再主动执行非阻塞读写。AIO 提交读写操作后，通过回调或 Future 获取完成结果。区分它们要看谁发起读写、何时得到通知。\",\"details\":[\"BIO 可用阻塞 Socket 和输入输出流实现，每连接由执行线程处理。线程的成本会随平台线程和虚拟线程方案而不同。\",\"NIO 的 SocketChannel 可配置非阻塞，Selector 一次等待多个通道的就绪状态。select() 本身可以阻塞，选择器返回后应用处理各通道。\",\"AIO 可通过 AsynchronousSocketChannel 的 read 和 write 提交操作并接收完成回调。Java API 的语义是异步，底层由平台和提供者选择实现。\"],\"example\":\"在 NIO 中收到可读事件后自己调用 read。在 AIO 中先提交 read，完成回调收到本次已读取的字节数或失败原因。\",\"pitfall\":\"java.nio 包中也有阻塞 API。一次异步完成同样可能只读写了一部分消息，仍需应用层分帧。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/nio/channels/package-summary.html\",\"anchor\":\"bio%E3%80%81nio%E3%80%81aio%E5%8C%BA%E5%88%AB%E6%98%AF%E4%BB%80%E4%B9%88\",\"node\":\"blocking\",\"chapter\":14,\"follow\":[73,75]},{\"n\":75,\"title\":\"Selector 驱动的 NIO 事件循环如何运行？\",\"short\":\"把非阻塞 Channel 注册给 Selector，并声明关心的 accept、connect、read 或 write 事件。事件循环调用 select 取得就绪的 SelectionKey，再使用 ByteBuffer 执行实际读写，按连接状态保留半帧和未写完的数据。\",\"details\":[\"ServerSocketChannel 注册 OP_ACCEPT。accept 得到 SocketChannel 后配置非阻塞并注册 OP_READ。循环处理 selectedKeys 并从已选集合移除处理过的键。\",\"把数据读入 ByteBuffer 后 flip，解析完整帧，compact 保留未消费数据。read 返回 0 表示本次没有进展，返回 -1 表示流末尾。\",\"仅当确有待写数据且无法立即写完时注册 OP_WRITE。写空后撤销该兴趣位，避免空转。Selector 的底层多路复用机制因平台和提供者而异。\"],\"example\":\"收到长度前缀后，缓冲区里若只有一半正文，就 compact 后继续等下一次可读事件，拼出完整请求再交给业务。\",\"pitfall\":\"就绪表示操作可能取得进展。仍需处理短读、短写、连接关闭以及事件循环跨线程修改时的唤醒。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/nio/channels/Selector.html\",\"anchor\":\"nio%E6%98%AF%E6%80%8E%E4%B9%88%E5%AE%9E%E7%8E%B0%E7%9A%84\",\"node\":\"selector\",\"chapter\":14,\"follow\":[74,76]},{\"n\":76,\"title\":\"哪些框架使用 NIO？Netty 封装了什么？\",\"short\":\"Netty 是典型例子。它把 Channel、EventLoop、缓冲区和 Pipeline 封装成可组合的网络编程模型，NIO 传输可使用 Java Selector，也有面向特定系统的原生传输。应用通常在 Handler 中处理解码后的事件。\",\"details\":[\"一个 EventLoop 可管理多个 Channel。对同一个 Channel 的事件通常由其所属循环串行处理，这简化了单连接状态管理。\",\"ChannelPipeline 组织入站、出站处理器。可先处理帧边界和编解码，再交给业务 Handler，将协议细节与业务逻辑分开。\",\"ByteBuf 支持读写索引、池化和引用计数。Netty 也提供写缓冲水位等机制，应用可据此实现背压。\"],\"example\":\"实现长连接消息协议时，先用长度字段解码器切帧，再解析消息对象。慢数据库查询交给独立执行器以保护事件循环。\",\"pitfall\":\"使用框架也要正确释放引用计数对象和管理队列。若 Handler 在事件循环长时间阻塞，同一循环中的其他连接会一起受影响。\",\"ref\":\"https://netty.io/wiki/user-guide-for-4.x.html\",\"anchor\":\"%E4%BD%A0%E7%9F%A5%E9%81%93%E6%9C%89%E5%93%AA%E4%B8%AA%E6%A1%86%E6%9E%B6%E7%94%A8%E5%88%B0nio%E4%BA%86%E5%90%97\",\"node\":\"netty\",\"chapter\":14,\"follow\":[71,75]},{\"n\":77,\"title\":\"学生列表怎样先按分数、同分再按学号排序？\",\"short\":\"用 Comparator.comparingInt 定义主键分数，使用 thenComparing 或 thenComparingInt 定义同分时的次键学号。先明确升降序和学号语义，再把组合比较器交给 List.sort 或 Stream.sorted。\",\"details\":[\"若高分在前，对分数比较器先 reversed，再拼接学号升序。对整个组合 reversed 会同时反转两个排序规则。\",\"学号是保留前导零的标识时，可按字符串约定比较。若业务要求数字顺序，要使用可安全容纳学号范围的数值键。空值策略也要明确。\",\"Comparator 必须保持一致的顺序和传递性。用 Integer.compare 或 comparingInt 避免通过相减计算比较结果时溢出。\"],\"example\":\"假设分数降序、字符串学号升序，92 分的 0017 排在 92 分的 0023 前面，两人都排在 89 分之前。\",\"code\":\"students.sort(Comparator.comparingInt(Student::score)\\n    .reversed()\\n    .thenComparing(Student::id));\",\"pitfall\":\"只比较分数时，同分比较结果为 0。在 TreeSet 中可能因此把不同学生当成同一排序键。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Comparator.html\",\"anchor\":\"%E6%9C%89%E4%B8%80%E4%B8%AA%E5%AD%A6%E7%94%9F%E7%B1%BB-%E6%83%B3%E6%8C%89%E7%85%A7%E5%88%86%E6%95%B0%E6%8E%92%E5%BA%8F-%E5%86%8D%E6%8C%89%E5%AD%A6%E5%8F%B7%E6%8E%92%E5%BA%8F-%E5%BA%94%E8%AF%A5%E6%80%8E%E4%B9%88%E5%81%9A\",\"node\":\"comparator\",\"chapter\":15,\"follow\":[57,61]},{\"n\":78,\"title\":\"native 方法是什么？它怎么接入本地代码？\",\"short\":\"native 方法在 Java 类中只声明签名，具体实现由 JVM 绑定到本地代码，常见接入方式是 JNI。可用 javac -h 生成头文件，用 C 或 C++ 实现并编译为平台库，再在 Java 中用 System.loadLibrary 加载。\",\"details\":[\"JNI 规定了本地代码如何接收参数、访问 Java 对象、调用 Java 方法以及报告异常。可通过约定的函数名解析或使用 RegisterNatives 显式绑定。\",\"本地代码要正确管理 JNI 的局部和全局引用，及时释放本地缓冲区。错误指针访问等问题可能直接让整个进程崩溃。\",\"JNI 常用于复用成熟的本地库或接入平台 API。跨语言边界的调用和数据转换有成本，宜按需求批量调用。\"],\"example\":\"Java 图像服务调用已有 C 解码器。Java 层负责传入输入字节和尺寸，JNI 层负责校验参数、调用解码器和清理临时内存。\",\"code\":\"final class Decoder {\\n    static { System.loadLibrary(\\\"decoder\\\"); }\\n    static native int decode(byte[] image);\\n}\",\"pitfall\":\"native 库要匹配操作系统、架构和依赖。单有 Java 字节码的跨平台性不能保证 native 依赖在目标机器上可用。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/specs/jni/\",\"anchor\":\"native%E6%96%B9%E6%B3%95%E8%A7%A3%E9%87%8A%E4%B8%80%E4%B8%8B\",\"node\":\"native\",\"chapter\":15,\"follow\":[3,79]},{\"n\":79,\"title\":\"Java 进程通过哪些路径和操作系统交互？\",\"short\":\"运行 Java 程序时，操作系统启动 JVM 进程并为它调度线程、分配虚拟内存、提供文件和网络能力。Java 代码多从标准库调用，JDK 和 JVM 在需要时经由平台本地实现使用系统调用。也可用 JNI 接入本地库，用 ProcessBuilder 启动子进程。\",\"details\":[\"Files.readAllBytes 等 API 经 JDK 文件系统提供者打开和读取文件，网络 API 经底层套接字实现与内核交互。具体系统调用和等待机制随平台变化。\",\"平台线程通常由操作系统调度。Java 21 虚拟线程由 JVM 调度到载体平台线程上，载体仍受 OS 调度。JVM 也会向系统申请或映射内存。\",\"ProcessBuilder 可设置命令参数、环境、目录和流重定向。等待进程前应处理其 stdout 与 stderr，避免子进程写满管道而双方互相等待。\"],\"example\":\"在 Unix 上启动本地命令时，可将标准错误并入输出，读取完输出后检查退出码。在线服务还应对输出大小与执行时长设限。\",\"code\":\"Process process = new ProcessBuilder(\\\"uname\\\", \\\"-s\\\")\\n    .redirectErrorStream(true).start();\\nbyte[] output = process.getInputStream().readAllBytes();\\nint exitCode = process.waitFor();\",\"pitfall\":\"并非每次 Java 方法调用都会进入内核。普通计算大多在用户态完成，阻塞 I/O、进程操作等才可能涉及系统调用。\",\"ref\":\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/ProcessBuilder.html\",\"anchor\":\"java-%E8%BF%9B%E7%A8%8B%E6%98%AF%E6%80%8E%E4%B9%88%E8%B7%9F%E6%93%8D%E4%BD%9C%E7%B3%BB%E7%BB%9F%E4%BA%A4%E4%BA%92%E7%9A%84\",\"node\":\"os\",\"chapter\":15,\"follow\":[74,78]}]};\nconst $ = id => document.getElementById(id);\nconst esc = value => String(value).replace(/[&\u003c>\"']/g, ch => (\n  {'&':'&amp;', '\u003c':'&lt;', '>':'&gt;', '\"':'&quot;', \"'\":'&#39;'}[ch]\n));\nconst questionNo = index => String(index + 1).padStart(2, '0');\nconst byId = new Map(DATA.nodes.map(node => [node.id, node]));\nconst byCat = new Map(DATA.cats.map(cat => [cat.id, cat]));\nconst byRoute = new Map(DATA.routes.map(item => [item.id, item]));\nconst edgeColors = {\n  基础依赖:'#547aab', 实现关系:'#527796', 共享原理:'#168769',\n  深入追问:'#6d62bb', 对比区别:'#c05765', 工程应用:'#aa6d24'\n};\nconst nodeEdges = id => DATA.edges.filter(edge => edge.a === id || edge.b === id);\nconst questionsByNode = new Map(DATA.nodes.map(node => [node.id, []]));\nDATA.questions.forEach((question, index) => questionsByNode.get(question.node).push(index));\n\nconst svg = $('map');\nconst state = {route:'all', category:null, selected:'value', expanded:false};\nlet layout;\nlet view;\nlet drag;\nlet panelRatio = 0;\nconst pixelRatio = () => (svg.clientWidth || 860) / (svg.clientHeight || 555);\nconst columnsForWidth = () => (svg.clientWidth || 860) \u003c 545 ? 2 : 3;\n\nfunction makeSVG(tag, attrs = {}, content) {\n  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);\n  for (const [name, value] of Object.entries(attrs)) el.setAttribute(name, value);\n  if (content !== undefined) el.textContent = content;\n  return el;\n}\n\nfunction visibleNodes() {\n  if (state.category) return DATA.nodes.filter(node => node.cat === state.category);\n  const route = byRoute.get(state.route);\n  return DATA.nodes.filter(node =>\n    state.expanded || node.id === state.selected ||\n    (route.id === 'all' ? node.core : route.nodes.includes(node.id))\n  );\n}\n\nfunction arrange(nodes) {\n  const groups = DATA.cats.map(cat => ({\n    cat, nodes:nodes.filter(node => node.cat === cat.id)\n  })).filter(group => group.nodes.length);\n  const columns = Math.min(columnsForWidth(), groups.length);\n  const laneW = 218;\n  const gap = 42;\n  const step = 61;\n  const margin = 22;\n  const positions = new Map();\n  let rowY = margin;\n  for (let start = 0; start \u003c groups.length; start += columns) {\n    const row = groups.slice(start, start + columns);\n    const rowHeight = 80 + Math.max(...row.map(group => group.nodes.length)) * step;\n    row.forEach((group, col) => {\n      const x = margin + col * (laneW + gap);\n      Object.assign(group, {x, y:rowY, w:laneW, h:rowHeight});\n      group.nodes.forEach((node, index) => positions.set(node.id, {\n        x:x + 10, y:rowY + 75 + index * step, w:laneW - 20, h:48\n      }));\n    });\n    rowY += rowHeight + gap;\n  }\n  return {positions, groups, columns, width:2 * margin + columns * laneW + (columns - 1) * gap,\n    height:rowY - gap + margin};\n}\n\nfunction setView() {\n  svg.setAttribute('viewBox', [view.x, view.y, view.w, view.h].join(' '));\n}\n\nfunction fitGraph() {\n  panelRatio = pixelRatio();\n  const w = Math.max(layout.width, layout.height * panelRatio);\n  const h = w / panelRatio;\n  view = {x:(layout.width - w) / 2, y:(layout.height - h) / 2, w, h};\n  setView();\n}\n\nfunction focusNode(id) {\n  const pos = layout.positions.get(id);\n  const w = Math.max(310, Math.min(560, svg.clientWidth || 560));\n  const h = w / pixelRatio();\n  view = {x:pos.x + (pos.w - w) / 2, y:pos.y + (pos.h - h) / 2, w, h};\n  setView();\n}\n\nfunction zoomFromCenter(scale) {\n  const fitWidth = Math.max(layout.width, layout.height * pixelRatio());\n  const w = Math.max(185, Math.min(Math.max(850, 2 * fitWidth), view.w * scale));\n  const h = w / pixelRatio();\n  view = {x:view.x + (view.w - w) / 2, y:view.y + (view.h - h) / 2, w, h};\n  setView();\n}\n\nfunction edgePath(from, to) {\n  const dx = to.x - from.x;\n  const dy = to.y - from.y;\n  if (Math.abs(dx) > 1) {\n    const right = dx > 0;\n    const x1 = from.x + (right ? from.w : 0);\n    const x2 = to.x + (right ? 0 : to.w);\n    const mid = (x1 + x2) / 2;\n    const y1 = from.y + from.h / 2;\n    const y2 = to.y + to.h / 2;\n    return `M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`;\n  }\n  const x = from.x + from.w;\n  const y1 = from.y + from.h / 2;\n  const y2 = to.y + to.h / 2;\n  return `M ${x} ${y1} C ${x + 38} ${y1}, ${x + 38} ${y2}, ${x} ${y2}`;\n}\n\nfunction drawGraph() {\n  const route = byRoute.get(state.route);\n  const nodes = visibleNodes();\n  layout = arrange(nodes);\n  const {positions, groups, width, height} = layout;\n  const related = new Set(nodeEdges(state.selected).flatMap(edge => [edge.a, edge.b]));\n  const linked = edge => edge.a === state.selected || edge.b === state.selected;\n  const onRoute = edge => route.id !== 'all' && route.nodes.includes(edge.a) && route.nodes.includes(edge.b);\n  const edges = DATA.edges.filter(edge => positions.has(edge.a) && positions.has(edge.b));\n  edges.sort((a,b) => Number(linked(a)) - Number(linked(b)));\n\n  const defs = makeSVG('defs');\n  const pattern = makeSVG('pattern', {id:'grid', width:20, height:20, patternUnits:'userSpaceOnUse'});\n  pattern.append(makeSVG('circle', {cx:1, cy:1, r:1, fill:'#dce4ef'}));\n  defs.append(pattern);\n  Object.entries(edgeColors).forEach(([kind,color], index) => {\n    const marker = makeSVG('marker', {id:'arrow' + index, viewBox:'0 0 8 8', refX:7,\n      refY:4, markerWidth:6, markerHeight:6, orient:'auto', markerUnits:'userSpaceOnUse'});\n    marker.append(makeSVG('path', {d:'M 0 0 L 8 4 L 0 8 Z', fill:color}));\n    defs.append(marker);\n  });\n  const stage = makeSVG('g');\n  stage.append(makeSVG('rect', {width, height, fill:'url(#grid)'}));\n  for (const {cat,x,y,w,h,nodes:members} of groups) {\n    stage.append(\n      makeSVG('rect', {x,y,width:w,height:h,rx:16,fill:cat.color,'fill-opacity':'.055',stroke:cat.color,'stroke-opacity':'.23'}),\n      makeSVG('text', {x:x + 11,y:y + 24,class:'svg-catlabel',fill:cat.color}, cat.label),\n      makeSVG('text', {x:x + 11,y:y + 44,class:'svg-catdesc'}, cat.desc),\n      makeSVG('text', {x:x + 11,y:y + 61,class:'svg-count'}, `${members.length} 个可见节点`)\n    );\n  }\n  const edgeLayer = makeSVG('g');\n  for (const edge of edges) {\n    const active = linked(edge);\n    const featured = onRoute(edge);\n    const path = makeSVG('path', {\n      d:edgePath(positions.get(edge.a), positions.get(edge.b)), fill:'none', class:'svg-edge',\n      stroke:edgeColors[edge.kind], 'stroke-width':active ? 3 : featured ? 2.3 : 1.4,\n      'stroke-opacity':active ? '.95' : featured ? '.75' : '.33',\n      'stroke-linecap':'round'\n    });\n    if (edge.kind === '对比区别') path.setAttribute('stroke-dasharray', '5 4');\n    if (active || featured) path.setAttribute('marker-end', `url(#arrow${Object.keys(edgeColors).indexOf(edge.kind)})`);\n    path.append(makeSVG('title', {}, `${byId.get(edge.a).title} → ${byId.get(edge.b).title}\\n${edge.why}`));\n    path.addEventListener('click', () => selectNode(edge.b, false, edge));\n    edgeLayer.append(path);\n  }\n  stage.append(edgeLayer);\n  const nodeLayer = makeSVG('g');\n  for (const node of nodes) {\n    const pos = positions.get(node.id);\n    const color = byCat.get(node.cat).color;\n    const selected = node.id === state.selected;\n    const card = makeSVG('g', {\n      transform:`translate(${pos.x},${pos.y})`,class:'svg-node','data-node':node.id,\n      tabindex:0,role:'button','aria-label':node.title,'aria-pressed':String(selected)\n    });\n    card.append(\n      makeSVG('rect', {width:pos.w,height:pos.h,rx:9,class:'nodebox',fill:'#fff',\n        stroke:selected || related.has(node.id) ? color : '#cdd9e8','stroke-width':selected ? 2.5 : 1}),\n      makeSVG('rect', {width:4,height:pos.h,rx:2,fill:color}),\n      makeSVG('text', {x:12,y:20,class:'svg-title'}, node.title),\n      makeSVG('text', {x:12,y:36,class:'svg-sub'}, node.sub),\n      makeSVG('title', {}, node.what)\n    );\n    card.addEventListener('click', () => selectNode(node.id));\n    card.addEventListener('keydown', event => {\n      if (event.key !== 'Enter' && event.key !== ' ') return;\n      event.preventDefault();\n      selectNode(node.id);\n      svg.querySelector(`[data-node=\"${node.id}\"]`)?.focus();\n    });\n    nodeLayer.append(card);\n  }\n  stage.append(nodeLayer);\n  svg.replaceChildren(defs, stage);\n  $('shownStat').textContent = `显示 ${nodes.length}/${DATA.nodes.length} 个节点 · ${edges.length} 条关系`;\n  $('mapInfo').textContent = state.category ? byCat.get(state.category).label.slice(5) : route.title;\n}\n\nfunction renderDetail(clickedEdge) {\n  const node = byId.get(state.selected);\n  const cat = byCat.get(node.cat);\n  const items = questionsByNode.get(node.id);\n  const neighbors = nodeEdges(node.id);\n  $('detail').innerHTML = `\n    \u003cdiv class=\"detail-type\">\u003cspan class=\"categorylabel\" style=\"background:${cat.color}18;color:${cat.color}\">${esc(cat.label)}\u003c/span>\u003c/div>\n    \u003ch2>${esc(node.title)}\u003c/h2>\u003cdiv class=\"subtitle\">${esc(node.sub)}\u003c/div>\u003cp>${esc(node.what)}\u003c/p>\n    \u003cdiv class=\"info-card\">\u003ch4>面试时要讲清楚\u003c/h4>\u003cp>${esc(node.take)}\u003c/p>\u003c/div>\n    ${clickedEdge ? `\u003cdiv class=\"info-card edge-detail\">\u003ch4>${esc(byId.get(clickedEdge.a).title)} → ${esc(byId.get(clickedEdge.b).title)}\u003c/h4>\u003cp>${esc(clickedEdge.why)}\u003c/p>\u003c/div>` : ''}\n    \u003cdiv>\u003cdiv class=\"section-cap\">为什么与这些知识相关\u003c/div>\u003cdiv class=\"related\">${neighbors.map(edge => {\n      const outbound = edge.a === node.id;\n      const other = byId.get(outbound ? edge.b : edge.a);\n      return `\u003cbutton class=\"related-btn\" data-related=\"${other.id}\">\u003cb style=\"color:${edgeColors[edge.kind]}\">${outbound ? '→' : '←'} ${edge.kind}\u003c/b>　${esc(other.title)}\u003csmall>${esc(edge.why)}\u003c/small>\u003c/button>`;\n    }).join('')}\u003c/div>\u003c/div>\n    \u003cdiv class=\"info-card\">\u003ch4>关联面试题 · ${items.length} 道\u003c/h4>${items.length\n      ? `\u003cdiv class=\"detail-questions\">${items.map(index => `\u003cbutton class=\"related-btn\" data-openq=\"${index}\">${questionNo(index)} · ${esc(DATA.questions[index].title)}\u003c/button>`).join('')}\u003c/div>`\n      : '\u003cp>可通过上方关联进入相邻主题的题解。\u003c/p>'}\u003c/div>`;\n}\n\nfunction selectNode(id, locate = false, edge) {\n  if (!layout.positions.has(id)) {\n    state.route = 'all';\n    state.category = null;\n    state.expanded = true;\n    state.selected = id;\n    refreshScope();\n  } else {\n    state.selected = id;\n    drawGraph();\n    renderDetail(edge);\n  }\n  if (locate) focusNode(id);\n}\n\nfunction updateScopeControls() {\n  $('expandBtn').textContent = state.expanded ? '− 收起次级知识点' : '＋ 展开全部知识点';\n  $('expandBtn').setAttribute('aria-pressed', String(state.expanded));\n  $('expandBtn').classList.toggle('active', state.expanded);\n  document.querySelectorAll('[data-route]').forEach(button => {\n    const active = !state.category && button.dataset.route === state.route;\n    button.classList.toggle('active', active);\n    button.setAttribute('aria-pressed', String(active));\n  });\n  document.querySelectorAll('[data-category]').forEach(button => {\n    const active = button.dataset.category === state.category;\n    button.classList.toggle('active', active);\n    button.setAttribute('aria-pressed', String(active));\n  });\n}\n\nfunction refreshScope() {\n  updateScopeControls();\n  drawGraph();\n  fitGraph();\n  renderDetail();\n}\n\nfunction chooseRoute(id) {\n  const route = byRoute.get(id);\n  state.route = id;\n  state.category = null;\n  state.expanded = false;\n  state.selected = route.nodes[0] || 'value';\n  refreshScope();\n}\n\n$('routes').innerHTML = DATA.routes.map(route => `\n  \u003cbutton class=\"route-btn\" data-route=\"${route.id}\">\u003cstrong>${route.icon}　${esc(route.title)}\u003c/strong>\u003cspan>${esc(route.desc)}\u003c/span>\u003c/button>\n`).join('');\n$('catnav').innerHTML = DATA.cats.map(cat => `\n  \u003cbutton data-category=\"${cat.id}\" style=\"border-left:3px solid ${cat.color}\">${esc(cat.label.slice(5))}\u003c/button>\n`).join('');\n$('routes').addEventListener('click', event => {\n  const button = event.target.closest('[data-route]');\n  if (button) chooseRoute(button.dataset.route);\n});\n$('catnav').addEventListener('click', event => {\n  const button = event.target.closest('[data-category]');\n  if (!button) return;\n  state.category = button.dataset.category;\n  state.route = 'all';\n  state.expanded = false;\n  state.selected = DATA.nodes.find(node => node.cat === state.category && node.core).id;\n  refreshScope();\n});\n$('detail').addEventListener('click', event => {\n  const button = event.target.closest('[data-related]');\n  if (button) selectNode(button.dataset.related, true);\n});\n$('resetBtn').onclick = () => chooseRoute('all');\n$('expandBtn').onclick = () => {\n  state.expanded = !state.expanded || Boolean(state.category);\n  state.category = null;\n  refreshScope();\n};\n$('zoomOut').onclick = () => zoomFromCenter(1.25);\n$('zoomIn').onclick = () => zoomFromCenter(.8);\n$('fitBtn').onclick = fitGraph;\n$('heroGraphBtn').onclick = () => $('graphArea').scrollIntoView({behavior:'smooth'});\n\nsvg.addEventListener('pointerdown', event => {\n  if (!event.isPrimary || event.button !== 0 || event.target.closest('.svg-node,.svg-edge')) return;\n  drag = {id:event.pointerId, x:event.clientX, y:event.clientY, vx:view.x, vy:view.y};\n  svg.setPointerCapture(event.pointerId);\n  svg.classList.add('dragging');\n});\nsvg.addEventListener('pointermove', event => {\n  if (drag?.id !== event.pointerId) return;\n  view.x = drag.vx - (event.clientX - drag.x) * view.w / (svg.clientWidth || 1);\n  view.y = drag.vy - (event.clientY - drag.y) * view.h / (svg.clientHeight || 1);\n  setView();\n});\nfor (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {\n  svg.addEventListener(type, event => {\n    if (drag?.id !== event.pointerId) return;\n    drag = null;\n    svg.classList.remove('dragging');\n  });\n}\nfunction resizeGraph() {\n  const desired = Math.min(columnsForWidth(), layout.groups.length);\n  if (desired !== layout.columns) {\n    drawGraph();\n    fitGraph();\n  } else if (Math.abs(panelRatio - pixelRatio()) > .001) {\n    const h = view.w / pixelRatio();\n    view.y += (view.h - h) / 2;\n    view.h = h;\n    panelRatio = pixelRatio();\n    setView();\n  }\n}\nrefreshScope();\nif ('ResizeObserver' in window) new ResizeObserver(resizeGraph).observe(svg);\nelse window.addEventListener('resize', resizeGraph);\n\nconst totalQuestions = DATA.questions.length;\nconst progressKey = 'java_basics_atlas_learned_v1';\nconst overlay = $('studyOverlay');\nconst article = $('studyArticle');\nconst searchText = DATA.questions.map(question => [\n  question.title, question.short, ...question.details, question.example,\n  question.pitfall, question.code || '', byId.get(question.node).title, DATA.chapters[question.chapter]\n].join(' ').toLowerCase());\nlet progress = new Set();\nlet currentQuestion = 0;\nlet lastFocused;\ntry {\n  const saved = JSON.parse(localStorage.getItem(progressKey) || '[]');\n  if (Array.isArray(saved)) progress = new Set(saved.filter(i => Number.isInteger(i) && i >= 0 && i \u003c totalQuestions));\n} catch {}\n\nconst matches = (index, term) => term.split(/\\s+/).every(word => searchText[index].includes(word));\nconst groupedQuestions = DATA.chapters.map((_, chapter) =>\n  DATA.questions.flatMap((question, index) => question.chapter === chapter ? [index] : [])\n);\n\nfunction renderProgress() {\n  const amount = `${progress.size} / ${totalQuestions}`;\n  $('hubProgressText').textContent = '已学 ' + amount;\n  $('studyProgressText').textContent = '学习进度 ' + amount;\n  for (const id of ['hubProgressFill','studyProgressFill']) {\n    $(id).style.width = progress.size / totalQuestions * 100 + '%';\n  }\n}\n\nfunction renderIndex() {\n  const term = $('qsearch').value.trim().toLowerCase();\n  let count = 0;\n  $('qgroups').innerHTML = groupedQuestions.map((indices, chapter) => {\n    const shown = indices.filter(index => matches(index, term));\n    count += shown.length;\n    if (!shown.length) return '';\n    const buttons = shown.map(index => `\n      \u003cbutton class=\"question-item${progress.has(index) ? ' learned' : ''}\" data-openq=\"${index}\">\n        \u003cb>${questionNo(index)}\u003c/b>${esc(DATA.questions[index].title)}\n      \u003c/button>`).join('');\n    return `\u003csection class=\"qgroup\">\u003cdiv class=\"qhead\">${esc(DATA.chapters[chapter])}\n      \u003cspan class=\"qcount\">${shown.length} 题\u003c/span>\u003c/div>\u003cdiv class=\"qlist\">${buttons}\u003c/div>\u003c/section>`;\n  }).join('') || '\u003cp class=\"empty\">没有匹配的题目。\u003c/p>';\n  $('indexCount').textContent = `${count} / ${totalQuestions} 道`;\n}\n\nfunction renderStudyNav() {\n  $('mobileJump').value = String(currentQuestion);\n  const term = $('studyFilter').value.trim().toLowerCase();\n  $('studyRailNav').innerHTML = groupedQuestions.map((indices, chapter) => {\n    const shown = indices.filter(index => matches(index, term));\n    if (!shown.length) return '';\n    return `\u003cdiv class=\"study-rail-label\">${esc(DATA.chapters[chapter])}\u003c/div>` +\n      shown.map(index => `\n        \u003cbutton class=\"study-qnav${index === currentQuestion ? ' active' : ''}${progress.has(index) ? ' done' : ''}\"\n          data-openq=\"${index}\"${index === currentQuestion ? ' aria-current=\"true\"' : ''}>\n          \u003cspan class=\"num\">${progress.has(index) ? '✓' : questionNo(index)}\u003c/span>\n          \u003cspan class=\"txt\">${esc(DATA.questions[index].title)}\u003c/span>\n        \u003c/button>`).join('');\n  }).join('') || '\u003cp class=\"empty\">没有匹配的题目。\u003c/p>';\n  if (!term) $('studyRailNav').querySelector('[aria-current]')?.scrollIntoView({block:'nearest'});\n}\n\nfunction renderAnswer() {\n  const question = DATA.questions[currentQuestion];\n  const node = byId.get(question.node);\n  const edges = nodeEdges(node.id);\n  article.innerHTML = `\n    \u003cdiv class=\"study-eyebrow\">第 ${questionNo(currentQuestion)} / ${totalQuestions} 题 · ${esc(DATA.chapters[question.chapter])}\u003c/div>\n    \u003ch2>${esc(question.title)}\u003c/h2>\n    \u003cdiv class=\"study-intro\">图谱节点 · ${esc(node.title)}\u003c/div>\n    \u003csection class=\"study-panel quick\">\u003ch3>\u003cspan class=\"kicker\">口述\u003c/span>面试时怎么答\u003c/h3>\u003cp>${esc(question.short)}\u003c/p>\u003c/section>\n    \u003csection class=\"study-panel\">\u003ch3>\u003cspan class=\"kicker\">原理\u003c/span>机制拆解\u003c/h3>\n      \u003col class=\"study-points\">${question.details.map((point, i) => `\u003cli>\u003cspan class=\"step\">${i + 1}\u003c/span>\u003cspan>${esc(point)}\u003c/span>\u003c/li>`).join('')}\u003c/ol>\n    \u003c/section>\n    \u003csection class=\"study-panel example\">\u003ch3>\u003cspan class=\"kicker\">例子\u003c/span>放到代码或场景里看\u003c/h3>\n      \u003cp>${esc(question.example)}\u003c/p>${question.code ? `\u003cpre class=\"study-code\">\u003ccode>${esc(question.code)}\u003c/code>\u003c/pre>` : ''}\n    \u003c/section>\n    \u003csection class=\"study-panel warning\">\u003ch3>\u003cspan class=\"kicker\">边界\u003c/span>常见易错点\u003c/h3>\u003cp>${esc(question.pitfall)}\u003c/p>\u003c/section>\n    \u003csection class=\"study-panel\">\u003ch3>\u003cspan class=\"kicker\">图谱\u003c/span>为什么会追问到这里\u003c/h3>\n      \u003cdiv class=\"study-nodechips\">\n        \u003cbutton class=\"study-chip main-chip\" data-gonode=\"${node.id}\">◎ ${esc(node.title)}\u003csmall>返回图谱定位\u003c/small>\u003c/button>\n        ${edges.map(edge => {\n          const other = byId.get(edge.a === node.id ? edge.b : edge.a);\n          return `\u003cbutton class=\"study-chip\" data-gonode=\"${other.id}\">${esc(other.title)}\u003csmall>${edge.kind} · ${esc(edge.why)}\u003c/small>\u003c/button>`;\n        }).join('')}\n      \u003c/div>\n    \u003c/section>\n    \u003csection class=\"study-panel\">\u003ch3>\u003cspan class=\"kicker\">下一题\u003c/span>适合连起来看的题\u003c/h3>\n      \u003cdiv class=\"study-followups\">${question.follow.map(n => `\n        \u003cbutton class=\"study-chip\" data-openq=\"${n - 1}\">${questionNo(n - 1)} · ${esc(DATA.questions[n - 1].title)}\u003c/button>`).join('')}\u003c/div>\n    \u003c/section>\n    \u003cdiv class=\"study-actions\">\u003cdiv class=\"study-foot\">\n      \u003cbutton data-openq=\"${currentQuestion - 1}\" ${currentQuestion === 0 ? 'disabled' : ''}>← 上一题\u003c/button>\n      \u003cbutton data-openq=\"${currentQuestion + 1}\" ${currentQuestion === totalQuestions - 1 ? 'disabled' : ''}>下一题 →\u003c/button>\n    \u003c/div>\u003cbutton class=\"affirm${progress.has(currentQuestion) ? ' done' : ''}\" id=\"markLearned\">${progress.has(currentQuestion) ? '✓ 已学 · 点击取消' : '标记为已学'}\u003c/button>\u003c/div>\n    \u003cdiv class=\"study-foot\">\n      \u003ca class=\"study-source\" href=\"${DATA.source}#${question.anchor}\" target=\"_blank\" rel=\"noopener\">查看原题 ↗\u003c/a>\n      ${question.ref ? `\u003ca class=\"study-source\" href=\"${esc(question.ref)}\" target=\"_blank\" rel=\"noopener\">技术参考 ↗\u003c/a>` : ''}\n    \u003c/div>`;\n}\n\nfunction replaceHash(hash) {\n  try { history.replaceState(null, '', hash || location.pathname + location.search); } catch {}\n}\n\nfunction openQuestion(index) {\n  if (!Number.isInteger(index) || index \u003c 0 || index >= totalQuestions) return;\n  if (overlay.hidden) {\n    lastFocused = document.activeElement;\n    overlay.hidden = false;\n    $('shell').inert = true;\n    document.body.style.overflow = 'hidden';\n  }\n  currentQuestion = index;\n  renderAnswer();\n  renderStudyNav();\n  article.scrollTop = 0;\n  article.focus({preventScroll:true});\n  if (location.hash !== '#q' + (index + 1)) replaceHash('#q' + (index + 1));\n}\n\nfunction closeQuestion(restoreFocus = true) {\n  overlay.hidden = true;\n  $('shell').inert = false;\n  document.body.style.overflow = '';\n  if (/^#q\\d+$/.test(location.hash)) replaceHash('');\n  if (restoreFocus) lastFocused?.focus({preventScroll:true});\n}\n\nfunction goToGraph(id) {\n  closeQuestion(false);\n  selectNode(id, true);\n  $('graphArea').scrollIntoView({behavior:'smooth'});\n  svg.querySelector(`[data-node=\"${id}\"]`)?.focus({preventScroll:true});\n}\n\n$('nodeStat').textContent = DATA.nodes.length;\n$('edgeStat').textContent = DATA.edges.length;\n$('heroOpenBtn').onclick = $('hubOpenBtn').onclick = () => openQuestion(currentQuestion);\n$('heroBrowseBtn').onclick = () => $('questionIndex').scrollIntoView({behavior:'smooth'});\n$('closeStudy').onclick = () => closeQuestion();\n$('openMapFromStudy').onclick = () => goToGraph(DATA.questions[currentQuestion].node);\n$('qsearch').addEventListener('input', renderIndex);\n$('studyFilter').addEventListener('input', renderStudyNav);\n$('mobileJump').innerHTML = DATA.questions.map((question, index) =>\n  `\u003coption value=\"${index}\">${questionNo(index)} · ${esc(question.title)}\u003c/option>`\n).join('');\n$('mobileJump').onchange = event => openQuestion(Number(event.target.value));\n\ndocument.addEventListener('click', event => {\n  const question = event.target.closest('[data-openq]');\n  const graphNode = event.target.closest('[data-gonode]');\n  if (question && !question.disabled) openQuestion(Number(question.dataset.openq));\n  else if (graphNode) goToGraph(graphNode.dataset.gonode);\n  else if (event.target.id === 'markLearned') {\n    if (progress.has(currentQuestion)) progress.delete(currentQuestion);\n    else progress.add(currentQuestion);\n    try { localStorage.setItem(progressKey, JSON.stringify([...progress])); } catch {}\n    renderProgress();\n    $('qgroups').querySelector(`[data-openq=\"${currentQuestion}\"]`)\n      ?.classList.toggle('learned', progress.has(currentQuestion));\n    renderAnswer();\n    renderStudyNav();\n    $('markLearned').focus({preventScroll:true});\n  } else if (event.target === overlay) closeQuestion();\n});\n\ndocument.addEventListener('keydown', event => {\n  if (overlay.hidden) return;\n  if (event.key === 'Escape') {\n    closeQuestion();\n    return;\n  }\n  if (event.target.closest('input, select, textarea, button, a')) return;\n  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {\n    event.preventDefault();\n    openQuestion(currentQuestion + (event.key === 'ArrowLeft' ? -1 : 1));\n  }\n});\nrenderProgress();\nrenderIndex();\nconst initialQuestion = location.hash.match(/^#q(\\d+)$/);\nif (initialQuestion) openQuestion(Number(initialQuestion[1]) - 1);\n\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","questions":[{"title":"Java 的核心语言特性有哪些？","topic":"Java 语言与生态"},{"title":"Java 的工程优势与使用成本是什么？","topic":"Java 语言与生态"},{"title":"一份 Java 字节码为何能在多个平台运行？","topic":"字节码与跨平台"},{"title":"JDK、JRE 和 JVM 各负责什么？","topic":"JVM、JRE 与 JDK"},{"title":"Java 语言和 JVM 的边界在哪里？","topic":"JVM、JRE 与 JDK"},{"title":"Java 为何同时涉及编译和解释执行？","topic":"JVM、JRE 与 JDK"},{"title":"JVM 从加载到执行主要做哪些事？","topic":"JVM、JRE 与 JDK"},{"title":"编译执行和解释执行该怎么区分？","topic":"字节码与跨平台"},{"title":"Python 与 Java 的类型和运行方式有哪些差异？","topic":"Java 语言与生态"},{"title":"为什么说 Java 的参数传递统一采用值传递？","topic":"引用与值传递"},{"title":"Java 的八种基本类型如何分类？","topic":"基本类型与位宽"},{"title":"int 和 long 的位宽与范围分别是多少？","topic":"基本类型与位宽"},{"title":"int 和 long 如何互转并检查范围？","topic":"转换与数值溢出"},{"title":"Java 的类型转换分哪些场景？","topic":"转换与数值溢出"},{"title":"类型转换可能丢数据或抛出什么异常？","topic":"转换与数值溢出"},{"title":"金额计算为什么常用 x;gap:8px;align-items:center;flex-wrap:wrap}\n@media(max-width:800px){.study-overlay{padding:0}.study-sheet{width:100%;height:100vh;border-radius:0}.study-layout{grid-template-columns:1fr}.study-rail{display:none}.study-article{padding:19px 15px 28px}.study-top{padding:13px 15px}.study-article h2{font-size:22px}.study-panel{padding:16px}.study-summary{margin:10px 0}.study-toptools button:not(.close-study){display:none}.mobile-jump{display:block;max-width:150px}}\n\n.workspace { align-items:start }\n.map-panel { min-height:0 }\n.toolbar #mapInfo { color:#52647d; font-size:11px }\n.viewport { flex:none; min-height:0; height:clamp(490px,66vh,670px) }\n.viewport svg { position:absolute; inset:0 }\n.catnav button.active { background:#eaf1ff; border-color:#adc8f3; color:#295bac }\n.svg-catdesc,.svg-count { fill:#586d86 }\n.svg-node:focus-visible { outline:none }\n.svg-node:focus-visible .nodebox { stroke:#1c4b9c; stroke-width:3 }\n.detail .section-cap { margin:0 0 7px }\n.edge-detail { background:#fff7eb; border-color:#f0d5ab }\n.detail-questions { display:grid; gap:5px; max-height:240px; overflow:auto }\n.related-btn small { color:#576e87 }\n.case-link { border:0; padding:6px 0 0; color:#285da9; background:transparent; font-size:12px }\n.case-link:hover { text-decoration:underline }\n.hub-actions { display:flex; gap:14px; align-items:center; flex-wrap:wrap }\n.hub-actions .primary-study { background:#285da9; color:white; border-color:#285da9 }\n.progress-caption { margin-top:4px; font-size:11px; color:#526984 }\n.main-chip { border-color:#bad3f7; background:#f0f6ff }\n.study-article:focus { outline:none }\n.study-actions button:disabled { opacity:.55; cursor:default }\n#graphArea,#questionIndex { scroll-margin-top:12px }\n@media(max-width:720px) {\n  .viewport { height:clamp(400px,63vh,530px); min-height:0 }\n  .graph-legend { display:none }\n  .route-btn { padding:8px }\n}\n@media(prefers-reduced-motion:reduce) {\n  *,*::before,*::after { transition:none!important }\n}\n\n\n@media(min-width:1200px) { .qgroups { grid-template-columns:repeat(5,minmax(0,1fr)) } }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"shell\" id=\"shell\">\n  \u003cheader class=\"hero\">\n    \u003cdiv class=\"eyebrow\">JAVA 集合 · 交互知识图谱\u003c/div>\n    \u003ch1>Java 集合知识关系图与 69 题答案库\u003c/h1>\n    \u003cp>从接口契约出发，理解 List 的访问成本、Set 的判重规则、Map 的桶结构和 Queue 的等待机制。点关系线看原因，从知识节点进入对应题解。\u003c/p>\n    \u003cdiv class=\"hero-bottom\">\n      \u003cdiv class=\"metric\">\u003cstrong id=\"nodeStat\">—\u003c/strong> 个知识节点\u003c/div>\n      \u003cdiv class=\"metric\">\u003cstrong id=\"edgeStat\">—\u003c/strong> 条解释型关联\u003c/div>\n      \u003cdiv class=\"metric\">\u003cstrong>69 / 69\u003c/strong> 原章题目覆盖\u003c/div>\n      \u003ca class=\"source\" href=\"https://xiaolincoding.com/interview/collections.html#概念\" target=\"_blank\" rel=\"noopener\">小林 coding · Java 集合原章 ↗\u003c/a>\n    \u003c/div>\n    \u003cdiv class=\"hero-actions\">\n      \u003cbutton id=\"heroOpenBtn\" class=\"primary-study\">开始读完整答案\u003c/button>\n      \u003cbutton id=\"heroGraphBtn\" class=\"ghost-study\">探索知识关系图 ↓\u003c/button>\n      \u003cbutton id=\"heroBrowseBtn\" class=\"ghost-study\">按目录找题 ↓\u003c/button>\n    \u003c/div>\n  \u003c/header>\n\n  \u003csection class=\"connection\" aria-labelledby=\"exampleTitle\">\n    \u003cdiv class=\"connhead\">\u003cspan class=\"pill\">串起三道高频题\u003c/span>\u003ch2 id=\"exampleTitle\">HashMap 的桶是怎么定位、拆分和树化的？\u003c/h2>\u003c/div>\n    \u003cdiv class=\"connrow\">\n      \u003cdiv class=\"conncard\">\n        \u003ch3>01 · 先用低位定位候选桶\u003c/h3>\n        \u003cdiv class=\"tagrow\">\u003cspan class=\"tinytag\">哈希扰动\u003c/span>\u003cspan class=\"tinytag\">(n−1) &amp; hash\u003c/span>\u003c/div>\n        \u003cp>容量为 16 时，扰动后的哈希值 5 和 21 都落在桶 5。找到桶后，还要用哈希值和 equals 判断键是否相同。\u003c/p>\n        \u003cbutton class=\"case-link\" data-openq=\"28\">看第 29 题 →\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"conncard shared\">\n        \u003ch3>02 · 容量翻倍，多看一个索引位\u003c/h3>\n        \u003cdiv class=\"tagrow\">\u003cspan class=\"tinytag\">扩容\u003c/span>\u003cspan class=\"tinytag\">hash &amp; oldCap\u003c/span>\u003c/div>\n        \u003cp>容量从 16 变为 32 后，哈希值 5 留在桶 5，哈希值 21 移到桶 21。旧桶可以按新增位分成两组。\u003c/p>\n        \u003cbutton class=\"case-link\" data-openq=\"43\">看第 44 题 →\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"conncard\">\n        \u003ch3>03 · 长冲突链有自己的处理路径\u003c/h3>\n        \u003cdiv class=\"tagrow\">\u003cspan class=\"tinytag\">树化\u003c/span>\u003cspan class=\"tinytag\">OpenJDK 8u\u003c/span>\u003c/div>\n        \u003cp>普通 put 向已有 8 个节点的链追加新键时会尝试树化。桶数组长度不足 64 时先扩容，相同哈希值的键仍会留在同桶。\u003c/p>\n        \u003cbutton class=\"case-link\" data-openq=\"29\">看第 30 题 →\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"study-summary\" aria-label=\"答案库入口\">\n    \u003cdiv>\u003cstrong>5 个小节 · 69 道完整题解\u003c/strong>\u003cp>每题包含面试口述、原理、具体例子、易错点和关联追问。\u003c/p>\u003c/div>\n    \u003cdiv class=\"hub-actions\">\n      \u003cdiv>\u003cdiv class=\"progressline\">\u003cspan id=\"hubProgressFill\">\u003c/span>\u003c/div>\u003cdiv id=\"hubProgressText\" class=\"progress-caption\">已学 0 / 69\u003c/div>\u003c/div>\n      \u003cbutton class=\"primary-study\" id=\"hubOpenBtn\">进入答案库\u003c/button>\n    \u003c/div>\n  \u003c/section>\n\n  \u003cdiv class=\"workspace\" id=\"graphArea\">\n    \u003caside class=\"panel sidebar\" aria-label=\"学习路径\">\n      \u003cdiv>\u003ch2 class=\"section-cap\">按问题探索\u003c/h2>\u003cdiv class=\"routes\" id=\"routes\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"graph-legend\">\n        \u003ch2 class=\"section-cap\">关系线图例\u003c/h2>\n        \u003cdiv class=\"legendrow\">\u003cspan class=\"legline\" style=\"border-color:#547aab\">\u003c/span>基础依赖\u003c/div>\n        \u003cdiv class=\"legendrow\">\u003cspan class=\"legline\" style=\"border-color:#527796\">\u003c/span>实现关系\u003c/div>\n        \u003cdiv class=\"legendrow\">\u003cspan class=\"legline shared\">\u003c/span>共享原理\u003c/div>\n        \u003cdiv class=\"legendrow\">\u003cspan class=\"legline deep\">\u003c/span>深入追问\u003c/div>\n        \u003cdiv class=\"legendrow\">\u003cspan class=\"legline contrast\">\u003c/span>对比区别\u003c/div>\n        \u003cdiv class=\"legendrow\">\u003cspan class=\"legline apply\">\u003c/span>工程应用\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"help\">选择左侧的问题链，或用图上方的分类聚焦。点节点看相关题解，点关系线看两个知识点怎么连起来。\u003c/div>\n    \u003c/aside>\n    \u003cmain class=\"panel map-panel\" aria-label=\"知识关系图\">\n      \u003cdiv class=\"toolbar\">\n        \u003cstrong>知识关系图\u003c/strong>\n        \u003cbutton class=\"toolbtn\" id=\"expandBtn\">＋ 展开全部知识点\u003c/button>\n        \u003cbutton class=\"toolbtn\" id=\"resetBtn\">回到概览\u003c/button>\n        \u003cspan id=\"mapInfo\">全章概览\u003c/span>\n        \u003cdiv class=\"map-zoom\" role=\"group\" aria-label=\"图谱缩放\">\n          \u003cspan>缩放\u003c/span>\n          \u003cbutton type=\"button\" id=\"zoomOut\" title=\"缩小\" aria-label=\"缩小\">−\u003c/button>\n          \u003cbutton type=\"button\" id=\"zoomIn\" title=\"放大\" aria-label=\"放大\">+\u003c/button>\n          \u003cbutton type=\"button\" id=\"fitBtn\">适应视图\u003c/button>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"catnav\" id=\"catnav\" aria-label=\"知识分类\">\u003c/div>\n      \u003cdiv class=\"viewport\">\u003csvg id=\"map\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Java 集合知识关系图\">\u003c/svg>\u003c/div>\n      \u003cdiv class=\"map-footer\">\u003cspan id=\"shownStat\">—\u003c/span>\u003cspan>拖动画布平移 · 用按钮缩放 · 滚轮滚动页面\u003c/span>\u003c/div>\n    \u003c/main>\n    \u003caside class=\"panel detail\" id=\"detail\" aria-label=\"节点详情\">\u003c/aside>\n  \u003c/div>\n\n  \u003csection class=\"questions\" id=\"questionIndex\" aria-labelledby=\"indexTitle\">\n    \u003cdiv class=\"questions-header\">\n      \u003cdiv>\u003ch2 id=\"indexTitle\">原章题目索引 \u003cspan class=\"qcount\" id=\"indexCount\">\u003c/span>\u003c/h2>\n        \u003cp>沿用原章顺序。搜索可匹配题干、答案与代码中的关键词。\u003c/p>\u003c/div>\n      \u003cinput class=\"qsearch\" type=\"search\" id=\"qsearch\" placeholder=\"搜索 HashMap、树化、弱一致…\" aria-label=\"搜索原章问题\">\n    \u003c/div>\n    \u003cdiv class=\"qgroups\" id=\"qgroups\">\u003c/div>\n  \u003c/section>\n  \u003cfooter class=\"footer\">\n    \u003cspan>题目按 \u003ca href=\"https://xiaolincoding.com/interview/collections.html\" target=\"_blank\" rel=\"noopener\">小林 coding · Java 集合\u003c/a> 的原章顺序编排。接口约定参考 Java SE 21。涉及底层实现时注明 OpenJDK 版本。\u003c/span>\n    \u003cspan>\u003ca href=\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/package-summary.html\" target=\"_blank\" rel=\"noopener\">java.util\u003c/a> ·\n      \u003ca href=\"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/package-summary.html\" target=\"_blank\" rel=\"noopener\">java.util.concurrent\u003c/a> ·\n      \u003ca href=\"https://github.com/openjdk/jdk8u/blob/master/jdk/src/share/classes/java/util/HashMap.java\" target=\"_blank\" rel=\"noopener\">OpenJDK 8u HashMap\u003c/a>\u003c/span>\n    \u003cspan>离线单文件 HTML\u003c/span>\n  \u003c/footer>\n\u003c/div>\n\n\u003cdiv id=\"studyOverlay\" class=\"study-overlay\" hidden>\n  \u003cdiv class=\"study-sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"studyTitle\">\n    \u003cdiv class=\"study-top\">\n      \u003cdiv>\u003csmall>JAVA 集合 · 逐题精讲\u003c/small>\u003ch2 id=\"studyTitle\">69 道完整面试题解\u003c/h2>\u003c/div>\n      \u003cdiv class=\"study-toptools\">\n        \u003cselect id=\"mobileJump\" class=\"mobile-jump\" aria-label=\"跳转到任意题\">\u003c/select>\n        \u003cbutton id=\"openMapFromStudy\">在关系图定位\u003c/button>\n        \u003cbutton class=\"close-study\" id=\"closeStudy\" aria-label=\"关闭答案\">×\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"study-layout\">\n      \u003caside class=\"study-rail\">\n        \u003cdiv class=\"study-progress\">\n          \u003cstrong id=\"studyProgressText\">学习进度 0 / 69\u003c/strong>\n          \u003cp>已学状态保存在当前浏览器。\u003c/p>\n          \u003cdiv class=\"progressline\">\u003cspan id=\"studyProgressFill\">\u003c/span>\u003c/div>\n          \u003cinput id=\"studyFilter\" type=\"search\" placeholder=\"搜索题目或答案关键词\" aria-label=\"搜索题目或答案关键词\" autocomplete=\"off\">\n        \u003c/div>\n        \u003cdiv id=\"studyRailNav\" class=\"study-rail-nav\">\u003c/div>\n      \u003c/aside>\n      \u003carticle id=\"studyArticle\" class=\"study-article\" tabindex=\"-1\">\u003c/article>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\n'use strict';\nconst DATA = {\"source\":\"https://xiaolincoding.com/interview/collections.html\",\"chapters\":[\"概念\",\"List\",\"Set\",\"Map\",\"Queue\"],\"cats\":[{\"id\":\"contract\",\"label\":\"01 · 接口与契约\",\"color\":\"#3466b3\",\"desc\":\"类型、判等、遍历与共享\"},{\"id\":\"list\",\"label\":\"02 · List 与视图\",\"color\":\"#027b67\",\"desc\":\"下标访问、移动和别名\"},{\"id\":\"order\",\"label\":\"03 · Set 与顺序\",\"color\":\"#7054b8\",\"desc\":\"判重、插入顺序和排序\"},{\"id\":\"hash\",\"label\":\"04 · HashMap\",\"color\":\"#97591d\",\"desc\":\"桶定位、冲突、扩容与树化\"},{\"id\":\"concurrent\",\"label\":\"05 · 并发集合\",\"color\":\"#a94670\",\"desc\":\"可见性、原子更新和协作扩容\"},{\"id\":\"queue\",\"label\":\"06 · Queue 与等待\",\"color\":\"#316c91\",\"desc\":\"双端操作、优先级与背压\"}],\"nodes\":[{\"id\":\"interfaces\",\"cat\":\"contract\",\"title\":\"集合接口体系\",\"sub\":\"Collection · Map\",\"what\":\"List、Set 和 Queue 是 Collection 的不同分支。Map 以键值映射为抽象，另成一支。先按顺序、重复、查询和等待要求选接口。\",\"take\":\"先明确需要保证的语义，再选择数据结构和并发策略。\",\"core\":true},{\"id\":\"array\",\"cat\":\"contract\",\"title\":\"数组与集合\",\"sub\":\"固定长度 · 引用和原始值\",\"what\":\"数组长度固定，可存基本类型或引用。集合通过接口表达访问和修改能力，是否可增删由实现决定。\",\"take\":\"List 的下标访问和数组语法相似，时间成本由底层结构决定。\",\"core\":false},{\"id\":\"utilities\",\"cat\":\"contract\",\"title\":\"Collections 工具类\",\"sub\":\"算法 · 包装器\",\"what\":\"Collections 提供排序、查找、同步包装和不可修改包装等静态方法。Collection 是集合接口。\",\"take\":\"包装器的可见范围、并发保证与底层对象如何访问有关。\",\"core\":false},{\"id\":\"iter\",\"cat\":\"contract\",\"title\":\"迭代与遍历\",\"sub\":\"Iterator · Stream · 下标\",\"what\":\"集合遍历可用 Iterator、增强 for、forEach 或 Stream。随机访问列表也可按下标走。\",\"take\":\"边遍历边改时，先查当前 API 和实现的修改规则。\",\"core\":true},{\"id\":\"failfast\",\"cat\":\"contract\",\"title\":\"fail-fast 与迭代语义\",\"sub\":\"尽力检测 · 快照 · 弱一致\",\"what\":\"普通迭代器可检测部分结构修改。快照迭代固定数组版本，弱一致迭代允许并发更新并可能看到其中一些。\",\"take\":\"无 CME 不能作为并发安全或读到最新全量数据的证据。\",\"core\":true},{\"id\":\"equality\",\"cat\":\"contract\",\"title\":\"equals 与 hashCode\",\"sub\":\"键等价 · 稳定性\",\"what\":\"散列结构用哈希信息筛选候选，再用键相等确定命中。相等对象要有相同哈希码，参与比较的状态应保持稳定。\",\"take\":\"两次判定承担不同职责。相同 hashCode 仍需要判断相等。\",\"core\":true},{\"id\":\"list\",\"cat\":\"list\",\"title\":\"List 选型\",\"sub\":\"下标 · 可重复 · 实现\",\"what\":\"List 表达有位置的序列。数组、链表和写时复制实现对访问、修改、遍历与同步提供不同成本。\",\"take\":\"List 的接口约定位置语义，无法从接口推出 get 的复杂度。\",\"core\":false},{\"id\":\"arraylist\",\"cat\":\"list\",\"title\":\"ArrayList\",\"sub\":\"动态数组 · 随机访问\",\"what\":\"元素引用存在连续数组中，支持常数时间按下标读取。中间删除通常要搬移后面的元素。\",\"take\":\"删除成本由索引之后的元素数决定，尾删通常无需搬移。\",\"core\":true},{\"id\":\"list-grow\",\"cat\":\"list\",\"title\":\"ArrayList 扩容\",\"sub\":\"容量 · 搬迁 · 摊销\",\"what\":\"追加空间不足时分配更大的数组并复制元素引用。OpenJDK 常见增长量约为旧容量的一半，还要满足最低所需容量。\",\"take\":\"size 是实际元素数，capacity 是底层数组可用槽位数。\",\"core\":false},{\"id\":\"linkedlist\",\"cat\":\"list\",\"title\":\"LinkedList\",\"sub\":\"双向链表 · List + Deque\",\"what\":\"LinkedList 同时实现 List 和 Deque。已定位节点的插删可只改链，但按下标仍要先从一端走过去。\",\"take\":\"比较链表和数组时，把定位成本和内存局部性也算进去。\",\"core\":true},{\"id\":\"vector\",\"cat\":\"list\",\"title\":\"Vector\",\"sub\":\"遗留同步列表\",\"what\":\"Vector 是基于动态数组的历史实现，多个常用方法在实例上同步。它的单次方法保护不覆盖任意多步逻辑。\",\"take\":\"已有遗留 API 时仍会遇到 Vector。并发选型看实际读写比例。\",\"core\":false},{\"id\":\"views\",\"cat\":\"list\",\"title\":\"视图、包装与副本\",\"sub\":\"subList · asList · copyOf\",\"what\":\"视图借用原数据，更新可能互相可见。不可修改包装限制当前入口的修改，独立副本切断结构上的别名。\",\"take\":\"结构隔离和元素深拷贝是两件事。\",\"core\":true},{\"id\":\"boxing\",\"cat\":\"list\",\"title\":\"泛型与装箱\",\"sub\":\"List\\u003cInteger> · int[]\",\"what\":\"类型参数需要引用类型。int 可装箱为 Integer，int[] 整个数组本身也是一个引用对象。\",\"take\":\"Arrays.asList(intArray) 的元素是整个 int[]。\",\"core\":false},{\"id\":\"overload\",\"cat\":\"list\",\"title\":\"List.remove 重载\",\"sub\":\"int 下标 · Object 值\",\"what\":\"重载在编译期决定调用。int 参数匹配索引重载，Integer 参数通常匹配 Object 重载。\",\"take\":\"用 Integer.valueOf(value) 清楚表达按值删除。\",\"core\":false},{\"id\":\"set\",\"cat\":\"order\",\"title\":\"Set 的唯一性\",\"sub\":\"成员 · 等价 · 无下标\",\"what\":\"Set 表达元素唯一性。不同实现用不同底层结构判断是否存在等价元素。\",\"take\":\"用 Set 前先定义业务上的「同一个元素」。\",\"core\":true},{\"id\":\"hashset\",\"cat\":\"order\",\"title\":\"HashSet\",\"sub\":\"HashMap 的键集合\",\"what\":\"HashSet 以元素作为内部 HashMap 的键，借助哈希与 equals 判断重复。\",\"take\":\"对象入集合后尽量保持影响哈希和相等性的字段不变。\",\"core\":true},{\"id\":\"orderedset\",\"cat\":\"order\",\"title\":\"LinkedHashSet\",\"sub\":\"保留插入顺序\",\"what\":\"LinkedHashSet 在哈希判重之外维护插入顺序。普通 add 一个已有元素不会把它当新元素重新插入。\",\"take\":\"插入顺序取决于操作历史，可以与元素自然大小完全不同。\",\"core\":false},{\"id\":\"treeset\",\"cat\":\"order\",\"title\":\"TreeSet\",\"sub\":\"有序去重 · 范围查询\",\"what\":\"TreeSet 按自然顺序或 Comparator 组织元素，比较结果为 0 的两个元素在树里占同一个位置。\",\"take\":\"若希望同分对象都保留，应增加稳定的次排序键。\",\"core\":true},{\"id\":\"comparator\",\"cat\":\"order\",\"title\":\"比较器与排序等价\",\"sub\":\"compare(a,b) == 0\",\"what\":\"有序集合把比较为 0 视为同一排序键。为了遵循 Set/Map 的一般相等契约，通常应让比较结果与 equals 一致。\",\"take\":\"按分数排序时加入 ID 次键，能区分同分的不同对象。\",\"core\":false},{\"id\":\"treemap\",\"cat\":\"order\",\"title\":\"TreeMap\",\"sub\":\"红黑树 · NavigableMap\",\"what\":\"TreeMap 维护按键的全局排序，提供 floorKey、ceilingKey、subMap 等导航和范围操作。\",\"take\":\"查区间或邻近键时，树的有序性是核心价值。\",\"core\":true},{\"id\":\"linkedmap\",\"cat\":\"order\",\"title\":\"LinkedHashMap 与 LRU\",\"sub\":\"插入顺序 · 访问顺序\",\"what\":\"LinkedHashMap 在哈希定位之外维护跨桶双向链，可按插入或访问顺序遍历。访问序配合移除最旧条目可实现简单 LRU。\",\"take\":\"访问序下 get 可能重排链。并发访问应一起保护。\",\"core\":false},{\"id\":\"hash\",\"cat\":\"hash\",\"title\":\"HashMap 查找与写入\",\"sub\":\"哈希扰动 · 桶 · 判等\",\"what\":\"OpenJDK 8 的 HashMap 用数组定位桶，同桶再通过链表或树搜索。put 命中已有键时更新值，新键才增加映射数量。\",\"take\":\"把 get 和 put 分成定位桶、桶内查找、命中或新增三段。\",\"core\":true},{\"id\":\"mask\",\"cat\":\"hash\",\"title\":\"容量与位掩码\",\"sub\":\"(n−1) & hash\",\"what\":\"当容量是二的幂，n−1 的低位全为 1，位与就能取桶索引。高位扰动和二的幂容量是不同机制。\",\"take\":\"扩为两倍时只多使用一个索引位。\",\"core\":false},{\"id\":\"collision\",\"cat\":\"hash\",\"title\":\"哈希冲突\",\"sub\":\"拉链 · 开放寻址\",\"what\":\"两个键落在同一个槽位时，需要继续区分。拉链组织同桶节点，开放寻址在数组里按探测策略寻找候选位置。\",\"take\":\"相同桶索引、相同哈希值和相等键是三种不同关系。\",\"core\":true},{\"id\":\"treeify\",\"cat\":\"hash\",\"title\":\"树化与退化\",\"sub\":\"8 / 64 / 6 · 触发路径\",\"what\":\"OpenJDK 8 普通 put 向已有 8 个节点的链追加新键时尝试树化。容量不足 64 则优先扩容。树桶扩容分裂时，小分支可转回链表。\",\"take\":\"6 用于扩容拆分的计数条件，普通删除会检查树的结构。\",\"core\":true},{\"id\":\"rbtree\",\"cat\":\"hash\",\"title\":\"红黑树与 AVL\",\"sub\":\"平衡约束 · 更新代价\",\"what\":\"AVL 通常维持更严格的高度平衡。红黑树允许较宽的高度差，适合在读和结构更新之间折中。\",\"take\":\"树高受限并不保证同哈希、不可比较键每次查找都只沿单支搜索。\",\"core\":false},{\"id\":\"threshold\",\"cat\":\"hash\",\"title\":\"负载因子与容量预算\",\"sub\":\"size · capacity · threshold\",\"what\":\"负载因子平衡占用空间和冲突概率。按默认 0.75 预算容量时，还要考虑实际容量会向上取二的幂。\",\"take\":\"区分首次建表、阈值扩容和冲突桶触发的扩容。\",\"core\":true},{\"id\":\"hash-resize\",\"cat\":\"hash\",\"title\":\"HashMap 扩容\",\"sub\":\"低位组 · 高位组\",\"what\":\"OpenJDK 8 常见扩容路径将容量翻倍。旧桶按新增索引位拆分，节点留在原下标或移到原下标加旧容量。\",\"take\":\"节点已缓存哈希信息，拆分时无需再调用每个键的 hashCode。\",\"core\":false},{\"id\":\"nulls\",\"cat\":\"hash\",\"title\":\"HashMap 的 null\",\"sub\":\"允许空映射 · containsKey\",\"what\":\"HashMap 允许一个 null 键和多个 null 值。get 返回 null 可表示无映射，也可表示已有映射值为 null。\",\"take\":\"在没有并发修改的前提下，可用 containsKey 区分两种情况。\",\"core\":false},{\"id\":\"mapviews\",\"cat\":\"hash\",\"title\":\"Map 的三个活视图\",\"sub\":\"entrySet · keySet · values\",\"what\":\"Map 的集合视图通常跟随底层映射变化。若同时需要键和值，直接遍历 entrySet 能省去按键重复查找。\",\"take\":\"想长期保存独立的键值关系时，显式复制映射，并区分元素本身的可变性。\",\"core\":false},{\"id\":\"hash-race\",\"cat\":\"hash\",\"title\":\"HashMap 并发读写\",\"sub\":\"丢更新 · 可见性 · 旧实现\",\"what\":\"HashMap 的读写没有内部同步。并发写可能丢映射、破坏统计或使读观察到不一致状态。旧版迁移环链是特定版本的实现问题。\",\"take\":\"只读共享需要安全发布，读写共享需要合适的同步或并发实现。\",\"core\":false},{\"id\":\"sync\",\"cat\":\"concurrent\",\"title\":\"同步包装与并发选型\",\"sub\":\"锁边界 · 复合操作\",\"what\":\"同步包装器在同一把锁下保护单次操作。写时复制、并发哈希表和阻塞队列分别服务不同的读写模式。\",\"take\":\"线程安全要按操作边界理解，遍历、复合更新、跨键不变量要另看。\",\"core\":true},{\"id\":\"list-race\",\"cat\":\"concurrent\",\"title\":\"ArrayList 的写入竞争\",\"sub\":\"检查容量 · 写槽位 · 更新 size\",\"what\":\"追加涉及多个共享状态步骤。没有同步时，两个线程可能同时选中同一位置，也可能观察到不协调的数组和大小。\",\"take\":\"即使不触发扩容，追加也可能丢失元素。\",\"core\":false},{\"id\":\"cow\",\"cat\":\"concurrent\",\"title\":\"CopyOnWriteArrayList\",\"sub\":\"串行写 · 快照读\",\"what\":\"更新按实现的锁串行化，并发布一个新数组版本。迭代器保留创建时的数组引用，后续结构更新不进入本轮遍历。\",\"take\":\"读多写少适合，频繁写要计入复制和旧快照的内存成本。\",\"core\":true},{\"id\":\"table\",\"cat\":\"concurrent\",\"title\":\"Hashtable\",\"sub\":\"链表桶 · 整实例监视器\",\"what\":\"经典 Hashtable 按哈希值取模定位单链表桶。常用读写用同一实例监视器，历史接口还包含 Enumeration。\",\"take\":\"单个方法同步不等于跨方法的原子性。\",\"core\":false},{\"id\":\"chm\",\"cat\":\"concurrent\",\"title\":\"ConcurrentHashMap\",\"sub\":\"CAS · 桶同步 · 弱一致\",\"what\":\"JDK 7 按 Segment 分锁。JDK 8 起以桶为主要写竞争边界，结合 CAS、同步和并发迁移。普通读通常无须获取桶监视器。\",\"take\":\"先讲版本，再分别讲空桶、非空桶、读取和扩容。\",\"core\":true},{\"id\":\"publish\",\"cat\":\"concurrent\",\"title\":\"并发读的可见性\",\"sub\":\"volatile · 节点发布\",\"what\":\"现代 ConcurrentHashMap 用具有相应内存语义的表槽读取和节点字段访问来观察已发布的值。碰到转发节点时可继续查新表。\",\"take\":\"读路径通常不加桶锁，仍然依赖发布和可见性规则。\",\"core\":false},{\"id\":\"transfer\",\"cat\":\"concurrent\",\"title\":\"并发扩容\",\"sub\":\"ForwardingNode · 分段迁移\",\"what\":\"扩容线程协作领取迁移区间。完成迁移的旧桶放入转发节点，读可定位到新表，部分写线程也可协助迁移。\",\"take\":\"旧表和新表可以共存，协调发生在被迁移的桶与全局控制状态。\",\"core\":false},{\"id\":\"chm-null\",\"cat\":\"concurrent\",\"title\":\"并发映射的空值契约\",\"sub\":\"null 表示无结果\",\"what\":\"ConcurrentHashMap 禁止 null 键和值。get 的 null 有明确的未找到含义，并可用于原子更新 API 的缺省、移除或不插入语义。\",\"take\":\"并发时用另一次 containsKey 无法还原前一次 get 的观察点。\",\"core\":false},{\"id\":\"atomic\",\"cat\":\"concurrent\",\"title\":\"按键原子更新\",\"sub\":\"putIfAbsent · compute · merge\",\"what\":\"独立 get 和 put 中间可被其他线程插入操作。并发映射为同一键提供条件插入或计算更新等组合 API。\",\"take\":\"按键原子性不覆盖跨键不变量，也不保护映射值的内部状态。\",\"core\":true},{\"id\":\"counts\",\"cat\":\"concurrent\",\"title\":\"并发 size 统计\",\"sub\":\"baseCount · CounterCell\",\"what\":\"OpenJDK 8 以基础计数配合分散计数单元降低写热点，读取时汇总。并发更新时所得结果只反映一个瞬时观测。\",\"take\":\"size 适合监控，容量配额或关停判定需要独立的同步条件。\",\"core\":false},{\"id\":\"segment\",\"cat\":\"concurrent\",\"title\":\"JDK 7 Segment\",\"sub\":\"ReentrantLock · 锁分段\",\"what\":\"旧版 ConcurrentHashMap 用散列高位定位 Segment，Segment 维护局部哈希表并以可重入锁保护更新。\",\"take\":\"现代实现的桶监视器与旧版固定分段锁是两代设计。\",\"core\":false},{\"id\":\"cas\",\"cat\":\"concurrent\",\"title\":\"CAS 与 synchronized\",\"sub\":\"单位置安装 · 桶内更新\",\"what\":\"空桶可用 CAS 尝试安装节点。已有链表或树时，桶内更新需要协调多个判断和结构步骤，常用同步处理。\",\"take\":\"CAS 和加锁用于不同操作粒度。写冲突仍可能重试或等待。\",\"core\":false},{\"id\":\"deque\",\"cat\":\"queue\",\"title\":\"Queue 与 Deque\",\"sub\":\"头尾 · FIFO · 栈\",\"what\":\"Queue 提供队头操作，Deque 增加两端。ArrayDeque 可用头尾表达 FIFO，也可在同端实现 LIFO。\",\"take\":\"看清失败语义。poll、peek 可用 null 表达空队列。\",\"core\":true},{\"id\":\"heap\",\"cat\":\"queue\",\"title\":\"PriorityQueue 与二叉堆\",\"sub\":\"堆顶优先 · 遍历无序\",\"what\":\"优先队列维护父子顺序，保证队头优先。整体没有排序，反复 poll 才按比较器顺序取出。\",\"take\":\"同优先级的稳定顺序需要明确写进比较器。\",\"core\":true},{\"id\":\"blocking\",\"cat\":\"queue\",\"title\":\"BlockingQueue 与背压\",\"sub\":\"put / take · 容量 · 条件\",\"what\":\"阻塞队列协调生产和消费。以有界数组队列为例，生产者在满时等待，消费者在空时等待。\",\"take\":\"先选容量和满队列策略，再比较具体实现。\",\"core\":true}],\"edges\":[{\"a\":\"array\",\"b\":\"interfaces\",\"kind\":\"对比区别\",\"why\":\"数组提供固定长度和原始类型存储。集合接口另行描述是否允许重复、是否保序以及哪些修改受支持。\"},{\"a\":\"interfaces\",\"b\":\"utilities\",\"kind\":\"对比区别\",\"why\":\"Collection 描述对象能做什么。Collections 的静态方法对现有容器排序、查找或包装。\"},{\"a\":\"interfaces\",\"b\":\"iter\",\"kind\":\"基础依赖\",\"why\":\"Collection 继承 Iterable，因此元素集合可直接用于增强 for。Map 可通过 entrySet 等视图遍历。\"},{\"a\":\"interfaces\",\"b\":\"list\",\"kind\":\"实现关系\",\"why\":\"List 在 Collection 的基础上加入位置和按下标访问的契约。\"},{\"a\":\"interfaces\",\"b\":\"set\",\"kind\":\"实现关系\",\"why\":\"Set 在 Collection 的基础上规定元素唯一性。\"},{\"a\":\"interfaces\",\"b\":\"deque\",\"kind\":\"实现关系\",\"why\":\"Queue 增加入队和队头语义。Deque 扩展到两端。\"},{\"a\":\"interfaces\",\"b\":\"hash\",\"kind\":\"实现关系\",\"why\":\"HashMap 实现的是 Map 的键值映射契约，并用散列结构选择候选位置。\"},{\"a\":\"utilities\",\"b\":\"views\",\"kind\":\"实现关系\",\"why\":\"Collections.unmodifiableList 包装原列表。底层有其他别名时，仍可通过这些别名更新。\"},{\"a\":\"utilities\",\"b\":\"sync\",\"kind\":\"实现关系\",\"why\":\"Collections.synchronizedList 等把对底层集合的访问放在一个同步包装器后。\"},{\"a\":\"iter\",\"b\":\"failfast\",\"kind\":\"深入追问\",\"why\":\"迭代器可比较预期修改计数与当前修改计数，尽力发现迭代协议外的结构变化。\"},{\"a\":\"iter\",\"b\":\"linkedlist\",\"kind\":\"工程应用\",\"why\":\"逐个调用 LinkedList.get(i) 反复从端点定位。迭代器沿节点链前进，适合完整遍历。\"},{\"a\":\"iter\",\"b\":\"mapviews\",\"kind\":\"工程应用\",\"why\":\"遍历 entrySet 可直接同时取键和值，避免对每个键再调用 get。\"},{\"a\":\"failfast\",\"b\":\"views\",\"kind\":\"共享原理\",\"why\":\"ArrayList 的子列表共享底层列表。通过视图外的路径结构修改，可能破坏视图和迭代器的预期状态。\"},{\"a\":\"failfast\",\"b\":\"cow\",\"kind\":\"对比区别\",\"why\":\"普通 ArrayList 迭代器尽力检测结构改动。写时复制迭代器读原数组快照。\"},{\"a\":\"failfast\",\"b\":\"chm\",\"kind\":\"对比区别\",\"why\":\"ConcurrentHashMap 遍历允许与更新并行，可能观察到部分变化，无需依赖修改检测来退出。\"},{\"a\":\"list\",\"b\":\"arraylist\",\"kind\":\"实现关系\",\"why\":\"ArrayList 用连续数组保存序列，支持常数时间随机访问。\"},{\"a\":\"list\",\"b\":\"linkedlist\",\"kind\":\"实现关系\",\"why\":\"LinkedList 用节点维护序列和两端，按下标访问要先遍历定位。\"},{\"a\":\"list\",\"b\":\"vector\",\"kind\":\"实现关系\",\"why\":\"Vector 与 ArrayList 都是数组列表，Vector 的常用方法增加实例同步。\"},{\"a\":\"list\",\"b\":\"boxing\",\"kind\":\"基础依赖\",\"why\":\"List\\u003cE> 的类型参数必须是引用类型。保存整数可使用 Integer，也可按需求保留 int[]。\"},{\"a\":\"list\",\"b\":\"overload\",\"kind\":\"深入追问\",\"why\":\"List 同时提供按下标和按对象删除。实参静态类型决定重载选择。\"},{\"a\":\"array\",\"b\":\"arraylist\",\"kind\":\"共享原理\",\"why\":\"ArrayList 的随机访问仍依赖底层数组下标。动态大小由重新分配和复制实现。\"},{\"a\":\"array\",\"b\":\"views\",\"kind\":\"工程应用\",\"why\":\"Arrays.asList 从引用数组创建固定大小视图，数组和列表可以通过彼此看到元素替换。\"},{\"a\":\"boxing\",\"b\":\"views\",\"kind\":\"深入追问\",\"why\":\"对 int[] 调用可变参数版本的 asList，会把整个数组当作一个引用元素。\"},{\"a\":\"arraylist\",\"b\":\"linkedlist\",\"kind\":\"对比区别\",\"why\":\"数组列表的中部增删要搬移，但定位快。链表已定位时改链成本低，按下标找节点可能更贵。\"},{\"a\":\"arraylist\",\"b\":\"list-grow\",\"kind\":\"实现关系\",\"why\":\"追加遇到底层数组空间不足，增长后要把旧的元素引用复制过去。\"},{\"a\":\"arraylist\",\"b\":\"views\",\"kind\":\"工程应用\",\"why\":\"ArrayList.subList 跟随原列表的一段区间，可通过 new ArrayList\\u003c>(view) 分离结构。\"},{\"a\":\"arraylist\",\"b\":\"list-race\",\"kind\":\"深入追问\",\"why\":\"底层数组和 size 属于不同共享状态。没有锁时两个线程可能选中同一个写槽位。\"},{\"a\":\"list-grow\",\"b\":\"list-race\",\"kind\":\"深入追问\",\"why\":\"同时追加并扩容时，数组替换与元素写入还可能落在不同数组版本上。\"},{\"a\":\"list-race\",\"b\":\"sync\",\"kind\":\"工程应用\",\"why\":\"同步包装或显式锁能把追加的容量检查、写入和更新大小保护在同一个边界中。\"},{\"a\":\"vector\",\"b\":\"sync\",\"kind\":\"共享原理\",\"why\":\"Vector 的方法级同步与同步包装一样，都需要额外考虑多方法组合与遍历。\"},{\"a\":\"sync\",\"b\":\"cow\",\"kind\":\"对比区别\",\"why\":\"同步列表用同一把锁协调操作。写时复制把成本集中到修改和快照占用。\"},{\"a\":\"set\",\"b\":\"hashset\",\"kind\":\"实现关系\",\"why\":\"HashSet 用哈希表的键唯一性落实元素唯一性。\"},{\"a\":\"set\",\"b\":\"orderedset\",\"kind\":\"实现关系\",\"why\":\"LinkedHashSet 在唯一性之外加上可预测的插入顺序。\"},{\"a\":\"set\",\"b\":\"treeset\",\"kind\":\"实现关系\",\"why\":\"TreeSet 在唯一性之外维护比较器顺序，支持有序范围操作。\"},{\"a\":\"equality\",\"b\":\"hashset\",\"kind\":\"基础依赖\",\"why\":\"两个业务上相等的对象必须有相同哈希码，否则哈希去重可能在到达 equals 前就失败。\"},{\"a\":\"equality\",\"b\":\"hash\",\"kind\":\"基础依赖\",\"why\":\"哈希码筛选候选桶和节点，equals 判定候选键是否匹配。键状态改变后可能再也定位不到旧条目。\"},{\"a\":\"equality\",\"b\":\"comparator\",\"kind\":\"对比区别\",\"why\":\"哈希结构以 equals 为相等基准，有序结构以 compare 返回 0 确定键位置。\"},{\"a\":\"comparator\",\"b\":\"treeset\",\"kind\":\"基础依赖\",\"why\":\"TreeSet 用比较结果决定分支。只比较分数会把同分元素定位到同一个排序键。\"},{\"a\":\"comparator\",\"b\":\"treemap\",\"kind\":\"基础依赖\",\"why\":\"TreeMap 同样依赖比较结果区分键。比较结果为 0 时 put 可能更新旧条目。\"},{\"a\":\"treemap\",\"b\":\"treeset\",\"kind\":\"实现关系\",\"why\":\"TreeSet 默认借助 TreeMap 的排序与范围查找，集合元素对应映射键。\"},{\"a\":\"hashset\",\"b\":\"hash\",\"kind\":\"实现关系\",\"why\":\"HashSet 添加元素时把元素作为 HashMap 的键，内部占位值不承担业务含义。\"},{\"a\":\"hashset\",\"b\":\"orderedset\",\"kind\":\"对比区别\",\"why\":\"HashSet 遍历顺序未指定。LinkedHashSet 加一条顺序链，常规遍历按插入顺序。\"},{\"a\":\"orderedset\",\"b\":\"linkedmap\",\"kind\":\"共享原理\",\"why\":\"LinkedHashSet 借助有顺序链的哈希映射保序。LinkedHashMap 还可切换为访问序。\"},{\"a\":\"treemap\",\"b\":\"linkedmap\",\"kind\":\"对比区别\",\"why\":\"TreeMap 按键比较结果维护全局顺序，LinkedHashMap 按插入或访问历史维护顺序。\"},{\"a\":\"treemap\",\"b\":\"hash\",\"kind\":\"对比区别\",\"why\":\"TreeMap 维护全局树，可做范围查询。HashMap 只在必要的冲突桶内树化，桶间不按键排序。\"},{\"a\":\"hash\",\"b\":\"mask\",\"kind\":\"实现关系\",\"why\":\"二的幂容量使 (n−1) & hash 可以定位数组桶。扰动改善高位信息进入低位的机会。\"},{\"a\":\"hash\",\"b\":\"collision\",\"kind\":\"基础依赖\",\"why\":\"有限数量的桶会出现冲突。桶内的链表或树用于继续区分候选键。\"},{\"a\":\"collision\",\"b\":\"treeify\",\"kind\":\"深入追问\",\"why\":\"长链会增加查找代价。在容量足够的情况下，转换为树有助于约束桶结构高度。\"},{\"a\":\"treeify\",\"b\":\"rbtree\",\"kind\":\"实现关系\",\"why\":\"长冲突链转为红黑树。其平衡规则和比较路径共同决定实际查询与更新代价。\"},{\"a\":\"treeify\",\"b\":\"hash-resize\",\"kind\":\"共享原理\",\"why\":\"容量不足 64 时，树化入口先尝试扩容。已经树化的桶在扩容时可按新增位分裂并退回链表。\"},{\"a\":\"mask\",\"b\":\"hash-resize\",\"kind\":\"基础依赖\",\"why\":\"容量翻倍后索引掩码只新增一位。节点依据 hash & oldCap 留在原桶或移到高位桶。\"},{\"a\":\"threshold\",\"b\":\"hash-resize\",\"kind\":\"基础依赖\",\"why\":\"常规 put 新键后若 size 超过阈值就触发扩容，分配的容量还受二的幂与上限约束。\"},{\"a\":\"hash\",\"b\":\"threshold\",\"kind\":\"深入追问\",\"why\":\"预计放入 20 个键时要算真实桶数组长度和阈值，不能只看构造器参数。\"},{\"a\":\"hash\",\"b\":\"nulls\",\"kind\":\"实现关系\",\"why\":\"null 键走实现定义的哈希位置。null 值与无映射需要按 Map 约定区分。\"},{\"a\":\"hash\",\"b\":\"linkedmap\",\"kind\":\"共享原理\",\"why\":\"LinkedHashMap 继承散列定位，并额外维护跨桶顺序链，常见用途是按访问序淘汰。\"},{\"a\":\"hash\",\"b\":\"mapviews\",\"kind\":\"工程应用\",\"why\":\"HashMap 的三个视图由原表支持。通过视图删除条目通常会修改原映射。\"},{\"a\":\"views\",\"b\":\"mapviews\",\"kind\":\"共享原理\",\"why\":\"List 的区间视图和 Map 的集合视图都保留与原容器的连接，支持的修改操作各有约定。\"},{\"a\":\"hash\",\"b\":\"hash-race\",\"kind\":\"深入追问\",\"why\":\"定位、查重、链接和统计没有并发保护，多线程写同一普通 HashMap 会发生竞态。\"},{\"a\":\"hash-resize\",\"b\":\"hash-race\",\"kind\":\"深入追问\",\"why\":\"扩容改变桶数组和链关系。未同步的读写可能观察到不一致的迁移状态。\"},{\"a\":\"hash-race\",\"b\":\"sync\",\"kind\":\"工程应用\",\"why\":\"共享可写映射可采用适用的并发集合或统一外部锁。安全发布只读表是另一种访问模型。\"},{\"a\":\"hash-race\",\"b\":\"chm\",\"kind\":\"工程应用\",\"why\":\"ConcurrentHashMap 提供并发读写语义，常用更新 API 可消除分开的 get 和 put 之间的竞争窗口。\"},{\"a\":\"sync\",\"b\":\"table\",\"kind\":\"共享原理\",\"why\":\"Hashtable 的常用方法在实例监视器上同步，不同键操作也可能竞争同一把锁。\"},{\"a\":\"table\",\"b\":\"chm\",\"kind\":\"对比区别\",\"why\":\"Hashtable 主要用整表实例锁。现代 ConcurrentHashMap 区分读、空桶、非空桶和扩容。\"},{\"a\":\"hash\",\"b\":\"table\",\"kind\":\"对比区别\",\"why\":\"经典 Hashtable 用取模和链表桶。OpenJDK 8 HashMap 使用位掩码，并可将长桶链树化。\"},{\"a\":\"chm\",\"b\":\"publish\",\"kind\":\"实现关系\",\"why\":\"并发哈希表通过表槽与节点的内存可见性语义读取已发布的映射，普通 get 通常无需获取桶锁。\"},{\"a\":\"chm\",\"b\":\"cas\",\"kind\":\"实现关系\",\"why\":\"空桶写入可通过 CAS 安装，非空桶通常需要同步处理节点查重和插入。\"},{\"a\":\"chm\",\"b\":\"segment\",\"kind\":\"对比区别\",\"why\":\"JDK 7 的写竞争粒度是 Segment。JDK 8 的主要路径换成以桶为单位协调。\"},{\"a\":\"hash-resize\",\"b\":\"transfer\",\"kind\":\"共享原理\",\"why\":\"两者均可利用容量翻倍带来的新增索引位。并发版本还需协调迁移参与者与转发。\"},{\"a\":\"chm\",\"b\":\"transfer\",\"kind\":\"实现关系\",\"why\":\"多个线程可分领区间迁移。旧桶迁移完成后，ForwardingNode 将后续访问引到新表。\"},{\"a\":\"transfer\",\"b\":\"publish\",\"kind\":\"深入追问\",\"why\":\"get 遇到旧表转发节点可以查新表。尚未迁移的桶仍可沿相应路径查旧节点。\"},{\"a\":\"nulls\",\"b\":\"chm-null\",\"kind\":\"对比区别\",\"why\":\"HashMap 允许显式 null 映射。ConcurrentHashMap 保持 null 的未命中语义，避免第二次查询引入竞态。\"},{\"a\":\"chm\",\"b\":\"chm-null\",\"kind\":\"基础依赖\",\"why\":\"ConcurrentHashMap 明确拒绝 null 键和值。缺失和删除可通过约定的空返回值表达。\"},{\"a\":\"chm-null\",\"b\":\"atomic\",\"kind\":\"共享原理\",\"why\":\"compute 的 null 可表示删除或不建立映射。禁止存储 null 值让这个结果具有明确含义。\"},{\"a\":\"chm\",\"b\":\"atomic\",\"kind\":\"工程应用\",\"why\":\"使用按键原子更新 API 避免先查后写之间被其他线程修改。\"},{\"a\":\"chm\",\"b\":\"counts\",\"kind\":\"实现关系\",\"why\":\"基础计数和多个计数单元分担更新竞争，size 在读取时对它们求和。\"},{\"a\":\"counts\",\"b\":\"atomic\",\"kind\":\"对比区别\",\"why\":\"单键更新可原子完成。size 聚合多个位置，不能作为跨线程检查后执行的事务条件。\"},{\"a\":\"linkedlist\",\"b\":\"deque\",\"kind\":\"实现关系\",\"why\":\"LinkedList 同时提供 List 和 Deque 接口。操作两端无需先按下标定位。\"},{\"a\":\"deque\",\"b\":\"heap\",\"kind\":\"对比区别\",\"why\":\"双端队列按指定端处理元素。PriorityQueue 按比较器决定应优先出队的元素。\"},{\"a\":\"comparator\",\"b\":\"heap\",\"kind\":\"基础依赖\",\"why\":\"堆以比较器决定堆顶，比较为 0 不会像 TreeSet 那样去重。\"},{\"a\":\"deque\",\"b\":\"blocking\",\"kind\":\"对比区别\",\"why\":\"普通队列用立即返回或异常报告失败，BlockingQueue 另提供等待和限时方法。\"},{\"a\":\"heap\",\"b\":\"blocking\",\"kind\":\"工程应用\",\"why\":\"PriorityBlockingQueue 允许并发按优先级取元素，其逻辑无界，限制积压需要单独设计。\"},{\"a\":\"sync\",\"b\":\"blocking\",\"kind\":\"工程应用\",\"why\":\"生产消费需要协调空间和元素可用性，阻塞队列把等待与状态变化封装为一个操作。\"}],\"routes\":[{\"id\":\"all\",\"icon\":\"◎\",\"title\":\"全章概览\",\"desc\":\"从容器契约到散列、并发和队列\",\"nodes\":[]},{\"id\":\"list\",\"icon\":\"01\",\"title\":\"List 为什么有不同成本？\",\"desc\":\"定位、搬移、扩容和遍历\",\"nodes\":[\"list\",\"array\",\"arraylist\",\"linkedlist\",\"list-grow\",\"vector\",\"iter\"]},{\"id\":\"views\",\"icon\":\"02\",\"title\":\"改了这份，原集合会变吗？\",\"desc\":\"数组视图、子列表、Map 视图\",\"nodes\":[\"array\",\"views\",\"utilities\",\"boxing\",\"iter\",\"mapviews\",\"failfast\"]},{\"id\":\"equal\",\"icon\":\"03\",\"title\":\"两个元素怎么算相同？\",\"desc\":\"哈希判等、比较器和顺序\",\"nodes\":[\"equality\",\"hashset\",\"hash\",\"set\",\"orderedset\",\"treeset\",\"treemap\",\"comparator\",\"linkedmap\"]},{\"id\":\"hash\",\"icon\":\"04\",\"title\":\"HashMap 怎样找到一个键？\",\"desc\":\"桶定位、冲突、树化、扩容\",\"nodes\":[\"hash\",\"equality\",\"mask\",\"collision\",\"treeify\",\"rbtree\",\"threshold\",\"hash-resize\",\"nulls\"]},{\"id\":\"concurrent\",\"icon\":\"05\",\"title\":\"共享 Map 怎样并发读写？\",\"desc\":\"可见性、CAS、桶锁和迁移\",\"nodes\":[\"chm\",\"hash-race\",\"sync\",\"table\",\"segment\",\"cas\",\"publish\",\"transfer\",\"chm-null\",\"counts\",\"atomic\"]},{\"id\":\"iter\",\"icon\":\"06\",\"title\":\"边遍历边更新会发生什么？\",\"desc\":\"快速失败、快照、弱一致\",\"nodes\":[\"iter\",\"failfast\",\"views\",\"cow\",\"chm\",\"sync\",\"list-race\",\"arraylist\"]},{\"id\":\"queue\",\"icon\":\"07\",\"title\":\"任务按什么顺序出队？\",\"desc\":\"双端、堆、阻塞和背压\",\"nodes\":[\"deque\",\"heap\",\"blocking\",\"comparator\",\"linkedlist\",\"sync\"]}],\"questions\":[{\"n\":1,\"title\":\"数组与集合在容量、元素类型和访问方式上有什么差别？\",\"short\":\"数组一经创建，长度就固定，既能保存基本类型值也能保存引用。集合通过接口表达访问和组织方式，泛型元素类型使用引用类型。能否扩容、增删、按位置访问，以及操作成本，取决于集合的契约和实现。\",\"details\":[\"数组用整数下标定位，长度由 length 字段给出。常见可变集合可以增减元素，通过 size() 查询实际元素数。ArrayList 即使内部扩容，也只是分配并替换底层数组。\",\"int[] 直接存 int。List\\u003
